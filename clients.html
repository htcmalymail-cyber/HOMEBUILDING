<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Заказ такси — Клиент</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            background: #f0f4f8;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.08);
        }

        /* ===== HEADER ===== */
        .header {
            background: #1a2639;
            color: white;
            padding: 18px 20px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header h1 i {
            color: #facc15;
            margin-right: 8px;
        }
        .header .wallet-badge {
            background: rgba(255,255,255,0.15);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .wallet-badge i {
            color: #4ade80;
        }

        /* ===== КАРТА ===== */
        #map {
            flex: 1;
            width: 100%;
            min-height: 250px;
            background: #dce3ed;
            z-index: 1;
        }

        /* ===== ПАНЕЛЬ УПРАВЛЕНИЯ ===== */
        .control-panel {
            background: white;
            padding: 18px 18px 28px;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.10);
            z-index: 10;
            flex-shrink: 0;
            max-height: 58vh;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .panel-title i {
            color: #2563eb;
        }

        /* Адресные поля */
        .address-group {
            margin-bottom: 12px;
        }
        .address-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .address-input {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 0 14px;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .address-input:focus-within {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 4px rgba(37,99,235,0.08);
        }
        .address-input i {
            color: #94a3b8;
            width: 20px;
            font-size: 15px;
        }
        .address-input input {
            border: none;
            background: transparent;
            padding: 13px 10px;
            width: 100%;
            font-size: 15px;
            outline: none;
            color: #0f172a;
        }
        .address-input input::placeholder {
            color: #94a3b8;
        }
        .address-input .geo-btn {
            background: none;
            border: none;
            color: #3b82f6;
            cursor: pointer;
            font-size: 18px;
            padding: 6px;
            transition: 0.2s;
        }
        .address-input .geo-btn:hover {
            color: #1d4ed8;
            transform: scale(1.1);
        }

        .swap-row {
            display: flex;
            justify-content: center;
            margin: 6px 0 12px;
        }
        .swap-btn {
            background: #f1f5f9;
            border: none;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .swap-btn:hover {
            background: #e2e8f0;
            transform: scale(1.02);
        }

        /* Информация о поездке */
        .trip-info {
            background: #f8fafc;
            border-radius: 14px;
            padding: 14px 16px;
            margin: 14px 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e2e8f0;
        }
        .trip-info .distance {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #475569;
            font-size: 14px;
        }
        .trip-info .distance span {
            font-weight: 700;
            color: #0f172a;
            font-size: 18px;
        }
        .trip-info .price {
            font-size: 22px;
            font-weight: 800;
            color: #16a34a;
        }
        .trip-info .price small {
            font-size: 14px;
            font-weight: 400;
            color: #64748b;
        }

        /* Кнопки */
        .action-buttons {
            display: flex;
            gap: 12px;
        }
        .btn-primary {
            flex: 1;
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary:hover {
            background: #1d4ed8;
            transform: scale(1.01);
        }
        .btn-primary:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #1e293b;
            border: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }

        /* Статус */
        .status-msg {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: #475569;
            padding: 8px;
            border-radius: 10px;
            background: #f1f5f9;
            display: none;
        }
        .status-msg.active {
            display: block;
        }
        .status-msg.success {
            background: #dcfce7;
            color: #166534;
        }
        .status-msg.error {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Scroll */
        .control-panel::-webkit-scrollbar {
            width: 4px;
        }
        .control-panel::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 480px) {
            .header h1 { font-size: 17px; }
            .header .wallet-badge { font-size: 12px; padding: 4px 12px; }
            .trip-info .price { font-size: 19px; }
        }
    </style>
</head>
<body>

<div class="app">

    <!-- ===== HEADER ===== -->
    <div class="header">
        <h1><i class="fas fa-taxi"></i> Такси</h1>
        <div class="wallet-badge">
            <i class="fas fa-wallet"></i>
            <span id="walletDisplay">0 ₪</span>
        </div>
    </div>

    <!-- ===== КАРТА ===== -->
    <div id="map"></div>

    <!-- ===== ПАНЕЛЬ УПРАВЛЕНИЯ ===== -->
    <div class="control-panel">

        <div class="panel-title">
            <i class="fas fa-route"></i> Куда едем?
        </div>

        <!-- Откуда -->
        <div class="address-group">
            <label><i class="fas fa-circle" style="color: #22c55e; font-size: 10px;"></i> Откуда</label>
            <div class="address-input">
                <i class="fas fa-location-dot"></i>
                <input type="text" id="fromInput" placeholder="Ваше местоположение" />
                <button class="geo-btn" id="geoFromBtn" title="Определить геопозицию">
                    <i class="fas fa-crosshairs"></i>
                </button>
            </div>
        </div>

        <!-- Кнопка Swap -->
        <div class="swap-row">
            <button class="swap-btn" id="swapBtn">
                <i class="fas fa-arrow-up-arrow-down"></i> Поменять
            </button>
        </div>

        <!-- Куда -->
        <div class="address-group">
            <label><i class="fas fa-flag-checkered" style="color: #ef4444; font-size: 10px;"></i> Куда</label>
            <div class="address-input">
                <i class="fas fa-location-dot"></i>
                <input type="text" id="toInput" placeholder="Введите адрес назначения" />
            </div>
        </div>

        <!-- Информация о поездке -->
        <div class="trip-info" id="tripInfo" style="display: none;">
            <div class="distance">
                <i class="fas fa-road"></i>
                <span id="distanceDisplay">0</span> км
            </div>
            <div class="price">
                <span id="priceDisplay">0</span> <small>₪</small>
            </div>
        </div>

        <!-- Кнопки -->
        <div class="action-buttons">
            <button class="btn-primary" id="buildRouteBtn">
                <i class="fas fa-map"></i> Построить маршрут
            </button>
            <button class="btn-secondary" id="clearRouteBtn">
                <i class="fas fa-eraser"></i>
            </button>
        </div>

        <!-- Статус -->
        <div class="status-msg" id="statusMsg"></div>
    </div>

</div>

<script>
    // ============================================================
    // 1. ИНИЦИАЛИЗАЦИЯ КАРТЫ
    // ============================================================
    const map = L.map('map').setView([32.0853, 34.7818], 13); // Тель-Авив

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
    }).addTo(map);

    // Маркеры
    let fromMarker = null;
    let toMarker = null;
    let routeLayer = null;
    let currentRoute = null; // храним координаты маршрута

    // ============================================================
    // 2. РАБОТА С ГЕОЛОКАЦИЕЙ
    // ============================================================
    function getCurrentPosition() {
        const status = document.getElementById('statusMsg');
        status.className = 'status-msg active';
        status.textContent = '⏳ Определяем ваше местоположение...';

        if (!navigator.geolocation) {
            status.className = 'status-msg active error';
            status.textContent = '❌ Браузер не поддерживает геолокацию';
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const { latitude, longitude } = pos.coords;
                const latlng = [latitude, longitude];

                // Центрируем карту
                map.setView(latlng, 15);

                // Ставим маркер "Откуда"
                if (fromMarker) map.removeLayer(fromMarker);
                fromMarker = L.marker(latlng, {
                    icon: L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34],
                    })
                }).addTo(map).bindPopup('📍 Вы здесь');

                // Заполняем поле адреса (обратный геокодинг — позже)
                document.getElementById('fromInput').value = `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
                document.getElementById('fromInput').dataset.lat = latitude;
                document.getElementById('fromInput').dataset.lng = longitude;

                status.className = 'status-msg active success';
                status.textContent = '✅ Геопозиция определена!';

                setTimeout(() => {
                    status.className = 'status-msg';
                }, 2000);
            },
            (err) => {
                status.className = 'status-msg active error';
                status.textContent = `❌ Ошибка: ${err.message}`;
                console.error('Geolocation error:', err);
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }

    // Кнопка определения геопозиции
    document.getElementById('geoFromBtn').addEventListener('click', getCurrentPosition);

    // ============================================================
    // 3. ПОСТРОЕНИЕ МАРШРУТА (OSRM)
    // ============================================================
    async function buildRoute() {
        const status = document.getElementById('statusMsg');
        const fromInput = document.getElementById('fromInput');
        const toInput = document.getElementById('toInput');
        const tripInfo = document.getElementById('tripInfo');

        // Получаем координаты
        let fromLat = parseFloat(fromInput.dataset.lat);
        let fromLng = parseFloat(fromInput.dataset.lng);
        let toLat, toLng;

        // Если координаты не заданы — пробуем распарсить из текста
        if (!fromLat || !fromLng) {
            const coords = parseCoordinates(fromInput.value);
            if (coords) {
                fromLat = coords.lat;
                fromLng = coords.lng;
            } else {
                status.className = 'status-msg active error';
                status.textContent = '❌ Укажите координаты "Откуда" (широта, долгота)';
                return;
            }
        }

        const toCoords = parseCoordinates(toInput.value);
        if (toCoords) {
            toLat = toCoords.lat;
            toLng = toCoords.lng;
        } else {
            status.className = 'status-msg active error';
            status.textContent = '❌ Укажите координаты "Куда" (широта, долгота)';
            return;
        }

        status.className = 'status-msg active';
        status.textContent = '⏳ Строим маршрут...';

        try {
            // Запрос к OSRM
            const url = `https://router.project-osrm.org/route/v1/driving/${fromLng},${fromLat};${toLng},${toLat}?overview=full&geometries=geojson`;
            const response = await fetch(url);
            const data = await response.json();

            if (data.code !== 'Ok' || !data.routes.length) {
                throw new Error('Маршрут не найден');
            }

            const route = data.routes[0];
            const distanceKm = route.distance / 1000;
            const durationMin = Math.round(route.duration / 60);

            // Сохраняем маршрут
            currentRoute = route;

            // Рисуем маршрут на карте
            if (routeLayer) map.removeLayer(routeLayer);
            routeLayer = L.geoJSON(route.geometry, {
                style: { color: '#2563eb', weight: 5, opacity: 0.8 }
            }).addTo(map);

            // Добавляем маркер "Куда"
            if (toMarker) map.removeLayer(toMarker);
            toMarker = L.marker([toLat, toLng], {
                icon: L.icon({
                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34],
                })
            }).addTo(map).bindPopup('📍 Назначение');

            // Подгоняем карту под маршрут
            const bounds = routeLayer.getBounds();
            map.fitBounds(bounds, { padding: [50, 50] });

            // Расчёт стоимости
            const baseFare = 25; // посадка
            const perKm = 1.5;
            const totalPrice = baseFare + (distanceKm * perKm);

            // Отображаем информацию
            document.getElementById('distanceDisplay').textContent = distanceKm.toFixed(1);
            document.getElementById('priceDisplay').textContent = totalPrice.toFixed(2);
            tripInfo.style.display = 'flex';

            status.className = 'status-msg active success';
            status.textContent = `✅ Маршрут построен! ${distanceKm.toFixed(1)} км, ~${durationMin} мин`;

            setTimeout(() => {
                status.className = 'status-msg';
            }, 3000);

        } catch (err) {
            status.className = 'status-msg active error';
            status.textContent = `❌ Ошибка: ${err.message}`;
            console.error('Route error:', err);
        }
    }

    // ============================================================
    // 4. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================

    // Парсинг координат из строки "32.0853, 34.7818"
    function parseCoordinates(str) {
        const cleaned = str.replace(/[^0-9.,-]/g, '').trim();
        const parts = cleaned.split(',').map(s => parseFloat(s.trim()));
        if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
            return { lat: parts[0], lng: parts[1] };
        }
        return null;
    }

    // Очистка маршрута
    function clearRoute() {
        if (routeLayer) {
            map.removeLayer(routeLayer);
            routeLayer = null;
        }
        if (toMarker) {
            map.removeLayer(toMarker);
            toMarker = null;
        }
        currentRoute = null;
        document.getElementById('tripInfo').style.display = 'none';
        document.getElementById('statusMsg').className = 'status-msg';
        document.getElementById('statusMsg').textContent = '';
    }

    // Swap адресов
    function swapAddresses() {
        const fromInput = document.getElementById('fromInput');
        const toInput = document.getElementById('toInput');
        const temp = fromInput.value;
        fromInput.value = toInput.value;
        toInput.value = temp;

        // Меняем данные координат
        const tempLat = fromInput.dataset.lat;
        const tempLng = fromInput.dataset.lng;
        fromInput.dataset.lat = toInput.dataset.lat;
        fromInput.dataset.lng = toInput.dataset.lng;
        toInput.dataset.lat = tempLat;
        toInput.dataset.lng = tempLng;

        // Меняем маркеры на карте
        if (fromMarker && toMarker) {
            const fromLatLng = fromMarker.getLatLng();
            const toLatLng = toMarker.getLatLng();
            fromMarker.setLatLng(toLatLng);
            toMarker.setLatLng(fromLatLng);
        }

        // Очищаем маршрут
        clearRoute();
    }

    // ============================================================
    // 5. ОБРАБОТЧИКИ СОБЫТИЙ
    // ============================================================

    document.getElementById('buildRouteBtn').addEventListener('click', buildRoute);
    document.getElementById('clearRouteBtn').addEventListener('click', clearRoute);
    document.getElementById('swapBtn').addEventListener('click', swapAddresses);

    // Автоматическое определение геопозиции при загрузке
    window.addEventListener('load', () => {
        setTimeout(getCurrentPosition, 500);
    });

    // ============================================================
    // 6. ДЕМО-ДАННЫЕ ДЛЯ КОШЕЛЬКА (пока статика)
    // ============================================================
    document.getElementById('walletDisplay').textContent = '70 ₪';

    console.log('🚀 Клиентская страница загружена!');
    console.log('💡 Введите координаты в формате: 32.0853, 34.7818');
    console.log('📍 Или используйте кнопку определения геопозиции');
</script>

</body>
</html>
