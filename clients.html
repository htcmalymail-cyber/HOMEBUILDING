<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WHEEL — Заказ такси</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0c10;
            color: white;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.06) 0%, transparent 40%);
            background-attachment: fixed;
            overflow: hidden;
        }

        /* ===== ХЕДЕР ===== */
        .header {
            background: rgba(18, 22, 28, 0.95);
            backdrop-filter: blur(20px);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: white;
            font-size: 20px;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #ffb000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
        }

        .client-status {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.12);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .client-status.guest {
            color: #8899aa;
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
        }

        .cashback-badge {
            color: #ffb000;
            background: rgba(255, 180, 0, 0.15);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 180, 0, 0.2);
            cursor: pointer;
        }

        /* ===== КАРТА ===== */
        #map {
            width: 100%;
            height: 50vh;
            background: #1a1e26;
            position: relative;
            z-index: 1;
        }

        /* ===== ФОРМА ЗАКАЗА ===== */
        .order-panel {
            background: rgba(18, 22, 28, 0.95);
            backdrop-filter: blur(20px);
            padding: 20px 20px 30px;
            border-top: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px 24px 0 0;
            margin-top: -20px;
            position: relative;
            z-index: 10;
        }

        .order-panel .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #8899aa;
            margin-bottom: 16px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            font-size: 12px;
            color: #8899aa;
            display: block;
            margin-bottom: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #ffb000;
            background: rgba(255,180,0,0.05);
        }

        .input-group input::placeholder {
            color: #3a4050;
        }

        .price-preview {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 180, 0, 0.08);
            padding: 12px 16px;
            border-radius: 14px;
            margin: 16px 0;
            border: 1px solid rgba(255, 180, 0, 0.15);
        }

        .price-preview .label {
            font-size: 13px;
            color: #8899aa;
        }

        .price-preview .value {
            font-size: 24px;
            font-weight: 800;
            color: #ffb000;
        }

        .price-preview .value .currency {
            font-size: 14px;
            font-weight: 600;
        }

        .order-btn {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 20px rgba(255, 140, 0, 0.3);
        }

        .order-btn:active {
            transform: scale(0.97);
        }

        .order-btn:disabled {
            opacity: 0.5;
            transform: none;
        }

        /* ===== СТАТУС ЗАКАЗА ===== */
        .order-status {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            display: none;
        }

        .order-status.active {
            display: block;
        }

        .order-status .status-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .order-status .status-icon {
            font-size: 24px;
        }

        .order-status .status-text {
            font-size: 15px;
            font-weight: 600;
        }

        .order-status .status-detail {
            font-size: 13px;
            color: #8899aa;
            margin-top: 4px;
        }

        .order-status .status-progress {
            margin-top: 10px;
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        .order-status .status-progress .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffb000, #ff6a00);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* ===== МАРКЕРЫ ===== */
        .driver-marker {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .driver-marker.online {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            box-shadow: 0 4px 12px rgba(74, 222, 128, 0.4);
        }

        .client-marker {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .pickup-marker {
            width: 24px;
            height: 24px;
            background: #ff6a00;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 4px 12px rgba(255, 106, 0, 0.6);
        }

        .dropoff-marker {
            width: 24px;
            height: 24px;
            background: #ef4444;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.6);
        }

        /* ===== МОДАЛКА ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #12161c;
            border-radius: 24px;
            padding: 32px 24px;
            width: 90%;
            max-width: 380px;
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
        }

        .modal-content .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .modal-content h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .modal-content p {
            color: #8899aa;
            font-size: 14px;
            line-height: 1.6;
        }

        .modal-content .modal-btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 16px;
        }

        @media (max-width: 420px) {
            #map {
                height: 40vh;
            }
            .order-panel {
                padding: 16px 16px 24px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ХЕДЕР ===== -->
    <header class="header">
        <div class="header-left">
            <button class="back-btn" onclick="window.location.href='index.html'">←</button>
            <span class="logo-text">WHEEL</span>
        </div>
        <div class="header-right">
            <span class="cashback-badge" id="cashbackDisplay">💰 0 ₪</span>
            <span class="client-status guest" id="clientStatus">👤 Гость</span>
        </div>
    </header>

    <!-- ===== КАРТА ===== -->
    <div id="map"></div>

    <!-- ===== ПАНЕЛЬ ЗАКАЗА ===== -->
    <div class="order-panel">
        <div class="panel-title">🚖 Куда поедем?</div>

        <div class="input-group">
            <label>📍 Откуда</label>
            <input type="text" id="pickupInput" placeholder="Адрес или нажмите на карте" />
        </div>

        <div class="input-group">
            <label>🏁 Куда</label>
            <input type="text" id="dropoffInput" placeholder="Куда едем?" />
        </div>

        <div class="price-preview" id="pricePreview">
            <span class="label">💎 Примерная стоимость</span>
            <span class="value"><span id="estimatedPrice">0</span> <span class="currency">₪</span></span>
        </div>

        <button class="order-btn" id="orderBtn">🚀 Заказать такси</button>

        <div class="order-status" id="orderStatus">
            <div class="status-row">
                <span class="status-icon" id="statusIcon">⏳</span>
                <div>
                    <div class="status-text" id="statusText">Поиск водителя...</div>
                    <div class="status-detail" id="statusDetail">Ищем ближайшего</div>
                </div>
            </div>
            <div class="status-progress">
                <div class="bar" id="statusBar"></div>
            </div>
        </div>
    </div>

    <!-- ===== МОДАЛКА ===== -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <div class="icon" id="modalIcon">✅</div>
            <h2 id="modalTitle">Заказ создан!</h2>
            <p id="modalDesc">Водитель уже в пути.</p>
            <button class="modal-btn" id="modalBtn">Отлично!</button>
        </div>
    </div>

    <!-- ===== LEAFLET JS ===== -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- ===== FIREBASE ===== -->
    <script type="module">
        // Импорт Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            query, 
            where, 
            getDocs, 
            onSnapshot, 
            addDoc, 
            doc, 
            getDoc, 
            updateDoc, 
            GeoPoint, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ============================================================
        // ВСЯ ЛОГИКА ВНУТРИ MODULE
        // ============================================================
        console.log("✅ Firebase готов");

        // Глобальные переменные
        let map;
        let clientMarker;
        let pickupMarker = null;
        let dropoffMarker = null;
        let driverMarkers = {};
        let currentOrderId = null;
        let isOrdering = false;
        let clientId = localStorage.getItem('wheel_client_id') || null;
        let cashbackAmount = 0;
        let isRegistered = false;

        const BASE_PRICE = 12;
        const PRICE_PER_KM = 6.5;
        const CASHBACK_RATE = 0.015;
        const MIN_MONTHS_FOR_CASHBACK = 8;

        // ============================================================
        // 2. ИНИЦИАЛИЗАЦИЯ КАРТЫ
        // ============================================================
        function initMap(lat = 32.0667922, lng = 34.765956) {
            console.log("🗺️ Инициализация карты...");
            
            map = L.map('map', {
                center: [lat, lng],
                zoom: 15,
                zoomControl: true
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            console.log("✅ Карта создана");

            // Маркер клиента
            const clientIcon = L.divIcon({
                className: '',
                html: '<div class="client-marker">📍</div>',
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });

            clientMarker = L.marker([lat, lng], { icon: clientIcon, zIndexOffset: 1000 })
                .addTo(map)
                .bindPopup('📍 Вы здесь');

            // Клик по карте
            map.on('click', function(e) {
                const { lat, lng } = e.latlng;
                setPickupPoint(lat, lng);
                reverseGeocode(lat, lng, 'pickupInput');
            });

            // Геолокация
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        map.setView([latitude, longitude], 15);
                        clientMarker.setLatLng([latitude, longitude]);
                        setPickupPoint(latitude, longitude);
                        reverseGeocode(latitude, longitude, 'pickupInput');
                    },
                    () => { console.log('❌ Геолокация не разрешена'); },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }

            // Загружаем водителей
            loadDrivers();
            subscribeToDrivers();
        }

        // ============================================================
        // 3. ТОЧКИ
        // ============================================================
        function setPickupPoint(lat, lng) {
            if (pickupMarker) map.removeLayer(pickupMarker);
            const icon = L.divIcon({
                className: '',
                html: '<div class="pickup-marker"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            pickupMarker = L.marker([lat, lng], { icon }).addTo(map);
            window.pickupLat = lat;
            window.pickupLng = lng;
            calculatePrice();
        }

        function setDropoffPoint(lat, lng) {
            if (dropoffMarker) map.removeLayer(dropoffMarker);
            const icon = L.divIcon({
                className: '',
                html: '<div class="dropoff-marker"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            dropoffMarker = L.marker([lat, lng], { icon }).addTo(map);
            window.dropoffLat = lat;
            window.dropoffLng = lng;
            calculatePrice();
        }

        // ============================================================
        // 4. РАСЧЁТ ЦЕНЫ
        // ============================================================
        function calculatePrice() {
            const pLat = window.pickupLat;
            const pLng = window.pickupLng;
            const dLat = window.dropoffLat;
            const dLng = window.dropoffLng;

            if (!pLat || !pLng || !dLat || !dLng) {
                document.getElementById('estimatedPrice').textContent = '0';
                return;
            }

            const distance = getDistance(pLat, pLng, dLat, dLng);
            const price = BASE_PRICE + (distance * PRICE_PER_KM);
            const rounded = Math.round(price * 10) / 10;

            document.getElementById('estimatedPrice').textContent = rounded;
            window.estimatedDistance = distance;
            window.estimatedPrice = rounded;
        }

        function getDistance(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLng/2) * Math.sin(dLng/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // ============================================================
        // 5. ГЕОКОДИНГ
        // ============================================================
        function reverseGeocode(lat, lng, inputId) {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18`)
                .then(res => res.json())
                .then(data => {
                    const address = data.display_name || `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                    document.getElementById(inputId).value = address;
                })
                .catch(() => {});
        }

        // ============================================================
        // 6. ВОДИТЕЛИ
        // ============================================================
        function loadDrivers() {
            const q = query(collection(db, 'drivers'), where('status', '==', 'online'));
            getDocs(q).then(snapshot => {
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.location) {
                        addDriverMarker(doc.id, data.location.latitude, data.location.longitude, data);
                    }
                });
            });
        }

        function subscribeToDrivers() {
            const q = query(collection(db, 'drivers'), where('status', '==', 'online'));
            onSnapshot(q, (snapshot) => {
                Object.keys(driverMarkers).forEach(id => {
                    if (!snapshot.docs.find(d => d.id === id)) {
                        map.removeLayer(driverMarkers[id]);
                        delete driverMarkers[id];
                    }
                });

                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.location) {
                        const lat = data.location.latitude;
                        const lng = data.location.longitude;
                        if (driverMarkers[doc.id]) {
                            driverMarkers[doc.id].setLatLng([lat, lng]);
                        } else {
                            addDriverMarker(doc.id, lat, lng, data);
                        }
                    }
                });
            });
        }

        function addDriverMarker(id, lat, lng, data) {
            const icon = L.divIcon({
                className: '',
                html: '<div class="driver-marker online">🚕</div>',
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            const marker = L.marker([lat, lng], { icon }).addTo(map);
            marker.bindPopup(`
                <b>${data.fullName || 'Водитель'}</b><br>
                🚗 ${data.carModel || 'Авто'}<br>
                ⭐ ${data.rating || '4.5'}
            `);
            driverMarkers[id] = marker;
        }

        // ============================================================
        // 7. ЗАКАЗ
        // ============================================================
        async function createOrder() {
            if (isOrdering) return;

            const pickupLat = window.pickupLat;
            const pickupLng = window.pickupLng;
            const dropoffLat = window.dropoffLat;
            const dropoffLng = window.dropoffLng;
            const pickupAddress = document.getElementById('pickupInput').value;
            const dropoffAddress = document.getElementById('dropoffInput').value;

            if (!pickupLat || !pickupLng) {
                showModal('⚠️', 'Укажите точку подачи', 'Нажмите на карте');
                return;
            }

            if (!dropoffLat || !dropoffLng) {
                showModal('⚠️', 'Укажите точку назначения', 'Введите адрес');
                return;
            }

            const price = parseFloat(document.getElementById('estimatedPrice').textContent);
            if (!price || price < 5) {
                showModal('⚠️', 'Рассчитайте стоимость', 'Выберите маршрут');
                return;
            }

            isOrdering = true;
            const btn = document.getElementById('orderBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Загрузка...';

            try {
                let clientId = await getOrCreateClient();

                const orderData = {
                    clientId: clientId,
                    driverId: '',
                    status: 'searching',
                    pickup: new GeoPoint(pickupLat, pickupLng),
                    dropoff: new GeoPoint(dropoffLat, dropoffLng),
                    pickupAddress: pickupAddress || 'Точка на карте',
                    dropoffAddress: dropoffAddress || 'Точка на карте',
                    price: price,
                    distance: window.estimatedDistance || 0,
                    duration: Math.round((window.estimatedDistance || 5) * 4),
                    createdAt: serverTimestamp(),
                    startedAt: null,
                    completedAt: null,
                    paymentMethod: 'cash',
                    commission: Math.round(price * 0.1 * 10) / 10,
                    cashback: isRegistered ? Math.round(price * CASHBACK_RATE * 10) / 10 : 0
                };

                const docRef = await addDoc(collection(db, 'orders'), orderData);
                currentOrderId = docRef.id;

                showOrderStatus('⏳', 'Поиск водителя...', 'Ищем ближайшего', 25);

                setTimeout(() => {
                    assignDriver(docRef.id);
                }, 3000);

                showModal('✅', 'Заказ создан!', 'Ищем водителя...');

            } catch (error) {
                console.error('Ошибка:', error);
                showModal('❌', 'Ошибка', 'Попробуйте снова');
            } finally {
                isOrdering = false;
                btn.disabled = false;
                btn.textContent = '🚀 Заказать такси';
            }
        }

        // ============================================================
        // 8. КЛИЕНТ
        // ============================================================
        async function getOrCreateClient() {
            if (clientId) {
                const docRef = doc(db, 'clients', clientId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    isRegistered = true;
                    cashbackAmount = data.cashback || 0;
                    updateCashbackDisplay();
                    return clientId;
                }
            }

            const phone = prompt('📱 Введите номер телефона:', '+7');
            if (!phone) return 'guest_' + Date.now();

            const clientData = {
                phone: phone,
                fullName: '',
                cashback: 0,
                totalSpent: 0,
                registeredAt: serverTimestamp(),
                ordersCount: 0
            };

            const docRef = await addDoc(collection(db, 'clients'), clientData);
            clientId = docRef.id;
            isRegistered = true;

            localStorage.setItem('wheel_client_id', clientId);
            updateClientStatus();
            showModal('🎉', 'Добро пожаловать!', 'Кэшбэк 1.5% после 8 месяцев');

            return clientId;
        }

        // ============================================================
        // 9. НАЗНАЧЕНИЕ ВОДИТЕЛЯ
        // ============================================================
        async function assignDriver(orderId) {
            const driversSnapshot = await getDocs(query(collection(db, 'drivers'), where('status', '==', 'online')));
            let driverId = '';
            if (!driversSnapshot.empty) {
                driverId = driversSnapshot.docs[0].id;
            }

            await updateDoc(doc(db, 'orders', orderId), {
                driverId: driverId,
                status: driverId ? 'assigned' : 'pending'
            });

            if (driverId) {
                showOrderStatus('🚗', 'Водитель найден!', 'Едет к вам', 60);
                setTimeout(() => {
                    showOrderStatus('🚕', 'Водитель в пути', 'Прибудет через 3-5 мин', 85);
                }, 4000);
                setTimeout(() => {
                    showOrderStatus('📍', 'Водитель прибыл', 'Машина ждёт вас', 100);
                }, 8000);
            } else {
                showOrderStatus('😔', 'Нет водителей', 'Попробуйте позже', 0);
            }
        }

        // ============================================================
        // 10. UI
        // ============================================================
        function showOrderStatus(icon, text, detail, progress) {
            const el = document.getElementById('orderStatus');
            el.classList.add('active');
            document.getElementById('statusIcon').textContent = icon;
            document.getElementById('statusText').textContent = text;
            document.getElementById('statusDetail').textContent = detail;
            document.getElementById('statusBar').style.width = progress + '%';
        }

        function updateClientStatus() {
            const el = document.getElementById('clientStatus');
            if (clientId && isRegistered) {
                el.textContent = '👤 Клиент';
                el.className = 'client-status';
            } else {
                el.textContent = '👤 Гость';
                el.className = 'client-status guest';
            }
        }

        function updateCashbackDisplay() {
            const el = document.getElementById('cashbackDisplay');
            el.textContent = `💰 ${cashbackAmount > 0 ? cashbackAmount.toFixed(2) : '0'} ₪`;
        }

        function showModal(icon, title, desc) {
            document.getElementById('modalIcon').textContent = icon;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalDesc').textContent = desc;
            document.getElementById('resultModal').classList.add('active');
        }

        // ============================================================
        // 11. ПОИСК АДРЕСА
        // ============================================================
        function searchAddress(query, type) {
            if (!query || query.length < 3) return;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`)
                .then(res => res.json())
                .then(data => {
                    if (data.length > 0) {
                        const { lat, lon } = data[0];
                        if (type === 'pickup') {
                            setPickupPoint(parseFloat(lat), parseFloat(lon));
                            map.setView([parseFloat(lat), parseFloat(lon)], 16);
                        } else {
                            setDropoffPoint(parseFloat(lat), parseFloat(lon));
                            map.setView([parseFloat(lat), parseFloat(lon)], 16);
                        }
                    }
                })
                .catch(() => {});
        }

        // ============================================================
        // 12. ЗАПУСК
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log("🚀 DOM загружен");
            initMap();
            updateClientStatus();
            updateCashbackDisplay();

            document.getElementById('orderBtn').addEventListener('click', createOrder);

            document.getElementById('dropoffInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    searchAddress(e.target.value, 'dropoff');
                }
            });

            document.getElementById('pickupInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    searchAddress(e.target.value, 'pickup');
                }
            });

            document.getElementById('modalBtn').addEventListener('click', () => {
                document.getElementById('resultModal').classList.remove('active');
            });

            document.getElementById('resultModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) {
                    document.getElementById('resultModal').classList.remove('active');
                }
            });

            document.getElementById('cashbackDisplay').addEventListener('click', () => {
                showModal('💰', 'Кэшбэк 1.5%', 
                    `Начисляется после ${MIN_MONTHS_FOR_CASHBACK} месяцев\n` +
                    (isRegistered ? '✅ Вы зарегистрированы' : '❌ Зарегистрируйтесь')
                );
            });

            // Проверка авторизации
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const driverDoc = await getDoc(doc(db, 'drivers', user.uid));
                    if (driverDoc.exists()) {
                        window.location.href = 'driver.html';
                    }
                }
            });
        });

        // Экспорт в глобальный объект для отладки
        window.initMap = initMap;
        window.setPickupPoint = setPickupPoint;
        window.setDropoffPoint = setDropoffPoint;
    </script>
</body>
</html>
