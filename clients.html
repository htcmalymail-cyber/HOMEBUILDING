<script>
    // ============================================================
    // 1. ИНИЦИАЛИЗАЦИЯ КАРТЫ
    // ============================================================
    const map = L.map('map', {
        center: [32.0853, 34.7818],
        zoom: 13,
        zoomControl: false,
    });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19,
    }).addTo(map);

    // ============================================================
    // 2. МАРКЕРЫ
    // ============================================================
    const clientIcon = L.divIcon({
        html: '<div class="marker-client"></div>',
        className: '',
        iconSize: [20, 20],
        iconAnchor: [10, 10],
    });
    const driverIcon = L.divIcon({
        html: '<div class="marker-driver">🚗</div>',
        className: '',
        iconSize: [32, 32],
        iconAnchor: [16, 16],
    });
    const endIcon = L.divIcon({
        html: '<div class="marker-end"></div>',
        className: '',
        iconSize: [16, 16],
        iconAnchor: [8, 8],
    });

    let fromMarker = null;
    let toMarker = null;
    let driverMarker = null;
    let routeControl = null;

    // ============================================================
    // 3. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
    // ============================================================
    let currentUser = null;
    let userDocRef = null;

    // ============================================================
    // 4. ОБРАТНЫЙ ГЕОКОДИНГ (координаты → адрес)
    // ============================================================
    async function reverseGeocode(lat, lng) {
        try {
            const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ru&zoom=16`;
            const response = await fetch(url);
            const data = await response.json();
            
            if (data && data.display_name) {
                // Формируем короткий адрес: улица, номер, район, город
                const parts = data.display_name.split(', ');
                // Берём первые 3-4 значимые части
                let address = parts.slice(0, 3).join(', ');
                
                // Если есть номер дома — добавляем
                if (data.address && data.address.house_number) {
                    const street = data.address.road || data.address.street || '';
                    const house = data.address.house_number || '';
                    if (street && house) {
                        address = `${street} ${house}`;
                    }
                }
                
                // Если адрес слишком короткий — берём display_name
                if (address.length < 5) {
                    address = data.display_name;
                }
                
                return address;
            }
            return `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        } catch (error) {
            console.error('Reverse geocode error:', error);
            return `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        }
    }

    // ============================================================
    // 5. ПРЯМОЙ ГЕОКОДИНГ (адрес → координаты)
    // ============================================================
    async function geocode(address) {
        try {
            const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&limit=1&accept-language=ru`;
            const response = await fetch(url);
            const data = await response.json();
            
            if (data && data.length > 0) {
                return {
                    lat: parseFloat(data[0].lat),
                    lng: parseFloat(data[0].lon),
                    display_name: data[0].display_name
                };
            }
            return null;
        } catch (error) {
            console.error('Geocode error:', error);
            return null;
        }
    }

    // ============================================================
    // 6. FIREBASE — АВТОРИЗАЦИЯ
    // ============================================================
    async function initFirebaseAuth() {
        const auth = window.firebaseAuth;
        const signInAnon = window.signInAnonymously;
        const onAuth = window.onAuthStateChanged;

        onAuth(auth, async (user) => {
            if (user) {
                currentUser = user;
                console.log('✅ Авторизован:', user.uid);
                await initUserWallet(user.uid);
                updateWalletUI();
                document.getElementById('userInfo').textContent = `🔑 ID: ${user.uid.slice(0, 12)}...`;
            } else {
                try {
                    const cred = await signInAnon(auth);
                    currentUser = cred.user;
                    console.log('✅ Анонимный вход:', currentUser.uid);
                    await initUserWallet(currentUser.uid);
                    updateWalletUI();
                } catch (error) {
                    console.error('❌ Ошибка анонимного входа:', error);
                    showStatus('❌ Ошибка подключения к серверу', 'error');
                }
            }
        });
    }

    // ============================================================
    // 7. КОШЕЛЁК В FIREBASE
    // ============================================================
    async function initUserWallet(uid) {
        const db = window.firebaseDb;
        const docFn = window.doc;
        const getDocFn = window.getDoc;
        const setDocFn = window.setDoc;

        const userRef = docFn(db, 'users', uid);
        userDocRef = userRef;

        const docSnap = await getDocFn(userRef);

        if (!docSnap.exists()) {
            await setDocFn(userRef, {
                wallet: 0,
                bonuses: 0,
                bonusesAvailable: false,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
            });
            console.log('🆕 Создан кошелёк для:', uid);
        } else {
            console.log('💰 Кошелёк загружен:', docSnap.data());
        }

        return userRef;
    }

    async function getWalletData() {
        if (!userDocRef) return null;
        const getDocFn = window.getDoc;
        const docSnap = await getDocFn(userDocRef);
        if (docSnap.exists()) {
            return docSnap.data();
        }
        return null;
    }

    async function updateWalletUI() {
        const data = await getWalletData();
        if (data) {
            const wallet = data.wallet || 0;
            const bonuses = data.bonuses || 0;
            document.getElementById('walletDisplay').textContent = wallet.toFixed(0);
            document.getElementById('modalBalance').textContent = wallet.toFixed(0);
            document.getElementById('bonusDisplay').textContent = bonuses.toFixed(2);
        }
    }

    // ============================================================
    // 8. ПОПОЛНЕНИЕ КОШЕЛЬКА
    // ============================================================
    document.getElementById('topupBtn').addEventListener('click', async () => {
        const input = document.getElementById('topupInput');
        const amount = parseFloat(input.value);
        if (!amount || amount <= 0) {
            alert('Введите сумму пополнения');
            return;
        }

        try {
            const updateDocFn = window.updateDoc;
            const incrementFn = window.increment;

            await updateDocFn(userDocRef, {
                wallet: incrementFn(amount),
                updatedAt: new Date().toISOString(),
            });

            await updateWalletUI();
            input.value = '';
            showStatus(`💰 Кошелёк пополнен на ${amount} ₪`, 'success');
            setTimeout(() => clearStatus(), 2000);
        } catch (error) {
            console.error('❌ Ошибка пополнения:', error);
            showStatus('❌ Ошибка пополнения: ' + error.message, 'error');
        }
    });

    // ============================================================
    // 9. ГЕОЛОКАЦИЯ С ОБРАТНЫМ ГЕОКОДИНГОМ
    // ============================================================
    function getCurrentPosition() {
        showStatus('⏳ Определяем ваше местоположение...', 'info');

        if (!navigator.geolocation) {
            showStatus('❌ Браузер не поддерживает геолокацию', 'error');
            return;
        }

        navigator.geolocation.getCurrentPosition(
            async (pos) => {
                const { latitude, longitude } = pos.coords;
                const latlng = [latitude, longitude];

                map.setView(latlng, 15);

                if (fromMarker) map.removeLayer(fromMarker);
                fromMarker = L.marker(latlng, { icon: clientIcon })
                    .addTo(map)
                    .bindPopup('📍 Вы здесь');

                // 🔥 Получаем текстовый адрес по координатам
                const address = await reverseGeocode(latitude, longitude);
                
                document.getElementById('fromInput').value = address;
                document.getElementById('fromInput').dataset.lat = latitude;
                document.getElementById('fromInput').dataset.lng = longitude;
                document.getElementById('fromInput').dataset.address = address;

                showStatus('✅ Геопозиция определена!', 'success');
                setTimeout(() => clearStatus(), 2000);
            },
            (err) => {
                showStatus(`❌ Ошибка: ${err.message}`, 'error');
                console.error('Geolocation error:', err);
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    // ============================================================
    // 10. ПОСТРОЕНИЕ МАРШРУТА
    // ============================================================
    async function buildRoute() {
        const fromInput = document.getElementById('fromInput');
        const toInput = document.getElementById('toInput');

        let fromLat = parseFloat(fromInput.dataset.lat);
        let fromLng = parseFloat(fromInput.dataset.lng);
        let fromAddress = fromInput.dataset.address || fromInput.value;

        // Если нет координат — пробуем геокодинг адреса
        if (!fromLat || !fromLng) {
            const geocodeResult = await geocode(fromInput.value);
            if (geocodeResult) {
                fromLat = geocodeResult.lat;
                fromLng = geocodeResult.lng;
                fromAddress = geocodeResult.display_name;
                fromInput.dataset.lat = fromLat;
                fromInput.dataset.lng = fromLng;
                fromInput.dataset.address = fromAddress;
            } else {
                showStatus('❌ Не удалось определить адрес "Откуда"', 'error');
                return;
            }
        }

        // Координаты "Куда"
        let toLat, toLng, toAddress = toInput.value;
        const geocodeResult = await geocode(toInput.value);
        if (geocodeResult) {
            toLat = geocodeResult.lat;
            toLng = geocodeResult.lng;
            toAddress = geocodeResult.display_name;
        } else {
            showStatus('❌ Не удалось определить адрес "Куда"', 'error');
            return;
        }

        showStatus('⏳ Строим маршрут...', 'info');

        if (routeControl) {
            map.removeControl(routeControl);
            routeControl = null;
        }

        routeControl = L.Routing.control({
            waypoints: [
                L.latLng(fromLat, fromLng),
                L.latLng(toLat, toLng)
            ],
            routeWhileDragging: false,
            showAlternatives: false,
            lineOptions: {
                styles: [{ color: '#ffb000', weight: 4, opacity: 0.9 }],
                extendToWaypoints: true,
                missingRouteTolerance: 10,
            },
            addWaypoints: false,
            draggableWaypoints: false,
            fitSelectedRoutes: true,
            show: false,
        }).addTo(map);

        routeControl.on('routesfound', function(e) {
            const routes = e.routes;
            const summary = routes[0].summary;
            const distanceKm = summary.totalDistance / 1000;
            const durationMin = Math.round(summary.totalTime / 60);

            const baseFare = 25;
            const perKm = 1.5;
            const totalPrice = baseFare + (distanceKm * perKm);

            document.getElementById('distanceDisplay').textContent = distanceKm.toFixed(1);
            document.getElementById('priceDisplay').textContent = totalPrice.toFixed(2);
            document.getElementById('tripInfo').classList.add('active');
            document.getElementById('orderBtn').classList.add('active');

            if (toMarker) map.removeLayer(toMarker);
            toMarker = L.marker([toLat, toLng], { icon: endIcon })
                .addTo(map)
                .bindPopup('📍 ' + toAddress);

            // Сохраняем адреса в dataset
            fromInput.dataset.address = fromAddress;
            fromInput.value = fromAddress;
            toInput.dataset.address = toAddress;
            toInput.value = toAddress;

            showStatus(`✅ Маршрут построен! ${distanceKm.toFixed(1)} км, ~${durationMin} мин`, 'success');
            setTimeout(() => clearStatus(), 3000);
        });

        routeControl.on('routingerror', function(e) {
            showStatus('❌ Не удалось построить маршрут', 'error');
            console.error('Routing error:', e);
        });
    }

    // ============================================================
    // 11. СОЗДАНИЕ ЗАКАЗА (с текстовыми адресами)
    // ============================================================
    async function createOrder() {
        const fromInput = document.getElementById('fromInput');
        const toInput = document.getElementById('toInput');
        const priceDisplay = document.getElementById('priceDisplay');
        const distanceDisplay = document.getElementById('distanceDisplay');

        const fromLat = parseFloat(fromInput.dataset.lat);
        const fromLng = parseFloat(fromInput.dataset.lng);
        const fromAddress = fromInput.dataset.address || fromInput.value;

        const toLat = parseFloat(toInput.dataset.lat);
        const toLng = parseFloat(toInput.dataset.lng);
        const toAddress = toInput.dataset.address || toInput.value;

        if (!fromLat || !fromLng || !toLat || !toLng) {
            showStatus('❌ Сначала постройте маршрут', 'error');
            return;
        }

        const price = parseFloat(priceDisplay.textContent);
        const distance = parseFloat(distanceDisplay.textContent);

        // Проверка баланса
        const walletData = await getWalletData();
        if (!walletData || walletData.wallet < price) {
            showStatus(`❌ Недостаточно средств. Нужно ${price.toFixed(2)} ₪, доступно ${(walletData?.wallet || 0).toFixed(2)} ₪`, 'error');
            return;
        }

        try {
            const db = window.firebaseDb;
            const collectionFn = window.collection;
            const addDocFn = window.addDoc;
            const incrementFn = window.increment;
            const runTransactionFn = window.runTransaction;

            // Транзакция для списания средств
            await runTransactionFn(db, async (transaction) => {
                const userSnap = await transaction.get(userDocRef);
                if (!userSnap.exists()) {
                    throw new Error('Пользователь не найден');
                }
                const currentWallet = userSnap.data().wallet || 0;
                if (currentWallet < price) {
                    throw new Error('Недостаточно средств');
                }
                transaction.update(userDocRef, {
                    wallet: incrementFn(-price),
                    updatedAt: new Date().toISOString(),
                });
            });

            // 🔥 СОЗДАНИЕ ЗАКАЗА С ТЕКСТОВЫМИ АДРЕСАМИ
            const ordersRef = collectionFn(db, 'orders');
            const orderData = {
                clientId: currentUser ? currentUser.uid : 'anonymous',
                from: {
                    lat: fromLat,
                    lng: fromLng,
                    address: fromAddress  // ✅ текстовый адрес
                },
                to: {
                    lat: toLat,
                    lng: toLng,
                    address: toAddress  // ✅ текстовый адрес
                },
                price: price,
                distance: distance,
                status: 'waiting',
                createdAt: new Date().toISOString(),
                timestamp: serverTimestamp(),
            };

            const docRef = await addDocFn(ordersRef, orderData);
            console.log('📦 Заказ сохранён:', docRef.id, orderData);

            // Начисляем бонус (1%)
            const bonusAmount = price * 0.01;
            const updateDocFn2 = window.updateDoc;
            const incrementFn2 = window.increment;
            await updateDocFn2(userDocRef, {
                bonuses: incrementFn2(bonusAmount),
                updatedAt: new Date().toISOString(),
            });

            await updateWalletUI();
            showStatus(`✅ Заказ создан! Бонус: ${bonusAmount.toFixed(2)} ₪`, 'success');

            // Демонстрация — машина на карте
            if (driverMarker) map.removeLayer(driverMarker);
            const fromLatLng = [fromLat, fromLng];
            driverMarker = L.marker(fromLatLng, { icon: driverIcon })
                .addTo(map)
                .bindPopup('🚗 Водитель назначен');

            let progress = 0;
            const interval = setInterval(() => {
                progress += 0.02;
                if (progress > 1) {
                    clearInterval(interval);
                    showStatus('🚗 Водитель прибыл!', 'success');
                    return;
                }
                const lat = fromLat + (toLat - fromLat) * progress;
                const lng = fromLng + (toLng - fromLng) * progress;
                driverMarker.setLatLng([lat, lng]);
            }, 200);

            document.getElementById('orderBtn').disabled = true;
            document.getElementById('orderBtn').textContent = '⏳ Водитель едет...';

            setTimeout(() => {
                document.getElementById('orderBtn').disabled = false;
                document.getElementById('orderBtn').innerHTML = '<i class="fas fa-taxi"></i> Заказать такси';
            }, 8000);

        } catch (error) {
            console.error('❌ Order error:', error);
            showStatus('❌ Ошибка: ' + error.message, 'error');
        }
    }

    // ============================================================
    // 12. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================

    function showStatus(msg, type = 'info') {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.className = 'status-msg active ' + type;
    }

    function clearStatus() {
        document.getElementById('statusMsg').className = 'status-msg';
    }

    function clearRoute() {
        if (routeControl) {
            map.removeControl(routeControl);
            routeControl = null;
        }
        if (toMarker) {
            map.removeLayer(toMarker);
            toMarker = null;
        }
        if (driverMarker) {
            map.removeLayer(driverMarker);
            driverMarker = null;
        }
        document.getElementById('tripInfo').classList.remove('active');
        document.getElementById('orderBtn').classList.remove('active');
        document.getElementById('orderBtn').disabled = false;
        document.getElementById('orderBtn').innerHTML = '<i class="fas fa-taxi"></i> Заказать такси';
        clearStatus();
    }

    function swapAddresses() {
        const fromInput = document.getElementById('fromInput');
        const toInput = document.getElementById('toInput');
        
        // Меняем текст
        const tempText = fromInput.value;
        fromInput.value = toInput.value;
        toInput.value = tempText;

        // Меняем данные
        const tempLat = fromInput.dataset.lat;
        const tempLng = fromInput.dataset.lng;
        const tempAddr = fromInput.dataset.address;
        
        fromInput.dataset.lat = toInput.dataset.lat;
        fromInput.dataset.lng = toInput.dataset.lng;
        fromInput.dataset.address = toInput.dataset.address;
        
        toInput.dataset.lat = tempLat;
        toInput.dataset.lng = tempLng;
        toInput.dataset.address = tempAddr;

        // Меняем маркеры
        if (fromMarker && toMarker) {
            const fromLatLng = fromMarker.getLatLng();
            const toLatLng = toMarker.getLatLng();
            fromMarker.setLatLng(toLatLng);
            toMarker.setLatLng(fromLatLng);
        }

        clearRoute();
    }

    function serverTimestamp() {
        return new Date().toISOString();
    }
    window.serverTimestamp = serverTimestamp;

    // ============================================================
    // 13. ОБРАБОТЧИКИ
    // ============================================================

    document.getElementById('geoFromBtn').addEventListener('click', getCurrentPosition);
    document.getElementById('buildRouteBtn').addEventListener('click', buildRoute);
    document.getElementById('clearRouteBtn').addEventListener('click', clearRoute);
    document.getElementById('swapBtn').addEventListener('click', swapAddresses);
    document.getElementById('orderBtn').addEventListener('click', createOrder);

    document.getElementById('walletBtn').addEventListener('click', () => {
        document.getElementById('walletModal').classList.add('active');
        updateWalletUI();
    });

    document.getElementById('closeWalletModal').addEventListener('click', () => {
        document.getElementById('walletModal').classList.remove('active');
    });

    document.getElementById('walletModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) {
            document.getElementById('walletModal').classList.remove('active');
        }
    });

    // ============================================================
    // 14. ЗАПУСК
    // ============================================================

    window.addEventListener('load', () => {
        initFirebaseAuth();
        setTimeout(getCurrentPosition, 800);
        console.log('🚗 WHEEL Client loaded');
    });
</script>
