<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>WHEEL — Заказ такси</title>

    <!-- Firebase SDK -->

        const firebaseConfig = {

            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.06) 0%, transparent 40%);
            background-attachment: fixed;
            transition: direction 0.3s ease;
        }

        body[dir="rtl"] .phone-frame { direction: rtl; }
        body[dir="rtl"] .suggestion-item { direction: rtl; text-align: right; }
        body[dir="rtl"] .address-input input { text-align: right; }

        .phone-frame {
            width: 100%;
            max-width: 420px;
            height: 95vh;
            max-height: 820px;
            background: rgba(18, 22, 28, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 44px;
            padding: 20px 20px 28px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* ===== ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКОВ ===== */
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 24px;
            z-index: 30;
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        body[dir="rtl"] .lang-switcher {
            right: auto;
            left: 24px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #8899aa;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .lang-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }
        .lang-btn.active {
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(255, 160, 0, 0.3);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px 14px 6px;
            margin-top: 10px;
            flex-shrink: 0;
            z-index: 20;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }
        .back-btn:hover { background: rgba(255,255,255,0.15); }
        .header-title { font-size: 18px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }
        .header-title span { color: #ffb000; }
        .wallet-badge {
            background: rgba(255,180,0,0.15);
            border: 1px solid rgba(255,180,0,0.2);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: #ffb000;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .wallet-badge:hover { background: rgba(255,180,0,0.25); }
        #map {
            flex: 1;
            width: 100%;
            border-radius: 20px;
            background: #1a1e26;
            overflow: hidden;
            z-index: 1;
            min-height: 200px;
        }
        .leaflet-control-attribution {
            background: rgba(10,12,16,0.8) !important;
            color: #8899aa !important;
            font-size: 9px !important;
        }
        .leaflet-control-attribution a { color: #ffb000 !important; }
        .marker-client {
            background: #2563eb;
            border: 3px solid #ffffff;
            border-radius: 50% 50% 50% 0;
            width: 20px;
            height: 20px;
            transform: rotate(-45deg);
            box-shadow: 0 4px 12px rgba(37,99,235,0.5);
        }
        .marker-client::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
        }
        .marker-driver {
            width: 32px;
            height: 32px;
            background: #22c55e;
            border: 3px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(34,197,94,0.5);
            animation: pulse-driver 1.5s infinite;
        }
        @keyframes pulse-driver {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .marker-end {
            background: #ef4444;
            border: 3px solid #ffffff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            box-shadow: 0 4px 12px rgba(239,68,68,0.4);
        }
        .control-panel {
            background: rgba(18,22,28,0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0;
            padding: 16px 18px 22px;
            margin-top: -12px;
            z-index: 10;
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.06);
            max-height: 55vh;
            overflow-y: auto;
        }
        .control-panel::-webkit-scrollbar { width: 3px; }
        .control-panel::-webkit-scrollbar-thumb { background: #ffb000; border-radius: 10px; }
        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #8899aa;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }
        .panel-title i { color: #ffb000; }

        .address-group { 
            margin-bottom: 10px; 
            position: relative;
        }
        .address-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #667788;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .address-group label .dot-green { color: #22c55e; }
        .address-group label .dot-red { color: #ef4444; }
        
        .address-input {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 0 14px;
            border: 1.5px solid rgba(255,255,255,0.08);
            transition: 0.2s;
        }
        .address-input:focus-within {
            border-color: #ffb000;
            background: rgba(255,180,0,0.05);
            box-shadow: 0 0 0 4px rgba(255,180,0,0.08);
        }
        .address-input i { color: #667788; width: 18px; font-size: 14px; }
        .address-input input {
            border: none;
            background: transparent;
            padding: 12px 10px;
            width: 100%;
            font-size: 14px;
            outline: none;
            color: #e8edf5;
        }
        .address-input input::placeholder { color: #556677; }
        .address-input .geo-btn {
            background: none;
            border: none;
            color: #ffb000;
            cursor: pointer;
            font-size: 16px;
            padding: 6px;
            transition: 0.2s;
        }
        .address-input .geo-btn:hover { transform: scale(1.15); }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1e26;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-top: 4px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .suggestions-list.active { display: block; }
        .suggestions-list::-webkit-scrollbar { width: 3px; }
        .suggestions-list::-webkit-scrollbar-thumb { background: #ffb000; border-radius: 10px; }
        
        .suggestion-item {
            padding: 10px 16px;
            color: #d0d8e0;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover {
            background: rgba(255,180,0,0.1);
            color: #ffb000;
        }
        .suggestion-item i {
            color: #667788;
            font-size: 12px;
        }
        .suggestion-item .highlight {
            color: #ffb000;
            font-weight: 600;
        }

        .swap-row {
            display: flex;
            justify-content: center;
            margin: 2px 0 10px;
        }
        .swap-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 30px;
            padding: 5px 18px;
            font-size: 12px;
            font-weight: 600;
            color: #8899aa;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .swap-btn:hover {
            background: rgba(255,180,0,0.15);
            color: #ffb000;
            border-color: #ffb000;
        }

        /* ===== ОТОБРАЖЕНИЕ ЦЕНЫ С ВИЛКОЙ ===== */
        .trip-info {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 12px 16px;
            margin: 12px 0 14px;
            display: none;
            flex-direction: column;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .trip-info.active { display: flex; }
        .trip-info .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .trip-info .distance {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #8899aa;
            font-size: 13px;
        }
        .trip-info .distance span {
            font-weight: 700;
            color: #e8edf5;
            font-size: 17px;
        }
        .trip-info .price-range {
            text-align: right;
        }
        .trip-info .price-range .main-price {
            font-size: 22px;
            font-weight: 800;
            color: #4ade80;
        }
        .trip-info .price-range .main-price small {
            font-size: 13px;
            font-weight: 400;
            color: #8899aa;
        }
        .trip-info .price-range .variance-hint {
            font-size: 11px;
            color: #667788;
            display: block;
            margin-top: 2px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-primary {
            flex: 1;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(255,140,0,0.3);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: #8899aa;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            color: #ffffff;
        }
        .btn-order {
            width: 100%;
            margin-top: 10px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-order.active { display: flex; }
        .btn-order:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(34,197,94,0.3);
        }
        .btn-order:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-msg {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 10px;
            display: none;
        }
        .status-msg.active { display: block; }
        .status-msg.success {
            background: rgba(34,197,94,0.15);
            color: #4ade80;
            border: 1px solid rgba(34,197,94,0.2);
        }
        .status-msg.error {
            background: rgba(239,68,68,0.15);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.2);
        }
        .status-msg.info {
            background: rgba(59,130,246,0.15);
            color: #60a5fa;
            border: 1px solid rgba(59,130,246,0.2);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #12161c;
            border-radius: 24px;
            padding: 32px 24px;
            width: 90%;
            max-width: 380px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            color: white;
        }
        .modal-content h2 {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
        }
        .modal-content h2 i { color: #ffb000; }
        .wallet-balance {
            text-align: center;
            font-size: 42px;
            font-weight: 800;
            color: #ffb000;
            margin: 16px 0;
        }
        .wallet-balance small {
            font-size: 18px;
            color: #8899aa;
        }
        .wallet-row {
            display: flex;
            gap: 10px;
            margin: 16px 0;
        }
        .wallet-row input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 16px;
            outline: none;
        }
        .wallet-row input:focus { border-color: #ffb000; }
        .wallet-row button {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            font-weight: 700;
            cursor: pointer;
        }
        .close-modal {
            width: 100%;
            background: transparent;
            color: #8899aa;
            border: none;
            margin-top: 12px;
            cursor: pointer;
            font-size: 14px;
            padding: 10px;
        }
        .close-modal:hover { color: white; }
        .home-indicator {
            margin-top: 12px;
            width: 130px;
            height: 5px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            align-self: center;
            flex-shrink: 0;
        }
        @media (max-width: 420px) {
            body { padding: 0; }
            .phone-frame {
                border-radius: 0;
                height: 100vh;
                max-height: none;
                padding: 12px 14px 20px;
                background: rgba(10,12,16,0.98);
                border: none;
                box-shadow: none;
            }
            #map { border-radius: 14px; min-height: 150px; }
            .control-panel {
                border-radius: 16px 16px 0 0;
                padding: 14px 14px 18px;
                margin-top: -8px;
            }
            .header-title { font-size: 16px; }
            .wallet-badge { font-size: 12px; padding: 4px 12px; }
            .lang-switcher { top: 14px; right: 16px; }
            body[dir="rtl"] .lang-switcher { right: auto; left: 16px; }
            .lang-btn { font-size: 10px; padding: 4px 8px; }
        }
    </style>
</head>
<body>

<div class="phone-frame">

    <!-- ===== ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКОВ ===== -->
    <div class="lang-switcher">
        <button class="lang-btn" data-lang="he" title="עברית">עב</button>
        <button class="lang-btn" data-lang="ar" title="العربية">عرب</button>
        <button class="lang-btn active" data-lang="en" title="English">EN</button>
    </div>

    <div class="header">
        <div class="header-left">
            <a href="index.html" class="back-btn">←</a>
            <div class="header-title">WHEEL <span>TAXI</span></div>
        </div>
        <div class="wallet-badge" id="walletBtn">
            <i>💰</i> <span id="walletDisplay">0</span> ₪
        </div>
    </div>

    <div id="map"></div>

    <div class="control-panel">
        <div class="panel-title">
            <i class="fas fa-route"></i> <span data-i18n="whereTo">Куда едем?</span>
        </div>

        <!-- ===== ОТКУДА ===== -->
        <div class="address-group" id="fromGroup">
            <label><span class="dot-green">●</span> <span data-i18n="from">Откуда</span></label>
            <div class="address-input">
                <i class="fas fa-location-dot"></i>
                <input type="text" id="fromInput" data-i18n-placeholder="fromPlaceholder" placeholder="Ваше местоположение" autocomplete="off" />
                <button class="geo-btn" id="geoFromBtn" title="Определить геопозицию">
                    <i class="fas fa-crosshairs"></i>
                </button>
            </div>
            <div class="suggestions-list" id="fromSuggestions"></div>
        </div>

        <div class="swap-row">
            <button class="swap-btn" id="swapBtn">
                <i class="fas fa-arrow-up-arrow-down"></i> <span data-i18n="swap">Поменять</span>
            </button>
        </div>

        <!-- ===== КУДА ===== -->
        <div class="address-group" id="toGroup">
            <label><span class="dot-red">●</span> <span data-i18n="to">Куда</span></label>
            <div class="address-input">
                <i class="fas fa-location-dot"></i>
                <input type="text" id="toInput" data-i18n-placeholder="toPlaceholder" placeholder="Введите адрес назначения" autocomplete="off" />
            </div>
            <div class="suggestions-list" id="toSuggestions"></div>
        </div>

        <!-- ===== ИНФОРМАЦИЯ О ПОЕЗДКЕ (С ВИЛКОЙ ЦЕНЫ) ===== -->
        <div class="trip-info" id="tripInfo">
            <div class="row">
                <div class="distance">
                    <i class="fas fa-road"></i>
                    <span id="distanceDisplay">0</span> <span data-i18n="km">км</span>
                    <span style="color:#667788; font-size:12px; margin-left:6px;">(~<span id="durationDisplay">0</span> <span data-i18n="min">мин</span>)</span>
                </div>
                <div class="price-range">
                    <div class="main-price">
                        <span id="priceDisplay">0</span> <small>₪</small>
                    </div>
                    <span class="variance-hint" id="varianceHint">±6% от стоимости</span>
                </div>
            </div>
            <div class="row" style="border-top:1px solid rgba(255,255,255,0.06); padding-top:6px; font-size:12px; color:#667788;">
                <span data-i18n="priceNote">* Окончательная цена может отличаться</span>
                <span id="priceRangeDisplay" style="color:#8899aa;">25.00 – 28.00 ₪</span>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-primary" id="buildRouteBtn">
                <i class="fas fa-map"></i> <span data-i18n="buildRoute">Построить маршрут</span>
            </button>
            <button class="btn-secondary" id="clearRouteBtn">
                <i class="fas fa-eraser"></i>
            </button>
        </div>

            <i class="fas fa-taxi"></i> <span data-i18n="orderTaxi">Заказать такси</span>
        </button>

    <div class="home-indicator"></div>
</div>

        <h2><i class="fas fa-wallet"></i> <span data-i18n="myWallet">Мой кошелёк</span></h2>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

<script>
    // ============================================================
    // ПЕРЕВОДЫ
    // ============================================================
    const translations = {
        he: {
            whereTo: "לאן נוסעים?",
            from: "מאיפה",
            to: "לאן",
            fromPlaceholder: "המיקום שלך",
            toPlaceholder: "הזן כתובת יעד",
            swap: "החלף",
            km: "ק"מ",
            min: "דקות",
            buildRoute: "בנה מסלול",
            orderTaxi: "הזמן מונית",
            myWallet: "הארנק שלי",
            topup: "הטען",
            topupPlaceholder: "סכום להטענה",
            bonuses: "בונוסים",
            bonusNote: "(זמין בעוד 6 חודשים)",
            anonymous: "משתמש אנונימי",
            close: "סגור",
            priceNote: "* המחיר הסופי עשוי להשתנות"
        },
        ar: {
            whereTo: "إلى أين؟",
            from: "من أين",
            to: "إلى أين",
            fromPlaceholder: "موقعك",
            toPlaceholder: "أدخل عنوان الوجهة",
            swap: "تبديل",
            km: "كم",
            min: "دقائق",
            buildRoute: "بناء المسار",
            orderTaxi: "طلب سيارة أجرة",
            myWallet: "محفظتي",
            topup: "شحن",
            topupPlaceholder: "مبلغ الشحن",
            bonuses: "مكافآت",
            bonusNote: "(متاحة بعد 6 أشهر)",
            anonymous: "مستخدم مجهول",
            close: "إغلاق",
            priceNote: "* السعر النهائي قد يختلف"
        },
        en: {
            whereTo: "Where to?",
            from: "From",
            to: "To",
            fromPlaceholder: "Your location",
            toPlaceholder: "Enter destination address",
            swap: "Swap",
            km: "km",
            min: "min",
            buildRoute: "Build route",
            orderTaxi: "Order taxi",
            myWallet: "My wallet",
            topup: "Top up",
            topupPlaceholder: "Amount to top up",
            bonuses: "Bonuses",
            bonusNote: "(available in 6 months)",
            anonymous: "Anonymous user",
            close: "Close",
            priceNote: "* Final price may vary"
        }
    };

    let currentLang = 'en';

    function switchLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                el.textContent = t[key];
            }
        });

        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (t[key]) {
                el.placeholder = t[key];
            }
        });

        if (lang === 'ar' || lang === 'he') {
            document.body.setAttribute('dir', 'rtl');
            document.documentElement.lang = lang;
        } else {
            document.body.setAttribute('dir', 'ltr');
            document.documentElement.lang = 'en';
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-lang') === lang) {
                btn.classList.add('active');
            }
        });

        localStorage.setItem('wheel_client_lang', lang);
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const lang = btn.getAttribute('data-lang');
            switchLanguage(lang);
        });
    });

    const savedLang = localStorage.getItem('wheel_client_lang');
    if (savedLang && translations[savedLang]) {
        switchLanguage(savedLang);
    }

    // ============================================================
    // 1. ИНИЦИАЛИЗАЦИЯ КАРТЫ
    // ============================================================
    const map = L.map('map', {
        center: [32.0853, 34.7818],
        zoom: 13,
        zoomControl: false,
    });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19,
    }).addTo(map);

    // ============================================================
    // 2. МАРКЕРЫ
    // ============================================================
    const clientIcon = L.divIcon({
        html: '<div class="marker-client"></div>',
        className: '',
        iconSize: [20, 20],
        iconAnchor: [10, 10],
    });
    const driverIcon = L.divIcon({
        html: '<div class="marker-driver">🚗</div>',
        className: '',
        iconSize: [32, 32],
        iconAnchor: [16, 16],
    });
    const endIcon = L.divIcon({
        html: '<div class="marker-end"></div>',
        className: '',
        iconSize: [16, 16],
        iconAnchor: [8, 8],
    });

    let fromMarker = null;
    let toMarker = null;
    let driverMarker = null;
    let routeControl = null;

    // ============================================================
    // 3. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
    // ============================================================
    let currentUser = null;
    let userDocRef = null;
    let currentPriceRange = null;

    // ============================================================
    // 4. 🔥 РАСЧЁТ ЦЕНЫ С ВИЛКОЙ ±6%
    // ============================================================
    function calculatePriceWithRange(distanceKm) {
        const baseFare = 25;
        const perKm = 1.5;
        const variancePercent = 6;
        
        const basePrice = baseFare + (distanceKm * perKm);
        const variance = basePrice * (variancePercent / 100);
        
        return {
            min: basePrice - variance,
            max: basePrice + variance,
            average: basePrice,
            minDisplay: (basePrice - variance).toFixed(2),
            maxDisplay: (basePrice + variance).toFixed(2),
            display: `${(basePrice - variance).toFixed(2)} – ${(basePrice + variance).toFixed(2)}`
        };
    }

    function updatePriceDisplay(distanceKm) {
        const range = calculatePriceWithRange(distanceKm);
        currentPriceRange = range;
        
        document.getElementById('priceDisplay').textContent = range.average.toFixed(2);
        document.getElementById('priceRangeDisplay').textContent = range.display + ' ₪';
        document.getElementById('varianceHint').textContent = `±${6}% от стоимости`;
        document.getElementById('tripInfo').classList.add('active');
        document.getElementById('orderBtn').classList.add('active');
    }

    // ============================================================
    // 5. АВТОДОПОЛНЕНИЕ АДРЕСОВ
    // ============================================================
    async function getAddressSuggestions(query) {
        if (!query || query.length < 2) return [];
        try {
            const langMap = { he: 'he', ar: 'ar', en: 'en' };
            const lang = langMap[currentLang] || 'en';
            const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=6&accept-language=${lang}&addressdetails=1`;
            const response = await fetch(url);
            const data = await response.json();
            
            return data.map(item => ({
                display_name: item.display_name,
                lat: parseFloat(item.lat),
                lng: parseFloat(item.lon),
                type: item.type,
                class: item.class,
                address: item.address || {}
            }));
        } catch (error) {
            console.error('Suggestions error:', error);
            return [];
        }
    }

    function showSuggestions(inputId, suggestions) {
        const listId = inputId === 'fromInput' ? 'fromSuggestions' : 'toSuggestions';
        const list = document.getElementById(listId);
        const input = document.getElementById(inputId);
        
        if (!suggestions || suggestions.length === 0) {
            list.classList.remove('active');
            list.innerHTML = '';
            return;
        }

        list.innerHTML = '';
        suggestions.forEach(item => {
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            
            let icon = '📍';
            if (item.class === 'highway') icon = '🛣️';
            else if (item.class === 'amenity') icon = '🏪';
            else if (item.class === 'place') icon = '🏙️';
            else if (item.class === 'building') icon = '🏢';
            else if (item.type === 'street') icon = '🛤️';
            
            const query = input.value.toLowerCase();
            const displayName = item.display_name;
            const index = displayName.toLowerCase().indexOf(query);
            let highlighted = displayName;
            if (index !== -1 && query.length > 1) {
                const before = displayName.substring(0, index);
                const match = displayName.substring(index, index + query.length);
                const after = displayName.substring(index + query.length);
                highlighted = before + '<span class="highlight">' + match + '</span>' + after;
            }
            
            div.innerHTML = `<i>${icon}</i> ${highlighted}`;
            div.dataset.lat = item.lat;
            div.dataset.lng = item.lng;
            div.dataset.address = item.display_name;
            
            div.addEventListener('click', () => {
                input.value = item.display_name;
                input.dataset.lat = item.lat;
                input.dataset.lng = item.lng;
                input.dataset.address = item.display_name;
                list.classList.remove('active');
                list.innerHTML = '';
                
                if (inputId === 'toInput') {
                    buildRoute();
                }
            });
            
            list.appendChild(div);
        });
        
        list.classList.add('active');
    }

    // ============================================================
    // 6. ОБРАБОТЧИКИ ВВОДА
    // ============================================================
    let fromTimeout = null;
    let toTimeout = null;

    document.getElementById('fromInput').addEventListener('input', function(e) {
        clearTimeout(fromTimeout);
        const query = this.value;
        if (query.length < 2) {
            document.getElementById('fromSuggestions').classList.remove('active');
            return;
        }
        fromTimeout = setTimeout(async () => {
            const suggestions = await getAddressSuggestions(query);
            showSuggestions('fromInput', suggestions);
        }, 300);
    });

    document.getElementById('toInput').addEventListener('input', function(e) {
        clearTimeout(toTimeout);
        const query = this.value;
        if (query.length < 2) {
            document.getElementById('toSuggestions').classList.remove('active');
            return;
        }
        toTimeout = setTimeout(async () => {
            const suggestions = await getAddressSuggestions(query);
            showSuggestions('toInput', suggestions);
        }, 300);
    });

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.address-group')) {
            document.querySelectorAll('.suggestions-list').forEach(el => {
                el.classList.remove('active');
            });
        }
    });

    // ============================================================
    // 7. FIREBASE АВТОРИЗАЦИЯ
    // ============================================================
    async function initFirebaseAuth() {
        const auth = window.firebaseAuth;
        const signInAnon = window.signInAnonymously;
        const onAuth = window.onAuthStateChanged;

        onAuth(auth, async (user) => {
            if (user) {
                currentUser = user;
                console.log('✅ Авторизован:', user.uid);
                await initUserWallet(user.uid);
                updateWalletUI();
                document.getElementById('userInfo').textContent = `🔑 ID: ${user.uid.slice(0, 12)}...`;
            } else {
                try {
                    const cred = await signInAnon(auth);
                    currentUser = cred.user;
                    console.log('✅ Анонимный вход:', currentUser.uid);
                    await initUserWallet(currentUser.uid);
                    updateWalletUI();
                } catch (error) {
                    console.error('❌ Ошибка анонимного входа:', error);
                    showStatus('❌ Ошибка подключения к серверу', 'error');
                }
            }
        });
    }

    // ============================================================
    // 8. КОШЕЛЁК
    // ============================================================
    async function initUserWallet(uid) {
        const db = window.firebaseDb;
        const docFn = window.doc;
        const getDocFn = window.getDoc;
        const setDocFn = window.setDoc;

        const userRef = docFn(db, 'users', uid);
        userDocRef = userRef;

        const docSnap = await getDocFn(userRef);

        if (!docSnap.exists()) {
            await setDocFn(userRef, {
                wallet: 0,
                bonuses: 0,
                bonusesAvailable: false,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
            });
            console.log('🆕 Создан кошелёк для:', uid);
        }
        return userRef;
    }

    async function getWalletData() {
        if (!userDocRef) return null;
        const getDocFn = window.getDoc;
        const docSnap = await getDocFn(userDocRef);
        return docSnap.exists() ? docSnap.data() : null;
    }

    async function updateWalletUI() {
        const data = await getWalletData();
        if (data) {
            document.getElementById('walletDisplay').textContent = (data.wallet || 0).toFixed(0);
            document.getElementById('modalBalance').textContent = (data.wallet || 0).toFixed(0);
            document.getElementById('bonusDisplay').textContent = (data.bonuses || 0).toFixed(2);
        }
    }

    document.getElementById('topupBtn').addEventListener('click', async () => {
        const input = document.getElementById('topupInput');
        const amount = parseFloat(input.value);
        if (!amount || amount <= 0) {
            alert('Введите сумму пополнения');
            return;
        }

        try {
            const updateDocFn = window.updateDoc;
            const incrementFn = window.increment;
            await updateDocFn(userDocRef, {
                wallet: incrementFn(amount),
                updatedAt: new Date().toISOString(),
            });
            await updateWalletUI();
            input.value = '';
            showStatus(`💰 Кошелёк пополнен на ${amount} ₪`, 'success');
            setTimeout(() => clearStatus(), 2000);
        } catch (error) {
            showStatus('❌ Ошибка пополнения: ' + error.message, 'error');
        }
    });

    // ============================================================
    // 9. ГЕОЛОКАЦИЯ
    // ============================================================
    async function reverseGeocode(lat, lng) {
        try {
            const langMap = { he: 'he', ar: 'ar', en: 'en' };
            const lang = langMap[currentLang] || 'en';
            const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=${lang}&zoom=16`;
            const response = await fetch(url);
            const data = await response.json();
            if (data && data.display_name) {
                const parts = data.display_name.split(', ');
                let address = parts.slice(0, 3).join(', ');
                if (data.address && data.address.house_number) {
                    const street = data.address.road || data.address.street || '';
                    const house = data.address.house_number || '';
                    if (street && house) address = `${street} ${house}`;
                }
                return address.length < 5 ? data.display_name : address;
            }
            return `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        } catch (error) {
            return `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        }
    }

    function getCurrentPosition() {
        showStatus('⏳ Определяем ваше местоположение...', 'info');

        if (!navigator.geolocation) {
            showStatus('❌ Браузер не поддерживает геолокацию', 'error');
            return;
        }

        navigator.geolocation.getCurrentPosition(
            async (pos) => {
                const { latitude, longitude } = pos.coords;
                const latlng = [latitude, longitude];

                map.setView(latlng, 15);

                if (fromMarker) map.removeLayer(fromMarker);
                fromMarker = L.marker(latlng, { icon: clientIcon })
                    .addTo(map)
                    .bindPopup('📍 Вы здесь');

                const address = await reverseGeocode(latitude, longitude);
                document.getElementById('fromInput').value = address;
                document.getElementById('fromInput').dataset.lat = latitude;
                document.getElementById('fromInput').dataset.lng = longitude;
                document.getElementById('fromInput').dataset.address = address;

                showStatus('✅ Геопозиция определена!', 'success');
                setTimeout(() => clearStatus(), 2000);
            },
            (err) => {
                showStatus(`❌ Ошибка: ${err.message}`, 'error');
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    // ============================================================
    // 10. ПОСТРОЕНИЕ МАРШРУТА
    // ============================================================
    async function geocode(address) {
        try {
            const langMap = { he: 'he', ar: 'ar', en: 'en' };
            const lang = langMap[currentLang] || 'en';
            const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&limit=1&accept-language=${lang}`;
            const response = await fetch(url);
            const data = await response.json();
            if (data && data.length > 0) {
                return {
                    lat: parseFloat(data[0].lat),
                    lng: parseFloat(data[0].lon),
                    display_name: data[0].display_name
                };
            }
            return null;
        } catch (error) {
            return null;
        }
    }

    async function buildRoute() {
        const fromInput = document.getElementById('fromInput');
        const toInput = document.getElementById('toInput');

        let fromLat = parseFloat(fromInput.dataset.lat);
        let fromLng = parseFloat(fromInput.dataset.lng);
        let fromAddress = fromInput.dataset.address || fromInput.value;

        if (!fromLat || !fromLng) {
            const geocodeResult = await geocode(fromInput.value);
            if (geocodeResult) {
                fromLat = geocodeResult.lat;
                fromLng = geocodeResult.lng;
                fromAddress = geocodeResult.display_name;
                fromInput.dataset.lat = fromLat;
                fromInput.dataset.lng = fromLng;
                fromInput.dataset.address = fromAddress;
            } else {
                showStatus('❌ Не удалось определить адрес "Откуда"', 'error');
                return;
            }
        }

        let toLat, toLng, toAddress = toInput.value;
        const geocodeResult = await geocode(toInput.value);
        if (geocodeResult) {
            toLat = geocodeResult.lat;
            toLng = geocodeResult.lng;
            toAddress = geocodeResult.display_name;
        } else {
            showStatus('❌ Не удалось определить адрес "Куда"', 'error');
            return;
        }

        showStatus('⏳ Строим маршрут...', 'info');

        if (routeControl) {
            map.removeControl(routeControl);
            routeControl = null;
        }

        routeControl = L.Routing.control({
            waypoints: [L.latLng(fromLat, fromLng), L.latLng(toLat, toLng)],
            routeWhileDragging: false,
            showAlternatives: false,
            lineOptions: {
                styles: [{ color: '#ffb000', weight: 4, opacity: 0.9 }],
                extendToWaypoints: true,
                missingRouteTolerance: 10,
            },
            addWaypoints: false,
            draggableWaypoints: false,
            fitSelectedRoutes: true,
            show: false,
        }).addTo(map);

        routeControl.on('routesfound', function(e) {
            const routes = e.routes;
            const summary = routes[0].summary;
            const distanceKm = summary.totalDistance / 1000;
            const durationMin = Math.round(summary.totalTime / 60);

            document.getElementById('distanceDisplay').textContent = distanceKm.toFixed(1);
            document.getElementById('durationDisplay').textContent = durationMin;

            // 🔥 Обновляем цену с вилкой
            updatePriceDisplay(distanceKm);

            if (toMarker) map.removeLayer(toMarker);
            toMarker = L.marker([toLat, toLng], { icon: endIcon })
                .addTo(map)
                .bindPopup('📍 ' + toAddress);

            fromInput.dataset.address = fromAddress;
            fromInput.value = fromAddress;
            toInput.dataset.address = toAddress;
            toInput.value = toAddress;

            showStatus(`✅ Маршрут построен! ${distanceKm.toFixed(1)} км, ~${durationMin} мин`, 'success');
            setTimeout(() => clearStatus(), 3000);
        });

        routeControl.on('routingerror', function(e) {
            showStatus('❌ Не удалось построить маршрут', 'error');
        });
    }

    // ============================================================
    // 11. СОЗДАНИЕ ЗАКАЗА (с вилкой цены)
    // ============================================================
    async function createOrder() {
        const fromInput = document.getElementById('fromInput');
        const toInput = document.getElementById('toInput');

        const fromLat = parseFloat(fromInput.dataset.lat);
        const fromLng = parseFloat(fromInput.dataset.lng);
        const fromAddress = fromInput.dataset.address || fromInput.value;

        const toLat = parseFloat(toInput.dataset.lat);
        const toLng = parseFloat(toInput.dataset.lng);
        const toAddress = toInput.dataset.address || toInput.value;

        if (!fromLat || !fromLng || !toLat || !toLng) {
            showStatus('❌ Сначала постройте маршрут', 'error');
            return;
        }

        const distance = parseFloat(document.getElementById('distanceDisplay').textContent);
        const priceRange = calculatePriceWithRange(distance);
        // Используем среднюю цену для списания
        const priceToCharge = priceRange.average;

        const walletData = await getWalletData();
        if (!walletData || walletData.wallet < priceToCharge) {
            showStatus(`❌ Недостаточно средств. Нужно ~${priceToCharge.toFixed(2)} ₪, доступно ${(walletData?.wallet || 0).toFixed(2)} ₪`, 'error');
            return;
        }

        try {
            const db = window.firebaseDb;
            const collectionFn = window.collection;
            const addDocFn = window.addDoc;
            const incrementFn = window.increment;
            const runTransactionFn = window.runTransaction;

            await runTransactionFn(db, async (transaction) => {
                const userSnap = await transaction.get(userDocRef);
                if (!userSnap.exists()) throw new Error('Пользователь не найден');
                if ((userSnap.data().wallet || 0) < priceToCharge) {
                    throw new Error('Недостаточно средств');
                }
                transaction.update(userDocRef, {
                    wallet: incrementFn(-priceToCharge),
                    updatedAt: new Date().toISOString(),
                });
            });

            const ordersRef = collectionFn(db, 'orders');
            const orderData = {
                clientId: currentUser ? currentUser.uid : 'anonymous',
                from: { lat: fromLat, lng: fromLng, address: fromAddress },
                to: { lat: toLat, lng: toLng, address: toAddress },
                price: priceToCharge,
                priceMin: priceRange.min,
                priceMax: priceRange.max,
                distance: distance,
                status: 'waiting',
                createdAt: new Date().toISOString(),
                timestamp: serverTimestamp(),
            };

            const docRef = await addDocFn(ordersRef, orderData);
            console.log('📦 Заказ сохранён:', docRef.id, orderData);

            const bonusAmount = priceToCharge * 0.01;
            const updateDocFn2 = window.updateDoc;
            const incrementFn2 = window.increment;
            await updateDocFn2(userDocRef, {
                bonuses: incrementFn2(bonusAmount),
                updatedAt: new Date().toISOString(),
            });

            await updateWalletUI();
            showStatus(`✅ Заказ создан! Бонус: ${bonusAmount.toFixed(2)} ₪`, 'success');

            // Демонстрация машины
            if (driverMarker) map.removeLayer(driverMarker);
            driverMarker = L.marker([fromLat, fromLng], { icon: driverIcon })
                .addTo(map)
                .bindPopup('🚗 Водитель назначен');

            let progress = 0;
            const interval = setInterval(() => {
                progress += 0.02;
                if (progress > 1) {
                    clearInterval(interval);
                    showStatus('🚗 Водитель прибыл!', 'success');
                    return;
                }
                const lat = fromLat + (toLat - fromLat) * progress;
                const lng = fromLng + (toLng - fromLng) * progress;
                driverMarker.setLatLng([lat, lng]);
            }, 200);

            document.getElementById('orderBtn').disabled = true;
            document.getElementById('orderBtn').textContent = '⏳ Водитель едет...';

            setTimeout(() => {
                document.getElementById('orderBtn').disabled = false;
                document.getElementById('orderBtn').innerHTML = '<i class="fas fa-taxi"></i> Заказать такси';
            }, 8000);

        } catch (error) {
            showStatus('❌ Ошибка: ' + error.message, 'error');
        }
    }

    // ============================================================
    // 12. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function showStatus(msg, type = 'info') {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.className = 'status-msg active ' + type;
    }

    function clearStatus() {
        document.getElementById('statusMsg').className = 'status-msg';
    }

    function clearRoute() {
        if (routeControl) { map.removeControl(routeControl); routeControl = null; }
        if (toMarker) { map.removeLayer(toMarker); toMarker = null; }
        if (driverMarker) { map.removeLayer(driverMarker); driverMarker = null; }
        document.getElementById('tripInfo').classList.remove('active');
        document.getElementById('orderBtn').classList.remove('active');
        document.getElementById('orderBtn').disabled = false;
        document.getElementById('orderBtn').innerHTML = '<i class="fas fa-taxi"></i> Заказать такси';
        clearStatus();
    }

    function swapAddresses() {
        const fromInput = document.getElementById('fromInput');
        const toInput = document.getElementById('toInput');
        const tempText = fromInput.value;
        fromInput.value = toInput.value;
        toInput.value = tempText;
        const tempLat = fromInput.dataset.lat, tempLng = fromInput.dataset.lng, tempAddr = fromInput.dataset.address;
        fromInput.dataset.lat = toInput.dataset.lat; fromInput.dataset.lng = toInput.dataset.lng; fromInput.dataset.address = toInput.dataset.address;
        toInput.dataset.lat = tempLat; toInput.dataset.lng = tempLng; toInput.dataset.address = tempAddr;
        if (fromMarker && toMarker) {
            const f = fromMarker.getLatLng(), t = toMarker.getLatLng();
            fromMarker.setLatLng(t); toMarker.setLatLng(f);
        }
        clearRoute();
    }

    function serverTimestamp() { return new Date().toISOString(); }
    window.serverTimestamp = serverTimestamp;

    // ============================================================
    // 13. ОБРАБОТЧИКИ
    // ============================================================
    document.getElementById('geoFromBtn').addEventListener('click', getCurrentPosition);
    document.getElementById('buildRouteBtn').addEventListener('click', buildRoute);
    document.getElementById('clearRouteBtn').addEventListener('click', clearRoute);
    document.getElementById('swapBtn').addEventListener('click', swapAddresses);
    document.getElementById('orderBtn').addEventListener('click', createOrder);

    document.getElementById('walletBtn').addEventListener('click', () => {
        document.getElementById('walletModal').classList.add('active');
        updateWalletUI();
    });
    document.getElementById('closeWalletModal').addEventListener('click', () => {
        document.getElementById('walletModal').classList.remove('active');
    });
    document.getElementById('walletModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) {
            document.getElementById('walletModal').classList.remove('active');
        }
    });

    // ============================================================
    // 14. ЗАПУСК
    // ============================================================
    window.addEventListener('load', () => {
        initFirebaseAuth();
        setTimeout(getCurrentPosition, 800);
        console.log('🚗 WHEEL Client loaded');
    });
</script>

</body>
