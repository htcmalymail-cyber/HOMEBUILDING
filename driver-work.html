<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Работа водителя — WHEEL</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">
    </script>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0c10;
            min-height: 100vh;
            padding: 12px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.05) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.04) 0%, transparent 45%);
            background-attachment: fixed;
            color: #ffffff;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
        }
        .header-title span {
            color: #ffb000;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8899aa;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .status-badge {
            padding: 4px 14px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-badge.online {
            background: rgba(74, 222, 128, 0.12);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.15);
        }
        .status-badge.offline {
            background: rgba(102, 119, 136, 0.1);
            color: #667788;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .status-badge.busy {
            background: rgba(255, 180, 0, 0.12);
            color: #ffb000;
            border: 1px solid rgba(255, 180, 0, 0.15);
        }

        /* ===== КАРТА ===== */
        #map {
            height: 320px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
            overflow: hidden;
            background: #11151a;
        }

        .leaflet-control-attribution {
            font-size: 8px !important;
            color: #667788 !important;
        }

        /* Легенда карты */
        .map-legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(18, 22, 28, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 11px;
            z-index: 1000;
            pointer-events: none;
        }
        .map-legend .item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 0;
        }
        .map-legend .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-block;
        }
        .map-legend .dot.green {
            background: #4ade80;
        }
        .map-legend .dot.red {
            background: #ff6b6b;
        }
        .map-legend .dot.blue {
            background: #60a5fa;
        }

        /* ===== ИНФО-ПАНЕЛЬ ===== */
        .info-panel {
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .info-row:last-child {
            border-bottom: none;
        }

        .info-row .label {
            color: #8899aa;
            font-weight: 400;
        }
        .info-row .value {
            font-weight: 500;
            color: #e0e8f0;
            text-align: right;
        }
        .info-row .value.gold {
            color: #ffb000;
        }
        .info-row .value.green {
            color: #4ade80;
        }
        .info-row .value.red {
            color: #ff6b6b;
        }
        .info-row .value.blue {
            color: #60a5fa;
        }

        /* ===== КАРТОЧКА ЗАКАЗА ===== */
        .order-card {
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .order-card.active {
            border-color: rgba(74, 222, 128, 0.15);
            background: rgba(74, 222, 128, 0.02);
        }

        .order-card .header-order {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .order-card .order-id {
            font-size: 12px;
            font-weight: 500;
            color: #8899aa;
        }
        .order-card .order-id small {
            color: #667788;
        }

        .order-card .price {
            font-size: 18px;
            font-weight: 700;
            color: #ffb000;
        }

        .order-card .route {
            font-size: 14px;
            color: #b0c0d0;
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .order-card .route .arrow {
            color: #667788;
            margin: 0 4px;
        }

        .order-card .meta {
            font-size: 11px;
            color: #667788;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .order-card .distance {
            font-size: 12px;
            color: #60a5fa;
            font-weight: 500;
        }

        /* ===== СТАТУС ПОЕЗДКИ ===== */
        .trip-status {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 8px 12px;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .trip-steps {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .trip-step {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #667788;
            flex: 1;
            justify-content: center;
        }

        .trip-step .icon {
            font-size: 14px;
        }

        .trip-step.active {
            color: #4ade80;
            font-weight: 500;
        }

        .trip-step-line {
            flex: 0.3;
            height: 2px;
            background: #667788;
            border-radius: 2px;
        }

        .trip-step-line.active {
            background: #4ade80;
        }

        /* ===== КНОПКИ ===== */
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
            justify-content: center;
        }

        .btn-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 6px 12px;
            border: none;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            min-width: 50px;
            flex: 0.5;
        }
        .btn-icon:active {
            transform: scale(0.92);
        }
        .btn-icon:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-icon .icon {
            font-size: 22px;
            line-height: 1;
        }
        .btn-icon .label {
            font-size: 9px;
            opacity: 0.8;
        }

        .btn-icon.btn-success {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.15);
        }
        .btn-icon.btn-success:hover:not(:disabled) {
            background: rgba(74, 222, 128, 0.2);
        }

        .btn-icon.btn-danger {
            background: rgba(255, 70, 70, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(255, 70, 70, 0.15);
        }
        .btn-icon.btn-danger:hover:not(:disabled) {
            background: rgba(255, 70, 70, 0.2);
        }

        .btn-icon.btn-warning {
            background: rgba(255, 180, 0, 0.1);
            color: #ffb000;
            border: 1px solid rgba(255, 180, 0, 0.15);
        }
        .btn-icon.btn-warning:hover:not(:disabled) {
            background: rgba(255, 180, 0, 0.2);
        }

        .btn-icon.btn-primary {
            background: rgba(96, 165, 250, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.15);
        }
        .btn-icon.btn-primary:hover:not(:disabled) {
            background: rgba(96, 165, 250, 0.2);
        }

        .btn-icon.btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: #8899aa;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .btn-icon.btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        /* ===== ТАЙМЕР ===== */
        .waiting-timer {
            background: rgba(255, 180, 0, 0.06);
            border: 1px solid rgba(255, 180, 0, 0.1);
            border-radius: 12px;
            padding: 6px 12px;
            margin-top: 6px;
            text-align: center;
            font-size: 12px;
            color: #ffb000;
        }

        .waiting-timer .time {
            font-size: 20px;
            font-weight: 600;
        }
        .waiting-timer .time.warning {
            color: #ff6b6b;
        }

        /* ===== ПУСТО ===== */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #667788;
            font-size: 14px;
        }
        .empty-state .icon {
            font-size: 44px;
            margin-bottom: 6px;
            opacity: 0.5;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #8899aa;
            margin: 6px 0 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ===== ТОСТ ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 22, 28, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px 24px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            z-index: 2000;
            display: none;
            max-width: 88%;
            text-align: center;
        }
        .toast.show {
            display: block;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
        }
        .toast.error {
            border-color: rgba(255, 70, 70, 0.15);
        }
        .toast.warning {
            border-color: rgba(255, 180, 0, 0.15);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            body {
                padding: 8px;
            }
            .header {
                padding: 8px 12px;
            }
            .header-title {
                font-size: 16px;
            }
            #map {
                height: 250px;
            }
            .info-panel {
                padding: 8px 12px;
                gap: 2px 8px;
            }
            .info-row {
                font-size: 12px;
            }
            .btn-icon {
                padding: 4px 8px;
                min-width: 40px;
            }
            .btn-icon .icon {
                font-size: 18px;
            }
            .btn-icon .label {
                font-size: 8px;
            }
            .order-card {
                padding: 12px;
            }
            .order-card .price {
                font-size: 16px;
            }
            .order-card .route {
                font-size: 13px;
            }
            .waiting-timer .time {
                font-size: 18px;
            }
            .trip-step {
                font-size: 10px;
            }
            .trip-step .icon {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <span id="toastMessage">Сообщение</span>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // FIREBASE КОНФИГ
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        console.log('🔥 Firebase готов');

        // ============================================================
        // ПЕРЕМЕННЫЕ
        // ============================================================
        let currentUser = null;
        let userData = null;
        let driverLocation = null;
        let lastSentLocation = null;
        let availableOrders = [];
        let activeOrder = null;
        let map = null;
        let driverMarker = null;
        let clientMarker = null;
        let destinationMarker = null;
        let routeLine = null;
        let watchId = null;
        let isOnline = true;
        let unsubAvailableOrders = null;
        let unsubActiveOrder = null;
        let unsubUser = null;
        let waitingTimerInterval = null;
        let waitingStartTime = null;
        let isWaitingForClient = false;
        let routePoints = [];
        let isTracking = false;
        let locationUpdateInterval = 30000; // 30 секунд
        let lastLocationUpdateTime = 0;
        let isFirstLocation = true;

        // ============================================================
        // ЭЛЕМЕНТЫ
        // ============================================================
        const el = {
            backBtn: document.getElementById('backBtn'),
            statusBadge: document.getElementById('statusBadge'),
            driverName: document.getElementById('driverName'),
            driverStatusText: document.getElementById('driverStatusText'),
            locationUpdate: document.getElementById('locationUpdate'),
            ordersAvailableCount: document.getElementById('ordersAvailableCount'),
            availableOrdersList: document.getElementById('availableOrdersList'),
            activeOrderCard: document.getElementById('activeOrderCard'),
            activeOrderTitle: document.getElementById('activeOrderTitle'),
            onlineBtn: document.getElementById('onlineBtn'),
            offlineBtn: document.getElementById('offlineBtn'),
            refreshLocationBtn: document.getElementById('refreshLocationBtn'),
            refreshBtn: document.getElementById('refreshBtn'),
            toast: document.getElementById('toast'),
            toastMessage: document.getElementById('toastMessage'),
            map: document.getElementById('map')
        };

        // ============================================================
        // ТОАСТ
        // ============================================================
        let toastTimeout = null;

        function showToast(text, type = 'info') {
            el.toast.className = 'toast show ' + type;
            el.toastMessage.textContent = text;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                el.toast.className = 'toast';
            }, 3500);
        }

        // ============================================================
        // ФУНКЦИИ
        // ============================================================
        function formatPrice(p) {
            return (p || 0).toFixed(2) + ' ₪';
        }

        function formatDate(ts) {
            if (!ts) return '—';
            try {
                const d = ts.toDate ? ts.toDate() : new Date(ts);
                return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            } catch {
                return '—';
            }
        }

        function haversineDistance(lat1, lng1, lat2, lng2) {
            if (!lat1 || !lng1 || !lat2 || !lng2) return Infinity;
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function getStatusText(order) {
            const statusMap = {
                'new': 'Новый',
                'searching': 'Поиск',
                'assigned': 'Назначен',
                'in_progress': 'В пути',
                'completed': 'Завершён',
                'cancelled': 'Отменён'
            };
            return statusMap[order.status] || order.status;
        }

        // ============================================================
        // КАРТА
        // ============================================================
        function initMap() {
            map = L.map('map').setView([32.0853, 34.7818], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19,
                minZoom: 10
            }).addTo(map);

            // Добавляем легенду
            const legend = L.control({ position: 'bottomright' });
            legend.onAdd = function() {
                const div = L.DomUtil.create('div', 'map-legend');
                div.innerHTML = `
                        <div class="item"><span class="dot blue"></span> 🚗 Водитель</div>
                        <div class="item"><span class="dot green"></span> 🟢 Клиент</div>
                        <div class="item"><span class="dot red"></span> 🔴 Назначение</div>
                    `;
                return div;
            };
            legend.addTo(map);

            console.log('🗺️ Карта инициализирована');
        }

        // ============================================================
        // СОЗДАНИЕ КАСТОМНЫХ МАРКЕРОВ
        // ============================================================
        function createDriverIcon() {
            return L.divIcon({
                html: '🚗',
                className: '',
                iconSize: [32, 32],
                iconAnchor: [16, 32],
                popupAnchor: [0, -32]
            });
        }

        function createClientIcon() {
            return L.divIcon({
                html: '🟢',
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 30],
                popupAnchor: [0, -30]
            });
        }

        function createDestinationIcon() {
            return L.divIcon({
                html: '🔴',
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 30],
                popupAnchor: [0, -30]
            });
        }

        // ============================================================
        // ГЕОЛОКАЦИЯ ВОДИТЕЛЯ (С ОГРАНИЧЕНИЕМ ПО ВРЕМЕНИ)
        // ============================================================
        function shouldUpdateLocation() {
            const now = Date.now();
            if (isFirstLocation) {
                isFirstLocation = false;
                return true;
            }
            return (now - lastLocationUpdateTime) >= locationUpdateInterval;
        }

        function updateDriverLocation(lat, lng) {
            if (!shouldUpdateLocation() && !isFirstLocation) {
                // Обновляем только маркер на карте, но не отправляем в БД
                if (driverMarker) {
                    driverMarker.setLatLng([lat, lng]);
                }
                return;
            }

            driverLocation = { lat, lng };
            lastLocationUpdateTime = Date.now();

            // Обновляем время последнего обновления
            const timeStr = new Date().toLocaleTimeString();
            el.locationUpdate.textContent = timeStr;

            // Обновляем маркер на карте
            if (driverMarker) {
                driverMarker.setLatLng([lat, lng]);
            } else {
                const icon = createDriverIcon();
                driverMarker = L.marker([lat, lng], { icon: icon })
                    .addTo(map)
                    .bindPopup('🚗 Вы здесь');
            }

            // Центрируем карту на водителе (только если нет активного маршрута)
            if (!activeOrder) {
                map.setView([lat, lng], 15);
            }

            // Сохраняем в Firebase ТОЛЬКО если изменилось значительно (более 50 метров)
            if (currentUser && shouldSendToFirebase(lat, lng)) {
                db.collection('users').doc(currentUser.uid).update({
                    'driverData.location': { lat, lng },
                    'driverData.lastUpdated': firebase.firestore.FieldValue.serverTimestamp()
                }).catch(err => console.error('Ошибка обновления локации:', err));
            }

            // Обновляем активные заказы
            loadAvailableOrders();
            loadActiveOrder();
            updateActiveOrderMarkers();

            // Сохраняем трек
            if (isTracking && activeOrder) {
                routePoints.push({ lat, lng, timestamp: new Date().toISOString() });
                updateRouteLine();
            }
        }

        // Проверяем, нужно ли отправлять в Firebase (экономия запросов)
        function shouldSendToFirebase(lat, lng) {
            if (!lastSentLocation) return true;
            const dist = haversineDistance(
                lat, lng,
                lastSentLocation.lat, lastSentLocation.lng
            );
            // Отправляем только если сместились более чем на 50 метров
            if (dist > 0.05) {
                lastSentLocation = { lat, lng };
                return true;
            }
            return false;
        }

        // ============================================================
        // GPS (С ОГРАНИЧЕНИЕМ ПО ВРЕМЕНИ)
        // ============================================================
        function startGeolocation() {
            if (!navigator.geolocation) {
                showToast('❌ GPS не поддерживается', 'error');
                return;
            }

            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            // Первое обновление сразу
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    isFirstLocation = true;
                    updateDriverLocation(lat, lng);
                },
                function(error) {
                    console.error('GPS первичная ошибка:', error);
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );

            // Затем регулярные обновления с интервалом
            watchId = navigator.geolocation.watchPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    updateDriverLocation(lat, lng);
                },
                function(error) {
                    console.error('GPS ошибка:', error);
                }, {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 10000,
                    // Важно: не обновляем чаще чем раз в 30 секунд
                }
            );

            // Принудительное обновление каждые 30 секунд даже если GPS не дал новые данные
            setInterval(() => {
                if (driverLocation) {
                    // Просто обновляем время последнего обновления
                    const timeStr = new Date().toLocaleTimeString();
                    el.locationUpdate.textContent = timeStr + ' (последнее)';
                }
            }, locationUpdateInterval);

            console.log(`📍 GPS запущен с интервалом ${locationUpdateInterval/1000} секунд`);
        }

        // ============================================================
        // ЗАГРУЗКА ДОСТУПНЫХ ЗАКАЗОВ
        // ============================================================
        function loadAvailableOrders() {
            if (unsubAvailableOrders) {
                unsubAvailableOrders();
                unsubAvailableOrders = null;
            }

            const q = db.collection('orders')
                .where('status', 'in', ['new', 'searching'])
                .orderBy('createdAt', 'desc');

            unsubAvailableOrders = q.onSnapshot(function(snapshot) {
                availableOrders = [];
                snapshot.forEach(function(doc) {
                    const data = doc.data();
                    let distance = null;
                    if (driverLocation && data.pickup && data.pickup.lat && data.pickup.lng) {
                        distance = haversineDistance(
                            driverLocation.lat, driverLocation.lng,
                            data.pickup.lat, data.pickup.lng
                        );
                    }
                    availableOrders.push({
                        id: doc.id,
                        ...data,
                        distance: distance
                    });
                });

                // Сортируем по расстоянию
                availableOrders.sort((a, b) => (a.distance || Infinity) - (b.distance || Infinity));
                renderAvailableOrders();
                updateQueueCount();

            }, function(error) {
                console.error('Ошибка загрузки доступных заказов:', error);
            });
        }

        // ============================================================
        // ЗАГРУЗКА АКТИВНОГО ЗАКАЗА
        // ============================================================
        function loadActiveOrder() {
            if (unsubActiveOrder) {
                unsubActiveOrder();
                unsubActiveOrder = null;
            }

            if (!currentUser) return;

            const q = db.collection('orders')
                .where('driverId', '==', currentUser.uid)
                .where('status', 'in', ['assigned', 'in_progress']);

            unsubActiveOrder = q.onSnapshot(function(snapshot) {
                let found = null;
                snapshot.forEach(function(doc) {
                    const data = doc.data();
                    found = { id: doc.id, ...data };
                });

                if (found) {
                    activeOrder = found;
                    renderActiveOrder(found);
                    el.activeOrderTitle.style.display = 'block';
                    updateActiveOrderMarkers();

                    if (found.status === 'in_progress' && !isTracking) {
                        startTracking();
                    }

                    if (found.status === 'assigned' && !isWaitingForClient) {
                        startWaitingTimer(found);
                    }

                    // Меняем статус водителя на "Занят"
                    if (isOnline) {
                        el.statusBadge.className = 'status-badge busy';
                        el.statusBadge.textContent = '🟡 Занят';
                        el.driverStatusText.textContent = 'Выполняет заказ';
                    }

                } else {
                    activeOrder = null;
                    el.activeOrderCard.innerHTML = '';
                    el.activeOrderTitle.style.display = 'none';
                    clearOrderMarkers();
                    stopWaitingTimer();
                    stopTracking();

                    // Возвращаем статус
                    if (isOnline) {
                        el.statusBadge.className = 'status-badge online';
                        el.statusBadge.textContent = '🟢 Онлайн';
                        el.driverStatusText.textContent = 'Ожидание';
                    }
                }

            }, function(error) {
                console.error('Ошибка подписки на активный заказ:', error);
            });
        }

        // ============================================================
        // GPS-ТРЕК
        // ============================================================
        function startTracking() {
            console.log('📍 Начинаем запись GPS-трека');
            isTracking = true;
            routePoints = [];
            if (driverLocation) {
                routePoints.push({
                    lat: driverLocation.lat,
                    lng: driverLocation.lng,
                    timestamp: new Date().toISOString()
                });
            }
            updateRouteLine();
        }

        function stopTracking() {
            console.log('📍 Останавливаем запись GPS-трека');
            isTracking = false;
            if (activeOrder && routePoints.length > 0) {
                db.collection('orders').doc(activeOrder.id).update({
                    routePoints: routePoints,
                    realDistance: calculateRealDistance(routePoints)
                }).catch(err => console.error('Ошибка сохранения трека:', err));
            }
            routePoints = [];
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
        }

        function updateRouteLine() {
            if (!map) return;
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
            if (routePoints.length < 2) return;

            const latlngs = routePoints.map(p => [p.lat, p.lng]);
            routeLine = L.polyline(latlngs, {
                color: '#4ade80',
                weight: 3,
                opacity: 0.7,
                dashArray: '6, 4'
            }).addTo(map);
        }

        function calculateRealDistance(points) {
            let total = 0;
            for (let i = 1; i < points.length; i++) {
                const prev = points[i - 1];
                const curr = points[i];
                total += haversineDistance(prev.lat, prev.lng, curr.lat, curr.lng);
            }
            return total;
        }

        // ============================================================
        // ТАЙМЕР ОЖИДАНИЯ
        // ============================================================
        function startWaitingTimer(order) {
            if (waitingTimerInterval) {
                clearInterval(waitingTimerInterval);
                waitingTimerInterval = null;
            }

            isWaitingForClient = true;
            waitingStartTime = Date.now();
            const WAIT_TIME = 3 * 60;

            const statusDetail = document.getElementById('orderStatusDetail');
            if (statusDetail) {
                statusDetail.innerHTML = `
                        <div class="waiting-timer">
                            ⏳ Ожидание клиента: <span class="time" id="waitingTimerDisplay">3:00</span>
                            <br><span style="font-size:10px; color:#667788;">Клиент не явился → штраф 7 ₪</span>
                        </div>
                    `;
            }

            const noShowBtn = document.getElementById('noShowBtn');
            if (noShowBtn) {
                noShowBtn.disabled = true;
                noShowBtn.innerHTML = `
                        <span class="icon">⏳</span>
                        <span class="label">3:00</span>
                    `;
            }

            waitingTimerInterval = setInterval(() => {
                const elapsed = (Date.now() - waitingStartTime) / 1000;
                const remaining = Math.max(0, WAIT_TIME - elapsed);
                const minutes = Math.floor(remaining / 60);
                const seconds = Math.floor(remaining % 60);

                const display = document.getElementById('waitingTimerDisplay');
                if (display) {
                    display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                    if (remaining < 30) display.classList.add('warning');
                    else display.classList.remove('warning');
                }

                const noShowBtn = document.getElementById('noShowBtn');
                if (noShowBtn && remaining > 0) {
                    noShowBtn.innerHTML = `
                            <span class="icon">⏳</span>
                            <span class="label">${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}</span>
                        `;
                }

                if (remaining <= 0) {
                    clearInterval(waitingTimerInterval);
                    waitingTimerInterval = null;
                    isWaitingForClient = false;

                    const noShowBtn = document.getElementById('noShowBtn');
                    if (noShowBtn) {
                        noShowBtn.disabled = false;
                        noShowBtn.innerHTML = `
                                <span class="icon">👤</span>
                                <span class="label">Не явился</span>
                            `;
                        noShowBtn.className = 'btn-icon btn-danger';
                    }

                    const display = document.getElementById('waitingTimerDisplay');
                    if (display) {
                        display.textContent = '⏰ Время вышло!';
                        display.classList.add('warning');
                    }

                    if (statusDetail) {
                        statusDetail.innerHTML = `
                                <div class="waiting-timer" style="border-color: #ff6b6b;">
                                    ⏰ Время ожидания истекло!
                                    <br><span style="font-size:12px; color:#ff6b6b;">Нажмите «Не явился»</span>
                                </div>
                            `;
                    }

                    showToast('⏰ Время ожидания истекло!', 'warning');
                }
            }, 1000);
        }

        function stopWaitingTimer() {
            if (waitingTimerInterval) {
                clearInterval(waitingTimerInterval);
                waitingTimerInterval = null;
            }
            isWaitingForClient = false;
        }

        // ============================================================
        // МАРКЕРЫ НА КАРТЕ
        // ============================================================
        function updateActiveOrderMarkers() {
            clearOrderMarkers();

            if (!activeOrder) return;

            // Зелёная метка - клиент (отправление)
            if (activeOrder.pickup && activeOrder.pickup.lat && activeOrder.pickup.lng) {
                const icon = createClientIcon();
                clientMarker = L.marker([activeOrder.pickup.lat, activeOrder.pickup.lng], { icon: icon })
                    .addTo(map)
                    .bindPopup(`🟢 Клиент: ${activeOrder.pickup?.address || 'Отправление'}`);
            }

            // Красная метка - назначение
            if (activeOrder.destination && activeOrder.destination.lat && activeOrder.destination.lng) {
                const icon = createDestinationIcon();
                destinationMarker = L.marker([activeOrder.destination.lat, activeOrder.destination.lng], { icon: icon })
                    .addTo(map)
                    .bindPopup(`🔴 Назначение: ${activeOrder.destination?.address || 'Назначение'}`);
            }

            // Показываем маршрут от водителя до клиента (если есть)
            if (driverLocation && clientMarker) {
                const bounds = L.latLngBounds(
                    [driverLocation.lat, driverLocation.lng],
                    [activeOrder.pickup.lat, activeOrder.pickup.lng]
                );
                // Добавляем назначение если есть
                if (destinationMarker) {
                    bounds.extend([activeOrder.destination.lat, activeOrder.destination.lng]);
                }
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        function clearOrderMarkers() {
            if (clientMarker) {
                map.removeLayer(clientMarker);
                clientMarker = null;
            }
            if (destinationMarker) {
                map.removeLayer(destinationMarker);
                destinationMarker = null;
            }
        }

        // ============================================================
        // ПРИНЯТЬ ЗАКАЗ
        // ============================================================
        window.acceptOrder = function(orderId) {
            const order = availableOrders.find(o => o.id === orderId);
            if (!order) {
                showToast('❌ Заказ не найден', 'error');
                return;
            }

            if (!driverLocation) {
                showToast('⚠️ Определите местоположение', 'warning');
                return;
            }

            if (order.distance && order.distance > 10) {
                if (!confirm(`⚠️ Расстояние до клиента ${order.distance.toFixed(1)} км. Вы уверены?`)) {
                    return;
                }
            }

            const orderRef = db.collection('orders').doc(orderId);
            orderRef.update({
                driverId: currentUser.uid,
                driverName: userData?.displayName || 'Водитель',
                status: 'assigned',
                assignedAt: firebase.firestore.FieldValue.serverTimestamp(),
                assignedManually: false,
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'auto',
                    distance: order.distance || null
                })
            }).then(() => {
                showToast(`✅ Вы приняли заказ`, 'success');
                loadActiveOrder();
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        };

        // ============================================================
        // ОТКЛОНИТЬ ЗАКАЗ
        // ============================================================
        window.rejectOrder = function(orderId) {
            if (!confirm('Отклонить заказ?')) return;

            const orderRef = db.collection('orders').doc(orderId);
            orderRef.update({
                status: 'searching',
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'rejected'
                })
            }).then(() => {
                showToast('❌ Заказ отклонён', 'warning');
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        };

        // ============================================================
        // ПРИБЫЛ К КЛИЕНТУ
        // ============================================================
        function arriveToClient(order) {
            if (!driverLocation || !order.pickup || !order.pickup.lat || !order.pickup.lng) {
                showToast('⚠️ Нет данных о местоположении', 'warning');
                return;
            }

            const distance = haversineDistance(
                driverLocation.lat, driverLocation.lng,
                order.pickup.lat, order.pickup.lng
            );

            if (distance > 0.2) {
                showToast(`⚠️ Вы слишком далеко от клиента (${(distance * 1000).toFixed(0)} м)`, 'warning');
                return;
            }

            stopWaitingTimer();

            const orderRef = db.collection('orders').doc(order.id);
            orderRef.update({
                status: 'in_progress',
                startedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                showToast('✅ Вы прибыли к клиенту! Поездка началась.', 'success');
                startTracking();
                loadActiveOrder();
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        }

        // ============================================================
        // КЛИЕНТ НЕ ЯВИЛСЯ
        // ============================================================
        function clientNoShow(order) {
            if (!confirm('⚠️ Клиент не явился. Применить штраф 7 ₪?')) return;

            if (!driverLocation || !order.pickup || !order.pickup.lat || !order.pickup.lng) {
                showToast('⚠️ Нет данных о местоположении', 'warning');
                return;
            }

            const distance = haversineDistance(
                driverLocation.lat, driverLocation.lng,
                order.pickup.lat, order.pickup.lng
            );

            if (distance > 0.2) {
                showToast(`⚠️ Вы слишком далеко от места отправления`, 'warning');
                return;
            }

            const orderRef = db.collection('orders').doc(order.id);
            const PENALTY = 7;

            orderRef.update({
                status: 'cancelled',
                cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
                cancellationReason: 'Клиент не явился',
                penaltyApplied: PENALTY,
                cancelledBy: 'driver_no_show'
            }).then(() => {
                db.collection('users').doc(order.clientId).update({
                    balance: firebase.firestore.FieldValue.increment(-PENALTY),
                    penalty: firebase.firestore.FieldValue.increment(PENALTY)
                }).catch(err => console.error('Ошибка списания штрафа с клиента:', err));

                db.collection('users').doc(currentUser.uid).update({
                    balance: firebase.firestore.FieldValue.increment(PENALTY)
                }).catch(err => console.error('Ошибка начисления компенсации:', err));

                showToast(`✅ Заказ отменён. Штраф ${formatPrice(PENALTY)}`, 'warning');
                stopWaitingTimer();
                stopTracking();
                setTimeout(() => {
                    loadAvailableOrders();
                    loadActiveOrder();
                }, 1000);
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        }

        // ============================================================
        // ПРИБЫЛ К НАЗНАЧЕНИЮ
        // ============================================================
        function arriveToDestination(order) {
            if (!driverLocation || !order.destination || !order.destination.lat || !order.destination.lng) {
                showToast('⚠️ Нет данных о местоположении', 'warning');
                return;
            }

            const distance = haversineDistance(
                driverLocation.lat, driverLocation.lng,
                order.destination.lat, order.destination.lng
            );

            if (distance > 0.2) {
                showToast(`⚠️ Вы слишком далеко от места назначения (${(distance * 1000).toFixed(0)} м)`, 'warning');
                return;
            }

            stopTracking();

            const orderRef = db.collection('orders').doc(order.id);

            const realDistance = calculateRealDistance(routePoints);
            const plannedPrice = order.price || 0;
            const plannedDistance = order.distance || 1;
            const factor = realDistance / plannedDistance;
            const finalPrice = plannedPrice * factor;

            orderRef.update({
                status: 'completed',
                completedAt: firebase.firestore.FieldValue.serverTimestamp(),
                realDistance: realDistance,
                finalPrice: finalPrice,
                routePoints: routePoints
            }).then(() => {
                showToast(`✅ Поездка завершена! ${formatPrice(finalPrice)}`, 'success');
                createOrderTransactions(order, finalPrice);
                stopTracking();
                setTimeout(() => {
                    loadAvailableOrders();
                    loadActiveOrder();
                }, 1000);
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        }

        // ============================================================
        // НАВИГАЦИЯ (Waze)
        // ============================================================
        function openWaze(lat, lng, address, destinationName = '') {
            let wazeLink;
            let fallbackLink;

            if (lat && lng) {
                wazeLink = `waze://?ll=${lat},${lng}&navigate=yes`;
                fallbackLink = `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`;
            } else if (address && address.trim() !== '') {
                wazeLink = `waze://?q=${encodeURIComponent(address)}&navigate=yes`;
                fallbackLink = `https://waze.com/ul?q=${encodeURIComponent(address)}&navigate=yes`;
            } else {
                showToast('⚠️ Нет данных для навигации', 'error');
                return;
            }

            try {
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = wazeLink;
                document.body.appendChild(iframe);

                let opened = false;

                iframe.onload = function() {
                    if (!opened) {
                        opened = true;
                        document.body.removeChild(iframe);
                        showToast(`🧭 Waze открыт к ${destinationName}`, 'success');
                    }
                };

                iframe.onerror = function() {
                    if (!opened) {
                        opened = true;
                        document.body.removeChild(iframe);
                        window.open(fallbackLink, '_blank');
                        showToast(`🧭 Открываем Waze (веб) к ${destinationName}`, 'info');
                    }
                };

                setTimeout(() => {
                    if (!opened) {
                        opened = true;
                        if (document.body.contains(iframe)) {
                            document.body.removeChild(iframe);
                        }
                        window.open(fallbackLink, '_blank');
                        showToast(`🧭 Открываем Waze (веб) к ${destinationName}`, 'info');
                    }
                }, 2500);

            } catch (error) {
                console.error('Ошибка открытия Waze:', error);
                window.open(fallbackLink, '_blank');
                showToast(`🧭 Открываем Waze (веб) к ${destinationName}`, 'info');
            }
        }

        function navigateToClient(order) {
            const lat = order.pickup?.lat;
            const lng = order.pickup?.lng;
            const address = order.pickup?.address;
            openWaze(lat, lng, address, 'клиенту');
        }

        function navigateToDestination(order) {
            const lat = order.destination?.lat;
            const lng = order.destination?.lng;
            const address = order.destination?.address;
            openWaze(lat, lng, address, 'месту назначения');
        }

        // ============================================================
        // ТРАНЗАКЦИИ
        // ============================================================
        function createOrderTransactions(order, finalPrice) {
            const price = finalPrice || order.price || 0;
            const COMMISSION = 0.10;
            const commission = price * COMMISSION;
            const driverEarn = price - commission;

            db.collection('transactions').add({
                userId: currentUser.uid,
                orderId: order.id,
                type: 'earning',
                amount: driverEarn,
                description: `Заработок #${order.id.substring(0, 8)} (90%)`,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                balanceAfter: (userData?.balance || 0) + driverEarn
            }).catch(err => console.error('Ошибка транзакции водителя:', err));

            db.collection('transactions').add({
                userId: order.clientId,
                orderId: order.id,
                type: 'payment',
                amount: -price,
                description: `Оплата #${order.id.substring(0, 8)}`,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                balanceAfter: 0
            }).catch(err => console.error('Ошибка транзакции клиента:', err));

            db.collection('users').doc(currentUser.uid).update({
                balance: firebase.firestore.FieldValue.increment(driverEarn),
                totalEarned: firebase.firestore.FieldValue.increment(driverEarn)
            }).catch(err => console.error('Ошибка обновления баланса водителя:', err));

            db.collection('users').doc(order.clientId).update({
                balance: firebase.firestore.FieldValue.increment(-price),
                totalSpent: firebase.firestore.FieldValue.increment(price)
            }).catch(err => console.error('Ошибка обновления баланса клиента:', err));
        }

        // ============================================================
        // ОТМЕНА ПОЕЗДКИ ВОДИТЕЛЕМ
        // ============================================================
        function cancelDriverOrder(order) {
            if (!confirm('⚠️ Отменить поездку? Возможен штраф 7 ₪.')) return;

            const reason = prompt('Причина отмены:');
            if (reason === null) return;

            const orderRef = db.collection('orders').doc(order.id);
            let penalty = 0;

            if (order.status === 'in_progress') {
                penalty = 7;
            } else if (order.status === 'assigned') {
                if (order.assignedAt) {
                    const assignedTime = order.assignedAt.toDate ? order.assignedAt.toDate() : new Date(order.assignedAt);
                    const elapsed = (Date.now() - assignedTime.getTime()) / 60000;
                    if (elapsed > 2) {
                        penalty = 7;
                    }
                }
            }

            orderRef.update({
                status: 'cancelled',
                cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
                cancellationReason: reason || 'Отменено водителем',
                penaltyApplied: penalty,
                cancelledBy: 'driver'
            }).then(() => {
                if (penalty > 0) {
                    db.collection('users').doc(currentUser.uid).update({
                        balance: firebase.firestore.FieldValue.increment(-penalty),
                        penalty: firebase.firestore.FieldValue.increment(penalty)
                    }).then(() => {
                        showToast(`💰 Списан штраф ${formatPrice(penalty)}`, 'warning');
                    }).catch(err => console.error('Ошибка списания штрафа:', err));
                }

                showToast('❌ Поездка отменена', 'error');
                stopWaitingTimer();
                stopTracking();
                setTimeout(() => {
                    loadAvailableOrders();
                    loadActiveOrder();
                }, 1000);
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        }

        // ============================================================
        // СТАТУС ВОДИТЕЛЯ
        // ============================================================
        function updateQueueCount() {
            el.ordersAvailableCount.textContent = availableOrders.length;
        }

        function setDriverStatus(status) {
            if (!currentUser) return;
            isOnline = (status === 'online');

            const statusMap = {
                'online': { badge: '🟢 Онлайн', text: 'Ожидание' },
                'offline': { badge: '⚪ Офлайн', text: 'Не в сети' },
                'busy': { badge: '🟡 Занят', text: 'Выполняет заказ' }
            };

            const info = statusMap[status] || statusMap['offline'];

            el.statusBadge.className = 'status-badge ' + status;
            el.statusBadge.textContent = info.badge;
            el.driverStatusText.textContent = info.text;

            db.collection('users').doc(currentUser.uid).update({
                'driverData.isAvailable': (status === 'online')
            }).then(() => {
                if (status === 'online') {
                    startGeolocation();
                    loadAvailableOrders();
                    loadActiveOrder();
                    showToast('🟢 Вы онлайн', 'success');
                } else {
                    if (watchId) {
                        navigator.geolocation.clearWatch(watchId);
                        watchId = null;
                    }
                    if (unsubAvailableOrders) {
                        unsubAvailableOrders();
                        unsubAvailableOrders = null;
                    }
                    if (unsubActiveOrder) {
                        unsubActiveOrder();
                        unsubActiveOrder = null;
                    }
                    el.availableOrdersList.innerHTML = '';
                    el.activeOrderCard.innerHTML = '';
                    el.activeOrderTitle.style.display = 'none';
                    el.ordersAvailableCount.textContent = '0';
                    showToast('⚪ Вы офлайн', 'info');
                }
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        }

        // ============================================================
        // ОБРАБОТЧИКИ
        // ============================================================
        el.onlineBtn.addEventListener('click', function() { setDriverStatus('online'); });
        el.offlineBtn.addEventListener('click', function() { setDriverStatus('offline'); });

        el.refreshLocationBtn.addEventListener('click', function() {
            if (!isOnline) {
                showToast('⚠️ Включите онлайн-режим', 'warning');
                return;
            }
            // Принудительное обновление
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        isFirstLocation = true;
                        updateDriverLocation(lat, lng);
                        showToast('📍 Геолокация обновлена', 'success');
                    },
                    function(error) {
                        showToast('⚠️ Ошибка GPS: ' + error.message, 'warning');
                    }, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            }
        });

        el.refreshBtn.addEventListener('click', function() {
            showToast('🔄 Обновлено', 'info');
            loadAvailableOrders();
            loadActiveOrder();
        });

        el.backBtn.addEventListener('click', function() {
            if (activeOrder) {
                if (!confirm('У вас есть активный заказ. Вернуться в кабинет?')) return;
            }
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            if (unsubAvailableOrders) {
                unsubAvailableOrders();
                unsubAvailableOrders = null;
            }
            if (unsubActiveOrder) {
                unsubActiveOrder();
                unsubActiveOrder = null;
            }
            stopWaitingTimer();
            stopTracking();
            window.location.href = 'driver.html';
        });

        // ============================================================
        // ЗАГРУЗКА ДАННЫХ ВОДИТЕЛЯ
        // ============================================================
        function subscribeToDriverData(uid) {
            if (unsubUser) {
                unsubUser();
                unsubUser = null;
            }

            const userRef = db.collection('users').doc(uid);
            unsubUser = userRef.onSnapshot(function(doc) {
                if (doc.exists) {
                    userData = doc.data();
                    el.driverName.textContent = userData.displayName || 'Водитель';

                    const isAvail = userData.driverData?.isAvailable;
                    if (isAvail === true) {
                        setDriverStatus('online');
                    } else if (isAvail === false) {
                        setDriverStatus('offline');
                    } else {
                        setDriverStatus('online');
                    }

                    if (userData.driverData?.location) {
                        const loc = userData.driverData.location;
                        driverLocation = { lat: loc.lat, lng: loc.lng };
                        lastSentLocation = { lat: loc.lat, lng: loc.lng };

                        if (map) {
                            if (driverMarker) {
                                driverMarker.setLatLng([loc.lat, loc.lng]);
                            } else {
                                const icon = createDriverIcon();
                                driverMarker = L.marker([loc.lat, loc.lng], { icon: icon })
                                    .addTo(map)
                                    .bindPopup('🚗 Вы здесь');
                                map.setView([loc.lat, loc.lng], 15);
                            }
                        }
                    }
                }
            }, function(error) {
                console.error('Ошибка подписки на данные:', error);
            });
        }

        // ============================================================
        // АВТОРИЗАЦИЯ
        // ============================================================
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = user;

            db.collection('users').doc(user.uid).get()
                .then(function(doc) {
                    if (!doc.exists) {
                        showToast('❌ Профиль не найден', 'error');
                        setTimeout(() => window.location.href = 'index.html', 1500);
                        return;
                    }
                    const data = doc.data();
                    if (data.role !== 'driver') {
                        showToast('⛔ Только для водителей', 'error');
                        setTimeout(() => window.location.href = 'index.html', 1500);
                        return;
                    }

                    initMap();
                    subscribeToDriverData(user.uid);

                })
                .catch(function(err) {
                    console.error('Auth error:', err);
                    window.location.href = 'index.html';
                });
        });

        console.log('✅ Страница работы водителя готова');
        console.log('📌 Интервал обновления геолокации: 30 секунд');
        console.log('📌 Маркеры: 🚗 водитель, 🟢 клиент, 🔴 назначение');
        console.log('📌 Все изменения сохраняются в Firebase');
    </script>

</body>
