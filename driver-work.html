<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WHEEL — Работа водителя</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* ===== Все стили без изменений (как в предыдущей версии) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0c10; min-height: 100vh; padding: 10px; color: #fff; }
        .container { max-width: 480px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(18,22,28,0.9); border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 10px; }
        .header-title { font-size: 18px; font-weight: 700; }
        .header-title span { color: #ffb000; }
        .back-btn { background: rgba(255,255,255,0.06); border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #8899aa; font-size: 18px; cursor: pointer; font-family: inherit; }
        .back-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .status-badge { padding: 4px 14px; border-radius: 100px; font-size: 11px; font-weight: 600; }
        .status-badge.online { background: rgba(74,222,128,0.12); color: #4ade80; border: 1px solid rgba(74,222,128,0.15); }
        .status-badge.offline { background: rgba(102,119,136,0.1); color: #667788; }
        .status-badge.busy { background: rgba(255,180,0,0.12); color: #ffb000; }
        .status-badge.penalty { background: rgba(255,70,70,0.12); color: #ff6b6b; animation: blink 1s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        #map { height: 280px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 10px; background: #11151a; }
        .leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-popup-tip, .leaflet-popup-content-wrapper { background: transparent !important; border: none !important; box-shadow: none !important; }
        .leaflet-popup-content { background: rgba(18,22,28,0.9); color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 13px; }
        .leaflet-control-zoom { opacity: 0.7; }
        .info-panel { background: rgba(18,22,28,0.9); border-radius: 14px; padding: 10px 14px; border: 1px solid rgba(255,255,255,0.04); margin-bottom: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
        .info-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .info-row:last-child { border-bottom: none; }
        .info-row .label { color: #8899aa; }
        .info-row .value { font-weight: 500; color: #e0e8f0; }
        .info-row .value.gold { color: #ffb000; }
        .info-row .value.green { color: #4ade80; }
        .info-row .value.blue { color: #60a5fa; }
        .info-row .value.red { color: #ff6b6b; }

        .offer-card { background: rgba(255,180,0,0.08); border: 2px solid rgba(255,180,0,0.3); border-radius: 14px; padding: 14px; margin-bottom: 10px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { border-color: rgba(255,180,0,0.3); } 50% { border-color: rgba(255,180,0,0.6); } }
        .offer-card .offer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .offer-card .offer-badge { background: rgba(255,180,0,0.15); color: #ffb000; padding: 2px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .offer-card .offer-timer { font-size: 16px; font-weight: 700; color: #ffb000; }
        .offer-card .offer-timer.warning { color: #ff6b6b; animation: blink 0.5s infinite; }
        .offer-card .route { font-size: 14px; color: #b0c0d0; line-height: 1.4; }
        .offer-card .route .arrow { color: #667788; margin: 0 4px; }
        .offer-card .meta { font-size: 11px; color: #667788; display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
        .offer-card .price-big { font-size: 22px; font-weight: 700; color: #ffb000; }
        .offer-actions { display: flex; gap: 8px; margin-top: 10px; }
        .offer-actions .btn { flex: 1; padding: 10px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .offer-actions .btn-accept { background: linear-gradient(135deg, #4ade80, #22c55e); color: #0a0c10; }
        .offer-actions .btn-reject { background: rgba(255,70,70,0.12); color: #ff6b6b; border: 1px solid rgba(255,70,70,0.15); }

        .penalty-banner { background: rgba(255,70,70,0.1); border: 1px solid rgba(255,70,70,0.15); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; text-align: center; color: #ff6b6b; font-size: 14px; font-weight: 600; display: none; }
        .penalty-banner .timer { font-size: 22px; font-weight: 700; }

        .order-card { background: rgba(18,22,28,0.9); border-radius: 14px; padding: 14px; border: 1px solid rgba(255,255,255,0.04); margin-bottom: 10px; }
        .order-card.active { border-color: rgba(74,222,128,0.15); background: rgba(74,222,128,0.02); }
        .order-card .header-order { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .order-card .order-id { font-size: 12px; color: #8899aa; }
        .order-card .price { font-size: 18px; font-weight: 700; color: #ffb000; }
        .order-card .route { font-size: 14px; color: #b0c0d0; line-height: 1.4; }
        .order-card .route .arrow { color: #667788; margin: 0 4px; }
        .order-card .meta { font-size: 11px; color: #667788; display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

        .trip-steps { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 8px; }
        .trip-step { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #667788; flex: 1; justify-content: center; }
        .trip-step .icon { font-size: 14px; }
        .trip-step.active { color: #4ade80; font-weight: 500; }
        .trip-step-line { flex: 0.3; height: 2px; background: #667788; border-radius: 2px; }
        .trip-step-line.active { background: #4ade80; }

        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; justify-content: center; }
        .btn-icon { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 12px; border: none; border-radius: 12px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; min-width: 50px; flex: 0.5; }
        .btn-icon:active { transform: scale(0.92); }
        .btn-icon .icon { font-size: 22px; line-height: 1; }
        .btn-icon .label { font-size: 9px; opacity: 0.8; }
        .btn-icon.btn-success { background: rgba(74,222,128,0.1); color: #4ade80; border: 1px solid rgba(74,222,128,0.15); }
        .btn-icon.btn-success:hover { background: rgba(74,222,128,0.2); }
        .btn-icon.btn-danger { background: rgba(255,70,70,0.1); color: #ff6b6b; border: 1px solid rgba(255,70,70,0.15); }
        .btn-icon.btn-danger:hover { background: rgba(255,70,70,0.2); }
        .btn-icon.btn-warning { background: rgba(255,180,0,0.1); color: #ffb000; border: 1px solid rgba(255,180,0,0.15); }
        .btn-icon.btn-warning:hover { background: rgba(255,180,0,0.2); }
        .btn-icon.btn-primary { background: rgba(96,165,250,0.1); color: #60a5fa; border: 1px solid rgba(96,165,250,0.15); }
        .btn-icon.btn-primary:hover { background: rgba(96,165,250,0.2); }
        .btn-icon.btn-secondary { background: rgba(255,255,255,0.04); color: #8899aa; border: 1px solid rgba(255,255,255,0.06); }
        .btn-icon.btn-secondary:hover { background: rgba(255,255,255,0.08); color: #fff; }

        .empty-state { text-align: center; padding: 30px 20px; color: #667788; font-size: 14px; }
        .empty-state .icon { font-size: 44px; margin-bottom: 6px; opacity: 0.5; }
        .section-title { font-size: 13px; font-weight: 600; color: #8899aa; margin: 6px 0 4px; text-transform: uppercase; letter-spacing: 0.5px; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(18,22,28,0.95); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 12px 24px; color: #fff; font-size: 14px; font-weight: 500; z-index: 2000; display: none; max-width: 88%; text-align: center; }
        .toast.show { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

        @media (max-width: 420px) { #map { height: 220px; } .header-title { font-size: 16px; } .offer-card .price-big { font-size: 18px; } .offer-actions .btn { font-size: 13px; padding: 8px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" id="backBtn">←</button>
            <div class="header-title">🚖 <span>Работа</span></div>
            <span class="status-badge online" id="statusBadge">🟢 Онлайн</span>
        </div>
        <div id="map"></div>
        <div class="info-panel">
            <div class="info-row"><span class="label">👤 Водитель</span><span class="value" id="driverName">—</span></div>
            <div class="info-row"><span class="label">📊 Статус</span><span class="value green" id="driverStatus">Ожидание</span></div>
            <div class="info-row"><span class="label">📍 Обновление</span><span class="value blue" id="locationTime">—</span></div>
            <div class="info-row"><span class="label">📦 Заказов</span><span class="value gold" id="ordersCount">0</span></div>
        </div>
        <div class="penalty-banner" id="penaltyBanner">⛔ ШТРАФ ЗА ОТКАЗ!<br>Новые заказы через: <span class="timer" id="penaltyTimer">2:00</span></div>
        <div id="offerContainer"></div>
        <div class="section-title">📋 Доступные заказы</div>
        <div id="availableOrdersList"><div class="empty-state"><div class="icon">📦</div><div>Загрузка...</div></div></div>
        <div class="section-title" id="activeOrderTitle" style="display:none;">🚗 Активный заказ</div>
        <div id="activeOrderCard"></div>
        <div class="btn-group" style="margin-top:4px;">
            <button class="btn-icon btn-success" id="onlineBtn"><span class="icon">🟢</span><span class="label">Онлайн</span></button>
            <button class="btn-icon btn-secondary" id="offlineBtn"><span class="icon">⚪</span><span class="label">Офлайн</span></button>
            <button class="btn-icon btn-primary" id="refreshLocationBtn"><span class="icon">📍</span><span class="label">GPS</span></button>
            <button class="btn-icon btn-secondary" id="refreshBtn"><span class="icon">🔄</span><span class="label">Обновить</span></button>
        </div>
    </div>
    <div class="toast" id="toast"><span id="toastMessage">Сообщение</span></div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== STATE =====
        let currentUser, userData, driverLocation, lastSentLocation;
        let availableOrders = [], activeOrder = null, currentOffer = null;
        let isOnline = false, isPenaltyActive = false;
        let map, driverMarker, clientMarker, destinationMarker;
        let watchId, offerTimer, penaltyTimer;
        let unsubOrders = null, unsubUser = null;
        let routePoints = [], routeLine = null, isTracking = false;
        let isArrivedToClient = false; // флаг, что водитель подтвердил прибытие к клиенту

        const AI_RADIUS_KM = 2.5, OFFER_TIMEOUT = 30, PENALTY_SECONDS = 120;
        const GPS_INTERVAL = 15000, GPS_MIN_DIST = 0.02;
        const PENALTY_AMOUNT = 7; // штраф за отказ после прибытия к клиенту

        const $ = id => document.getElementById(id);

        // ===== UTILITY =====
        function showToast(text, type = 'info') {
            const t = $('toast');
            t.className = 'toast show ' + type;
            $('toastMessage').textContent = text;
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.className = 'toast', 3500);
        }
        function formatPrice(p) { return (p || 0).toFixed(2) + ' ₪'; }
        function formatDistance(km) {
            if (!km) return '0 м';
            if (km < 1) return (km * 1000).toFixed(0) + ' м';
            return km.toFixed(2) + ' км';
        }
        function formatDate(ts) {
            if (!ts) return '—';
            try { const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleString('ru-RU'); } catch { return '—'; }
        }
        function haversineDistance(lat1, lng1, lat2, lng2) {
            if (!lat1 || !lng1 || !lat2 || !lng2) return Infinity;
            const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }
        function getDistanceToOrder(order) {
            if (!driverLocation || !order?.pickup?.lat) return Infinity;
            return haversineDistance(driverLocation.lat, driverLocation.lng, order.pickup.lat, order.pickup.lng);
        }
        function calculateRealDistance(points) {
            let total = 0;
            for (let i = 1; i < points.length; i++) {
                total += haversineDistance(points[i-1].lat, points[i-1].lng, points[i].lat, points[i].lng);
            }
            return total;
        }

        // ===== MAP =====
        function initMap() {
            map = L.map('map', { zoomControl: true, attributionControl: true }).setView([32.0853, 34.7818], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        }
        function createDriverIcon() { return L.divIcon({ html: '🚗', iconSize: [32,32], iconAnchor: [16,32] }); }
        function createClientIcon() { return L.divIcon({ html: '🟢', iconSize: [28,28], iconAnchor: [14,28] }); }
        function createDestinationIcon() { return L.divIcon({ html: '🔴', iconSize: [28,28], iconAnchor: [14,28] }); }
        function updateDriverMarker(lat, lng) {
            if (driverMarker) driverMarker.setLatLng([lat, lng]);
            else {
                driverMarker = L.marker([lat, lng], { icon: createDriverIcon() }).addTo(map).bindPopup('🚗 Вы здесь');
                if (!activeOrder) map.setView([lat, lng], 15);
            }
        }
        function updateOrderMarkers() {
            if (clientMarker) { map.removeLayer(clientMarker); clientMarker = null; }
            if (destinationMarker) { map.removeLayer(destinationMarker); destinationMarker = null; }
            if (!activeOrder) return;
            if (activeOrder.pickup?.lat) {
                clientMarker = L.marker([activeOrder.pickup.lat, activeOrder.pickup.lng], { icon: createClientIcon() })
                    .addTo(map).bindPopup('🟢 Клиент');
            }
            if (activeOrder.destination?.lat) {
                destinationMarker = L.marker([activeOrder.destination.lat, activeOrder.destination.lng], { icon: createDestinationIcon() })
                    .addTo(map).bindPopup('🔴 Назначение');
            }
            if (driverLocation && clientMarker) {
                const b = L.latLngBounds([driverLocation.lat, driverLocation.lng], [activeOrder.pickup.lat, activeOrder.pickup.lng]);
                if (destinationMarker) b.extend([activeOrder.destination.lat, activeOrder.destination.lng]);
                map.fitBounds(b, { padding: [40,40] });
            }
        }

        // ===== GPS =====
        function startGeolocation() {
            if (!navigator.geolocation) { showToast('❌ GPS не поддерживается', 'error'); return; }
            if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            navigator.geolocation.getCurrentPosition(
                pos => updateLocation(pos.coords.latitude, pos.coords.longitude, true),
                err => console.error('GPS ошибка:', err), { enableHighAccuracy: true, timeout: 10000 }
            );
            watchId = navigator.geolocation.watchPosition(
                pos => updateLocation(pos.coords.latitude, pos.coords.longitude, false),
                err => console.error('GPS ошибка:', err),
                { enableHighAccuracy: true, timeout: 15000, maximumAge: GPS_INTERVAL }
            );
            setInterval(() => { if (driverLocation) $('locationTime').textContent = new Date().toLocaleTimeString(); }, 30000);
        }

        function updateLocation(lat, lng, force = false) {
            if (!force && lastSentLocation) {
                if (haversineDistance(lat, lng, lastSentLocation.lat, lastSentLocation.lng) < GPS_MIN_DIST) {
                    updateDriverMarker(lat, lng);
                    return;
                }
            }
            driverLocation = { lat, lng };
            lastSentLocation = { lat, lng };
            $('locationTime').textContent = new Date().toLocaleTimeString();
            updateDriverMarker(lat, lng);

            if (currentUser && isOnline) {
                db.collection('users').doc(currentUser.uid).update({
                    'driverData.location': { lat, lng },
                    'driverData.lastUpdated': firebase.firestore.FieldValue.serverTimestamp()
                }).catch(() => {});
            }
            updateOrdersUI();
            updateOrderMarkers();

            if (isTracking && activeOrder) {
                routePoints.push({ lat, lng, timestamp: new Date().toISOString() });
                updateRouteLine();
                renderActiveOrder(activeOrder); // обновляем расстояние
            }
        }

        // ===== SUBSCRIBE ORDERS (AUTO OFFER) =====
        function subscribeToOrders() {
            if (unsubOrders) { unsubOrders(); unsubOrders = null; }
            if (!currentUser || !isOnline) return;

            unsubOrders = db.collection('orders')
                .where('status', 'in', ['new', 'searching', 'assigned', 'in_progress'])
                .orderBy('createdAt', 'desc')
                .limit(50)
                .onSnapshot(snapshot => {
                    const all = [];
                    snapshot.forEach(d => all.push({ id: d.id, ...d.data() }));

                    availableOrders = all.filter(o => (o.status === 'new' || o.status === 'searching') && !o.driverId);
                    if (driverLocation) {
                        availableOrders.forEach(o => o.distance = getDistanceToOrder(o));
                        availableOrders.sort((a,b) => (a.distance||Infinity) - (b.distance||Infinity));
                    }

                    const foundActive = all.find(o => o.driverId === currentUser.uid && (o.status === 'assigned' || o.status === 'in_progress'));

                    if (foundActive) {
                        if (!activeOrder || activeOrder.id !== foundActive.id) {
                            activeOrder = foundActive;
                            $('activeOrderTitle').style.display = 'block';
                            updateOrderMarkers();
                            if (activeOrder.status === 'in_progress' && !isTracking) {
                                startTracking();
                                isArrivedToClient = true; // если поездка уже началась, считаем что клиент в машине
                            }
                            if (activeOrder.status === 'assigned') isArrivedToClient = false;
                            $('statusBadge').className = 'status-badge busy';
                            $('statusBadge').textContent = '🟡 Занят';
                            $('driverStatus').textContent = 'Выполняет заказ';
                            if (currentOffer) clearOffer();
                        }
                    } else {
                        if (activeOrder) {
                            activeOrder = null;
                            $('activeOrderCard').innerHTML = '';
                            $('activeOrderTitle').style.display = 'none';
                            clearOrderMarkers();
                            stopTracking();
                            isArrivedToClient = false;
                            if (isOnline && !isPenaltyActive) {
                                $('statusBadge').className = 'status-badge online';
                                $('statusBadge').textContent = '🟢 Онлайн';
                                $('driverStatus').textContent = 'Ожидание';
                            }
                        }
                    }

                    renderAvailableOrders();
                    if (activeOrder) renderActiveOrder(activeOrder);
                    $('ordersCount').textContent = availableOrders.length;

                    if (!currentOffer && !activeOrder && !isPenaltyActive && isOnline && driverLocation) {
                        const nearby = availableOrders.filter(o => getDistanceToOrder(o) <= AI_RADIUS_KM);
                        if (nearby.length) {
                            const best = nearby.reduce((a,b) => (getDistanceToOrder(a)||Infinity) < (getDistanceToOrder(b)||Infinity) ? a : b);
                            sendOffer(best);
                        }
                    }
                }, err => console.error('Ошибка подписки:', err));
        }

        function updateOrdersUI() {
            renderAvailableOrders();
            if (activeOrder) renderActiveOrder(activeOrder);
            $('ordersCount').textContent = availableOrders.length;
        }

        // ===== AVAILABLE ORDERS =====
        function renderAvailableOrders() {
            const list = $('availableOrdersList');
            if (currentOffer) {
                list.innerHTML = `<div class="empty-state"><div class="icon">🤖</div><div>Есть предложение от ИИ-диспетчера</div></div>`;
                return;
            }
            if (isPenaltyActive) {
                list.innerHTML = `<div class="empty-state"><div class="icon">⛔</div><div>Вы на штрафе</div></div>`;
                return;
            }
            if (!availableOrders.length) {
                list.innerHTML = `<div class="empty-state"><div class="icon">📦</div><div>Нет доступных заказов</div></div>`;
                return;
            }
            let html = '';
            availableOrders.slice(0,5).forEach(o => {
                const dist = o.distance !== Infinity ? o.distance.toFixed(1) + ' км' : '—';
                const isNearby = o.distance <= AI_RADIUS_KM;
                html += `
                    <div class="order-card" style="${isNearby ? 'border-color: rgba(255,180,0,0.2);' : ''}">
                        <div class="header-order">
                            <span class="order-id">#${o.id.substring(0,8)} <small>${formatDate(o.createdAt)}</small></span>
                            <span class="price">${formatPrice(o.price)}</span>
                        </div>
                        <div class="route">📍 ${o.pickup?.address || '—'} <span class="arrow">→</span> 🏁 ${o.destination?.address || '—'}</div>
                        <div class="meta">👤 ${o.clientName || 'Клиент'} • 📏 ${dist} ${isNearby ? '• 🟢 Рядом!' : ''}</div>
                        <div class="btn-group">
                            <button class="btn-icon btn-success" onclick="manualAccept('${o.id}')"><span class="icon">✅</span><span class="label">Принять</span></button>
                            <button class="btn-icon btn-danger" onclick="manualReject('${o.id}')"><span class="icon">✖</span><span class="label">Отклонить</span></button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        window.manualAccept = function(id) {
            if (isPenaltyActive) { showToast('⛔ Вы на штрафе!', 'error'); return; }
            const order = availableOrders.find(o => o.id === id);
            if (!order) return;
            db.collection('orders').doc(id).update({
                driverId: currentUser.uid,
                driverName: userData?.displayName || 'Водитель',
                status: 'assigned',
                assignedAt: firebase.firestore.FieldValue.serverTimestamp(),
                assignedManually: true
            }).then(() => showToast('✅ Заказ принят!', 'success'))
              .catch(err => showToast('❌ Ошибка: ' + err.message, 'error'));
        };

        window.manualReject = function(id) {
            if (!confirm('Отклонить заказ?')) return;
            db.collection('orders').doc(id).update({
                status: 'searching',
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'rejected'
                })
            }).then(() => showToast('❌ Заказ отклонён', 'warning'))
              .catch(err => showToast('❌ Ошибка: ' + err.message, 'error'));
        };

        // ===== OFFER LOGIC =====
        function sendOffer(order) {
            if (currentOffer || activeOrder || isPenaltyActive || !isOnline) return;
            currentOffer = order;
            renderOffer(order);
            showToast(`📨 Предложение от ИИ-диспетчера!`, 'warning');

            let remaining = OFFER_TIMEOUT;
            if (offerTimer) clearInterval(offerTimer);
            offerTimer = setInterval(() => {
                remaining--;
                const timer = $('offerTimer');
                if (timer) { timer.textContent = remaining + 's'; timer.classList.toggle('warning', remaining < 10); }
                if (remaining <= 0) { clearInterval(offerTimer); offerTimer = null; autoReject(order); }
            }, 1000);

            setTimeout(() => { if (currentOffer?.id === order.id) autoReject(order); }, OFFER_TIMEOUT * 1000);
        }

        function renderOffer(order) {
            const dist = order.distance !== null ? order.distance.toFixed(1) + ' км' : '—';
            $('offerContainer').innerHTML = `
                <div class="offer-card">
                    <div class="offer-header">
                        <span class="offer-badge">🤖 ИИ-диспетчер</span>
                        <span class="offer-timer" id="offerTimer">${OFFER_TIMEOUT}s</span>
                    </div>
                    <div class="route">📍 ${order.pickup?.address || '—'} <span class="arrow">→</span> 🏁 ${order.destination?.address || '—'}</div>
                    <div class="meta">👤 ${order.clientName || 'Клиент'} • 📏 ${dist}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
                        <span class="price-big">${formatPrice(order.price)}</span>
                        <span style="font-size:11px; color:#667788;">💰 Предложение</span>
                    </div>
                    <div class="offer-actions">
                        <button class="btn btn-accept" id="acceptOfferBtn">✅ Принять</button>
                        <button class="btn btn-reject" id="rejectOfferBtn">✖ Отказать</button>
                    </div>
                    <div style="font-size:10px; color:#667788; margin-top:6px; text-align:center;">⏱️ У вас ${OFFER_TIMEOUT} секунд</div>
                </div>
            `;
            $('acceptOfferBtn').addEventListener('click', () => acceptOffer(order));
            $('rejectOfferBtn').addEventListener('click', () => rejectOffer(order));
        }

        function acceptOffer(order) {
            if (!currentOffer || currentOffer.id !== order.id) return;
            clearOffer();
            db.collection('orders').doc(order.id).update({
                driverId: currentUser.uid,
                driverName: userData?.displayName || 'Водитель',
                status: 'assigned',
                assignedAt: firebase.firestore.FieldValue.serverTimestamp(),
                assignedByAI: true
            }).then(() => { showToast('✅ Заказ принят!', 'success'); currentOffer = null; })
              .catch(err => showToast('❌ Ошибка: ' + err.message, 'error'));
        }

        function rejectOffer(order) {
            if (!currentOffer || currentOffer.id !== order.id) return;
            clearOffer();
            startPenalty(PENALTY_SECONDS);
            db.collection('orders').doc(order.id).update({
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'ai_rejected',
                    penalty: true
                })
            }).catch(() => {});
            showToast('⛔ Штраф 2 минуты за отказ!', 'error');
            currentOffer = null;
        }

        function autoReject(order) {
            if (!currentOffer || currentOffer.id !== order.id) return;
            clearOffer();
            startPenalty(PENALTY_SECONDS);
            db.collection('orders').doc(order.id).update({
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'ai_timeout',
                    penalty: true
                })
            }).catch(() => {});
            showToast('⛔ Время истекло! Штраф 2 минуты', 'error');
            currentOffer = null;
        }

        function clearOffer() {
            if (offerTimer) { clearInterval(offerTimer); offerTimer = null; }
            $('offerContainer').innerHTML = '';
            currentOffer = null;
        }

        // ===== PENALTY (для отказов) =====
        function startPenalty(seconds) {
            if (isPenaltyActive) return;
            isPenaltyActive = true;
            let rem = seconds;
            $('penaltyBanner').style.display = 'block';
            $('statusBadge').className = 'status-badge penalty';
            $('statusBadge').textContent = '⛔ Штраф';

            if (penaltyTimer) clearInterval(penaltyTimer);
            penaltyTimer = setInterval(() => {
                rem--;
                const m = String(Math.floor(rem / 60)).padStart(2, '0');
                const s = String(rem % 60).padStart(2, '0');
                $('penaltyTimer').textContent = `${m}:${s}`;
                if (rem <= 0) {
                    clearInterval(penaltyTimer); penaltyTimer = null;
                    isPenaltyActive = false;
                    $('penaltyBanner').style.display = 'none';
                    if (isOnline) {
                        $('statusBadge').className = 'status-badge online';
                        $('statusBadge').textContent = '🟢 Онлайн';
                        $('driverStatus').textContent = 'Ожидание';
                    }
                    showToast('✅ Штраф окончен!', 'success');
                    db.collection('users').doc(currentUser.uid).update({
                        'driverData.isAvailable': true,
                        'driverData.penaltyEnd': null
                    }).catch(() => {});
                }
            }, 1000);

            db.collection('users').doc(currentUser.uid).update({
                'driverData.isAvailable': false,
                'driverData.penaltyEnd': firebase.firestore.FieldValue.serverTimestamp()
            }).catch(() => {});
        }

        // ===== ACTIVE ORDER (с реальным расстоянием и возможностью завершить в любой точке) =====
        function renderActiveOrder(order) {
            const dist = order.distance ? order.distance.toFixed(1) + ' км' : '—';
            let buttons = '', statusDetail = '', steps = '';

            let currentDist = 0;
            if (isTracking && routePoints.length > 1) {
                currentDist = calculateRealDistance(routePoints);
            }

            if (order.status === 'assigned') {
                if (!isArrivedToClient) {
                    buttons = `
                        <button class="btn-icon btn-warning" id="arriveBtn"><span class="icon">📍</span><span class="label">Прибыл к клиенту</span></button>
                        <button class="btn-icon btn-primary" id="navigateBtn"><span class="icon">🧍</span><span class="label">К клиенту (навигация)</span></button>
                        <button class="btn-icon btn-danger" id="cancelBtn"><span class="icon">✖</span><span class="label">Отменить</span></button>
                    `;
                    statusDetail = '🟡 Ожидайте клиента';
                    steps = `<div class="trip-steps"><div class="trip-step active"><span class="icon">📍</span> К клиенту</div><div class="trip-step-line"></div><div class="trip-step"><span class="icon">🚗</span> В пути</div><div class="trip-step-line"></div><div class="trip-step"><span class="icon">🏁</span> Назначение</div></div>`;
                } else {
                    buttons = `
                        <button class="btn-icon btn-success" id="startTripBtn"><span class="icon">🚀</span><span class="label">Начать поездку</span></button>
                        <button class="btn-icon btn-primary" id="navigateDestBtn"><span class="icon">📍</span><span class="label">К назначению</span></button>
                        <button class="btn-icon btn-danger" id="cancelBtn"><span class="icon">✖</span><span class="label">Отменить</span></button>
                    `;
                    statusDetail = '✅ Вы прибыли к клиенту. Нажмите "Начать поездку" для движения к назначению.';
                    steps = `<div class="trip-steps"><div class="trip-step active"><span class="icon">📍</span> К клиенту</div><div class="trip-step-line"></div><div class="trip-step active"><span class="icon">🚗</span> В пути</div><div class="trip-step-line"></div><div class="trip-step"><span class="icon">🏁</span> Назначение</div></div>`;
                }
            } else if (order.status === 'in_progress') {
                buttons = `
                    <button class="btn-icon btn-success" id="arriveDestBtn"><span class="icon">✅</span><span class="label">Завершить поездку</span></button>
                    <button class="btn-icon btn-primary" id="navigateDestBtn"><span class="icon">📍</span><span class="label">К назначению</span></button>
                    <button class="btn-icon btn-danger" id="cancelBtn"><span class="icon">✖</span><span class="label">Отменить</span></button>
                `;
                statusDetail = `🚗 В пути • Реальное расстояние: ${formatDistance(currentDist)}`;
                steps = `<div class="trip-steps"><div class="trip-step"><span class="icon">📍</span> К клиенту</div><div class="trip-step-line active"></div><div class="trip-step active"><span class="icon">🚗</span> В пути</div><div class="trip-step-line"></div><div class="trip-step"><span class="icon">🏁</span> Назначение</div></div>`;
            }

            $('activeOrderCard').innerHTML = `
                <div class="order-card active">
                    <div class="header-order">
                        <span class="order-id">🚖 #${order.id.substring(0,8)}</span>
                        <span class="price">${formatPrice(order.price)}</span>
                    </div>
                    <div class="route">📍 ${order.pickup?.address || '—'} <span class="arrow">→</span> 🏁 ${order.destination?.address || '—'}</div>
                    <div class="meta">👤 ${order.clientName || 'Клиент'} • 📏 План: ${dist} ${isTracking ? `• 🛣️ Проехали: ${formatDistance(currentDist)}` : ''}</div>
                    ${steps}
                    <div class="btn-group">${buttons}</div>
                    <div style="margin-top:6px; font-size:12px; color:#8899aa; text-align:center;">${statusDetail}</div>
                </div>
            `;

            $('arriveBtn')?.addEventListener('click', () => arriveToClient(order));
            $('navigateBtn')?.addEventListener('click', () => openWaze(order.pickup?.lat, order.pickup?.lng, 'клиенту'));
            $('startTripBtn')?.addEventListener('click', () => startTrip(order));
            $('navigateDestBtn')?.addEventListener('click', () => openWaze(order.destination?.lat, order.destination?.lng, 'назначению'));
            $('arriveDestBtn')?.addEventListener('click', () => arriveToDestination(order));
            $('cancelBtn')?.addEventListener('click', () => cancelDriverOrder(order));
        }

        function clearOrderMarkers() {
            if (clientMarker) { map.removeLayer(clientMarker); clientMarker = null; }
            if (destinationMarker) { map.removeLayer(destinationMarker); destinationMarker = null; }
        }

        // ===== TRIP ACTIONS =====
        function arriveToClient(order) {
            if (!driverLocation || !order.pickup?.lat) { showToast('⚠️ Нет данных о местоположении', 'warning'); return; }
            const dist = haversineDistance(driverLocation.lat, driverLocation.lng, order.pickup.lat, order.pickup.lng);
            // Проверка на близость к клиенту (200 м) – для подтверждения, что водитель действительно приехал
            if (dist > 0.2) {
                showToast(`⚠️ Вы далеко от клиента (${(dist*1000).toFixed(0)} м). Подойдите ближе.`, 'warning');
                return;
            }
            isArrivedToClient = true;
            showToast('✅ Вы прибыли к клиенту! Нажмите "Начать поездку"', 'success');
            renderActiveOrder(order);
        }

        function startTrip(order) {
            if (!isArrivedToClient) { showToast('⚠️ Сначала подтвердите прибытие к клиенту', 'warning'); return; }
            db.collection('orders').doc(order.id).update({
                status: 'in_progress',
                startedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                showToast('🚗 Поездка началась!', 'success');
                startTracking();
                openWaze(order.destination?.lat, order.destination?.lng, 'назначению');
                isArrivedToClient = false; // сбрасываем, чтобы не мешало
            }).catch(err => showToast('❌ Ошибка: ' + err.message, 'error'));
        }

        // ===== ЗАВЕРШЕНИЕ ПОЕЗДКИ (БЕЗ ПРОВЕРКИ РАССТОЯНИЯ) =====
        function arriveToDestination(order) {
            if (!driverLocation) {
                showToast('⚠️ Нет данных о местоположении', 'warning');
                return;
            }

            // Останавливаем трекинг
            stopTracking();

            // Реальное расстояние из трека
            const realDist = calculateRealDistance(routePoints);
            // Если трек пустой или слишком короткий – используем плановое расстояние
            const finalRealDist = (realDist > 0.1) ? realDist : (order.distance || 0);

            // Пересчитываем цену по реальному расстоянию
            const factor = finalRealDist / (order.distance || 1);
            const finalPrice = (order.price || 0) * factor;

            // Сохраняем в Firebase и переходим на отчёт
            db.collection('orders').doc(order.id).update({
                status: 'completed',
                completedAt: firebase.firestore.FieldValue.serverTimestamp(),
                realDistance: finalRealDist,
                finalPrice: finalPrice,
                routePoints: routePoints
            }).then(() => {
                showToast(`✅ Поездка завершена!`, 'success');
                window.location.href = `trip-complete.html?orderId=${order.id}`;
            }).catch(err => {
                showToast('❌ Ошибка сохранения данных: ' + err.message, 'error');
                console.error(err);
            });
        }

        // ===== ОТМЕНА ЗАКАЗА (с проверкой штрафа, если был подтверждён прибытие к клиенту) =====
        function cancelDriverOrder(order) {
            if (!confirm('⚠️ Отменить поездку?')) return;
            const reason = prompt('Причина отмены:');
            if (reason === null) return;

            // Штраф, если водитель уже подтвердил прибытие к клиенту (isArrivedToClient === true)
            // или если статус заказа уже in_progress (поездка началась)
            let penalty = 0;
            if (isArrivedToClient || order.status === 'in_progress') {
                penalty = PENALTY_AMOUNT;
                showToast(`⚠️ Будет применён штраф ${formatPrice(penalty)} за отмену после прибытия к клиенту`, 'warning');
            }

            db.collection('orders').doc(order.id).update({
                status: 'cancelled',
                cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
                cancellationReason: reason || 'Отменено водителем',
                penaltyApplied: penalty,
                cancelledBy: 'driver'
            }).then(() => {
                if (penalty > 0) {
                    db.collection('users').doc(currentUser.uid).update({
                        balance: firebase.firestore.FieldValue.increment(-penalty)
                    }).then(() => {
                        showToast(`💰 Штраф ${formatPrice(penalty)} списан`, 'warning');
                    }).catch(err => console.error('Ошибка списания штрафа:', err));
                }
                showToast('❌ Поездка отменена', 'error');
                stopTracking();
                isArrivedToClient = false;
            }).catch(err => showToast('❌ Ошибка: ' + err.message, 'error'));
        }

        // ===== TRACKING =====
        function startTracking() {
            isTracking = true;
            routePoints = [];
            if (driverLocation) routePoints.push({ lat: driverLocation.lat, lng: driverLocation.lng, timestamp: new Date().toISOString() });
            updateRouteLine();
        }

        function stopTracking() {
            isTracking = false;
            if (activeOrder && routePoints.length > 0) {
                db.collection('orders').doc(activeOrder.id).update({
                    routePoints: routePoints,
                    realDistance: calculateRealDistance(routePoints)
                }).catch(() => {});
            }
            routePoints = [];
            if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
        }

        function updateRouteLine() {
            if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
            if (routePoints.length < 2) return;
            routeLine = L.polyline(routePoints.map(p => [p.lat, p.lng]), {
                color: '#4ade80',
                weight: 3,
                opacity: 0.7,
                dashArray: '6,4'
            }).addTo(map);
        }

        // ===== NAVIGATION (Waze) =====
        function openWaze(lat, lng, name) {
            if (!lat || !lng) { showToast('⚠️ Нет координат для навигации', 'error'); return; }
            const wazeLink = `waze://?ll=${lat},${lng}&navigate=yes`;
            const fallback = `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`;
            try {
                if (navigator.userAgent.toLowerCase().includes('android')) {
                    window.location.href = wazeLink;
                    setTimeout(() => { window.location.href = fallback; }, 1500);
                } else {
                    window.location.href = wazeLink;
                    setTimeout(() => { window.location.href = fallback; }, 1500);
                }
                showToast(`🧭 Открываем Waze к ${name}`, 'info');
            } catch (e) {
                window.open(fallback, '_blank');
                showToast(`🧭 Открыт Waze (веб) к ${name}`, 'info');
            }
        }

        // ===== STATUS =====
        function setDriverStatus(status) {
            if (isPenaltyActive) { showToast('⛔ Вы на штрафе!', 'error'); return; }
            isOnline = (status === 'online');

            if (status === 'online') {
                $('statusBadge').className = 'status-badge online';
                $('statusBadge').textContent = '🟢 Онлайн';
                $('driverStatus').textContent = 'Ожидание';
                db.collection('users').doc(currentUser.uid).update({ 'driverData.isAvailable': true }).catch(() => {});
                startGeolocation();
                subscribeToOrders();
                showToast('🟢 Вы онлайн', 'success');
            } else {
                $('statusBadge').className = 'status-badge offline';
                $('statusBadge').textContent = '⚪ Офлайн';
                $('driverStatus').textContent = 'Не в сети';
                db.collection('users').doc(currentUser.uid).update({ 'driverData.isAvailable': false }).catch(() => {});
                if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
                if (unsubOrders) { unsubOrders(); unsubOrders = null; }
                clearOffer();
                $('availableOrdersList').innerHTML = '';
                $('activeOrderCard').innerHTML = '';
                $('activeOrderTitle').style.display = 'none';
                $('ordersCount').textContent = '0';
                stopTracking();
                isArrivedToClient = false;
                showToast('⚪ Вы офлайн', 'info');
            }
        }

        // ===== USER SUBSCRIPTION =====
        function subscribeToUser(uid) {
            if (unsubUser) { unsubUser(); unsubUser = null; }
            unsubUser = db.collection('users').doc(uid).onSnapshot(doc => {
                if (doc.exists) {
                    userData = doc.data();
                    $('driverName').textContent = userData.displayName || 'Водитель';
                    const avail = userData.driverData?.isAvailable;
                    if (avail === true && !isOnline) setDriverStatus('online');
                    else if (avail === false && isOnline) setDriverStatus('offline');
                    else if (avail === undefined) setDriverStatus('online');

                    if (userData.driverData?.location) {
                        const loc = userData.driverData.location;
                        if (!driverLocation || haversineDistance(driverLocation.lat, driverLocation.lng, loc.lat, loc.lng) > GPS_MIN_DIST) {
                            driverLocation = { lat: loc.lat, lng: loc.lng };
                            lastSentLocation = { lat: loc.lat, lng: loc.lng };
                            updateDriverMarker(loc.lat, loc.lng);
                            updateOrdersUI();
                        }
                    }
                }
            }, err => console.error('Ошибка данных:', err));
        }

        // ===== INIT =====
        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = 'index.html'; return; }
            currentUser = user;
            db.collection('users').doc(user.uid).get().then(doc => {
                if (!doc.exists || doc.data().role !== 'driver') {
                    showToast('⛔ Доступ только для водителей', 'error');
                    setTimeout(() => window.location.href = 'cabinet.html', 1500);
                    return;
                }
                initMap();
                subscribeToUser(user.uid);
                if (!isPenaltyActive) setDriverStatus('online');
            }).catch(() => window.location.href = 'index.html');
        });

        // ===== EVENTS =====
        $('onlineBtn').addEventListener('click', () => setDriverStatus('online'));
        $('offlineBtn').addEventListener('click', () => setDriverStatus('offline'));
        $('refreshLocationBtn').addEventListener('click', () => {
            if (!isOnline) { showToast('⚠️ Включите онлайн', 'warning'); return; }
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => updateLocation(pos.coords.latitude, pos.coords.longitude, true),
                    () => showToast('⚠️ Ошибка GPS', 'warning'),
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        });
        $('refreshBtn').addEventListener('click', () => {
            showToast('🔄 Обновлено', 'info');
            updateOrdersUI();
        });
        $('backBtn').addEventListener('click', () => {
            if (activeOrder && !confirm('У вас активный заказ. Выйти?')) return;
            if (watchId) navigator.geolocation.clearWatch(watchId);
            if (unsubOrders) unsubOrders();
            if (unsubUser) unsubUser();
            clearOffer();
            stopTracking();
            isArrivedToClient = false;
            window.location.href = 'cabinet.html';
        });

        window.diagnostic = function() {
            console.log('=== ДИАГНОСТИКА ===');
            console.log('Онлайн:', isOnline);
            console.log('Штраф:', isPenaltyActive);
            console.log('Активный заказ:', activeOrder ? activeOrder.id : 'нет');
            console.log('Предложение:', currentOffer ? currentOffer.id : 'нет');
            console.log('GPS:', driverLocation ? `${driverLocation.lat}, ${driverLocation.lng}` : 'НЕТ');
            console.log('Заказов:', availableOrders.length);
            console.log('Подписка:', unsubOrders ? '✅' : '❌');
            console.log('Трекинг:', isTracking);
            console.log('Точек маршрута:', routePoints.length);
            console.log('Прибыл к клиенту:', isArrivedToClient);
        };

        console.log('✅ driver-work.html (финальная с гибким завершением) загружен');
        console.log('📌 diagnostic() — состояние');
    </script>
</body>
</html>
