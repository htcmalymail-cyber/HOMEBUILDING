<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Работа водителя — WHEEL</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">
    </script>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0c10;
            min-height: 100vh;
            padding: 12px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.05) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.04) 0%, transparent 45%);
            background-attachment: fixed;
            color: #ffffff;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
        }
        .header-title span {
            color: #ffb000;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8899aa;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .status-badge {
            padding: 4px 14px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-badge.online {
            background: rgba(74, 222, 128, 0.12);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.15);
        }
        .status-badge.offline {
            background: rgba(102, 119, 136, 0.1);
            color: #667788;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .status-badge.busy {
            background: rgba(255, 180, 0, 0.12);
            color: #ffb000;
            border: 1px solid rgba(255, 180, 0, 0.15);
        }
        .status-badge.penalty {
            background: rgba(255, 70, 70, 0.12);
            color: #ff6b6b;
            border: 1px solid rgba(255, 70, 70, 0.15);
            animation: blink 1s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ===== КАРТА ===== */
        #map {
            height: 280px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
            overflow: hidden;
            background: #11151a;
        }

        .leaflet-control-attribution {
            font-size: 8px !important;
            color: #667788 !important;
        }

        /* ===== ИНФО-ПАНЕЛЬ ===== */
        .info-panel {
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .info-row:last-child {
            border-bottom: none;
        }

        .info-row .label {
            color: #8899aa;
            font-weight: 400;
        }
        .info-row .value {
            font-weight: 500;
            color: #e0e8f0;
            text-align: right;
        }
        .info-row .value.gold {
            color: #ffb000;
        }
        .info-row .value.green {
            color: #4ade80;
        }
        .info-row .value.red {
            color: #ff6b6b;
        }
        .info-row .value.blue {
            color: #60a5fa;
        }

        /* ===== ПРЕДЛОЖЕНИЕ ЗАКАЗА (ОТ ИИ) ===== */
        .offer-card {
            background: rgba(255, 180, 0, 0.08);
            border: 2px solid rgba(255, 180, 0, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 10px;
            animation: pulse-border 1.5s ease-in-out infinite;
            position: relative;
        }
        @keyframes pulse-border {
            0%, 100% { border-color: rgba(255, 180, 0, 0.3); }
            50% { border-color: rgba(255, 180, 0, 0.6); }
        }

        .offer-card .offer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .offer-card .offer-badge {
            background: rgba(255, 180, 0, 0.15);
            color: #ffb000;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .offer-card .offer-timer {
            font-size: 14px;
            font-weight: 700;
            color: #ffb000;
        }
        .offer-card .offer-timer.warning {
            color: #ff6b6b;
        }

        .offer-card .route {
            font-size: 14px;
            color: #b0c0d0;
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .offer-card .route .arrow {
            color: #667788;
            margin: 0 4px;
        }

        .offer-card .meta {
            font-size: 11px;
            color: #667788;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .offer-card .price-big {
            font-size: 22px;
            font-weight: 700;
            color: #ffb000;
        }

        .offer-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .offer-actions .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .offer-actions .btn:active {
            transform: scale(0.95);
        }
        .offer-actions .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .offer-actions .btn-accept {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #0a0c10;
        }
        .offer-actions .btn-accept:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(74, 222, 128, 0.3);
        }

        .offer-actions .btn-reject {
            background: rgba(255, 70, 70, 0.12);
            color: #ff6b6b;
            border: 1px solid rgba(255, 70, 70, 0.15);
        }
        .offer-actions .btn-reject:hover:not(:disabled) {
            background: rgba(255, 70, 70, 0.2);
        }

        /* ===== ПЕНАЛИЗАЦИЯ ===== */
        .penalty-banner {
            background: rgba(255, 70, 70, 0.1);
            border: 1px solid rgba(255, 70, 70, 0.15);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 10px;
            text-align: center;
            color: #ff6b6b;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
        .penalty-banner .timer {
            font-size: 20px;
            font-weight: 700;
        }

        /* ===== КАРТОЧКА ЗАКАЗА (активный) ===== */
        .order-card {
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .order-card.active {
            border-color: rgba(74, 222, 128, 0.15);
            background: rgba(74, 222, 128, 0.02);
        }

        .order-card .header-order {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .order-card .order-id {
            font-size: 12px;
            font-weight: 500;
            color: #8899aa;
        }
        .order-card .order-id small {
            color: #667788;
        }

        .order-card .price {
            font-size: 18px;
            font-weight: 700;
            color: #ffb000;
        }

        .order-card .route {
            font-size: 14px;
            color: #b0c0d0;
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .order-card .route .arrow {
            color: #667788;
            margin: 0 4px;
        }

        .order-card .meta {
            font-size: 11px;
            color: #667788;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        /* ===== СТАТУС ПОЕЗДКИ ===== */
        .trip-status {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 8px 12px;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .trip-steps {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .trip-step {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #667788;
            flex: 1;
            justify-content: center;
        }

        .trip-step .icon {
            font-size: 14px;
        }

        .trip-step.active {
            color: #4ade80;
            font-weight: 500;
        }

        .trip-step-line {
            flex: 0.3;
            height: 2px;
            background: #667788;
            border-radius: 2px;
        }

        .trip-step-line.active {
            background: #4ade80;
        }

        /* ===== КНОПКИ ===== */
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
            justify-content: center;
        }

        .btn-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 6px 12px;
            border: none;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            min-width: 50px;
            flex: 0.5;
        }
        .btn-icon:active {
            transform: scale(0.92);
        }
        .btn-icon:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-icon .icon {
            font-size: 22px;
            line-height: 1;
        }
        .btn-icon .label {
            font-size: 9px;
            opacity: 0.8;
        }

        .btn-icon.btn-success {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.15);
        }
        .btn-icon.btn-success:hover:not(:disabled) {
            background: rgba(74, 222, 128, 0.2);
        }

        .btn-icon.btn-danger {
            background: rgba(255, 70, 70, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(255, 70, 70, 0.15);
        }
        .btn-icon.btn-danger:hover:not(:disabled) {
            background: rgba(255, 70, 70, 0.2);
        }

        .btn-icon.btn-warning {
            background: rgba(255, 180, 0, 0.1);
            color: #ffb000;
            border: 1px solid rgba(255, 180, 0, 0.15);
        }
        .btn-icon.btn-warning:hover:not(:disabled) {
            background: rgba(255, 180, 0, 0.2);
        }

        .btn-icon.btn-primary {
            background: rgba(96, 165, 250, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.15);
        }
        .btn-icon.btn-primary:hover:not(:disabled) {
            background: rgba(96, 165, 250, 0.2);
        }

        .btn-icon.btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: #8899aa;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .btn-icon.btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        /* ===== ПУСТО ===== */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #667788;
            font-size: 14px;
        }
        .empty-state .icon {
            font-size: 44px;
            margin-bottom: 6px;
            opacity: 0.5;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #8899aa;
            margin: 6px 0 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ===== ТОСТ ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 22, 28, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px 24px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            z-index: 2000;
            display: none;
            max-width: 88%;
            text-align: center;
        }
        .toast.show {
            display: block;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
        }
        .toast.error {
            border-color: rgba(255, 70, 70, 0.15);
        }
        .toast.warning {
            border-color: rgba(255, 180, 0, 0.15);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            body {
                padding: 8px;
            }
            .header {
                padding: 8px 12px;
            }
            .header-title {
                font-size: 16px;
            }
            #map {
                height: 220px;
            }
            .info-panel {
                padding: 8px 12px;
                gap: 2px 8px;
            }
            .info-row {
                font-size: 12px;
            }
            .offer-card .price-big {
                font-size: 18px;
            }
            .offer-actions .btn {
                font-size: 13px;
                padding: 8px;
            }
            .btn-icon {
                padding: 4px 8px;
                min-width: 40px;
            }
            .btn-icon .icon {
                font-size: 18px;
            }
            .btn-icon .label {
                font-size: 8px;
            }
            .order-card {
                padding: 12px;
            }
            .order-card .price {
                font-size: 16px;
            }
            .order-card .route {
                font-size: 13px;
            }
            .trip-step {
                font-size: 10px;
            }
            .trip-step .icon {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== ШАПКА ===== -->
        <div class="header">
            <button class="back-btn" id="backBtn">←</button>
            <div class="header-title">🚖 <span>Работа</span></div>
            <span class="status-badge online" id="statusBadge">🟢 Онлайн</span>
        </div>

        <!-- ===== КАРТА ===== -->
        <div id="map"></div>

        <!-- ===== ИНФО-ПАНЕЛЬ ===== -->
        <div class="info-panel">
            <div class="info-row">
                <span class="label">👤 Водитель</span>
                <span class="value" id="driverName">Загрузка...</span>
            </div>
            <div class="info-row">
                <span class="label">📊 Статус</span>
                <span class="value green" id="driverStatusText">Ожидание</span>
            </div>
            <div class="info-row">
                <span class="label">📍 Обновление</span>
                <span class="value blue" id="locationUpdate">—</span>
            </div>
            <div class="info-row">
                <span class="label">📦 Доступно заказов</span>
                <span class="value gold" id="ordersAvailableCount">0</span>
            </div>
        </div>

        <!-- ===== ПЕНАЛИЗАЦИЯ ===== -->
        <div class="penalty-banner" id="penaltyBanner">
            ⛔ Штраф за отказ! <br>
            Новые заказы будут доступны через: <span class="timer" id="penaltyTimer">2:00</span>
        </div>

        <!-- ===== ПРЕДЛОЖЕНИЕ ЗАКАЗА (ОТ ИИ) ===== -->
        <div id="offerContainer"></div>

        <!-- ===== СПИСОК ДОСТУПНЫХ ЗАКАЗОВ ===== -->
        <div class="section-title">📋 Доступные заказы</div>
        <div id="availableOrdersList"></div>

        <!-- ===== АКТИВНЫЙ ЗАКАЗ ===== -->
        <div class="section-title" id="activeOrderTitle" style="display:none;">🚗 Активный заказ</div>
        <div id="activeOrderCard"></div>

        <!-- ===== КНОПКИ УПРАВЛЕНИЯ ===== -->
        <div class="btn-group" style="margin-top:4px;">
            <button class="btn-icon btn-success" id="onlineBtn">
                <span class="icon">🟢</span>
                <span class="label">Онлайн</span>
            </button>
            <button class="btn-icon btn-secondary" id="offlineBtn">
                <span class="icon">⚪</span>
                <span class="label">Офлайн</span>
            </button>
            <button class="btn-icon btn-primary" id="refreshLocationBtn">
                <span class="icon">📍</span>
                <span class="label">Обновить</span>
            </button>
            <button class="btn-icon btn-secondary" id="refreshBtn">
                <span class="icon">🔄</span>
                <span class="label">Обновить</span>
            </button>
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <span id="toastMessage">Сообщение</span>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // FIREBASE КОНФИГ
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        console.log('🔥 Firebase готов');

        // ============================================================
        // ПЕРЕМЕННЫЕ
        // ============================================================
        let currentUser = null;
        let userData = null;
        let driverLocation = null;
        let lastSentLocation = null;
        let availableOrders = [];
        let activeOrder = null;
        let currentOffer = null; // Текущее предложение от ИИ
        let isPenaltyActive = false;
        let penaltyTimer = null;
        let penaltyRemaining = 0;
        let offerTimer = null;
        let offerRemaining = 30; // 30 секунд на принятие решения
        let map = null;
        let driverMarker = null;
        let clientMarker = null;
        let destinationMarker = null;
        let routeLine = null;
        let watchId = null;
        let isOnline = true;
        let unsubAvailableOrders = null;
        let unsubActiveOrder = null;
        let unsubUser = null;
        let waitingTimerInterval = null;
        let isWaitingForClient = false;
        let routePoints = [];
        let isTracking = false;
        let locationUpdateInterval = 30000;
        let lastLocationUpdateTime = 0;
        let isFirstLocation = true;
        let autoAssignCheckInterval = null;

        // ============================================================
        // ЭЛЕМЕНТЫ
        // ============================================================
        const el = {
            backBtn: document.getElementById('backBtn'),
            statusBadge: document.getElementById('statusBadge'),
            driverName: document.getElementById('driverName'),
            driverStatusText: document.getElementById('driverStatusText'),
            locationUpdate: document.getElementById('locationUpdate'),
            ordersAvailableCount: document.getElementById('ordersAvailableCount'),
            availableOrdersList: document.getElementById('availableOrdersList'),
            activeOrderCard: document.getElementById('activeOrderCard'),
            activeOrderTitle: document.getElementById('activeOrderTitle'),
            offerContainer: document.getElementById('offerContainer'),
            penaltyBanner: document.getElementById('penaltyBanner'),
            penaltyTimer: document.getElementById('penaltyTimer'),
            onlineBtn: document.getElementById('onlineBtn'),
            offlineBtn: document.getElementById('offlineBtn'),
            refreshLocationBtn: document.getElementById('refreshLocationBtn'),
            refreshBtn: document.getElementById('refreshBtn'),
            toast: document.getElementById('toast'),
            toastMessage: document.getElementById('toastMessage'),
            map: document.getElementById('map')
        };

        // ============================================================
        // ТОАСТ
        // ============================================================
        let toastTimeout = null;

        function showToast(text, type = 'info') {
            el.toast.className = 'toast show ' + type;
            el.toastMessage.textContent = text;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                el.toast.className = 'toast';
            }, 3500);
        }

        // ============================================================
        // ФУНКЦИИ
        // ============================================================
        function formatPrice(p) {
            return (p || 0).toFixed(2) + ' ₪';
        }

        function formatDate(ts) {
            if (!ts) return '—';
            try {
                const d = ts.toDate ? ts.toDate() : new Date(ts);
                return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            } catch {
                return '—';
            }
        }

        function haversineDistance(lat1, lng1, lat2, lng2) {
            if (!lat1 || !lng1 || !lat2 || !lng2) return Infinity;
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function getStatusText(order) {
            const statusMap = {
                'new': 'Новый',
                'searching': 'Поиск',
                'assigned': 'Назначен',
                'in_progress': 'В пути',
                'completed': 'Завершён',
                'cancelled': 'Отменён'
            };
            return statusMap[order.status] || order.status;
        }

        function getDistanceFromDriver(order) {
            if (!driverLocation || !order.pickup || !order.pickup.lat || !order.pickup.lng) {
                return Infinity;
            }
            return haversineDistance(
                driverLocation.lat, driverLocation.lng,
                order.pickup.lat, order.pickup.lng
            );
        }

        function getTimeToClient(distanceKm) {
            // Средняя скорость в городе 30 км/ч = 0.5 км/мин
            const speedKmPerMin = 0.5;
            return distanceKm / speedKmPerMin;
        }

        // ============================================================
        // КАРТА
        // ============================================================
        function initMap() {
            map = L.map('map', {
                zoomControl: true,
                attributionControl: true
            }).setView([32.0853, 34.7818], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19,
                minZoom: 10
            }).addTo(map);

            console.log('🗺️ Карта инициализирована');
        }

        // ============================================================
        // МАРКЕРЫ
        // ============================================================
        function createDriverIcon() {
            return L.divIcon({
                html: '🚗',
                className: '',
                iconSize: [32, 32],
                iconAnchor: [16, 32],
                popupAnchor: [0, -32]
            });
        }

        function createClientIcon() {
            return L.divIcon({
                html: '🟢',
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 30],
                popupAnchor: [0, -30]
            });
        }

        function createDestinationIcon() {
            return L.divIcon({
                html: '🔴',
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 30],
                popupAnchor: [0, -30]
            });
        }

        function updateDriverMarker(lat, lng) {
            if (driverMarker) {
                driverMarker.setLatLng([lat, lng]);
            } else {
                const icon = createDriverIcon();
                driverMarker = L.marker([lat, lng], { icon: icon })
                    .addTo(map)
                    .bindPopup('🚗 Вы здесь');
            }
        }

        function updateActiveOrderMarkers() {
            if (clientMarker) {
                map.removeLayer(clientMarker);
                clientMarker = null;
            }
            if (destinationMarker) {
                map.removeLayer(destinationMarker);
                destinationMarker = null;
            }

            if (!activeOrder) return;

            if (activeOrder.pickup && activeOrder.pickup.lat && activeOrder.pickup.lng) {
                const icon = createClientIcon();
                clientMarker = L.marker([activeOrder.pickup.lat, activeOrder.pickup.lng], { icon: icon })
                    .addTo(map)
                    .bindPopup(`🟢 Клиент: ${activeOrder.pickup?.address || 'Отправление'}`);
            }

            if (activeOrder.destination && activeOrder.destination.lat && activeOrder.destination.lng) {
                const icon = createDestinationIcon();
                destinationMarker = L.marker([activeOrder.destination.lat, activeOrder.destination.lng], { icon: icon })
                    .addTo(map)
                    .bindPopup(`🔴 Назначение: ${activeOrder.destination?.address || 'Назначение'}`);
            }

            if (driverLocation && clientMarker) {
                const bounds = L.latLngBounds(
                    [driverLocation.lat, driverLocation.lng],
                    [activeOrder.pickup.lat, activeOrder.pickup.lng]
                );
                if (destinationMarker) {
                    bounds.extend([activeOrder.destination.lat, activeOrder.destination.lng]);
                }
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        // ============================================================
        // ГЕОЛОКАЦИЯ
        // ============================================================
        function startGeolocation() {
            if (!navigator.geolocation) {
                showToast('❌ GPS не поддерживается', 'error');
                return;
            }

            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    isFirstLocation = true;
                    updateDriverLocation(lat, lng);
                },
                function(error) {
                    console.error('GPS первичная ошибка:', error);
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );

            watchId = navigator.geolocation.watchPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    updateDriverLocation(lat, lng);
                },
                function(error) {
                    console.error('GPS ошибка:', error);
                }, {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 10000,
                }
            );

            // Принудительное обновление каждые 30 секунд
            setInterval(() => {
                if (driverLocation) {
                    const timeStr = new Date().toLocaleTimeString();
                    el.locationUpdate.textContent = timeStr;
                }
            }, locationUpdateInterval);

            console.log(`📍 GPS запущен с интервалом ${locationUpdateInterval/1000} секунд`);
        }

        function updateDriverLocation(lat, lng) {
            driverLocation = { lat, lng };
            lastLocationUpdateTime = Date.now();

            const timeStr = new Date().toLocaleTimeString();
            el.locationUpdate.textContent = timeStr;

            updateDriverMarker(lat, lng);

            if (!activeOrder) {
                map.setView([lat, lng], 15);
            }

            if (currentUser && shouldSendToFirebase(lat, lng)) {
                db.collection('users').doc(currentUser.uid).update({
                    'driverData.location': { lat, lng },
                    'driverData.lastUpdated': firebase.firestore.FieldValue.serverTimestamp()
                }).catch(err => console.error('Ошибка обновления локации:', err));
            }

            loadAvailableOrders();
            loadActiveOrder();
            updateActiveOrderMarkers();

            // Автоматическая проверка на назначение
            checkAutoAssign();

            if (isTracking && activeOrder) {
                routePoints.push({ lat, lng, timestamp: new Date().toISOString() });
                updateRouteLine();
            }
        }

        function shouldSendToFirebase(lat, lng) {
            if (!lastSentLocation) return true;
            const dist = haversineDistance(lat, lng, lastSentLocation.lat, lastSentLocation.lng);
            if (dist > 0.05) {
                lastSentLocation = { lat, lng };
                return true;
            }
            return false;
        }

        // ============================================================
        // АВТОМАТИЧЕСКОЕ НАЗНАЧЕНИЕ (ИИ-ДИСПЕТЧЕР)
        // ============================================================
        function checkAutoAssign() {
            // Если есть активный заказ, штраф или предложение — ничего не делаем
            if (activeOrder || isPenaltyActive || currentOffer) return;
            if (!isOnline || !driverLocation) return;

            // Ищем заказы в радиусе 5 минут (2.5 км при скорости 30 км/ч)
            const RADIUS_KM = 2.5; // ~5 минут езды

            const nearbyOrders = availableOrders.filter(order => {
                const dist = getDistanceFromDriver(order);
                return dist <= RADIUS_KM;
            });

            if (nearbyOrders.length === 0) return;

            // Берем ближайший заказ
            const nearestOrder = nearbyOrders.reduce((a, b) => {
                return (a.distance || Infinity) < (b.distance || Infinity) ? a : b;
            });

            // Отправляем предложение водителю
            sendOfferToDriver(nearestOrder);
        }

        function sendOfferToDriver(order) {
            if (currentOffer) return;
            if (isPenaltyActive) {
                showToast('⛔ Вы на штрафе, новые заказы недоступны', 'error');
                return;
            }

            currentOffer = order;
            renderOffer(order);

            showToast(`📨 Предложение от ИИ-диспетчера! #${order.id.substring(0, 8)}`, 'warning');

            // Таймер на принятие решения (30 секунд)
            offerRemaining = 30;
            startOfferTimer();

            // Авто-отказ через 30 секунд
            setTimeout(() => {
                if (currentOffer && currentOffer.id === order.id) {
                    autoRejectOffer(order);
                }
            }, 30000);
        }

        function startOfferTimer() {
            if (offerTimer) {
                clearInterval(offerTimer);
                offerTimer = null;
            }

            const timerEl = document.getElementById('offerTimer');
            if (!timerEl) return;

            offerTimer = setInterval(() => {
                offerRemaining--;
                if (timerEl) {
                    timerEl.textContent = `${offerRemaining}s`;
                    if (offerRemaining < 10) {
                        timerEl.classList.add('warning');
                    } else {
                        timerEl.classList.remove('warning');
                    }
                }
                if (offerRemaining <= 0) {
                    clearInterval(offerTimer);
                    offerTimer = null;
                }
            }, 1000);
        }

        function renderOffer(order) {
            const dist = order.distance !== null ? order.distance.toFixed(1) + ' км' : '—';
            const timeToClient = getTimeToClient(order.distance || 0);
            const timeStr = timeToClient < 1 ? '< 1 мин' : Math.round(timeToClient) + ' мин';

            el.offerContainer.innerHTML = `
                    <div class="offer-card">
                        <div class="offer-header">
                            <span class="offer-badge">🤖 ИИ-диспетчер</span>
                            <span class="offer-timer" id="offerTimer">30s</span>
                        </div>
                        <div class="route">
                            📍 ${order.pickup?.address || '—'}
                            <span class="arrow">→</span>
                            🏁 ${order.destination?.address || '—'}
                        </div>
                        <div class="meta">
                            <span>👤 ${order.clientName || 'Клиент'}</span>
                            <span>📏 ${dist}</span>
                            <span>⏱️ ${timeStr}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
                            <span class="price-big">${formatPrice(order.price)}</span>
                            <span style="font-size:11px; color:#667788;">💰 Предложение</span>
                        </div>
                        <div class="offer-actions">
                            <button class="btn btn-accept" id="acceptOfferBtn">✅ Принять</button>
                            <button class="btn btn-reject" id="rejectOfferBtn">✖ Отказать</button>
                        </div>
                        <div style="font-size:10px; color:#667788; margin-top:6px; text-align:center;">
                            ⏱️ У вас 30 секунд на принятие решения
                        </div>
                    </div>
                `;

            document.getElementById('acceptOfferBtn').addEventListener('click', function() {
                acceptOffer(order);
            });

            document.getElementById('rejectOfferBtn').addEventListener('click', function() {
                rejectOffer(order);
            });
        }

        function acceptOffer(order) {
            if (!currentOffer || currentOffer.id !== order.id) return;

            clearOfferTimer();
            el.offerContainer.innerHTML = '';

            const orderRef = db.collection('orders').doc(order.id);
            orderRef.update({
                driverId: currentUser.uid,
                driverName: userData?.displayName || 'Водитель',
                status: 'assigned',
                assignedAt: firebase.firestore.FieldValue.serverTimestamp(),
                assignedManually: false,
                assignedByAI: true,
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'ai_auto',
                    distance: order.distance || null,
                    accepted: true
                })
            }).then(() => {
                showToast(`✅ Вы приняли заказ от ИИ-диспетчера!`, 'success');
                currentOffer = null;
                loadActiveOrder();
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
                currentOffer = null;
            });
        }

        function rejectOffer(order) {
            if (!currentOffer || currentOffer.id !== order.id) return;

            clearOfferTimer();
            el.offerContainer.innerHTML = '';

            // Отказ -> штраф 2 минуты
            startPenalty(2 * 60); // 2 минуты

            const orderRef = db.collection('orders').doc(order.id);
            orderRef.update({
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'ai_auto',
                    distance: order.distance || null,
                    accepted: false,
                    penalty: true
                })
            }).catch(err => console.error('Ошибка записи отказа:', err));

            showToast(`⛔ Штраф 2 минуты за отказ от заказа`, 'error');
            currentOffer = null;
        }

        function autoRejectOffer(order) {
            if (!currentOffer || currentOffer.id !== order.id) return;

            clearOfferTimer();
            el.offerContainer.innerHTML = '';

            // Авто-отказ -> штраф 2 минуты
            startPenalty(2 * 60);

            const orderRef = db.collection('orders').doc(order.id);
            orderRef.update({
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'ai_auto',
                    distance: order.distance || null,
                    accepted: false,
                    autoReject: true,
                    penalty: true
                })
            }).catch(err => console.error('Ошибка записи авто-отказа:', err));

            showToast(`⛔ Время истекло! Штраф 2 минуты`, 'error');
            currentOffer = null;
        }

        function clearOfferTimer() {
            if (offerTimer) {
                clearInterval(offerTimer);
                offerTimer = null;
            }
        }

        // ============================================================
        // ПЕНАЛИЗАЦИЯ (ШТРАФ 2 МИНУТЫ)
        // ============================================================
        function startPenalty(seconds) {
            isPenaltyActive = true;
            penaltyRemaining = seconds;

            el.penaltyBanner.style.display = 'block';
            el.statusBadge.className = 'status-badge penalty';
            el.statusBadge.textContent = '⛔ Штраф';

            // Отключаем онлайн режим
            isOnline = false;

            if (penaltyTimer) {
                clearInterval(penaltyTimer);
                penaltyTimer = null;
            }

            penaltyTimer = setInterval(() => {
                penaltyRemaining--;
                const mins = Math.floor(penaltyRemaining / 60);
                const secs = penaltyRemaining % 60;
                el.penaltyTimer.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                if (penaltyRemaining <= 0) {
                    clearInterval(penaltyTimer);
                    penaltyTimer = null;
                    isPenaltyActive = false;
                    el.penaltyBanner.style.display = 'none';

                    // Возвращаем онлайн статус
                    isOnline = true;
                    el.statusBadge.className = 'status-badge online';
                    el.statusBadge.textContent = '🟢 Онлайн';
                    el.driverStatusText.textContent = 'Ожидание';

                    showToast('✅ Штраф окончен! Вы снова в сети.', 'success');

                    // Обновляем статус в Firebase
                    db.collection('users').doc(currentUser.uid).update({
                        'driverData.isAvailable': true,
                        'driverData.penaltyEnd': null
                    }).catch(err => console.error('Ошибка снятия штрафа:', err));

                    loadAvailableOrders();
                }
            }, 1000);

            // Обновляем статус в Firebase
            db.collection('users').doc(currentUser.uid).update({
                'driverData.isAvailable': false,
                'driverData.penaltyEnd': firebase.firestore.FieldValue.serverTimestamp()
            }).catch(err => console.error('Ошибка установки штрафа:', err));
        }

        // ============================================================
        // ЗАГРУЗКА ДОСТУПНЫХ ЗАКАЗОВ
        // ============================================================
        function loadAvailableOrders() {
            if (unsubAvailableOrders) {
                unsubAvailableOrders();
                unsubAvailableOrders = null;
            }

            const q = db.collection('orders')
                .where('status', 'in', ['new', 'searching'])
                .orderBy('createdAt', 'desc');

            unsubAvailableOrders = q.onSnapshot(function(snapshot) {
                availableOrders = [];
                snapshot.forEach(function(doc) {
                    const data = doc.data();
                    let distance = null;
                    if (driverLocation && data.pickup && data.pickup.lat && data.pickup.lng) {
                        distance = haversineDistance(
                            driverLocation.lat, driverLocation.lng,
                            data.pickup.lat, data.pickup.lng
                        );
                    }
                    availableOrders.push({
                        id: doc.id,
                        ...data,
                        distance: distance
                    });
                });

                availableOrders.sort((a, b) => (a.distance || Infinity) - (b.distance || Infinity));
                renderAvailableOrders();
                updateQueueCount();

                // Проверяем автоматическое назначение
                checkAutoAssign();

            }, function(error) {
                console.error('Ошибка загрузки доступных заказов:', error);
            });
        }

        // ============================================================
        // ЗАГРУЗКА АКТИВНОГО ЗАКАЗА
        // ============================================================
        function loadActiveOrder() {
            if (unsubActiveOrder) {
                unsubActiveOrder();
                unsubActiveOrder = null;
            }

            if (!currentUser) return;

            const q = db.collection('orders')
                .where('driverId', '==', currentUser.uid)
                .where('status', 'in', ['assigned', 'in_progress']);

            unsubActiveOrder = q.onSnapshot(function(snapshot) {
                let found = null;
                snapshot.forEach(function(doc) {
                    const data = doc.data();
                    found = { id: doc.id, ...data };
                });

                if (found) {
                    activeOrder = found;
                    renderActiveOrder(found);
                    el.activeOrderTitle.style.display = 'block';
                    updateActiveOrderMarkers();

                    if (found.status === 'in_progress' && !isTracking) {
                        startTracking();
                    }

                    if (found.status === 'assigned' && !isWaitingForClient) {
                        startWaitingTimer(found);
                    }

                    if (isOnline) {
                        el.statusBadge.className = 'status-badge busy';
                        el.statusBadge.textContent = '🟡 Занят';
                        el.driverStatusText.textContent = 'Выполняет заказ';
                    }

                } else {
                    activeOrder = null;
                    el.activeOrderCard.innerHTML = '';
                    el.activeOrderTitle.style.display = 'none';
                    clearOrderMarkers();
                    stopWaitingTimer();
                    stopTracking();

                    if (isOnline && !isPenaltyActive) {
                        el.statusBadge.className = 'status-badge online';
                        el.statusBadge.textContent = '🟢 Онлайн';
                        el.driverStatusText.textContent = 'Ожидание';
                    }
                }

            }, function(error) {
                console.error('Ошибка подписки на активный заказ:', error);
            });
        }

        // ============================================================
        // ОТОБРАЖЕНИЕ ДОСТУПНЫХ ЗАКАЗОВ
        // ============================================================
        function renderAvailableOrders() {
            const list = el.availableOrdersList;

            // Если есть предложение от ИИ, не показываем другие заказы
            if (currentOffer) {
                list.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🤖</div>
                            <div>Есть предложение от ИИ-диспетчера</div>
                            <div style="font-size:12px; margin-top:4px; color:#ffb000;">Примите или откажите</div>
                        </div>
                    `;
                return;
            }

            if (isPenaltyActive) {
                list.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">⛔</div>
                            <div>Вы на штрафе</div>
                            <div style="font-size:12px; margin-top:4px; color:#ff6b6b;">Доступ к заказам восстановится через ${el.penaltyTimer.textContent}</div>
                        </div>
                    `;
                return;
            }

            if (!availableOrders || availableOrders.length === 0) {
                list.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📦</div>
                            <div>Нет доступных заказов</div>
                            <div style="font-size:12px; margin-top:4px;">Ожидайте поступления</div>
                        </div>
                    `;
                return;
            }

            let html = '';
            const showOrders = availableOrders.slice(0, 5);

            showOrders.forEach(function(order) {
                const dist = order.distance !== null ? order.distance.toFixed(1) + ' км' : '—';
                const timeToClient = getTimeToClient(order.distance || 0);
                const timeStr = timeToClient < 1 ? '< 1 мин' : Math.round(timeToClient) + ' мин';
                const isNearby = order.distance !== null && order.distance <= 2.5;

                html += `
                        <div class="order-card" style="${isNearby ? 'border-color: rgba(255,180,0,0.2);' : ''}">
                            <div class="header-order">
                                <span class="order-id">#${order.id.substring(0, 8)} <small>${formatDate(order.createdAt)}</small></span>
                                <span class="price">${formatPrice(order.price)}</span>
                            </div>
                            <div class="route">
                                📍 ${order.pickup?.address || '—'}
                                <span class="arrow">→</span>
                                🏁 ${order.destination?.address || '—'}
                            </div>
                            <div class="meta">
                                <span>👤 ${order.clientName || 'Клиент'}</span>
                                <span>📏 ${dist}</span>
                                <span>⏱️ ${timeStr}</span>
                                ${isNearby ? '<span style="color:#ffb000;">🤖 Рядом!</span>' : ''}
                            </div>
                            <div class="btn-group">
                                <button class="btn-icon btn-success" onclick="acceptOrder('${order.id}')">
                                    <span class="icon">✅</span>
                                    <span class="label">Принять</span>
                                </button>
                                <button class="btn-icon btn-danger" onclick="rejectOrder('${order.id}')">
                                    <span class="icon">✖</span>
                                    <span class="label">Отклонить</span>
                                </button>
                            </div>
                        </div>
                    `;
            });

            list.innerHTML = html;
        }

        // ============================================================
        // РУЧНОЕ ПРИНЯТИЕ/ОТКАЗ
        // ============================================================
        window.acceptOrder = function(orderId) {
            if (isPenaltyActive) {
                showToast('⛔ Вы на штрафе!', 'error');
                return;
            }

            const order = availableOrders.find(o => o.id === orderId);
            if (!order) {
                showToast('❌ Заказ не найден', 'error');
                return;
            }

            if (!driverLocation) {
                showToast('⚠️ Определите местоположение', 'warning');
                return;
            }

            const orderRef = db.collection('orders').doc(orderId);
            orderRef.update({
                driverId: currentUser.uid,
                driverName: userData?.displayName || 'Водитель',
                status: 'assigned',
                assignedAt: firebase.firestore.FieldValue.serverTimestamp(),
                assignedManually: true,
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'manual',
                    distance: order.distance || null
                })
            }).then(() => {
                showToast(`✅ Вы приняли заказ`, 'success');
                loadActiveOrder();
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        };

        window.rejectOrder = function(orderId) {
            if (!confirm('Отклонить заказ?')) return;

            const orderRef = db.collection('orders').doc(orderId);
            orderRef.update({
                status: 'searching',
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'rejected'
                })
            }).then(() => {
                showToast('❌ Заказ отклонён', 'warning');
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        };

        // ============================================================
        // ОСТАЛЬНЫЕ ФУНКЦИИ (ТАЙМЕРЫ, ТРЕКИНГ, НАВИГАЦИЯ)
        // ============================================================
        // ... (оставляем функции из предыдущей версии)
        // startWaitingTimer, stopWaitingTimer, startTracking, stopTracking,
        // arriveToClient, clientNoShow, arriveToDestination,
        // navigateToClient, navigateToDestination, cancelDriverOrder,
        // createOrderTransactions, setDriverStatus, updateQueueCount

        // ============================================================
        // ОБРАБОТЧИКИ
        // ============================================================
        el.onlineBtn.addEventListener('click', function() {
            if (isPenaltyActive) {
                showToast('⛔ Вы на штрафе! Подождите.', 'error');
                return;
            }
            setDriverStatus('online');
        });

        el.offlineBtn.addEventListener('click', function() {
            setDriverStatus('offline');
        });

        el.refreshLocationBtn.addEventListener('click', function() {
            if (!isOnline) {
                showToast('⚠️ Включите онлайн-режим', 'warning');
                return;
            }
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        isFirstLocation = true;
                        updateDriverLocation(lat, lng);
                        showToast('📍 Геолокация обновлена', 'success');
                    },
                    function(error) {
                        showToast('⚠️ Ошибка GPS: ' + error.message, 'warning');
                    }, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            }
        });

        el.refreshBtn.addEventListener('click', function() {
            showToast('🔄 Обновлено', 'info');
            loadAvailableOrders();
            loadActiveOrder();
        });

        el.backBtn.addEventListener('click', function() {
            if (activeOrder) {
                if (!confirm('У вас есть активный заказ. Вернуться в кабинет?')) return;
            }
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            if (unsubAvailableOrders) {
                unsubAvailableOrders();
                unsubAvailableOrders = null;
            }
            if (unsubActiveOrder) {
                unsubActiveOrder();
                unsubActiveOrder = null;
            }
            clearOfferTimer();
            stopWaitingTimer();
            stopTracking();
            window.location.href = 'driver.html';
        });

        // ============================================================
        // ЗАГРУЗКА ДАННЫХ ВОДИТЕЛЯ
        // ============================================================
        function subscribeToDriverData(uid) {
            if (unsubUser) {
                unsubUser();
                unsubUser = null;
            }

            const userRef = db.collection('users').doc(uid);
            unsubUser = userRef.onSnapshot(function(doc) {
                if (doc.exists) {
                    userData = doc.data();
                    el.driverName.textContent = userData.displayName || 'Водитель';

                    const isAvail = userData.driverData?.isAvailable;
                    if (isAvail === true) {
                        setDriverStatus('online');
                    } else if (isAvail === false) {
                        setDriverStatus('offline');
                    } else {
                        setDriverStatus('online');
                    }

                    if (userData.driverData?.location) {
                        const loc = userData.driverData.location;
                        driverLocation = { lat: loc.lat, lng: loc.lng };
                        lastSentLocation = { lat: loc.lat, lng: loc.lng };
                        updateDriverMarker(loc.lat, loc.lng);
                    }
                }
            }, function(error) {
                console.error('Ошибка подписки на данные:', error);
            });
        }

        // ============================================================
        // СТАТУС ВОДИТЕЛЯ
        // ============================================================
        function updateQueueCount() {
            el.ordersAvailableCount.textContent = availableOrders.length;
        }

        function setDriverStatus(status) {
            if (!currentUser) return;
            if (isPenaltyActive) {
                showToast('⛔ Вы на штрафе!', 'error');
                return;
            }

            isOnline = (status === 'online');

            const statusMap = {
                'online': { badge: '🟢 Онлайн', text: 'Ожидание' },
                'offline': { badge: '⚪ Офлайн', text: 'Не в сети' },
                'busy': { badge: '🟡 Занят', text: 'Выполняет заказ' }
            };

            const info = statusMap[status] || statusMap['offline'];

            el.statusBadge.className = 'status-badge ' + status;
            el.statusBadge.textContent = info.badge;
            el.driverStatusText.textContent = info.text;

            db.collection('users').doc(currentUser.uid).update({
                'driverData.isAvailable': (status === 'online')
            }).then(() => {
                if (status === 'online') {
                    startGeolocation();
                    loadAvailableOrders();
                    loadActiveOrder();
                    showToast('🟢 Вы онлайн', 'success');
                } else {
                    if (watchId) {
                        navigator.geolocation.clearWatch(watchId);
                        watchId = null;
                    }
                    if (unsubAvailableOrders) {
                        unsubAvailableOrders();
                        unsubAvailableOrders = null;
                    }
                    if (unsubActiveOrder) {
                        unsubActiveOrder();
                        unsubActiveOrder = null;
                    }
                    clearOfferTimer();
                    el.offerContainer.innerHTML = '';
                    el.availableOrdersList.innerHTML = '';
                    el.activeOrderCard.innerHTML = '';
                    el.activeOrderTitle.style.display = 'none';
                    el.ordersAvailableCount.textContent = '0';
                    showToast('⚪ Вы офлайн', 'info');
                }
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        }

        // ============================================================
        // АВТОРИЗАЦИЯ
        // ============================================================
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = user;

            db.collection('users').doc(user.uid).get()
                .then(function(doc) {
                    if (!doc.exists) {
                        showToast('❌ Профиль не найден', 'error');
                        setTimeout(() => window.location.href = 'index.html', 1500);
                        return;
                    }
                    const data = doc.data();
                    if (data.role !== 'driver') {
                        showToast('⛔ Только для водителей', 'error');
                        setTimeout(() => window.location.href = 'index.html', 1500);
                        return;
                    }

                    initMap();
                    subscribeToDriverData(user.uid);

                    // Проверяем, не был ли водитель на штрафе
                    if (data.driverData?.penaltyEnd) {
                        const penaltyEnd = data.driverData.penaltyEnd.toDate ? data.driverData.penaltyEnd.toDate() :
                            new Date(data.driverData.penaltyEnd);
                        const now = new Date();
                        const diff = (now - penaltyEnd) / 1000;
                        if (diff < 120) {
                            startPenalty(120 - Math.round(diff));
                        }
                    }

                })
                .catch(function(err) {
                    console.error('Auth error:', err);
                    window.location.href = 'index.html';
                });
        });

        console.log('✅ Страница работы водителя готова');
        console.log('🤖 ИИ-диспетчер активен!');
        console.log('📌 Если водитель в 5 минутах от клиента — приходит предложение');
        console.log('⛔ Отказ = штраф 2 минуты');
        console.log('⏱️ 30 секунд на принятие решения');
    </script>

</body>
</html>
