<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Firebase SDK -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

    <style>
        /* ===== ОСНОВНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0c10;
            min-height: 100vh;
            padding: 12px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.05) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.04) 0%, transparent 45%);
            background-attachment: fixed;
            color: #ffffff;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(18, 22, 28, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .header-title span {
            color: #ffb000;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8899aa;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }
        .back-btn:active {
            transform: scale(0.92);
        }

        .status-badge {
            padding: 4px 14px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .status-badge.online {
            background: rgba(74, 222, 128, 0.12);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.15);
        }
        .status-badge.offline {
            background: rgba(102, 119, 136, 0.1);
            color: #667788;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .status-badge.busy {
            background: rgba(255, 180, 0, 0.12);
            color: #ffb000;
            border: 1px solid rgba(255, 180, 0, 0.15);
        }

        /* ===== КАРТА ===== */
        #map {
            height: 280px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
            overflow: hidden;
        }

        .leaflet-control-attribution {
            font-size: 8px !important;
            color: #667788 !important;
        }

        /* ===== ИНФОРМАЦИОННАЯ ПАНЕЛЬ ===== */
        .info-panel {
            background: rgba(18, 22, 28, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .info-row:last-child {
            border-bottom: none;
        }

        .info-row .label {
            color: #8899aa;
            font-weight: 400;
        }
        .info-row .value {
            font-weight: 500;
            color: #e0e8f0;
            text-align: right;
        }
        .info-row .value.gold {
            color: #ffb000;
        }
        .info-row .value.green {
            color: #4ade80;
        }
        .info-row .value.red {
            color: #ff6b6b;
        }

        /* ===== КАРТОЧКА ЗАКАЗА ===== */
        .order-card {
            background: rgba(18, 22, 28, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

        .order-card:hover {

        }

        .order-card .header-order {
            display: flex;
            justify-content: space-between;

        }

        .order-card .order-id {
            font-size: 12px;

            color: #8899aa;
        }
        .order-card .order-id small {

        }

        .order-card .price {
            font-size: 18px;
            font-weight: 700;

        }

        .order-card .route {

            color: #b0c0d0;
            margin-bottom: 4px;

        .order-card .route .arrow {

        .order-card .meta {

            color: #667788;

            flex-wrap: wrap;

        }

        .order-card.active {
            border-color: rgba(74, 222, 128, 0.2);

        }

        /* ===== БЛОК КНОПОК ===== */
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
            min-width: 60px;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-success {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #0a0c10;
        }
        .btn-success:hover {
            box-shadow: 0 4px 20px rgba(74, 222, 128, 0.25);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ef4444);
            color: #ffffff;
        }
        .btn-danger:hover {
            box-shadow: 0 4px 20px rgba(255, 70, 70, 0.25);

        }

        .btn-warning {
            background: linear-gradient(135deg, #ffb000, #ff6a00);

        }
        .btn-warning:hover {

            transform: translateY(-1px);
        }

        .btn-primary {

            color: #ffffff;
        }
        .btn-primary:hover {

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);

            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        }

        .btn-ghost {

            border: 1px solid rgba(255, 255, 255, 0.05);

        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #e0e8f0;
        }

        /* ===== СТАТУС ПОЕЗДКИ ===== */
        .trip-status {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .trip-steps {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .trip-step {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #667788;
            flex: 1;
            justify-content: center;
        }

        .trip-step .icon {
            font-size: 16px;
        }

        .trip-step.active {
            color: #4ade80;
            font-weight: 500;
        }

        .trip-step-line {
            flex: 0.5;
            height: 2px;
            background: #667788;
            border-radius: 2px;
        }

        .trip-step-line.active {
            background: #4ade80;
        }

        /* ===== ТАЙМЕР ОЖИДАНИЯ ===== */
        .waiting-timer {
            background: rgba(255, 180, 0, 0.06);
            border: 1px solid rgba(255, 180, 0, 0.1);
            border-radius: 12px;
            padding: 8px 14px;
            margin-top: 8px;
            text-align: center;
            font-size: 13px;
            color: #ffb000;
        }

        .waiting-timer .time {
            font-size: 22px;
            font-weight: 600;
        }

        .waiting-timer .time.warning {
            color: #ff6b6b;
        }

        /* ===== ПУСТО ===== */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #667788;
            font-size: 14px;
        }
        .empty-state .icon {
            font-size: 44px;
            margin-bottom: 6px;
            opacity: 0.5;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #8899aa;
            margin: 8px 0 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ===== ТОСТ ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 22, 28, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px 24px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            z-index: 2000;
            display: none;
            max-width: 88%;
            text-align: center;
        }
        .toast.show {
            display: block;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
        }
        .toast.error {
            border-color: rgba(255, 70, 70, 0.15);
        }
        .toast.warning {
            border-color: rgba(255, 180, 0, 0.15);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            body {
                padding: 8px;
            }
            .header {
                padding: 8px 12px;
            }
            .header-title {
                font-size: 16px;
            }
            #map {
                height: 200px;
            }
            .info-panel {
                padding: 10px 12px;
                gap: 4px 8px;
            }
            .info-row {
                font-size: 12px;
            }
            .btn {
                font-size: 12px;
                padding: 8px 14px;
                min-width: 50px;
            }
            .order-card {
                padding: 12px;
            }
            .order-card .price {
                font-size: 16px;
            }
            .order-card .route {
                font-size: 13px;
            }
            .waiting-timer .time {
                font-size: 18px;
            }
            .trip-step {
                font-size: 10px;
            }
            .trip-step .icon {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== ШАПКА ===== -->
        <div class="header">
            <button class="back-btn" id="backBtn" title="Назад">←</button>
            <div class="header-title">🚖 <span>Работа</span></div>
            <span class="status-badge online" id="statusBadge">🟢 Онлайн</span>
        </div>

        <!-- ===== КАРТА ===== -->
        <div id="map"></div>

        <!-- ===== ИНФОРМАЦИОННАЯ ПАНЕЛЬ ===== -->
        <div class="info-panel">
            <div class="info-row">
                <span class="label">👤 Водитель</span>
                <span class="value" id="driverName">Загрузка...</span>
            </div>
            <div class="info-row">
                <span class="label">📊 Статус</span>
                <span class="value green" id="driverStatusText">Ожидание</span>
            </div>
            <div class="info-row">
                <span class="label">📍 Моё местоположение</span>
                <span class="value" id="driverLocation">—</span>
            </div>
            <div class="info-row">
                <span class="label">📦 Доступно заказов</span>
                <span class="value gold" id="ordersAvailableCount">0</span>
            </div>
        </div>

        <!-- ===== СПИСОК ДОСТУПНЫХ ЗАКАЗОВ ===== -->
        <div class="section-title">📋 Доступные заказы</div>
        <div id="availableOrdersList"></div>

        <!-- ===== АКТИВНЫЙ ЗАКАЗ ===== -->
        <div class="section-title" id="activeOrderTitle" style="display:none;">🚗 Активный заказ</div>
        <div id="activeOrderCard"></div>

        <!-- ===== КНОПКИ УПРАВЛЕНИЯ ===== -->
        <div class="btn-group" style="margin-top:4px;">
            <button class="btn btn-success" id="onlineBtn">🟢 Онлайн</button>
            <button class="btn btn-secondary" id="offlineBtn">⚪ Офлайн</button>
            <button class="btn btn-primary" id="refreshLocationBtn">📍 Обновить</button>
            <button class="btn btn-ghost" id="refreshBtn">🔄</button>
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <span id="toastMessage">Сообщение</span>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT (ПОЛНАЯ ВЕРСИЯ) -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // FIREBASE КОНФИГ
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        console.log('🔥 Firebase готов');

        // ============================================================
        // ПЕРЕМЕННЫЕ
        // ============================================================
        let currentUser = null;
        let userData = null;
        let driverLocation = null;
        let availableOrders = [];
        let activeOrder = null;
        let map = null;
        let driverMarker = null;
        let clientMarker = null;
        let destinationMarker = null;
        let watchId = null;
        let isOnline = true;
        let unsubAvailableOrders = null;
        let unsubActiveOrder = null;
        let unsubUser = null;
        let waitingTimerInterval = null;
        let waitingStartTime = null;
        let isWaitingForClient = false;

        // ============================================================
        // ЭЛЕМЕНТЫ
        // ============================================================
        const el = {
            backBtn: document.getElementById('backBtn'),
            statusBadge: document.getElementById('statusBadge'),
            driverName: document.getElementById('driverName'),
            driverStatusText: document.getElementById('driverStatusText'),
            driverLocation: document.getElementById('driverLocation'),
            ordersAvailableCount: document.getElementById('ordersAvailableCount'),
            availableOrdersList: document.getElementById('availableOrdersList'),
            activeOrderCard: document.getElementById('activeOrderCard'),
            activeOrderTitle: document.getElementById('activeOrderTitle'),
            onlineBtn: document.getElementById('onlineBtn'),
            offlineBtn: document.getElementById('offlineBtn'),
            refreshLocationBtn: document.getElementById('refreshLocationBtn'),
            refreshBtn: document.getElementById('refreshBtn'),
            toast: document.getElementById('toast'),
            toastMessage: document.getElementById('toastMessage'),
            map: document.getElementById('map')
        };

        // ============================================================
        // ТОАСТ
        // ============================================================
        let toastTimeout = null;

        function showToast(text, type = 'info') {
            el.toast.className = 'toast show ' + type;
            el.toastMessage.textContent = text;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                el.toast.className = 'toast';
            }, 3500);
        }

        // ============================================================
        // ФУНКЦИИ
        // ============================================================
        function formatPrice(p) {
            return (p || 0).toFixed(2) + ' ₪';
        }

        function formatDate(ts) {
            if (!ts) return '—';
            try {
                const d = ts.toDate ? ts.toDate() : new Date(ts);
                return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            } catch {
                return '—';
            }
        }

        function haversineDistance(lat1, lng1, lat2, lng2) {
            if (!lat1 || !lng1 || !lat2 || !lng2) return Infinity;
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function getStatusText(order) {
            const statusMap = {
                'new': 'Новый',
                'searching': 'Поиск',
                'assigned': 'Назначен',
                'in_progress': 'В пути',
                'completed': 'Завершён',
                'cancelled': 'Отменён'
            };
            return statusMap[order.status] || order.status;
        }

        // ============================================================
        // КАРТА
        // ============================================================
        function initMap() {
            map = L.map('map').setView([32.0853, 34.7818], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19,
                minZoom: 10
            }).addTo(map);

            map.on('click', function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                updateDriverLocation(lat, lng);
            });

            console.log('🗺️ Карта инициализирована');
        }

        // ============================================================
        // ОБНОВЛЕНИЕ ГЕОЛОКАЦИИ ВОДИТЕЛЯ
        // ============================================================
        function updateDriverLocation(lat, lng) {
            driverLocation = { lat, lng };
            el.driverLocation.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;

            if (driverMarker) {
                map.removeLayer(driverMarker);
            }
            const icon = L.divIcon({
                html: '🚗🟢',
                className: '',
                iconSize: [32, 32],
                iconAnchor: [16, 32]
            });
            driverMarker = L.marker([lat, lng], { icon: icon })
                .addTo(map)
                .bindPopup('🚗 Вы здесь');
            map.setView([lat, lng], 15);

            if (currentUser) {
                db.collection('users').doc(currentUser.uid).update({
                    'driverData.location': { lat, lng },
                    'driverData.lastUpdated': firebase.firestore.FieldValue.serverTimestamp()
                }).catch(err => console.error('Ошибка обновления локации:', err));
            }

            loadAvailableOrders();
            loadActiveOrder();
            updateActiveOrderMarkers();
        }

        // ============================================================
        // GPS
        // ============================================================
        function startGeolocation() {
            if (!navigator.geolocation) {
                showToast('❌ GPS не поддерживается', 'error');
                return;
            }

            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            watchId = navigator.geolocation.watchPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    updateDriverLocation(lat, lng);
                },
                function(error) {
                    console.error('GPS ошибка:', error);
                    showToast('⚠️ Ошибка GPS: ' + error.message, 'warning');
                }, {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 10000
                }
            );
        }

        // ============================================================
        // ЗАГРУЗКА ДОСТУПНЫХ ЗАКАЗОВ
        // ============================================================
        function loadAvailableOrders() {
            if (unsubAvailableOrders) {
                unsubAvailableOrders();
                unsubAvailableOrders = null;
            }

            const q = db.collection('orders')
                .where('status', 'in', ['new', 'searching'])
                .orderBy('createdAt', 'desc');

            unsubAvailableOrders = q.onSnapshot(function(snapshot) {
                availableOrders = [];
                snapshot.forEach(function(doc) {
                    const data = doc.data();
                    let distance = null;
                    if (driverLocation && data.pickup && data.pickup.lat && data.pickup.lng) {
                        distance = haversineDistance(
                            driverLocation.lat, driverLocation.lng,
                            data.pickup.lat, data.pickup.lng
                        );
                    }
                    availableOrders.push({
                        id: doc.id,
                        ...data,
                        distance: distance
                    });
                });

                const MAX_DISTANCE = 10;
                availableOrders = availableOrders.filter(order =>
                    order.distance === null || order.distance <= MAX_DISTANCE
                );

                availableOrders.sort((a, b) => (a.distance || Infinity) - (b.distance || Infinity));
                renderAvailableOrders();
                updateQueueCount();

            }, function(error) {
                console.error('Ошибка загрузки доступных заказов:', error);
            });
        }

        // ============================================================
        // ЗАГРУЗКА АКТИВНОГО ЗАКАЗА
        // ============================================================
        function loadActiveOrder() {
            if (unsubActiveOrder) {
                unsubActiveOrder();
                unsubActiveOrder = null;
            }

            if (!currentUser) {
                console.log('⚠️ Нет текущего пользователя');
                return;
            }

            console.log('🔍 Поиск активного заказа для водителя:', currentUser.uid);

            const q = db.collection('orders')
                .where('driverId', '==', currentUser.uid)
                .where('status', 'in', ['assigned', 'in_progress']);

            unsubActiveOrder = q.onSnapshot(function(snapshot) {
                console.log('📦 Получено документов в активных:', snapshot.size);

                let found = null;
                snapshot.forEach(function(doc) {
                    const data = doc.data();
                    console.log('📄 Активный заказ:', doc.id, data.status);
                    found = { id: doc.id, ...data };
                });

                if (found) {
                    activeOrder = found;
                    renderActiveOrder(found);
                    el.activeOrderTitle.style.display = 'block';
                    updateActiveOrderMarkers();

                    if (found.status === 'assigned' && !isWaitingForClient) {
                        startWaitingTimer(found);
                    }
                } else {
                    console.log('❌ Активных заказов нет');
                    activeOrder = null;
                    el.activeOrderCard.innerHTML = '';
                    el.activeOrderTitle.style.display = 'none';
                    clearOrderMarkers();
                    stopWaitingTimer();
                }

            }, function(error) {
                console.error('❌ Ошибка подписки на активный заказ:', error);
                showToast('⚠️ Ошибка загрузки активного заказа', 'error');
            });
        }

        // ============================================================
        // МАРКЕРЫ НА КАРТЕ
        // ============================================================
        function updateActiveOrderMarkers() {
            clearOrderMarkers();

            if (!activeOrder) return;

            if (activeOrder.pickup && activeOrder.pickup.lat && activeOrder.pickup.lng) {
                const icon = L.divIcon({
                    html: '🟢',
                    className: '',
                    iconSize: [24, 24],
                    iconAnchor: [12, 24]
                });
                clientMarker = L.marker([activeOrder.pickup.lat, activeOrder.pickup.lng], { icon: icon })
                    .addTo(map)
                    .bindPopup(`📍 Отправление`);
            }

            if (activeOrder.destination && activeOrder.destination.lat && activeOrder.destination.lng) {
                const icon = L.divIcon({
                    html: '🔴',
                    className: '',
                    iconSize: [24, 24],
                    iconAnchor: [12, 24]
                });
                destinationMarker = L.marker([activeOrder.destination.lat, activeOrder.destination.lng], { icon: icon })
                    .addTo(map)
                    .bindPopup(`🏁 Назначение`);
            }

            if (clientMarker && destinationMarker) {
                const bounds = L.latLngBounds(
                    [activeOrder.pickup.lat, activeOrder.pickup.lng],
                    [activeOrder.destination.lat, activeOrder.destination.lng]
                );
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        function clearOrderMarkers() {
            if (clientMarker) {
                map.removeLayer(clientMarker);
                clientMarker = null;
            }
            if (destinationMarker) {
                map.removeLayer(destinationMarker);
                destinationMarker = null;
            }
        }

        // ============================================================
        // ОТОБРАЖЕНИЕ ДОСТУПНЫХ ЗАКАЗОВ
        // ============================================================
        function renderAvailableOrders() {
            const list = el.availableOrdersList;

            if (!availableOrders || availableOrders.length === 0) {
                list.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📦</div>
                            <div>Нет доступных заказов</div>
                            <div style="font-size:12px; margin-top:4px;">Ожидайте поступления</div>
                        </div>
                    `;
                return;
            }

            let html = '';
            const showOrders = availableOrders.slice(0, 5);

            showOrders.forEach(function(order) {
                const dist = order.distance !== null ? order.distance.toFixed(1) + ' км' : '—';
                const statusText = getStatusText(order);

                html += `
                        <div class="order-card">
                            <div class="header-order">
                                <span class="order-id">#${order.id.substring(0, 8)} <small>${formatDate(order.createdAt)}</small></span>
                                <span class="price">${formatPrice(order.price)}</span>
                            </div>
                            <div class="route">
                                📍 ${order.pickup?.address || '—'}
                                <span class="arrow">→</span>
                                🏁 ${order.destination?.address || '—'}
                            </div>
                            <div class="meta">
                                <span>👤 ${order.clientName || 'Клиент'}</span>
                                <span>📏 ${dist}</span>
                                <span>📌 ${statusText}</span>
                            </div>
                            <div class="btn-group">
                                <button class="btn btn-success" onclick="acceptOrder('${order.id}')">✅ Принять</button>
                                <button class="btn btn-danger" onclick="rejectOrder('${order.id}')">❌ Отклонить</button>
                            </div>
                        </div>
                    `;
            });

            list.innerHTML = html;
        }

        // ============================================================
        // ТАЙМЕР ОЖИДАНИЯ КЛИЕНТА (3 минуты)
        // ============================================================
        function startWaitingTimer(order) {
            if (waitingTimerInterval) {
                clearInterval(waitingTimerInterval);
                waitingTimerInterval = null;
            }

            isWaitingForClient = true;
            waitingStartTime = Date.now();
            const WAIT_TIME = 3 * 60;

            const statusDetail = document.getElementById('orderStatusDetail');
            if (statusDetail) {
                statusDetail.innerHTML = `
                        <div class="waiting-timer">
                            ⏳ Ожидание клиента: <span class="time" id="waitingTimerDisplay">3:00</span>
                            <br><span style="font-size:11px; color:#667788;">Клиент не явился → штраф 7 ₪</span>
                        </div>
                    `;
            }

            const noShowBtn = document.getElementById('noShowBtn');
            if (noShowBtn) {
                noShowBtn.disabled = true;
                noShowBtn.textContent = '👤 Клиент не явился (3:00)';
                noShowBtn.classList.remove('btn-danger');
                noShowBtn.classList.add('btn-secondary');
            }

            waitingTimerInterval = setInterval(() => {
                const elapsed = (Date.now() - waitingStartTime) / 1000;
                const remaining = Math.max(0, WAIT_TIME - elapsed);
                const minutes = Math.floor(remaining / 60);
                const seconds = Math.floor(remaining % 60);

                const display = document.getElementById('waitingTimerDisplay');
                if (display) {
                    display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                    if (remaining < 30) {
                        display.classList.add('warning');
                    } else {
                        display.classList.remove('warning');
                    }
                }

                if (remaining <= 0) {
                    clearInterval(waitingTimerInterval);
                    waitingTimerInterval = null;
                    isWaitingForClient = false;

                    const noShowBtn = document.getElementById('noShowBtn');
                    if (noShowBtn) {
                        noShowBtn.disabled = false;
                        noShowBtn.textContent = '👤 Клиент не явился (7 ₪)';
                        noShowBtn.classList.remove('btn-secondary');
                        noShowBtn.classList.add('btn-danger');
                    }

                    const display = document.getElementById('waitingTimerDisplay');
                    if (display) {
                        display.textContent = '⏰ Время вышло!';
                        display.classList.add('warning');
                    }

                    if (statusDetail) {
                        statusDetail.innerHTML = `
                                <div class="waiting-timer" style="border-color: #ff6b6b;">
                                    ⏰ Время ожидания истекло!
                                    <br><span style="font-size:12px; color:#ff6b6b;">Нажмите «Клиент не явился»</span>
                                </div>
                            `;
                    }

                    showToast('⏰ Время ожидания истекло!', 'warning');
                }
            }, 1000);
        }

        function stopWaitingTimer() {
            if (waitingTimerInterval) {
                clearInterval(waitingTimerInterval);
                waitingTimerInterval = null;
            }
            isWaitingForClient = false;
        }

        // ============================================================
        // ОТОБРАЖЕНИЕ АКТИВНОГО ЗАКАЗА
        // ============================================================
        function renderActiveOrder(order) {
            const card = el.activeOrderCard;
            const dist = order.distance !== null ? order.distance.toFixed(1) + ' км' : '—';

            let buttons = '';
            let statusDetail = '';
            let tripSteps = '';

            if (order.status === 'assigned') {
                buttons = `
                        <button class="btn btn-warning" id="arriveBtn">📍 Прибыл на место</button>
                        <button class="btn btn-primary" id="navigateBtn">🧭 К клиенту</button>
                        <button class="btn btn-danger" id="cancelOrderBtn">❌ Отменить</button>
                        <button class="btn btn-secondary" id="noShowBtn" disabled>⏳ Клиент не явился</button>
                    `;
                statusDetail = '🟡 Ожидайте прибытия к клиенту';

                tripSteps = `
                        <div class="trip-steps">
                            <div class="trip-step active"><span class="icon">📍</span> К клиенту</div>
                            <div class="trip-step-line"></div>
                            <div class="trip-step"><span class="icon">🚗</span> В пути</div>
                            <div class="trip-step-line"></div>
                            <div class="trip-step"><span class="icon">🏁</span> К назначению</div>
                        </div>
                    `;

            } else if (order.status === 'in_progress') {
                buttons = `
                        <button class="btn btn-warning" id="arriveDestinationBtn">🏁 Прибыл к назначению</button>
                        <button class="btn btn-primary" id="navigateDestinationBtn">🧭 К назначению</button>
                        <button class="btn btn-danger" id="cancelOrderBtn">❌ Отменить</button>
                    `;
                statusDetail = '🚗 Поездка началась!';

                tripSteps = `
                        <div class="trip-steps">
                            <div class="trip-step"><span class="icon">📍</span> К клиенту</div>
                            <div class="trip-step-line active"></div>
                            <div class="trip-step active"><span class="icon">🚗</span> В пути</div>
                            <div class="trip-step-line"></div>
                            <div class="trip-step"><span class="icon">🏁</span> К назначению</div>
                        </div>
                    `;

            } else if (order.status === 'completed') {
                tripSteps = `
                        <div class="trip-steps">
                            <div class="trip-step"><span class="icon">📍</span> К клиенту</div>
                            <div class="trip-step-line active"></div>
                            <div class="trip-step"><span class="icon">🚗</span> В пути</div>
                            <div class="trip-step-line active"></div>
                            <div class="trip-step active"><span class="icon">✅</span> Завершено</div>
                        </div>
                    `;
                statusDetail = '✅ Поездка завершена!';
                buttons = '';
            }

            card.innerHTML = `
                    <div class="order-card active">
                        <div class="header-order">
                            <span class="order-id">🚖 Активный заказ #${order.id.substring(0, 8)}</span>
                            <span class="price">${formatPrice(order.price)}</span>
                        </div>
                        <div class="route">
                            📍 ${order.pickup?.address || '—'}
                            <span class="arrow">→</span>
                            🏁 ${order.destination?.address || '—'}
                        </div>
                        <div class="meta">
                            <span>👤 ${order.clientName || 'Клиент'}</span>
                            <span>📏 ${dist}</span>
                            <span>📌 ${getStatusText(order)}</span>
                        </div>
                        ${tripSteps}
                        <div class="btn-group">
                            ${buttons}
                        </div>
                        <div id="orderStatusDetail" style="margin-top:6px; font-size:13px; color:#8899aa; text-align:center;">
                            ${statusDetail}
                        </div>
                    </div>
                `;

            // === ОБРАБОТЧИКИ ===
            document.getElementById('arriveBtn')?.addEventListener('click', function() {
                arriveToClient(order);
            });

            document.getElementById('navigateBtn')?.addEventListener('click', function() {
                navigateToClient(order);
            });

            document.getElementById('arriveDestinationBtn')?.addEventListener('click', function() {
                arriveToDestination(order);
            });

            document.getElementById('navigateDestinationBtn')?.addEventListener('click', function() {
                navigateToDestination(order);
            });

            document.getElementById('cancelOrderBtn')?.addEventListener('click', function() {
                cancelDriverOrder(order);
            });

            document.getElementById('noShowBtn')?.addEventListener('click', function() {
                clientNoShow(order);
            });

            // Обновляем состояние кнопки "Клиент не явился"
            const noShowBtn = document.getElementById('noShowBtn');
            if (noShowBtn && isWaitingForClient) {
                noShowBtn.disabled = true;
            } else if (noShowBtn && !isWaitingForClient && activeOrder && activeOrder.status === 'assigned') {
                if (!waitingTimerInterval) {
                    startWaitingTimer(order);
                }
            }
        }

        // ============================================================
        // ПРИНЯТЬ ЗАКАЗ
        // ============================================================
        window.acceptOrder = function(orderId) {
            const order = availableOrders.find(o => o.id === orderId);
            if (!order) {
                showToast('❌ Заказ не найден', 'error');
                return;
            }

            if (!driverLocation) {
                showToast('⚠️ Определите местоположение', 'warning');
                return;
            }

            if (order.distance && order.distance > 10) {
                if (!confirm(`⚠️ Расстояние до клиента ${order.distance.toFixed(1)} км. Вы уверены?`)) {
                    return;
                }
            }

            const orderRef = db.collection('orders').doc(orderId);
            orderRef.update({
                driverId: currentUser.uid,
                driverName: userData?.displayName || 'Водитель',
                status: 'assigned',
                assignedAt: firebase.firestore.FieldValue.serverTimestamp(),
                assignedManually: false,
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'auto',
                    distance: order.distance || null
                })
            }).then(() => {
                showToast(`✅ Вы приняли заказ`, 'success');
                loadActiveOrder();
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        };

        // ============================================================
        // ОТКЛОНИТЬ ЗАКАЗ
        // ============================================================
        window.rejectOrder = function(orderId) {
            if (!confirm('Отклонить заказ?')) return;

            const orderRef = db.collection('orders').doc(orderId);
            orderRef.update({
                status: 'searching',
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'rejected'
                })
            }).then(() => {
                showToast('❌ Заказ отклонён', 'warning');
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        };

        // ============================================================
        // ПРИБЫЛ К КЛИЕНТУ
        // ============================================================
        function arriveToClient(order) {
            if (!driverLocation || !order.pickup || !order.pickup.lat || !order.pickup.lng) {
                showToast('⚠️ Нет данных о местоположении', 'warning');
                return;
            }

            const distance = haversineDistance(
                driverLocation.lat, driverLocation.lng,
                order.pickup.lat, order.pickup.lng
            );

            if (distance > 0.2) {
                showToast(`⚠️ Вы слишком далеко от клиента (${(distance * 1000).toFixed(0)} м)`, 'warning');
                return;
            }

            stopWaitingTimer();

            const orderRef = db.collection('orders').doc(order.id);
            orderRef.update({
                status: 'in_progress',
                startedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                showToast('✅ Вы прибыли к клиенту! Поездка началась.', 'success');
                loadActiveOrder();
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        }

        // ============================================================
        // КЛИЕНТ НЕ ЯВИЛСЯ
        // ============================================================
        function clientNoShow(order) {
            if (!confirm('⚠️ Клиент не явился. Применить штраф 7 ₪?')) return;

            if (!driverLocation || !order.pickup || !order.pickup.lat || !order.pickup.lng) {
                showToast('⚠️ Нет данных о местоположении', 'warning');
                return;
            }

            const distance = haversineDistance(
                driverLocation.lat, driverLocation.lng,
                order.pickup.lat, order.pickup.lng
            );

            if (distance > 0.2) {
                showToast(`⚠️ Вы слишком далеко от места отправления`, 'warning');
                return;
            }

            const orderRef = db.collection('orders').doc(order.id);
            const PENALTY = 7;

            orderRef.update({
                status: 'cancelled',
                cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
                cancellationReason: 'Клиент не явился',
                penaltyApplied: PENALTY,
                cancelledBy: 'driver_no_show'
            }).then(() => {
                db.collection('users').doc(order.clientId).update({
                    balance: firebase.firestore.FieldValue.increment(-PENALTY),
                    penalty: firebase.firestore.FieldValue.increment(PENALTY)
                }).catch(err => console.error('Ошибка списания штрафа с клиента:', err));

                db.collection('users').doc(currentUser.uid).update({
                    balance: firebase.firestore.FieldValue.increment(PENALTY)
                }).catch(err => console.error('Ошибка начисления компенсации:', err));

                showToast(`✅ Заказ отменён. Штраф ${formatPrice(PENALTY)}`, 'warning');
                stopWaitingTimer();
                setTimeout(() => {
                    loadAvailableOrders();
                    loadActiveOrder();
                }, 1000);
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        }

        // ============================================================
        // ПРИБЫЛ К МЕСТУ НАЗНАЧЕНИЯ
        // ============================================================
        function arriveToDestination(order) {
            if (!driverLocation || !order.destination || !order.destination.lat || !order.destination.lng) {
                showToast('⚠️ Нет данных о местоположении', 'warning');
                return;
            }

            const distance = haversineDistance(
                driverLocation.lat, driverLocation.lng,
                order.destination.lat, order.destination.lng
            );

            if (distance > 0.2) {
                showToast(`⚠️ Вы слишком далеко от места назначения (${(distance * 1000).toFixed(0)} м)`, 'warning');
                return;
            }

            const orderRef = db.collection('orders').doc(order.id);
            orderRef.update({
                status: 'completed',
                completedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                showToast('✅ Поездка завершена! Спасибо!', 'success');
                createOrderTransactions(order);
                setTimeout(() => {
                    loadAvailableOrders();
                    loadActiveOrder();
                }, 1000);
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        }

        // ============================================================
        // НАВИГАЦИЯ (ТОЛЬКО WAZE)
        // ============================================================
        function getWazeLink(lat, lng, address) {
            if (lat && lng) {
                return `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`;
            }
            if (address && address.trim() !== '') {
                return `https://waze.com/ul?q=${encodeURIComponent(address)}&navigate=yes`;
            }
            return null;
        }

        function navigateToClient(order) {
            const lat = order.pickup?.lat;
            const lng = order.pickup?.lng;
            const address = order.pickup?.address;
            const link = getWazeLink(lat, lng, address);
            if (link) {
                window.open(link, '_blank');
                showToast('🧭 Waze к клиенту', 'info');
            } else {
                showToast('⚠️ Нет данных для навигации', 'error');
            }
        }

        function navigateToDestination(order) {
            const lat = order.destination?.lat;
            const lng = order.destination?.lng;
            const address = order.destination?.address;
            const link = getWazeLink(lat, lng, address);
            if (link) {
                window.open(link, '_blank');
                showToast('🧭 Waze к назначению', 'info');
            } else {
                showToast('⚠️ Нет данных для навигации', 'error');
            }
        }

        // ============================================================
        // ТРАНЗАКЦИИ (КОМИССИЯ 10%)
        // ============================================================
        function createOrderTransactions(order) {
            const price = order.price || 0;
            const COMMISSION = 0.10;
            const commission = price * COMMISSION;
            const driverEarn = price - commission;

            db.collection('transactions').add({
                userId: currentUser.uid,
                orderId: order.id,
                type: 'earning',
                amount: driverEarn,
                description: `Заработок #${order.id.substring(0, 8)} (90%)`,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                balanceAfter: (userData?.balance || 0) + driverEarn
            }).catch(err => console.error('Ошибка транзакции водителя:', err));

            db.collection('transactions').add({
                userId: order.clientId,
                orderId: order.id,
                type: 'payment',
                amount: -price,
                description: `Оплата #${order.id.substring(0, 8)}`,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                balanceAfter: 0
            }).catch(err => console.error('Ошибка транзакции клиента:', err));

            db.collection('users').doc(currentUser.uid).update({
                balance: firebase.firestore.FieldValue.increment(driverEarn),
                totalEarned: firebase.firestore.FieldValue.increment(driverEarn)
            }).catch(err => console.error('Ошибка обновления баланса водителя:', err));

            db.collection('users').doc(order.clientId).update({
                balance: firebase.firestore.FieldValue.increment(-price),
                totalSpent: firebase.firestore.FieldValue.increment(price)
            }).catch(err => console.error('Ошибка обновления баланса клиента:', err));
        }

        // ============================================================
        // ОТМЕНА ПОЕЗДКИ ВОДИТЕЛЕМ
        // ============================================================
        function cancelDriverOrder(order) {
            if (!confirm('⚠️ Отменить поездку? Возможен штраф 7 ₪.')) return;

            const reason = prompt('Причина отмены:');
            if (reason === null) return;

            const orderRef = db.collection('orders').doc(order.id);
            let penalty = 0;

            if (order.status === 'in_progress') {
                penalty = 7;
            } else if (order.status === 'assigned') {
                if (order.assignedAt) {
                    const assignedTime = order.assignedAt.toDate ? order.assignedAt.toDate() : new Date(order.assignedAt);
                    const elapsed = (Date.now() - assignedTime.getTime()) / 60000;
                    if (elapsed > 2) {
                        penalty = 7;
                    }
                }
            }

            orderRef.update({
                status: 'cancelled',
                cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
                cancellationReason: reason || 'Отменено водителем',
                penaltyApplied: penalty,
                cancelledBy: 'driver'
            }).then(() => {
                if (penalty > 0) {
                    db.collection('users').doc(currentUser.uid).update({
                        balance: firebase.firestore.FieldValue.increment(-penalty),
                        penalty: firebase.firestore.FieldValue.increment(penalty)
                    }).then(() => {
                        showToast(`💰 Списан штраф ${formatPrice(penalty)}`, 'warning');
                    }).catch(err => console.error('Ошибка списания штрафа:', err));
                }

                showToast('❌ Поездка отменена', 'error');
                stopWaitingTimer();
                setTimeout(() => {
                    loadAvailableOrders();
                    loadActiveOrder();
                }, 1000);
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        }

        // ============================================================
        // СТАТУС ВОДИТЕЛЯ
        // ============================================================
        function updateQueueCount() {
            el.ordersAvailableCount.textContent = availableOrders.length;
        }

        function setDriverStatus(status) {
            if (!currentUser) return;
            isOnline = (status === 'online');

            const statusMap = {
                'online': { badge: '🟢 Онлайн', text: 'Ожидание' },
                'offline': { badge: '⚪ Офлайн', text: 'Не в сети' },
                'busy': { badge: '🟡 Занят', text: 'Выполняет заказ' }
            };

            const info = statusMap[status] || statusMap['offline'];

            el.statusBadge.className = 'status-badge ' + status;
            el.statusBadge.textContent = info.badge;
            el.driverStatusText.textContent = info.text;

            db.collection('users').doc(currentUser.uid).update({
                'driverData.isAvailable': (status === 'online')
            }).then(() => {
                if (status === 'online') {
                    startGeolocation();
                    loadAvailableOrders();
                    loadActiveOrder();
                    showToast('🟢 Вы онлайн', 'success');
                } else {
                    if (watchId) {
                        navigator.geolocation.clearWatch(watchId);
                        watchId = null;
                    }
                    if (unsubAvailableOrders) {
                        unsubAvailableOrders();
                        unsubAvailableOrders = null;
                    }
                    if (unsubActiveOrder) {
                        unsubActiveOrder();
                        unsubActiveOrder = null;
                    }
                    el.availableOrdersList.innerHTML = '';
                    el.activeOrderCard.innerHTML = '';
                    el.activeOrderTitle.style.display = 'none';
                    el.ordersAvailableCount.textContent = '0';
                    showToast('⚪ Вы офлайн', 'info');
                }
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        }

        // ============================================================
        // ОБРАБОТЧИКИ
        // ============================================================
        el.onlineBtn.addEventListener('click', function() { setDriverStatus('online'); });
        el.offlineBtn.addEventListener('click', function() { setDriverStatus('offline'); });

        el.refreshLocationBtn.addEventListener('click', function() {
            if (!isOnline) {
                showToast('⚠️ Включите онлайн-режим', 'warning');
                return;
            }
            startGeolocation();
            showToast('📍 Обновление геолокации...', 'info');
        });

        el.refreshBtn.addEventListener('click', function() {
            showToast('🔄 Обновлено', 'info');
            loadAvailableOrders();
            loadActiveOrder();
        });

        el.backBtn.addEventListener('click', function() {
            if (activeOrder) {
                if (!confirm('У вас есть активный заказ. Вернуться в кабинет?')) return;
            }
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            if (unsubAvailableOrders) {
                unsubAvailableOrders();
                unsubAvailableOrders = null;
            }
            if (unsubActiveOrder) {
                unsubActiveOrder();
                unsubActiveOrder = null;
            }
            stopWaitingTimer();
            window.location.href = 'driver.html';
        });

        // ============================================================
        // ЗАГРУЗКА ДАННЫХ ВОДИТЕЛЯ
        // ============================================================
        function subscribeToDriverData(uid) {
            if (unsubUser) {
                unsubUser();
                unsubUser = null;
            }

            const userRef = db.collection('users').doc(uid);
            unsubUser = userRef.onSnapshot(function(doc) {
                if (doc.exists) {
                    userData = doc.data();
                    el.driverName.textContent = userData.displayName || 'Водитель';

                    const isAvail = userData.driverData?.isAvailable;
                    if (isAvail === true) {
                        setDriverStatus('online');
                    } else if (isAvail === false) {
                        setDriverStatus('offline');
                    } else {
                        setDriverStatus('online');
                    }

                    if (userData.driverData?.location) {
                        const loc = userData.driverData.location;
                        driverLocation = { lat: loc.lat, lng: loc.lng };
                        el.driverLocation.textContent = `${loc.lat.toFixed(6)}, ${loc.lng.toFixed(6)}`;
                        if (map) {
                            if (driverMarker) {
                                map.removeLayer(driverMarker);
                            }
                            const icon = L.divIcon({
                                html: '🚗🟢',
                                className: '',
                                iconSize: [32, 32],
                                iconAnchor: [16, 32]
                            });
                            driverMarker = L.marker([loc.lat, loc.lng], { icon: icon })
                                .addTo(map)
                                .bindPopup('🚗 Вы здесь');
                            map.setView([loc.lat, loc.lng], 15);
                        }
                    }
                }
            }, function(error) {
                console.error('Ошибка подписки на данные:', error);
            });
        }

        // ============================================================
        // АВТОРИЗАЦИЯ
        // ============================================================
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = user;

            db.collection('users').doc(user.uid).get()
                .then(function(doc) {
                    if (!doc.exists) {
                        showToast('❌ Профиль не найден', 'error');
                        setTimeout(() => window.location.href = 'index.html', 1500);
                        return;
                    }
                    const data = doc.data();
                    if (data.role !== 'driver') {
                        showToast('⛔ Только для водителей', 'error');
                        setTimeout(() => window.location.href = 'index.html', 1500);
                        return;
                    }

                    initMap();
                    subscribeToDriverData(user.uid);

                })
                .catch(function(err) {
                    console.error('Auth error:', err);
                    window.location.href = 'index.html';
                });
        });

        console.log('✅ Страница работы водителя готова');
    </script>

</body>
</html>
