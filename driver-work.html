    <style>

        .toast {

            max-width: 88%;
            text-align: center;
        }
        .toast.show {
            display: block;
            animation: slideUp 0.3s ease;

        @keyframes slideUp {
            from {

    <!-- ============================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        console.log('🔥 WHEEL — Работа водителя (финальная версия)');

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let userData = null;
        let driverLocation = null;
        let lastSentLocation = null; // для оптимизации GPS
        let availableOrders = [];
        let activeOrder = null;
        let currentOffer = null;
        let isOnline = false;
        let isPenaltyActive = false;
        let map = null;
        let driverMarker = null;
        let clientMarker = null;
        let destinationMarker = null;
        let watchId = null;
        let offerTimer = null;
        let offerRemaining = 30;
        let penaltyTimer = null;
        let penaltyRemaining = 0;
        let unsubOrders = null; // одна подписка на все заказы
        let unsubUser = null;
        let isTracking = false;
        let routePoints = [];
        let routeLine = null;

        const AI_RADIUS_KM = 2.5;
        const OFFER_TIMEOUT = 30;
        const PENALTY_SECONDS = 120;
        const GPS_UPDATE_INTERVAL = 60000; // 60 сек
        const GPS_MIN_DISTANCE = 0.05; // 50 м

        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        const el = {
            backBtn: $('backBtn'),
            statusBadge: $('statusBadge'),
            driverName: $('driverName'),
            driverStatus: $('driverStatus'),
            locationTime: $('locationTime'),
            ordersCount: $('ordersCount'),
            availableOrdersList: $('availableOrdersList'),
            activeOrderCard: $('activeOrderCard'),
            activeOrderTitle: $('activeOrderTitle'),
            offerContainer: $('offerContainer'),
            penaltyBanner: $('penaltyBanner'),
            penaltyTimer: $('penaltyTimer'),
            onlineBtn: $('onlineBtn'),
            offlineBtn: $('offlineBtn'),
            refreshLocationBtn: $('refreshLocationBtn'),
            refreshBtn: $('refreshBtn'),
            toast: $('toast'),
            toastMessage: $('toastMessage'),
            map: $('map')
        };

        // ============================================================
        // UTILITY
        // ============================================================
        function showToast(text, type = 'info') {
            el.toast.className = 'toast show ' + type;
            el.toastMessage.textContent = text;
            clearTimeout(el.toast._timeout);
            el.toast._timeout = setTimeout(() => {
                el.toast.className = 'toast';
            }, 3500);
        }

        function formatPrice(p) { return (p || 0).toFixed(2) + ' ₪'; }

        function formatDate(ts) {
            if (!ts) return '—';
            try {
                const d = ts.toDate ? ts.toDate() : new Date(ts);
                return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            } catch { return '—'; }
        }

        function haversineDistance(lat1, lng1, lat2, lng2) {
            if (!lat1 || !lng1 || !lat2 || !lng2) return Infinity;
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) ** 2;
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function getDistanceToOrder(order) {
            if (!driverLocation || !order?.pickup?.lat) return Infinity;
            return haversineDistance(
                driverLocation.lat, driverLocation.lng,
                order.pickup.lat, order.pickup.lng
            );
        }

        // ============================================================
        // MAP
        // ============================================================
        function initMap() {
            map = L.map('map').setView([32.0853, 34.7818], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19
            }).addTo(map);
            console.log('🗺️ Карта готова');
        }

        function createDriverIcon() {
            return L.divIcon({ html: '🚗', className: '', iconSize: [32, 32], iconAnchor: [16, 32] });
        }

        function createClientIcon() {
            return L.divIcon({ html: '🟢', className: '', iconSize: [28, 28], iconAnchor: [14, 28] });
        }

        function createDestinationIcon() {
            return L.divIcon({ html: '🔴', className: '', iconSize: [28, 28], iconAnchor: [14, 28] });
        }

        function updateDriverMarker(lat, lng) {
            if (driverMarker) {
                driverMarker.setLatLng([lat, lng]);
            } else {
                driverMarker = L.marker([lat, lng], { icon: createDriverIcon() })
                    .addTo(map)
                    .bindPopup('🚗 Вы здесь');
            }
            if (!activeOrder) map.setView([lat, lng], 15);
        }

        function updateOrderMarkers() {
            // Удаляем старые маркеры клиента и назначения
            if (clientMarker) { map.removeLayer(clientMarker);
                clientMarker = null; }
            if (destinationMarker) { map.removeLayer(destinationMarker);
                destinationMarker = null; }

            if (!activeOrder) return;

            if (activeOrder.pickup?.lat) {
                clientMarker = L.marker([activeOrder.pickup.lat, activeOrder.pickup.lng], { icon: createClientIcon() })
                    .addTo(map)
                    .bindPopup('🟢 Клиент: ' + (activeOrder.pickup.address || ''));
            }
            if (activeOrder.destination?.lat) {
                destinationMarker = L.marker([activeOrder.destination.lat, activeOrder.destination.lng], { icon: createDestinationIcon() })
                    .addTo(map)
                    .bindPopup('🔴 Назначение: ' + (activeOrder.destination.address || ''));
            }

            // Если есть и клиент, и назначение — центрируем карту на них
            if (driverLocation && clientMarker) {
                const bounds = L.latLngBounds([driverLocation.lat, driverLocation.lng], [activeOrder.pickup.lat, activeOrder
                    .pickup.lng
                ]);
                if (destinationMarker) bounds.extend([activeOrder.destination.lat, activeOrder.destination.lng]);
                map.fitBounds(bounds, { padding: [40, 40] });
            }
        }

        // ============================================================
        // GEOLOCATION (оптимизированная)
        // ============================================================
        function startGeolocation() {
            if (!navigator.geolocation) {
                showToast('❌ GPS не поддерживается', 'error');
                return;
            }
            if (watchId) { navigator.geolocation.clearWatch(watchId);
                watchId = null; }

            // Первое определение — сразу
            navigator.geolocation.getCurrentPosition(
                pos => updateLocation(pos.coords.latitude, pos.coords.longitude, true),
                err => console.error('GPS первичная ошибка:', err),
                { enableHighAccuracy: true, timeout: 10000 }
            );

            // Далее — реже, с учётом интервала и минимального смещения
            watchId = navigator.geolocation.watchPosition(
                pos => updateLocation(pos.coords.latitude, pos.coords.longitude, false),
                err => console.error('GPS ошибка:', err),
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: GPS_UPDATE_INTERVAL, // не чаще чем раз в 60 сек
                }
            );

            // Также принудительно обновляем время на экране каждые 30 сек (без запроса к БД)
            setInterval(() => {
                if (driverLocation) {
                    el.locationTime.textContent = new Date().toLocaleTimeString();
                }
            }, 30000);

            console.log(`📍 GPS запущен (интервал ~${GPS_UPDATE_INTERVAL/1000} сек)`);
        }

        function updateLocation(lat, lng, force = false) {
            // Проверяем, нужно ли обновлять (если не force и смещение маленькое)
            if (!force && lastSentLocation) {
                const dist = haversineDistance(lat, lng, lastSentLocation.lat, lastSentLocation.lng);
                if (dist < GPS_MIN_DISTANCE) {
                    // Обновляем только маркер на карте, но не отправляем в БД
                    updateDriverMarker(lat, lng);
                    return;
                }
            }

            driverLocation = { lat, lng };
            lastSentLocation = { lat, lng };
            el.locationTime.textContent = new Date().toLocaleTimeString();

            updateDriverMarker(lat, lng);

            // Отправляем в Firebase только если это необходимо (и водитель онлайн)
            if (currentUser && isOnline) {
                db.collection('users').doc(currentUser.uid).update({
                    'driverData.location': { lat, lng },
                    'driverData.lastUpdated': firebase.firestore.FieldValue.serverTimestamp()
                }).catch(err => console.error('Ошибка сохранения GPS:', err));
            }

            // Обновляем отображение заказов (без переподписки)
            updateOrdersUI();
            updateOrderMarkers();

            // Если есть активный заказ и трекинг — добавляем точку в маршрут
            if (isTracking && activeOrder) {
                routePoints.push({ lat, lng, timestamp: new Date().toISOString() });
                updateRouteLine();
            }
        }

        // ============================================================
        // ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ЗАКАЗОВ (без лишних подписок)
        // ============================================================
        function updateOrdersUI() {
            // Обновляем список доступных заказов
            renderAvailableOrders();
            // Обновляем активный заказ
            if (activeOrder) renderActiveOrder(activeOrder);
            // Счётчик
            el.ordersCount.textContent = availableOrders.length;
        }

        // ============================================================
        // ПОДПИСКА НА ВСЕ ЗАКАЗЫ (ОДНА вместо трёх)
        // ============================================================
        function subscribeToOrders() {
            if (unsubOrders) {
                unsubOrders();
                unsubOrders = null;
            }

            if (!currentUser || !isOnline) return;

            console.log('📦 Подписка на заказы (оптимизированная)...');

            // Подписываемся на все заказы, где участвует этот водитель или которые свободны
            // Используем один запрос с несколькими условиями через 'in'
            // Но Firestore не позволяет 'in' с несколькими полями, поэтому делаем запрос на все заказы,
            // где статус в нужных нам состояниях, и фильтруем на клиенте.
            // Чтобы уменьшить трафик, добавляем лимит 50 (максимум заказов, которые могут быть активны)
            unsubOrders = db.collection('orders')
                .where('status', 'in', ['new', 'searching', 'assigned', 'in_progress'])
                .orderBy('createdAt', 'desc')
                .limit(50) // ограничиваем количество, чтобы не грузить лишнее
                .onSnapshot(snapshot => {
                    const allOrders = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        allOrders.push({ id: doc.id, ...data });
                    });

                    // Разделяем на доступные и активные
                    availableOrders = allOrders.filter(o =>
                        (o.status === 'new' || o.status === 'searching') &&
                        !o.driverId // не назначен
                    );

                    // Сортируем по расстоянию (если есть геолокация)
                    if (driverLocation) {
                        availableOrders.forEach(o => o.distance = getDistanceToOrder(o));
                        availableOrders.sort((a, b) => (a.distance || Infinity) - (b.distance || Infinity));
                    }

                    // Активный заказ — где driverId === currentUser.uid и статус assigned/in_progress
                    const foundActive = allOrders.find(o =>
                        o.driverId === currentUser.uid &&
                        (o.status === 'assigned' || o.status === 'in_progress')
                    );

                    if (foundActive) {
                        if (!activeOrder || activeOrder.id !== foundActive.id) {
                            activeOrder = foundActive;
                            el.activeOrderTitle.style.display = 'block';
                            updateOrderMarkers();
                            if (activeOrder.status === 'in_progress' && !isTracking) startTracking();
                            // Меняем статус
                            el.statusBadge.className = 'status-badge busy';
                            el.statusBadge.textContent = '🟡 Занят';
                            el.driverStatus.textContent = 'Выполняет заказ';
                            // Если есть предложение — убираем
                            if (currentOffer) clearOffer();
                        }
                    } else {
                        if (activeOrder) {
                            activeOrder = null;
                            el.activeOrderCard.innerHTML = '';
                            el.activeOrderTitle.style.display = 'none';
                            clearOrderMarkers();
                            stopTracking();
                            if (isOnline && !isPenaltyActive) {
                                el.statusBadge.className = 'status-badge online';
                                el.statusBadge.textContent = '🟢 Онлайн';
                                el.driverStatus.textContent = 'Ожидание';
                            }
                        }
                    }

                    // Обновляем UI
                    renderAvailableOrders();
                    if (activeOrder) renderActiveOrder(activeOrder);
                    el.ordersCount.textContent = availableOrders.length;

                    // Проверяем, есть ли заказы рядом и нет активного предложения
                    if (!currentOffer && !activeOrder && !isPenaltyActive && isOnline && driverLocation) {
                        const nearby = availableOrders.filter(o => getDistanceToOrder(o) <= AI_RADIUS_KM);
                        if (nearby.length > 0) {
                            // Берём ближайший
                            const best = nearby.reduce((a, b) =>
                                (getDistanceToOrder(a) || Infinity) < (getDistanceToOrder(b) || Infinity) ? a : b
                            );
                            sendOffer(best);
                        }
                    }

                }, err => {
                    console.error('Ошибка подписки на заказы:', err);
                });
        }

        // ============================================================
        // ОТОБРАЖЕНИЕ ДОСТУПНЫХ ЗАКАЗОВ
        // ============================================================
        function renderAvailableOrders() {
            const list = el.availableOrdersList;

            if (currentOffer) {
                list.innerHTML =
                    `<div class="empty-state"><div class="icon">🤖</div><div>Есть предложение от ИИ-диспетчера</div></div>`;
                return;
            }
            if (isPenaltyActive) {
                list.innerHTML =
                    `<div class="empty-state"><div class="icon">⛔</div><div>Вы на штрафе</div></div>`;
                return;
            }
            if (availableOrders.length === 0) {
                list.innerHTML =
                    `<div class="empty-state"><div class="icon">📦</div><div>Нет доступных заказов</div></div>`;
                return;
            }

            let html = '';
            availableOrders.slice(0, 5).forEach(o => {
                const dist = o.distance !== Infinity ? o.distance.toFixed(1) + ' км' : '—';
                const isNearby = o.distance <= AI_RADIUS_KM;
                html += `
                    <div class="order-card" style="${isNearby ? 'border-color: rgba(255,180,0,0.2);' : ''}">
                        <div class="header-order">
                            <span class="order-id">#${o.id.substring(0,8)} <small>${formatDate(o.createdAt)}</small></span>
                            <span class="price">${formatPrice(o.price)}</span>
                        </div>
                        <div class="route">📍 ${o.pickup?.address || '—'} <span class="arrow">→</span> 🏁 ${o.destination?.address || '—'}</div>
                        <div class="meta">👤 ${o.clientName || 'Клиент'} • 📏 ${dist} ${isNearby ? '• 🟢 Рядом!' : ''}</div>
                        <div class="btn-group">
                            <button class="btn-icon btn-success" onclick="manualAccept('${o.id}')">
                                <span class="icon">✅</span><span class="label">Принять</span>
                            </button>
                            <button class="btn-icon btn-danger" onclick="manualReject('${o.id}')">
                                <span class="icon">✖</span><span class="label">Отклонить</span>
                            </button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        // ============================================================
        // РУЧНОЕ ПРИНЯТИЕ/ОТКАЗ
        // ============================================================
        window.manualAccept = function(orderId) {
            if (isPenaltyActive) { showToast('⛔ Вы на штрафе!', 'error'); return; }
            const order = availableOrders.find(o => o.id === orderId);
            if (!order) return;

            db.collection('orders').doc(orderId).update({
                driverId: currentUser.uid,
                driverName: userData?.displayName || 'Водитель',
                status: 'assigned',
                assignedAt: firebase.firestore.FieldValue.serverTimestamp(),
                assignedManually: true,
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'manual'
                })
            }).then(() => {
                showToast('✅ Заказ принят!', 'success');
            }).catch(err => showToast('❌ Ошибка: ' + err.message, 'error'));
        };

        window.manualReject = function(orderId) {
            if (!confirm('Отклонить заказ?')) return;
            db.collection('orders').doc(orderId).update({
                status: 'searching',
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'rejected'
                })
            }).then(() => showToast('❌ Заказ отклонён', 'warning'))
                .catch(err => showToast('❌ Ошибка: ' + err.message, 'error'));
        };

        // ============================================================
        // ПРЕДЛОЖЕНИЕ (ОТ ИИ)
        // ============================================================
        function sendOffer(order) {
            if (currentOffer || activeOrder || isPenaltyActive || !isOnline) return;
            currentOffer = order;
            renderOffer(order);

            showToast(`📨 Предложение от ИИ-диспетчера! #${order.id.substring(0,8)}`, 'warning');
            console.log(`📨 Предложение отправлено: #${order.id.substring(0,8)}`);

            offerRemaining = OFFER_TIMEOUT;
            startOfferTimer();

            setTimeout(() => {
                if (currentOffer?.id === order.id) {
                    console.log(`⏰ Время истекло, авто-отказ #${order.id.substring(0,8)}`);
                    autoReject(order);
                }
            }, OFFER_TIMEOUT * 1000);
        }

        function renderOffer(order) {
            const dist = order.distance !== null ? order.distance.toFixed(1) + ' км' : '—';
            el.offerContainer.innerHTML = `
                <div class="offer-card">
                    <div class="offer-header">
                        <span class="offer-badge">🤖 ИИ-диспетчер</span>
                        <span class="offer-timer" id="offerTimer">${OFFER_TIMEOUT}s</span>
                    </div>
                    <div class="route">📍 ${order.pickup?.address || '—'} <span class="arrow">→</span> 🏁 ${order.destination?.address || '—'}</div>
                    <div class="meta">👤 ${order.clientName || 'Клиент'} • 📏 ${dist}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
                        <span class="price-big">${formatPrice(order.price)}</span>
                        <span style="font-size:11px; color:#667788;">💰 Предложение</span>
                    </div>
                    <div class="offer-actions">
                        <button class="btn btn-accept" id="acceptOfferBtn">✅ Принять</button>
                        <button class="btn btn-reject" id="rejectOfferBtn">✖ Отказать</button>
                    </div>
                    <div style="font-size:10px; color:#667788; margin-top:6px; text-align:center;">⏱️ У вас ${OFFER_TIMEOUT} секунд</div>
                </div>
            `;

            $('acceptOfferBtn').addEventListener('click', () => acceptOffer(order));
            $('rejectOfferBtn').addEventListener('click', () => rejectOffer(order));
        }

        function startOfferTimer() {
            if (offerTimer) clearInterval(offerTimer);
            offerTimer = setInterval(() => {
                offerRemaining--;
                const timer = $('offerTimer');
                if (timer) {
                    timer.textContent = offerRemaining + 's';
                    timer.classList.toggle('warning', offerRemaining < 10);
                }
                if (offerRemaining <= 0) { clearInterval(offerTimer);
                    offerTimer = null; }
            }, 1000);
        }

        function acceptOffer(order) {
            if (!currentOffer || currentOffer.id !== order.id) return;
            clearOffer();

            console.log(`✅ Принят заказ #${order.id.substring(0,8)}`);

            db.collection('orders').doc(order.id).update({
                driverId: currentUser.uid,
                driverName: userData?.displayName || 'Водитель',
                status: 'assigned',
                assignedAt: firebase.firestore.FieldValue.serverTimestamp(),
                assignedByAI: true,
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'ai_auto',
                    accepted: true
                })
            }).then(() => {
                showToast('✅ Заказ принят!', 'success');
                currentOffer = null;
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
                console.error('Ошибка принятия:', err);
            });
        }

        function rejectOffer(order) {
            if (!currentOffer || currentOffer.id !== order.id) return;
            clearOffer();

            console.log(`❌ Отказ от заказа #${order.id.substring(0,8)}`);

            startPenalty(PENALTY_SECONDS);

            db.collection('orders').doc(order.id).update({
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'ai_auto',
                    accepted: false,
                    penalty: true
                })
            }).catch(err => console.error('Ошибка:', err));

            showToast('⛔ Штраф 2 минуты за отказ!', 'error');
            currentOffer = null;
        }

        function autoReject(order) {
            if (!currentOffer || currentOffer.id !== order.id) return;
            clearOffer();

            console.log(`⏰ Авто-отказ #${order.id.substring(0,8)}`);

            startPenalty(PENALTY_SECONDS);

            db.collection('orders').doc(order.id).update({
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    method: 'ai_auto',
                    autoReject: true,
                    penalty: true
                })
            }).catch(err => console.error('Ошибка:', err));

            showToast('⛔ Время истекло! Штраф 2 минуты', 'error');
            currentOffer = null;
        }

        function clearOffer() {
            if (offerTimer) { clearInterval(offerTimer);
                offerTimer = null; }
            el.offerContainer.innerHTML = '';
            currentOffer = null;
        }

        // ============================================================
        // ШТРАФ
        // ============================================================
        function startPenalty(seconds) {
            if (isPenaltyActive) return;
            isPenaltyActive = true;
            penaltyRemaining = seconds;
            el.penaltyBanner.style.display = 'block';
            el.statusBadge.className = 'status-badge penalty';
            el.statusBadge.textContent = '⛔ Штраф';

            if (penaltyTimer) clearInterval(penaltyTimer);
            penaltyTimer = setInterval(() => {
                penaltyRemaining--;
                const m = String(Math.floor(penaltyRemaining / 60)).padStart(2, '0');
                const s = String(penaltyRemaining % 60).padStart(2, '0');
                el.penaltyTimer.textContent = `${m}:${s}`;
                if (penaltyRemaining <= 0) {
                    clearInterval(penaltyTimer);
                    penaltyTimer = null;
                    isPenaltyActive = false;
                    el.penaltyBanner.style.display = 'none';
                    el.statusBadge.className = 'status-badge online';
                    el.statusBadge.textContent = '🟢 Онлайн';
                    el.driverStatus.textContent = 'Ожидание';
                    showToast('✅ Штраф окончен!', 'success');
                    db.collection('users').doc(currentUser.uid).update({
                        'driverData.isAvailable': true,
                        'driverData.penaltyEnd': null
                    }).catch(() => {});
                }
            }, 1000);

            db.collection('users').doc(currentUser.uid).update({
                'driverData.isAvailable': false,
                'driverData.penaltyEnd': firebase.firestore.FieldValue.serverTimestamp()
            }).catch(() => {});
        }

        // ============================================================
        // АКТИВНЫЙ ЗАКАЗ (отображение)
        // ============================================================
        function renderActiveOrder(order) {
            const dist = order.distance ? order.distance.toFixed(1) + ' км' : '—';
            let buttons = '',
                statusDetail = '',
                tripSteps = '';

            if (order.status === 'assigned') {
                buttons = `
                    <button class="btn-icon btn-warning" id="arriveBtn"><span class="icon">📍</span><span class="label">Прибыл</span></button>
                    <button class="btn-icon btn-primary" id="navigateBtn"><span class="icon">🧍</span><span class="label">К клиенту</span></button>
                    <button class="btn-icon btn-danger" id="cancelBtn"><span class="icon">✖</span><span class="label">Отменить</span></button>
                `;
                statusDetail = '🟡 Ожидайте клиента';
                tripSteps =
                    `<div class="trip-steps"><div class="trip-step active"><span class="icon">📍</span> К клиенту</div><div class="trip-step-line"></div><div class="trip-step"><span class="icon">🚗</span> В пути</div><div class="trip-step-line"></div><div class="trip-step"><span class="icon">🏁</span> Назначение</div></div>`;
            } else if (order.status === 'in_progress') {
                buttons = `
                    <button class="btn-icon btn-success" id="arriveDestBtn"><span class="icon">✅</span><span class="label">Прибыл</span></button>
                    <button class="btn-icon btn-primary" id="navigateDestBtn"><span class="icon">📍</span><span class="label">К назначению</span></button>
                    <button class="btn-icon btn-danger" id="cancelBtn"><span class="icon">✖</span><span class="label">Отменить</span></button>
                `;
                statusDetail = '🚗 В пути';
                tripSteps =
                    `<div class="trip-steps"><div class="trip-step"><span class="icon">📍</span> К клиенту</div><div class="trip-step-line active"></div><div class="trip-step active"><span class="icon">🚗</span> В пути</div><div class="trip-step-line"></div><div class="trip-step"><span class="icon">🏁</span> Назначение</div></div>`;
            } else if (order.status === 'completed') {
                tripSteps =
                    `<div class="trip-steps"><div class="trip-step"><span class="icon">📍</span> К клиенту</div><div class="trip-step-line active"></div><div class="trip-step"><span class="icon">🚗</span> В пути</div><div class="trip-step-line active"></div><div class="trip-step active"><span class="icon">✅</span> Завершено</div></div>`;
                statusDetail = '✅ Поездка завершена!';
                buttons = ''; // кнопки не нужны
            }

            el.activeOrderCard.innerHTML = `
                <div class="order-card active">
                    <div class="header-order">
                        <span class="order-id">🚖 #${order.id.substring(0,8)}</span>
                        <span class="price">${formatPrice(order.price)}</span>
                    </div>
                    <div class="route">📍 ${order.pickup?.address || '—'} <span class="arrow">→</span> 🏁 ${order.destination?.address || '—'}</div>
                    <div class="meta">👤 ${order.clientName || 'Клиент'} • 📏 ${dist}</div>
                    ${tripSteps}
                    <div class="btn-group">${buttons}</div>
                    <div style="margin-top:6px; font-size:12px; color:#8899aa; text-align:center;">${statusDetail}</div>
                </div>
            `;

            // Обработчики кнопок
            $('arriveBtn')?.addEventListener('click', () => arriveToClient(order));
            $('navigateBtn')?.addEventListener('click', () => openWaze(order.pickup?.lat, order.pickup?.lng, 'клиенту'));
            $('arriveDestBtn')?.addEventListener('click', () => arriveToDestination(order));
            $('navigateDestBtn')?.addEventListener('click', () => openWaze(order.destination?.lat, order.destination?.lng,
                'назначению'));
            $('cancelBtn')?.addEventListener('click', () => cancelDriverOrder(order));
        }

        function clearOrderMarkers() {
            if (clientMarker) { map.removeLayer(clientMarker);
                clientMarker = null; }
            if (destinationMarker) { map.removeLayer(destinationMarker);
                destinationMarker = null; }
        }

        // ============================================================
        // ДЕЙСТВИЯ С ПОЕЗДКОЙ
        // ============================================================
        function arriveToClient(order) {
            if (!driverLocation || !order.pickup?.lat) {
                showToast('⚠️ Нет данных о местоположении', 'warning');
                return;
            }
            const dist = haversineDistance(driverLocation.lat, driverLocation.lng, order.pickup.lat, order.pickup.lng);
            if (dist > 0.2) {
                showToast(`⚠️ Вы далеко от клиента (${(dist*1000).toFixed(0)} м)`, 'warning');
                return;
            }
            db.collection('orders').doc(order.id).update({
                status: 'in_progress',
                startedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                showToast('✅ Поездка началась!', 'success');
                startTracking();
            }).catch(err => showToast('❌ Ошибка: ' + err.message, 'error'));
        }

        function arriveToDestination(order) {
            if (!driverLocation || !order.destination?.lat) {
                showToast('⚠️ Нет данных о местоположении', 'warning');
                return;
            }
            const dist = haversineDistance(driverLocation.lat, driverLocation.lng, order.destination.lat, order.destination
                .lng);
            if (dist > 0.2) {
                showToast(`⚠️ Вы далеко от назначения (${(dist*1000).toFixed(0)} м)`, 'warning');
                return;
            }
            stopTracking();

            const realDist = calculateRealDistance(routePoints);
            const factor = realDist / (order.distance || 1);
            const finalPrice = (order.price || 0) * factor;

            db.collection('orders').doc(order.id).update({
                status: 'completed',
                completedAt: firebase.firestore.FieldValue.serverTimestamp(),
                realDistance: realDist,
                finalPrice: finalPrice,
                routePoints: routePoints
            }).then(() => {
                showToast(`✅ Поездка завершена! ${formatPrice(finalPrice)}`, 'success');
                createTransactions(order, finalPrice);
            }).catch(err => showToast('❌ Ошибка: ' + err.message, 'error'));
        }

        function cancelDriverOrder(order) {
            if (!confirm('⚠️ Отменить поездку?')) return;
            const reason = prompt('Причина отмены:');
            if (reason === null) return;

            let penalty = (order.status === 'in_progress') ? 7 : 0;
            // Если заказ был назначен недавно (менее 2 минут), можно без штрафа
            if (order.assignedAt && order.status === 'assigned') {
                const assignedTime = order.assignedAt.toDate ? order.assignedAt.toDate() : new Date(order.assignedAt);
                const elapsed = (Date.now() - assignedTime.getTime()) / 60000;
                if (elapsed > 2) penalty = 7;
            }

            db.collection('orders').doc(order.id).update({
                status: 'cancelled',
                cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
                cancellationReason: reason || 'Отменено водителем',
                penaltyApplied: penalty,
                cancelledBy: 'driver'
            }).then(() => {
                if (penalty > 0) {
                    db.collection('users').doc(currentUser.uid).update({
                        balance: firebase.firestore.FieldValue.increment(-penalty),
                        penalty: firebase.firestore.FieldValue.increment(penalty)
                    }).then(() => showToast(`💰 Штраф ${formatPrice(penalty)}`, 'warning'));
                }
                showToast('❌ Поездка отменена', 'error');
                stopTracking();
            }).catch(err => showToast('❌ Ошибка: ' + err.message, 'error'));
        }

        // ============================================================
        // ТРЕКИНГ МАРШРУТА
        // ============================================================
        function startTracking() {
            isTracking = true;
            routePoints = [];
            if (driverLocation) {
                routePoints.push({ lat: driverLocation.lat, lng: driverLocation.lng, timestamp: new Date()
                        .toISOString() });
            }
            updateRouteLine();
        }

        function stopTracking() {
            isTracking = false;
            if (activeOrder && routePoints.length > 0) {
                db.collection('orders').doc(activeOrder.id).update({
                    routePoints: routePoints,
                    realDistance: calculateRealDistance(routePoints)
                }).catch(() => {});
            }
            routePoints = [];
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
        }

        function updateRouteLine() {
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
            if (routePoints.length < 2) return;
            routeLine = L.polyline(routePoints.map(p => [p.lat, p.lng]), {
                color: '#4ade80',
                weight: 3,
                opacity: 0.7,
                dashArray: '6,4'
            }).addTo(map);
        }

        function calculateRealDistance(points) {
            let total = 0;
            for (let i = 1; i < points.length; i++) {
                total += haversineDistance(points[i - 1].lat, points[i - 1].lng, points[i].lat, points[i].lng);
            }
            return total;
        }

        // ============================================================
        // НАВИГАЦИЯ (Waze)
        // ============================================================
        function openWaze(lat, lng, name) {
            if (!lat || !lng) {
                showToast('⚠️ Нет координат для навигации', 'error');
                return;
            }
            const link = `waze://?ll=${lat},${lng}&navigate=yes`;
            const fallback = `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`;

            try {
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = link;
                document.body.appendChild(iframe);
                let opened = false;

                iframe.onload = () => {
                    if (!opened) {
                        opened = true;
                        document.body.removeChild(iframe);
                        showToast(`🧭 Waze открыт к ${name}`, 'success');
                    }
                };
                iframe.onerror = () => {
                    if (!opened) {
                        opened = true;
                        document.body.removeChild(iframe);
                        window.open(fallback, '_blank');
                        showToast(`🧭 Открыт Waze (веб) к ${name}`, 'info');
                    }
                };

                setTimeout(() => {
                    if (!opened) {
                        opened = true;
                        if (document.body.contains(iframe)) document.body.removeChild(iframe);
                        window.open(fallback, '_blank');
                        showToast(`🧭 Открыт Waze (веб) к ${name}`, 'info');
                    }
                }, 2500);
            } catch (e) {
                window.open(fallback, '_blank');
                showToast(`🧭 Открыт Waze (веб) к ${name}`, 'info');
            }
        }

        // ============================================================
        // ТРАНЗАКЦИИ (зачисление заработка)
        // ============================================================
        function createTransactions(order, finalPrice) {
            const price = finalPrice || order.price || 0;
            const commission = price * 0.10;
            const driverEarn = price - commission;

            db.collection('transactions').add({
                userId: currentUser.uid,
                orderId: order.id,
                type: 'earning',
                amount: driverEarn,
                description: `Заработок #${order.id.substring(0,8)}`,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(() => {});

            db.collection('users').doc(currentUser.uid).update({
                balance: firebase.firestore.FieldValue.increment(driverEarn),
                totalEarned: firebase.firestore.FieldValue.increment(driverEarn)
            }).catch(() => {});
        }

        // ============================================================
        // СТАТУС (ВКЛ/ВЫКЛ)
        // ============================================================
        function setDriverStatus(status) {
            if (isPenaltyActive) {
                showToast('⛔ Вы на штрафе!', 'error');
                return;
            }
            isOnline = (status === 'online');

            if (status === 'online') {
                el.statusBadge.className = 'status-badge online';
                el.statusBadge.textContent = '🟢 Онлайн';
                el.driverStatus.textContent = 'Ожидание';
                db.collection('users').doc(currentUser.uid).update({ 'driverData.isAvailable': true }).catch(() => {});
                startGeolocation();
                subscribeToOrders(); // ОДНА подписка на всё
                showToast('🟢 Вы онлайн', 'success');
            } else {
                el.statusBadge.className = 'status-badge offline';
                el.statusBadge.textContent = '⚪ Офлайн';
                el.driverStatus.textContent = 'Не в сети';
                db.collection('users').doc(currentUser.uid).update({ 'driverData.isAvailable': false }).catch(() => {});
                if (watchId) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                if (unsubOrders) {
                    unsubOrders();
                    unsubOrders = null;
                }
                if (unsubUser) {
                    unsubUser();
                    unsubUser = null;
                }
                clearOffer();
                el.availableOrdersList.innerHTML = '';
                el.activeOrderCard.innerHTML = '';
                el.activeOrderTitle.style.display = 'none';
                el.ordersCount.textContent = '0';
                stopTracking();
                showToast('⚪ Вы офлайн', 'info');
            }
        }

        // ============================================================
        // ПОДПИСКА НА ПОЛЬЗОВАТЕЛЯ
        // ============================================================
        function subscribeToUser(uid) {
            if (unsubUser) {
                unsubUser();
                unsubUser = null;
            }
            unsubUser = db.collection('users').doc(uid).onSnapshot(doc => {
                if (doc.exists) {
                    userData = doc.data();
                    el.driverName.textContent = userData.displayName || 'Водитель';
                    const avail = userData.driverData?.isAvailable;
                    if (avail === true && !isOnline) setDriverStatus('online');
                    else if (avail === false && isOnline) setDriverStatus('offline');
                    else if (avail === undefined) setDriverStatus('online'); // по умолчанию

                    if (userData.driverData?.location) {
                        const loc = userData.driverData.location;
                        if (!driverLocation || haversineDistance(driverLocation.lat, driverLocation.lng, loc.lat, loc
                                .lng) > GPS_MIN_DISTANCE) {
                            driverLocation = { lat: loc.lat, lng: loc.lng };
                            lastSentLocation = { lat: loc.lat, lng: loc.lng };
                            updateDriverMarker(loc.lat, loc.lng);
                            updateOrdersUI();
                        }
                    }
                }
            }, err => console.error('Ошибка данных пользователя:', err));
        }

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        auth.onAuthStateChanged(user => {
            if (!user) {
                // Если нет пользователя — перенаправляем на страницу входа
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;

            db.collection('users').doc(user.uid).get().then(doc => {
                if (!doc.exists || doc.data().role !== 'driver') {
                    showToast('⛔ Доступ только для водителей', 'error');
                    setTimeout(() => window.location.href = 'cabinet.html', 1500);
                    return;
                }
                initMap();
                subscribeToUser(user.uid);
                // Автоматически включаем онлайн, если не было штрафа
                if (!isPenaltyActive) setDriverStatus('online');
            }).catch(() => window.location.href = 'index.html');
        });

        // ============================================================
        // ОБРАБОТЧИКИ СОБЫТИЙ
        // ============================================================
        el.onlineBtn.addEventListener('click', () => setDriverStatus('online'));
        el.offlineBtn.addEventListener('click', () => setDriverStatus('offline'));

        el.refreshLocationBtn.addEventListener('click', () => {
            if (!isOnline) {
                showToast('⚠️ Включите онлайн', 'warning');
                return;
            }
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => updateLocation(pos.coords.latitude, pos.coords.longitude, true),
                    () => showToast('⚠️ Ошибка GPS', 'warning'), { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        });

        el.refreshBtn.addEventListener('click', () => {
            showToast('🔄 Обновлено', 'info');
            // Принудительно обновить UI без переподписки
            updateOrdersUI();
        });

        el.backBtn.addEventListener('click', () => {
            if (activeOrder && !confirm('У вас активный заказ. Выйти?')) return;
            if (watchId) navigator.geolocation.clearWatch(watchId);
            if (unsubOrders) unsubOrders();
            if (unsubUser) unsubUser();
            clearOffer();
            stopTracking();
            window.location.href = 'cabinet.html';
        });

        // ============================================================
        // ДИАГНОСТИКА (для консоли)
        // ============================================================
        window.diagnostic = function() {
            console.log('=== ДИАГНОСТИКА ===');
            console.log('Онлайн:', isOnline);
            console.log('Штраф:', isPenaltyActive);
            console.log('Активный заказ:', activeOrder ? activeOrder.id : 'нет');
            console.log('Предложение:', currentOffer ? currentOffer.id : 'нет');
            console.log('Геолокация:', driverLocation ? `${driverLocation.lat}, ${driverLocation.lng}` : 'НЕТ!');
            console.log('Заказов в списке:', availableOrders.length);
            availableOrders.forEach(o => {
                const dist = getDistanceToOrder(o);
                console.log(`  #${o.id.substring(0,8)}: ${dist.toFixed(2)} км, рядом: ${dist <= AI_RADIUS_KM ? '✅' : '❌'}`);
            });
            console.log('Подписка на заказы:', unsubOrders ? '✅ активна' : '❌ не активна');
        };

        window.forceAI = function() {
            console.log('🤖 ПРИНУДИТЕЛЬНЫЙ ПОИСК ЗАКАЗОВ...');
            if (isOnline && !isPenaltyActive && !activeOrder && !currentOffer && driverLocation) {
                const nearby = availableOrders.filter(o => getDistanceToOrder(o) <= AI_RADIUS_KM);
                if (nearby.length > 0) {
                    const best = nearby.reduce((a, b) =>
                        (getDistanceToOrder(a) || Infinity) < (getDistanceToOrder(b) || Infinity) ? a : b
                    );
                    sendOffer(best);
                } else {
                    showToast('❌ Нет заказов рядом', 'warning');
                }
            } else {
                showToast('⛔ Условия не выполнены (онлайн, штраф, активный заказ, геолокация)', 'warning');
            }
        };

        console.log('✅ WHEEL — Работа водителя (финальная) загружена');
        console.log('📌 Команды: diagnostic(), forceAI()');
    </script>
