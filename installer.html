        window.installDatabase = async function() {
            const log = document.getElementById('log');
            const progress = document.getElementById('progress');
            const progressBar = document.getElementById('progressBar');
            const btn = document.getElementById('installBtn');

            function addLog(message, type = 'info') {
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                entry.textContent = message;
                log.appendChild(entry);
                log.scrollTop = log.scrollHeight;
            }

            function updateProgress(value, total) {
                const percent = Math.round((value / total) * 100);
                progress.textContent = `${percent}%`;
                progressBar.style.width = `${percent}%`;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Загрузка...';
            log.innerHTML = '';
            progress.textContent = '0%';
            progressBar.style.width = '0%';

            let totalSteps = USERS.length + ORDERS.length + TRANSACTIONS.length + 1;
            let currentStep = 0;
            let createdUsers = 0;
            let existingUsers = 0;
            const uidMap = {};

            try {
                // ===== ШАГ 1: СОЗДАНИЕ ПОЛЬЗОВАТЕЛЕЙ =====
                addLog('📌 Шаг 1: Создание пользователей в Authentication...', 'info');

                for (const user of USERS) {
                    try {
                        const cred = await createUserWithEmailAndPassword(auth, user.email, user.password);
                        uidMap[user.uid] = cred.user.uid;
                        addLog(`   ✅ Создан ${user.email} → UID: ${cred.user.uid.substring(0, 12)}...`, 'success');
                        createdUsers++;
                    } catch (error) {
                        if (error.code === 'auth/email-already-in-use') {
                            try {
                                const cred = await signInWithEmailAndPassword(auth, user.email, user.password);
                                uidMap[user.uid] = cred.user.uid;
                                addLog(`   ✅ ${user.email} уже существует (вход выполнен)`, 'success');
                                existingUsers++;
                            } catch (signInError) {
                                addLog(`   ⚠️ ${user.email} существует, но вход не выполнен. Использую указанный UID.`, 'warning');
                                uidMap[user.uid] = user.uid;
                                existingUsers++;
                            }
                        } else {
                            addLog(`   ❌ Ошибка с ${user.email}: ${error.message}`, 'error');
                            uidMap[user.uid] = user.uid;
                        }
                    }
                    currentStep++;
                    updateProgress(currentStep, totalSteps);
                }

                addLog(`   📊 Итог: создано ${createdUsers}, существовало ${existingUsers}`, 'info');

                // ===== ШАГ 2: ЗАГРУЗКА ПОЛЬЗОВАТЕЛЕЙ =====
                addLog('📌 Шаг 2: Загрузка пользователей в Firestore...', 'info');
                let userLoaded = 0;
                const batch1 = writeBatch(db);

                for (const user of USERS) {
                    const realUid = uidMap[user.uid] || user.uid;
                    const userRef = doc(db, 'users', realUid);
                    const userData = {
                        ...user,
                        uid: realUid,
                        createdAt: serverTimestamp()
                    };
                    delete userData.password;
                    batch1.set(userRef, userData);
                    userLoaded++;
                    currentStep++;
                    updateProgress(currentStep, totalSteps);
                }
                await batch1.commit();
                addLog(`   ✅ Загружено ${userLoaded} пользователей в коллекцию "users"`, 'success');

                // ===== ШАГ 3: ЗАГРУЗКА ЗАКАЗОВ =====
                addLog('📌 Шаг 3: Загрузка заказов...', 'info');
                let orderLoaded = 0;
                const batch2 = writeBatch(db);

                for (const order of ORDERS) {
                    const orderRef = doc(db, 'orders', order.orderId);
                    batch2.set(orderRef, order);
                    orderLoaded++;
                    currentStep++;
                    updateProgress(currentStep, totalSteps);
                }
                await batch2.commit();
                addLog(`   ✅ Загружено ${orderLoaded} заказов в коллекцию "orders"`, 'success');

                // ===== ШАГ 4: ЗАГРУЗКА ТРАНЗАКЦИЙ =====
                addLog('📌 Шаг 4: Загрузка транзакций...', 'info');
                let txLoaded = 0;
                const batch3 = writeBatch(db);

                for (const tx of TRANSACTIONS) {
                    const txRef = doc(db, 'transactions', tx.transactionId);
                    batch3.set(txRef, tx);
                    txLoaded++;
                    currentStep++;
                    updateProgress(currentStep, totalSteps);
                }
                await batch3.commit();
                addLog(`   ✅ Загружено ${txLoaded} транзакций в коллекцию "transactions"`, 'success');

                // ===== ШАГ 5: ПРОВЕРКА =====
                addLog('📌 Шаг 5: Проверка загруженных данных...', 'info');

                for (const user of USERS) {
                    const realUid = uidMap[user.uid] || user.uid;
                    const docSnap = await getDoc(doc(db, 'users', realUid));
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        addLog(`   ✅ ${user.email}: баланс ${data.balance}₽, роль: ${data.role}`, 'success');
                    } else {
                        addLog(`   ❌ ${user.email}: документ НЕ НАЙДЕН!`, 'error');
                    }
                    currentStep++;
                    updateProgress(currentStep, totalSteps);
                }

                // ===== ФИНАЛ =====
                addLog('\n═══════════════════════════════════════════════', 'info');
                addLog('🎉 БАЗА ДАННЫХ УСПЕШНО ЗАПОЛНЕНА!', 'success');
                addLog(`📊 Статистика:`, 'info');
                addLog(`   • Пользователей: ${USERS.length} (создано: ${createdUsers}, существовало: ${existingUsers})`, 'info');
                addLog(`   • Заказов: ${ORDERS.length}`, 'info');
                addLog(`   • Транзакций: ${TRANSACTIONS.length}`, 'info');
                addLog('📝 Данные для входа:', 'info');
                addLog(`   • Клиент: client@test.com / Test123456!`, 'info');
                addLog(`   • Водитель: driver@test.com / Test123456!`, 'info');
                addLog(`   • Администратор: admin@test.com / Test123456!`, 'info');
                addLog('═══════════════════════════════════════════════', 'info');

                progress.textContent = '100%';
                progressBar.style.width = '100%';
                btn.textContent = '✅ Готово! Можете закрыть страницу';

            } catch (error) {
                addLog(`❌ КРИТИЧЕСКАЯ ОШИБКА: ${error.message}`, 'error');
                btn.textContent = '❌ Ошибка! Попробуйте снова';
                btn.disabled = false;
