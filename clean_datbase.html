<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Очистка базы данных — WHEEL</title>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            getDocs, 
            deleteDoc, 
            writeBatch,
            doc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { 
            getAuth, 
            deleteUser,
            listUsers,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // ============================================================
        // ФУНКЦИЯ ОЧИСТКИ БАЗЫ
        // ============================================================
        async function deleteCollection(collectionName, batchSize = 100) {
            console.log(`🗑️ Удаление коллекции: ${collectionName}...`);
            let deletedCount = 0;
            let hasMore = true;

            while (hasMore) {
                const snapshot = await getDocs(collection(db, collectionName));
                if (snapshot.empty) {
                    console.log(`   ✅ Коллекция ${collectionName} уже пуста или не существует`);
                    return deletedCount;
                }

                const batch = writeBatch(db);
                let count = 0;
                snapshot.docs.forEach(doc => {
                    batch.delete(doc.ref);
                    count++;
                });
                await batch.commit();
                deletedCount += count;
                console.log(`   ✅ Удалено ${count} документов (всего ${deletedCount}) из ${collectionName}`);
                
                if (count < batchSize) {
                    hasMore = false;
                }
            }
            return deletedCount;
        }

        async function deleteAllUsers() {
            console.log('🗑️ Удаление пользователей из Authentication...');
            let deleted = 0;
            try {
                // Получаем всех пользователей
                let nextPageToken;
                do {
                    const listUsersResult = await listUsers(auth, nextPageToken);
                    if (listUsersResult.users.length === 0) {
                        console.log('   ✅ Нет пользователей для удаления');
                        return 0;
                    }
                    for (const user of listUsersResult.users) {
                        try {
                            await deleteUser(user);
                            deleted++;
                            console.log(`   ✅ Удалён пользователь: ${user.email}`);
                        } catch (err) {
                            if (err.code === 'auth/requires-recent-login') {
                                console.warn(`   ⚠️ Для удаления ${user.email} требуется вход в аккаунт администратора`);
                            } else {
                                console.error(`   ❌ Ошибка удаления ${user.email}:`, err.message);
                            }
                        }
                    }
                    nextPageToken = listUsersResult.pageToken;
                } while (nextPageToken);
                console.log(`   ✅ Удалено ${deleted} пользователей`);
            } catch (error) {
                console.error('   ❌ Ошибка удаления пользователей:', error.message);
                if (error.message.includes('requires a recent login')) {
                    console.warn('   ⚠️ Для удаления пользователей требуется войти в аккаунт администратора');
                }
            }
            return deleted;
        }

        async function cleanDatabase() {
            const log = document.getElementById('log');
            const btn = document.getElementById('cleanBtn');
            const progress = document.getElementById('progress');

            function addLog(message, type = 'info') {
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                entry.textContent = message;
                log.appendChild(entry);
                log.scrollTop = log.scrollHeight;
                console.log(message);
            }

            btn.disabled = true;
            btn.textContent = '⏳ Очистка...';
            log.innerHTML = '';
            progress.textContent = '0%';

            try {
                const collections = ['users', 'orders', 'transactions', 'drivers', 'drivers_log'];
                let totalDocs = 0;
                let step = 0;
                const totalSteps = collections.length + 1;

                // === Удаляем коллекции ===
                for (const name of collections) {
                    try {
                        const count = await deleteCollection(name);
                        totalDocs += count;
                    } catch (error) {
                        addLog(`   ⚠️ Ошибка при удалении ${name}: ${error.message}`, 'warning');
                    }
                    step++;
                    progress.textContent = Math.round((step / totalSteps) * 100) + '%';
                }

                // === Удаляем пользователей ===
                const userCount = await deleteAllUsers();
                step++;
                progress.textContent = '100%';

                addLog('\n═══════════════════════════════════════════════', 'success');
                addLog('✅ БАЗА ДАННЫХ ПОЛНОСТЬЮ ОЧИЩЕНА!', 'success');
                addLog(`📊 Удалено:`, 'info');
                addLog(`   • Документов в Firestore: ${totalDocs}`, 'info');
                addLog(`   • Пользователей в Authentication: ${userCount}`, 'info');
                addLog('📝 Примечание:', 'info');
                addLog(`   • Если вы не вошли как администратор, пользователи могли не удалиться.`, 'info');
                addLog(`   • Для полной очистки войдите в аккаунт администратора перед запуском.`, 'info');
                addLog('═══════════════════════════════════════════════', 'success');

                btn.textContent = '✅ Готово! Можете закрыть страницу';

            } catch (error) {
                addLog(`❌ КРИТИЧЕСКАЯ ОШИБКА: ${error.message}`, 'error');
                console.error('Full error:', error);
                btn.textContent = '❌ Ошибка! Попробуйте снова';
                btn.disabled = false;
            }
        }

        window.cleanDatabase = cleanDatabase;
    </script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'SF Pro Display', 'Inter', sans-serif;
            background: #0a0c10;
            display: flex;

                radial-gradient(circle at 80% 70%, rgba(0,160,255,0.06) 0%, transparent 40%);
            background-attachment: fixed;
        }
        .container {

        }
        .header {

        }
        .logo {
            width: 64px;

            margin-bottom: 12px;

        }
        .logo svg { width: 36px; height: 36px; fill: white; }
        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(to right, #ffffff, #ff4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #8899aa;
            font-size: 14px;
            margin-top: 4px;
        }

        .warning-box {
            background: rgba(255,70,70,0.08);
            border: 1px solid rgba(255,70,70,0.2);
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #ff6b6b;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            line-height: 1.5;
        }
        .warning-box .icon { font-size: 22px; flex-shrink: 0; }
        .warning-box strong { color: #ff4444; }

        .btn-clean {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 25px rgba(255,0,0,0.3);
        }
        .btn-clean:hover { transform: scale(1.02); box-shadow: 0 12px 30px rgba(255,0,0,0.4); }
        .btn-clean:active { transform: scale(0.97); }
        .btn-clean:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-text {
            text-align: center;
            margin-top: 16px;
            color: #8899aa;
            font-size: 14px;
        }

        .log-wrap {
            background: rgba(0,0,0,0.3);
            border-radius: 14px;
            padding: 16px;
            max-height: 320px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            margin-top: 16px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .log-wrap::-webkit-scrollbar { width: 4px; }
        .log-wrap::-webkit-scrollbar-track { background: transparent; }
        .log-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .log-entry.info { color: #b0c0d0; }
        .log-entry.success { color: #4ade80; }
        .log-entry.warning { color: #ffb000; }
        .log-entry.error { color: #ff6b6b; }

        @media (max-width: 480px) {
            .container { border-radius: 0; padding: 20px 16px; background: rgba(10,12,16,0.95); backdrop-filter: blur(15px); border: none; }
        }
    </style>
</head>
<body>

<div class="container">

        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        </div>

    <div class="warning-box">
        <span class="icon">⚠️</span>
        <div>
            <strong>Это действие НЕОБРАТИМО!</strong><br>
            Будут удалены <strong>все</strong> данные из:
            <ul style="margin-top:6px; padding-left:18px; color:#cc8888;">

            </ul>

    <button class="btn-clean" id="cleanBtn" onclick="cleanDatabase()">

    </button>

    <div class="log-wrap" id="log">

</div>

</body>
