<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Заказ такси — WHEEL</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">
    </script>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0c10;
            min-height: 100vh;
            padding: 12px;
            color: #ffffff;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(18, 22, 28, 0.85);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
        }
        .header-title {
            font-size: 18px;
            font-weight: 700;
        }
        .header-title span {
            color: #ffb000;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            border-radius: 30px;
            padding: 6px 14px;
            color: #8899aa;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        .balance-display {
            background: rgba(255, 180, 0, 0.08);
            border: 1px solid rgba(255, 180, 0, 0.12);
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 14px;
            font-weight: 700;
            color: #ffb000;
        }

        #map {
            height: 250px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
            background: #11151a;
        }

        .form-section {
            background: rgba(18, 22, 28, 0.85);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .form-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        .form-row .icon {
            font-size: 18px;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }
        .autocomplete-wrapper {
            position: relative;
            flex: 1;
        }
        .autocomplete-wrapper input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        .autocomplete-wrapper input:focus {
            border-color: #ffb000;
        }
        .autocomplete-wrapper input::placeholder {
            color: #556677;
        }
        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1e26;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-height: 180px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            margin-top: 4px;
        }
        .autocomplete-list .item {
            padding: 8px 14px;
            cursor: pointer;
            color: #e0e8f0;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .autocomplete-list .item:hover {
            background: rgba(255, 180, 0, 0.08);
        }
        .autocomplete-list .item .highlight {
            color: #ffb000;
            font-weight: 600;
        }

        .geo-btn {
            background: rgba(255, 180, 0, 0.08);
            border: 1px solid rgba(255, 180, 0, 0.12);
            border-radius: 12px;
            padding: 8px 14px;
            color: #ffb000;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .geo-btn:hover {
            background: rgba(255, 180, 0, 0.15);
        }
        .geo-btn.loading {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info-panel {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .info-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .info-item .label {
            font-size: 9px;
            color: #667788;
            text-transform: uppercase;
        }
        .info-item .value {
            font-size: 16px;
            font-weight: 700;
            margin-top: 2px;
        }
        .info-item .value.gold {
            color: #ffb000;
        }
        .info-item .value.green {
            color: #4ade80;
        }
        .info-item .value.blue {
            color: #60a5fa;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }
        .btn-order {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-order:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .btn-order:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-cancel {
            padding: 14px 18px;
            border: 1px solid rgba(255, 70, 70, 0.2);
            border-radius: 14px;
            background: rgba(255, 70, 70, 0.06);
            color: #ff6b6b;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-cancel:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .message {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            text-align: center;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            display: block;
        }
        .message.success {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            display: block;
        }
        .message.info {
            background: rgba(96, 165, 250, 0.1);
            color: #60a5fa;
            display: block;
        }
        .message.warning {
            background: rgba(255, 180, 0, 0.1);
            color: #ffb000;
            display: block;
        }

        .order-status {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: none;
            text-align: center;
        }
        .order-status.active {
            display: block;
        }
        .order-status .status-text {
            font-size: 16px;
            font-weight: 600;
        }
        .order-status .status-detail {
            font-size: 13px;
            color: #8899aa;
            margin-top: 4px;
        }

        .note {
            font-size: 11px;
            color: #667788;
            text-align: center;
            margin-top: 10px;
            line-height: 1.5;
        }
        .note span {
            color: #ff6b6b;
        }
        .note .gold {
            color: #ffb000;
        }

        @media (max-width: 480px) {
            #map {
                height: 200px;
            }
            .header-title {
                font-size: 16px;
            }
            .info-item .value {
                font-size: 14px;
            }
            .btn-order {
                font-size: 14px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <div>
                <button class="back-btn" id="backBtn">← Назад</button>
                <span class="header-title">🚖 <span>Заказ</span></span>
            </div>
            <span class="balance-display" id="balanceDisplay">💰 0 ₪</span>
        </div>

        <div id="map"></div>

        <div class="order-status" id="orderStatus">
            <div class="status-text" id="statusText">⏳ Поиск водителя...</div>
            <div class="status-detail" id="statusDetail">Ближайший водитель: <span class="highlight">2.3 км</span></div>
        </div>

        <div class="form-section">

            <div class="form-row">
                <span class="icon">📍</span>
                <div class="autocomplete-wrapper">
                    <input type="text" id="pickupInput" placeholder="Откуда (адрес)" autocomplete="off">
                    <div class="autocomplete-list" id="pickupAutocomplete"></div>
                </div>
                <button class="geo-btn" id="geoBtn">📍 Определить</button>
            </div>

            <div class="form-row">
                <span class="icon">🏁</span>
                <div class="autocomplete-wrapper">
                    <input type="text" id="destinationInput" placeholder="Куда (адрес)" autocomplete="off">
                    <div class="autocomplete-list" id="destinationAutocomplete"></div>
                </div>
            </div>

            <div class="info-panel">
                <div class="info-item">
                    <div class="label">💵 Стоимость</div>
                    <div class="value gold" id="priceDisplay">—</div>
                </div>
                <div class="info-item">
                    <div class="label">📏 Расстояние</div>
                    <div class="value blue" id="distanceDisplay">—</div>
                </div>
                <div class="info-item">
                    <div class="label">⏱️ Время</div>
                    <div class="value green" id="durationDisplay">—</div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-order" id="orderBtn">🚖 Заказать такси</button>
                <button class="btn-cancel" id="cancelBtn" disabled>✖</button>
            </div>

            <div class="message" id="message"></div>

            <div class="note">
                ⚠️ Отмена после подтверждения водителя — <span>штраф 7 ₪</span>
                <br>💳 Комиссия платформы: <span class="gold">10%</span>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        // FIREBASE КОНФИГ
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // ПЕРЕМЕННЫЕ
        // ============================================================
        let map, pickupMarker, destinationMarker, pickupLocation, destinationLocation;
        let currentOrderId = null, balance = 0, currentUser = null, unsubOrder = null;

        const TARIFF = { BASE_FEE: 12.00, PRICE_PER_KM: 3.70, NIGHT_SURCHARGE: 1.25, NIGHT_START_HOUR: 23, NIGHT_END_HOUR: 5,
            PENALTY_CANCEL: 7.00, COMMISSION: 0.10 };

        const $ = id => document.getElementById(id);

        // ============================================================
        // UTILITY
        // ============================================================
        function showMessage(text, type = 'info') {
            const msg = $('message');
            msg.className = 'message ' + type;
            msg.textContent = text;
            msg.style.display = 'block';
            clearTimeout(msg._timeout);
            msg._timeout = setTimeout(() => msg.style.display = 'none', 5000);
        }

        function formatPrice(p) { return (p || 0).toFixed(2) + ' ₪'; }

        function formatDistance(km) {
            if (!km) return '—';
            if (km < 1) return (km * 1000).toFixed(0) + ' м';
            return km.toFixed(1) + ' км';
        }

        function formatDuration(min) {
            if (!min) return '—';
            if (min < 1) return '< 1 мин';
            if (min < 60) return Math.round(min) + ' мин';
            return Math.floor(min / 60) + ' ч ' + Math.round(min % 60) + ' мин';
        }

        function haversineDistance(lat1, lng1, lat2, lng2) {
            if (!lat1 || !lng1 || !lat2 || !lng2) return 0;
            const R = 6371,
                dLat = (lat2 - lat1) * Math.PI / 180,
                dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(
                dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function isNight() {
            const h = new Date().getHours();
            return h >= TARIFF.NIGHT_START_HOUR || h < TARIFF.NIGHT_END_HOUR;
        }

        function calculatePrice(dist) {
            let p = TARIFF.BASE_FEE + dist * TARIFF.PRICE_PER_KM;
            if (isNight()) p *= TARIFF.NIGHT_SURCHARGE;
            return p;
        }

        // ============================================================
        // ГЕОКОДИНГ
        // ============================================================
        async function geocodeAddress(address) {
            if (!address) return null;
            try {
                const url =
                    `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&limit=1&countrycodes=il`;
                const r = await fetch(url);
                const d = await r.json();
                if (d && d.length) return { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon), displayName: d[0]
                        .display_name };
                return null;
            } catch { return null; }
        }

        function reverseGeocode(lat, lng, cb) {
            fetch(
                    `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`).then(r => r.json())
                .then(d => cb(d?.display_name || null)).catch(() => cb(null));
        }

        // ============================================================
        // АВТОКОМПЛИТ
        // ============================================================
        let searchTimeout;

        function setupAutocomplete(input, list, onSelect) {
            input.addEventListener('input', function() {
                const q = this.value.trim();
                if (q.length < 2) { list.style.display = 'none'; return; }
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(async () => {
                    try {
                        const url =
                            `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&countrycodes=il`;
                        const r = await fetch(url);
                        const d = await r.json();
                        if (d && d.length) {
                            list.innerHTML = '';
                            d.forEach(item => {
                                const div = document.createElement('div');
                                div.className = 'item';
                                div.innerHTML = item.display_name.replace(new RegExp(q, 'gi'), m =>
                                    `<span class="highlight">${m}</span>`);
                                div.addEventListener('click', () => {
                                    input.value = item.display_name;
                                    list.style.display = 'none';
                                    onSelect({ lat: parseFloat(item.lat), lng: parseFloat(item.lon),
                                        displayName: item.display_name });
                                });
                                list.appendChild(div);
                            });
                            list.style.display = 'block';
                        } else list.style.display = 'none';
                    } catch { list.style.display = 'none'; }
                }, 400);
            });
            document.addEventListener('click', e => { if (!input.contains(e.target) && !list.contains(e.target)) list
                    .style.display = 'none'; });
        }

        // ============================================================
        // КАРТА
        // ============================================================
        function initMap() {
            map = L.map('map').setView([32.0853, 34.7818], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            map.on('click', function(e) {
                const { lat, lng } = e.latlng;
                if (!pickupLocation) {
                    setPickup(lat, lng);
                    showMessage('📍 Точка отправления установлена', 'success');
                } else if (!destinationLocation) {
                    setDestination(lat, lng);
                    showMessage('📍 Точка назначения установлена', 'success');
                } else {
                    setDestination(lat, lng);
                    showMessage('📍 Точка назначения обновлена', 'success');
                }
            });
        }

        function setPickup(lat, lng) {
            pickupLocation = { lat, lng };
            if (pickupMarker) map.removeLayer(pickupMarker);
            pickupMarker = L.marker([lat, lng], { icon: L.divIcon({ html: '🟢', iconSize: [30, 30], iconAnchor: [15, 30] }) })
                .addTo(map).bindPopup('📍 Отправление');
            map.setView([lat, lng], 15);
            reverseGeocode(lat, lng, a => { if (a) $('pickupInput').value = a; });
            calculate();
        }

        function setDestination(lat, lng) {
            destinationLocation = { lat, lng };
            if (destinationMarker) map.removeLayer(destinationMarker);
            destinationMarker = L.marker([lat, lng], { icon: L.divIcon({ html: '🔴', iconSize: [30, 30], iconAnchor: [15,
                        30] }) })
                .addTo(map).bindPopup('🏁 Назначение');
            reverseGeocode(lat, lng, a => { if (a) $('destinationInput').value = a; });
            if (pickupLocation && destinationLocation) {
                const b = L.latLngBounds([pickupLocation.lat, pickupLocation.lng], [destinationLocation.lat,
                    destinationLocation.lng
                ]);
                map.fitBounds(b, { padding: [40, 40] });
            }
            calculate();
        }

        function calculate() {
            if (!pickupLocation || !destinationLocation) {
                $('priceDisplay').textContent = '—';
                $('distanceDisplay').textContent = '—';
                $('durationDisplay').textContent = '—';
                return;
            }
            const d = haversineDistance(pickupLocation.lat, pickupLocation.lng, destinationLocation.lat, destinationLocation
                .lng);
            if (d < 0.01) return;
            $('priceDisplay').textContent = formatPrice(calculatePrice(d));
            $('distanceDisplay').textContent = formatDistance(d);
            $('durationDisplay').textContent = formatDuration(d * 3);
            window._orderData = { distance: d, price: calculatePrice(d) };
        }

        // ============================================================
        // ГЕОЛОКАЦИЯ
        // ============================================================
        function getLocation() {
            const btn = $('geoBtn');
            btn.textContent = '⏳ ...';
            btn.classList.add('loading');
            btn.disabled = true;
            if (!navigator.geolocation) {
                showMessage('❌ Геолокация не поддерживается', 'error');
                btn.textContent = '📍 Определить';
                btn.classList.remove('loading');
                btn.disabled = false;
                return;
            }
            navigator.geolocation.getCurrentPosition(
                pos => { setPickup(pos.coords.latitude, pos.coords.longitude);
                    btn.textContent = '✅ Определено';
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    showMessage('📍 Геолокация определена', 'success'); },
                err => { showMessage('❌ Ошибка GPS: ' + err.message, 'error');
                    btn.textContent = '📍 Определить';
                    btn.classList.remove('loading');
                    btn.disabled = false; }, { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // ============================================================
        // СОЗДАНИЕ ЗАКАЗА
        // ============================================================
        async function createOrder() {
            const pickupAddr = $('pickupInput').value.trim();
            const destAddr = $('destinationInput').value.trim();
            if (!pickupAddr) { showMessage('❌ Введите адрес отправления', 'error');
                $('pickupInput').focus(); return; }
            if (!destAddr) { showMessage('❌ Введите адрес назначения', 'error');
                $('destinationInput').focus(); return; }

            if (!pickupLocation) {
                const r = await geocodeAddress(pickupAddr);
                if (r) setPickup(r.lat, r.lng);
                else showMessage('⚠️ Координаты отправления не найдены', 'warning');
            }
            if (!destinationLocation) {
                const r = await geocodeAddress(destAddr);
                if (r) setDestination(r.lat, r.lng);
                else showMessage('⚠️ Координаты назначения не найдены', 'warning');
            }

            const d = (pickupLocation && destinationLocation) ? haversineDistance(pickupLocation.lat, pickupLocation.lng,
                destinationLocation.lat, destinationLocation.lng) : 0;
            const price = d > 0 ? calculatePrice(d) : TARIFF.BASE_FEE;

            if (balance < price) {
                showMessage(`❌ Недостаточно средств. Нужно: ${formatPrice(price)}, у вас: ${formatPrice(balance)}`,
                    'error');
                return;
            }

            const btn = $('orderBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Создание...';

            try {
                const user = auth.currentUser;
                if (!user) { showMessage('❌ Войдите в аккаунт', 'error');
                    btn.disabled = false;
                    btn.textContent = '🚖 Заказать такси'; return; }

                const orderRef = await db.collection('orders').add({
                    clientId: user.uid,
                    clientName: user.displayName || 'Клиент',
                    status: 'new',
                    pickup: { address: pickupAddr, lat: pickupLocation?.lat || null, lng: pickupLocation?.lng ||
                            null },
                    destination: { address: destAddr, lat: destinationLocation?.lat || null, lng: destinationLocation
                            ?.lng || null },
                    price: price,
                    commission: price * TARIFF.COMMISSION,
                    driverEarn: price * (1 - TARIFF.COMMISSION),
                    distance: d,
                    estimatedDuration: d * 3,
                    isNight: isNight(),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    assignedManually: false,
                    dispatchHistory: [],
                    penaltyApplied: 0
                });

                currentOrderId = orderRef.id;
                showMessage(`✅ Заказ создан! ID: ${currentOrderId.substring(0,8)}`, 'success');
                btn.textContent = '✅ Заказ создан';
                btn.disabled = true;
                $('cancelBtn').disabled = false;
                subscribeToOrder(currentOrderId);

            } catch (err) {
                showMessage('❌ Ошибка: ' + err.message, 'error');
                btn.disabled = false;
                btn.textContent = '🚖 Заказать такси';
            }
        }

        // ============================================================
        // ПОДПИСКА НА ЗАКАЗ
        // ============================================================
        function subscribeToOrder(id) {
            if (unsubOrder) { unsubOrder();
                unsubOrder = null; }
            unsubOrder = db.collection('orders').doc(id).onSnapshot(doc => {
                if (!doc.exists) return;
                const data = doc.data();
                const status = $('orderStatus');
                const text = $('statusText');
                const detail = $('statusDetail');
                status.classList.add('active');

                switch (data.status) {
                    case 'new':
                    case 'searching':
                        text.textContent = '⏳ Поиск водителя...';
                        detail.textContent = 'Ищем ближайшего водителя...';
                        $('cancelBtn').disabled = false;
                        break;
                    case 'assigned':
                        text.textContent = '✅ Водитель назначен!';
                        detail.textContent = `🚗 Водитель едет к вам`;
                        $('cancelBtn').disabled = false;
                        showMessage('✅ Водитель назначен!', 'success');
                        break;
                    case 'in_progress':
                        text.textContent = '🚗 Поездка началась!';
                        detail.textContent = 'Водитель уже в пути';
                        $('cancelBtn').disabled = true;
                        break;
                    case 'completed':
                        text.textContent = '🎉 Поездка завершена!';
                        detail.textContent = 'Спасибо за поездку!';
                        $('cancelBtn').disabled = true;
                        $('orderBtn').disabled = true;
                        if (unsubOrder) { unsubOrder();
                            unsubOrder = null; }
                        break;
                    case 'cancelled':
                        text.textContent = '❌ Заказ отменён';
                        detail.textContent = data.penaltyApplied ? `Штраф: ${formatPrice(data.penaltyApplied)}` :
                            'Без штрафа';
                        $('cancelBtn').disabled = true;
                        $('orderBtn').disabled = false;
                        $('orderBtn').textContent = '🚖 Заказать снова';
                        if (unsubOrder) { unsubOrder();
                            unsubOrder = null; }
                        break;
                }
            });
        }

        // ============================================================
        // ОТМЕНА ЗАКАЗА
        // ============================================================
        function cancelOrder() {
            if (!currentOrderId) { showMessage('❌ Нет активного заказа', 'error'); return; }
            if (!confirm('❌ Отменить заказ?')) return;
            const btn = $('cancelBtn');
            btn.disabled = true;
            btn.textContent = '⏳';

            db.collection('orders').doc(currentOrderId).get().then(doc => {
                if (!doc.exists) { showMessage('❌ Заказ не найден', 'error');
                    btn.disabled = false;
                    btn.textContent = '✖'; return; }
                const data = doc.data();
                let penalty = 0;
                if (data.status === 'assigned' || data.status === 'in_progress') penalty = TARIFF.PENALTY_CANCEL;

                return db.collection('orders').doc(currentOrderId).update({
                    status: 'cancelled',
                    cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
                    penaltyApplied: penalty,
                    cancellationReason: 'Отменено клиентом',
                    cancelledBy: 'client'
                }).then(() => {
                    if (penalty > 0) {
                        const user = auth.currentUser;
                        if (user) db.collection('users').doc(user.uid).update({
                            balance: firebase.firestore.FieldValue.increment(-penalty)
                        });
                    }
                    showMessage('✅ Заказ отменён', 'info');
                    btn.disabled = true;
                    btn.textContent = '❌';
                    $('orderBtn').disabled = false;
                    $('orderBtn').textContent = '🚖 Заказать снова';
                });
            }).catch(err => { showMessage('❌ Ошибка: ' + err.message, 'error');
                btn.disabled = false;
                btn.textContent = '✖'; });
        }

        // ============================================================
        // БАЛАНС
        // ============================================================
        function updateBalance() {
            const user = auth.currentUser;
            if (!user) return;
            db.collection('users').doc(user.uid).get().then(doc => {
                if (doc.exists) {
                    balance = doc.data().balance || 0;
                    $('balanceDisplay').textContent = '💰 ' + formatPrice(balance);
                }
            });
        }

        // ============================================================
        // EVENTS
        // ============================================================
        $('backBtn').addEventListener('click', () => {
            if (currentOrderId && !confirm('У вас активный заказ. Выйти?')) return;
            if (unsubOrder) { unsubOrder();
                unsubOrder = null; }
            window.location.href = 'cabinet.html';
        });

        $('geoBtn').addEventListener('click', getLocation);
        $('orderBtn').addEventListener('click', createOrder);
        $('cancelBtn').addEventListener('click', cancelOrder);

        // ============================================================
        // INIT
        // ============================================================
        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = 'index.html'; return; }
            currentUser = user;
            updateBalance();
            initMap();
            setupAutocomplete($('pickupInput'), $('pickupAutocomplete'), r => setPickup(r.lat, r.lng));
            setupAutocomplete($('destinationInput'), $('destinationAutocomplete'), r => setDestination(r.lat, r.lng));
            setTimeout(getLocation, 1000);
        });

        console.log('✅ order.html загружен');
    </script>

</body>
</html>
