    <script>
        // ============================================================
        // FIREBASE КОНФИГ
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        console.log('🔥 Firebase готов');

        // ============================================================
        // ПЕРЕМЕННЫЕ
        // ============================================================
        let map;
        let pickupMarker = null;
        let destinationMarker = null;
        let routeLine = null;
        let pickupLocation = null;
        let destinationLocation = null;
        let currentOrderId = null;
        let orderStatus = null;
        let balance = 0;
        let currentUser = null;
        let unsubOrder = null;

        const TARIFF = {
            BASE_FEE: 12.00,
            PRICE_PER_KM: 3.70,
            NIGHT_SURCHARGE: 1.25,
            NIGHT_START_HOUR: 23,
            NIGHT_END_HOUR: 5,
            PENALTY_CANCEL: 7.00,
            COMMISSION: 0.10
        };

        // ============================================================
        // ЭЛЕМЕНТЫ
        // ============================================================
        const el = {
            map: document.getElementById('map'),
            pickupInput: document.getElementById('pickupInput'),
            destinationInput: document.getElementById('destinationInput'),
            pickupAutocomplete: document.getElementById('pickupAutocomplete'),
            destinationAutocomplete: document.getElementById('destinationAutocomplete'),
            timeInput: document.getElementById('timeInput'),
            geoBtn: document.getElementById('geoBtn'),
            orderBtn: document.getElementById('orderBtn'),
            cancelBtn: document.getElementById('cancelBtn'),
            balanceDisplay: document.getElementById('balanceDisplay'),
            priceDisplay: document.getElementById('priceDisplay'),
            distanceDisplay: document.getElementById('distanceDisplay'),
            durationDisplay: document.getElementById('durationDisplay'),
            message: document.getElementById('message'),
            errorBox: document.getElementById('errorBox'),
            errorText: document.getElementById('errorText'),
            orderStatus: document.getElementById('orderStatus'),
            statusText: document.getElementById('statusText'),
            statusDetail: document.getElementById('statusDetail'),
            backBtn: document.getElementById('backBtn'),
            mapHint: document.getElementById('mapHint')
        };

        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================
        function showMessage(text, type = 'info') {
            el.message.className = 'message ' + type;
            el.message.textContent = text;
            el.message.style.display = 'block';
            setTimeout(() => {
                el.message.style.display = 'none';
            }, 4000);
        }

        function showError(text) {
            el.errorBox.style.display = 'block';
            el.errorText.textContent = text;
            setTimeout(() => {
                el.errorBox.style.display = 'none';
            }, 6000);
        }

        function formatPrice(price) {
            return price.toFixed(2) + ' ₪';
        }

        function formatDistance(km) {
            if (km < 1) return (km * 1000).toFixed(0) + ' м';
            return km.toFixed(1) + ' км';
        }

        function formatDuration(min) {
            if (min < 1) return '< 1 мин';
            if (min < 60) return Math.round(min) + ' мин';
            const h = Math.floor(min / 60);
            const m = Math.round(min % 60);
            return h + ' ч ' + m + ' мин';
        }

        function isNight() {
            const now = new Date();
            const hour = now.getHours();
            return (hour >= TARIFF.NIGHT_START_HOUR || hour < TARIFF.NIGHT_END_HOUR);
        }

        function calculatePriceAndCommission(distanceKm) {
            let price = TARIFF.BASE_FEE + (distanceKm * TARIFF.PRICE_PER_KM);
            if (isNight()) {
                price = price * TARIFF.NIGHT_SURCHARGE;
            }
            const commission = price * TARIFF.COMMISSION;
            const driverEarn = price - commission;
            return { price, commission, driverEarn };
        }

        function haversineDistance(lat1, lng1, lat2, lng2) {
            if (!lat1 || !lng1 || !lat2 || !lng2) return 0;
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // ============================================================
        // ГЕОКОДИНГ
        // ============================================================
        async function geocodeAddress(address) {
            if (!address || address.trim() === '') return null;
            try {
                const url =
                    `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&limit=1&addressdetails=1`;
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.length > 0) {
                    return {
                        lat: parseFloat(data[0].lat),
                        lng: parseFloat(data[0].lon),
                        displayName: data[0].display_name
                    };
                }
                return null;
            } catch (error) {
                console.error('Ошибка геокодинга:', error);
                return null;
            }
        }

        function reverseGeocode(lat, lng, callback) {
            const url =
                `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&addressdetails=1`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data && data.display_name) {
                        callback(data.display_name);
                    } else {
                        callback(null);
                    }
                })
                .catch(() => callback(null));
        }

        // ============================================================
        // АВТОДОПОЛНЕНИЕ
        // ============================================================
        let searchTimeout = null;

        function setupAutocomplete(input, listEl, onSelect) {
            input.addEventListener('input', function() {
                const query = this.value.trim();
                if (query.length < 2) {
                    listEl.style.display = 'none';
                    return;
                }

                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(async function() {
                    try {
                        const url =
                            `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5&addressdetails=1&countrycodes=il`;
                        const response = await fetch(url);
                        const data = await response.json();

                        if (data && data.length > 0) {
                            listEl.innerHTML = '';
                            data.forEach(function(item) {
                                const div = document.createElement('div');
                                div.className = 'item';
                                const displayName = item.display_name || item.name || 'Неизвестный адрес';
                                const highlighted = displayName.replace(
                                    new RegExp(query, 'gi'),
                                    match => `<span class="highlight">${match}</span>`
                                );
                                div.innerHTML = highlighted;
                                div.addEventListener('click', function() {
                                    input.value = displayName;
                                    listEl.style.display = 'none';
                                    if (onSelect) {
                                        onSelect({
                                            lat: parseFloat(item.lat),
                                            lng: parseFloat(item.lon),
                                            displayName: displayName
                                        });
                                    }
                                });
                                listEl.appendChild(div);
                            });
                            listEl.style.display = 'block';
                        } else {
                            listEl.style.display = 'none';
                        }
                    } catch (error) {
                        console.error('Ошибка автодополнения:', error);
                        listEl.style.display = 'none';
                    }
                }, 400);
            });

            document.addEventListener('click', function(e) {
                if (!input.contains(e.target) && !listEl.contains(e.target)) {
                    listEl.style.display = 'none';
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    listEl.style.display = 'none';
                }
            });
        }

        // ============================================================
        // ПОСТРОЕНИЕ МАРШРУТА (OSRM)
        // ============================================================
        async function buildRoute(startLat, startLng, endLat, endLng) {
            try {
                const url =
                    `https://router.project-osrm.org/route/v1/driving/${startLng},${startLat};${endLng},${endLat}?overview=full&geometries=geojson`;
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const coordinates = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
                    const distance = route.distance / 1000;
                    const duration = route.duration / 60;

                    return {
                        coordinates: coordinates,
                        distance: distance,
                        duration: duration
                    };
                }
                return null;
            } catch (error) {
                console.error('Ошибка построения маршрута:', error);
                return null;
            }
        }

        // ============================================================
        // КАРТА
        // ============================================================
        function initMap() {
            map = L.map('map').setView([32.0853, 34.7818], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19,
                minZoom: 10
            }).addTo(map);

            // Клик по карте — установка точки отправления (зелёный)
            map.on('click', function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;

                console.log('🖱️ Клик по карте:', lat, lng);

                if (!pickupLocation) {
                    pickupLocation = { lat, lng };
                    updatePickupMarker();
                    reverseGeocode(lat, lng, function(address) {
                        if (address) {
                            el.pickupInput.value = address;
                        } else {
                            el.pickupInput.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                        }
                    });
                    showMessage('📍 Точка отправления установлена', 'success');
                    return;
                }

                if (pickupLocation && !destinationLocation) {
                    destinationLocation = { lat, lng };
                    console.log('📍 Точка назначения установлена:', destinationLocation);
                    updateDestinationMarker();
                    reverseGeocode(lat, lng, function(address) {
                        if (address) {
                            el.destinationInput.value = address;
                        } else {
                            el.destinationInput.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                        }
                    });
                    drawRoute();
                    showMessage('📍 Точка назначения установлена', 'success');
                    return;
                }

                if (pickupLocation && destinationLocation) {
                    destinationLocation = { lat, lng };
                    console.log('📍 Точка назначения обновлена:', destinationLocation);
                    updateDestinationMarker();
                    reverseGeocode(lat, lng, function(address) {
                        if (address) {
                            el.destinationInput.value = address;
                        } else {
                            el.destinationInput.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                        }
                    });
                    drawRoute();
                    showMessage('📍 Точка назначения обновлена', 'success');
                }
            });

            console.log('🗺️ Карта инициализирована');
        }

        // ============================================================
        // МАРКЕРЫ
        // ============================================================
        function updatePickupMarker() {
            if (!pickupLocation) return;
            if (pickupMarker) {
                map.removeLayer(pickupMarker);
                pickupMarker = null;
            }
            const greenIcon = L.divIcon({
                html: '🟢',
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 30]
            });
            pickupMarker = L.marker([pickupLocation.lat, pickupLocation.lng], { icon: greenIcon })
                .addTo(map)
                .bindPopup('📍 Отправление');
            map.setView([pickupLocation.lat, pickupLocation.lng], 15);
            console.log('🟢 Маркер отправления установлен');
        }

        function updateDestinationMarker() {
            if (!destinationLocation) {
                console.warn('⚠️ Нет destinationLocation для маркера');
                return;
            }
            if (destinationMarker) {
                map.removeLayer(destinationMarker);
                destinationMarker = null;
            }
            const redIcon = L.divIcon({
                html: '🔴',
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 30]
            });
            destinationMarker = L.marker([destinationLocation.lat, destinationLocation.lng], { icon: redIcon })
                .addTo(map)
                .bindPopup('🏁 Назначение');
            console.log('🔴 Маркер назначения установлен:', destinationLocation.lat, destinationLocation.lng);
        }

        // ============================================================
        // МАРШРУТ
        // ============================================================
        async function drawRoute() {
            if (!pickupLocation || !destinationLocation) {
                console.warn('⚠️ Нет точек для построения маршрута');
                return;
            }

            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }

            console.log('🚗 Строим маршрут от', pickupLocation, 'до', destinationLocation);

            const routeData = await buildRoute(
                pickupLocation.lat, pickupLocation.lng,
                destinationLocation.lat, destinationLocation.lng
            );

            if (routeData && routeData.coordinates.length > 0) {
                routeLine = L.polyline(routeData.coordinates, {
                    color: '#4ade80',
                    weight: 4,
                    opacity: 0.8,
                    dashArray: '8, 6'
                }).addTo(map);

                const result = calculatePriceAndCommission(routeData.distance);
                el.priceDisplay.textContent = formatPrice(result.price);
                el.distanceDisplay.textContent = formatDistance(routeData.distance);
                el.durationDisplay.textContent = formatDuration(routeData.duration);

                const bounds = L.latLngBounds(routeData.coordinates);
                map.fitBounds(bounds, { padding: [40, 40] });

                console.log('✅ Маршрут построен:', routeData.distance.toFixed(1), 'км');

            } else {
                // Запасной вариант — прямая линия
                const latlngs = [
                    [pickupLocation.lat, pickupLocation.lng],
                    [destinationLocation.lat, destinationLocation.lng]
                ];
                routeLine = L.polyline(latlngs, {
                    color: '#4ade80',
                    weight: 3,
                    opacity: 0.5,
                    dashArray: '5, 5'
                }).addTo(map);

                const distance = haversineDistance(
                    pickupLocation.lat, pickupLocation.lng,
                    destinationLocation.lat, destinationLocation.lng
                );
                const result = calculatePriceAndCommission(distance);
                el.priceDisplay.textContent = formatPrice(result.price);
                el.distanceDisplay.textContent = formatDistance(distance);
                el.durationDisplay.textContent = formatDuration(distance * 3);

                const bounds = L.latLngBounds(latlngs);
                map.fitBounds(bounds, { padding: [40, 40] });

                console.warn('⚠️ Маршрут построен по прямой');
                showMessage('⚠️ Маршрут построен по прямой (приблизительно)', 'warning');
            }
        }

        // ============================================================
        // ГЕОЛОКАЦИЯ
        // ============================================================
        function getCurrentLocation() {
            el.geoBtn.textContent = '⏳ ...';
            el.geoBtn.classList.add('loading');
            el.geoBtn.disabled = true;

            if (!navigator.geolocation) {
                showError('Геолокация не поддерживается');
                el.geoBtn.textContent = '📍 Определить';
                el.geoBtn.classList.remove('loading');
                el.geoBtn.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    pickupLocation = { lat, lng };
                    updatePickupMarker();

                    reverseGeocode(lat, lng, function(address) {
                        if (address) {
                            el.pickupInput.value = address;
                        } else {
                            el.pickupInput.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                        }
                    });

                    showMessage('📍 Геолокация определена', 'success');
                    el.geoBtn.textContent = '📍 Определить';
                    el.geoBtn.classList.remove('loading');
                    el.geoBtn.disabled = false;
                    drawRoute();
                },
                function(error) {
                    console.error('Ошибка геолокации:', error);
                    showError('Не удалось определить местоположение');
                    el.geoBtn.textContent = '📍 Определить';
                    el.geoBtn.classList.remove('loading');
                    el.geoBtn.disabled = false;
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // ============================================================
        // ОБРАБОТКА ВЫБОРА АДРЕСА ИЗ АВТОДОПОЛНЕНИЯ
        // ============================================================
        function handlePickupSelect(result) {
            pickupLocation = { lat: result.lat, lng: result.lng };
            updatePickupMarker();
            drawRoute();
            showMessage(`📍 Отправление: ${result.displayName}`, 'success');
        }

        function handleDestinationSelect(result) {
            destinationLocation = { lat: result.lat, lng: result.lng };
            console.log('📍 Адрес назначения выбран:', destinationLocation);
            updateDestinationMarker();
            drawRoute();
            showMessage(`🏁 Назначение: ${result.displayName}`, 'success');
        }

        // ============================================================
        // РУЧНОЙ ВВОД АДРЕСА
        // ============================================================
        el.pickupInput.addEventListener('blur', function() {
            const address = this.value.trim();
            if (address && !pickupLocation) {
                geocodeAddress(address).then(function(result) {
                    if (result) {
                        pickupLocation = { lat: result.lat, lng: result.lng };
                        updatePickupMarker();
                        drawRoute();
                    }
                });
            }
        });

        el.destinationInput.addEventListener('blur', function() {
            const address = this.value.trim();
            if (address && !destinationLocation) {
                geocodeAddress(address).then(function(result) {
                    if (result) {
                        destinationLocation = { lat: result.lat, lng: result.lng };
                        console.log('📍 Адрес назначения (blur):', destinationLocation);
                        updateDestinationMarker();
                        drawRoute();
                    } else {
                        destinationLocation = null;
                        showMessage('📍 Адрес сохранён как текстовый', 'info');
                    }
                });
            }
        });

        // ============================================================
        // СОЗДАНИЕ ЗАКАЗА
        // ============================================================
        async function createOrder() {
            const pickupAddress = el.pickupInput.value.trim();
            const destinationAddress = el.destinationInput.value.trim();

            console.log('🔍 Создание заказа:', { pickupAddress, destinationAddress, pickupLocation, destinationLocation });

            if (!pickupAddress) {
                showMessage('❌ Введите адрес отправления', 'error');
                return;
            }

            if (!destinationAddress) {
                showMessage('❌ Введите адрес назначения', 'error');
                return;
            }

            // Проверяем геолокацию отправления
            if (!pickupLocation) {
                const geoResult = await geocodeAddress(pickupAddress);
                if (geoResult) {
                    pickupLocation = { lat: geoResult.lat, lng: geoResult.lng };
                    updatePickupMarker();
                } else {
                    showMessage('❌ Не удалось определить геолокацию отправления', 'error');
                    return;
                }
            }

            // Проверяем геолокацию назначения
            if (!destinationLocation) {
                const geoResult = await geocodeAddress(destinationAddress);
                if (geoResult) {
                    destinationLocation = { lat: geoResult.lat, lng: geoResult.lng };
                    updateDestinationMarker();
                } else {
                    destinationLocation = null;
                    showMessage('📍 Адрес назначения сохранён как текстовый', 'info');
                }
            }

            // Расчёт стоимости
            let distance = 0;
            let price = 0;

            if (pickupLocation && destinationLocation) {
                distance = haversineDistance(
                    pickupLocation.lat, pickupLocation.lng,
                    destinationLocation.lat, destinationLocation.lng
                );
                const result = calculatePriceAndCommission(distance);
                price = result.price;
            }

            console.log('📊 Расчёт:', { distance, price });

            if (price > 0 && balance < price) {
                showMessage(`❌ Недостаточно средств. Нужно: ${formatPrice(price)}, у вас: ${formatPrice(balance)}`,
                'error');
                return;
            }

            el.orderBtn.disabled = true;
            el.orderBtn.textContent = '⏳ Заказ...';

            try {
                const user = auth.currentUser;
                if (!user) {
                    showMessage('❌ Войдите в аккаунт', 'error');
                    el.orderBtn.disabled = false;
                    el.orderBtn.textContent = '📍 Заказать такси';
                    return;
                }

                const orderData = {
                    clientId: user.uid,
                    clientName: user.displayName || 'Клиент',
                    status: 'new',
                    pickup: {
                        address: pickupAddress,
                        lat: pickupLocation?.lat || null,
                        lng: pickupLocation?.lng || null
                    },
                    destination: {
                        address: destinationAddress,
                        lat: destinationLocation?.lat || null,
                        lng: destinationLocation?.lng || null
                    },
                    price: price,
                    commission: price * 0.10,
                    driverEarn: price * 0.90,
                    distance: distance,
                    estimatedDuration: distance * 3,
                    isNight: isNight(),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    assignedManually: false,
                    dispatchHistory: [],
                    cancelled: false,
                    penaltyApplied: 0
                };

                console.log('📦 Данные заказа:', orderData);

                const orderRef = await db.collection('orders').add(orderData);
                currentOrderId = orderRef.id;
                orderStatus = 'new';

                showMessage(`✅ Заказ создан! ID: ${currentOrderId.substring(0, 8)}`, 'success');
                console.log('✅ Заказ создан:', currentOrderId);

                el.orderBtn.textContent = '✅ Заказ создан';
                el.orderBtn.disabled = true;
                el.cancelBtn.disabled = false;
                el.cancelBtn.textContent = '❌ Отменить';

                subscribeToOrder(currentOrderId);

            } catch (error) {
                console.error('❌ Ошибка создания заказа:', error);
                showMessage('❌ Ошибка: ' + error.message, 'error');
                el.orderBtn.disabled = false;
                el.orderBtn.textContent = '📍 Заказать такси';
            }
        }

        // ============================================================
        // ПОДПИСКА НА ЗАКАЗ
        // ============================================================
        function subscribeToOrder(orderId) {
            if (unsubOrder) {
                unsubOrder();
                unsubOrder = null;
            }

            const orderRef = db.collection('orders').doc(orderId);
            unsubOrder = orderRef.onSnapshot(function(doc) {
                if (!doc.exists) return;
                const data = doc.data();
                console.log('🔄 Обновление заказа:', data.status);

                if (data.status === 'assigned') {
                    el.statusText.textContent = '✅ Водитель назначен!';
                    el.statusDetail.textContent = '🚗 Водитель едет к вам';
                    el.orderStatus.classList.add('active');
                    el.cancelBtn.disabled = false;
                    showMessage('✅ Водитель назначен!', 'success');
                } else if (data.status === 'in_progress') {
                    el.statusText.textContent = '🚗 Поездка началась!';
                    el.statusDetail.textContent = 'Водитель уже в пути';
                    el.orderStatus.classList.add('active');
                    el.cancelBtn.disabled = true;
                    el.cancelBtn.textContent = '❌ Отмена недоступна';
                } else if (data.status === 'completed') {
                    el.statusText.textContent = '✅ Поездка завершена!';
                    el.statusDetail.textContent = 'Спасибо за поездку!';
                    el.orderStatus.classList.add('active');
                    el.cancelBtn.disabled = true;
                    el.orderBtn.disabled = true;
                    showMessage('✅ Поездка завершена!', 'success');
                } else if (data.status === 'cancelled') {
                    el.statusText.textContent = '❌ Заказ отменён';
                    el.statusDetail.textContent = data.penaltyApplied ? `Штраф: ${formatPrice(data.penaltyApplied)}` :
                        'Без штрафа';
                    el.orderStatus.classList.add('active');
                    el.cancelBtn.disabled = true;
                    el.cancelBtn.textContent = '❌ Отменён';
                    el.orderBtn.disabled = false;
                    el.orderBtn.textContent = '📍 Заказать снова';
                    if (data.penaltyApplied) {
                        showMessage(`⚠️ Штраф ${formatPrice(data.penaltyApplied)} за отмену`, 'warning');
                    }
                    if (unsubOrder) { unsubOrder();
                        unsubOrder = null; }
                }
            }, function(error) {
                console.error('Ошибка подписки на заказ:', error);
            });
        }

        // ============================================================
        // ОТМЕНА ЗАКАЗА
        // ============================================================
        function cancelOrder() {
            if (!currentOrderId) {
                showMessage('❌ Нет активного заказа', 'error');
                return;
            }

            if (!confirm('Вы уверены, что хотите отменить заказ?')) return;

            el.cancelBtn.disabled = true;
            el.cancelBtn.textContent = '⏳ Отмена...';

            const orderRef = db.collection('orders').doc(currentOrderId);

            orderRef.get().then(function(doc) {
                if (!doc.exists) {
                    showMessage('❌ Заказ не найден', 'error');
                    el.cancelBtn.disabled = false;
                    el.cancelBtn.textContent = '❌ Отменить';
                    return;
                }

                const data = doc.data();
                let penalty = 0;

                if (data.status === 'assigned' || data.status === 'in_progress') {
                    if (data.assignedAt) {
                        const assignedTime = data.assignedAt.toDate ? data.assignedAt.toDate() : new Date(data
                        .assignedAt);
                        const elapsed = (Date.now() - assignedTime.getTime()) / 60000;
                        if (elapsed > 2) {
                            penalty = TARIFF.PENALTY_CANCEL;
                            showMessage(`⚠️ Штраф ${formatPrice(penalty)} за отмену после подтверждения`, 'warning');
                        }
                    } else {
                        penalty = TARIFF.PENALTY_CANCEL;
                    }
                }

                return orderRef.update({
                    status: 'cancelled',
                    cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
                    penaltyApplied: penalty,
                    cancellationReason: 'Отменено клиентом',
                    cancelledBy: 'client'
                }).then(function() {
                    if (penalty > 0) {
                        const user = auth.currentUser;
                        if (user) {
                            const userRef = db.collection('users').doc(user.uid);
                            userRef.update({
                                balance: firebase.firestore.FieldValue.increment(-penalty),
                                penalty: firebase.firestore.FieldValue.increment(penalty)
                            }).catch(function(err) {
                                console.error('Ошибка списания штрафа:', err);
                            });
                        }
                    }
                    el.cancelBtn.disabled = true;
                    el.cancelBtn.textContent = '❌ Отменён';
                    showMessage('✅ Заказ отменён', 'info');
                });
            }).catch(function(error) {
                console.error('❌ Ошибка отмены:', error);
                showMessage('❌ Ошибка: ' + error.message, 'error');
                el.cancelBtn.disabled = false;
                el.cancelBtn.textContent = '❌ Отменить';
            });
        }

        // ============================================================
        // БАЛАНС
        // ============================================================
        function updateBalance() {
            const user = auth.currentUser;
            if (!user) return;

            db.collection('users').doc(user.uid).get()
                .then(function(doc) {
                    if (doc.exists) {
                        const data = doc.data();
                        balance = data.balance || 0;
                        el.balanceDisplay.textContent = '💰 ' + formatPrice(balance);
                    }
                })
                .catch(function(err) {
                    console.error('Ошибка загрузки баланса:', err);
                });
        }

        // ============================================================
        // АВТОРИЗАЦИЯ
        // ============================================================
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            updateBalance();

            const now = new Date();
            now.setMinutes(now.getMinutes() + 15);
            el.timeInput.value = now.toISOString().slice(0, 16);

            initMap();

            setupAutocomplete(el.pickupInput, el.pickupAutocomplete, handlePickupSelect);
            setupAutocomplete(el.destinationInput, el.destinationAutocomplete, handleDestinationSelect);

            setTimeout(getCurrentLocation, 500);
        });

        // ============================================================
        // ОБРАБОТЧИКИ
        // ============================================================
        el.backBtn.addEventListener('click', function() {
            if (currentOrderId) {
                if (!confirm('У вас есть активный заказ. Вернуться в кабинет?')) return;
            }
            if (unsubOrder) { unsubOrder();
                unsubOrder = null; }
            window.location.href = 'cabinet.html';
        });

        el.geoBtn.addEventListener('click', getCurrentLocation);
        el.orderBtn.addEventListener('click', createOrder);
        el.cancelBtn.addEventListener('click', cancelOrder);

        console.log('✅ Страница заказа готова');
        console.log('📌 Особенности:');
        console.log('  🗺️ Маршрут через OSRM');
        console.log('  🟢 Зелёный — отправление');
        console.log('  🔴 Красный — назначение');
        console.log('  ✅ Проверка консоли для отладки');
    </script>

</body>
