    <style>

        * {

            padding: 0;

            color: #ffffff;
        }

        .container {

            transition: opacity 0.3s ease;

        .map-hint.hidden {
            opacity: 0;
        }
        .map-hint .icon {
            color: #ffb000;
        }

        /* ===== ОШИБКИ ===== */
        .error-box {
            background: rgba(255, 70, 70, 0.08);
            border: 1px solid rgba(255, 70, 70, 0.12);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 10px;
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            display: none;

        /* ===== СТАТУС ЗАКАЗА ===== */
        .order-status {

            margin-bottom: 10px;

            text-align: center;

        .order-status.active {

            font-weight: 600;
            color: #e0e8f0;
        }
        .order-status .status-text .emoji {
            margin-right: 6px;
        }
        .order-status .status-detail {
            font-size: 13px;
            color: #8899aa;
            margin-top: 4px;
        }
        .order-status .status-detail .highlight {
            color: #4ade80;
        }
        .order-status .status-detail .warning {
            color: #ffb000;

        /* ===== ФОРМА ===== */

            backdrop-filter: blur(20px);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .form-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        .form-row:last-of-type {
            margin-bottom: 12px;

        .form-row .icon {
            font-size: 18px;
            flex-shrink: 0;
            width: 28px;

        }

        .autocomplete-wrapper {
            position: relative;
            flex: 1;

        .autocomplete-wrapper input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);

            font-size: 14px;

        .autocomplete-wrapper input::placeholder {

        }
        .autocomplete-wrapper input:disabled {

        .autocomplete-list {

        .autocomplete-list .item:hover {

            cursor: not-allowed;
        }
        .geo-btn.success {
            border-color: rgba(74, 222, 128, 0.3);
            color: #4ade80;
        }

        /* ===== ИНФОРМАЦИОННАЯ ПАНЕЛЬ ===== */
        .info-panel {

        .btn-order:active:not(:disabled) {

        .btn-order:disabled {

            background: rgba(96, 165, 250, 0.1);

            border: 1px solid rgba(96, 165, 250, 0.15);

            background: rgba(255, 180, 0, 0.1);
            color: #ffb000;
            border: 1px solid rgba(255, 180, 0, 0.15);
            display: block;

            .header {

            .balance-display {

            .form-section {

            .info-panel {

            }
            .info-item {
                padding: 6px 4px;
            }
            .info-item .value {
                font-size: 14px;
            }
            .btn-order {
                font-size: 14px;
                padding: 12px;
            }
            .btn-cancel {
                font-size: 13px;
                padding: 12px 14px;
            }
            .map-hint {
                font-size: 10px;
                padding: 4px 12px;
                bottom: 8px;
            }
            .autocomplete-wrapper input {
                font-size: 13px;
                padding: 8px 12px;
            }
            .geo-btn {
                font-size: 11px;
                padding: 6px 10px;
                min-width: 60px;
            }
        }
    </style>
</head>

    <script>
        // ============================================================
        // FIREBASE КОНФИГ
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        console.log('🔥 Firebase готов');

        // ============================================================
        // ПЕРЕМЕННЫЕ
        // ============================================================
        let map;
        let routingControl = null;
        let pickupMarker = null;
        let destinationMarker = null;
        let pickupLocation = null;
        let destinationLocation = null;
        let currentOrderId = null;
        let orderStatus = null;
        let balance = 0;
        let currentUser = null;
        let unsubOrder = null;
        let isProcessing = false;

        // Тарифы
        const TARIFF = {
            BASE_FEE: 12.00,
            PRICE_PER_KM: 3.70,
            NIGHT_SURCHARGE: 1.25,
            NIGHT_START_HOUR: 23,
            NIGHT_END_HOUR: 5,
            PENALTY_CANCEL: 7.00,
            COMMISSION: 0.10
        };

        // ============================================================
        // ЭЛЕМЕНТЫ
        // ============================================================
        const el = {
            map: document.getElementById('map'),
            pickupInput: document.getElementById('pickupInput'),
            destinationInput: document.getElementById('destinationInput'),
            pickupAutocomplete: document.getElementById('pickupAutocomplete'),
            destinationAutocomplete: document.getElementById('destinationAutocomplete'),
            geoBtn: document.getElementById('geoBtn'),
            swapBtn: document.getElementById('swapBtn'),
            orderBtn: document.getElementById('orderBtn'),
            cancelBtn: document.getElementById('cancelBtn'),
            balanceDisplay: document.getElementById('balanceDisplay'),
            priceDisplay: document.getElementById('priceDisplay'),
            distanceDisplay: document.getElementById('distanceDisplay'),
            durationDisplay: document.getElementById('durationDisplay'),
            message: document.getElementById('message'),
            errorBox: document.getElementById('errorBox'),
            errorText: document.getElementById('errorText'),
            orderStatus: document.getElementById('orderStatus'),
            statusText: document.getElementById('statusText'),
            statusDetail: document.getElementById('statusDetail'),
            backBtn: document.getElementById('backBtn'),
            mapHint: document.getElementById('mapHint')
        };

        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================
        function showMessage(text, type = 'info') {
            el.message.className = 'message ' + type;
            el.message.textContent = text;
            el.message.style.display = 'block';
            clearTimeout(el.message._timeout);
            el.message._timeout = setTimeout(() => {
                el.message.style.display = 'none';
            }, 5000);
        }

        function showError(text) {
            el.errorBox.style.display = 'block';
            el.errorText.textContent = text;
            clearTimeout(el.errorBox._timeout);
            el.errorBox._timeout = setTimeout(() => {
                el.errorBox.style.display = 'none';
            }, 8000);
        }

        function hideError() {
            el.errorBox.style.display = 'none';
        }

        function formatPrice(price) {
            return price.toFixed(2) + ' ₪';
        }

        function formatDistance(km) {
            if (!km || km < 0) return '—';
            if (km < 1) return (km * 1000).toFixed(0) + ' м';
            return km.toFixed(1) + ' км';
        }

        function formatDuration(min) {
            if (!min || min < 0) return '—';
            if (min < 1) return '< 1 мин';
            if (min < 60) return Math.round(min) + ' мин';
            const h = Math.floor(min / 60);
            const m = Math.round(min % 60);
            return h + ' ч ' + m + ' мин';
        }

        function isNight() {
            const now = new Date();
            const hour = now.getHours();
            return (hour >= TARIFF.NIGHT_START_HOUR || hour < TARIFF.NIGHT_END_HOUR);
        }

        function calculatePriceAndCommission(distanceKm) {
            let price = TARIFF.BASE_FEE + (distanceKm * TARIFF.PRICE_PER_KM);
            if (isNight()) {
                price = price * TARIFF.NIGHT_SURCHARGE;
            }
            const commission = price * TARIFF.COMMISSION;
            const driverEarn = price - commission;
            return { price, commission, driverEarn };
        }

        function haversineDistance(lat1, lng1, lat2, lng2) {
            if (!lat1 || !lng1 || !lat2 || !lng2) return 0;
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // ============================================================
        // ГЕОКОДИНГ
        // ============================================================
        async function geocodeAddress(address) {
            if (!address || address.trim() === '') return null;
            try {
                const url =
                    `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&limit=1&addressdetails=1&countrycodes=il`;
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.length > 0) {
                    return {
                        lat: parseFloat(data[0].lat),
                        lng: parseFloat(data[0].lon),
                        displayName: data[0].display_name
                    };
                }
                return null;
            } catch (error) {
                console.error('Ошибка геокодинга:', error);
                return null;
            }
        }

        function reverseGeocode(lat, lng, callback) {
            const url =
                `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&addressdetails=1`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    callback(data && data.display_name ? data.display_name : null);
                })
                .catch(() => callback(null));
        }

        // ============================================================
        // АВТОДОПОЛНЕНИЕ
        // ============================================================
        let searchTimeout = null;

        function setupAutocomplete(input, listEl, onSelect) {
            input.addEventListener('input', function() {
                const query = this.value.trim();
                if (query.length < 2) {
                    listEl.style.display = 'none';
                    return;
                }

                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(async function() {
                    try {
                        const url =
                            `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5&addressdetails=1&countrycodes=il`;
                        const response = await fetch(url);
                        const data = await response.json();

                        if (data && data.length > 0) {
                            listEl.innerHTML = '';
                            data.forEach(function(item) {
                                const div = document.createElement('div');
                                div.className = 'item';
                                const displayName = item.display_name || item.name || 'Неизвестный адрес';
                                const highlighted = displayName.replace(
                                    new RegExp(query, 'gi'),
                                    match => `<span class="highlight">${match}</span>`
                                );
                                div.innerHTML = highlighted;
                                div.addEventListener('click', function() {
                                    input.value = displayName;
                                    listEl.style.display = 'none';
                                    if (onSelect) {
                                        onSelect({
                                            lat: parseFloat(item.lat),
                                            lng: parseFloat(item.lon),
                                            displayName: displayName
                                        });
                                    }
                                });
                                listEl.appendChild(div);
                            });
                            listEl.style.display = 'block';
                        } else {
                            listEl.style.display = 'none';
                        }
                    } catch (error) {
                        console.error('Ошибка автодополнения:', error);
                        listEl.style.display = 'none';
                    }
                }, 400);
            });

            document.addEventListener('click', function(e) {
                if (!input.contains(e.target) && !listEl.contains(e.target)) {
                    listEl.style.display = 'none';
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    listEl.style.display = 'none';
                }
                if (e.key === 'Enter') {
                    listEl.style.display = 'none';
                    input.blur();
                }
            });
        }

        // ============================================================
        // КАРТА
        // ============================================================
        function initMap() {
            map = L.map('map', {
                zoomControl: true,
                attributionControl: true
            }).setView([32.0853, 34.7818], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19,
                minZoom: 10
            }).addTo(map);

            // Клик по карте
            map.on('click', function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;

                if (!pickupLocation) {
                    setPickupLocation(lat, lng);
                    showMessage('📍 Точка отправления установлена', 'success');
                    return;
                }

                if (pickupLocation && !destinationLocation) {
                    setDestinationLocation(lat, lng);
                    showMessage('📍 Точка назначения установлена', 'success');
                    return;
                }

                if (pickupLocation && destinationLocation) {
                    setDestinationLocation(lat, lng);
                    showMessage('📍 Точка назначения обновлена', 'success');
                }
            });

            console.log('🗺️ Карта инициализирована');
        }

        // ============================================================
        // УПРАВЛЕНИЕ МАРКЕРАМИ И МАРШРУТОМ
        // ============================================================
        function setPickupLocation(lat, lng) {
            pickupLocation = { lat, lng };
            if (pickupMarker) {
                map.removeLayer(pickupMarker);
            }
            const greenIcon = L.divIcon({
                html: '🟢',
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 30]
            });
            pickupMarker = L.marker([lat, lng], { icon: greenIcon })
                .addTo(map)
                .bindPopup('📍 Отправление');

            reverseGeocode(lat, lng, function(address) {
                if (address) {
                    el.pickupInput.value = address;
                } else {
                    el.pickupInput.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                }
            });

            map.setView([lat, lng], 15);
            updateRoute();
            calculateAndUpdate();
        }

        function setDestinationLocation(lat, lng) {
            destinationLocation = { lat, lng };
            if (destinationMarker) {
                map.removeLayer(destinationMarker);
            }
            const redIcon = L.divIcon({
                html: '🔴',
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 30]
            });
            destinationMarker = L.marker([lat, lng], { icon: redIcon })
                .addTo(map)
                .bindPopup('🏁 Назначение');

            reverseGeocode(lat, lng, function(address) {
                if (address) {
                    el.destinationInput.value = address;
                } else {
                    el.destinationInput.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                }
            });

            updateRoute();
            calculateAndUpdate();

            // Показать маршрут с увеличением
            if (pickupLocation && destinationLocation) {
                const bounds = L.latLngBounds(
                    [pickupLocation.lat, pickupLocation.lng],
                    [destinationLocation.lat, destinationLocation.lng]
                );
                map.fitBounds(bounds, { padding: [40, 40] });
            }
        }

        // ============================================================
        // ПОСТРОЕНИЕ МАРШРУТА (Routing Machine)
        // ============================================================
        function updateRoute() {
            // Удаляем старый маршрут
            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }

            if (!pickupLocation || !destinationLocation) {
                return;
            }

            // Проверяем, что точки не совпадают
            const dist = haversineDistance(
                pickupLocation.lat, pickupLocation.lng,
                destinationLocation.lat, destinationLocation.lng
            );
            if (dist < 0.01) {
                return;
            }

            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(pickupLocation.lat, pickupLocation.lng),
                    L.latLng(destinationLocation.lat, destinationLocation.lng)
                ],
                routeWhileDragging: false,
                show: false,
                lineOptions: {
                    styles: [{ color: '#4ade80', weight: 4, opacity: 0.8 }],
                    extendToWaypoints: true,
                    missingRouteTolerance: 0
                },
                createMarker: function() { return null; },
                router: L.Routing.osrmv1({
                    serviceUrl: 'https://router.project-osrm.org/route/v1/',
                    profile: 'driving'
                })
            }).addTo(map);

            // Получаем расстояние и время от OSRM
            routingControl.on('routesfound', function(e) {
                const routes = e.routes;
                if (routes && routes.length > 0) {
                    const route = routes[0];
                    const distance = route.summary.totalDistance / 1000; // в км
                    const duration = route.summary.totalTime / 60; // в минутах

                    // Обновляем информацию
                    const result = calculatePriceAndCommission(distance);
                    el.priceDisplay.textContent = formatPrice(result.price);
                    el.distanceDisplay.textContent = formatDistance(distance);
                    el.durationDisplay.textContent = formatDuration(duration);

                    // Сохраняем для заказа
                    window._routeData = { distance, duration, price: result.price };
                }
            });

            // Если OSRM не отвечает, используем Haversine
            setTimeout(() => {
                if (!window._routeData) {
                    const dist = haversineDistance(
                        pickupLocation.lat, pickupLocation.lng,
                        destinationLocation.lat, destinationLocation.lng
                    );
                    if (dist > 0.01) {
                        const duration = dist * 3;
                        const result = calculatePriceAndCommission(dist);
                        el.priceDisplay.textContent = formatPrice(result.price);
                        el.distanceDisplay.textContent = formatDistance(dist);
                        el.durationDisplay.textContent = formatDuration(duration);
                        window._routeData = { distance: dist, duration, price: result.price };
                    }
                }
            }, 3000);
        }

        // ============================================================
        // РАСЧЁТ (ручной)
        // ============================================================
        function calculateAndUpdate() {
            if (!pickupLocation || !destinationLocation) {
                el.priceDisplay.textContent = '—';
                el.distanceDisplay.textContent = '—';
                el.durationDisplay.textContent = '—';
                return;
            }

            const dist = haversineDistance(
                pickupLocation.lat, pickupLocation.lng,
                destinationLocation.lat, destinationLocation.lng
            );

            if (dist < 0.01) {
                el.priceDisplay.textContent = '—';
                el.distanceDisplay.textContent = '—';
                el.durationDisplay.textContent = '—';
                return;
            }

            const duration = dist * 3;
            const result = calculatePriceAndCommission(dist);
            el.priceDisplay.textContent = formatPrice(result.price);
            el.distanceDisplay.textContent = formatDistance(dist);
            el.durationDisplay.textContent = formatDuration(duration);

            window._routeData = { distance: dist, duration, price: result.price };
        }

        // ============================================================
        // ГЕОЛОКАЦИЯ
        // ============================================================
        function getCurrentLocation() {
            el.geoBtn.textContent = '⏳ ...';
            el.geoBtn.classList.add('loading');
            el.geoBtn.disabled = true;

            if (!navigator.geolocation) {
                showError('Геолокация не поддерживается');
                el.geoBtn.textContent = '📍 Определить';
                el.geoBtn.classList.remove('loading');
                el.geoBtn.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    setPickupLocation(lat, lng);
                    el.geoBtn.textContent = '✅ Определено';
                    el.geoBtn.classList.add('success');
                    el.geoBtn.classList.remove('loading');
                    el.geoBtn.disabled = false;
                    showMessage('📍 Геолокация определена', 'success');
                },
                function(error) {
                    console.error('Ошибка геолокации:', error);
                    showError('Не удалось определить местоположение');
                    el.geoBtn.textContent = '📍 Определить';
                    el.geoBtn.classList.remove('loading');
                    el.geoBtn.disabled = false;
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // ============================================================
        // ОБРАБОТЧИКИ ВЫБОРА АДРЕСА
        // ============================================================
        function handlePickupSelect(result) {
            setPickupLocation(result.lat, result.lng);
        }

        function handleDestinationSelect(result) {
            setDestinationLocation(result.lat, result.lng);
        }

        // ============================================================
        // СОЗДАНИЕ ЗАКАЗА (РЕАЛЬНОЕ СОХРАНЕНИЕ В FIRESTORE)
        // ============================================================
        async function createOrder() {
            if (isProcessing) return;

            const pickupAddress = el.pickupInput.value.trim();
            const destinationAddress = el.destinationInput.value.trim();

            if (!pickupAddress) {
                showMessage('Введите адрес отправления', 'error');
                el.pickupInput.focus();
                return;
            }

            if (!destinationAddress) {
                showMessage('Введите адрес назначения', 'error');
                el.destinationInput.focus();
                return;
            }

            // Проверяем геолокацию
            if (!pickupLocation) {
                const geoResult = await geocodeAddress(pickupAddress);
                if (geoResult) {
                    setPickupLocation(geoResult.lat, geoResult.lng);
                } else {
                    showMessage('⚠️ Не удалось определить координаты отправления', 'warning');
                }
            }

            if (!destinationLocation) {
                const geoResult = await geocodeAddress(destinationAddress);
                if (geoResult) {
                    setDestinationLocation(geoResult.lat, geoResult.lng);
                } else {
                    showMessage('⚠️ Не удалось определить координаты назначения', 'warning');
                }
            }

            // Получаем данные маршрута
            let routeData = window._routeData || {};
            let distance = routeData.distance || 0;
            let price = routeData.price || 0;

            // Если нет данных, рассчитываем вручную
            if (distance === 0 && pickupLocation && destinationLocation) {
                distance = haversineDistance(
                    pickupLocation.lat, pickupLocation.lng,
                    destinationLocation.lat, destinationLocation.lng
                );
                const result = calculatePriceAndCommission(distance);
                price = result.price;
            }

            // Проверяем баланс
            if (balance < price) {
                showMessage(`❌ Недостаточно средств. Нужно: ${formatPrice(price)}, у вас: ${formatPrice(balance)}`,
                    'error');
                return;
            }

            isProcessing = true;
            el.orderBtn.disabled = true;
            el.orderBtn.textContent = '⏳ Создание...';
            el.orderBtn.classList.add('loading');

            try {
                const user = auth.currentUser;
                if (!user) {
                    showMessage('❌ Пожалуйста, войдите в аккаунт', 'error');
                    isProcessing = false;
                    el.orderBtn.disabled = false;
                    el.orderBtn.textContent = '🚖 Заказать такси';
                    el.orderBtn.classList.remove('loading');
                    return;
                }

                const orderData = {
                    clientId: user.uid,
                    clientName: user.displayName || 'Клиент',
                    status: 'new',
                    pickup: {
                        address: pickupAddress,
                        lat: pickupLocation ? pickupLocation.lat : null,
                        lng: pickupLocation ? pickupLocation.lng : null
                    },
                    destination: {
                        address: destinationAddress,
                        lat: destinationLocation ? destinationLocation.lat : null,
                        lng: destinationLocation ? destinationLocation.lng : null
                    },
                    price: price,
                    commission: price * TARIFF.COMMISSION,
                    driverEarn: price * (1 - TARIFF.COMMISSION),
                    distance: distance,
                    estimatedDuration: distance * 3,
                    isNight: isNight(),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    assignedManually: false,
                    dispatchHistory: [],
                    penaltyApplied: 0
                };

                const orderRef = await db.collection('orders').add(orderData);
                currentOrderId = orderRef.id;
                orderStatus = 'new';

                showMessage(`✅ Заказ создан! ID: ${currentOrderId.substring(0, 8)}`, 'success');

                el.orderBtn.textContent = '✅ Заказ создан';
                el.orderBtn.disabled = true;
                el.cancelBtn.disabled = false;
                el.cancelBtn.textContent = '✖';

                el.mapHint.classList.add('hidden');

                subscribeToOrder(currentOrderId);

            } catch (error) {
                console.error('❌ Ошибка создания заказа:', error);
                showMessage('❌ Ошибка: ' + error.message, 'error');
            } finally {
                isProcessing = false;
                el.orderBtn.classList.remove('loading');
            }
        }

        // ============================================================
        // ПОДПИСКА НА ЗАКАЗ (REAL-TIME)
        // ============================================================
        function subscribeToOrder(orderId) {
            if (unsubOrder) {
                unsubOrder();
                unsubOrder = null;
            }

            const orderRef = db.collection('orders').doc(orderId);
            unsubOrder = orderRef.onSnapshot(function(doc) {
                if (!doc.exists) {
                    // Заказ удалён
                    el.orderStatus.classList.remove('active');
                    el.cancelBtn.disabled = true;
                    el.cancelBtn.textContent = '✖';
                    el.orderBtn.disabled = false;
                    el.orderBtn.textContent = '🚖 Заказать такси';
                    return;
                }

                const data = doc.data();
                console.log('🔄 Обновление заказа:', data.status);

                el.orderStatus.classList.add('active');

                switch (data.status) {
                    case 'new':
                    case 'searching':
                        el.statusText.innerHTML = `<span class="emoji">⏳</span> Поиск водителя...`;
                        el.statusDetail.innerHTML =
                            `Ищем ближайшего водителя... <span class="warning">⏱️</span>`;
                        el.cancelBtn.disabled = false;
                        el.cancelBtn.textContent = '✖';
                        break;

                    case 'assigned':
                        el.statusText.innerHTML = `<span class="emoji">✅</span> Водитель назначен!`;
                        el.statusDetail.innerHTML =
                            `🚗 Водитель едет к вам <span class="highlight">${data.driverName || ''}</span>`;
                        el.cancelBtn.disabled = false;
                        el.cancelBtn.textContent = '✖';
                        showMessage('✅ Водитель назначен! Ожидайте.', 'success');
                        break;

                    case 'in_progress':
                        el.statusText.innerHTML = `<span class="emoji">🚗</span> Поездка началась!`;
                        el.statusDetail.innerHTML = `Водитель уже в пути 🛣️`;
                        el.cancelBtn.disabled = true;
                        el.cancelBtn.textContent = '⛔';
                        showMessage('🚗 Поездка началась!', 'info');
                        break;

                    case 'completed':
                        el.statusText.innerHTML = `<span class="emoji">🎉</span> Поездка завершена!`;
                        el.statusDetail.innerHTML = `Спасибо за поездку! 🌟`;
                        el.cancelBtn.disabled = true;
                        el.cancelBtn.textContent = '✅';
                        el.orderBtn.disabled = true;
                        el.orderBtn.textContent = '✅ Завершён';
                        showMessage('🎉 Поездка завершена!', 'success');
                        if (unsubOrder) { unsubOrder();
                            unsubOrder = null; }
                        break;

                    case 'cancelled':
                        const penalty = data.penaltyApplied || 0;
                        el.statusText.innerHTML = `<span class="emoji">❌</span> Заказ отменён`;
                        el.statusDetail.innerHTML = penalty ?
                            `Штраф: <span class="warning">${formatPrice(penalty)}</span>` :
                            'Без штрафа';
                        el.cancelBtn.disabled = true;
                        el.cancelBtn.textContent = '❌';
                        el.orderBtn.disabled = false;
                        el.orderBtn.textContent = '🚖 Заказать снова';
                        if (penalty) {
                            showMessage(`⚠️ Штраф ${formatPrice(penalty)} за отмену`, 'warning');
                        }
                        if (unsubOrder) { unsubOrder();
                            unsubOrder = null; }
                        break;
                }
            }, function(error) {
                console.error('❌ Ошибка подписки:', error);
            });
        }

        // ============================================================
        // ОТМЕНА ЗАКАЗА
        // ============================================================
        function cancelOrder() {
            if (!currentOrderId) {
                showMessage('❌ Нет активного заказа', 'error');
                return;
            }

            if (!confirm('❌ Вы уверены, что хотите отменить заказ?')) return;

            el.cancelBtn.disabled = true;
            el.cancelBtn.textContent = '⏳';

            const orderRef = db.collection('orders').doc(currentOrderId);

            orderRef.get().then(function(doc) {
                if (!doc.exists) {
                    showMessage('❌ Заказ не найден', 'error');
                    el.cancelBtn.disabled = false;
                    el.cancelBtn.textContent = '✖';
                    return;
                }

                const data = doc.data();
                let penalty = 0;

                if (data.status === 'assigned' || data.status === 'in_progress') {
                    if (data.assignedAt) {
                        const assignedTime = data.assignedAt.toDate ? data.assignedAt.toDate() : new Date(data
                            .assignedAt);
                        const elapsed = (Date.now() - assignedTime.getTime()) / 60000;
                        if (elapsed > 2) {
                            penalty = TARIFF.PENALTY_CANCEL;
                        }
                    } else {
                        penalty = TARIFF.PENALTY_CANCEL;
                    }
                }

                return orderRef.update({
                    status: 'cancelled',
                    cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
                    penaltyApplied: penalty,
                    cancellationReason: 'Отменено клиентом',
                    cancelledBy: 'client'
                }).then(function() {
                    if (penalty > 0) {
                        const user = auth.currentUser;
                        if (user) {
                            db.collection('users').doc(user.uid).update({
                                balance: firebase.firestore.FieldValue.increment(-penalty),
                                penalty: firebase.firestore.FieldValue.increment(penalty)
                            }).then(function() {
                                console.log('💰 Штраф списан:', penalty);
                                updateBalance();
                                showMessage(`💰 Списан штраф ${formatPrice(penalty)}`, 'warning');
                            }).catch(function(err) {
                                console.error('❌ Ошибка списания:', err);
                            });
                        }
                    }
                    el.cancelBtn.disabled = true;
                    el.cancelBtn.textContent = '❌';
                    showMessage('✅ Заказ отменён', 'info');
                });
            }).catch(function(error) {
                console.error('❌ Ошибка отмены:', error);
                showMessage('❌ Ошибка: ' + error.message, 'error');
                el.cancelBtn.disabled = false;
                el.cancelBtn.textContent = '✖';
            });
        }

        // ============================================================
        // ОБНОВЛЕНИЕ БАЛАНСА
        // ============================================================
        function updateBalance() {
            const user = auth.currentUser;
            if (!user) return;

            db.collection('users').doc(user.uid).get()
                .then(function(doc) {
                    if (doc.exists) {
                        balance = doc.data().balance || 0;
                        el.balanceDisplay.textContent = '💰 ' + formatPrice(balance);
                    }
                })
                .catch(function(err) {
                    console.error('❌ Ошибка загрузки баланса:', err);
                });
        }

        // ============================================================
        // ОБРАБОТЧИКИ СОБЫТИЙ
        // ============================================================

        // === Назад ===
        el.backBtn.addEventListener('click', function() {
            if (currentOrderId && orderStatus !== 'completed' && orderStatus !== 'cancelled') {
                if (!confirm('У вас есть активный заказ. Вернуться в кабинет?')) return;
            }
            if (unsubOrder) { unsubOrder();
                unsubOrder = null; }
            window.location.href = 'cabinet.html';
        });

        // === Геолокация ===
        el.geoBtn.addEventListener('click', getCurrentLocation);

        // === Поменять местами ===
        el.swapBtn.addEventListener('click', function() {
            if (!pickupLocation || !destinationLocation) {
                showMessage('Установите обе точки', 'warning');
                return;
            }

            const tempLoc = { ...pickupLocation };
            const tempAddress = el.pickupInput.value;

            setPickupLocation(destinationLocation.lat, destinationLocation.lng);
            setDestinationLocation(tempLoc.lat, tempLoc.lng);

            const tempInput = el.pickupInput.value;
            el.pickupInput.value = el.destinationInput.value;
            el.destinationInput.value = tempInput;

            showMessage('🔄 Точки поменяны местами', 'info');
        });

        // === Ввод адреса "Откуда" ===
        el.pickupInput.addEventListener('blur', function() {
            const address = this.value.trim();
            if (address && !pickupLocation) {
                geocodeAddress(address).then(function(result) {
                    if (result) {
                        setPickupLocation(result.lat, result.lng);
                    }
                });
            }
        });

        // === Ввод адреса "Куда" ===
        el.destinationInput.addEventListener('blur', function() {
            const address = this.value.trim();
            if (address && !destinationLocation) {
                geocodeAddress(address).then(function(result) {
                    if (result) {
                        setDestinationLocation(result.lat, result.lng);
                    }
                });
            }
        });

        // === Заказать ===
        el.orderBtn.addEventListener('click', createOrder);

        // === Отменить ===
        el.cancelBtn.addEventListener('click', cancelOrder);

        // ============================================================
        // АВТОРИЗАЦИЯ
        // ============================================================
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            updateBalance();

            initMap();

            setupAutocomplete(el.pickupInput, el.pickupAutocomplete, handlePickupSelect);
            setupAutocomplete(el.destinationInput, el.destinationAutocomplete, handleDestinationSelect);

            setTimeout(getCurrentLocation, 500);
        });
