<html lang="ru">
<head>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0c10;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 12px;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            border-radius: 30px;
            padding: 6px 14px;
            color: #8899aa;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }
        .header-title span {
            color: #ffb000;
        }

        .balance-display {
            background: rgba(255, 180, 0, 0.08);
            border: 1px solid rgba(255, 180, 0, 0.12);
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 14px;
            font-weight: 700;
            color: #ffb000;
        }

        #map {
            height: 250px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
            background: #11151a;
        }

        .form-section {
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(20px);

            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);

        .form-row {
            display: flex;

        }

        .form-row .icon {
            font-size: 18px;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }

        .autocomplete-wrapper {
            position: relative;
            flex: 1;
        }

        .autocomplete-wrapper input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }
        .autocomplete-wrapper input:focus {
            border-color: #ffb000;
            background: rgba(255, 255, 255, 0.06);
        }
        .autocomplete-wrapper input::placeholder {
            color: #556677;
        }

        .geo-btn {
            background: rgba(255, 180, 0, 0.08);
            border: 1px solid rgba(255, 180, 0, 0.12);
            border-radius: 12px;
            padding: 8px 14px;
            color: #ffb000;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;

            flex-shrink: 0;
        }
        .geo-btn:hover {
            background: rgba(255, 180, 0, 0.15);
        }
        .geo-btn:active {
            transform: scale(0.95);

        .geo-btn.loading {
            opacity: 0.5;

        .info-panel {

            grid-template-columns: 1fr 1fr 1fr;

        .info-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;

            text-align: center;

        .info-item .label {
            font-size: 9px;
            color: #667788;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-item .value {
            font-size: 16px;
            font-weight: 700;
            margin-top: 2px;
        }
        .info-item .value.gold {
            color: #ffb000;
        }
        .info-item .value.green {
            color: #4ade80;
        }
        .info-item .value.blue {
            color: #60a5fa;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-order {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .btn-order:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 140, 0, 0.35);
        }
        .btn-order:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-cancel {
            padding: 14px 18px;
            border: 1px solid rgba(255, 70, 70, 0.2);
            border-radius: 14px;
            background: rgba(255, 70, 70, 0.06);
            color: #ff6b6b;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .btn-cancel:hover:not(:disabled) {
            background: rgba(255, 70, 70, 0.12);
        }
        .btn-cancel:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .message {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            text-align: center;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.15);
            display: block;
        }
        .message.success {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.15);
            display: block;
        }
        .message.info {
            background: rgba(96, 165, 250, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.15);
            display: block;
        }
        .message.warning {
            background: rgba(255, 180, 0, 0.1);
            color: #ffb000;
            border: 1px solid rgba(255, 180, 0, 0.15);
            display: block;
        }

        .debug-panel {
            margin-top: 12px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            font-size: 11px;
            color: #667788;
            font-family: monospace;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .debug-panel.active {
            display: block;
        }
        .debug-panel .log-item {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .debug-panel .log-item.error {
            color: #ff6b6b;
        }
        .debug-panel .log-item.success {
            color: #4ade80;
        }
        .debug-panel .log-item.warning {
            color: #ffb000;
        }

        .note {
            font-size: 11px;
            color: #667788;
            text-align: center;
            margin-top: 10px;
            line-height: 1.5;
        }
        .note span {
            color: #ff6b6b;
        }

        @media (max-width: 480px) {
            #map {
                height: 200px;
            }
            .header-title {
                font-size: 16px;
            }
            .balance-display {
                font-size: 12px;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <div class="header-left">
                <button class="back-btn" id="backBtn">← Назад</button>
                <span class="header-title">🚖 <span>Заказ</span></span>
            </div>
            <span class="balance-display" id="balanceDisplay">💰 0 ₪</span>
        </div>

        <div id="map"></div>

        <div class="form-section">

            <div class="form-row">
                <span class="icon">📍</span>
                <div class="autocomplete-wrapper">
                    <input type="text" id="pickupInput" placeholder="Откуда (адрес)" autocomplete="off">
                </div>
                <button class="geo-btn" id="geoBtn">📍 Определить</button>
            </div>

            <div class="form-row">
                <span class="icon">🏁</span>
                <div class="autocomplete-wrapper">
                    <input type="text" id="destinationInput" placeholder="Куда (адрес)" autocomplete="off">
                </div>
            </div>

            <div class="info-panel">
                <div class="info-item">
                    <div class="label">💵 Стоимость</div>
                    <div class="value gold" id="priceDisplay">—</div>
                </div>
                <div class="info-item">
                    <div class="label">📏 Расстояние</div>
                    <div class="value blue" id="distanceDisplay">—</div>
                </div>
                <div class="info-item">
                    <div class="label">⏱️ Время</div>
                    <div class="value green" id="durationDisplay">—</div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-order" id="orderBtn">🚖 Заказать такси</button>
                <button class="btn-cancel" id="cancelBtn" disabled>✖</button>
            </div>

            <div class="message" id="message"></div>

            <button id="debugToggleBtn" style="margin-top:8px; background:none; border:none; color:#667788; font-size:11px; cursor:pointer; font-family:inherit;">🔍 Показать лог</button>

            <div class="debug-panel" id="debugPanel">
                <div id="debugLog"></div>
            </div>

            <div class="note">
                ⚠️ Отмена после подтверждения водителя — <span>штраф 7 ₪</span>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        // FIREBASE КОНФИГ
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // ДЕБАГ ЛОГГЕР
        // ============================================================
        const debugLog = document.getElementById('debugLog');
        const debugPanel = document.getElementById('debugPanel');
        let debugVisible = false;

        function logDebug(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const item = document.createElement('div');
            item.className = 'log-item ' + type;
            item.textContent = `[${time}] ${message}`;
            debugLog.appendChild(item);
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        document.getElementById('debugToggleBtn').addEventListener('click', function() {
            debugVisible = !debugVisible;
            debugPanel.classList.toggle('active');
            this.textContent = debugVisible ? '🔍 Скрыть лог' : '🔍 Показать лог';
        });

        // ============================================================
        // ПЕРЕМЕННЫЕ
        // ============================================================
        let map;
        let pickupMarker = null;
        let destinationMarker = null;
        let pickupLocation = null;
        let destinationLocation = null;
        let currentOrderId = null;
        let balance = 0;
        let currentUser = null;
        let unsubOrder = null;
        let isProcessing = false;

        const TARIFF = {
            BASE_FEE: 12.00,
            PRICE_PER_KM: 3.70,
            NIGHT_SURCHARGE: 1.25,
            NIGHT_START_HOUR: 23,
            NIGHT_END_HOUR: 5,
            PENALTY_CANCEL: 7.00,
            COMMISSION: 0.10
        };

        // ============================================================
        // ЭЛЕМЕНТЫ
        // ============================================================
        const el = {
            map: document.getElementById('map'),
            pickupInput: document.getElementById('pickupInput'),
            destinationInput: document.getElementById('destinationInput'),
            geoBtn: document.getElementById('geoBtn'),
            orderBtn: document.getElementById('orderBtn'),
            cancelBtn: document.getElementById('cancelBtn'),
            balanceDisplay: document.getElementById('balanceDisplay'),
            priceDisplay: document.getElementById('priceDisplay'),
            distanceDisplay: document.getElementById('distanceDisplay'),
            durationDisplay: document.getElementById('durationDisplay'),
            message: document.getElementById('message'),
            backBtn: document.getElementById('backBtn')
        };

        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================
        function showMessage(text, type = 'info') {
            el.message.className = 'message ' + type;
            el.message.textContent = text;
            el.message.style.display = 'block';
            clearTimeout(el.message._timeout);
            el.message._timeout = setTimeout(() => {
                el.message.style.display = 'none';
            }, 5000);
        }

        function formatPrice(price) {
            return price.toFixed(2) + ' ₪';
        }

        function formatDistance(km) {
            if (!km || km < 0) return '—';
            if (km < 1) return (km * 1000).toFixed(0) + ' м';
            return km.toFixed(1) + ' км';
        }

        function formatDuration(min) {
            if (!min || min < 0) return '—';
            if (min < 1) return '< 1 мин';
            if (min < 60) return Math.round(min) + ' мин';
            const h = Math.floor(min / 60);
            const m = Math.round(min % 60);
            return h + ' ч ' + m + ' мин';
        }

        function isNight() {
            const now = new Date();
            const hour = now.getHours();
            return (hour >= TARIFF.NIGHT_START_HOUR || hour < TARIFF.NIGHT_END_HOUR);
        }

        function calculatePrice(distanceKm) {
            let price = TARIFF.BASE_FEE + (distanceKm * TARIFF.PRICE_PER_KM);
            if (isNight()) {
                price = price * TARIFF.NIGHT_SURCHARGE;
            }
            return price;
        }

        function haversineDistance(lat1, lng1, lat2, lng2) {
            if (!lat1 || !lng1 || !lat2 || !lng2) return 0;
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        async function geocodeAddress(address) {
            if (!address || address.trim() === '') return null;
            try {
                logDebug(`Геокодинг адреса: "${address}"`, 'info');
                const url =
                    `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&limit=1&addressdetails=1&countrycodes=il`;
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.length > 0) {
                    logDebug(`Найдены координаты: ${data[0].lat}, ${data[0].lon}`, 'success');
                    return {
                        lat: parseFloat(data[0].lat),
                        lng: parseFloat(data[0].lon),
                        displayName: data[0].display_name
                    };
                }
                logDebug(`Адрес не найден: "${address}"`, 'warning');
                return null;
            } catch (error) {
                logDebug(`Ошибка геокодинга: ${error.message}`, 'error');
                return null;
            }
        }

        function reverseGeocode(lat, lng, callback) {
            const url =
                `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&addressdetails=1`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    callback(data && data.display_name ? data.display_name : null);
                })
                .catch(() => callback(null));
        }

        // ============================================================
        // КАРТА
        // ============================================================
        function initMap() {
            logDebug('Инициализация карты...', 'info');
            map = L.map('map').setView([32.0853, 34.7818], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19
            }).addTo(map);

            map.on('click', function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;

                if (!pickupLocation) {
                    setPickupLocation(lat, lng);
                    showMessage('📍 Точка отправления установлена', 'success');
                    return;
                }

                if (pickupLocation && !destinationLocation) {
                    setDestinationLocation(lat, lng);
                    showMessage('📍 Точка назначения установлена', 'success');
                    return;
                }

                if (pickupLocation && destinationLocation) {
                    setDestinationLocation(lat, lng);
                    showMessage('📍 Точка назначения обновлена', 'success');
                }
            });

            logDebug('Карта инициализирована ✅', 'success');
        }

        function setPickupLocation(lat, lng) {
            pickupLocation = { lat, lng };
            if (pickupMarker) {
                map.removeLayer(pickupMarker);
            }
            const greenIcon = L.divIcon({
                html: '🟢',
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 30]
            });
            pickupMarker = L.marker([lat, lng], { icon: greenIcon })
                .addTo(map)
                .bindPopup('📍 Отправление');

            reverseGeocode(lat, lng, function(address) {
                if (address) {
                    el.pickupInput.value = address;
                } else {
                    el.pickupInput.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                }
            });

            map.setView([lat, lng], 15);
            calculateAndUpdate();
            logDebug(`Точка отправления: ${lat}, ${lng}`, 'success');
        }

        function setDestinationLocation(lat, lng) {
            destinationLocation = { lat, lng };
            if (destinationMarker) {
                map.removeLayer(destinationMarker);
            }
            const redIcon = L.divIcon({
                html: '🔴',
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 30]
            });
            destinationMarker = L.marker([lat, lng], { icon: redIcon })
                .addTo(map)
                .bindPopup('🏁 Назначение');

            reverseGeocode(lat, lng, function(address) {
                if (address) {
                    el.destinationInput.value = address;
                } else {
                    el.destinationInput.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                }
            });

            if (pickupLocation && destinationLocation) {
                const bounds = L.latLngBounds(
                    [pickupLocation.lat, pickupLocation.lng],
                    [destinationLocation.lat, destinationLocation.lng]
                );
                map.fitBounds(bounds, { padding: [40, 40] });
            }

            calculateAndUpdate();
            logDebug(`Точка назначения: ${lat}, ${lng}`, 'success');
        }

        function calculateAndUpdate() {
            if (!pickupLocation || !destinationLocation) {
                el.priceDisplay.textContent = '—';
                el.distanceDisplay.textContent = '—';
                el.durationDisplay.textContent = '—';
                return;
            }

            const dist = haversineDistance(
                pickupLocation.lat, pickupLocation.lng,
                destinationLocation.lat, destinationLocation.lng
            );

            if (dist < 0.01) {
                el.priceDisplay.textContent = '—';
                el.distanceDisplay.textContent = '—';
                el.durationDisplay.textContent = '—';
                return;
            }

            const duration = dist * 3;
            const price = calculatePrice(dist);
            el.priceDisplay.textContent = formatPrice(price);
            el.distanceDisplay.textContent = formatDistance(dist);
            el.durationDisplay.textContent = formatDuration(duration);
            logDebug(`Расчёт: ${dist.toFixed(2)} км, ${formatPrice(price)}`, 'info');
        }

        // ============================================================
        // ГЕОЛОКАЦИЯ
        // ============================================================
        function getCurrentLocation() {
            logDebug('Запрос геолокации...', 'info');
            el.geoBtn.textContent = '⏳ ...';
            el.geoBtn.classList.add('loading');
            el.geoBtn.disabled = true;

            if (!navigator.geolocation) {
                showMessage('❌ Геолокация не поддерживается', 'error');
                logDebug('Геолокация не поддерживается браузером', 'error');
                el.geoBtn.textContent = '📍 Определить';
                el.geoBtn.classList.remove('loading');
                el.geoBtn.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    logDebug(`Геолокация получена: ${lat}, ${lng}`, 'success');
                    setPickupLocation(lat, lng);
                    el.geoBtn.textContent = '✅ Определено';
                    el.geoBtn.classList.remove('loading');
                    el.geoBtn.disabled = false;
                    showMessage('📍 Геолокация определена', 'success');
                },
                function(error) {
                    logDebug(`Ошибка геолокации: ${error.message}`, 'error');
                    showMessage('❌ Не удалось определить местоположение', 'error');
                    el.geoBtn.textContent = '📍 Определить';
                    el.geoBtn.classList.remove('loading');
                    el.geoBtn.disabled = false;
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // ============================================================
        // СОЗДАНИЕ ЗАКАЗА (С ПОДРОБНЫМ ЛОГИРОВАНИЕМ)
        // ============================================================
        async function createOrder() {
            logDebug('=== НАЧАЛО СОЗДАНИЯ ЗАКАЗА ===', 'info');

            if (isProcessing) {
                logDebug('Уже идёт обработка, игнорируем', 'warning');
                return;
            }

            const pickupAddress = el.pickupInput.value.trim();
            const destinationAddress = el.destinationInput.value.trim();

            logDebug(`Адрес отправления: "${pickupAddress}"`, 'info');
            logDebug(`Адрес назначения: "${destinationAddress}"`, 'info');

            if (!pickupAddress) {
                showMessage('Введите адрес отправления', 'error');
                logDebug('Ошибка: пустой адрес отправления', 'error');
                el.pickupInput.focus();
                return;
            }

            if (!destinationAddress) {
                showMessage('Введите адрес назначения', 'error');
                logDebug('Ошибка: пустой адрес назначения', 'error');
                el.destinationInput.focus();
                return;
            }

            // Проверяем пользователя
            const user = auth.currentUser;
            if (!user) {
                showMessage('❌ Пожалуйста, войдите в аккаунт', 'error');
                logDebug('Ошибка: пользователь не авторизован', 'error');
                return;
            }
            logDebug(`Пользователь: ${user.uid} (${user.displayName || 'без имени'})`, 'success');

            // Проверяем геолокацию отправления
            if (!pickupLocation) {
                logDebug('Нет геолокации отправления, пытаемся геокодировать...', 'warning');
                const geoResult = await geocodeAddress(pickupAddress);
                if (geoResult) {
                    setPickupLocation(geoResult.lat, geoResult.lng);
                    logDebug('Геолокация отправления получена через геокодинг', 'success');
                } else {
                    showMessage('⚠️ Не удалось определить координаты отправления', 'warning');
                    logDebug('Не удалось определить координаты отправления', 'error');
                }
            }

            // Проверяем геолокацию назначения
            if (!destinationLocation) {
                logDebug('Нет геолокации назначения, пытаемся геокодировать...', 'warning');
                const geoResult = await geocodeAddress(destinationAddress);
                if (geoResult) {
                    setDestinationLocation(geoResult.lat, geoResult.lng);
                    logDebug('Геолокация назначения получена через геокодинг', 'success');
                } else {
                    showMessage('⚠️ Не удалось определить координаты назначения', 'warning');
                    logDebug('Не удалось определить координаты назначения', 'error');
                }
            }

            // Рассчитываем расстояние и цену
            let distance = 0;
            let price = 0;

            if (pickupLocation && destinationLocation) {
                distance = haversineDistance(
                    pickupLocation.lat, pickupLocation.lng,
                    destinationLocation.lat, destinationLocation.lng
                );
                price = calculatePrice(distance);
                logDebug(`Расстояние: ${distance.toFixed(2)} км, цена: ${formatPrice(price)}`, 'info');
            } else {
                // Если нет координат, используем базовую цену
                price = TARIFF.BASE_FEE;
                logDebug(`Нет координат, используем базовую цену: ${formatPrice(price)}`, 'warning');
            }

            // Проверяем баланс
            logDebug(`Баланс: ${formatPrice(balance)}, нужно: ${formatPrice(price)}`, 'info');

            if (balance < price) {
                showMessage(`❌ Недостаточно средств. Нужно: ${formatPrice(price)}, у вас: ${formatPrice(balance)}`,
                    'error');
                logDebug(`Ошибка: недостаточно средств (${formatPrice(balance)} < ${formatPrice(price)})`, 'error');
                return;
            }

            // === СОЗДАЁМ ЗАКАЗ ===
            isProcessing = true;
            el.orderBtn.disabled = true;
            el.orderBtn.textContent = '⏳ Создание...';

            try {
                const orderData = {
                    clientId: user.uid,
                    clientName: user.displayName || 'Клиент',
                    status: 'new',
                    pickup: {
                        address: pickupAddress,
                        lat: pickupLocation ? pickupLocation.lat : null,
                        lng: pickupLocation ? pickupLocation.lng : null
                    },
                    destination: {
                        address: destinationAddress,
                        lat: destinationLocation ? destinationLocation.lat : null,
                        lng: destinationLocation ? destinationLocation.lng : null
                    },
                    price: price,
                    commission: price * TARIFF.COMMISSION,
                    driverEarn: price * (1 - TARIFF.COMMISSION),
                    distance: distance,
                    estimatedDuration: distance * 3,
                    isNight: isNight(),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    assignedManually: false,
                    dispatchHistory: [],
                    penaltyApplied: 0
                };

                logDebug('Отправка данных в Firebase:', 'info');
                logDebug(JSON.stringify(orderData, null, 2), 'info');

                const orderRef = await db.collection('orders').add(orderData);
                currentOrderId = orderRef.id;

                logDebug(`✅ ЗАКАЗ СОЗДАН! ID: ${currentOrderId}`, 'success');
                showMessage(`✅ Заказ создан! ID: ${currentOrderId.substring(0, 8)}`, 'success');

                el.orderBtn.textContent = '✅ Заказ создан';
                el.orderBtn.disabled = true;
                el.cancelBtn.disabled = false;

                // Подписываемся на обновления
                subscribeToOrder(currentOrderId);

            } catch (error) {
                logDebug(`❌ ОШИБКА СОЗДАНИЯ ЗАКАЗА: ${error.message}`, 'error');
                logDebug(`Код ошибки: ${error.code}`, 'error');
                showMessage(`❌ Ошибка: ${error.message}`, 'error');
                el.orderBtn.disabled = false;
                el.orderBtn.textContent = '🚖 Заказать такси';
            } finally {
                isProcessing = false;
                logDebug('=== КОНЕЦ СОЗДАНИЯ ЗАКАЗА ===', 'info');
            }
        }

        // ============================================================
        // ПОДПИСКА НА ЗАКАЗ
        // ============================================================
        function subscribeToOrder(orderId) {
            if (unsubOrder) {
                unsubOrder();
                unsubOrder = null;
            }

            logDebug(`Подписка на заказ ${orderId}...`, 'info');

            const orderRef = db.collection('orders').doc(orderId);
            unsubOrder = orderRef.onSnapshot(function(doc) {
                if (!doc.exists) {
                    logDebug('Заказ удалён', 'warning');
                    return;
                }

                const data = doc.data();
                logDebug(`Статус заказа: ${data.status}`, 'info');

                switch (data.status) {
                    case 'new':
                    case 'searching':
                        el.cancelBtn.disabled = false;
                        break;
                    case 'assigned':
                        showMessage('✅ Водитель назначен! Ожидайте.', 'success');
                        logDebug('Водитель назначен', 'success');
                        break;
                    case 'in_progress':
                        showMessage('🚗 Поездка началась!', 'info');
                        el.cancelBtn.disabled = true;
                        break;
                    case 'completed':
                        showMessage('🎉 Поездка завершена!', 'success');
                        el.cancelBtn.disabled = true;
                        el.orderBtn.disabled = true;
                        if (unsubOrder) { unsubOrder();
                            unsubOrder = null; }
                        break;
                    case 'cancelled':
                        showMessage('❌ Заказ отменён', 'warning');
                        el.cancelBtn.disabled = true;
                        el.orderBtn.disabled = false;
                        el.orderBtn.textContent = '🚖 Заказать снова';
                        if (unsubOrder) { unsubOrder();
                            unsubOrder = null; }
                        break;
                }
            }, function(error) {
                logDebug(`Ошибка подписки: ${error.message}`, 'error');
            });
        }

        // ============================================================
        // ОТМЕНА ЗАКАЗА
        // ============================================================
        function cancelOrder() {
            if (!currentOrderId) {
                showMessage('❌ Нет активного заказа', 'error');
                return;
            }

            if (!confirm('❌ Вы уверены, что хотите отменить заказ?')) return;

            logDebug(`Отмена заказа ${currentOrderId}...`, 'info');
            el.cancelBtn.disabled = true;
            el.cancelBtn.textContent = '⏳';

            const orderRef = db.collection('orders').doc(currentOrderId);

            orderRef.get().then(function(doc) {
                if (!doc.exists) {
                    showMessage('❌ Заказ не найден', 'error');
                    el.cancelBtn.disabled = false;
                    el.cancelBtn.textContent = '✖';
                    return;
                }

                const data = doc.data();
                let penalty = 0;

                if (data.status === 'assigned' || data.status === 'in_progress') {
                    penalty = TARIFF.PENALTY_CANCEL;
                }

                return orderRef.update({
                    status: 'cancelled',
                    cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
                    penaltyApplied: penalty,
                    cancellationReason: 'Отменено клиентом',
                    cancelledBy: 'client'
                }).then(function() {
                    if (penalty > 0) {
                        const user = auth.currentUser;
                        if (user) {
                            db.collection('users').doc(user.uid).update({
                                balance: firebase.firestore.FieldValue.increment(-penalty),
                                penalty: firebase.firestore.FieldValue.increment(penalty)
                            }).then(function() {
                                logDebug(`Штраф ${formatPrice(penalty)} списан`, 'warning');
                                updateBalance();
                            }).catch(function(err) {
                                logDebug(`Ошибка списания штрафа: ${err.message}`, 'error');
                            });
                        }
                    }
                    showMessage('✅ Заказ отменён', 'info');
                    logDebug('Заказ отменён', 'success');
                    el.cancelBtn.disabled = true;
                    el.cancelBtn.textContent = '❌';
                    el.orderBtn.disabled = false;
                    el.orderBtn.textContent = '🚖 Заказать снова';
                });
            }).catch(function(error) {
                logDebug(`Ошибка отмены: ${error.message}`, 'error');
                showMessage('❌ Ошибка: ' + error.message, 'error');
                el.cancelBtn.disabled = false;
                el.cancelBtn.textContent = '✖';
            });
        }

        // ============================================================
        // ОБНОВЛЕНИЕ БАЛАНСА
        // ============================================================
        function updateBalance() {
            const user = auth.currentUser;
            if (!user) return;

            db.collection('users').doc(user.uid).get()
                .then(function(doc) {
                    if (doc.exists) {
                        balance = doc.data().balance || 0;
                        el.balanceDisplay.textContent = '💰 ' + formatPrice(balance);
                        logDebug(`Баланс обновлён: ${formatPrice(balance)}`, 'info');
                    }
                })
                .catch(function(err) {
                    logDebug(`Ошибка загрузки баланса: ${err.message}`, 'error');
                });
        }

        // ============================================================
        // ОБРАБОТЧИКИ
        // ============================================================
        el.backBtn.addEventListener('click', function() {
            if (unsubOrder) { unsubOrder();
                unsubOrder = null; }
            window.location.href = 'cabinet.html';
        });

        el.geoBtn.addEventListener('click', getCurrentLocation);

        el.pickupInput.addEventListener('blur', function() {
            const address = this.value.trim();
            if (address && !pickupLocation) {
                geocodeAddress(address).then(function(result) {
                    if (result) {
                        setPickupLocation(result.lat, result.lng);
                    }
                });
            }
        });

        el.destinationInput.addEventListener('blur', function() {
            const address = this.value.trim();
            if (address && !destinationLocation) {
                geocodeAddress(address).then(function(result) {
                    if (result) {
                        setDestinationLocation(result.lat, result.lng);
                    }
                });
            }
        });

        el.orderBtn.addEventListener('click', createOrder);
        el.cancelBtn.addEventListener('click', cancelOrder);

        // ============================================================
        // АВТОРИЗАЦИЯ
        // ============================================================
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            logDebug(`Пользователь авторизован: ${user.uid}`, 'success');
            updateBalance();

            initMap();

            // Автоматическая геолокация через 1 секунду
            setTimeout(function() {
                logDebug('Автоматическое определение геолокации...', 'info');
                getCurrentLocation();
            }, 1000);
        });

        // ============================================================
        // ПРОВЕРКА ПРАВИЛ FIRESTORE
        // ============================================================
        // Проверяем, можем ли мы писать в Firestore
        setTimeout(function() {
            if (currentUser) {
                logDebug('Проверка доступа к Firestore...', 'info');
                db.collection('orders').limit(1).get()
                    .then(function() {
                        logDebug('✅ Доступ к Firestore есть', 'success');
                    })
                    .catch(function(err) {
                        logDebug(`❌ Ошибка доступа к Firestore: ${err.message}`, 'error');
                        logDebug('Проверьте правила безопасности Firestore', 'error');
                    });
            }
        }, 3000);

        console.log('✅ Страница заказа загружена');
        console.log('📌 Для отладки открыт панель логов');
        console.log('📌 Если заказ не создаётся — смотрите лог');
    </script>

</body>
