<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Заказ такси — WHEEL</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', 'Inter', sans-serif;
            background: #0a0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.05) 0%, transparent 45%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 48px;
            padding: 32px 24px 36px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #ffb000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8899aa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .emoji-big {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 24px;
        }

        .info-box .label {
            font-size: 12px;
            color: #8899aa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-box .value {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            margin-top: 4px;
        }

        .btn-back {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 8px 24px rgba(255, 140, 0, 0.2);
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 140, 0, 0.35);
        }

        .btn-back:active {
            transform: scale(0.97);
        }

        .btn-back.secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #8899aa;
            box-shadow: none;
            margin-top: 10px;
        }

        .btn-back.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            box-shadow: none;
            transform: translateY(-2px);
        }

        .home-indicator {
            margin-top: 20px;
            width: 120px;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            margin-left: auto;
            margin-right: auto;
        }

        @media (max-width: 420px) {
            .container {
                border-radius: 0;
                padding: 24px 18px;
                min-height: 100vh;
                background: rgba(10, 12, 16, 0.96);
                border: none;
                backdrop-filter: blur(20px);
            }
            h1 {
                font-size: 24px;
            }
            .emoji-big {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="emoji-big">📍</div>
        <h1>Заказ такси</h1>
        <p class="subtitle">Страница заказа в разработке</p>

        <div class="info-box">
            <div class="label">Ваш статус</div>
            <div class="value">🟢 Активен</div>
        </div>

        <div class="info-box">
            <div class="label">Ближайший водитель</div>
            <div class="value">🚖 Поиск...</div>
        </div>

        <button class="btn-back" onclick="window.location.href='cabinet.html'">
            🔄 Обновить
        </button>

        <button class="btn-back secondary" onclick="window.location.href='cabinet.html'">
            ← Вернуться в кабинет
        </button>

        <div class="home-indicator"></div>
    </div>

</body>
</html>
