    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0c10;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 12px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.05) 0%, transparent 45%);
            background-attachment: fixed;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            border-radius: 30px;
            padding: 6px 14px;
            color: #8899aa;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }
        .header-title span {
            color: #ffb000;
        }

        .balance-display {
            background: rgba(255, 180, 0, 0.08);
            border: 1px solid rgba(255, 180, 0, 0.12);
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 14px;
            font-weight: 700;
            color: #ffb000;
        }

        /* ===== MAP ===== */
        #map {
            height: 250px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
            background: #11151a;
        }

        .leaflet-control-attribution {
            font-size: 8px !important;
            color: #667788 !important;
        }

        /* ===== FORM ===== */
        .form-section {
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .form-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }

        .form-row .icon {
            font-size: 18px;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }

        .autocomplete-wrapper {
            position: relative;
            flex: 1;
        }

        .autocomplete-wrapper input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }
        .autocomplete-wrapper input:focus {
            border-color: #ffb000;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(255, 180, 0, 0.06);
        }
        .autocomplete-wrapper input::placeholder {
            color: #556677;
        }
        .autocomplete-wrapper input.selected {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.05);
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1e26;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            margin-top: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .autocomplete-list .item {
            padding: 10px 14px;
            cursor: pointer;
            color: #e0e8f0;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s ease;
        }
        .autocomplete-list .item:hover {
            background: rgba(255, 180, 0, 0.08);
        }
        .autocomplete-list .item:last-child {
            border-bottom: none;
        }
        .autocomplete-list .item .highlight {
            color: #ffb000;
            font-weight: 600;
        }
        .autocomplete-list .item .sub {
            color: #667788;
            font-size: 11px;
            display: block;
        }
        .autocomplete-list::-webkit-scrollbar {
            width: 3px;
        }
        .autocomplete-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .autocomplete-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .geo-btn {
            background: rgba(255, 180, 0, 0.08);
            border: 1px solid rgba(255, 180, 0, 0.12);
            border-radius: 12px;
            padding: 8px 14px;
            color: #ffb000;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 80px;
        }
        .geo-btn:hover {
            background: rgba(255, 180, 0, 0.15);
        }
        .geo-btn:active {
            transform: scale(0.95);
        }
        .geo-btn.loading {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .geo-btn.success {
            border-color: rgba(74, 222, 128, 0.3);
            color: #4ade80;
        }

        /* ===== INFO PANEL ===== */
        .info-panel {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .info-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .info-item .label {
            font-size: 9px;
            color: #667788;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-item .value {
            font-size: 16px;
            font-weight: 700;
            margin-top: 2px;
        }
        .info-item .value.gold {
            color: #ffb000;
        }
        .info-item .value.green {
            color: #4ade80;
        }
        .info-item .value.blue {
            color: #60a5fa;
        }
        .info-item .value.pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-order {
            flex: 1;
            padding: 14px;

            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 4px 20px rgba(255, 140, 0, 0.2);
        }
        .btn-order:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 140, 0, 0.35);
        }
        .btn-order:active:not(:disabled) {
            transform: scale(0.97);
        }
        .btn-order:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-order.loading {
            background: linear-gradient(135deg, #667788, #445566);
            box-shadow: none;
        }

        .btn-cancel {
            padding: 14px 18px;
            border: 1px solid rgba(255, 70, 70, 0.2);
            border-radius: 14px;
            background: rgba(255, 70, 70, 0.06);
            color: #ff6b6b;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            min-width: 60px;
        }
        .btn-cancel:hover:not(:disabled) {
            background: rgba(255, 70, 70, 0.12);
            border-color: rgba(255, 70, 70, 0.3);
        }
        .btn-cancel:active:not(:disabled) {
            transform: scale(0.95);
        }
        .btn-cancel:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== MESSAGES ===== */
        .message {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            text-align: center;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.15);
            display: block;
        }
        .message.success {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.15);
            display: block;
        }
        .message.info {
            background: rgba(96, 165, 250, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.15);
            display: block;
        }
        .message.warning {
            background: rgba(255, 180, 0, 0.1);
            color: #ffb000;
            border: 1px solid rgba(255, 180, 0, 0.15);
            display: block;
        }

        /* ===== ORDER STATUS ===== */
        .order-status {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: none;
            text-align: center;
        }
        .order-status.active {
            display: block;
        }
        .order-status .status-text {
            font-size: 16px;
            font-weight: 600;
            color: #e0e8f0;
        }
        .order-status .status-detail {
            font-size: 13px;
            color: #8899aa;
            margin-top: 4px;
        }

        .note {
            font-size: 11px;
            color: #667788;
            text-align: center;
            margin-top: 10px;
            line-height: 1.5;
        }
        .note span {
            color: #ff6b6b;
        }
        .note .gold {
            color: #ffb000;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            #map {
                height: 200px;
            }
            .header {
                padding: 10px 12px;
            }
            .header-title {
                font-size: 16px;
            }
            .balance-display {
                font-size: 12px;
                padding: 3px 10px;
            }
            .form-section {
                padding: 12px;
            }
            .info-panel {
                gap: 4px;
            }
            .info-item {
                padding: 6px 4px;
            }
            .info-item .value {
                font-size: 14px;
            }
            .btn-order {
                font-size: 14px;
                padding: 12px;
            }
            .btn-cancel {
                font-size: 13px;
                padding: 12px 14px;
            }
            .autocomplete-wrapper input {
                font-size: 13px;
                padding: 8px 12px;
            }
            .geo-btn {
                font-size: 11px;
                padding: 6px 10px;
                min-width: 60px;
            }
        }
    </style>
</head>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        console.log('🔥 WHEEL — Заказ такси');

        // ============================================================
        // STATE
        // ============================================================
        let map;
        let pickupMarker = null;
        let destinationMarker = null;
        let pickupLocation = null;
        let destinationLocation = null;
        let currentOrderId = null;
        let balance = 0;
        let currentUser = null;
        let unsubOrder = null;
        let isProcessing = false;
        let pickupSelected = false;
        let destinationSelected = false;

        const TARIFF = {
            BASE_FEE: 12.00,
            PRICE_PER_KM: 3.70,
            NIGHT_SURCHARGE: 1.25,
            NIGHT_START_HOUR: 23,
            NIGHT_END_HOUR: 5,
            PENALTY_CANCEL: 7.00,
            COMMISSION: 0.10
        };

        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        const el = {
            map: $('map'),
            pickupInput: $('pickupInput'),
            destinationInput: $('destinationInput'),
            pickupAutocomplete: $('pickupAutocomplete'),
            destinationAutocomplete: $('destinationAutocomplete'),
            geoBtn: $('geoBtn'),
            orderBtn: $('orderBtn'),
            cancelBtn: $('cancelBtn'),
            balanceDisplay: $('balanceDisplay'),
            priceDisplay: $('priceDisplay'),
            distanceDisplay: $('distanceDisplay'),
            durationDisplay: $('durationDisplay'),
            message: $('message'),
            orderStatus: $('orderStatus'),
            statusText: $('statusText'),
            statusDetail: $('statusDetail'),
            backBtn: $('backBtn')
        };

        // ============================================================
        // UTILITY
        // ============================================================
        function showMessage(text, type = 'info') {
            el.message.className = 'message ' + type;
            el.message.textContent = text;
            el.message.style.display = 'block';
            clearTimeout(el.message._timeout);
            el.message._timeout = setTimeout(() => {
                el.message.style.display = 'none';
            }, 5000);
        }

        function formatPrice(price) {
            return price.toFixed(2) + ' ₪';
        }

        function formatDistance(km) {
            if (!km || km < 0) return '—';
            if (km < 1) return (km * 1000).toFixed(0) + ' м';
            return km.toFixed(1) + ' км';
        }

        function formatDuration(min) {
            if (!min || min < 0) return '—';
            if (min < 1) return '< 1 мин';
            if (min < 60) return Math.round(min) + ' мин';
            const h = Math.floor(min / 60);
            const m = Math.round(min % 60);
            return h + ' ч ' + m + ' мин';
        }

        function isNight() {
            const now = new Date();
            const hour = now.getHours();
            return (hour >= TARIFF.NIGHT_START_HOUR || hour < TARIFF.NIGHT_END_HOUR);
        }

        function calculatePrice(distanceKm) {
            let price = TARIFF.BASE_FEE + (distanceKm * TARIFF.PRICE_PER_KM);
            if (isNight()) {
                price = price * TARIFF.NIGHT_SURCHARGE;
            }
            return price;
        }

        function haversineDistance(lat1, lng1, lat2, lng2) {
            if (!lat1 || !lng1 || !lat2 || !lng2) return 0;
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) ** 2;
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // ============================================================
        // GEOCODING (адрес → координаты)
        // ============================================================
        async function geocodeAddress(address) {
            if (!address || address.trim() === '') return null;
            try {
                const url =
                    `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&limit=1&addressdetails=1&countrycodes=il`;
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.length > 0) {
                    return {
                        lat: parseFloat(data[0].lat),
                        lng: parseFloat(data[0].lon),
                        displayName: data[0].display_name
                    };
                }
                return null;
            } catch (error) {
                console.error('Ошибка геокодинга:', error);
                return null;
            }
        }

        function reverseGeocode(lat, lng, callback) {
            const url =
                `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&addressdetails=1`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    callback(data && data.display_name ? data.display_name : null);
                })
                .catch(() => callback(null));
        }

        // ============================================================
        // AUTOCOMPLETE (подсказки адресов)
        // ============================================================
        let searchTimeout = null;

        function setupAutocomplete(input, listEl, onSelect) {
            input.addEventListener('input', function() {
                const query = this.value.trim();
                if (query.length < 2) {
                    listEl.style.display = 'none';
                    return;
                }

                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(async function() {
                    try {
                        const url =
                            `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5&addressdetails=1&countrycodes=il`;
                        const response = await fetch(url);
                        const data = await response.json();

                        if (data && data.length > 0) {
                            listEl.innerHTML = '';
                            data.forEach(function(item) {
                                const div = document.createElement('div');
                                div.className = 'item';
                                const displayName = item.display_name || item.name || 'Неизвестный адрес';
                                const highlighted = displayName.replace(
                                    new RegExp(query, 'gi'),
                                    match => `<span class="highlight">${match}</span>`
                                );
                                const sub = item.address?.city || item.address?.town || item.address?.village ||
                                    '';
                                div.innerHTML = `${highlighted} ${sub ? `<span class="sub">${sub}</span>` : ''}`;
                                div.addEventListener('click', function() {
                                    const fullAddress = item.display_name || item.name || displayName;
                                    input.value = fullAddress;
                                    listEl.style.display = 'none';
                                    input.classList.add('selected');

                                    if (onSelect) {
                                        onSelect({
                                            lat: parseFloat(item.lat),
                                            lng: parseFloat(item.lon),
                                            displayName: fullAddress
                                        });
                                    }
                                });
                                listEl.appendChild(div);
                            });
                            listEl.style.display = 'block';
                        } else {
                            listEl.style.display = 'none';
                        }
                    } catch (error) {
                        console.error('Ошибка автодополнения:', error);
                        listEl.style.display = 'none';
                    }
                }, 400);
            });

            document.addEventListener('click', function(e) {
                if (!input.contains(e.target) && !listEl.contains(e.target)) {
                    listEl.style.display = 'none';
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    listEl.style.display = 'none';
                }
                if (e.key === 'Enter') {
                    listEl.style.display = 'none';
                    input.blur();
                }
            });
        }

        // ============================================================
        // MAP
        // ============================================================
        function initMap() {
            map = L.map('map', {
                zoomControl: true,
                attributionControl: true
            }).setView([32.0853, 34.7818], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19,
                minZoom: 10
            }).addTo(map);

            // Клик по карте для установки точки
            map.on('click', function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;

                if (!pickupLocation || (pickupLocation && destinationLocation)) {
                    // Если нет отправления или есть обе точки — устанавливаем отправление
                    setPickupLocation(lat, lng);
                    showMessage('📍 Точка отправления установлена', 'success');
                } else if (pickupLocation && !destinationLocation) {
                    // Есть отправление, нет назначения
                    setDestinationLocation(lat, lng);
                    showMessage('📍 Точка назначения установлена', 'success');
                }
            });

            console.log('🗺️ Карта готова');
        }

        // ============================================================
        // MARKERS
        // ============================================================
        function setPickupLocation(lat, lng) {
            pickupLocation = { lat, lng };
            pickupSelected = true;

            if (pickupMarker) {
                map.removeLayer(pickupMarker);
            }
            const greenIcon = L.divIcon({
                html: '🟢',
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 30]
            });
            pickupMarker = L.marker([lat, lng], { icon: greenIcon })
                .addTo(map)
                .bindPopup('📍 Отправление');

            reverseGeocode(lat, lng, function(address) {
                if (address) {
                    el.pickupInput.value = address;
                    el.pickupInput.classList.add('selected');
                } else {
                    el.pickupInput.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                }
            });

            map.setView([lat, lng], 15);
            calculateAndUpdate();
        }

        function setDestinationLocation(lat, lng) {
            destinationLocation = { lat, lng };
            destinationSelected = true;

            if (destinationMarker) {
                map.removeLayer(destinationMarker);
            }
            const redIcon = L.divIcon({
                html: '🔴',
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 30]
            });
            destinationMarker = L.marker([lat, lng], { icon: redIcon })
                .addTo(map)
                .bindPopup('🏁 Назначение');

            reverseGeocode(lat, lng, function(address) {
                if (address) {
                    el.destinationInput.value = address;
                    el.destinationInput.classList.add('selected');
                } else {
                    el.destinationInput.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                }
            });

            if (pickupLocation && destinationLocation) {
                const bounds = L.latLngBounds(
                    [pickupLocation.lat, pickupLocation.lng],
                    [destinationLocation.lat, destinationLocation.lng]
                );
                map.fitBounds(bounds, { padding: [40, 40] });
            }

            calculateAndUpdate();
        }

        // ============================================================
        // HANDLE ADDRESS SELECT FROM AUTOCOMPLETE
        // ============================================================
        function handlePickupSelect(result) {
            setPickupLocation(result.lat, result.lng);
            showMessage(`📍 Отправление: ${result.displayName}`, 'success');
        }

        function handleDestinationSelect(result) {
            setDestinationLocation(result.lat, result.lng);
            showMessage(`🏁 Назначение: ${result.displayName}`, 'success');
        }

        // ============================================================
        // CALCULATE
        // ============================================================
        function calculateAndUpdate() {
            if (!pickupLocation || !destinationLocation) {
                el.priceDisplay.textContent = '—';
                el.distanceDisplay.textContent = '—';
                el.durationDisplay.textContent = '—';
                return;
            }

            const dist = haversineDistance(
                pickupLocation.lat, pickupLocation.lng,
                destinationLocation.lat, destinationLocation.lng
            );

            if (dist < 0.01) {
                el.priceDisplay.textContent = '—';
                el.distanceDisplay.textContent = '—';
                el.durationDisplay.textContent = '—';
                return;
            }

            const duration = dist * 3;
            const price = calculatePrice(dist);
            el.priceDisplay.textContent = formatPrice(price);
            el.distanceDisplay.textContent = formatDistance(dist);
            el.durationDisplay.textContent = formatDuration(duration);

            // Сохраняем данные для заказа
            window._orderData = { distance: dist, duration, price };
        }

        // ============================================================
        // GEOLOCATION
        // ============================================================
        function getCurrentLocation() {
            el.geoBtn.textContent = '⏳ ...';
            el.geoBtn.classList.add('loading');
            el.geoBtn.disabled = true;

            if (!navigator.geolocation) {
                showMessage('❌ Геолокация не поддерживается', 'error');
                el.geoBtn.textContent = '📍 Определить';
                el.geoBtn.classList.remove('loading');
                el.geoBtn.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    setPickupLocation(lat, lng);
                    el.geoBtn.textContent = '✅ Определено';
                    el.geoBtn.classList.add('success');
                    el.geoBtn.classList.remove('loading');
                    el.geoBtn.disabled = false;
                    showMessage('📍 Геолокация определена', 'success');
                },
                function(error) {
                    console.error('Ошибка геолокации:', error);
                    showMessage('❌ Не удалось определить местоположение', 'error');
                    el.geoBtn.textContent = '📍 Определить';
                    el.geoBtn.classList.remove('loading');
                    el.geoBtn.disabled = false;
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // ============================================================
        // CREATE ORDER
        // ============================================================
        async function createOrder() {
            if (isProcessing) return;

            const pickupAddress = el.pickupInput.value.trim();
            const destinationAddress = el.destinationInput.value.trim();

            // Проверяем, что адреса введены
            if (!pickupAddress) {
                showMessage('❌ Введите адрес отправления', 'error');
                el.pickupInput.focus();
                return;
            }

            if (!destinationAddress) {
                showMessage('❌ Введите адрес назначения', 'error');
                el.destinationInput.focus();
                return;
            }

            // Если нет координат отправления — пытаемся геокодировать
            if (!pickupLocation) {
                showMessage('⏳ Поиск координат отправления...', 'info');
                const geoResult = await geocodeAddress(pickupAddress);
                if (geoResult) {
                    setPickupLocation(geoResult.lat, geoResult.lng);
                    showMessage('📍 Координаты отправления найдены', 'success');
                } else {
                    showMessage('⚠️ Координаты отправления не найдены, сохраним адрес текстом', 'warning');
                }
            }

            // Если нет координат назначения — пытаемся геокодировать
            if (!destinationLocation) {
                showMessage('⏳ Поиск координат назначения...', 'info');
                const geoResult = await geocodeAddress(destinationAddress);
                if (geoResult) {
                    setDestinationLocation(geoResult.lat, geoResult.lng);
                    showMessage('📍 Координаты назначения найдены', 'success');
                } else {
                    showMessage('⚠️ Координаты назначения не найдены, сохраним адрес текстом', 'warning');
                }
            }

            // Получаем данные для заказа
            let distance = 0;
            let price = 0;

            if (pickupLocation && destinationLocation) {
                distance = haversineDistance(
                    pickupLocation.lat, pickupLocation.lng,
                    destinationLocation.lat, destinationLocation.lng
                );
                price = calculatePrice(distance);
            } else {
                // Если нет координат, используем базовую цену
                price = TARIFF.BASE_FEE;
                console.log('⚠️ Используем базовую цену (нет координат)');
            }

            // Проверяем баланс
            if (balance < price) {
                showMessage(`❌ Недостаточно средств. Нужно: ${formatPrice(price)}, у вас: ${formatPrice(balance)}`,
                    'error');
                return;
            }

            // СОЗДАЁМ ЗАКАЗ
            isProcessing = true;
            el.orderBtn.disabled = true;
            el.orderBtn.textContent = '⏳ Создание...';
            el.orderBtn.classList.add('loading');

            try {
                const user = auth.currentUser;
                if (!user) {
                    showMessage('❌ Пожалуйста, войдите в аккаунт', 'error');
                    isProcessing = false;
                    el.orderBtn.disabled = false;
                    el.orderBtn.textContent = '🚖 Заказать такси';
                    el.orderBtn.classList.remove('loading');
                    return;
                }

                const orderData = {
                    clientId: user.uid,
                    clientName: user.displayName || 'Клиент',
                    status: 'new',
                    pickup: {
                        address: pickupAddress,
                        lat: pickupLocation ? pickupLocation.lat : null,
                        lng: pickupLocation ? pickupLocation.lng : null
                    },
                    destination: {
                        address: destinationAddress,
                        lat: destinationLocation ? destinationLocation.lat : null,
                        lng: destinationLocation ? destinationLocation.lng : null
                    },
                    price: price,
                    commission: price * TARIFF.COMMISSION,
                    driverEarn: price * (1 - TARIFF.COMMISSION),
                    distance: distance,
                    estimatedDuration: distance * 3,
                    isNight: isNight(),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    assignedManually: false,
                    dispatchHistory: [],
                    penaltyApplied: 0
                };

                console.log('📦 Создание заказа:', orderData);

                const orderRef = await db.collection('orders').add(orderData);
                currentOrderId = orderRef.id;

                console.log(`✅ ЗАКАЗ СОЗДАН! ID: ${currentOrderId}`);
                showMessage(`✅ Заказ создан! ID: ${currentOrderId.substring(0, 8)}`, 'success');

                el.orderBtn.textContent = '✅ Заказ создан';
                el.orderBtn.disabled = true;
                el.cancelBtn.disabled = false;

                subscribeToOrder(currentOrderId);

            } catch (error) {
                console.error('❌ Ошибка создания заказа:', error);
                showMessage(`❌ Ошибка: ${error.message}`, 'error');
                el.orderBtn.disabled = false;
                el.orderBtn.textContent = '🚖 Заказать такси';
                el.orderBtn.classList.remove('loading');
            } finally {
                isProcessing = false;
            }
        }

        // ============================================================
        // SUBSCRIBE TO ORDER
        // ============================================================
        function subscribeToOrder(orderId) {
            if (unsubOrder) {
                unsubOrder();
                unsubOrder = null;
            }

            const orderRef = db.collection('orders').doc(orderId);
            unsubOrder = orderRef.onSnapshot(function(doc) {
                if (!doc.exists) {
                    el.orderStatus.classList.remove('active');
                    el.cancelBtn.disabled = true;
                    el.orderBtn.disabled = false;
                    el.orderBtn.textContent = '🚖 Заказать такси';
                    return;
                }

                const data = doc.data();
                console.log('🔄 Обновление заказа:', data.status);

                el.orderStatus.classList.add('active');

                switch (data.status) {
                    case 'new':
                    case 'searching':
                        el.statusText.textContent = '⏳ Поиск водителя...';
                        el.statusDetail.textContent = 'Ищем ближайшего водителя...';
                        el.cancelBtn.disabled = false;
                        break;

                    case 'assigned':
                        el.statusText.textContent = '✅ Водитель назначен!';
                        el.statusDetail.textContent = `🚗 Водитель едет к вам`;
                        el.cancelBtn.disabled = false;
                        showMessage('✅ Водитель назначен! Ожидайте.', 'success');
                        break;

                    case 'in_progress':
                        el.statusText.textContent = '🚗 Поездка началась!';
                        el.statusDetail.textContent = 'Водитель уже в пути';
                        el.cancelBtn.disabled = true;
                        showMessage('🚗 Поездка началась!', 'info');
                        break;

                    case 'completed':
                        el.statusText.textContent = '🎉 Поездка завершена!';
                        el.statusDetail.textContent = 'Спасибо за поездку!';
                        el.cancelBtn.disabled = true;
                        el.orderBtn.disabled = true;
                        showMessage('🎉 Поездка завершена!', 'success');
                        if (unsubOrder) { unsubOrder();
                            unsubOrder = null; }
                        break;

                    case 'cancelled':
                        const penalty = data.penaltyApplied || 0;
                        el.statusText.textContent = '❌ Заказ отменён';
                        el.statusDetail.textContent = penalty ?
                            `Штраф: ${formatPrice(penalty)}` :
                            'Без штрафа';
                        el.cancelBtn.disabled = true;
                        el.orderBtn.disabled = false;
                        el.orderBtn.textContent = '🚖 Заказать снова';
                        if (penalty) {
                            showMessage(`⚠️ Штраф ${formatPrice(penalty)} за отмену`, 'warning');
                        }
                        if (unsubOrder) { unsubOrder();
                            unsubOrder = null; }
                        break;
                }
            }, function(error) {
                console.error('❌ Ошибка подписки:', error);
            });
        }

        // ============================================================
        // CANCEL ORDER
        // ============================================================
        function cancelOrder() {
            if (!currentOrderId) {
                showMessage('❌ Нет активного заказа', 'error');
                return;
            }

            if (!confirm('❌ Вы уверены, что хотите отменить заказ?')) return;

            el.cancelBtn.disabled = true;
            el.cancelBtn.textContent = '⏳';

            const orderRef = db.collection('orders').doc(currentOrderId);

            orderRef.get().then(function(doc) {
                if (!doc.exists) {
                    showMessage('❌ Заказ не найден', 'error');
                    el.cancelBtn.disabled = false;
                    el.cancelBtn.textContent = '✖';
                    return;
                }

                const data = doc.data();
                let penalty = 0;

                if (data.status === 'assigned' || data.status === 'in_progress') {
                    penalty = TARIFF.PENALTY_CANCEL;
                }

                return orderRef.update({
                    status: 'cancelled',
                    cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
                    penaltyApplied: penalty,
                    cancellationReason: 'Отменено клиентом',
                    cancelledBy: 'client'
                }).then(function() {
                    if (penalty > 0) {
                        const user = auth.currentUser;
                        if (user) {
                            db.collection('users').doc(user.uid).update({
                                balance: firebase.firestore.FieldValue.increment(-penalty),
                                penalty: firebase.firestore.FieldValue.increment(penalty)
                            }).then(function() {
                                console.log('💰 Штраф списан:', penalty);
                                updateBalance();
                            }).catch(function(err) {
                                console.error('❌ Ошибка списания:', err);
                            });
                        }
                    }
                    el.cancelBtn.disabled = true;
                    el.cancelBtn.textContent = '❌';
                    showMessage('✅ Заказ отменён', 'info');
                });
            }).catch(function(error) {
                console.error('❌ Ошибка отмены:', error);
                showMessage('❌ Ошибка: ' + error.message, 'error');
                el.cancelBtn.disabled = false;
                el.cancelBtn.textContent = '✖';
            });
        }

        // ============================================================
        // UPDATE BALANCE
        // ============================================================
        function updateBalance() {
            const user = auth.currentUser;
            if (!user) return;

            db.collection('users').doc(user.uid).get()
                .then(function(doc) {
                    if (doc.exists) {
                        balance = doc.data().balance || 0;
                        el.balanceDisplay.textContent = '💰 ' + formatPrice(balance);
                    }
                })
                .catch(function(err) {
                    console.error('❌ Ошибка загрузки баланса:', err);
                });
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================

        // === Back ===
        el.backBtn.addEventListener('click', function() {
            if (currentOrderId) {
                if (!confirm('У вас есть активный заказ. Вернуться в кабинет?')) return;
            }
            if (unsubOrder) { unsubOrder();
                unsubOrder = null; }
            window.location.href = 'cabinet.html';
        });

        // === Geolocation ===
        el.geoBtn.addEventListener('click', getCurrentLocation);

        // === Blur handlers для ручного ввода ===
        el.pickupInput.addEventListener('blur', function() {
            const address = this.value.trim();
            if (address && !pickupLocation) {
                geocodeAddress(address).then(function(result) {
                    if (result) {
                        setPickupLocation(result.lat, result.lng);
                        el.pickupInput.classList.add('selected');
                    }
                });
            }
        });

        el.destinationInput.addEventListener('blur', function() {
            const address = this.value.trim();
            if (address && !destinationLocation) {
                geocodeAddress(address).then(function(result) {
                    if (result) {
                        setDestinationLocation(result.lat, result.lng);
                        el.destinationInput.classList.add('selected');
                    }
                });
            }
        });

        // === Order ===
        el.orderBtn.addEventListener('click', createOrder);

        // === Cancel ===
        el.cancelBtn.addEventListener('click', cancelOrder);

        // ============================================================
        // INIT
        // ============================================================
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            updateBalance();

            initMap();

            // Настраиваем автодополнение
            setupAutocomplete(el.pickupInput, el.pickupAutocomplete, handlePickupSelect);
            setupAutocomplete(el.destinationInput, el.destinationAutocomplete, handleDestinationSelect);

            // Автоматическая геолокация через 1 секунду
            setTimeout(function() {
                getCurrentLocation();
            }, 1000);
        });

        console.log('✅ WHEEL — Заказ такси загружен');
        console.log('📌 Введите адрес — появятся подсказки');
        console.log('📌 Выберите адрес из подсказки для определения координат');
        console.log('📌 Если координаты не найдены — сохранится текстовый адрес');
        console.log('📌 Нажмите "Заказать такси" для создания заказа');
    </script>

</body>
