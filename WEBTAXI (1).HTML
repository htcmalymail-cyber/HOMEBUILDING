<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxi AI — заказ такси</title>
  <!-- Leaflet CSS для карты -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #f4f6fa; display: flex; justify-content: center; padding: 20px; }
    .container { max-width: 480px; width: 100%; background: white; border-radius: 24px; padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
    h1 { font-size: 24px; display: flex; align-items: center; gap: 8px; }
    .status { font-size: 14px; color: #2e7d32; background: #e8f5e9; padding: 4px 12px; border-radius: 20px; margin-left: auto; }
    #map { height: 200px; border-radius: 16px; margin: 16px 0; background: #d9e2ec; }
    .form-group { margin-bottom: 14px; }
    label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ccd7e6; border-radius: 12px; font-size: 16px; }
    .geo-btn { background: #eef2f7; border: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; margin-top: 6px; transition: 0.2s; }
    .geo-btn:hover { background: #dce3ed; }
    .geo-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { width: 100%; background: #1a73e8; color: white; border: none; padding: 14px; border-radius: 40px; font-size: 18px; font-weight: 700; cursor: pointer; margin: 10px 0; transition: 0.2s; }
    .btn-primary:hover:not(:disabled) { background: #1557b0; }
    .btn-primary:disabled { background: #a0b8d9; cursor: not-allowed; }
    .btn-danger { background: #d32f2f; }
    .btn-danger:hover:not(:disabled) { background: #b71c1c; }
    .order-status { padding: 12px; background: #f0f7ff; border-radius: 12px; margin-top: 10px; display: none; }
    .order-status.active { display: block; }
    .small-note { font-size: 12px; color: #666; text-align: center; margin-top: 20px; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 12px; font-size: 14px; display: none; z-index: 9999; max-width: 90%; }
    .toast.show { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .loading-dots::after { content: ''; animation: dots 1.5s infinite; }
    @keyframes dots { 0% { content: ''; } 33% { content: '.'; } 66% { content: '..'; } 100% { content: '...'; } }
  </style>
</head>
<body>
  <div class="container">
    <header style="display: flex; justify-content: space-between; align-items: center;">
      <h1>🚖 Taxi AI</h1>
      <span class="status">● Онлайн</span>
    </header>

    <!-- Карта -->
    <div id="map"></div>

    <!-- Форма заказа -->
    <div class="form-group">
      <label>📍 Откуда</label>
      <input type="text" id="fromInput" placeholder="Ваш адрес или ориентир" value="Москва, Красная площадь">
      <button class="geo-btn" id="geoBtn">📍 Определить местоположение</button>
      <span id="geoStatus" style="font-size: 12px; color: #666; display: block; margin-top: 4px;"></span>
    </div>

    <div class="form-group">
      <label>🏁 Куда</label>
      <input type="text" id="toInput" placeholder="Адрес назначения" value="Москва, Тверская 1">
    </div>

    <div class="form-group">
      <label>🚘 Тип авто</label>
      <select id="carType">
        <option value="economy">Эконом</option>
        <option value="comfort" selected>Комфорт</option>
        <option value="minivan">Минивэн</option>
      </select>
    </div>

    <button class="btn-primary" id="orderBtn">📞 Заказать такси</button>
    <button class="btn-primary btn-danger" id="cancelBtn" style="display:none;">✖ Отменить заказ</button>

    <!-- Статус заказа -->
    <div class="order-status" id="orderStatus">
      <strong>🚗 Заказ принят</strong><br>
      <span id="statusText">Ищем ближайшего водителя...</span>
      <div style="margin-top: 8px; font-size: 14px; color: #1a73e8;" id="etaInfo">⏱ Ожидайте, ~3-5 мин</div>
    </div>

    <div class="small-note">Виртуальный диспетчер AI · v0.1</div>
  </div>

  <!-- Toast уведомление -->
  <div class="toast" id="toast"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // --- Инициализация карты (заглушка) ---
    const map = L.map('map').setView([55.7558, 37.6173], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);
    const marker = L.marker([55.7558, 37.6173]).addTo(map);

    // --- DOM элементы ---
    const fromInput = document.getElementById('fromInput');
    const toInput = document.getElementById('toInput');
    const carType = document.getElementById('carType');
    const orderBtn = document.getElementById('orderBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const orderStatus = document.getElementById('orderStatus');
    const statusText = document.getElementById('statusText');
    const etaInfo = document.getElementById('etaInfo');
    const geoBtn = document.getElementById('geoBtn');
    const geoStatus = document.getElementById('geoStatus');
    const toast = document.getElementById('toast');

    let orderActive = false;
    let orderTimer = null;
    let watchId = null;

    // --- Функция показа уведомлений ---
    function showToast(message, duration = 3000) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    // --- ГЕОЛОКАЦИЯ (исправленная) ---
    geoBtn.addEventListener('click', () => {
      // Проверка поддержки браузером
      if (!navigator.geolocation) {
        showToast('❌ Ваш браузер не поддерживает геолокацию');
        return;
      }

      // Блокируем кнопку на время запроса
      geoBtn.disabled = true;
      geoBtn.textContent = '⏳ Определяем...';
      geoStatus.textContent = 'Запрос разрешения...';

      // Опции геолокации (повышаем точность)
      const options = {
        enableHighAccuracy: true,
        timeout: 10000, // 10 секунд
        maximumAge: 60000 // кеш 1 минута
      };

      // Запрашиваем позицию
      navigator.geolocation.getCurrentPosition(
        // УСПЕХ
        (position) => {
          const { latitude, longitude } = position.coords;
          const accuracy = position.coords.accuracy ? `${Math.round(position.coords.accuracy)} м` : '';

          // Обновляем карту
          map.setView([latitude, longitude], 16);
          marker.setLatLng([latitude, longitude]);

          // Заполняем поле (координатами, потом можно через геокодер)
          fromInput.value = `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
          geoStatus.textContent = `✅ Определено (точность ${accuracy})`;
          geoBtn.textContent = '📍 Обновить';
          geoBtn.disabled = false;

          showToast(`📍 Местоположение определено (${accuracy})`);
        },
        // ОШИБКА
        (error) => {
          console.error('Geolocation error:', error);
          let errorMsg = '';
          switch(error.code) {
            case error.PERMISSION_DENIED:
              errorMsg = '❌ Доступ к геолокации запрещён. Разрешите в настройках браузера.';
              break;
            case error.POSITION_UNAVAILABLE:
              errorMsg = '❌ Не удалось определить местоположение. Проверьте GPS или Wi-Fi.';
              break;
            case error.TIMEOUT:
              errorMsg = '⏱ Превышено время ожидания. Попробуйте ещё раз.';
              break;
            default:
              errorMsg = `❌ Ошибка: ${error.message}`;
          }
          geoStatus.textContent = errorMsg;
          geoBtn.textContent = '📍 Попробовать снова';
          geoBtn.disabled = false;
          showToast(errorMsg, 5000);
        },
        options
      );
    });

    // --- Заказ такси (имитация AI-диспетчера) ---
    orderBtn.addEventListener('click', () => {
      if (!fromInput.value.trim() || !toInput.value.trim()) {
        showToast('⚠️ Укажите адрес отправления и назначения', 3000);
        return;
      }

      // Блокируем кнопку и показываем статус
      orderActive = true;
      orderBtn.disabled = true;
      orderBtn.style.display = 'none';
      cancelBtn.style.display = 'block';
      orderStatus.classList.add('active');
      statusText.textContent = '⏳ Подбираем водителя...';
      etaInfo.textContent = 'Анализируем загрузку и пробки...';

      // Имитация работы ИИ (через 2 сек — назначение)
      let step = 0;
      const steps = [
        { text: '🚗 Водитель найден (Иван, 4.9⭐)', eta: '⏱ Подача через 4 мин' },
        { text: '✅ Машина назначена. Номер: А777ХХ', eta: '⏱ Прибудет через 6 мин' }
      ];

      orderTimer = setInterval(() => {
        if (step < steps.length) {
          statusText.textContent = steps[step].text;
          etaInfo.textContent = steps[step].eta;
          step++;
        } else {
          clearInterval(orderTimer);
          statusText.textContent = '🚖 Такси едет к вам. Следите за картой!';
          etaInfo.textContent = '⏱ ~3 мин до посадки';
          showToast('🚖 Такси назначено!');
        }
      }, 1500);
    });

    // --- Отмена заказа ---
    cancelBtn.addEventListener('click', () => {
      clearInterval(orderTimer);
      orderActive = false;
      orderBtn.disabled = false;
      orderBtn.style.display = 'block';
      cancelBtn.style.display = 'none';
      orderStatus.classList.remove('active');
      statusText.textContent = '';
      etaInfo.textContent = '';
      showToast('✖ Заказ отменён');
    });

    // --- Проверка поддержки геолокации при загрузке ---
    if (!navigator.geolocation) {
      geoStatus.textContent = '⚠️ Геолокация не поддерживается';
      geoBtn.disabled = true;
    } else {
      geoStatus.textContent = 'Нажмите кнопку для определения местоположения';
    }

    // --- Обработка ошибок карты (если не загрузилась) ---
    setTimeout(() => {
      if (!map._loaded) {
        console.warn('Карта не загрузилась, проверьте интернет');
      }
    }, 5000);
  </script>
</body>
</html>
