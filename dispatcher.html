<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Диспетчер — WHEEL</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">
    </script>

    <style>
        /* ===== ОСНОВНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0c10;
            min-height: 100vh;
            padding: 16px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.04) 0%, transparent 40%);
            background-attachment: fixed;
            color: #ffffff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
        }
        .header-title span {
            color: #ffb000;
        }

        .header-badge {
            background: rgba(255, 180, 0, 0.08);
            border: 1px solid rgba(255, 180, 0, 0.12);
            border-radius: 30px;
            padding: 6px 16px;
            color: #ffb000;
            font-size: 13px;
            font-weight: 600;
        }

        .logout-btn {
            background: rgba(255, 70, 70, 0.08);
            border: 1px solid rgba(255, 70, 70, 0.15);
            border-radius: 30px;
            padding: 8px 18px;
            color: #ff6b6b;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .logout-btn:hover {
            background: rgba(255, 70, 70, 0.18);
        }

        /* ===== СТАТИСТИКА ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
        }
        .stat-card .number.gold {
            color: #ffb000;
        }
        .stat-card .number.green {
            color: #4ade80;
        }
        .stat-card .number.blue {
            color: #60a5fa;
        }
        .stat-card .number.red {
            color: #ff6b6b;
        }
        .stat-card .number.purple {
            color: #a78bfa;
        }

        .stat-card .label {
            font-size: 12px;
            color: #8899aa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* ===== ОСНОВНАЯ СЕТКА ===== */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 1100px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* ===== КАРТОЧКИ ===== */
        .card {
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
        }
        .card-title .count {
            font-size: 14px;
            color: #8899aa;
            font-weight: 400;
        }

        /* ===== КНОПКИ ===== */
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(255, 140, 0, 0.3);
        }

        .btn-danger {
            background: rgba(255, 70, 70, 0.12);
            color: #ff6b6b;
            border: 1px solid rgba(255, 70, 70, 0.15);
        }
        .btn-danger:hover {
            background: rgba(255, 70, 70, 0.2);
        }

        .btn-success {
            background: rgba(74, 222, 128, 0.12);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.15);
        }
        .btn-success:hover {
            background: rgba(74, 222, 128, 0.2);
        }

        .btn-warning {
            background: rgba(255, 180, 0, 0.12);
            color: #ffb000;
            border: 1px solid rgba(255, 180, 0, 0.15);
        }
        .btn-warning:hover {
            background: rgba(255, 180, 0, 0.2);
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        .btn-xs {
            padding: 2px 10px;
            font-size: 11px;
        }

        /* ===== СПИСОК ЗАКАЗОВ ===== */
        .order-list,
        .driver-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .order-list::-webkit-scrollbar,
        .driver-list::-webkit-scrollbar {
            width: 4px;
        }
        .order-list::-webkit-scrollbar-track,
        .driver-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .order-list::-webkit-scrollbar-thumb,
        .driver-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .order-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .order-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .order-item .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .order-id {
            font-size: 14px;
            font-weight: 600;
            color: #e0e8f0;
        }
        .order-id small {
            color: #667788;
            font-weight: 400;
        }

        .order-status {
            font-size: 11px;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .order-status.new {
            background: rgba(96, 165, 250, 0.15);
            color: #60a5fa;
        }
        .order-status.searching {
            background: rgba(255, 180, 0, 0.15);
            color: #ffb000;
        }
        .order-status.assigned {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }
        .order-status.in_progress {
            background: rgba(255, 180, 0, 0.15);
            color: #ffb000;
        }
        .order-status.completed {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
        }
        .order-status.cancelled {
            background: rgba(255, 70, 70, 0.15);
            color: #ff6b6b;
        }

        .order-details {
            font-size: 13px;
            color: #8899aa;
            margin-top: 4px;
        }
        .order-actions {
            margin-top: 8px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* ===== ВОДИТЕЛИ ===== */
        .driver-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .driver-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .driver-info .name {
            font-size: 14px;
            font-weight: 600;
            color: #e0e8f0;
        }
        .driver-info .car {
            font-size: 12px;
            color: #8899aa;
        }
        .driver-status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .driver-status-dot.online {
            background: #4ade80;
        }
        .driver-status-dot.offline {
            background: #667788;
        }
        .driver-status-dot.busy {
            background: #ffb000;
        }

        .driver-balance {
            font-size: 14px;
            font-weight: 600;
            color: #ffb000;
        }

        .driver-actions {
            display: flex;
            gap: 4px;
        }

        /* ===== ФИНАНСЫ ===== */
        .finance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 4px;
        }
        .finance-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .finance-item .label {
            font-size: 13px;
            color: #8899aa;
        }
        .finance-item .value {
            font-size: 15px;
            font-weight: 700;
        }
        .finance-item .value.gold {
            color: #ffb000;
        }
        .finance-item .value.green {
            color: #4ade80;
        }
        .finance-item .value.red {
            color: #ff6b6b;
        }

        /* ===== МОДАЛКА НАЗНАЧЕНИЯ ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1a1e26;
            border-radius: 24px;
            padding: 28px 32px;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }
        .modal h3 {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 16px;
        }
        .modal .form-group {
            margin-bottom: 14px;
        }
        .modal .form-group label {
            display: block;
            font-size: 13px;
            color: #b0c0d0;
            margin-bottom: 4px;
        }
        .modal .form-group input,
        .modal .form-group select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus {
            border-color: #ffb000;
        }
        .modal .form-group select option {
            background: #1a1e26;
            color: #ffffff;
        }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .modal .modal-actions .btn {
            flex: 1;
            text-align: center;
        }

        /* ===== ПУСТО ===== */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #667788;
            font-size: 14px;
        }
        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1e26;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px 24px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: none;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }
        .toast.show {
            display: block;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .toast.success {
            border-color: rgba(74, 222, 128, 0.2);
        }
        .toast.error {
            border-color: rgba(255, 70, 70, 0.2);
        }
        .toast.warning {
            border-color: rgba(255, 180, 0, 0.2);
        }

        @media (max-width: 600px) {
            .header {
                padding: 12px 16px;
            }
            .header-title {
                font-size: 18px;
            }
            .card {
                padding: 14px;
            }
            .finance-grid {
                grid-template-columns: 1fr;
            }
            .modal {
                padding: 20px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 6px;
            }
            .stat-card {
                padding: 10px;
            }
            .stat-card .number {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== ШАПКА ===== -->
        <div class="header">
            <div class="header-title">🚖 <span>Диспетчер</span></div>
            <div>
                <span class="header-badge" id="ordersBadge">📦 Заказов: 0</span>
                <span class="header-badge" id="driversBadge">🚗 Водителей: 0</span>
                <button class="logout-btn" id="logoutBtn">🚪 Выйти</button>
            </div>
        </div>

        <!-- ===== СТАТИСТИКА ===== -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number blue" id="statNew">0</div>
                <div class="label">Новые</div>
            </div>
            <div class="stat-card">
                <div class="number gold" id="statSearching">0</div>
                <div class="label">В поиске</div>
            </div>
            <div class="stat-card">
                <div class="number green" id="statActive">0</div>
                <div class="label">Активные</div>
            </div>
            <div class="stat-card">
                <div class="number red" id="statCompleted">0</div>
                <div class="label">Завершены</div>
            </div>
            <div class="stat-card">
                <div class="number purple" id="statDrivers">0</div>
                <div class="label">Водителей</div>
            </div>
        </div>

        <!-- ===== ОСНОВНАЯ СЕТКА ===== -->
        <div class="main-grid">

            <!-- ===== ЛЕВАЯ КОЛОНКА: ЗАКАЗЫ ===== -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">📋 Заказы <span class="count" id="ordersCount">(0)</span></div>
                    <button class="btn btn-primary btn-sm" id="refreshBtn">🔄 Обновить</button>
                </div>
                <div class="order-list" id="orderList">
                    <div class="empty-state">
                        <div class="icon">📦</div>
                        <div>Загрузка заказов...</div>
                    </div>
                </div>
            </div>

            <!-- ===== ПРАВАЯ КОЛОНКА: ВОДИТЕЛИ + ФИНАНСЫ ===== -->
            <div>

                <!-- ВОДИТЕЛИ -->
                <div class="card" style="margin-bottom:16px;">
                    <div class="card-header">
                        <div class="card-title">🚗 Водители <span class="count" id="driversCount">(0)</span></div>
                        <button class="btn btn-success btn-sm" id="addDriverBtn">➕ Добавить</button>
                    </div>
                    <div class="driver-list" id="driverList">
                        <div class="empty-state">
                            <div class="icon">🚗</div>
                            <div>Загрузка водителей...</div>
                        </div>
                    </div>
                </div>

                <!-- ФИНАНСЫ -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">💰 Финансы</div>
                    </div>
                    <div class="finance-grid">
                        <div class="finance-item">
                            <span class="label">Общий оборот</span>
                            <span class="value gold" id="totalRevenue">0 ₪</span>
                        </div>
                        <div class="finance-item">
                            <span class="label">Комиссия (20%)</span>
                            <span class="value gold" id="totalCommission">0 ₪</span>
                        </div>
                        <div class="finance-item">
                            <span class="label">Штрафы</span>
                            <span class="value red" id="totalPenalties">0 ₪</span>
                        </div>
                        <div class="finance-item">
                            <span class="label">Всего поездок</span>
                            <span class="value green" id="totalRides">0</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- ===== МОДАЛКА: НАЗНАЧЕНИЕ ВОДИТЕЛЯ ===== -->
    <div class="modal-overlay" id="assignModal">
        <div class="modal">
            <h3>🚖 Назначить водителя</h3>
            <div class="form-group">
                <label>Заказ: <span id="assignOrderId">—</span></label>
            </div>
            <div class="form-group">
                <label for="assignDriverSelect">Выберите водителя</label>
                <select id="assignDriverSelect">
                    <option value="">— Загрузка водителей —</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-success" id="assignConfirmBtn">✅ Назначить</button>
                <button class="btn btn-danger" id="assignCancelBtn">Отмена</button>
            </div>
        </div>
    </div>

    <!-- ===== МОДАЛКА: ДОБАВЛЕНИЕ ВОДИТЕЛЯ ===== -->
    <div class="modal-overlay" id="addDriverModal">
        <div class="modal">
            <h3>➕ Добавить водителя</h3>
            <div class="form-group">
                <label>Имя водителя</label>
                <input type="text" id="addDriverName" placeholder="Алексей Петров">
            </div>
            <div class="form-group">
                <label>Email (для входа)</label>
                <input type="email" id="addDriverEmail" placeholder="driver@mail.com">
            </div>
            <div class="form-group">
                <label>Пароль (мин. 6 символов)</label>
                <input type="password" id="addDriverPassword" placeholder="••••••••" minlength="6">
            </div>
            <div class="form-group">
                <label>Марка машины</label>
                <input type="text" id="addDriverCar" placeholder="Toyota Camry">
            </div>
            <div class="form-group">
                <label>Номер машины</label>
                <input type="text" id="addDriverPlate" placeholder="А777МР77">
            </div>
            <div class="form-group">
                <label>Телефон</label>
                <input type="text" id="addDriverPhone" placeholder="+972 50-1234567">
            </div>
            <div class="modal-actions">
                <button class="btn btn-success" id="addDriverConfirmBtn">✅ Добавить</button>
                <button class="btn btn-danger" id="addDriverCancelBtn">Отмена</button>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <div id="toastMessage">Сообщение</div>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // FIREBASE КОНФИГ
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        console.log('🔥 Firebase готов');

        // ============================================================
        // ПЕРЕМЕННЫЕ
        // ============================================================
        let allOrders = [];
        let allDrivers = [];
        let selectedOrderId = null;
        let unsubOrders = null;
        let unsubDrivers = null;

        // ============================================================
        // ТОАСТ
        // ============================================================
        let toastTimeout = null;

        function showToast(text, type = 'info') {
            const toast = document.getElementById('toast');
            toast.className = 'toast show ' + type;
            document.getElementById('toastMessage').textContent = text;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.className = 'toast';
            }, 4000);
        }

        // ============================================================
        // ФУНКЦИИ
        // ============================================================
        function formatPrice(p) {
            return (p || 0).toFixed(2) + ' ₪';
        }

        function formatDate(ts) {
            if (!ts) return '—';
            try {
                const d = ts.toDate ? ts.toDate() : new Date(ts);
                return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            } catch {
                return '—';
            }
        }

        function haversineDistance(lat1, lng1, lat2, lng2) {
            if (!lat1 || !lng1 || !lat2 || !lng2) return Infinity;
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        const statusLabels = {
            new: 'Новый',
            searching: 'Поиск',
            assigned: 'Назначен',
            in_progress: 'В пути',
            completed: 'Завершён',
            cancelled: 'Отменён'
        };

        const statusClasses = {
            new: 'new',
            searching: 'searching',
            assigned: 'assigned',
            in_progress: 'in_progress',
            completed: 'completed',
            cancelled: 'cancelled'
        };

        // ============================================================
        // РЕНДЕРИНГ ЗАКАЗОВ
        // ============================================================
        function renderOrders() {
            const list = document.getElementById('orderList');

            if (!allOrders || allOrders.length === 0) {
                list.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📦</div>
                            <div>Нет заказов</div>
                        </div>
                    `;
                document.getElementById('ordersCount').textContent = '(0)';
                document.getElementById('ordersBadge').textContent = '📦 Заказов: 0';
                updateStats();
                return;
            }

            let html = '';
            allOrders.forEach(order => {
                const label = statusLabels[order.status] || order.status;
                const cls = statusClasses[order.status] || '';
                html += `
                        <div class="order-item">
                            <div class="top">
                                <div>
                                    <span class="order-id">#${order.id.substring(0, 8)}</span>
                                    <span class="order-status ${cls}">${label}</span>
                                </div>
                                <span style="color:#ffb000; font-weight:600;">${formatPrice(order.price)}</span>
                            </div>
                            <div class="order-details">
                                📍 ${order.pickup?.address || '—'} → 🏁 ${order.destination?.address || '—'}
                            </div>
                            <div class="order-details" style="margin-top:2px;">
                                👤 ${order.clientName || 'Клиент'}
                                ${order.driverName ? `• 🚗 ${order.driverName}` : ''}
                                ${order.penaltyApplied ? `• ⚠️ Штраф: ${formatPrice(order.penaltyApplied)}` : ''}
                            </div>
                            <div class="order-actions">
                                ${(order.status === 'new' || order.status === 'searching') ? `
                                    <button class="btn btn-success btn-xs" onclick="openAssignModal('${order.id}')">🚖 Назначить</button>
                                    <button class="btn btn-warning btn-xs" onclick="autoAssignSingle('${order.id}')">🤖 Рекомендовать</button>
                                ` : ''}
                                ${(order.status !== 'completed' && order.status !== 'cancelled') ? `
                                    <button class="btn btn-danger btn-xs" onclick="deleteOrder('${order.id}')">🗑️ Удалить</button>
                                ` : ''}
                            </div>
                            ${order.recommendedDrivers && order.recommendedDrivers.length > 0 ? `
                                <div style="margin-top:6px; font-size:11px; color:#4ade80;">
                                    🤖 Рекомендуемые: ${order.recommendedDrivers.map(d => `${d.name} (${d.dist} км)`).join(', ')}
                                </div>
                            ` : ''}
                        </div>
                    `;
            });

            list.innerHTML = html;
            document.getElementById('ordersCount').textContent = `(${allOrders.length})`;
            document.getElementById('ordersBadge').textContent = `📦 Заказов: ${allOrders.length}`;
            updateStats();
        }

        // ============================================================
        // РЕНДЕРИНГ ВОДИТЕЛЕЙ
        // ============================================================
        function renderDrivers() {
            const list = document.getElementById('driverList');

            if (!allDrivers || allDrivers.length === 0) {
                list.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🚗</div>
                            <div>Нет водителей</div>
                        </div>
                    `;
                document.getElementById('driversCount').textContent = '(0)';
                document.getElementById('driversBadge').textContent = '🚗 Водителей: 0';
                return;
            }

            let html = '';
            allDrivers.forEach(d => {
                const dot = d.status === 'online' ? 'online' : d.status === 'busy' ? 'busy' : 'offline';
                const label = d.status === 'online' ? 'Онлайн' : d.status === 'busy' ? 'Занят' : 'Офлайн';
                html += `
                        <div class="driver-item">
                            <div>
                                <div class="name">
                                    <span class="driver-status-dot ${dot}"></span>
                                    ${d.displayName || 'Водитель'}
                                </div>
                                <div class="car">
                                    🚗 ${d.carModel || '—'} • ${d.licensePlate || '—'} • ${label}
                                    ${d.phone ? `• 📱 ${d.phone}` : ''}
                                </div>
                            </div>
                            <div style="display:flex; align-items:center; gap:10px;">
                                <span class="driver-balance">${formatPrice(d.balance)}</span>
                                <button class="btn btn-danger btn-xs" onclick="deleteDriver('${d.uid}')">🗑️</button>
                            </div>
                        </div>
                    `;
            });

            list.innerHTML = html;
            document.getElementById('driversCount').textContent = `(${allDrivers.length})`;
            document.getElementById('driversBadge').textContent = `🚗 Водителей: ${allDrivers.length}`;
        }

        // ============================================================
        // СТАТИСТИКА
        // ============================================================
        function updateStats() {
            const stats = { new: 0, searching: 0, assigned: 0, in_progress: 0, completed: 0, cancelled: 0 };
            allOrders.forEach(o => {
                if (stats[o.status] !== undefined) stats[o.status]++;
            });
            document.getElementById('statNew').textContent = stats.new;
            document.getElementById('statSearching').textContent = stats.searching;
            document.getElementById('statActive').textContent = stats.assigned + stats.in_progress;
            document.getElementById('statCompleted').textContent = stats.completed;
            document.getElementById('statDrivers').textContent = allDrivers.length;

            // Финансы
            let revenue = 0,
                commission = 0,
                penalties = 0,
                rides = 0;
            allOrders.forEach(o => {
                if (o.status === 'completed' && o.price) {
                    revenue += o.price;
                    commission += o.price * 0.2;
                    rides++;
                }
                if (o.penaltyApplied) penalties += o.penaltyApplied;
            });
            document.getElementById('totalRevenue').textContent = formatPrice(revenue);
            document.getElementById('totalCommission').textContent = formatPrice(commission);
            document.getElementById('totalPenalties').textContent = formatPrice(penalties);
            document.getElementById('totalRides').textContent = rides;
        }

        // ============================================================
        // АВТО-РЕКОМЕНДАЦИЯ (в радиусе 50 км)
        // ============================================================
        function getRecommendedDrivers(order) {
            if (!order.pickup || !order.pickup.lat || !order.pickup.lng) return [];

            const recommendations = [];
            allDrivers.forEach(d => {
                if (!d.location || !d.location.lat || !d.location.lng) return;
                const dist = haversineDistance(
                    order.pickup.lat, order.pickup.lng,
                    d.location.lat, d.location.lng
                );
                if (dist <= 50) {
                    recommendations.push({
                        uid: d.uid,
                        name: d.displayName || 'Водитель',
                        dist: dist.toFixed(1),
                        car: d.carModel || '—',
                        plate: d.licensePlate || '—'
                    });
                }
            });

            recommendations.sort((a, b) => parseFloat(a.dist) - parseFloat(b.dist));
            return recommendations.slice(0, 5);
        }

        // ============================================================
        // ОТКРЫТИЕ МОДАЛКИ НАЗНАЧЕНИЯ
        // ============================================================
        window.openAssignModal = function(orderId) {
            selectedOrderId = orderId;
            const order = allOrders.find(o => o.id === orderId);
            if (!order) {
                showToast('❌ Заказ не найден', 'error');
                return;
            }

            document.getElementById('assignOrderId').textContent = `#${orderId.substring(0, 8)} (${statusLabels[order.status] || order.status})`;

            const select = document.getElementById('assignDriverSelect');
            select.innerHTML = '<option value="">— Выберите водителя —</option>';

            const available = allDrivers.filter(d => d.status === 'online' || d.status === 'offline');
            if (available.length === 0) {
                select.innerHTML = '<option value="">— Нет доступных водителей —</option>';
            } else {
                available.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.uid;
                    opt.textContent = `${d.displayName} (${d.carModel || '—'} ${d.licensePlate || '—'})`;
                    select.appendChild(opt);
                });
            }

            document.getElementById('assignModal').classList.add('active');
        };

        document.getElementById('assignCancelBtn').addEventListener('click', function() {
            document.getElementById('assignModal').classList.remove('active');
            selectedOrderId = null;
        });

        document.getElementById('assignModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
                selectedOrderId = null;
            }
        });

        document.getElementById('assignConfirmBtn').addEventListener('click', function() {
            const driverId = document.getElementById('assignDriverSelect').value;
            if (!driverId) {
                showToast('❌ Выберите водителя', 'error');
                return;
            }
            if (!selectedOrderId) {
                showToast('❌ Заказ не выбран', 'error');
                return;
            }

            const driver = allDrivers.find(d => d.uid === driverId);
            const orderRef = db.collection('orders').doc(selectedOrderId);

            orderRef.update({
                driverId: driverId,
                driverName: driver?.displayName || 'Водитель',
                status: 'assigned',
                assignedAt: firebase.firestore.FieldValue.serverTimestamp(),
                assignedManually: true,
                dispatchHistory: firebase.firestore.FieldValue.arrayUnion({
                    driverId: driverId,
                    timestamp: new Date().toISOString(),
                    method: 'manual'
                })
            }).then(() => {
                showToast(`✅ Водитель ${driver?.displayName} назначен`, 'success');
                document.getElementById('assignModal').classList.remove('active');
                selectedOrderId = null;
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        });

        // ============================================================
        // АВТО-РЕКОМЕНДАЦИЯ ДЛЯ ОДНОГО ЗАКАЗА
        // ============================================================
        window.autoAssignSingle = function(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) {
                showToast('❌ Заказ не найден', 'error');
                return;
            }

            const recommended = getRecommendedDrivers(order);
            if (recommended.length === 0) {
                showToast('⚠️ Нет водителей в радиусе 50 км', 'warning');
                return;
            }

            // Показываем рекомендации в заказе
            const orderRef = db.collection('orders').doc(orderId);
            orderRef.update({
                recommendedDrivers: recommended
            }).then(() => {
                showToast(`🤖 Найдено ${recommended.length} водителей в радиусе 50 км`, 'success');
            }).catch(err => {
                showToast('❌ Ошибка: ' + err.message, 'error');
            });
        };

        // ============================================================
        // УДАЛЕНИЕ ЗАКАЗА
        // ============================================================
        window.deleteOrder = function(orderId) {
            if (!confirm('🗑️ Удалить заказ #' + orderId.substring(0, 8) + '?')) return;
            db.collection('orders').doc(orderId).delete()
                .then(() => showToast('✅ Заказ удалён', 'success'))
                .catch(err => showToast('❌ Ошибка: ' + err.message, 'error'));
        };

        // ============================================================
        // УДАЛЕНИЕ ВОДИТЕЛЯ
        // ============================================================
        window.deleteDriver = function(driverId) {
            const driver = allDrivers.find(d => d.uid === driverId);
            if (!confirm(`🗑️ Удалить водителя ${driver?.displayName || '?'}?`)) return;

            // Удаляем документ из коллекции users
            db.collection('users').doc(driverId).delete()
                .then(() => {
                    showToast('✅ Водитель удалён', 'success');
                })
                .catch(err => {
                    showToast('❌ Ошибка: ' + err.message, 'error');
                });
        };

        // ============================================================
        // ДОБАВЛЕНИЕ ВОДИТЕЛЯ
        // ============================================================
        document.getElementById('addDriverBtn').addEventListener('click', function() {
            document.getElementById('addDriverModal').classList.add('active');
        });

        document.getElementById('addDriverCancelBtn').addEventListener('click', function() {
            document.getElementById('addDriverModal').classList.remove('active');
            clearAddDriverForm();
        });

        document.getElementById('addDriverModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
                clearAddDriverForm();
            }
        });

        function clearAddDriverForm() {
            document.getElementById('addDriverName').value = '';
            document.getElementById('addDriverEmail').value = '';
            document.getElementById('addDriverPassword').value = '';
            document.getElementById('addDriverCar').value = '';
            document.getElementById('addDriverPlate').value = '';
            document.getElementById('addDriverPhone').value = '';
        }

        document.getElementById('addDriverConfirmBtn').addEventListener('click', function() {
            const name = document.getElementById('addDriverName').value.trim();
            const email = document.getElementById('addDriverEmail').value.trim();
            const password = document.getElementById('addDriverPassword').value.trim();
            const car = document.getElementById('addDriverCar').value.trim();
            const plate = document.getElementById('addDriverPlate').value.trim();
            const phone = document.getElementById('addDriverPhone').value.trim();

            if (!name || !email || !password) {
                showToast('❌ Заполните имя, email и пароль', 'error');
                return;
            }
            if (password.length < 6) {
                showToast('❌ Пароль минимум 6 символов', 'error');
                return;
            }

            document.getElementById('addDriverConfirmBtn').disabled = true;
            document.getElementById('addDriverConfirmBtn').textContent = '⏳ ...';

            // 1. Создаём пользователя в Auth
            auth.createUserWithEmailAndPassword(email, password)
                .then(userCredential => {
                    const user = userCredential.user;

                    // 2. Создаём документ в коллекции users
                    return db.collection('users').doc(user.uid).set({
                        uid: user.uid,
                        email: user.email,
                        role: 'driver',
                        displayName: name,
                        balance: 0,
                        rating: 0,
                        bonus: 0,
                        penalty: 0,
                        premium: 0,
                        totalEarned: 0,
                        totalSpent: 0,
                        driverData: {
                            location: null,
                            isAvailable: true,
                            carModel: car || '—',
                            licensePlate: plate || '—',
                            phone: phone || ''
                        },
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    showToast(`✅ Водитель ${name} добавлен`, 'success');
                    document.getElementById('addDriverModal').classList.remove('active');
                    clearAddDriverForm();
                })
                .catch(err => {
                    if (err.code === 'auth/email-already-in-use') {
                        showToast('❌ Этот email уже используется', 'error');
                    } else {
                        showToast('❌ Ошибка: ' + err.message, 'error');
                    }
                })
                .finally(() => {
                    document.getElementById('addDriverConfirmBtn').disabled = false;
                    document.getElementById('addDriverConfirmBtn').textContent = '✅ Добавить';
                });
        });

        // ============================================================
        // ОБНОВЛЕНИЕ
        // ============================================================
        document.getElementById('refreshBtn').addEventListener('click', function() {
            showToast('🔄 Данные обновлены', 'info');
        });

        // ============================================================
        // ПОДПИСКИ (REAL-TIME)
        // ============================================================
        function subscribeToOrders() {
            if (unsubOrders) { unsubOrders();
                unsubOrders = null; }
            unsubOrders = db.collection('orders').orderBy('createdAt', 'desc')
                .onSnapshot(snapshot => {
                    allOrders = [];
                    snapshot.forEach(doc => {
                        allOrders.push({ id: doc.id, ...doc.data() });
                    });
                    renderOrders();
                }, err => console.error('Orders error:', err));
        }

        function subscribeToDrivers() {
            if (unsubDrivers) { unsubDrivers();
                unsubDrivers = null; }
            unsubDrivers = db.collection('users').where('role', '==', 'driver')
                .onSnapshot(snapshot => {
                    allDrivers = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        allDrivers.push({
                            uid: doc.id,
                            displayName: data.displayName || 'Водитель',
                            balance: data.balance || 0,
                            status: data.driverData?.isAvailable ? 'online' : 'offline',
                            carModel: data.driverData?.carModel || '—',
                            licensePlate: data.driverData?.licensePlate || '—',
                            phone: data.driverData?.phone || '',
                            location: data.driverData?.location || null,
                            ...data
                        });
                    });
                    renderDrivers();
                    updateStats();
                }, err => console.error('Drivers error:', err));
        }

        // ============================================================
        // ВЫХОД
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (unsubOrders) { unsubOrders();
                unsubOrders = null; }
            if (unsubDrivers) { unsubDrivers();
                unsubDrivers = null; }
            auth.signOut().then(() => {
                window.location.href = 'index.html';
            });
        });

        // ============================================================
        // АВТОРИЗАЦИЯ
        // ============================================================
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            db.collection('users').doc(user.uid).get()
                .then(doc => {
                    if (doc.exists && doc.data().role === 'admin') {
                        subscribeToOrders();
                        subscribeToDrivers();
                        console.log('✅ Диспетчер авторизован');
                    } else {
                        showToast('⛔ Доступ только для администраторов', 'error');
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    }
                })
                .catch(() => {
                    window.location.href = 'index.html';
                });
        });

        console.log('✅ Панель диспетчера готова');
        console.log('📌 Функции:');
        console.log('  📋 Просмотр заказов');
        console.log('  🚖 Ручное назначение водителя');
        console.log('  🤖 Авто-рекомендация (50 км)');
        console.log('  🗑️ Удаление заказов и водителей');
        console.log('  ➕ Добавление водителей');
        console.log('  💰 Финансы');
    </script>

</body>
</html>
