<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Диспетчер — WHEEL</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0c10;
            min-height: 100vh;
            padding: 16px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.04) 0%, transparent 40%);
            background-attachment: fixed;
            color: #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ШАПКА */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
        }

        .header-title span {
            color: #ffb000;
        }

        .header-badge {
            background: rgba(255, 180, 0, 0.08);
            border: 1px solid rgba(255, 180, 0, 0.12);
            border-radius: 30px;
            padding: 6px 16px;
            color: #ffb000;
            font-size: 13px;
            font-weight: 600;
        }

        .logout-btn {
            background: rgba(255, 70, 70, 0.08);
            border: 1px solid rgba(255, 70, 70, 0.15);
            border-radius: 30px;
            padding: 8px 18px;
            color: #ff6b6b;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .logout-btn:hover {
            background: rgba(255, 70, 70, 0.18);
        }

        /* СТАТИСТИКА */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
        }

        .stat-card .number.gold {
            color: #ffb000;
        }
        .stat-card .number.green {
            color: #4ade80;
        }
        .stat-card .number.blue {
            color: #60a5fa;
        }
        .stat-card .number.red {
            color: #ff6b6b;
        }

        .stat-card .label {
            font-size: 12px;
            color: #8899aa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* СЕТКА */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* КАРТОЧКИ */
        .card {
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
        }

        .card-title .count {
            font-size: 14px;
            color: #8899aa;
            font-weight: 400;
        }

        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(255, 140, 0, 0.3);
        }

        .btn-danger {
            background: rgba(255, 70, 70, 0.12);
            color: #ff6b6b;
            border: 1px solid rgba(255, 70, 70, 0.15);
        }

        .btn-danger:hover {
            background: rgba(255, 70, 70, 0.2);
        }

        .btn-success {
            background: rgba(74, 222, 128, 0.12);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.15);
        }

        .btn-success:hover {
            background: rgba(74, 222, 128, 0.2);
        }

        .btn-warning {
            background: rgba(255, 180, 0, 0.12);
            color: #ffb000;
            border: 1px solid rgba(255, 180, 0, 0.15);
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }

        .btn-xs {
            padding: 2px 10px;
            font-size: 11px;
        }

        /* СПИСКИ */
        .order-list,
        .driver-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .order-list::-webkit-scrollbar,
        .driver-list::-webkit-scrollbar {
            width: 4px;
        }
        .order-list::-webkit-scrollbar-track,
        .driver-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .order-list::-webkit-scrollbar-thumb,
        .driver-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .order-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .order-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .order-item .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .order-id {
            font-size: 14px;
            font-weight: 600;
            color: #e0e8f0;
        }

        .order-id small {
            color: #667788;
            font-weight: 400;
        }

        .order-status {
            font-size: 11px;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .order-status.new {
            background: rgba(96, 165, 250, 0.15);
            color: #60a5fa;
        }
        .order-status.searching {
            background: rgba(255, 180, 0, 0.15);
            color: #ffb000;
        }
        .order-status.assigned {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }
        .order-status.in_progress {
            background: rgba(255, 180, 0, 0.15);
            color: #ffb000;
        }
        .order-status.completed {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
        }
        .order-status.cancelled {
            background: rgba(255, 70, 70, 0.15);
            color: #ff6b6b;
        }

        .order-details {
            font-size: 13px;
            color: #8899aa;
            margin-top: 4px;
        }

        .order-actions {
            margin-top: 8px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* ВОДИТЕЛИ */
        .driver-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .driver-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .driver-name {
            font-size: 14px;
            font-weight: 600;
            color: #e0e8f0;
        }

        .driver-car {
            font-size: 12px;
            color: #8899aa;
        }

        .driver-status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .driver-status-dot.online {
            background: #4ade80;
        }
        .driver-status-dot.offline {
            background: #667788;
        }
        .driver-status-dot.busy {
            background: #ffb000;
        }

        .driver-balance {
            font-size: 14px;
            font-weight: 600;
            color: #ffb000;
        }

        /* ФИНАНСЫ */
        .finance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 4px;
        }

        .finance-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .finance-item .label {
            font-size: 13px;
            color: #8899aa;
        }

        .finance-item .value {
            font-size: 15px;
            font-weight: 700;
        }

        .finance-item .value.gold {
            color: #ffb000;
        }
        .finance-item .value.green {
            color: #4ade80;
        }
        .finance-item .value.red {
            color: #ff6b6b;
        }

        /* ПУСТО */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #667788;
            font-size: 14px;
        }

        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        @media (max-width: 600px) {
            .header {
                padding: 12px 16px;
            }
            .header-title {
                font-size: 18px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat-card {
                padding: 12px;
            }
            .stat-card .number {
                font-size: 22px;
            }
            .card {
                padding: 14px;
            }
            .finance-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ШАПКА -->
        <div class="header">
            <div class="header-title">🚖 <span>Диспетчер</span></div>
            <div>
                <span class="header-badge" id="ordersBadge">📦 Заказов: 0</span>
                <span class="header-badge" id="driversBadge">🚗 Водителей: 0</span>
                <button class="logout-btn" id="logoutBtn">🚪 Выйти</button>
            </div>
        </div>

        <!-- СТАТИСТИКА -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number blue" id="statNew">0</div>
                <div class="label">Новые</div>
            </div>
            <div class="stat-card">
                <div class="number gold" id="statSearching">0</div>
                <div class="label">В поиске</div>
            </div>
            <div class="stat-card">
                <div class="number green" id="statActive">0</div>
                <div class="label">Активные</div>
            </div>
            <div class="stat-card">
                <div class="number red" id="statCompleted">0</div>
                <div class="label">Завершены</div>
            </div>
        </div>

        <!-- ОСНОВНАЯ СЕТКА -->
        <div class="main-grid">

            <!-- ЗАКАЗЫ -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">📋 Заказы <span class="count" id="ordersCount">(0)</span></div>
                    <button class="btn btn-primary btn-sm" id="refreshBtn">🔄 Обновить</button>
                </div>
                <div class="order-list" id="orderList">
                    <div class="empty-state">
                        <div class="icon">📦</div>
                        <div>Загрузка заказов...</div>
                    </div>
                </div>
            </div>

            <!-- ПРАВАЯ КОЛОНКА -->
            <div>

                <!-- ВОДИТЕЛИ -->
                <div class="card" style="margin-bottom:16px;">
                    <div class="card-header">
                        <div class="card-title">🚗 Водители <span class="count" id="driversCount">(0)</span></div>
                        <button class="btn btn-primary btn-sm" id="simulateBtn">🎮 Симуляция</button>
                    </div>
                    <div class="driver-list" id="driverList">
                        <div class="empty-state">
                            <div class="icon">🚗</div>
                            <div>Загрузка водителей...</div>
                        </div>
                    </div>
                </div>

                <!-- ФИНАНСЫ -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">💰 Финансы</div>
                    </div>
                    <div class="finance-grid">
                        <div class="finance-item">
                            <span class="label">Общий оборот</span>
                            <span class="value gold" id="totalRevenue">0 ₪</span>
                        </div>
                        <div class="finance-item">
                            <span class="label">Комиссия (20%)</span>
                            <span class="value gold" id="totalCommission">0 ₪</span>
                        </div>
                        <div class="finance-item">
                            <span class="label">Штрафы</span>
                            <span class="value red" id="totalPenalties">0 ₪</span>
                        </div>
                        <div class="finance-item">
                            <span class="label">Всего поездок</span>
                            <span class="value green" id="totalRides">0</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // FIREBASE КОНФИГ
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        console.log('🔥 Firebase готов');

        // ============================================================
        // ПЕРЕМЕННЫЕ
        // ============================================================
        let allOrders = [];
        let allDrivers = [];

        // ============================================================
        // ФУНКЦИИ
        // ============================================================
        function formatPrice(p) {
            return (p || 0).toFixed(2) + ' ₪';
        }

        function formatDate(ts) {
            if (!ts) return '—';
            try {
                const d = ts.toDate ? ts.toDate() : new Date(ts);
                return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            } catch {
                return '—';
            }
        }

        const statusLabels = {
            new: 'Новый',
            searching: 'Поиск',
            assigned: 'Назначен',
            in_progress: 'В пути',
            completed: 'Завершён',
            cancelled: 'Отменён'
        };

        const statusClasses = {
            new: 'new',
            searching: 'searching',
            assigned: 'assigned',
            in_progress: 'in_progress',
            completed: 'completed',
            cancelled: 'cancelled'
        };

        // ============================================================
        // РЕНДЕРИНГ
        // ============================================================
        function renderOrders() {
            const list = document.getElementById('orderList');

            if (!allOrders || allOrders.length === 0) {
                list.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📦</div>
                            <div>Нет заказов</div>
                        </div>
                    `;
                document.getElementById('ordersCount').textContent = '(0)';
                document.getElementById('ordersBadge').textContent = '📦 Заказов: 0';
                return;
            }

            let html = '';
            allOrders.forEach(order => {
                const label = statusLabels[order.status] || order.status;
                const cls = statusClasses[order.status] || '';
                html += `
                        <div class="order-item">
                            <div class="top">
                                <div>
                                    <span class="order-id">#${order.id.substring(0, 8)}</span>
                                    <span class="order-status ${cls}">${label}</span>
                                </div>
                                <span style="color:#ffb000; font-weight:600;">${formatPrice(order.price)}</span>
                            </div>
                            <div class="order-details">
                                📍 ${order.pickup?.address || '—'} → 🏁 ${order.destination?.address || '—'}
                            </div>
                            <div class="order-details" style="margin-top:2px;">
                                👤 ${order.clientName || 'Клиент'}
                                ${order.driverName ? `• 🚗 ${order.driverName}` : ''}
                                ${order.penaltyApplied ? `• ⚠️ Штраф: ${formatPrice(order.penaltyApplied)}` : ''}
                            </div>
                            <div class="order-actions">
                                ${(order.status === 'new' || order.status === 'searching') ? `
                                    <button class="btn btn-success btn-xs" onclick="assignDriver('${order.id}')">🚖 Назначить</button>
                                ` : ''}
                                ${(order.status !== 'completed' && order.status !== 'cancelled') ? `
                                    <button class="btn btn-danger btn-xs" onclick="deleteOrder('${order.id}')">🗑️ Удалить</button>
                                ` : ''}
                            </div>
                        </div>
                    `;
            });

            list.innerHTML = html;
            document.getElementById('ordersCount').textContent = `(${allOrders.length})`;
            document.getElementById('ordersBadge').textContent = `📦 Заказов: ${allOrders.length}`;

            // Статистика
            const stats = { new: 0, searching: 0, assigned: 0, in_progress: 0, completed: 0, cancelled: 0 };
            allOrders.forEach(o => {
                if (stats[o.status] !== undefined) stats[o.status]++;
            });
            document.getElementById('statNew').textContent = stats.new;
            document.getElementById('statSearching').textContent = stats.searching;
            document.getElementById('statActive').textContent = stats.assigned + stats.in_progress;
            document.getElementById('statCompleted').textContent = stats.completed;

            // Финансы
            let revenue = 0,
                commission = 0,
                penalties = 0,
                rides = 0;
            allOrders.forEach(o => {
                if (o.status === 'completed' && o.price) {
                    revenue += o.price;
                    commission += o.price * 0.2;
                    rides++;
                }
                if (o.penaltyApplied) penalties += o.penaltyApplied;
            });
            document.getElementById('totalRevenue').textContent = formatPrice(revenue);
            document.getElementById('totalCommission').textContent = formatPrice(commission);
            document.getElementById('totalPenalties').textContent = formatPrice(penalties);
            document.getElementById('totalRides').textContent = rides;
        }

        function renderDrivers() {
            const list = document.getElementById('driverList');

            if (!allDrivers || allDrivers.length === 0) {
                list.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🚗</div>
                            <div>Нет водителей</div>
                        </div>
                    `;
                document.getElementById('driversCount').textContent = '(0)';
                document.getElementById('driversBadge').textContent = '🚗 Водителей: 0';
                return;
            }

            let html = '';
            allDrivers.forEach(d => {
                const dot = d.status === 'online' ? 'online' : d.status === 'busy' ? 'busy' : 'offline';
                const label = d.status === 'online' ? 'Онлайн' : d.status === 'busy' ? 'Занят' : 'Офлайн';
                html += `
                        <div class="driver-item">
                            <div>
                                <div class="driver-name">
                                    <span class="driver-status-dot ${dot}"></span>
                                    ${d.displayName || 'Водитель'}
                                </div>
                                <div class="driver-car">
                                    🚗 ${d.carModel || '—'} • ${d.licensePlate || '—'} • ${label}
                                </div>
                            </div>
                            <div class="driver-balance">${formatPrice(d.balance)}</div>
                        </div>
                    `;
            });

            list.innerHTML = html;
            document.getElementById('driversCount').textContent = `(${allDrivers.length})`;
            document.getElementById('driversBadge').textContent = `🚗 Водителей: ${allDrivers.length}`;
        }

        // ============================================================
        // НАЗНАЧЕНИЕ ВОДИТЕЛЯ
        // ============================================================
        window.assignDriver = function(orderId) {
            const availableDrivers = allDrivers.filter(d => d.status === 'online' || d.status === 'offline');
            if (availableDrivers.length === 0) {
                alert('⚠️ Нет доступных водителей');
                return;
            }

            // Простое окно выбора
            const driverList = availableDrivers.map((d, i) =>
                `${i+1}. ${d.displayName} (${d.carModel || '—'} ${d.licensePlate || '—'})`
            ).join('\n');

            const choice = prompt(
                `Выберите водителя (введите номер):\n${driverList}`,
                '1'
            );

            if (!choice) return;
            const idx = parseInt(choice) - 1;
            if (isNaN(idx) || idx < 0 || idx >= availableDrivers.length) {
                alert('❌ Неверный выбор');
                return;
            }

            const driver = availableDrivers[idx];
            const orderRef = db.collection('orders').doc(orderId);
            orderRef.update({
                driverId: driver.uid,
                driverName: driver.displayName || 'Водитель',
                status: 'assigned',
                assignedAt: firebase.firestore.FieldValue.serverTimestamp(),
                assignedManually: true
            }).then(() => {
                alert(`✅ Водитель ${driver.displayName} назначен`);
            }).catch(err => {
                alert('❌ Ошибка: ' + err.message);
            });
        };

        // ============================================================
        // УДАЛЕНИЕ ЗАКАЗА
        // ============================================================
        window.deleteOrder = function(orderId) {
            if (!confirm('🗑️ Удалить заказ #' + orderId.substring(0, 8) + '?')) return;
            db.collection('orders').doc(orderId).delete()
                .then(() => alert('✅ Заказ удалён'))
                .catch(err => alert('❌ Ошибка: ' + err.message));
        };

        // ============================================================
        // СИМУЛЯЦИЯ ВОДИТЕЛЯ
        // ============================================================
        document.getElementById('simulateBtn').addEventListener('click', function() {
            const names = ['Алексей Петров', 'Мария Иванова', 'Сергей Сидоров', 'Дмитрий Козлов', 'Елена Смирнова'];
            const cars = ['Toyota Camry', 'Hyundai Solaris', 'Skoda Octavia', 'Kia Rio', 'Renault Logan'];
            const plates = ['А777МР77', 'К999КК99', 'Е123ЕЕ77', 'О777ОО77', 'Р555РР55'];

            const rand = Math.floor(Math.random() * names.length);
            const name = names[rand];
            const car = cars[rand];
            const plate = plates[rand];

            const newDriver = {
                role: 'driver',
                displayName: name,
                email: `driver_${Date.now()}@test.com`,
                balance: Math.floor(Math.random() * 500) + 50,
                rating: 4.5,
                bonus: 10,
                penalty: 0,
                premium: 0,
                totalEarned: 500,
                totalSpent: 0,
                driverData: {
                    location: {
                        lat: 32.0853 + (Math.random() - 0.5) * 0.05,
                        lng: 34.7818 + (Math.random() - 0.5) * 0.05
                    },
                    isAvailable: true,
                    carModel: car,
                    licensePlate: plate,
                    phone: `+972 50-${String(Math.floor(1000000 + Math.random() * 9000000)).slice(0, 7)}`
                },
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection('users').add(newDriver)
                .then(() => alert(`✅ Добавлен водитель: ${name}`))
                .catch(err => alert('❌ Ошибка: ' + err.message));
        });

        // ============================================================
        // ОБНОВЛЕНИЕ
        // ============================================================
        document.getElementById('refreshBtn').addEventListener('click', function() {
            // Просто перезагружаем подписки
            subscribeToOrders();
            subscribeToDrivers();
            alert('🔄 Данные обновлены');
        });

        // ============================================================
        // ПОДПИСКИ (REAL-TIME)
        // ============================================================
        function subscribeToOrders() {
            db.collection('orders').orderBy('createdAt', 'desc')
                .onSnapshot(snapshot => {
                    allOrders = [];
                    snapshot.forEach(doc => {
                        allOrders.push({ id: doc.id, ...doc.data() });
                    });
                    renderOrders();
                }, err => console.error('Orders error:', err));
        }

        function subscribeToDrivers() {
            db.collection('users').where('role', '==', 'driver')
                .onSnapshot(snapshot => {
                    allDrivers = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        allDrivers.push({
                            uid: doc.id,
                            displayName: data.displayName || 'Водитель',
                            balance: data.balance || 0,
                            status: data.driverData?.isAvailable ? 'online' : 'offline',
                            carModel: data.driverData?.carModel || '—',
                            licensePlate: data.driverData?.licensePlate || '—',
                            ...data
                        });
                    });
                    renderDrivers();
                }, err => console.error('Drivers error:', err));
        }

        // ============================================================
        // ВЫХОД
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', function() {
            auth.signOut().then(() => {
                window.location.href = 'index.html';
            });
        });

        // ============================================================
        // АВТОРИЗАЦИЯ
        // ============================================================
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            db.collection('users').doc(user.uid).get()
                .then(doc => {
                    if (doc.exists && doc.data().role === 'admin') {
                        subscribeToOrders();
                        subscribeToDrivers();
                        console.log('✅ Диспетчер авторизован');
                    } else {
                        alert('⛔ Доступ только для администраторов');
                        window.location.href = 'index.html';
                    }
                })
                .catch(() => {
                    window.location.href = 'index.html';
                });
        });

        console.log('✅ Панель диспетчера готова');
    </script>

</body>
</html>
