<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТСЖ - Управление домовладением</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e8f4f8 0%, #c5e5f7 50%, #6bb5ff 100%);
            padding: 24px 20px 50px;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Панель авторизации */
        .auth-panel {
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            padding: 15px 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 2px solid #ff8c42;
        }
        .edit-badge { background: #ff8c42; color: white; padding: 8px 20px; border-radius: 40px; font-weight: bold; }
        .view-badge { background: #64748b; color: white; padding: 8px 20px; border-radius: 40px; font-weight: bold; }
        .password-input { padding: 10px 15px; border-radius: 60px; border: 1px solid #cbd5e1; width: 200px; }
        .btn { background: #2c6e9e; border: none; padding: 10px 25px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; }
        .btn-danger { background: #dc2626; }
        .btn-outline { background: #e2e8f0; color: #1e293b; }
        
        .card {
            background: rgba(255,255,255,0.96);
            border-radius: 28px;
            padding: 1.5rem;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            border-right: 4px solid #ff8c42;
            padding-right: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .form-row input, .form-row select, .form-row textarea {
            padding: 10px 15px;
            border-radius: 60px;
            border: 1px solid #cbd5e1;
            font-family: inherit;
            flex: 1;
        }
        .form-row textarea { border-radius: 20px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 8px; text-align: right; border-bottom: 1px solid #e2e8f0; }
        .amount-income { color: #2f855a; font-weight: 700; }
        .amount-expense { color: #c53030; font-weight: 700; }
        .badge-income { background: #d4f5e2; padding: 4px 12px; border-radius: 20px; }
        .badge-expense { background: #ffe2e2; padding: 4px 12px; border-radius: 20px; }
        
        .photo-preview {
            max-width: 60px;
            max-height: 60px;
            border-radius: 8px;
            cursor: pointer;
        }
        .attachment-link {
            color: #2c6e9e;
            cursor: pointer;
            text-decoration: none;
        }
        .forum-message {
            background: #f8fafc;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            border-right: 3px solid #ff8c42;
        }
        .help-text {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 5px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 25px;
        }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .month-selector { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .month-btn { background: white; color: #1e293b; padding: 6px 18px; border-radius: 40px; cursor: pointer; border: 1px solid #cbd5e1; }
        .month-btn.active { background: #2c6e9e; color: white; border: none; }
    </style>
</head>
<body>
<div class="container">
    <!-- Панель авторизации -->
    <div class="auth-panel" id="authPanel">
        <div><i class="fas fa-shield-alt"></i> <strong>Доступ к редактированию</strong></div>
        <div id="authStatus"></div>
    </div>

    <div id="mainContent"></div>
</div>

<script>
    // ========== НАСТРОЙКИ ==========
    const EDITOR_PASSWORD = "admin123";  // Пароль для председателя ТСЖ
    
    // Состояние
    let isEditMode = false;
    let currentMonthFilter = 'all';
    
    // Данные (хранятся в localStorage)
    let payments = [];
    let expenses = [];
    let forum = [];
    let suggestions = [];
    
    // Временные данные для формы
    let tempPhotoUrl = '';
    let tempPhotoName = '';
    
    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    function initDefaultData() {
        if (localStorage.getItem('homesteadData')) return;
        payments = [
            { id: 'p1', payer: 'Иванов А. (кв.12)', month: '2025-04', amount: 4250 },
            { id: 'p2', payer: 'Петрова Е. (кв.5)', month: '2025-04', amount: 3850 }
        ];
        expenses = [
            { id: 'e1', desc: 'Ремонт подъезда', amount: 12300, month: '2025-04', photoUrl: '', photoName: '' },
            { id: 'e2', desc: 'Электричество МОП', amount: 2150, month: '2025-04', photoUrl: '', photoName: '' }
        ];
        forum = [
            { id: 'f1', author: 'Анна (кв.7)', text: 'Предлагаю установить камеры во дворе', timestamp: new Date() }
        ];
        suggestions = [
            { id: 's1', author: 'кв.15', title: 'Установить шлагбаум', up: 12, down: 2 }
        ];
        saveAll();
    }
    
    function saveAll() {
        localStorage.setItem('homesteadData', JSON.stringify({ payments, expenses, forum, suggestions }));
    }
    
    function loadAll() {
        let raw = localStorage.getItem('homesteadData');
        if (raw) {
            try {
                let d = JSON.parse(raw);
                payments = d.payments || [];
                expenses = d.expenses || [];
                forum = (d.forum || []).map(f => ({ ...f, timestamp: new Date(f.timestamp) }));
                suggestions = d.suggestions || [];
            } catch(e) {}
        } else {
            initDefaultData();
            loadAll();
        }
    }
    
    // ========== ФИЛЬТРАЦИЯ ==========
    function filterByMonth(items, monthField) {
        if (currentMonthFilter === 'all') return items;
        return items.filter(i => i[monthField] === currentMonthFilter);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    // ========== ПОМОЩНИК ДЛЯ GOOGLE DRIVE ==========
    function showGoogleDriveHelper() {
        const helpHtml = `
            <div style="background: #e6f7ff; border-radius: 20px; padding: 15px; margin-bottom: 15px;">
                <h4><i class="fab fa-google-drive"></i> Инструкция для председателя ТСЖ:</h4>
                <ol style="margin-right: 20px; line-height: 1.6;">
                    <li>Откройте <strong>Google Диск</strong> → папка <strong>Мой сайт домовладения/uploads/</strong></li>
                    <li>Нажмите <strong>Новый → Загрузить файлы</strong> и выберите фото/чек</li>
                    <li>Нажмите на загруженный файл → <strong>Поделиться</strong> → <strong>Копировать ссылку</strong></li>
                    <li>Вставьте ссылку в поле <strong>Ссылка на фото (Google Drive)</strong> ниже</li>
                    <li><strong>ВАЖНО:</strong> В ссылке замените часть <code>/file/d/</code> на <code>/uc?export=download&id=</code><br>
                    Пример: <code>https://drive.google.com/uc?export=download&id=ВАШ_ID_ФАЙЛА</code></li>
                </ol>
                <div class="help-text"><i class="fas fa-info-circle"></i> ID файла — это длинная строка между /d/ и /view в стандартной ссылке</div>
            </div>
        `;
        alert("📸 Для добавления фото:\n\n1. Загрузите фото в папку uploads на Google Диске\n2. Откройте фото → Поделиться → Копировать ссылку\n3. Вставьте ссылку в поле ниже\n4. ID файла находится между /d/ и /view");
        return helpHtml;
    }
    
    // Извлечение прямого URL из ссылки Google Drive
    function getGoogleDriveDirectUrl(driveUrl) {
        // Поддерживаем форматы:
        // https://drive.google.com/file/d/XYZ123/view
        // https://drive.google.com/uc?export=download&id=XYZ123
        let match = driveUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match) {
            return `https://drive.google.com/uc?export=download&id=${match[1]}`;
        }
        match = driveUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (match) {
            return `https://drive.google.com/uc?export=download&id=${match[1]}`;
        }
        return driveUrl; // вернуть как есть
    }
    
    // ========== РЕНДЕРИНГ ==========
    function renderAll() {
        // Фильтрованные данные
        let filteredPayments = filterByMonth(payments, 'month');
        let filteredExpenses = filterByMonth(expenses, 'month');
        
        let totalIncome = filteredPayments.reduce((s,p) => s + p.amount, 0);
        let totalExpense = filteredExpenses.reduce((s,e) => s + e.amount, 0);
        
        const html = `
            <!-- Выбор месяца -->
            <div class="card">
                <div class="card-title"><i class="fas fa-calendar-alt"></i> Фильтр по месяцам</div>
                <div class="month-selector" id="monthSelector">
                    <button class="month-btn ${currentMonthFilter === 'all' ? 'active' : ''}" data-month="all">Все месяцы</button>
                    <button class="month-btn ${currentMonthFilter === '2025-03' ? 'active' : ''}" data-month="2025-03">Март 2025</button>
                    <button class="month-btn ${currentMonthFilter === '2025-04' ? 'active' : ''}" data-month="2025-04">Апрель 2025</button>
                    <button class="month-btn ${currentMonthFilter === '2025-05' ? 'active' : ''}" data-month="2025-05">Май 2025</button>
                </div>
            </div>
            
            <div class="grid-2">
                <!-- Платежи жильцов -->
                <div class="card">
                    <div class="card-title"><i class="fas fa-hand-holding-usd"></i> Прием оплаты на содержание</div>
                    ${isEditMode ? `
                        <div class="form-row">
                            <input type="text" id="payerName" placeholder="ФИО плательщика (квартира)">
                            <input type="number" id="paymentAmount" placeholder="Сумма ₽">
                            <input type="month" id="paymentMonth" value="2025-04">
                            <button id="addPaymentBtn"><i class="fas fa-plus"></i> Добавить</button>
                        </div>
                    ` : '<div class="help-text" style="margin-bottom:15px;"><i class="fas fa-lock"></i> Только просмотр. Для редактирования введите пароль.</div>'}
                    
                    <div style="overflow-x:auto;">
                        <table style="width:100%">
                            <thead><tr><th>Плательщик</th><th>Период</th><th>Сумма</th></tr></thead>
                            <tbody id="paymentsBody">
                                ${filteredPayments.map(p => `
                                    <tr>
                                        <td>${escapeHtml(p.payer)}</td>
                                        <td>${p.month}</td>
                                        <td class="amount-income">${p.amount.toFixed(2)} ₽</td>
                                    </tr>
                                `).join('') || '<tr><td colspan="3">Нет платежей</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                    <div style="margin-top:15px; font-weight:bold;">💰 Всего доходов: ${totalIncome.toFixed(2)} ₽</div>
                </div>
                
                <!-- Расходы с фото -->
                <div class="card">
                    <div class="card-title"><i class="fas fa-receipt"></i> Расходы с чеками/фото</div>
                    ${isEditMode ? `
                        <div class="form-row">
                            <input type="text" id="expenseDesc" placeholder="Описание расхода">
                            <input type="number" id="expenseAmount" placeholder="Сумма ₽">
                            <input type="month" id="expenseMonth" value="2025-04">
                        </div>
                        <div class="form-row">
                            <input type="text" id="photoUrl" placeholder="Ссылка на фото (Google Drive)" style="flex:2;">
                            <button id="helpDriveBtn" class="btn-outline" style="padding:10px 15px;"><i class="fab fa-google-drive"></i> Как получить?</button>
                            <button id="addExpenseBtn"><i class="fas fa-plus"></i> Добавить</button>
                        </div>
                        <div class="help-text"><i class="fas fa-info-circle"></i> Вставьте ссылку на файл из Google Диска</div>
                    ` : '<div class="help-text" style="margin-bottom:15px;"><i class="fas fa-lock"></i> Только просмотр</div>'}
                    
                    <div style="overflow-x:auto; max-height: 400px; overflow-y:auto;">
                        <table style="width:100%">
                            <thead><tr><th>Описание</th><th>Период</th><th>Сумма</th><th>Чек/Фото</th></tr></thead>
                            <tbody id="expensesBody">
                                ${filteredExpenses.map(e => {
                                    const hasPhoto = e.photoUrl && e.photoUrl.length > 10;
                                    const directUrl = hasPhoto ? getGoogleDriveDirectUrl(e.photoUrl) : '';
                                    return `
                                        <tr>
                                            <td>${escapeHtml(e.desc)}</td>
                                            <td>${e.month}</td>
                                            <td class="amount-expense">${e.amount.toFixed(2)} ₽</td>
                                            <td>${hasPhoto ? `<a href="${directUrl}" target="_blank" class="attachment-link"><i class="fas fa-paperclip"></i> ${escapeHtml(e.photoName) || 'Посмотреть чек'}</a>` : '<span style="color:#94a3b8;">нет файла</span>'}</td>
                                        </tr>
                                    `;
                                }).join('') || '<tr><td colspan="4">Нет расходов</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                    <div style="margin-top:15px; display:flex; justify-content:space-between;">
                        <span>💸 Всего расходов: ${totalExpense.toFixed(2)} ₽</span>
                        <span>⚖️ Остаток: ${(totalIncome - totalExpense).toFixed(2)} ₽</span>
                    </div>
                </div>
            </div>
            
            <div class="grid-2">
                <!-- Форум жильцов -->
                <div class="card">
                    <div class="card-title"><i class="fas fa-comments"></i> Форум жильцов</div>
                    ${isEditMode ? `
                        <div class="form-row">
                            <input type="text" id="forumName" placeholder="Ваше имя">
                            <textarea id="forumMsg" rows="2" placeholder="Ваше сообщение..."></textarea>
                            <button id="postForumBtn"><i class="fas fa-paper-plane"></i> Отправить</button>
                        </div>
                    ` : ''}
                    <div id="forumContainer" style="max-height:300px; overflow:auto;">
                        ${forum.slice().reverse().map(f => `
                            <div class="forum-message">
                                <strong><i class="fas fa-user"></i> ${escapeHtml(f.author)}</strong>
                                <small>${new Date(f.timestamp).toLocaleDateString('ru-RU')}</small>
                                <div>${escapeHtml(f.text)}</div>
                            </div>
                        `).join('') || '<div>Нет сообщений</div>'}
                    </div>
                </div>
                
                <!-- Предложения -->
                <div class="card">
                    <div class="card-title"><i class="fas fa-lightbulb"></i> Предложения жильцов</div>
                    ${isEditMode ? `
                        <div class="form-row">
                            <input type="text" id="suggAuthor" placeholder="Автор (квартира)">
                            <input type="text" id="suggTitle" placeholder="Заголовок предложения">
                            <button id="addSuggestionBtn"><i class="fas fa-plus"></i> Добавить</button>
                        </div>
                    ` : ''}
                    <div id="suggestionsContainer">
                        ${suggestions.map(s => `
                            <div class="forum-message">
                                <div><strong>${escapeHtml(s.author)}</strong> предлагает: ${escapeHtml(s.title)}</div>
                                <div style="margin-top:8px;">
                                    <button class="vote-up" data-id="${s.id}" ${!isEditMode ? 'disabled' : ''} style="background:#eef2ff; color:#15803d; padding:4px 12px;"><i class="fas fa-thumbs-up"></i> ${s.up}</button>
                                    <button class="vote-down" data-id="${s.id}" ${!isEditMode ? 'disabled' : ''} style="background:#ffe4e2; color:#b91c1c; padding:4px 12px; margin-right:8px;"><i class="fas fa-thumbs-down"></i> ${s.down}</button>
                                </div>
                            </div>
                        `).join('') || '<div>Нет предложений</div>'}
                    </div>
                </div>
            </div>
        `;
        
        document.getElementById('mainContent').innerHTML = html;
        
        // Прикрепляем обработчики (только если режим редактирования)
        if (isEditMode) {
            attachEditHandlers();
        }
        attachMonthHandlers();
        attachVoteHandlers();
    }
    
    function attachEditHandlers() {
        // Добавление платежа
        const addPaymentBtn = document.getElementById('addPaymentBtn');
        if (addPaymentBtn) {
            addPaymentBtn.onclick = () => {
                let name = document.getElementById('payerName').value;
                let amount = parseFloat(document.getElementById('paymentAmount').value);
                let month = document.getElementById('paymentMonth').value;
                if (!name || isNaN(amount) || amount <= 0) {
                    alert("Введите корректные данные");
                    return;
                }
                payments.push({ id: 'p'+Date.now(), payer: name, month, amount });
                saveAll();
                renderAll();
                document.getElementById('payerName').value = '';
                document.getElementById('paymentAmount').value = '';
            };
        }
        
        // Добавление расхода с фото
        const addExpenseBtn = document.getElementById('addExpenseBtn');
        const helpDriveBtn = document.getElementById('helpDriveBtn');
        if (addExpenseBtn) {
            addExpenseBtn.onclick = () => {
                let desc = document.getElementById('expenseDesc').value;
                let amount = parseFloat(document.getElementById('expenseAmount').value);
                let month = document.getElementById('expenseMonth').value;
                let photoUrl = document.getElementById('photoUrl').value;
                
                if (!desc || isNaN(amount) || amount <= 0) {
                    alert("Введите описание и сумму");
                    return;
                }
                
                // Извлекаем имя файла из ссылки (для отображения)
                let photoName = '';
                if (photoUrl) {
                    const match = photoUrl.match(/id=([a-zA-Z0-9_-]+)/);
                    if (match) photoName = `чек_${match[1].substring(0,8)}`;
                    else photoName = 'чек_google_drive';
                }
                
                expenses.push({
                    id: 'e'+Date.now(),
                    desc: desc,
                    amount: amount,
                    month: month,
                    photoUrl: photoUrl,
                    photoName: photoName
                });
                saveAll();
                renderAll();
                document.getElementById('expenseDesc').value = '';
                document.getElementById('expenseAmount').value = '';
                document.getElementById('photoUrl').value = '';
            };
        }
        
        if (helpDriveBtn) {
            helpDriveBtn.onclick = () => {
                showGoogleDriveHelper();
                alert("📸 Инструкция:\n\n1. Загрузите фото в папку 'uploads' на Google Диске\n2. Откройте фото → Поделиться → Копировать ссылку\n3. Вставьте ссылку в поле выше\n\nПример правильной ссылки:\nhttps://drive.google.com/uc?export=download&id=ВАШ_ID");
            };
        }
        
        // Форум
        const postForumBtn = document.getElementById('postForumBtn');
        if (postForumBtn) {
            postForumBtn.onclick = () => {
                let author = document.getElementById('forumName').value;
                let msg = document.getElementById('forumMsg').value;
                if (!author || !msg) {
                    alert("Введите имя и сообщение");
                    return;
                }
                forum.push({ id: 'f'+Date.now(), author, text: msg, timestamp: new Date() });
                saveAll();
                renderAll();
                document.getElementById('forumName').value = '';
                document.getElementById('forumMsg').value = '';
            };
        }
        
        // Предложения
        const addSuggestionBtn = document.getElementById('addSuggestionBtn');
        if (addSuggestionBtn) {
            addSuggestionBtn.onclick = () => {
                let author = document.getElementById('suggAuthor').value;
                let title = document.getElementById('suggTitle').value;
                if (!author || !title) {
                    alert("Введите автора и предложение");
                    return;
                }
                suggestions.push({ id: 's'+Date.now(), author, title, up: 0, down: 0 });
                saveAll();
                renderAll();
                document.getElementById('suggAuthor').value = '';
                document.getElementById('suggTitle').value = '';
            };
        }
    }
    
    function attachMonthHandlers() {
        document.querySelectorAll('.month-btn').forEach(btn => {
            btn.onclick = () => {
                currentMonthFilter = btn.dataset.month;
                renderAll();
            };
        });
    }
    
    function attachVoteHandlers() {
        document.querySelectorAll('.vote-up').forEach(btn => {
            btn.onclick = () => {
                if (!isEditMode) {
                    alert("Голосование доступно только в режиме редактирования. Введите пароль.");
                    return;
                }
                let sug = suggestions.find(s => s.id === btn.dataset.id);
                if (sug) { sug.up++; saveAll(); renderAll(); }
            };
        });
        document.querySelectorAll('.vote-down').forEach(btn => {
            btn.onclick = () => {
                if (!isEditMode) {
                    alert("Голосование доступно только в режиме редактирования. Введите пароль.");
                    return;
                }
                let sug = suggestions.find(s => s.id === btn.dataset.id);
                if (sug) { sug.down++; saveAll(); renderAll(); }
            };
        });
    }
    
    // ========== АВТОРИЗАЦИЯ ==========
    function renderAuthPanel() {
        const authHtml = `
            ${isEditMode ? 
                `<div class="edit-badge"><i class="fas fa-edit"></i> Режим редактирования</div>
                 <button id="logoutBtn" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> Выйти</button>`
                :
                `<div class="view-badge"><i class="fas fa-eye"></i> Режим просмотра</div>
                 <div style="display:flex; gap:10px;">
                     <input type="password" id="passwordInput" class="password-input" placeholder="Введите пароль">
                     <button id="loginBtn" class="btn"><i class="fas fa-key"></i> Войти как редактор</button>
                 </div>`
            }
        `;
        document.getElementById('authStatus').innerHTML = authHtml;
        
        if (!isEditMode) {
            const loginBtn = document.getElementById('loginBtn');
            const passwordInput = document.getElementById('passwordInput');
            if (loginBtn) {
                loginBtn.onclick = () => {
                    if (passwordInput.value === EDITOR_PASSWORD) {
                        isEditMode = true;
                        renderAuthPanel();
                        renderAll();
                    } else {
                        alert("Неверный пароль! Доступ только для председателя ТСЖ.");
                    }
                };
            }
        } else {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.onclick = () => {
                    isEditMode = false;
                    renderAuthPanel();
                    renderAll();
                };
            }
        }
    }
    
    // ========== ЗАПУСК ==========
    loadAll();
    renderAuthPanel();
    renderAll();
</script>
</body>
</html>
