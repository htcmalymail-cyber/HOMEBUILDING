        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.05) 0%, transparent 45%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(18, 22, 28, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 30px 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
        }

        /* ===== ЯЗЫКОВОЙ ПЕРЕКЛЮЧАТЕЛЬ ===== */
        .lang-switcher {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 4px 12px;
            color: #8899aa;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .lang-btn .globe {
            font-size: 18px;
        }

        .lang-dropdown {
            position: absolute;
            top: 48px;
            right: 0;
            background: rgba(18, 22, 28, 0.96);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 6px 0;
            min-width: 130px;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .lang-dropdown.open {
            display: block;
        }

        .lang-dropdown .item {
            padding: 8px 16px;
            color: #e0e8f0;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .lang-dropdown .item:last-child {
            border-bottom: none;
        }

        .lang-dropdown .item:hover {
            background: rgba(255, 180, 0, 0.08);
            color: #ffb000;
        }

        .lang-dropdown .item .flag {
            font-size: 20px;
        }

        /* ===== ОСТАЛЬНЫЕ СТИЛИ (без изменений) ===== */
        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #ffb000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .logo p {
            color: #8899aa;
            font-size: 14px;
            margin-top: 4px;
            transition: all 0.3s;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .tab {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 11px;
            background: transparent;
            color: #8899aa;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .tab.active {
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            box-shadow: 0 2px 12px rgba(255, 160, 0, 0.15);
        }

        .tab:hover:not(.active) {
            color: #ffffff;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #b0c0d0;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #ffb000;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(255, 180, 0, 0.06);
        }

        .input-group input::placeholder {
            color: #556677;
        }

        .input-group select option {
            background: #1a1e26;
            color: #ffffff;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 4px 16px rgba(255, 140, 0, 0.2);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 140, 0, 0.35);
        }

        .btn-submit:active {
            transform: scale(0.97);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            text-align: center;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.15);
            display: block;
        }

        .message.success {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.15);
            display: block;
        }

        .message.info {
            background: rgba(255, 180, 0, 0.1);
            color: #ffb000;
            border: 1px solid rgba(255, 180, 0, 0.15);
            display: block;
        }

        .switch-link {
            margin-top: 14px;
            font-size: 14px;
            color: #8899aa;
            text-align: center;
        }

        .switch-link a {
            color: #ffb000;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .switch-link a:hover {
            color: #ffcc44;
        }

        .features {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .feature {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .feature .icon {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .feature .title {
            font-size: 11px;
            font-weight: 600;
            color: #e0e8f0;
        }

        .feature .desc {
            font-size: 10px;
            color: #667788;
        }

        .home-indicator {
            width: 100px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            margin: 16px auto 0;
        }

        /* ===== АДАПТИВ ДЛЯ RTL (иврит) ===== */
        body[dir="rtl"] .lang-switcher {
            right: auto;
            left: 16px;
        }

        body[dir="rtl"] .lang-dropdown {
            right: auto;
            left: 0;
        }

        body[dir="rtl"] .container {
            direction: rtl;
        }

        body[dir="rtl"] .input-group label {
            text-align: right;
        }

        body[dir="rtl"] .switch-link {
            direction: rtl;
        }

        @media (max-width: 420px) {
            .container {
                border-radius: 0;
                padding: 20px 16px;
                min-height: 100vh;
                background: rgba(10, 12, 16, 0.96);
                border: none;
            }
            .logo h1 {
                font-size: 28px;
            }
            .lang-switcher {
                top: 12px;
                right: 12px;
            }
            body[dir="rtl"] .lang-switcher {
                right: auto;
                left: 12px;
            }
        }
    </style>
</head>
<body id="bodyRoot">

    <div class="container">

        function switchForm(form) {
            tabs.forEach(t => t.classList.remove('active'));
            if (form === 'login') {
                document.querySelector('.tab[data-form="login"]').classList.add('active');
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
            } else {
                document.querySelector('.tab[data-form="register"]').classList.add('active');
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
            }
            loginMsg.className = 'message';
            registerMsg.className = 'message';
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => switchForm(tab.getAttribute('data-form')));
        });

        document.getElementById('switchToRegister').addEventListener('click', () => switchForm('register'));

        let currentLang = 'ru';

        function applyLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            // Обновляем атрибут lang у html
            document.getElementById('htmlRoot').lang = lang;

            // Направление текста для иврита

            // Но они уже имеют плейсхолдеры на русском, для простоты оставим как есть,
            // можно добавить отдельные атрибуты, но сейчас не критично.

            // Обновляем метку текущего языка
            document.getElementById('currentLangLabel').textContent = lang.toUpperCase();

            // Закрываем дропдаун
            document.getElementById('langDropdown').classList.remove('open');

            // Сохраняем выбор в localStorage
            localStorage.setItem('wheel_lang', lang);
        }

        // Переключатель: открыть/закрыть дропдаун
        document.getElementById('langToggle').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('langDropdown').classList.toggle('open');
        });

        // Выбор языка из дропдауна
        document.querySelectorAll('.lang-dropdown .item').forEach(item => {
            item.addEventListener('click', () => {
                const lang = item.getAttribute('data-lang');
                applyLanguage(lang);
            });
        });

        // Закрыть дропдаун при клике вне его
        document.addEventListener('click', () => {
            document.getElementById('langDropdown').classList.remove('open');
        });

        // Восстановить язык из localStorage
        const savedLang = localStorage.getItem('wheel_lang');
        if (savedLang && translations[savedLang]) {
            applyLanguage(savedLang);
        } else {
            // По умолчанию русский
            applyLanguage('ru');
        }

        // ============================================================
        // ВХОД (с учетом языка сообщений)
        // ============================================================
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const t = translations[currentLang];

            if (!email || !password) {
                showMessage(loginMsg, t.fill_fields, 'error');
                return;
            }

            loginMsg.className = 'message';
            loginMsg.textContent = t.loading;
            document.getElementById('loginBtn').disabled = true;

            try {
                const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                const doc = await firebase.firestore().collection('users').doc(user.uid).get();
                let role = 'client';
                if (doc.exists) {
                    role = doc.data().role || 'client';
                }

                showMessage(loginMsg, t.login_success, 'success');

                setTimeout(() => {
                    let redirect = 'cabinet.html';
                    if (role === 'admin') redirect = 'dispatcher.html';
                    else if (role === 'driver') redirect = 'driver.html';
                    window.location.href = redirect;
                }, 800);

            } catch (error) {
                let msg = t.login_error;
                if (error.code === 'auth/user-not-found') msg = t.user_not_found;
                else if (error.code === 'auth/wrong-password') msg = t.wrong_password;
                else if (error.code === 'auth/invalid-email') msg = t.invalid_email;
                showMessage(loginMsg, msg, 'error');
            } finally {
                document.getElementById('loginBtn').disabled = false;
            }
        });

        // ============================================================
        // РЕГИСТРАЦИЯ (с учетом языка сообщений)
        // ============================================================
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const role = document.getElementById('regRole').value;
            const t = translations[currentLang];

            if (!name || !email || !password) {
                showMessage(registerMsg, t.fill_fields, 'error');
                return;
            }
            if (password.length < 6) {
                showMessage(registerMsg, t.password_min, 'error');
                return;
            }

            registerMsg.className = 'message';
            registerMsg.textContent = t.loading;
            document.getElementById('registerBtn').disabled = true;

            try {
                const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                await firebase.firestore().collection('users').doc(user.uid).set({
                    uid: user.uid,
                    email: user.email,
                    role: role,
                    displayName: name,
                    balance: 0,
                    rating: 0,
                    bonus: 0,
                    penalty: 0,
                    premium: 0,
                    totalEarned: 0,
                    totalSpent: 0,
                    driverData: null,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showMessage(registerMsg, t.register_success, 'success');

                setTimeout(() => {
                    switchForm('login');
                    document.getElementById('loginEmail').value = email;
                }, 1200);

            } catch (error) {
                let msg = t.register_error;
                if (error.code === 'auth/email-already-in-use') {
                    msg = t.email_exists;
                    document.getElementById('loginEmail').value = email;
                    setTimeout(() => switchForm('login'), 800);
                } else if (error.code === 'auth/weak-password') {
                    msg = t.weak_password;
                }
                showMessage(registerMsg, msg, 'error');
            } finally {
                document.getElementById('registerBtn').disabled = false;
            }
        });

        // ============================================================
        // ПРОВЕРКА АВТОРИЗАЦИИ
        // ============================================================
        firebase.auth().onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const doc = await firebase.firestore().collection('users').doc(user.uid).get();
                    if (doc.exists) {
                        const role = doc.data().role || 'client';
                        const path = window.location.pathname;
                        if (path === '/' || path === '/index.html' || path.endsWith('/index.html')) {
                            let redirect = 'cabinet.html';
                            if (role === 'admin') redirect = 'dispatcher.html';
                            else if (role === 'driver') redirect = 'driver.html';
                            window.location.href = redirect;
                        }
                    }
                } catch (e) {
                    console.warn('Ошибка проверки роли:', e);
                }
            }
        });
    </script>

</body>
</html>
