        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.08) 0%, transparent 40%),

        body[dir="rtl"] .phone-frame {

        .phone-frame {

                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
        }

        /* Переключатель языков */
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 24px;
            z-index: 10;
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        body[dir="rtl"] .lang-switcher {
            right: auto;
            left: 24px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #8899aa;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .lang-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(255, 160, 0, 0.3);
        }

        /* Логотип */
        .logo-icon {
            margin-top: 50px;
            margin-bottom: 12px;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 30px rgba(255, 160, 0, 0.3);
            position: relative;
        }

        .logo-icon::after {
            content: "";

            width: 25px;

            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3);
        }

        .logo-icon svg {
            width: 50px;
            height: 50px;
            fill: white;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 6px;
            background: linear-gradient(to right, #ffffff, #ffb000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
        }

        .slogan {
            font-size: 16px;
            font-weight: 600;
            color: #ffb000;
            margin-bottom: 36px;

        @keyframes bounce {
            from { transform: translateY(0); }

        /* Кнопка заказа */
        .cta-button {

            background: linear-gradient(135deg, #ffb000, #ff6a00);
            border: none;
            border-radius: 20px;
            padding: 20px 24px;
            font-size: 20px;
            font-weight: 700;
            color: #0a0c10;
            text-decoration: none;
            display: flex;

        /* Преимущества */

        .feature-icon {

        /* Точка входа для водителей */
        .driver-entry {
            margin-top: auto;

            font-weight: 500;

            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;

            color: #ffb000;

        /* Статус водителя */

            margin-top: 12px;

        }

        .driver-status.active {
            display: block;

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            background: rgba(0,0,0,0.8);

        .modal-content {
            background: #12161c;

        .modal-content h2 {
            font-size: 22px;
            margin-bottom: 20px;

        }

        .modal-content input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 16px;
            outline: none;
            text-align: left;
        }

        body[dir="rtl"] .modal-content input {
            text-align: right;
        }

        .modal-content input:focus {
            border-color: #ffb000;
        }

        .modal-content button {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }

        .close-modal {
            background: transparent;
            color: #8899aa;
            border: none;
            margin-top: 12px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }

        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .error-msg.active {
            display: block;
        }

        .home-indicator {
            margin-top: 12px;
            width: 130px;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
        }

        @media (max-width: 420px) {
            .phone-frame {
                border-radius: 0;
                padding: 16px 20px 24px;
                background: rgba(10, 12, 16, 0.95);
                backdrop-filter: blur(15px);
                box-shadow: none;
                border: none;
            }
            .lang-switcher {
                top: 16px;
                right: 20px;
            }
            body[dir="rtl"] .lang-switcher {
                left: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="phone-frame">

        <!-- Точка входа для водителей -->
        <button class="driver-entry" id="driverBtn">

        <div class="home-indicator"></div>

    <!-- Модальное окно входа -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h2 data-i18n="loginTitle">🚖 Вход для водителей</h2>
            <input type="email" id="emailInput" data-i18n-placeholder="emailPlaceholder" placeholder="Email" autocomplete="email">
            <input type="password" id="passwordInput" data-i18n-placeholder="passPlaceholder" placeholder="Пароль" autocomplete="current-password">
            <button id="loginSubmit" data-i18n="loginBtn">Войти</button>
            <div class="error-msg" id="loginError"></div>
            <button class="close-modal" id="closeModal" data-i18n="cancel">Отмена</button>
            <p style="font-size:11px; color:#667788; margin-top:12px;" data-i18n="noAccount">
                Нет аккаунта? Обратитесь к администратору
            </p>
        </div>
    </div>

    <script>
        // ============ ПЕРЕВОДЫ ============
        const translations = {
            he: {
                slogan: "אנחנו כבר בדרך אליכם",
                orderBtn: "הזמן עכשיו",
                noReg: "ללא הרשמה — פשוט סמן נקודה על המפה",
                feat1Title: "מהיר",
                feat1Desc: "הגעה תוך 2 דק׳",
                feat2Title: "אמין",
                feat2Desc: "נהגים מאומתים",
                feat3Title: "הוגן",
                feat3Desc: "מחיר ללא הפתעות",
                driverEntry: "אני נהג",
                loggedIn: "✅ התחברת כנהג",
                logout: "התנתק",
                goToPanel: "עבור לפאנל",
                loginTitle: "🚖 כניסת נהגים",
                emailPlaceholder: "אימייל",
                passPlaceholder: "סיסמה",
                loginBtn: "התחבר",
                cancel: "ביטול",
                noAccount: "אין לך חשבון? פנה למנהל המערכת",
                notDriver: "אינך רשום כנהג במערכת. צור קשר עם המנהל.",
                loginError: "שגיאת התחברות. בדוק אימייל וסיסמה."
            },
            ar: {
                slogan: "نحن في طريقنا إليك",
                orderBtn: "اطلب الآن",
                noReg: "بدون تسجيل — فقط حدد النقطة على الخريطة",
                feat1Title: "فوري",
                feat1Desc: "وصول خلال دقيقتين",
                feat2Title: "موثوق",
                feat2Desc: "سائقون معتمدون",
                feat3Title: "شفاف",
                feat3Desc: "سعر بدون مفاجآت",
                driverEntry: "أنا سائق",
                loggedIn: "✅ تم تسجيل دخولك كسائق",
                logout: "تسجيل خروج",
                goToPanel: "اذهب إلى اللوحة",
                loginTitle: "🚖 دخول السائقين",
                emailPlaceholder: "البريد الإلكتروني",
                passPlaceholder: "كلمة المرور",
                loginBtn: "دخول",
                cancel: "إلغاء",
                noAccount: "ليس لديك حساب؟ اتصل بالمسؤول",
                notDriver: "أنت غير مسجل كسائق. اتصل بالمسؤول.",
                loginError: "خطأ في تسجيل الدخول. تحقق من البريد الإلكتروني وكلمة المرور."
            },
            en: {
                slogan: "We're already on our way",
                orderBtn: "Order now",
                noReg: "No registration — just point on the map",
                feat1Title: "Instant",
                feat1Desc: "Arrival in 2 min",
                feat2Title: "Reliable",
                feat2Desc: "Verified drivers",
                feat3Title: "Honest",
                feat3Desc: "No hidden fees",
                driverEntry: "I'm a driver",
                loggedIn: "✅ Logged in as driver",
                logout: "Log out",
                goToPanel: "Go to panel",
                loginTitle: "🚖 Driver login",
                emailPlaceholder: "Email",
                passPlaceholder: "Password",
                loginBtn: "Sign in",
                cancel: "Cancel",
                noAccount: "No account? Contact admin",
                notDriver: "You are not registered as a driver. Contact admin.",
                loginError: "Login error. Check email and password."
            }
        };

        let currentLang = 'en';

        function switchLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });

            if (lang === 'ar' || lang === 'he') {
                document.body.setAttribute('dir', 'rtl');
                document.documentElement.lang = lang;
            } else {
                document.body.setAttribute('dir', 'ltr');
                document.documentElement.lang = 'en';
            }

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-lang') === lang) btn.classList.add('active');
            });

            localStorage.setItem('wheel_lang', lang);
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => switchLanguage(btn.getAttribute('data-lang')));
        });

        const savedLang = localStorage.getItem('wheel_lang');
        if (savedLang && translations[savedLang]) switchLanguage(savedLang);

        // ============ FIREBASE: ВХОД ВОДИТЕЛЯ ============
        window.addEventListener('load', () => {
            const driverBtn = document.getElementById('driverBtn');
            const loginModal = document.getElementById('loginModal');
            const closeModal = document.getElementById('closeModal');
            const loginSubmit = document.getElementById('loginSubmit');
            const emailInput = document.getElementById('emailInput');
            const passwordInput = document.getElementById('passwordInput');
            const driverStatus = document.getElementById('driverStatus');
            const driverEmail = document.getElementById('driverEmail');
            const logoutBtn = document.getElementById('logoutBtn');
            const loginError = document.getElementById('loginError');

            driverBtn.addEventListener('click', () => {
                loginModal.classList.add('active');
                loginError.classList.remove('active');
            });

            closeModal.addEventListener('click', () => loginModal.classList.remove('active'));
            loginModal.addEventListener('click', (e) => {
                if (e.target === loginModal) loginModal.classList.remove('active');
            });

            // Вход
            loginSubmit.addEventListener('click', async () => {
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                loginError.classList.remove('active');

                if (!email || !password) {
                    loginError.textContent = translations[currentLang].loginError;
                    loginError.classList.add('active');
                    return;
                }

                try {
                    loginSubmit.textContent = '...';
                    loginSubmit.disabled = true;

                    const auth = window.firebaseAuth;
                    const signIn = window.signInWithEmailAndPassword;
                    const userCredential = await signIn(auth, email, password);
                    const user = userCredential.user;

                    // Проверка: есть ли водитель в Firestore
                    const db = window.firebaseDb;
                    const docFn = window.doc;
                    const getDocFn = window.getDoc;
                    const driverDoc = await getDocFn(docFn(db, 'drivers', user.uid));

                    if (!driverDoc.exists()) {
                        await window.signOut(auth);
                        loginError.textContent = translations[currentLang].notDriver;
                        loginError.classList.add('active');
                        return;
                    }

                    const driverData = driverDoc.data();

                    // Обновить статус
                    await window.updateDoc(docFn(db, 'drivers', user.uid), {
                        status: 'online',
                        lastUpdated: window.serverTimestamp()
                    });

                    // Показать статус
                    driverStatus.classList.add('active');
                    driverEmail.textContent = driverData.fullName || user.email;
                    driverBtn.style.display = 'none';
                    loginModal.classList.remove('active');
                    emailInput.value = '';
                    passwordInput.value = '';

                } catch (error) {
                    console.error('Login error:', error);
                    loginError.textContent = translations[currentLang].loginError;
                    loginError.classList.add('active');
                } finally {
                    loginSubmit.textContent = translations[currentLang].loginBtn;
                    loginSubmit.disabled = false;
                }
            });

            // Выход
            logoutBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                const user = window.firebaseAuth.currentUser;
                if (user) {
                    await window.updateDoc(window.doc(window.firebaseDb, 'drivers', user.uid), {
                        status: 'offline',
                        lastUpdated: window.serverTimestamp()
                    });
                }
                await window.signOut(window.firebaseAuth);
                driverStatus.classList.remove('active');
                driverBtn.style.display = 'block';
            });

            // Проверка при загрузке
            window.onAuthStateChanged(window.firebaseAuth, async (user) => {
                if (user) {
                    const driverDoc = await window.getDoc(window.doc(window.firebaseDb, 'drivers', user.uid));
                    if (driverDoc.exists()) {
                        driverStatus.classList.add('active');
                        driverEmail.textContent = driverDoc.data().fullName || user.email;
                        driverBtn.style.display = 'none';
                    } else {
                        await window.signOut(window.firebaseAuth);
                    }
                }
            });
        });
    </script>
</body>
</html>
