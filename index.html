<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>🚕 Taxi AI Platform – v0.3 (ближайший водитель)</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
    .card { border: 1px solid #ccc; padding: 20px; margin: 15px 0; border-radius: 10px; background: #f9f9f9; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
    button:hover { background: #0056b3; }
    input, select { padding: 8px; margin: 5px; width: 90%; }
    .hidden { display: none; }
    .role-select { display: flex; gap: 15px; align-items: center; }
  </style>
</head>
<body>

<h1>🚕 Taxi AI Platform <span style="font-size:14px;">v0.3 – ближайший водитель</span></h1>

<!-- Блок авторизации -->
<div id="auth-section" class="card">
  <h3>Вход / Регистрация</h3>
  <input type="email" id="email" placeholder="Email" value="driver@taxi.com">
  <input type="password" id="password" placeholder="Пароль" value="123456">
  <div class="role-select">
    <label>Роль при регистрации:</label>
    <select id="reg-role">
      <option value="client">Клиент</option>
      <option value="driver" selected>Водитель</option>
    </select>
  </div>
  <br>
  <button onclick="signUp()">Зарегистрироваться</button>
  <button onclick="signIn()">Войти</button>
  <button onclick="signOut()">Выйти</button>
  <p id="user-status">Не авторизован</p>
  <p id="user-role"></p>
</div>

<!-- Панель клиента -->
<div id="client-section" class="card hidden">
  <h3>📱 Клиент — создать заказ</h3>
  <input id="from" placeholder="Откуда (адрес)" value="Красная площадь, Москва">
  <input id="to" placeholder="Куда (адрес)" value="Вокзал">
  <div style="display: flex; gap: 10px;">
    <input id="from-lat" placeholder="Широта отправления" value="55.7539" style="width:45%;">
    <input id="from-lng" placeholder="Долгота отправления" value="37.6208" style="width:45%;">
  </div>
  <button onclick="createOrder()">🚖 Заказать такси</button>
  <p id="order-status"></p>
</div>

<!-- Панель диспетчера -->
<div id="dispatcher-section" class="card hidden">
  <h3>📋 Диспетчер — все заказы</h3>
  <button onclick="loadOrders()">Обновить список</button>
  <div id="order-list"></div>
</div>

<!-- Панель водителя -->
<div id="driver-section" class="card hidden">
  <h3>🚗 Водитель — мои заказы</h3>
  <button onclick="loadDriverOrders()">Обновить</button>
  <div id="driver-orders"></div>
  <br>
  <div style="display: flex; gap: 10px; flex-wrap: wrap;">
    <button onclick="updateLocation()">📍 Обновить местоположение</button>
    <button onclick="toggleAvailability()">🔄 Доступен/Недоступен</button>
    <button onclick="completeOrder()">✅ Завершить последний заказ</button>
  </div>
  <p id="driver-status"></p>
  <p id="driver-location"></p>
</div>

<script>
  // ================= КОНФИГ FIREBASE =================
  const firebaseConfig = {
    apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
    authDomain: "taxi-ai-app-69628.firebaseapp.com",
    projectId: "taxi-ai-app-69628",
    storageBucket: "taxi-ai-app-69628.firebasestorage.app",
    messagingSenderId: "952357992434",
    appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
    measurementId: "G-Z9NJFSSXH6"
  };
  // ===================================================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  let currentUser = null;
  let currentUserData = null;

  // ========== ОТСЛЕЖИВАНИЕ ВХОДА ==========
  auth.onAuthStateChanged(function(user) {
    if (user) {
      currentUser = user;
      document.getElementById('user-status').innerHTML = '✅ Вошёл: ' + user.email;
      db.collection('users').doc(user.uid).get()
        .then(function(doc) {
          if (doc.exists) {
            currentUserData = doc.data();
            var role = currentUserData.role || 'client';
            document.getElementById('user-role').innerHTML = 'Роль: ' + role;
            document.getElementById('client-section').classList.add('hidden');
            document.getElementById('dispatcher-section').classList.add('hidden');
            document.getElementById('driver-section').classList.add('hidden');
            if (role === 'client') {
              document.getElementById('client-section').classList.remove('hidden');
            } else if (role === 'dispatcher') {
              document.getElementById('dispatcher-section').classList.remove('hidden');
              loadOrders();
            } else if (role === 'driver') {
              document.getElementById('driver-section').classList.remove('hidden');
              loadDriverOrders();
              updateDriverStatus();
              updateLocationDisplay();
            } else {
              document.getElementById('client-section').classList.remove('hidden');
            }
          } else {
            // Если документа нет – создаём с ролью по умолчанию
            var defaultRole = 'client';
            db.collection('users').doc(user.uid).set({
              email: user.email,
              name: 'Новый пользователь',
              role: defaultRole,
              phone: '',
              available: false,
              lat: 0,
              lng: 0,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
              // Перезагружаем данные
              location.reload();
            });
          }
        })
        .catch(function(error) {
          console.error('Ошибка загрузки данных пользователя:', error);
        });
    } else {
      currentUser = null;
      currentUserData = null;
      document.getElementById('user-status').innerHTML = '❌ Не авторизован';
      document.getElementById('user-role').innerHTML = '';
      document.getElementById('client-section').classList.add('hidden');
      document.getElementById('dispatcher-section').classList.add('hidden');
      document.getElementById('driver-section').classList.add('hidden');
    }
  });

  // ========== АУТЕНТИФИКАЦИЯ ==========
  function signUp() {
    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;
    var role = document.getElementById('reg-role').value;
    auth.createUserWithEmailAndPassword(email, password)
      .then(function(cred) {
        alert('Регистрация успешна! Теперь войдите.');
        return db.collection('users').doc(cred.user.uid).set({
          email: email,
          name: 'Новый пользователь',
          role: role,
          phone: '',
          available: (role === 'driver') ? true : false,
          lat: 0,
          lng: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      })
      .then(function() {
        alert('Документ создан. Войдите с этими данными.');
        // Если водитель – предложим обновить координаты
        if (role === 'driver') {
          alert('Как водитель, обновите ваше местоположение через кнопку "Обновить местоположение" после входа.');
        }
      })
      .catch(function(error) {
        alert('Ошибка регистрации: ' + error.message);
      });
  }

  function signIn() {
    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;
    auth.signInWithEmailAndPassword(email, password)
      .then(function() {
        alert('Вход выполнен');
      })
      .catch(function(error) {
        alert('Ошибка входа: ' + error.message);
      });
  }

  function signOut() {
    auth.signOut();
  }

  // ========== ФУНКЦИЯ РАСЧЁТА РАССТОЯНИЯ (гаверсинус) ==========
  function getDistance(lat1, lon1, lat2, lon2) {
    var R = 6371; // км
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c; // расстояние в км
  }

  // ========== КЛИЕНТ: СОЗДАНИЕ ЗАКАЗА ==========
  function createOrder() {
    if (!currentUser) {
      alert('Сначала войдите!');
      return;
    }
    var from = document.getElementById('from').value;
    var to = document.getElementById('to').value;
    var fromLat = parseFloat(document.getElementById('from-lat').value);
    var fromLng = parseFloat(document.getElementById('from-lng').value);
    if (isNaN(fromLat) || isNaN(fromLng)) {
      alert('Введите корректные координаты отправления (числа)');
      return;
    }

    db.collection('orders').add({
      clientId: currentUser.uid,
      clientEmail: currentUser.email,
      from: from,
      to: to,
      fromLat: fromLat,
      fromLng: fromLng,
      status: 'created',
      price: Math.round(Math.random() * 300 + 100),
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      aiNote: 'Поиск ближайшего водителя...'
    })
    .then(function(docRef) {
      document.getElementById('order-status').innerHTML = '✅ Заказ создан! ИИ ищет ближайшего водителя...';
      return assignNearestDriver(docRef.id, fromLat, fromLng);
    })
    .then(function() {
      document.getElementById('order-status').innerHTML = '✅ Водитель назначен!';
      if (!document.getElementById('dispatcher-section').classList.contains('hidden')) {
        loadOrders();
      }
      if (currentUserData && currentUserData.role === 'driver') {
        loadDriverOrders();
      }
    })
    .catch(function(error) {
      alert('Ошибка: ' + error.message);
    });
  }

  // ========== ИИ-ДИСПЕТЧЕР: НАЗНАЧЕНИЕ БЛИЖАЙШЕГО ВОДИТЕЛЯ ==========
  function assignNearestDriver(orderId, fromLat, fromLng) {
    // Получаем всех свободных водителей
    return db.collection('users')
      .where('role', '==', 'driver')
      .where('available', '==', true)
      .get()
      .then(function(snapshot) {
        if (snapshot.empty) {
          // Нет свободных водителей
          return db.collection('orders').doc(orderId).update({
            status: 'waiting',
            aiNote: 'Нет свободных водителей'
          })
          .then(function() {
            return db.collection('ai_logs').add({
              orderId: orderId,
              decision: 'Нет свободных водителей',
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
          });
        }

        // Находим ближайшего
        var nearestDriver = null;
        var nearestDist = Infinity;
        snapshot.forEach(function(doc) {
          var data = doc.data();
          // Проверяем, есть ли координаты
          if (data.lat && data.lng) {
            var dist = getDistance(fromLat, fromLng, data.lat, data.lng);
            if (dist < nearestDist) {
              nearestDist = dist;
              nearestDriver = { id: doc.id, data: data, distance: dist };
            }
          }
        });

        if (!nearestDriver) {
          // Водители есть, но у них нет координат
          return db.collection('orders').doc(orderId).update({
            status: 'error',
            aiNote: 'У водителей нет координат'
          });
        }

        // Назначаем ближайшего
        var driverId = nearestDriver.id;
        var driverData = nearestDriver.data;
        return db.collection('orders').doc(orderId).update({
          driverId: driverId,
          driverEmail: driverData.email,
          status: 'assigned',
          aiNote: 'Назначен ближайший водитель ' + driverData.email + ' (расстояние ' + nearestDist.toFixed(2) + ' км)'
        })
        .then(function() {
          // Делаем водителя недоступным
          return db.collection('users').doc(driverId).update({
            available: false
          });
        })
        .then(function() {
          return db.collection('ai_logs').add({
            orderId: orderId,
            decision: 'Назначен водитель ' + driverData.email + ' (дистанция ' + nearestDist.toFixed(2) + ' км)',
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        });
      })
      .catch(function(error) {
        console.error('Ошибка назначения:', error);
        throw error;
      });
  }

  // ========== ДИСПЕТЧЕР: ВСЕ ЗАКАЗЫ ==========
  function loadOrders() {
    db.collection('orders')
      .orderBy('createdAt', 'desc')
      .limit(30)
      .get()
      .then(function(snapshot) {
        var html = '';
        snapshot.forEach(function(doc) {
          var d = doc.data();
          html += '<div style="border-bottom:1px solid #ddd; padding:8px;">' +
            '<b>' + (d.from || '?') + '</b> → <b>' + (d.to || '?') + '</b> | ' +
            'Статус: ' + d.status + ' | ' +
            'Цена: ' + d.price + '₽ | ' +
            'Клиент: ' + (d.clientEmail || 'anon') +
            (d.aiNote ? ' 🧠 ' + d.aiNote : '') +
            (d.driverId ? ' 🚗 водитель: ' + d.driverEmail : '') +
            '</div>';
        });
        document.getElementById('order-list').innerHTML = html || 'Нет заказов';
      })
      .catch(function(error) {
        alert('Ошибка загрузки заказов: ' + error.message);
      });
  }

  // ========== ВОДИТЕЛЬ: МОИ ЗАКАЗЫ ==========
  function loadDriverOrders() {
    if (!currentUser) return;
    db.collection('orders')
      .where('driverId', '==', currentUser.uid)
      .orderBy('createdAt', 'desc')
      .get()
      .then(function(snapshot) {
        var html = '';
        snapshot.forEach(function(doc) {
          var d = doc.data();
          html += '<div style="border-bottom:1px solid #ddd; padding:8px;">' +
            '<b>' + d.from + '</b> → <b>' + d.to + '</b> | ' +
            'Статус: ' + d.status + ' | ' +
            'Цена: ' + d.price + '₽' +
            (d.aiNote ? ' 🧠 ' + d.aiNote : '') +
            '</div>';
        });
        document.getElementById('driver-orders').innerHTML = html || 'Нет назначенных заказов';
      })
      .catch(function(error) {
        alert('Ошибка загрузки заказов водителя: ' + error.message);
      });
  }

  // ========== ВОДИТЕЛЬ: ОБНОВЛЕНИЕ МЕСТОПОЛОЖЕНИЯ ==========
  function updateLocation() {
    if (!currentUser || currentUserData.role !== 'driver') {
      alert('Эта функция доступна только для водителей');
      return;
    }
    // Используем встроенную геолокацию браузера
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(position) {
          var lat = position.coords.latitude;
          var lng = position.coords.longitude;
          db.collection('users').doc(currentUser.uid).update({
            lat: lat,
            lng: lng
          })
          .then(function() {
            currentUserData.lat = lat;
            currentUserData.lng = lng;
            updateLocationDisplay();
            alert('Координаты обновлены: ' + lat + ', ' + lng);
          })
          .catch(function(error) {
            alert('Ошибка сохранения координат: ' + error.message);
          });
        },
        function(error) {
          alert('Не удалось получить GPS: ' + error.message + '. Введите координаты вручную.');
          // Предлагаем ввести вручную
          var lat = prompt('Введите широту (например, 55.7539)', '55.7539');
          var lng = prompt('Введите долготу (например, 37.6208)', '37.6208');
          if (lat !== null && lng !== null) {
            var newLat = parseFloat(lat);
            var newLng = parseFloat(lng);
            if (!isNaN(newLat) && !isNaN(newLng)) {
              db.collection('users').doc(currentUser.uid).update({
                lat: newLat,
                lng: newLng
              })
              .then(function() {
                currentUserData.lat = newLat;
                currentUserData.lng = newLng;
                updateLocationDisplay();
                alert('Координаты обновлены вручную.');
              })
              .catch(function(error) {
                alert('Ошибка сохранения: ' + error.message);
              });
            } else {
              alert('Введите корректные числа');
            }
          }
        },
        { enableHighAccuracy: true }
      );
    } else {
      alert('Ваш браузер не поддерживает геолокацию. Введите координаты вручную.');
      var lat = prompt('Введите широту (например, 55.7539)', '55.7539');
      var lng = prompt('Введите долготу (например, 37.6208)', '37.6208');
      if (lat !== null && lng !== null) {
        var newLat = parseFloat(lat);
        var newLng = parseFloat(lng);
        if (!isNaN(newLat) && !isNaN(newLng)) {
          db.collection('users').doc(currentUser.uid).update({
            lat: newLat,
            lng: newLng
          })
          .then(function() {
            currentUserData.lat = newLat;
            currentUserData.lng = newLng;
            updateLocationDisplay();
            alert('Координаты обновлены.');
          })
          .catch(function(error) {
            alert('Ошибка сохранения: ' + error.message);
          });
        } else {
          alert('Введите корректные числа');
        }
      }
    }
  }

  function updateLocationDisplay() {
    if (currentUserData && currentUserData.role === 'driver') {
      var lat = currentUserData.lat || 'не установлены';
      var lng = currentUserData.lng || 'не установлены';
      document.getElementById('driver-location').innerHTML = '📍 Мои координаты: ' + lat + ', ' + lng;
    }
  }

  // ========== ВОДИТЕЛЬ: ПЕРЕКЛЮЧЕНИЕ ДОСТУПНОСТИ ==========
  function toggleAvailability() {
    if (!currentUser || !currentUserData) {
      alert('Сначала войдите или дождитесь загрузки данных');
      return;
    }
    var newVal = !currentUserData.available;
    db.collection('users').doc(currentUser.uid).update({
      available: newVal
    })
    .then(function() {
      currentUserData.available = newVal;
      updateDriverStatus();
      alert('Статус обновлён: ' + (newVal ? 'Доступен' : 'Недоступен'));
    })
    .catch(function(error) {
      alert('Ошибка обновления статуса: ' + error.message);
    });
  }

  function updateDriverStatus() {
    if (currentUserData && currentUserData.role === 'driver') {
      var statusText = currentUserData.available ? '🟢 Доступен' : '🔴 Недоступен';
      document.getElementById('driver-status').innerHTML = 'Текущий статус: ' + statusText;
    }
  }

  // ========== ВОДИТЕЛЬ: ЗАВЕРШИТЬ ПОСЛЕДНИЙ ЗАКАЗ ==========
  function completeOrder() {
    if (!currentUser) {
      alert('Войдите как водитель');
      return;
    }
    db.collection('orders')
      .where('driverId', '==', currentUser.uid)
      .where('status', 'in', ['assigned', 'started'])
      .orderBy('createdAt', 'desc')
      .limit(1)
      .get()
      .then(function(snapshot) {
        if (snapshot.empty) {
          alert('Нет активных заказов для завершения');
          return;
        }
        var doc = snapshot.docs[0];
        var orderId = doc.id;
        return db.collection('orders').doc(orderId).update({
          status: 'completed',
          aiNote: 'Завершён водителем'
        })
        .then(function() {
          return db.collection('users').doc(currentUser.uid).update({
            available: true
          });
        })
        .then(function() {
          currentUserData.available = true;
          updateDriverStatus();
          alert('Заказ завершён! Вы снова доступны.');
          loadDriverOrders();
          if (!document.getElementById('dispatcher-section').classList.contains('hidden')) {
            loadOrders();
          }
        });
      })
      .catch(function(error) {
        alert('Ошибка завершения заказа: ' + error.message);
      });
  }

  // ========== ИНИЦИАЛИЗАЦИЯ ==========
  console.log('Taxi AI Platform v0.3 загружена');
</script>
</body>
</html>
