    <style>
        /* ===== ОБЩИЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
            background-attachment: fixed;
            transition: direction 0.3s ease;
        }

        body[dir="rtl"] .phone-frame {
            direction: rtl;
        }
        body[dir="rtl"] .slogan-icon {
            margin-right: 0;
            margin-left: 6px;
        }

        .phone-frame {
            width: 100%;
            max-width: 400px;
            background: rgba(18, 22, 28, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 44px;
            padding: 20px 24px 32px;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
        }

        /* Переключатель языка */
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 24px;
            z-index: 10;
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }
        body[dir="rtl"] .lang-switcher {
            right: auto;
            left: 24px;
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: #8899aa;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .lang-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }
        .lang-btn.active {
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(255, 160, 0, 0.3);
        }

        /* Логотип */
        .logo-icon {
            margin-top: 50px;
            margin-bottom: 12px;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 30px rgba(255, 160, 0, 0.3);
            position: relative;
        }
        .logo-icon::after {
            content: "";
            position: absolute;
            width: 25px;
            height: 25px;
            background: #0a0c10;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }
        .logo-icon svg {
            width: 50px;
            height: 50px;
            fill: white;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 6px;
            background: linear-gradient(to right, #ffffff, #ffb000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
        }

        .slogan {
            font-size: 16px;
            font-weight: 600;
            color: #ffb000;
            margin-bottom: 24px;
            background: rgba(255, 180, 0, 0.1);
            padding: 10px 24px;
            border-radius: 20px;
            display: inline-block;
            letter-spacing: 0.5px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }
        .slogan-icon {
            display: inline-block;
            margin-right: 6px;
            animation: bounce 0.6s infinite alternate;
        }
        @keyframes bounce {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-3px);
            }
        }

        /* Вкладки */
        .form-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .form-tab {
            flex: 1;
            padding: 12px 10px;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: #8899aa;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .form-tab.active {
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            box-shadow: 0 4px 12px rgba(255, 160, 0, 0.3);
        }
        .form-tab:hover:not(.active) {
            color: white;
            background: rgba(255, 255, 255, 0.06);
        }

        /* Формы */
        .form-container {
            width: 100%;
        }
        .auth-form {
            display: none;
            width: 100%;
            text-align: left;
        }
        .auth-form.active {
            display: block;
        }

        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #b0c0d0;
            margin-bottom: 6px;
        }
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            -webkit-appearance: none;
            appearance: none;
        }
        .input-group select option {
            background: #1a1e26;
            color: white;
        }
        .input-group input:focus,
        .input-group select:focus {
            border-color: #ffb000;
        }
        .input-group input::placeholder {
            color: #667788;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(255, 140, 0, 0.3);
            margin-top: 8px;
        }
        .btn-submit:active {
            transform: scale(0.97);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Сообщения */
        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            text-align: center;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: block;
        }
        .message.success {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
            display: block;
        }
        .message.info {
            background: rgba(255, 180, 0, 0.15);
            color: #ffb000;
            border: 1px solid rgba(255, 180, 0, 0.3);
            display: block;
        }

        /* Дополнительно */
        .micro-text {
            font-size: 13px;
            color: #8899aa;
            margin: 16px 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .micro-text::before {
            content: "⚡";
            font-size: 14px;
        }

        .features {
            width: 100%;
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-bottom: 30px;
        }
        .feature-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 14px 8px;
            flex: 1;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .feature-icon {
            font-size: 24px;
            margin-bottom: 6px;
        }
        .feature-title {
            font-size: 13px;
            font-weight: 600;
            color: #e0e8f0;
        }
        .feature-desc {
            font-size: 11px;
            color: #8899aa;
            margin-top: 4px;
        }

        .home-indicator {
            margin-top: 12px;
            width: 130px;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
        }

        @media (max-width: 420px) {
            .phone-frame {
                border-radius: 0;
                padding: 16px 20px 24px;
                background: rgba(10, 12, 16, 0.95);
                backdrop-filter: blur(15px);
                box-shadow: none;
                border: none;
            }
            .lang-switcher {
                top: 16px;
                right: 20px;
            }
            body[dir="rtl"] .lang-switcher {
                left: 20px;
            }
        }
    </style>
</head>

        let currentLang = 'ru';

        function switchLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            if (!t) return;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) el.textContent = t[key];
            });
            if (lang === 'ar' || lang === 'he') {
                document.body.setAttribute('dir', 'rtl');
                document.documentElement.lang = lang;
            } else {
                document.body.setAttribute('dir', 'ltr');
                document.documentElement.lang = 'en';
            }
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-lang') === lang) btn.classList.add('active');
            });
            localStorage.setItem('wheel_lang', lang);
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchLanguage(btn.getAttribute('data-lang'));
            });
        });

        // Восстановление сохранённого языка
        const savedLang = localStorage.getItem('wheel_lang');
        if (savedLang && translations[savedLang]) {
            switchLanguage(savedLang);
        }

        // ============================================================
        // 2. ПЕРЕКЛЮЧЕНИЕ ФОРМ
        // ============================================================
        const tabs = document.querySelectorAll('.form-tab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginMsg = document.getElementById('loginMessage');
        const registerMsg = document.getElementById('registerMessage');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const form = tab.getAttribute('data-form');
                if (form === 'login') {
                    loginForm.classList.add('active');
                    registerForm.classList.remove('active');
                } else {
                    registerForm.classList.add('active');
                    loginForm.classList.remove('active');
                }
                // Очистка сообщений
                loginMsg.className = 'message';
                registerMsg.className = 'message';
            });
        });

        function showMessage(element, text, type = 'error') {
            element.className = 'message ' + type;
            element.textContent = text;
        }

        // ============================================================
        // 3. ЛОГИКА ВХОДА
        // ============================================================
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const msgEl = document.getElementById('loginMessage');

            if (!email || !password) {
                showMessage(msgEl, translations[currentLang].fillAll, 'error');
                return;
            }

            msgEl.className = 'message';
            msgEl.textContent = '⏳ ...';
            document.getElementById('loginBtn').disabled = true;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Проверяем документ в Firestore
                const userDocRef = doc(db, 'users', user.uid);
                const userDoc = await getDoc(userDocRef);

                let role = 'client';
                if (userDoc.exists()) {
                    role = userDoc.data().role || 'client';
                } else {
                    // Если документа нет – создаём с ролью client
                    await setDoc(userDocRef, {
                        uid: user.uid,
                        email: user.email,
                        role: 'client',
                        displayName: user.displayName || 'Пользователь',
                        balance: 0,
                        rating: 0,
                        bonus: 0,
                        penalty: 0,
                        premium: 0,
                        totalEarned: 0,
                        totalSpent: 0,
                        driverData: null,
                        createdAt: serverTimestamp()
                    });
                    role = 'client';
                }

                showMessage(msgEl, translations[currentLang].loginSuccess, 'success');

                // Перенаправляем через 1 секунду
                setTimeout(() => {
                    let redirect = '/client.html';
                    if (role === 'admin') redirect = '/admin.html';
                    else if (role === 'driver') redirect = '/driver.html';
                    window.location.href = redirect;
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                let msg = translations[currentLang].loginError;
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    msg = translations[currentLang].loginError;
                } else if (error.code === 'auth/invalid-email') {
                    msg = '❌ Неверный формат email';
                } else if (error.code === 'auth/too-many-requests') {
                    msg = '❌ Слишком много попыток. Попробуйте позже.';
                }
                showMessage(msgEl, msg, 'error');
            } finally {
                document.getElementById('loginBtn').disabled = false;
            }
        });

        // ============================================================
        // 4. ЛОГИКА РЕГИСТРАЦИИ
        // ============================================================
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const role = document.getElementById('regRole').value;
            const msgEl = document.getElementById('registerMessage');

            if (!name || !email || !password) {
                showMessage(msgEl, translations[currentLang].fillAll, 'error');
                return;
            }
            if (password.length < 6) {
                showMessage(msgEl, translations[currentLang].regWeakPass, 'error');
                return;
            }

            msgEl.className = 'message';
            msgEl.textContent = '⏳ ...';
            document.getElementById('registerBtn').disabled = true;

            try {
                // 1. Создаём пользователя в Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Создаём документ в users
                await setDoc(doc(db, 'users', user.uid), {
                    uid: user.uid,
                    email: user.email,
                    role: role,
                    displayName: name,
                    balance: 0,
                    rating: 0,
                    bonus: 0,
                    penalty: 0,
                    premium: 0,
                    totalEarned: 0,
                    totalSpent: 0,
                    driverData: null,
                    createdAt: serverTimestamp()
                });

                // 3. Если водитель – создаём запись в drivers
                if (role === 'driver') {
                    await setDoc(doc(db, 'drivers', user.uid), {
                        uid: user.uid,
                        fullName: name,
                        email: user.email,
                        status: 'offline',
                        lastUpdated: serverTimestamp(),
                        location: null,
                        carModel: '',
                        licensePlate: ''
                    });
                }

                showMessage(msgEl, translations[currentLang].regSuccess, 'success');

                // Очищаем поля и переключаем на вход
                document.getElementById('regName').value = '';
                document.getElementById('regEmail').value = '';
                document.getElementById('regPassword').value = '';
                document.getElementById('regRole').value = 'client';

                setTimeout(() => {
                    tabs.forEach(t => t.classList.remove('active'));
                    document.querySelector('.form-tab[data-form="login"]').classList.add('active');
                    loginForm.classList.add('active');
                    registerForm.classList.remove('active');
                    document.getElementById('loginEmail').value = email;
                    loginMsg.className = 'message';
                    showMessage(loginMsg, '✅ Регистрация успешна! Теперь войдите.', 'success');
                }, 1500);

            } catch (error) {
                console.error('Registration error:', error);
                let msg = translations[currentLang].regError + error.message;
                if (error.code === 'auth/email-already-in-use') {
                    msg = translations[currentLang].regEmailExists;
                    showMessage(msgEl, msg, 'info');
                    // Подставляем email в форму входа и переключаем
                    document.getElementById('loginEmail').value = email;
                    setTimeout(() => {
                        tabs.forEach(t => t.classList.remove('active'));
                        document.querySelector('.form-tab[data-form="login"]').classList.add('active');
                        loginForm.classList.add('active');
                        registerForm.classList.remove('active');
                        loginMsg.className = 'message';
                        showMessage(loginMsg, '⚠️ Этот email уже зарегистрирован. Войдите.', 'info');
                    }, 1000);
                } else if (error.code === 'auth/weak-password') {
                    msg = translations[currentLang].regWeakPass;
                    showMessage(msgEl, msg, 'error');
                } else {
                    showMessage(msgEl, msg, 'error');
                }
            } finally {
                document.getElementById('registerBtn').disabled = false;
            }
        });

        // ============================================================
        // 5. ПРОВЕРКА АВТОРИЗАЦИИ ПРИ ЗАГРУЗКЕ
        // ============================================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    let role = 'client';
                    if (userDoc.exists()) {
                        role = userDoc.data().role || 'client';
                    } else {
                        // Создаём документ, если его нет
                        await setDoc(doc(db, 'users', user.uid), {
                            uid: user.uid,
                            email: user.email,
                            role: 'client',
                            displayName: user.displayName || 'Пользователь',
                            balance: 0,
                            rating: 0,
                            bonus: 0,
                            penalty: 0,
                            premium: 0,
                            totalEarned: 0,
                            totalSpent: 0,
                            driverData: null,
                            createdAt: serverTimestamp()
                        });
                        role = 'client';
                    }
                    // Редирект, если мы на главной
                    if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
                        let redirect = '/client.html';
                        if (role === 'admin') redirect = '/admin.html';
                        else if (role === 'driver') redirect = '/driver.html';
                        window.location.href = redirect;
                    }
                } catch (e) {
                    console.warn('Ошибка при проверке роли:', e);
                }
            }
        });
    </script>
</body>
</html>
