<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WHEEL — Вход и регистрация</title>

    <style>
        /* ===== ОСНОВНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.05) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 70%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 48px;
            padding: 32px 28px 36px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 180, 0, 0.03), transparent 60%);
            pointer-events: none;
            animation: rotateBg 30s linear infinite;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== ЯЗЫКОВОЙ ПЕРЕКЛЮЧАТЕЛЬ С ФЛАГАМИ ===== */
        .lang-switcher {
            position: absolute;
            top: 18px;
            right: 22px;
            z-index: 10;
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 5px 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        body[dir="rtl"] .lang-switcher {
            right: auto;
            left: 22px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            font-size: 20px;
            line-height: 1;
            padding: 4px 6px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.25s ease;
            opacity: 0.4;
            filter: grayscale(0.8);
            transform: scale(0.85);
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lang-btn:hover {
            opacity: 0.8;
            filter: grayscale(0.2);
            transform: scale(0.95);
        }

        .lang-btn.active {
            opacity: 1;
            filter: grayscale(0);
            transform: scale(1);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            box-shadow: 0 0 16px rgba(255, 180, 0, 0.15);
        }

        .lang-btn .flag {
            font-size: 22px;
            line-height: 1;
            display: block;
        }

        /* ===== ЛОГОТИП ===== */
        .logo-section {
            text-align: center;
            margin-top: 8px;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 40px rgba(255, 160, 0, 0.25);
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            width: 28px;
            height: 28px;
            background: #0a0c10;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        .logo-icon svg {
            width: 46px;
            height: 46px;
            fill: white;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .logo-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-top: 12px;
            background: linear-gradient(to right, #ffffff, #ffb000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
        }

        .logo-subtitle {
            font-size: 14px;
            color: #8899aa;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
        .logo-subtitle span { color: #ffb000; font-weight: 600; }

        /* ===== ВКЛАДКИ ===== */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 28px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 1;
        }

        .tab {
            flex: 1;
            padding: 12px 10px;
            border: none;
            border-radius: 13px;
            background: transparent;
            color: #8899aa;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .tab:hover:not(.active) { color: #ffffff; background: rgba(255, 255, 255, 0.04); }
        .tab.active {
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            box-shadow: 0 4px 16px rgba(255, 160, 0, 0.2);
        }

        /* ===== ФОРМЫ ===== */
        .form-container { position: relative; z-index: 1; }
        .form { display: none; animation: fadeIn 0.4s ease; }
        .form.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #b0c0d0;
            margin-bottom: 6px;
        }
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-group input:focus,
        .input-group select:focus {
            border-color: #ffb000;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(255, 180, 0, 0.06);
        }
        .input-group input::placeholder { color: #556677; }
        .input-group select {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }
        .input-group select option { background: #1a1e26; color: #ffffff; }

        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(255, 140, 0, 0.25);
            font-family: inherit;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 140, 0, 0.35);
        }
        .btn-submit:active { transform: scale(0.97); }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== СООБЩЕНИЯ ===== */
        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }
        .message.success {
            background: rgba(74, 222, 128, 0.12);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.2);
            display: block;
        }
        .message.info {
            background: rgba(255, 180, 0, 0.12);
            color: #ffb000;
            border: 1px solid rgba(255, 180, 0, 0.2);
            display: block;
        }

        /* ===== ССЫЛКИ ПЕРЕКЛЮЧЕНИЯ ===== */
        .switch-link {
            margin-top: 16px;
            font-size: 14px;
            color: #8899aa;
            text-align: center;
        }
        .switch-link a {
            color: #ffb000;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }
        .switch-link a:hover { color: #ffcc44; }

        /* ===== ПРЕИМУЩЕСТВА ===== */
        .features {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            position: relative;
            z-index: 1;
        }
        .feature {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }
        .feature:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 180, 0, 0.1);
        }
        .feature-icon { font-size: 22px; margin-bottom: 4px; }
        .feature-title { font-size: 12px; font-weight: 600; color: #e0e8f0; }
        .feature-desc { font-size: 10px; color: #667788; margin-top: 2px; }

        .home-indicator {
            margin-top: 20px;
            width: 120px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            z-index: 1;
        }

        /* ===== АДАПТИВНОСТЬ ===== */
        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                padding: 20px 18px 28px;
                background: rgba(10, 12, 16, 0.96);
                backdrop-filter: blur(20px);
                border: none;
                box-shadow: none;
                max-width: 100%;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .lang-switcher {
                top: 14px;
                right: 14px;
                padding: 4px 8px;
                gap: 4px;
            }
            body[dir="rtl"] .lang-switcher {
                right: auto;
                left: 14px;
            }
            .lang-btn {
                width: 28px;
                height: 28px;
                font-size: 16px;
            }
            .lang-btn .flag { font-size: 18px; }
            .logo-title { font-size: 28px; }
            .logo-icon { width: 70px; height: 70px; }
            .logo-icon svg { width: 40px; height: 40px; }
            .features { gap: 6px; }
            .feature { padding: 12px 8px; }
        }

        /* ===== RTL ===== */
        body[dir="rtl"] .input-group input,
        body[dir="rtl"] .input-group select {
            text-align: right;
        }
    </style>
</head>

            </div>

            </div>
            <button class="btn-submit" id="loginBtn" data-i18n="loginBtn">Войти</button>
            <div class="message" id="loginMessage"></div>
            <div class="switch-link">
                <span data-i18n="noAccount">Нет аккаунта?</span>
                <a id="switchToRegister" data-i18n="registerLink">Зарегистрироваться</a>
            </div>
        </div>

        <!-- ===== ФОРМА РЕГИСТРАЦИИ ===== -->
        <div class="form" id="registerForm">
            <div class="form-title" data-i18n="registerTitle">📝 Создать аккаунт</div>
            <div class="input-group">
                <label for="regName" data-i18n="nameLabel">Имя</label>
                <input type="text" id="regName" placeholder="Иван" autocomplete="name">
            </div>
            <div class="input-group">
                <label for="regEmail" data-i18n="emailLabel">Email</label>
                <input type="email" id="regEmail" placeholder="example@mail.com" autocomplete="email">
            </div>
            <div class="input-group">
                <label for="regPassword" data-i18n="passLabel">Пароль (мин. 6 символов)</label>
                <input type="password" id="regPassword" placeholder="••••••••" autocomplete="new-password" minlength="6">
            </div>
            <div class="input-group">
                <label for="regRole" data-i18n="roleLabel">Роль</label>
                <select id="regRole">
                    <option value="client" data-i18n="roleClient">Клиент</option>
                    <option value="driver" data-i18n="roleDriver">Водитель</option>
                    <option value="admin" data-i18n="roleAdmin">Администратор</option>
                </select>
            </div>
            <button class="btn-submit" id="registerBtn" data-i18n="registerBtn">Зарегистрироваться</button>
            <div class="message" id="registerMessage"></div>
            <div class="switch-link">
                <span data-i18n="haveAccount">Уже есть аккаунт?</span>
                <a id="switchToLogin" data-i18n="loginLink">Войти</a>
            </div>
        </div>
    </div>

    <!-- ===== ПРЕИМУЩЕСТВА ===== -->
    <div class="features">
        <div class="feature">
            <div class="feature-icon">⚡</div>
            <div class="feature-title" data-i18n="feat1Title">Мгновенно</div>
            <div class="feature-desc" data-i18n="feat1Desc">Подача за 2 мин</div>
        </div>
        <div class="feature">
            <div class="feature-icon">🛡️</div>
            <div class="feature-title" data-i18n="feat2Title">Надёжно</div>
            <div class="feature-desc" data-i18n="feat2Desc">Проверенные водители</div>
        </div>
        <div class="feature">

            <div class="feature-title" data-i18n="feat3Title">Честно</div>
            <div class="feature-desc" data-i18n="feat3Desc">Цена без скрытого</div>
        </div>
    </div>

    <div class="home-indicator"></div>
</div>

            loginError: "❌ אימייל או סיסמה שגויים",
            regSuccess: "✅ ההרשמה בוצעה! כעת התחבר.",
            regError: "❌ שגיאת הרשמה: ",
            regEmailExists: "⚠️ אימייל זה כבר רשום. התחבר.",
            regWeakPass: "❌ סיסמה חייבת להכיל לפחות 6 תווים",
            fillAll: "❌ אנא מלא את כל השדות"
        },
        ar: {
            subtitle: "نحن في طريقنا إليك",
            loginTab: "تسجيل الدخول",
            registerTab: "التسجيل",
            loginTitle: "🔐 مرحباً بعودتك",
            registerTitle: "📝 إنشاء حساب",
            emailLabel: "البريد الإلكتروني",
            passLabel: "كلمة المرور",
            nameLabel: "الاسم",
            roleLabel: "الدور",
            roleClient: "عميل",
            roleDriver: "سائق",
            roleAdmin: "مدير النظام",
            loginBtn: "دخول",
            registerBtn: "تسجيل",
            noAccount: "ليس لديك حساب؟",
            haveAccount: "لديك حساب بالفعل؟",
            registerLink: "تسجيل",
            loginLink: "دخول",
            feat1Title: "فوري",
            feat1Desc: "الوصول خلال دقيقتين",
            feat2Title: "موثوق",
            feat2Desc: "سائقون معتمدون",
            feat3Title: "شفاف",
            feat3Desc: "سعر بدون مفاجآت",
            loginSuccess: "✅ تم تسجيل الدخول بنجاح! جاري التوجيه...",
            loginError: "❌ بريد إلكتروني или كلمة مرور غير صحيحة",
            regSuccess: "✅ تم التسجيل بنجاح! قم بتسجيل الدخول الآن.",
            regError: "❌ خطأ في التسجيل: ",
            regEmailExists: "⚠️ هذا البريد الإلكتروني مسجل بالفعل. قم بتسجيل الدخول.",
            regWeakPass: "❌ يجب أن تتكون كلمة المرور من 6 أحرف على الأقل",
            fillAll: "❌ يرجى ملء جميع الحقول"
        }
    };

    // ===== ЯЗЫК =====
    let currentLang = 'ru';

    function switchLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        if (!t) return;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key] !== undefined) el.textContent = t[key];
        });
        if (lang === 'ar' || lang === 'he') {
            document.body.setAttribute('dir', 'rtl');
            document.documentElement.lang = lang;
        } else {
            document.body.setAttribute('dir', 'ltr');
            document.documentElement.lang = 'en';
        }
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-lang') === lang) btn.classList.add('active');
        });
        localStorage.setItem('wheel_lang', lang);
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => switchLanguage(btn.getAttribute('data-lang')));
    });

    const savedLang = localStorage.getItem('wheel_lang');
    if (savedLang && translations[savedLang]) switchLanguage(savedLang);

    // ===== ПЕРЕКЛЮЧЕНИЕ ФОРМ =====
    const tabs = document.querySelectorAll('.tab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginMsg = document.getElementById('loginMessage');
    const registerMsg = document.getElementById('registerMessage');

    function switchForm(form) {
        tabs.forEach(t => t.classList.remove('active'));
        if (form === 'login') {
            document.querySelector('.tab[data-form="login"]').classList.add('active');
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
        } else {
            document.querySelector('.tab[data-form="register"]').classList.add('active');
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
        }
        loginMsg.className = 'message';
        registerMsg.className = 'message';
    }

    tabs.forEach(tab => {
        tab.addEventListener('click', () => switchForm(tab.getAttribute('data-form')));
    });

    document.getElementById('switchToRegister').addEventListener('click', () => switchForm('register'));
    document.getElementById('switchToLogin').addEventListener('click', () => switchForm('login'));

    function showMessage(element, text, type = 'error') {
        element.className = 'message ' + type;
        element.textContent = text;
    }

    // ===== 1. ВХОД =====
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();

        if (!email || !password) {
            showMessage(loginMsg, translations[currentLang].fillAll, 'error');
            return;
        }

        loginMsg.className = 'message';
        loginMsg.textContent = '⏳ ...';
        document.getElementById('loginBtn').disabled = true;

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            const userDoc = await getDoc(doc(db, 'users', user.uid));

            let role = 'client';
            if (userDoc.exists()) {
                role = userDoc.data().role || 'client';
            } else {
                await setDoc(doc(db, 'users', user.uid), {
                    uid: user.uid,
                    email: user.email,
                    role: 'client',
                    displayName: user.displayName || 'Пользователь',
                    balance: 0,
                    rating: 0,
                    bonus: 0,
                    penalty: 0,
                    premium: 0,
                    totalEarned: 0,
                    totalSpent: 0,
                    driverData: null,
                    createdAt: serverTimestamp()
                });
                role = 'client';
            }

            showMessage(loginMsg, translations[currentLang].loginSuccess, 'success');

            setTimeout(() => {
                let redirect = 'cabinet.html';
                if (role === 'admin') redirect = 'admin.html';
                else if (role === 'driver') redirect = 'driver.html';
                window.location.href = redirect;
            }, 1000);

        } catch (error) {
            let msg = translations[currentLang].loginError;
            if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                msg = translations[currentLang].loginError;
            } else if (error.code === 'auth/invalid-email') {
                msg = '❌ Неверный формат email';
            } else if (error.code === 'auth/too-many-requests') {
                msg = '❌ Слишком много попыток. Попробуйте позже.';
            }
            showMessage(loginMsg, msg, 'error');
        } finally {
            document.getElementById('loginBtn').disabled = false;
        }
    });

    // ===== 2. РЕГИСТРАЦИЯ =====
    document.getElementById('registerBtn').addEventListener('click', async (e) => {
        e.preventDefault();

        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const role = document.getElementById('regRole').value;

        console.log('🔍 Регистрация:', { name, email, role });

        if (!name || !email || !password) {
            showMessage(registerMsg, translations[currentLang].fillAll, 'error');
            return;
        }
        if (password.length < 6) {
            showMessage(registerMsg, translations[currentLang].regWeakPass, 'error');
            return;
        }

        registerMsg.className = 'message';
        registerMsg.textContent = '⏳ Регистрация...';
        document.getElementById('registerBtn').disabled = true;

        try {
            // Создаём пользователя
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            console.log('✅ Auth: пользователь создан, UID:', user.uid);

            // Создаём документ
            await setDoc(doc(db, 'users', user.uid), {
                uid: user.uid,
                email: user.email,
                role: role,
                displayName: name,
                balance: 0,
                rating: 0,
                bonus: 0,
                penalty: 0,
                premium: 0,
                totalEarned: 0,
                totalSpent: 0,
                driverData: null,
                createdAt: serverTimestamp()
            });
            console.log('✅ Firestore: документ создан');

            // Если водитель
            if (role === 'driver') {
                await setDoc(doc(db, 'drivers', user.uid), {
                    uid: user.uid,
                    fullName: name,
                    email: user.email,
                    status: 'offline',
                    lastUpdated: serverTimestamp(),
                    location: null,
                    carModel: '',
                    licensePlate: ''
                });
                console.log('✅ Firestore: создан документ в drivers');
            }

            showMessage(registerMsg, translations[currentLang].regSuccess, 'success');

            // Очищаем поля
            document.getElementById('regName').value = '';
            document.getElementById('regEmail').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regRole').value = 'client';

            setTimeout(() => {
                switchForm('login');
                document.getElementById('loginEmail').value = email;
                showMessage(loginMsg, '✅ Регистрация успешна! Теперь войдите.', 'success');
            }, 1500);

        } catch (error) {
            console.error('❌ Ошибка регистрации:', error);
            let msg = translations[currentLang].regError + error.message;

            if (error.code === 'auth/email-already-in-use') {
                msg = translations[currentLang].regEmailExists;
                showMessage(registerMsg, msg, 'info');
                document.getElementById('loginEmail').value = email;
                setTimeout(() => {
                    switchForm('login');
                    showMessage(loginMsg, '⚠️ Этот email уже зарегистрирован. Войдите.', 'info');
                }, 1000);
            } else if (error.code === 'auth/weak-password') {
                msg = translations[currentLang].regWeakPass;
                showMessage(registerMsg, msg, 'error');
            } else {
                showMessage(registerMsg, msg, 'error');
            }
        } finally {
            document.getElementById('registerBtn').disabled = false;
        }
    });

    // ===== 3. ПРОВЕРКА АВТОРИЗАЦИИ =====
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            try {
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                let role = 'client';
                if (userDoc.exists()) {
                    role = userDoc.data().role || 'client';
                } else {
                    await setDoc(doc(db, 'users', user.uid), {
                        uid: user.uid,
                        email: user.email,
                        role: 'client',
                        displayName: user.displayName || 'Пользователь',
                        balance: 0,
                        rating: 0,
                        bonus: 0,
                        penalty: 0,
                        premium: 0,
                        totalEarned: 0,
                        totalSpent: 0,
                        driverData: null,
                        createdAt: serverTimestamp()
                    });
                    role = 'client';
                }
                const path = window.location.pathname;
                if (path === '/' || path === '/index.html' || path.endsWith('/index.html')) {
                    let redirect = 'cabinet.html';
                    if (role === 'admin') redirect = 'admin.html';
                    else if (role === 'driver') redirect = 'driver.html';
                    window.location.href = redirect;
                }
            } catch (e) {
                console.warn('Ошибка при проверке роли:', e);
            }
        }
    });
</script>
