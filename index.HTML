<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Taxi AI Platform – MVP</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; max-width: 800px; margin: auto; }
    .card { border: 1px solid #ccc; padding: 20px; margin: 15px 0; border-radius: 10px; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    input { padding: 8px; margin: 5px; width: 90%; }
    .hidden { display: none; }
  </style>
</head>
<body>

<h1>🚕 Taxi AI Platform <span style="font-size:14px;">v0.1 MVP</span></h1>

<div id="auth-section" class="card">
  <h3>Вход / Регистрация</h3>
  <input type="email" id="email" placeholder="Email" value="driver@taxi.com">
  <input type="password" id="password" placeholder="Пароль" value="123456">
  <br>
  <button onclick="signUp()">Зарегистрироваться</button>
  <button onclick="signIn()">Войти</button>
  <button onclick="signOut()">Выйти</button>
  <p id="user-status">Не авторизован</p>
  <p id="user-role"></p>
</div>

<!-- Клиент -->
<div id="client-section" class="card hidden">
  <h3>📱 Клиент — создать заказ</h3>
  <input id="from" placeholder="Откуда" value="Улица Ленина, 10">
  <input id="to" placeholder="Куда" value="Вокзал">
  <button onclick="createOrder()">🚖 Заказать такси</button>
  <p id="order-status"></p>
</div>

<!-- Диспетчер -->
<div id="dispatcher-section" class="card hidden">
  <h3>📋 Диспетчер — все заказы</h3>
  <button onclick="loadOrders()">Обновить список</button>
  <div id="order-list"></div>
</div>

<!-- Водитель -->
<div id="driver-section" class="card hidden">
  <h3>🚗 Водитель — мои заказы</h3>
  <button onclick="loadDriverOrders()">Обновить</button>
  <div id="driver-orders"></div>
  <button onclick="toggleAvailability()">Переключить статус (доступен/недоступен)</button>
  <p id="driver-status"></p>
</div>

<script>
  // ============ ВСТАВЬТЕ ВАШ КОНФИГ FIREBASE ============
  const firebaseConfig = {
    apiKey: "ваш-apiKey",
    authDomain: "ваш-authDomain",
    projectId: "ваш-projectId",
    storageBucket: "ваш-storageBucket",
    messagingSenderId: "ваш-messagingSenderId",
    appId: "ваш-appId"
  };
  // =====================================================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  // Текущий пользователь
  let currentUser = null;
  let currentUserData = null;

  // Отслеживание входа
  auth.onAuthStateChanged(async user => {
    if (user) {
      currentUser = user;
      document.getElementById('user-status').innerText = '✅ Вошёл: ' + user.email;
      // Получаем роль из Firestore
      const doc = await db.collection('users').doc(user.uid).get();
      if (doc.exists) {
        currentUserData = doc.data();
        const role = currentUserData.role;
        document.getElementById('user-role').innerText = 'Роль: ' + role;
        // Показываем нужный интерфейс
        document.getElementById('client-section').classList.add('hidden');
        document.getElementById('dispatcher-section').classList.add('hidden');
        document.getElementById('driver-section').classList.add('hidden');
        if (role === 'client') document.getElementById('client-section').classList.remove('hidden');
        else if (role === 'dispatcher') document.getElementById('dispatcher-section').classList.remove('hidden');
        else if (role === 'driver') {
          document.getElementById('driver-section').classList.remove('hidden');
          loadDriverOrders();
          updateDriverStatus();
        }
      } else {
        // Если пользователь есть в Auth, но нет документа в users
        document.getElementById('user-role').innerText = '⚠️ Роль не назначена, обратитесь к администратору';
      }
    } else {
      currentUser = null;
      currentUserData = null;
      document.getElementById('user-status').innerText = '❌ Не авторизован';
      document.getElementById('user-role').innerText = '';
      document.getElementById('client-section').classList.add('hidden');
      document.getElementById('dispatcher-section').classList.add('hidden');
      document.getElementById('driver-section').classList.add('hidden');
    }
  });

  // === АУТЕНТИФИКАЦИЯ ===
  function signUp() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    auth.createUserWithEmailAndPassword(email, password)
      .then(cred => {
        alert('Регистрация успешна! Теперь войдите.');
        // После регистрации автоматически создадим документ в users с ролью 'client' (можно изменить)
        return db.collection('users').doc(cred.user.uid).set({
          email: email,
          name: 'Новый пользователь',
          role: 'client',
          phone: '',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      })
      .then(() => {
        // Можно сразу войти или попросить войти
        alert('Документ создан. Теперь войдите с этими данными.');
      })
      .catch(e => alert('Ошибка регистрации: ' + e.message));
  }

  function signIn() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    auth.signInWithEmailAndPassword(email, password)
      .then(() => alert('Вход выполнен'))
      .catch(e => alert('Ошибка входа: ' + e.message));
  }

  function signOut() {
    auth.signOut();
  }

  // === КЛИЕНТ: СОЗДАНИЕ ЗАКАЗА ===
  function createOrder() {
    if (!currentUser) return alert('Сначала войдите!');
    const from = document.getElementById('from').value;
    const to = document.getElementById('to').value;
    db.collection('orders').add({
      clientId: currentUser.uid,
      clientEmail: currentUser.email,
      from: from,
      to: to,
      status: 'created',
      price: Math.round(Math.random() * 300 + 100),
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      aiNote: 'Ожидает назначения'
    })
    .then(() => {
      document.getElementById('order-status').innerText = '✅ Заказ создан! ИИ-диспетчер обрабатывает...';
      // Логируем в ai_logs
      return db.collection('ai_logs').add({
        orderId: 'only-for-demo',
        decision: 'Новый заказ от клиента',
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    })
    .then(() => {
      // Если диспетчер открыт, обновим список
      if (!document.getElementById('dispatcher-section').classList.contains('hidden')) {
        loadOrders();
      }
    })
    .catch(e => alert('Ошибка: ' + e.message));
  }

  // === ДИСПЕТЧЕР: ВСЕ ЗАКАЗЫ ===
  function loadOrders() {
    db.collection('orders')
      .orderBy('createdAt', 'desc')
      .limit(30)
      .get()
      .then(snapshot => {
        let html = '';
        snapshot.forEach(doc => {
          const d = doc.data();
          html += `<div style="border-bottom:1px solid #ddd; padding:8px;">
            <b>${d.from || '?'}</b> → <b>${d.to || '?'}</b> | 
            Статус: ${d.status} | 
            Цена: ${d.price}₽ | 
            Клиент: ${d.clientEmail || 'anon'} 
            ${d.aiNote ? '🧠 ' + d.aiNote : ''}
            ${d.driverId ? '🚗 водитель: ' + d.driverId : ''}
          </div>`;
        });
        document.getElementById('order-list').innerHTML = html || 'Нет заказов';
      })
      .catch(e => alert('Ошибка загрузки: ' + e.message));
  }

  // === ВОДИТЕЛЬ: МОИ ЗАКАЗЫ ===
  function loadDriverOrders() {
    if (!currentUser) return;
    db.collection('orders')
      .where('driverId', '==', currentUser.uid)
      .orderBy('createdAt', 'desc')
      .get()
      .then(snapshot => {
        let html = '';
        snapshot.forEach(doc => {
          const d = doc.data();
          html += `<div style="border-bottom:1px solid #ddd; padding:8px;">
            <b>${d.from}</b> → <b>${d.to}</b> | 
            Статус: ${d.status} | 
            Цена: ${d.price}₽
          </div>`;
        });
        document.getElementById('driver-orders').innerHTML = html || 'Нет назначенных заказов';
      })
      .catch(e => alert('Ошибка: ' + e.message));
  }

  // === ВОДИТЕЛЬ: ПЕРЕКЛЮЧЕНИЕ СТАТУСА ===
  function toggleAvailability() {
    if (!currentUser) return;
    const newVal = !currentUserData.available;
    db.collection('users').doc(currentUser.uid).update({
      available: newVal
    })
    .then(() => {
      currentUserData.available = newVal;
      updateDriverStatus();
      alert('Статус обновлён: ' + (newVal ? 'Доступен' : 'Недоступен'));
    })
    .catch(e => alert('Ошибка: ' + e.message));
  }

  function updateDriverStatus() {
    if (currentUserData && currentUserData.role === 'driver') {
      document.getElementById('driver-status').innerText = 
        'Текущий статус: ' + (currentUserData.available ? '🟢 Доступен' : '🔴 Недоступен');
    }
  }

  // При загрузке страницы, если уже авторизован, подгружаем данные
  window.onload = function() {
    // Принудительно обновим, если пользователь уже есть
    if (auth.currentUser) {
      // onAuthStateChanged сработает автоматически
    }
  };
</script>
</body>
</html>
