<!DOCTYPE html>
<html lang="ru" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Кабинет водителя — WHEEL</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.05) 0%, transparent 45%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(30px);
            border-radius: 32px;
            padding: 24px 20px 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 180, 0, 0.03), transparent 60%);
            pointer-events: none;
            animation: rotateBg 30s linear infinite;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== ВЕРХНЯЯ ПАНЕЛЬ С ЯЗЫКОМ ===== */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 4px 0;
            margin-bottom: 4px;
            height: 36px;
            background: transparent;
            position: relative;
            z-index: 2;
        }

        .lang-switcher {
            display: flex;
            align-items: center;
            gap: 4px;
            position: relative;
        }
        .lang-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 2px 12px;
            color: #8899aa;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 28px;
        }
        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }
        .lang-btn .globe {
            font-size: 16px;
        }
        .lang-dropdown {
            position: absolute;
            top: 32px;
            right: 0;
            background: rgba(18, 22, 28, 0.96);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 6px 0;
            min-width: 130px;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }
        .lang-dropdown.open {
            display: block;
        }
        .lang-dropdown .item {
            padding: 8px 16px;
            color: #e0e8f0;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .lang-dropdown .item:last-child {
            border-bottom: none;
        }
        .lang-dropdown .item:hover {
            background: rgba(255, 180, 0, 0.08);
            color: #ffb000;
        }
        .lang-dropdown .item .flag {
            font-size: 20px;
        }

        body[dir="rtl"] .top-bar {
            direction: rtl;
        }
        body[dir="rtl"] .lang-dropdown {
            right: auto;
            left: 0;
        }
        body[dir="rtl"] .container {
            direction: rtl;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-top: 4px;
            position: relative;
            z-index: 1;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .user-name {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }
        .user-email {
            font-size: 13px;
            color: #8899aa;
            margin-top: 2px;
        }
        .user-uid {
            font-size: 10px;
            color: #556677;
            margin-top: 2px;
            font-family: monospace;
            word-break: break-all;
        }

        .logout-btn {
            background: rgba(255, 70, 70, 0.08);
            border: 1px solid rgba(255, 70, 70, 0.15);
            border-radius: 30px;
            padding: 8px 16px;
            color: #ff6b6b;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            flex-shrink: 0;
            margin-left: 10px;
        }
        .logout-btn:hover {
            background: rgba(255, 70, 70, 0.18);
            border-color: #ff6b6b;
        }

        /* ===== СТАТУС-БАДЖ ===== */
        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
        }

        .status-badge.online {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }
        .status-badge.offline {
            background: rgba(102, 119, 136, 0.15);
            color: #667788;
            border: 1px solid rgba(102, 119, 136, 0.2);
        }
        .status-badge.busy {
            background: rgba(255, 180, 0, 0.15);
            color: #ffb000;
            border: 1px solid rgba(255, 180, 0, 0.2);
        }

        .status-toggle {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 4px 6px;
            display: inline-flex;
            gap: 4px;
            margin-top: 6px;
        }

        .status-toggle .btn-status {
            padding: 4px 14px;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            background: transparent;
            color: #667788;
        }

        .status-toggle .btn-status.active-online {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }
        .status-toggle .btn-status.active-offline {
            background: rgba(102, 119, 136, 0.15);
            color: #667788;
        }
        .status-toggle .btn-status:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
        }

        /* ===== СТАТИСТИКА ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 14px 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 180, 0, 0.08);
        }

        .stat-card .icon {
            font-size: 18px;
            margin-bottom: 2px;
        }
        .stat-card .label {
            font-size: 10px;
            color: #8899aa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .stat-card .value {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 2px;
        }
        .stat-card .value.gold {
            color: #ffb000;
        }
        .stat-card .value.green {
            color: #4ade80;
        }
        .stat-card .value.red {
            color: #ff6b6b;
        }
        .stat-card .value.blue {
            color: #60a5fa;
        }

        /* ===== КНОПКА "РАБОТАТЬ" ===== */
        .btn-work {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #0a0c10;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 8px 24px rgba(74, 222, 128, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            z-index: 1;
            margin-bottom: 16px;
        }

        .btn-work:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(74, 222, 128, 0.35);
        }
        .btn-work:active {
            transform: scale(0.97);
        }

        /* ===== РАЗДЕЛЫ ===== */
        .section {
            width: 100%;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #e0e8f0;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title .badge {
            font-size: 11px;
            color: #667788;
            font-weight: 400;
        }

        /* ===== СПИСОК ЗАКАЗОВ ===== */
        .order-list {
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .order-list::-webkit-scrollbar {
            width: 3px;
        }
        .order-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .order-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .order-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
        }

        .order-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .order-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex: 1;
            min-width: 0;
        }

        .order-info .route {
            font-size: 13px;
            font-weight: 500;
            color: #e0e8f0;
            word-break: break-word;
        }
        .order-info .meta {
            font-size: 11px;
            color: #667788;
            margin-top: 2px;
        }

        .order-info .meta .status {
            padding: 1px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 10px;
        }

        .order-info .meta .status.completed {
            background: rgba(74, 222, 128, 0.12);
            color: #4ade80;
        }
        .order-info .meta .status.cancelled {
            background: rgba(255, 70, 70, 0.12);
            color: #ff6b6b;
        }
        .order-info .meta .status.assigned {
            background: rgba(255, 180, 0, 0.12);
            color: #ffb000;
        }
        .order-info .meta .status.in_progress {
            background: rgba(96, 165, 250, 0.12);
            color: #60a5fa;
        }

        .order-amount {
            font-size: 15px;
            font-weight: 700;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .order-amount.positive {
            color: #4ade80;
        }
        .order-amount.negative {
            color: #ff6b6b;
        }
        .order-amount.neutral {
            color: #ffb000;
        }

        /* ===== ТРАНЗАКЦИИ ===== */
        .transaction-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .transaction-item .desc {
            font-size: 13px;
            color: #e0e8f0;
        }
        .transaction-item .date {
            font-size: 10px;
            color: #667788;
            margin-top: 2px;
        }
        .transaction-item .amount {
            font-size: 14px;
            font-weight: 700;
        }
        .transaction-item .amount.positive {
            color: #4ade80;
        }
        .transaction-item .amount.negative {
            color: #ff6b6b;
        }

        /* ===== ПУСТО ===== */
        .empty-state {
            color: #667788;
            font-size: 13px;
            text-align: center;
            padding: 16px 0;
        }

        .loading-text {
            color: #8899aa;
            font-size: 13px;
            text-align: center;
            padding: 10px 0;
        }

        /* ===== ИНДИКАТОР ===== */
        .home-indicator {
            margin-top: 16px;
            width: 120px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 420px) {
            .container {
                border-radius: 0;
                padding: 16px;
                min-height: 100vh;
                background: rgba(10, 12, 16, 0.96);
                backdrop-filter: blur(20px);
                border: none;
                box-shadow: none;
                max-width: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .user-name {
                font-size: 18px;
            }
            .stat-card .value {
                font-size: 19px;
            }
            .stat-card {
                padding: 12px 10px;
            }
            .stats-grid {
                gap: 8px;
            }
            .btn-work {
                font-size: 15px;
                padding: 14px;
            }
            .top-bar {
                height: 32px;
            }
            .lang-btn {
                font-size: 11px;
                padding: 2px 10px;
                height: 24px;
            }
        }
    </style>
</head>
<body id="bodyRoot">
    <div class="container">

        <!-- ===== ВЕРХНЯЯ ПАНЕЛЬ С ЯЗЫКОМ ===== -->
        <div class="top-bar">
            <div class="lang-switcher">
                <button class="lang-btn" id="langToggle">
                    <span class="globe">🌐</span>
                    <span id="currentLangLabel">RU</span>
                    <span style="font-size:12px;">▾</span>
                </button>
                <div class="lang-dropdown" id="langDropdown">
                    <div class="item" data-lang="ru">
                        <span class="flag">🇷🇺</span> Русский
                    </div>
                    <div class="item" data-lang="en">
                        <span class="flag">🇬🇧</span> English
                    </div>
                    <div class="item" data-lang="he">
                        <span class="flag">🇮🇱</span> עברית
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== ШАПКА ===== -->
        <div class="header">
            <div class="user-info">
                <div class="user-name" id="driverName" data-i18n="loading">Загрузка...</div>
                <div class="user-email" id="driverEmail">email@domain.com</div>
                <div class="user-uid" id="driverUid">UID: ---</div>
                <div id="statusContainer" style="margin-top:4px;">
                    <span class="status-badge offline" id="statusBadge" data-i18n="loading_status">⏳ Загрузка...</span>
                    <div class="status-toggle" id="statusToggle">
                        <button class="btn-status active-online" data-status="online" id="statusOnlineBtn" data-i18n="btn_online">🟢 Онлайн</button>
                        <button class="btn-status" data-status="offline" id="statusOfflineBtn" data-i18n="btn_offline">⚪ Офлайн</button>
                    </div>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn" data-i18n="logout">🚪 Выйти</button>
        </div>

        <!-- ===== СТАТИСТИКА ===== -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">💰</div>
                <div class="label" data-i18n="stat_balance">Баланс</div>
                <div class="value gold" id="balance">0 ₪</div>
            </div>
            <div class="stat-card">
                <div class="icon">📊</div>
                <div class="label" data-i18n="stat_earned">Заработано</div>
                <div class="value green" id="totalEarned">0 ₪</div>
            </div>
            <div class="stat-card">
                <div class="icon">⚠️</div>
                <div class="label" data-i18n="stat_penalty">Штрафы</div>
                <div class="value red" id="totalPenalty">0 ₪</div>
            </div>
            <div class="stat-card">
                <div class="icon">🎁</div>
                <div class="label" data-i18n="stat_bonus">Бонусы</div>
                <div class="value gold" id="totalBonus">0</div>
            </div>
        </div>

        <!-- ===== КНОПКА "РАБОТАТЬ" ===== -->
        <button class="btn-work" onclick="window.location.href='driver-work.html'" data-i18n="btn_work">
            🚗 Работать
        </button>

        <!-- ===== ЗАКАЗЫ ===== -->
        <div class="section">
            <div class="section-title">
                <span data-i18n="orders_title">📋 Мои заказы</span>
                <span class="badge" id="ordersCount">(0)</span>
            </div>
            <div class="order-list" id="ordersList">
                <div class="loading-text" data-i18n="loading">⏳ Загрузка...</div>
            </div>
        </div>

        <!-- ===== ТРАНЗАКЦИИ ===== -->
        <div class="section">
            <div class="section-title">
                <span data-i18n="transactions_title">💳 История операций</span>
                <span class="badge" id="transactionsCount">(0)</span>
            </div>
            <div class="order-list" id="transactionsList" style="max-height:180px;">
                <div class="loading-text" data-i18n="loading">⏳ Загрузка...</div>
            </div>
        </div>

        <div class="home-indicator"></div>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT (ПОЛНАЯ ВЕРСИЯ С ЯЗЫКОВОЙ ЛОГИКОЙ) -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // ЯЗЫКОВАЯ ЛОГИКА (ДОБАВЛЕНА)
        // ============================================================
        const translations = {
            ru: {
                loading: 'Загрузка...',
                loading_status: '⏳ Загрузка...',
                btn_online: '🟢 Онлайн',
                btn_offline: '⚪ Офлайн',
                logout: '🚪 Выйти',
                stat_balance: 'Баланс',
                stat_earned: 'Заработано',
                stat_penalty: 'Штрафы',
                stat_bonus: 'Бонусы',
                btn_work: '🚗 Работать',
                orders_title: '📋 Мои заказы',
                transactions_title: '💳 История операций',
                // динамические статусы (будут использоваться в JS)
                status_online: '🟢 Онлайн',
                status_offline: '⚪ Офлайн',
                status_busy: '🟡 Занят',
                no_orders: 'Нет заказов',
                no_transactions: 'Нет операций',
                order_status_new: 'Новый',
                order_status_searching: 'Поиск',
                order_status_assigned: 'Назначен',
                order_status_in_progress: 'В пути',
                order_status_completed: 'Завершён',
                order_status_cancelled: 'Отменён'
            },
            en: {
                loading: 'Loading...',
                loading_status: '⏳ Loading...',
                btn_online: '🟢 Online',
                btn_offline: '⚪ Offline',
                logout: '🚪 Logout',
                stat_balance: 'Balance',
                stat_earned: 'Earned',
                stat_penalty: 'Penalties',
                stat_bonus: 'Bonuses',
                btn_work: '🚗 Work',
                orders_title: '📋 My orders',
                transactions_title: '💳 Transaction history',
                status_online: '🟢 Online',
                status_offline: '⚪ Offline',
                status_busy: '🟡 Busy',
                no_orders: 'No orders',
                no_transactions: 'No transactions',
                order_status_new: 'New',
                order_status_searching: 'Searching',
                order_status_assigned: 'Assigned',
                order_status_in_progress: 'In progress',
                order_status_completed: 'Completed',
                order_status_cancelled: 'Cancelled'
            },
            he: {
                loading: 'טוען...',
                loading_status: '⏳ טוען...',
                btn_online: '🟢 מקוון',
                btn_offline: '⚪ לא מקוון',
                logout: '🚪 יציאה',
                stat_balance: 'יתרה',
                stat_earned: 'הרווחת',
                stat_penalty: 'קנסות',
                stat_bonus: 'בונוסים',
                btn_work: '🚗 עבודה',
                orders_title: '📋 ההזמנות שלי',
                transactions_title: '💳 היסטוריית עסקאות',
                status_online: '🟢 מקוון',
                status_offline: '⚪ לא מקוון',
                status_busy: '🟡 עסוק',
                no_orders: 'אין הזמנות',
                no_transactions: 'אין עסקאות',
                order_status_new: 'חדש',
                order_status_searching: 'בחיפוש',
                order_status_assigned: 'הוקצה',
                order_status_in_progress: 'בדרך',
                order_status_completed: 'הושלם',
                order_status_cancelled: 'בוטל'
            }
        };

        let currentLang = 'ru';

        function applyLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.getElementById('htmlRoot').lang = lang;
            const body = document.getElementById('bodyRoot');
            if (lang === 'he') {
                body.dir = 'rtl';
            } else {
                body.dir = 'ltr';
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) {
                    el.textContent = t[key];
                }
            });

            document.getElementById('currentLangLabel').textContent = lang.toUpperCase();
            document.getElementById('langDropdown').classList.remove('open');
            localStorage.setItem('wheel_lang', lang);

            // Перерисовываем заказы и транзакции, чтобы обновить статусы
            renderOrders();
            renderTransactions();
            updateStatusUI(userData?.driverData?.isAvailable ? 'online' : 'offline');
        }

        // Переключатель языка
        document.getElementById('langToggle').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('langDropdown').classList.toggle('open');
        });

        document.querySelectorAll('.lang-dropdown .item').forEach(item => {
            item.addEventListener('click', () => {
                const lang = item.getAttribute('data-lang');
                applyLanguage(lang);
            });
        });

        document.addEventListener('click', () => {
            document.getElementById('langDropdown').classList.remove('open');
        });

        const savedLang = localStorage.getItem('wheel_lang');
        if (savedLang && translations[savedLang]) {
            applyLanguage(savedLang);
        } else {
            applyLanguage('ru');
        }

        // ============================================================
        // FIREBASE КОНФИГ
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        console.log('🔥 Firebase готов');

        // ============================================================
        // ПЕРЕМЕННЫЕ
        // ============================================================
        let currentUser = null;
        let userData = null;
        let driverOrders = [];
        let driverTransactions = [];
        let unsubUser = null;
        let unsubOrders = null;
        let unsubTransactions = null;

        // Элементы
        const el = {
            driverName: document.getElementById('driverName'),
            driverEmail: document.getElementById('driverEmail'),
            driverUid: document.getElementById('driverUid'),
            statusBadge: document.getElementById('statusBadge'),
            statusOnlineBtn: document.getElementById('statusOnlineBtn'),
            statusOfflineBtn: document.getElementById('statusOfflineBtn'),
            balance: document.getElementById('balance'),
            totalEarned: document.getElementById('totalEarned'),
            totalPenalty: document.getElementById('totalPenalty'),
            totalBonus: document.getElementById('totalBonus'),
            ordersList: document.getElementById('ordersList'),
            ordersCount: document.getElementById('ordersCount'),
            transactionsList: document.getElementById('transactionsList'),
            transactionsCount: document.getElementById('transactionsCount'),
            logoutBtn: document.getElementById('logoutBtn')
        };

        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================
        function formatPrice(p) {
            return (p || 0).toFixed(2) + ' ₪';
        }

        function formatDate(ts) {
            if (!ts) return '—';
            try {
                const d = ts.toDate ? ts.toDate() : new Date(ts);
                return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            } catch {
                return '—';
            }
        }

        function getStatusLabel(status) {
            const t = translations[currentLang];
            const map = {
                'new': t.order_status_new,
                'searching': t.order_status_searching,
                'assigned': t.order_status_assigned,
                'in_progress': t.order_status_in_progress,
                'completed': t.order_status_completed,
                'cancelled': t.order_status_cancelled
            };
            return map[status] || status;
        }

        // ============================================================
        // ОБНОВЛЕНИЕ СТАТУСА (перевод зависит от языка)
        // ============================================================
        function updateStatusUI(status) {
            const t = translations[currentLang];
            const badge = el.statusBadge;
            badge.className = 'status-badge ' + status;
            if (status === 'online') badge.textContent = t.status_online;
            else if (status === 'busy') badge.textContent = t.status_busy;
            else badge.textContent = t.status_offline;

            el.statusOnlineBtn.className = 'btn-status' + (status === 'online' ? ' active-online' : '');
            el.statusOfflineBtn.className = 'btn-status' + (status === 'offline' ? ' active-offline' : '');
        }

        // ============================================================
        // РЕНДЕРИНГ ЗАКАЗОВ (с учётом языка)
        // ============================================================
        function renderOrders() {
            const t = translations[currentLang];
            if (!driverOrders || driverOrders.length === 0) {
                el.ordersList.innerHTML = `<div class="empty-state">${t.no_orders}</div>`;
                el.ordersCount.textContent = '(0)';
                return;
            }

            let html = '';
            driverOrders.forEach(order => {
                const label = getStatusLabel(order.status);
                const cls = statusClasses[order.status] || '';
                const amount = order.price || 0;
                const sign = order.status === 'cancelled' ? '-' : '+';
                const amtClass = order.status === 'cancelled' ? 'negative' : 'positive';

                html += `
                        <div class="order-item">
                            <div class="order-info">
                                <div class="route">
                                    📍 ${order.pickup?.address || '—'} → 🏁 ${order.destination?.address || '—'}
                                </div>
                                <div class="meta">
                                    #${order.id.substring(0, 8)} • ${formatDate(order.createdAt)}
                                    <span class="status ${cls}">${label}</span>
                                    ${order.penaltyApplied ? ` • ⚠️ ${t.stat_penalty}: ${formatPrice(order.penaltyApplied)}` : ''}
                                </div>
                            </div>
                            <div class="order-amount ${amtClass}">${sign}${formatPrice(amount)}</div>
                        </div>
                    `;
            });

            el.ordersList.innerHTML = html;
            el.ordersCount.textContent = `(${driverOrders.length})`;
        }

        // ============================================================
        // РЕНДЕРИНГ ТРАНЗАКЦИЙ (без изменений, суммы уже числовые)
        // ============================================================
        function renderTransactions() {
            const t = translations[currentLang];
            if (!driverTransactions || driverTransactions.length === 0) {
                el.transactionsList.innerHTML = `<div class="empty-state">${t.no_transactions}</div>`;
                el.transactionsCount.textContent = '(0)';
                return;
            }

            let html = '';
            let totalEarned = 0;
            let totalPenalty = 0;
            let totalBonus = 0;

            driverTransactions.forEach(tx => {
                const amount = tx.amount || 0;
                const cls = amount >= 0 ? 'positive' : 'negative';
                const sign = amount >= 0 ? '+' : '';

                if (tx.type === 'earning') totalEarned += amount;
                else if (tx.type === 'penalty') totalPenalty += Math.abs(amount);
                else if (tx.type === 'bonus' || tx.type === 'premium') totalBonus += amount;

                html += `
                        <div class="transaction-item">
                            <div>
                                <div class="desc">${tx.description || tx.type || 'Операция'}</div>
                                <div class="date">${formatDate(tx.timestamp)}</div>
                            </div>
                            <div class="amount ${cls}">${sign}${formatPrice(amount)}</div>
                        </div>
                    `;
            });

            el.transactionsList.innerHTML = html;
            el.transactionsCount.textContent = `(${driverTransactions.length})`;

            // Обновляем статистику
            el.totalEarned.textContent = formatPrice(totalEarned);
            el.totalPenalty.textContent = formatPrice(totalPenalty);
            if (userData && userData.bonus !== undefined) {
                el.totalBonus.textContent = userData.bonus.toFixed(0);
            } else {
                el.totalBonus.textContent = totalBonus.toFixed(0);
            }
        }

        // ============================================================
        // ПОДПИСКА НА ДАННЫЕ ВОДИТЕЛЯ
        // ============================================================
        function subscribeToDriverData(uid) {
            // === ПОДПИСКА НА ПОЛЬЗОВАТЕЛЯ ===
            if (unsubUser) { unsubUser();
                unsubUser = null; }
            const userRef = db.collection('users').doc(uid);
            unsubUser = userRef.onSnapshot(doc => {
                if (doc.exists) {
                    userData = doc.data();
                    el.driverName.textContent = userData.displayName || 'Водитель';
                    el.driverEmail.textContent = userData.email || '';
                    el.balance.textContent = formatPrice(userData.balance || 0);

                    if (userData.bonus !== undefined) {
                        el.totalBonus.textContent = userData.bonus.toFixed(0);
                    }

                    const status = userData.driverData?.isAvailable ? 'online' : 'offline';
                    updateStatusUI(status);
                }
            }, err => console.error('User error:', err));

            // === ПОДПИСКА НА ЗАКАЗЫ ВОДИТЕЛЯ ===
            if (unsubOrders) { unsubOrders();
                unsubOrders = null; }
            const ordersQuery = db.collection('orders')
                .where('driverId', '==', uid)
                .orderBy('createdAt', 'desc');
            unsubOrders = ordersQuery.onSnapshot(snapshot => {
                driverOrders = [];
                snapshot.forEach(doc => {
                    driverOrders.push({ id: doc.id, ...doc.data() });
                });
                renderOrders();
            }, err => console.error('Orders error:', err));

            // === ПОДПИСКА НА ТРАНЗАКЦИИ ВОДИТЕЛЯ ===
            if (unsubTransactions) { unsubTransactions();
                unsubTransactions = null; }
            const txQuery = db.collection('transactions')
                .where('userId', '==', uid)
                .orderBy('timestamp', 'desc')
                .limit(20);
            unsubTransactions = txQuery.onSnapshot(snapshot => {
                driverTransactions = [];
                snapshot.forEach(doc => {
                    driverTransactions.push({ id: doc.id, ...doc.data() });
                });
                renderTransactions();
            }, err => console.error('Transactions error:', err));
        }

        // ============================================================
        // ОБНОВЛЕНИЕ СТАТУСА ВОДИТЕЛЯ
        // ============================================================
        function setDriverStatus(status) {
            if (!currentUser) return;
            const userRef = db.collection('users').doc(currentUser.uid);
            userRef.update({
                'driverData.isAvailable': status === 'online'
            }).then(() => {
                console.log('✅ Статус обновлён:', status);
            }).catch(err => {
                console.error('❌ Ошибка обновления статуса:', err);
                const current = userData?.driverData?.isAvailable ? 'online' : 'offline';
                updateStatusUI(current);
            });
        }

        // ============================================================
        // ОБРАБОТЧИКИ СТАТУСА
        // ============================================================
        el.statusOnlineBtn.addEventListener('click', function() {
            if (this.classList.contains('active-online')) return;
            setDriverStatus('online');
        });

        el.statusOfflineBtn.addEventListener('click', function() {
            if (this.classList.contains('active-offline')) return;
            setDriverStatus('offline');
        });

        // ============================================================
        // ВЫХОД
        // ============================================================
        el.logoutBtn.addEventListener('click', function() {
            if (unsubUser) { unsubUser();
                unsubUser = null; }
            if (unsubOrders) { unsubOrders();
                unsubOrders = null; }
            if (unsubTransactions) { unsubTransactions();
                unsubTransactions = null; }
            auth.signOut().then(() => {
                window.location.href = 'index.html';
            });
        });

        // ============================================================
        // АВТОРИЗАЦИЯ
        // ============================================================
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = user;
            el.driverUid.textContent = 'UID: ' + user.uid.substring(0, 16) + '...';

            db.collection('users').doc(user.uid).get()
                .then(doc => {
                    if (!doc.exists) {
                        alert('❌ Профиль не найден');
                        window.location.href = 'index.html';
                        return;
                    }
                    const data = doc.data();
                    if (data.role !== 'driver') {
                        alert('⛔ Эта страница только для водителей');
                        window.location.href = 'index.html';
                        return;
                    }
                    subscribeToDriverData(user.uid);
                })
                .catch(err => {
                    console.error('Auth error:', err);
                    window.location.href = 'index.html';
                });
        });

        console.log('✅ Кабинет водителя с языковой панелью загружен');
        console.log('📌 Информация:');
        console.log('  🌐 Переключение языков: RU / EN / HE');
        console.log('  👤 Имя и email водителя');
        console.log('  💰 Баланс, заработок, штрафы, бонусы');
        console.log('  📋 Список заказов с суммами');
        console.log('  💳 История операций');
        console.log('  🟢 Переключение статуса Онлайн/Офлайн');
        console.log('  🚗 Кнопка "Работать" → driver-work.html');
    </script>
</body>
</html>
