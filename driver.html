<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>WHEEL — Водитель</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0c10;
            min-height: 100vh;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.06) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(18, 22, 28, 0.92);
            backdrop-filter: blur(25px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 16px;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #ffb000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }
        .back-btn:hover {
            background: rgba(255,180,0,0.15);
            border-color: #ffb000;
        }

        .card {
            background: rgba(18, 22, 28, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title i { color: #ffb000; }

        /* ===== КАРТА ===== */
        #map {
            width: 100%;
            height: 320px;
            border-radius: 14px;
            background: #1a1e26;
            overflow: hidden;
            position: relative;
        }

        .map-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .map-controls .btn-center {
            background: rgba(18, 22, 28, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .map-controls .btn-center:hover {
            background: rgba(255,180,0,0.2);
            border-color: #ffb000;
        }

        .profile-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .profile-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #0a0c10;
            flex-shrink: 0;
        }
        .profile-info {
            flex: 1;
        }
        .profile-info .name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }
        .profile-info .detail {
            font-size: 12px;
            color: #8899aa;
        }
        .status-online { color: #4ade80; }
        .status-offline { color: #f87171; }
        .status-busy { color: #fbbf24; }

        .rating-stars {
            display: flex;
            gap: 2px;
            margin-top: 2px;
        }
        .rating-stars .star {
            color: #f59e0b;
            font-size: 14px;
        }
        .rating-stars .star.empty {
            color: #3a4050;
        }

        .stats-row {
            display: flex;
            gap: 10px;
        }
        .stats-row .stat-item {
            flex: 1;
            text-align: center;
            background: rgba(255,255,255,0.04);
            padding: 6px 4px;
            border-radius: 10px;
        }
        .stats-row .stat-item .number {
            font-size: 16px;
            font-weight: 800;
            color: #ffb000;
            display: block;
        }
        .stats-row .stat-item .label {
            font-size: 9px;
            color: #667788;
            text-transform: uppercase;
        }

        .status-toggle {
            display: flex;
            gap: 8px;
            margin: 6px 0 2px;
        }
        .status-btn {
            flex: 1;
            padding: 8px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .status-btn.online {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #ffffff;
        }
        .status-btn.offline {
            background: rgba(255,255,255,0.06);
            color: #8899aa;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .status-btn.offline:hover {
            background: rgba(255,255,255,0.1);
            color: #ffffff;
        }

        .order-card {
            background: rgba(255,180,0,0.06);
            border: 1px solid rgba(255,180,0,0.1);
            border-radius: 12px;
            padding: 12px 14px;
        }
        .order-address {
            color: #e8edf5;
            font-size: 13px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .order-address i { color: #ffb000; width: 16px; margin-top: 2px; }
        .order-address .text { flex: 1; }

        .order-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .order-actions .btn-action {
            flex: 1;
            padding: 10px 14px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            min-width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .order-actions .btn-action:hover { transform: scale(1.02); }
        .btn-accept { background: linear-gradient(135deg, #22c55e, #16a34a); color: #ffffff; }
        .btn-reject { background: linear-gradient(135deg, #ef4444, #dc2626); color: #ffffff; }
        .btn-navigate { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #ffffff; }
        .btn-arrived { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #ffffff; }
        .btn-complete { background: linear-gradient(135deg, #f59e0b, #d97706); color: #0a0c10; }
        .btn-pending { background: rgba(255,255,255,0.05); color: #8899aa; border: 1px solid rgba(255,255,255,0.08); cursor: default; }

        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .empty-state {
            text-align: center;
            color: #556677;
            padding: 20px 10px;
        }
        .empty-state i {
            font-size: 36px;
            color: #334455;
            margin-bottom: 8px;
            display: block;
        }

        .notification {
            background: rgba(255,180,0,0.1);
            border: 1px solid rgba(255,180,0,0.2);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 12px;
            color: #ffb000;
            font-size: 14px;
            display: none;
        }
        .notification.active { display: block; }
        .notification.success {
            border-color: rgba(34,197,94,0.2);
            color: #4ade80;
            background: rgba(34,197,94,0.1);
        }
        .notification.error {
            border-color: rgba(239,68,68,0.2);
            color: #f87171;
            background: rgba(239,68,68,0.1);
        }

        .hidden { display: none !important; }

        .marker-driver {
            background: #3b82f6;
            border: 3px solid #ffffff;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(59,130,246,0.5);
            animation: pulse-driver 1.5s infinite;
        }
        @keyframes pulse-driver {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .marker-client {
            background: #22c55e;
            border: 3px solid #ffffff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            box-shadow: 0 4px 12px rgba(34,197,94,0.4);
        }

        .marker-destination {
            background: #ef4444;
            border: 3px solid #ffffff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            box-shadow: 0 4px 12px rgba(239,68,68,0.4);
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .card { padding: 12px 14px; }
            #map { height: 250px; }
            .profile-avatar { width: 38px; height: 38px; font-size: 15px; }
            .profile-info .name { font-size: 14px; }
            .order-actions .btn-action { font-size: 12px; padding: 8px 10px; min-width: 70px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== HEADER ===== -->
    <div class="header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Назад</a>
        <div class="logo">WHEEL <span style="color:#ffb000;">TAXI</span></div>
        <div style="width:72px;"></div>
    </div>

    <!-- ===== УВЕДОМЛЕНИЕ ===== -->
    <div class="notification" id="notification">
        <i class="fas fa-info-circle"></i> <span id="notificationText">Загрузка...</span>
    </div>

    <!-- ===== КАРТА ===== -->
    <div class="card" style="padding: 0; overflow: hidden; border-radius: 16px; position: relative;">
        <div id="map"></div>
        <div class="map-controls">
            <button class="btn-center" id="centerMapBtn" title="Центрировать карту">
                <i class="fas fa-crosshairs"></i>
            </button>
        </div>
    </div>

    <!-- ===== ПРОФИЛЬ ===== -->
    <div class="card" id="profileCard">
        <div class="profile-row">
            <div class="profile-avatar" id="driverAvatar">👤</div>
            <div class="profile-info">
                <div class="name" id="driverName">Водитель</div>
                <div class="detail" id="driverCar">🚗 Модель авто</div>
                <div class="detail" id="driverPhone">📞 Телефон</div>
                <div style="display:flex; align-items:center; gap:10px; margin-top:4px;">
                    <span id="driverStatusText" style="font-size:12px; font-weight:600; color:#4ade80;">🟢 Онлайн</span>
                    <div class="rating-stars" id="ratingStars">
                        <span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span>
                    </div>
                    <span style="color:#667788; font-size:12px;" id="ratingValue">5.0</span>
                </div>
            </div>
        </div>

        <div class="stats-row" style="margin-top:10px;">
            <div class="stat-item">
                <span class="number" id="totalTrips">0</span>
                <span class="label">🚗 Поездок</span>
            </div>
            <div class="stat-item">
                <span class="number" id="totalEarned">0 ₪</span>
                <span class="label">💰 Заработано</span>
            </div>
            <div class="stat-item">
                <span class="number" id="driverBalance">0 ₪</span>
                <span class="label">💳 Баланс</span>
            </div>
        </div>

        <div class="status-toggle">
            <button class="status-btn online" id="statusOnlineBtn">🟢 Онлайн</button>
            <button class="status-btn offline" id="statusOfflineBtn">🔴 Офлайн</button>
        </div>
    </div>

    <!-- ===== ТЕКУЩИЙ ЗАКАЗ ===== -->
    <div class="card" id="currentOrderCard">
        <div class="card-title"><i class="fas fa-taxi"></i> Текущий заказ</div>
        <div id="currentOrderContent">
            <div class="empty-state">
                <i class="fas fa-clock"></i>
                <p>Нет активных заказов</p>
                <span style="font-size:12px; color:#445566;">Ожидайте назначения</span>
            </div>
        </div>
    </div>

</div>

<script>
    // ============================================================
    // FIREBASE
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
        authDomain: "taxi-ai-app-69628.firebaseapp.com",
        projectId: "taxi-ai-app-69628",
        storageBucket: "taxi-ai-app-69628.firebasestorage.app",
        messagingSenderId: "952357992434",
        appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
        measurementId: "G-Z9NJFSSXH6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // ============================================================
    // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
    // ============================================================
    let currentDriverId = null;
    let driverData = null;
    let currentOrder = null;
    let currentOrderId = null;

    let map = null;
    let fromMarker = null;
    let toMarker = null;
    let driverMarker = null;
    let routeControl = null;
    let watchId = null;

    // ============================================================
    // КАРТА
    // ============================================================
    function initMap() {
        map = L.map('map', {
            center: [32.0853, 34.7818],
            zoom: 13,
            zoomControl: false,
        });

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19,
        }).addTo(map);

        const driverIcon = L.divIcon({
            html: '🚗',
            className: '',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
        });

        driverMarker = L.marker([32.0853, 34.7818], { icon: driverIcon })
            .addTo(map)
            .bindPopup('🚗 Вы здесь');

        console.log('🗺️ Карта инициализирована');
    }

    document.getElementById('centerMapBtn').addEventListener('click', () => {
        if (driverMarker) {
            const pos = driverMarker.getLatLng();
            map.setView(pos, 15);
        }
    });

    // ============================================================
    // УВЕДОМЛЕНИЯ
    // ============================================================
    function showNotification(text, type = 'info') {
        const el = document.getElementById('notification');
        const textEl = document.getElementById('notificationText');
        textEl.textContent = text;
        el.className = 'notification active ' + type;
        setTimeout(() => {
            el.classList.remove('active');
        }, 5000);
    }

    // ============================================================
    // АВТОРИЗАЦИЯ
    // ============================================================
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentDriverId = user.uid;
            console.log('✅ Водитель авторизован:', currentDriverId);
            showNotification('✅ Авторизация успешна', 'success');
            await loadDriverData();
            if (driverData) {
                await db.collection('users').doc(currentDriverId).update({
                    'driverProfile.status': 'online',
                    'driverProfile.lastUpdated': firebase.firestore.FieldValue.serverTimestamp()
                });
                driverData.driverProfile.status = 'online';
                updateUI();
                listenForOrders();
                startTrackingLocation();
                loadMapMarkers();
            } else {
                console.error('❌ Водитель не найден в базе');
                document.getElementById('driverName').textContent = '⚠️ Водитель не найден';
                showNotification('⚠️ Водитель не найден в базе данных', 'error');
            }
        } else {
            console.warn('⏳ Водитель не авторизован, перенаправление...');
            showNotification('⏳ Перенаправление на главную...', 'info');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        }
    });

    // ============================================================
    // ЗАГРУЗКА ДАННЫХ ВОДИТЕЛЯ
    // ============================================================
    async function loadDriverData() {
        try {
            const doc = await db.collection('users').doc(currentDriverId).get();
            if (doc.exists) {
                driverData = doc.data();
                console.log('📋 Данные водителя:', driverData);
            } else {
                console.error('❌ Документ водителя не найден');
            }
        } catch (error) {
            console.error('❌ Ошибка загрузки:', error);
        }
    }

    // ============================================================
    // ОБНОВЛЕНИЕ UI
    // ============================================================
    function updateUI() {
        if (!driverData) return;

        const driverProfile = driverData.driverProfile || {};
        const name = driverData.fullName || driverData.email || 'Водитель';
        const car = driverProfile.carModel || 'Модель не указана';
        const phone = driverData.phone || 'Телефон не указан';
        const rating = driverProfile.rating || 5.0;
        const totalTrips = driverProfile.totalTrips || 0;
        const balance = driverProfile.balance || 0;
        const earned = driverProfile.totalEarned || 0;
        const status = driverProfile.status || 'offline';

        document.getElementById('driverName').textContent = name;
        document.getElementById('driverCar').textContent = '🚗 ' + car;
        document.getElementById('driverPhone').textContent = '📞 ' + phone;
        document.getElementById('driverAvatar').textContent = name.charAt(0).toUpperCase();

        updateRating(rating);
        document.getElementById('totalTrips').textContent = totalTrips;
        document.getElementById('totalEarned').textContent = earned + ' ₪';
        document.getElementById('driverBalance').textContent = balance + ' ₪';
        updateStatusUI(status);

        if (driverProfile.location) {
            const lat = driverProfile.location.lat;
            const lng = driverProfile.location.lng;
            if (lat && lng) {
                driverMarker.setLatLng([lat, lng]);
                map.setView([lat, lng], 15);
            }
        }
    }

    function updateRating(rating) {
        const stars = document.getElementById('ratingStars');
        const fullStars = Math.round(rating);
        let html = '';
        for (let i = 1; i <= 5; i++) {
            html += `<span class="star ${i <= fullStars ? '' : 'empty'}">★</span>`;
        }
        stars.innerHTML = html;
        document.getElementById('ratingValue').textContent = rating.toFixed(1);
    }

    function updateStatusUI(status) {
        const statusText = document.getElementById('driverStatusText');
        const onlineBtn = document.getElementById('statusOnlineBtn');
        const offlineBtn = document.getElementById('statusOfflineBtn');

        if (status === 'online') {
            statusText.textContent = '🟢 Онлайн';
            statusText.style.color = '#4ade80';
            onlineBtn.className = 'status-btn online';
            offlineBtn.className = 'status-btn offline';
        } else if (status === 'busy') {
            statusText.textContent = '🟡 Занят';
            statusText.style.color = '#fbbf24';
        } else {
            statusText.textContent = '🔴 Офлайн';
            statusText.style.color = '#f87171';
            onlineBtn.className = 'status-btn offline';
            offlineBtn.className = 'status-btn online';
        }
    }

    // ============================================================
    // СТАТУС
    // ============================================================
    document.getElementById('statusOnlineBtn').addEventListener('click', async () => {
        await updateDriverStatus('online');
        showNotification('🟢 Статус изменён на Онлайн', 'success');
    });

    document.getElementById('statusOfflineBtn').addEventListener('click', async () => {
        await updateDriverStatus('offline');
        showNotification('🔴 Статус изменён на Офлайн', 'info');
    });

    async function updateDriverStatus(status) {
        try {
            await db.collection('users').doc(currentDriverId).update({
                'driverProfile.status': status,
                'driverProfile.lastUpdated': firebase.firestore.FieldValue.serverTimestamp()
            });
            if (driverData) {
                if (!driverData.driverProfile) driverData.driverProfile = {};
                driverData.driverProfile.status = status;
            }
            updateStatusUI(status);
            console.log(`✅ Статус обновлён: ${status}`);
        } catch (error) {
            console.error('❌ Ошибка обновления статуса:', error);
            showNotification('❌ Ошибка обновления статуса', 'error');
        }
    }

    // ============================================================
    // ГЕОЛОКАЦИЯ
    // ============================================================
    function startTrackingLocation() {
        if (!navigator.geolocation) {
            console.warn('⚠️ Геолокация не поддерживается');
            return;
        }

        let firstUpdate = true;

        const updatePosition = () => {
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    driverMarker.setLatLng([lat, lng]);

                    if (firstUpdate) {
                        map.setView([lat, lng], 15);
                        firstUpdate = false;
                    }

                    await db.collection('users').doc(currentDriverId).update({
                        'driverProfile.location.lat': lat,
                        'driverProfile.location.lng': lng,
                        'driverProfile.location.updatedAt': firebase.firestore.FieldValue.serverTimestamp()
                    });

                    if (currentOrder && currentOrder.status !== 'completed') {
                        updateRoute();
                    }
                },
                (error) => {
                    console.warn('⚠️ Ошибка геолокации:', error);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 30000
                }
            );
        };

        updatePosition();
        watchId = setInterval(updatePosition, 30000);
    }

    // ============================================================
    // МАРКЕРЫ НА КАРТЕ
    // ============================================================
    function loadMapMarkers() {
        if (currentOrder) {
            showMapMarkers(currentOrder);
        }
    }

    // ============================================================
    // СЛУШАТЕЛЬ ЗАКАЗОВ
    // ============================================================
    function listenForOrders() {
        db.collection('orders')
            .where('driverId', '==', currentDriverId)
            .where('status', 'in', ['assigned', 'accepted', 'en_route', 'arrived'])
            .onSnapshot((snapshot) => {
                if (snapshot.empty) return;

                let order = null;
                let orderId = null;
                snapshot.forEach(doc => {
                    order = doc.data();
                    orderId = doc.id;
                });

                if (order) {
                    currentOrder = order;
                    currentOrderId = orderId;
                    showOrder(order, orderId);
                    showMapMarkers(order);
                    updateRoute();
                    showNotification('📦 Заказ назначен!', 'success');
                }
            });

        db.collection('orders')
            .where('status', '==', 'offering')
            .onSnapshot((snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added') {
                        const order = change.doc.data();
                        const orderId = change.doc.id;
                        const offeredTo = order.offeredTo || [];
                        if (offeredTo.includes(currentDriverId)) {
                            if (!currentOrder || currentOrderId !== orderId) {
                                currentOrder = order;
                                currentOrderId = orderId;
                                showOrder(order, orderId);
                                showMapMarkers(order);
                                showNotification('📦 Новый заказ! Примите или отклоните.', 'success');
                            }
                        }
                    } else if (change.type === 'modified') {
                        const order = change.doc.data();
                        const orderId = change.doc.id;
                        if (order.acceptedBy && order.acceptedBy !== currentDriverId) {
                            if (currentOrderId === orderId) {
                                currentOrder = null;
                                currentOrderId = null;
                                showNoOrder();
                                clearMapMarkers();
                                showNotification('⚠️ Заказ принят другим водителем', 'info');
                            }
                        }
                    }
                });
            });
    }

    // ============================================================
    // ОТОБРАЖЕНИЕ ЗАКАЗА
    // ============================================================
    function showOrder(order, orderId) {
        const container = document.getElementById('currentOrderContent');

        const fromAddress = order.client?.from?.address || order.from || 'Неизвестно';
        const toAddress = order.destination?.address || order.to || 'Неизвестно';
        const price = order.price?.base || order.price || 0;
        const eta = order.driverETA ? `${order.driverETA} мин` : '—';

        let actionsHtml = '';

        if (order.status === 'offering' || order.status === 'assigned') {
            actionsHtml = `
                <div class="order-actions">
                    <button class="btn-action btn-accept" onclick="acceptOrder('${orderId}')">
                        ✅ Принять
                    </button>
                    <button class="btn-action btn-reject" onclick="rejectOrder('${orderId}')">
                        ❌ Отклонить
                    </button>
                </div>
            `;
        } else if (order.status === 'accepted' || order.status === 'en_route') {
            actionsHtml = `
                <div class="order-actions">
                    <button class="btn-action btn-navigate" onclick="navigateToClient()">
                        🧭 Навигатор
                    </button>
                    <button class="btn-action btn-arrived" onclick="arrivedToClient()">
                        📍 Прибыл
                    </button>
                </div>
            `;
        } else if (order.status === 'arrived') {
            actionsHtml = `
                <div class="order-actions">
                    <button class="btn-action btn-complete" onclick="completeOrder()">
                        ✅ Заказ выполнен
                    </button>
                </div>
            `;
        }

        const statusMap = {
            'offering': '📨 Предложение',
            'assigned': '🔵 Назначен',
            'accepted': '🟢 Принят',
            'en_route': '🟢 В пути',
            'arrived': '📍 Прибыл'
        };
        const statusText = statusMap[order.status] || order.status;

        container.innerHTML = `
            <div class="order-card">
                <div class="order-address">
                    <i class="fas fa-location-dot" style="color:#22c55e;"></i>
                    <span class="text"><strong>Откуда:</strong> ${fromAddress}</span>
                </div>
                <div class="order-address" style="margin-top:6px;">
                    <i class="fas fa-flag-checkered" style="color:#ef4444;"></i>
                    <span class="text"><strong>Куда:</strong> ${toAddress}</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:8px;">
                    <span style="font-size:13px; color:#ffb000; font-weight:600;">${statusText}</span>
                    <span style="font-size:13px; color:#4ade80;">⏱️ ${eta}</span>
                </div>
                <div style="margin-top:6px; font-size:13px; color:#667788;">
                    💰 ${price} ₪
                </div>
                ${actionsHtml}
            </div>
        `;
    }

    function showNoOrder() {
        const container = document.getElementById('currentOrderContent');
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-clock"></i>
                <p>Нет активных заказов</p>
                <span style="font-size:12px; color:#445566;">Ожидайте назначения</span>
            </div>
        `;
    }

    // ============================================================
    // МАРКЕРЫ НА КАРТЕ
    // ============================================================
    function showMapMarkers(order) {
        const fromLat = order.client?.from?.lat || order.fromLat;
        const fromLng = order.client?.from?.lng || order.fromLng;
        const toLat = order.destination?.lat || order.toLat;
        const toLng = order.destination?.lng || order.toLng;

        const clientIcon = L.divIcon({
            html: '<div class="marker-client"></div>',
            className: '',
            iconSize: [20, 20],
            iconAnchor: [10, 10],
        });

        const destIcon = L.divIcon({
            html: '<div class="marker-destination"></div>',
            className: '',
            iconSize: [16, 16],
            iconAnchor: [8, 8],
        });

        if (fromMarker) { map.removeLayer(fromMarker); fromMarker = null; }
        if (toMarker) { map.removeLayer(toMarker); toMarker = null; }

        if (fromLat && fromLng) {
            fromMarker = L.marker([fromLat, fromLng], { icon: clientIcon })
                .addTo(map)
                .bindPopup('📍 Клиент');
        }

        if (toLat && toLng) {
            toMarker = L.marker([toLat, toLng], { icon: destIcon })
                .addTo(map)
                .bindPopup('🏁 Назначение');
        }

        const bounds = L.latLngBounds();
        if (fromMarker) bounds.extend(fromMarker.getLatLng());
        if (toMarker) bounds.extend(toMarker.getLatLng());
        if (driverMarker) bounds.extend(driverMarker.getLatLng());
        if (bounds.isValid()) {
            map.fitBounds(bounds, { padding: [60, 60] });
        }
    }

    function clearMapMarkers() {
        if (fromMarker) { map.removeLayer(fromMarker); fromMarker = null; }
        if (toMarker) { map.removeLayer(toMarker); toMarker = null; }
        if (routeControl) {
            map.removeControl(routeControl);
            routeControl = null;
        }
    }

    // ============================================================
    // МАРШРУТ
    // ============================================================
    function updateRoute() {
        if (!currentOrder || !map) return;

        const fromLat = currentOrder.client?.from?.lat || currentOrder.fromLat;
        const fromLng = currentOrder.client?.from?.lng || currentOrder.fromLng;
        const toLat = currentOrder.destination?.lat || currentOrder.toLat;
        const toLng = currentOrder.destination?.lng || currentOrder.toLng;

        if (!fromLat || !fromLng) return;

        const driverPos = driverMarker.getLatLng();
        if (!driverPos) return;

        let origin, destination;

        if (currentOrder.status === 'accepted') {
            origin = [driverPos.lat, driverPos.lng];
            destination = [fromLat, fromLng];
        } else if (currentOrder.status === 'en_route') {
            origin = [driverPos.lat, driverPos.lng];
            destination = [toLat, toLng];
        } else {
            return;
        }

        if (routeControl) {
            map.removeControl(routeControl);
            routeControl = null;
        }

        routeControl = L.Routing.control({
            waypoints: [
                L.latLng(origin[0], origin[1]),
                L.latLng(destination[0], destination[1])
            ],
            routeWhileDragging: false,
            showAlternatives: false,
            lineOptions: {
                styles: [{ color: '#ffb000', weight: 4, opacity: 0.9 }],
                extendToWaypoints: true,
                missingRouteTolerance: 10,
            },
            addWaypoints: false,
            draggableWaypoints: false,
            fitSelectedRoutes: true,
            show: false,
        }).addTo(map);
    }

    // ============================================================
    // НАВИГАЦИЯ
    // ============================================================
    function openWaze(lat, lng, address) {
        let url;
        if (lat && lng) {
            url = `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`;
        } else if (address) {
            url = `https://waze.com/ul?q=${encodeURIComponent(address)}&navigate=yes`;
        } else {
            alert('❌ Не удалось определить местоположение');
            return;
        }
        window.open(url, '_blank');
    }

    function navigateToClient() {
        if (!currentOrder) return;
        const fromLat = currentOrder.client?.from?.lat || currentOrder.fromLat;
        const fromLng = currentOrder.client?.from?.lng || currentOrder.fromLng;
        const fromAddress = currentOrder.client?.from?.address || currentOrder.from;

        if (fromLat && fromLng) {
            openWaze(fromLat, fromLng, null);
        } else if (fromAddress) {
            openWaze(null, null, fromAddress);
        } else {
            alert('❌ Нет данных о местоположении клиента');
        }
    }

    function navigateToDestination() {
        if (!currentOrder) return;
        const toLat = currentOrder.destination?.lat || currentOrder.toLat;
        const toLng = currentOrder.destination?.lng || currentOrder.toLng;
        const toAddress = currentOrder.destination?.address || currentOrder.to;

        if (toLat && toLng) {
            openWaze(toLat, toLng, null);
        } else if (toAddress) {
            openWaze(null, null, toAddress);
        } else {
            alert('❌ Нет данных о месте назначения');
        }
    }

    // ============================================================
    // ПРИНЯТЬ / ОТКЛОНИТЬ
    // ============================================================
    async function acceptOrder(orderId) {
        try {
            const orderDoc = await db.collection('orders').doc(orderId).get();
            const order = orderDoc.data();
            
            if (order.acceptedBy && order.acceptedBy !== currentDriverId) {
                showNotification('⚠️ Этот заказ уже принят другим водителем', 'error');
                return;
            }
            
            await db.collection('orders').doc(orderId).update({
                status: 'accepted',
                acceptedBy: currentDriverId,
                acceptedAt: firebase.firestore.FieldValue.serverTimestamp(),
                dispatcherNote: 'Принят водителем ' + (driverData?.fullName || '')
            });
            
            await db.collection('users').doc(currentDriverId).update({
                'driverProfile.status': 'busy',
                'driverProfile.currentOrderId': orderId,
                'driverProfile.lastUpdated': firebase.firestore.FieldValue.serverTimestamp()
            });
            
            showNotification('✅ Заказ принят!', 'success');
        } catch (error) {
            console.error('❌ Ошибка принятия заказа:', error);
            showNotification('❌ Ошибка принятия заказа', 'error');
        }
    }

    async function rejectOrder(orderId) {
        if (!confirm('❌ Отклонить заказ?')) return;
        try {
            await db.collection('orders').doc(orderId).update({
                status: 'waiting',
                driverId: null,
                driverName: null,
                dispatcherNote: 'Отклонён водителем ' + (driverData?.fullName || ''),
                offeredTo: firebase.firestore.FieldValue.arrayRemove(currentDriverId)
            });
            
            await db.collection('users').doc(currentDriverId).update({
                'driverProfile.status': 'online',
                'driverProfile.currentOrderId': null,
                'driverProfile.lastUpdated': firebase.firestore.FieldValue.serverTimestamp()
            });
            
            currentOrder = null;
            currentOrderId = null;
            showNoOrder();
            clearMapMarkers();
            showNotification('❌ Заказ отклонён', 'info');
        } catch (error) {
            console.error('❌ Ошибка отклонения заказа:', error);
            showNotification('❌ Ошибка отклонения заказа', 'error');
        }
    }

    // ============================================================
    // ПРИБЫЛ К КЛИЕНТУ
    // ============================================================
    async function arrivedToClient() {
        if (!currentOrderId) return;

        try {
            await db.collection('orders').doc(currentOrderId).update({
                status: 'en_route',
                arrivedAt: firebase.firestore.FieldValue.serverTimestamp(),
                dispatcherNote: 'Водитель прибыл к клиенту'
            });
            console.log('✅ Водитель прибыл к клиенту');
            alert('✅ Вы прибыли к клиенту! Теперь следуйте к месту назначения.');
        } catch (error) {
            console.error('❌ Ошибка:', error);
        }
    }

    // ============================================================
    // ЗАКАЗ ВЫПОЛНЕН
    // ============================================================
    async function completeOrder() {
        if (!currentOrderId || !currentOrder) return;

        if (!confirm('✅ Подтвердить выполнение заказа? Деньги будут списаны с клиента.')) return;

        try {
            const price = currentOrder.price?.base || currentOrder.price || 0;
            const commission = price * 0.1;
            const driverEarn = price - commission;
            const bonusAmount = price * 0.01;

            await db.runTransaction(async (transaction) => {
                const clientId = currentOrder.clientId;
                const clientRef = db.collection('users').doc(clientId);
                const clientDoc = await transaction.get(clientRef);
                if (!clientDoc.exists) return;

                const clientBalance = clientDoc.data().wallet || 0;
                if (clientBalance < price) {
                    throw new Error('Недостаточно средств у клиента');
                }

                const driverRef = db.collection('users').doc(currentDriverId);
                const driverDoc = await transaction.get(driverRef);
                if (!driverDoc.exists) return;

                const driverProfile = driverDoc.data().driverProfile || {};
                const driverBalance = driverProfile.balance || 0;

                const updateData = {
                    wallet: clientBalance - price,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                if (clientDoc.data().email) {
                    const currentBonuses = clientDoc.data().bonuses || 0;
                    updateData.bonuses = currentBonuses + bonusAmount;
                    updateData.bonusesAvailable = true;
                }

                transaction.update(clientRef, updateData);

                transaction.update(driverRef, {
                    'driverProfile.balance': driverBalance + driverEarn,
                    'driverProfile.totalTrips': (driverProfile.totalTrips || 0) + 1,
                    'driverProfile.totalEarned': (driverProfile.totalEarned || 0) + driverEarn,
                    'driverProfile.status': 'online',
                    'driverProfile.currentOrderId': null,
                    'driverProfile.lastUpdated': firebase.firestore.FieldValue.serverTimestamp()
                });

                const txRef = db.collection('transactions').doc();
                transaction.set(txRef, {
                    userId: clientId,
                    type: 'payment',
                    amount: price,
                    currency: 'ILS',
                    description: `Оплата поездки ${currentOrderId}`,
                    orderId: currentOrderId,
                    status: 'completed',
                    commission: commission,
                    driverEarn: driverEarn,
                    bonusAmount: clientDoc.data().email ? bonusAmount : 0,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            });

            await db.collection('orders').doc(currentOrderId).update({
                status: 'completed',
                completedAt: firebase.firestore.FieldValue.serverTimestamp(),
                finalPrice: price,
                commission: commission,
                driverEarn: driverEarn,
                bonusAmount: bonusAmount,
                dispatcherNote: 'Заказ выполнен'
            });

            currentOrder = null;
            currentOrderId = null;
            showNoOrder();
            clearMapMarkers();

            alert(`✅ Заказ выполнен!\n💰 Сумма: ${price} ₪\n📊 Комиссия: ${commission.toFixed(2)} ₪\n🚗 Водитель: ${driverEarn.toFixed(2)} ₪\n🎁 Бонус клиенту: ${bonusAmount.toFixed(2)} ₪`);

        } catch (error) {
            console.error('❌ Ошибка выполнения заказа:', error);
            alert('❌ Ошибка: ' + error.message);
        }
    }

    // ============================================================
    // ЗАПУСК
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        initMap();
        console.log('🚗 WHEEL Driver loaded');
    });
</script>
