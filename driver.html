<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚕 Taxi – Водитель</title>
  <!-- Leaflet CSS & JS (бесплатная карта) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
      color: #1b2a3a;
    }
    .container { max-width: 1300px; margin: 0 auto; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin: 15px 0;
    }
    .hidden { display: none !important; }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
    }
    .nav a { text-decoration: none; color: #007bff; font-weight: 600; }
    .nav .logout-btn { background: #dc3545; color: white; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .nav .logout-btn:hover { background: #c82333; }
    #user-email { margin-left: auto; color: #555; font-size: 14px; }
    h1 { margin: 0 0 10px 0; font-weight: 600; }
    .flex-row { display: flex; gap: 25px; flex-wrap: wrap; }
    .flex-col { flex: 1; min-width: 300px; }
    label { font-weight: 600; display: block; margin-top: 12px; margin-bottom: 4px; }
    input, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 6px;
    }
    input:focus, select:focus { outline: 2px solid #007bff; border-color: transparent; }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      margin: 6px 0;
    }
    .btn-primary { background: #007bff; color: white; }
    .btn-primary:hover { background: #0056b3; }
    .btn-success { background: #28a745; color: white; }
    .btn-success:hover { background: #218838; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-danger:hover { background: #c82333; }
    .btn-warning { background: #ffc107; color: #212529; }
    .btn-warning:hover { background: #e0a800; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }
    #map { height: 480px; width: 100%; border-radius: 12px; background: #e9ecef; margin-top: 8px; }
    .map-hint { font-size: 13px; color: #666; margin-top: 6px; }
    .order-card { background: #f8f9fa; padding: 16px; border-radius: 12px; margin-top: 15px; }
    .order-card .status { font-weight: 700; font-size: 18px; }
    .status-offering { color: #17a2b8; }
    .status-accepted { color: #28a745; }
    .status-completed { color: #6c757d; }
    .status-cancelled { color: #dc3545; }
    .status-searching { color: #ffc107; }
    .driver-status { font-size: 14px; font-weight: 600; }
    .driver-status.online { color: #28a745; }
    .driver-status.offline { color: #dc3545; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; min-width: 120px; }
  </style>
</head>
<body>

<div class="container">
  <!-- Навигация -->
  <div class="nav">
    <a href="index.html">🏠 Главная</a>
    <a href="driver.html">🚗 Водитель</a>
    <button class="logout-btn" onclick="signOut()">🚪 Выйти</button>
    <span id="user-email"></span>
  </div>

  <h1>🚗 Интерфейс водителя</h1>

  <!-- Статус водителя -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
      <div>
        <span class="driver-status" id="driver-status-text">⏳ Загрузка...</span>
      </div>
      <div class="btn-row">
        <button class="btn btn-success" onclick="toggleAvailability(true)" style="width:auto; padding:8px 20px;">✅ На линии</button>
        <button class="btn btn-danger" onclick="toggleAvailability(false)" style="width:auto; padding:8px 20px;">❌ Не на линии</button>
        <button class="btn btn-secondary" onclick="enterCoordinates()" style="width:auto; padding:8px 20px;">📍 Ввести координаты</button>
      </div>
    </div>
  </div>

  <!-- Карта -->
  <div class="card">
    <div id="map"></div>
    <div class="map-hint">💡 Карта показывает ваше местоположение и заказы.</div>
  </div>

  <!-- Активные заказы -->
  <div class="card" id="active-orders-card">
    <h3>📋 Мои заказы</h3>
    <div id="active-orders-list"></div>
  </div>

  <!-- Доступные предложения -->
  <div class="card" id="offers-card">
    <h3>📨 Предложения заказов</h3>
    <div id="offers-list"></div>
  </div>
</div>

<script>
  // ==================== КОНФИГ FIREBASE ====================
  const firebaseConfig = {
    apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
    authDomain: "taxi-ai-app-69628.firebaseapp.com",
    projectId: "taxi-ai-app-69628",
    storageBucket: "taxi-ai-app-69628.firebasestorage.app",
    messagingSenderId: "952357992434",
    appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
    measurementId: "G-Z9NJFSSXH6"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
  let currentUser = null;
  let driverData = null;
  let map = null;
  let driverMarker = null;
  let clientMarker = null;
  let routeLine = null;
  let watchId = null;
  let orderUnsubscribe = null;
  let offerUnsubscribe = null;
  let currentOrderId = null;
  let mapInitialized = false;

  // ==================== ТАРИФЫ И БОНУСЫ ====================
  function getDistance(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // ==================== АУТЕНТИФИКАЦИЯ ====================
  auth.onAuthStateChanged(async function(user) {
    if (user) {
      currentUser = user;
      document.getElementById('user-email').textContent = '👤 ' + user.email;
      await loadDriverData();
      initMap();
      startTracking();
      listenOrders();
      listenOffers();
    } else {
      const session = localStorage.getItem('driverSession');
      if (session) {
        try {
          const data = JSON.parse(session);
          document.getElementById('user-email').textContent = '👤 ' + (data.fullName || 'Водитель');
          await loadDriverData();
          initMap();
          startTracking();
          listenOrders();
          listenOffers();
        } catch(e) {
          window.location.href = 'index.html';
        }
      } else {
        window.location.href = 'index.html';
      }
    }
  });

  async function loadDriverData() {
    if (!currentUser) return;
    try {
      const doc = await db.collection('drivers').doc(currentUser.uid).get();
      if (doc.exists) {
        driverData = doc.data();
        updateDriverStatusUI();
      } else {
        console.error('❌ Данные водителя не найдены');
        alert('⚠️ Сначала зарегистрируйтесь как водитель');
        window.location.href = 'index.html';
      }
    } catch (error) {
      console.error('❌ Ошибка загрузки данных водителя:', error);
    }
  }

  function updateDriverStatusUI() {
    if (!driverData) return;
    const statusEl = document.getElementById('driver-status-text');
    if (driverData.available) {
      statusEl.textContent = '✅ На линии';
      statusEl.className = 'driver-status online';
    } else {
      statusEl.textContent = '❌ Не на линии';
      statusEl.className = 'driver-status offline';
    }
  }

  function signOut() {
    if (watchId) navigator.geolocation.clearWatch(watchId);
    auth.signOut().then(() => {
      localStorage.removeItem('driverSession');
      window.location.href = 'index.html';
    });
  }

  // ==================== СТАТУС ВОДИТЕЛЯ ====================
  async function toggleAvailability(available) {
    if (!currentUser) return;
    try {
      await db.collection('drivers').doc(currentUser.uid).update({
        available: available
      });
      driverData.available = available;
      updateDriverStatusUI();
      console.log(`✅ Статус изменён: ${available ? 'На линии' : 'Не на линии'}`);
    } catch (error) {
      console.error('❌ Ошибка изменения статуса:', error);
      alert('❌ Ошибка: ' + error.message);
    }
  }

  function enterCoordinates() {
    const lat = prompt('Введите широту (lat):');
    const lng = prompt('Введите долготу (lng):');
    if (lat && lng) {
      const latNum = parseFloat(lat);
      const lngNum = parseFloat(lng);
      if (!isNaN(latNum) && !isNaN(lngNum)) {
        updateDriverLocation(latNum, lngNum);
        if (map) {
          map.setView([latNum, lngNum], 15);
        }
      } else {
        alert('❌ Введите корректные числа');
      }
    }
  }

  // ==================== GPS ТРЕКИНГ ====================
  function startTracking() {
    if (!navigator.geolocation) {
      console.warn('⚠️ GPS не поддерживается');
      return;
    }
    watchId = navigator.geolocation.watchPosition(
      pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        updateDriverLocation(lat, lng);
      },
      err => {
        console.warn('⚠️ Ошибка GPS:', err);
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  function updateDriverLocation(lat, lng) {
    if (!currentUser) return;
    db.collection('drivers').doc(currentUser.uid).update({
      lat: lat,
      lng: lng,
      lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      if (driverMarker) {
        driverMarker.setLatLng([lat, lng]);
      } else if (map) {
        const driverIcon = L.divIcon({
          html: '🚗',
          className: 'custom-marker',
          iconSize: [30, 30],
          iconAnchor: [15, 30]
        });
        driverMarker = L.marker([lat, lng], { icon: driverIcon }).addTo(map);
        driverMarker.bindPopup('🚗 Вы здесь');
        map.setView([lat, lng], 15);
      }
    }).catch(err => console.error('❌ Ошибка обновления позиции:', err));
  }

  // ==================== КАРТА (Leaflet) ====================
  function initMap() {
    if (mapInitialized) return;
    const mapElement = document.getElementById('map');
    if (!mapElement) return;

    try {
      map = L.map(mapElement).setView([31.5, 34.8], 8);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      // Маркер водителя
      if (driverData && driverData.lat && driverData.lng) {
        const driverIcon = L.divIcon({
          html: '🚗',
          className: 'custom-marker',
          iconSize: [30, 30],
          iconAnchor: [15, 30]
        });
        driverMarker = L.marker([driverData.lat, driverData.lng], { icon: driverIcon }).addTo(map);
        driverMarker.bindPopup('🚗 Вы здесь');
        map.setView([driverData.lat, driverData.lng], 12);
      }

      mapInitialized = true;
      console.log('🗺️ Карта инициализирована');
    } catch (error) {
      console.error('❌ Ошибка инициализации карты:', error);
    }
  }

  // ==================== НАЧИСЛЕНИЕ БОНУСА ====================
  async function calculateAndAddBonus(orderId, orderData) {
    console.log('🧮 Начисление бонуса для заказа:', orderId);
    console.log('📊 Данные заказа:', orderData);

    const clientId = orderData.clientId;
    if (!clientId || clientId.startsWith('guest-')) {
      console.log('⏭️ Клиент гость – бонус не начисляется');
      return;
    }

    const MIN_DISTANCE = 2.0;
    const BONUS_RATE = 0.02;

    let distanceKm = orderData.distance || 0;
    if (distanceKm === 0 && orderData.fromLat && orderData.fromLng && orderData.toLat && orderData.toLng) {
      distanceKm = getDistance(orderData.fromLat, orderData.fromLng, orderData.toLat, orderData.toLng);
    }

    console.log(`📏 Дистанция: ${distanceKm} км`);

    if (distanceKm < MIN_DISTANCE) {
      console.log(`⏭️ Бонус не начислен (дистанция ${distanceKm.toFixed(2)} км < ${MIN_DISTANCE} км)`);
      await db.collection('ai_logs').add({
        orderId: orderId,
        decision: `Бонус не начислен (дистанция ${distanceKm.toFixed(2)} км < ${MIN_DISTANCE} км)`,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      return;
    }

    const bonusAmount = Math.round((orderData.price || 0) * BONUS_RATE * 100) / 100;
    console.log(`💰 Сумма бонуса: ${bonusAmount} ₪`);

    if (bonusAmount <= 0) {
      console.log('⏭️ Сумма бонуса <= 0, начисление отменено');
      return;
    }

    try {
      const clientRef = db.collection('users_bonus').doc(clientId);
      await db.runTransaction(async (transaction) => {
        const doc = await transaction.get(clientRef);
        const currentBalance = doc.exists ? (doc.data().balance || 0) : 0;
        const currentTotalEarned = doc.exists ? (doc.data().totalEarned || 0) : 0;

        transaction.set(clientRef, {
          balance: currentBalance + bonusAmount,
          totalEarned: currentTotalEarned + bonusAmount,
          totalSpent: doc.exists ? (doc.data().totalSpent || 0) : 0,
          level: currentTotalEarned + bonusAmount > 500 ? 'Silver' : 'Bronze',
          lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        const transRef = db.collection('bonus_transactions').doc();
        transaction.set(transRef, {
          clientId: clientId,
          orderId: orderId,
          type: 'earned',
          amount: bonusAmount,
          description: `2% бонус за поездку (${distanceKm.toFixed(1)} км, ${orderData.price}₪)`,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          status: 'completed'
        });
      });

      await db.collection('ai_logs').add({
        orderId: orderId,
        decision: `Начислен бонус ${bonusAmount}₪ клиенту (2% от ${orderData.price}₪)`,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      console.log(`✅ Бонус ${bonusAmount}₪ начислен клиенту ${clientId}`);
    } catch (error) {
      console.error('❌ Ошибка начисления бонуса:', error);
      throw error;
    }
  }

  // ==================== ЗАВЕРШЕНИЕ ЗАКАЗА ====================
  async function completeOrder(orderId) {
    if (!orderId) {
      alert('❌ Нет активного заказа');
      return;
    }
    if (!confirm('✅ Завершить заказ?')) return;

    console.log('🔄 Начинаем завершение заказа:', orderId);

    try {
      // 1. Получаем данные заказа
      const doc = await db.collection('orders').doc(orderId).get();
      if (!doc.exists) throw new Error('Заказ не найден');
      const orderData = doc.data();
      console.log('📋 Данные заказа:', orderData);

      // 2. Проверяем статус
      if (orderData.status === 'completed') {
        alert('⚠️ Заказ уже завершён');
        return;
      }

      // 3. Обновляем статус заказа
      await db.collection('orders').doc(orderId).update({
        status: 'completed',
        completedAt: firebase.firestore.FieldValue.serverTimestamp(),
        aiNote: 'Заказ завершён водителем'
      });
      console.log('✅ Статус заказа обновлён на completed');

      // 4. Начисляем бонус клиенту
      await calculateAndAddBonus(orderId, orderData);
      console.log('✅ Бонус начислен');

      // 5. Водитель становится доступным
      await db.collection('drivers').doc(currentUser.uid).update({
        available: true,
        currentOrderId: null
      });
      console.log('✅ Водитель снова доступен');

      // 6. Обновляем локальные данные
      driverData.available = true;
      updateDriverStatusUI();

      alert('✅ Заказ завершён! Бонус начислен клиенту.');
      currentOrderId = null;

    } catch (error) {
      console.error('❌ Ошибка завершения заказа:', error);
      alert('❌ Ошибка: ' + error.message);
    }
  }

  // ==================== ПРИНЯТИЕ ЗАКАЗА ====================
  async function acceptOrder(orderId) {
    if (!confirm('🚖 Принять заказ?')) return;

    try {
      const doc = await db.collection('orders').doc(orderId).get();
      if (!doc.exists) throw new Error('Заказ не найден');
      const orderData = doc.data();

      if (orderData.status !== 'offering') {
        alert('⚠️ Этот заказ уже не доступен');
        return;
      }

      // Обновляем заказ
      await db.collection('orders').doc(orderId).update({
        status: 'accepted',
        driverId: currentUser.uid,
        driverName: driverData.fullName || 'Водитель',
        driverPhone: driverData.phone || '—',
        driverCar: `${driverData.carModel || ''} ${driverData.carNumber || ''}`.trim() || '—',
        aiNote: 'Заказ принят водителем'
      });

      // Водитель становится занятым
      await db.collection('drivers').doc(currentUser.uid).update({
        available: false,
        currentOrderId: orderId
      });

      driverData.available = false;
      updateDriverStatusUI();
      currentOrderId = orderId;

      alert('✅ Заказ принят!');

      // Показываем маршрут к клиенту
      if (orderData.fromLat && orderData.fromLng) {
        showRouteToClient(orderData.fromLat, orderData.fromLng);
      }

    } catch (error) {
      console.error('❌ Ошибка принятия заказа:', error);
      alert('❌ Ошибка: ' + error.message);
    }
  }

  // ==================== ПОСТРОЕНИЕ МАРШРУТА К КЛИЕНТУ ====================
  function showRouteToClient(clientLat, clientLng) {
    if (!map || !driverData || !driverData.lat || !driverData.lng) return;

    // Маркер клиента
    if (clientMarker) map.removeLayer(clientMarker);
    const clientIcon = L.divIcon({
      html: '📍',
      className: 'custom-marker',
      iconSize: [30, 30],
      iconAnchor: [15, 30]
    });
    clientMarker = L.marker([clientLat, clientLng], { icon: clientIcon }).addTo(map);
    clientMarker.bindPopup('Клиент');

    // Маршрут через OSRM
    const url = `https://router.project-osrm.org/route/v1/driving/${driverData.lng},${driverData.lat};${clientLng},${clientLat}?overview=full&geometries=geojson`;

    fetch(url)
      .then(response => response.json())
      .then(data => {
        if (routeLine) map.removeLayer(routeLine);
        if (data && data.routes && data.routes.length > 0) {
          const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          routeLine = L.polyline(coords, { color: 'green', weight: 4, opacity: 0.8 }).addTo(map);
          map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
        }
      })
      .catch(err => console.error('❌ Ошибка построения маршрута:', err));
  }

  // ==================== ПРОСЛУШКА АКТИВНЫХ ЗАКАЗОВ ====================
  function listenOrders() {
    if (orderUnsubscribe) orderUnsubscribe();

    orderUnsubscribe = db.collection('orders')
      .where('driverId', '==', currentUser ? currentUser.uid : '')
      .where('status', 'in', ['accepted', 'started', 'assigned'])
      .onSnapshot(snapshot => {
        const container = document.getElementById('active-orders-list');
        container.innerHTML = '';

        if (snapshot.empty) {
          container.innerHTML = '<p style="color:#666;">Нет активных заказов</p>';
          return;
        }

        snapshot.forEach(doc => {
          const data = doc.data();
          const orderId = doc.id;
          currentOrderId = orderId;

          const statusMap = {
            'accepted': '🟢 Принят',
            'started': '🟢 В пути',
            'assigned': '🔵 Назначен'
          };

          const card = document.createElement('div');
          card.className = 'order-card';
          card.innerHTML = `
            <div><strong>Откуда:</strong> ${data.from || '—'}</div>
            <div><strong>Куда:</strong> ${data.to || '—'}</div>
            <div><strong>Статус:</strong> <span class="status status-${data.status}">${statusMap[data.status] || data.status}</span></div>
            <div><strong>Цена:</strong> ${data.price || 0} ₪</div>
            <div><strong>Клиент:</strong> ${data.clientName || '—'}</div>
            <div><strong>🧠 ИИ:</strong> ${data.aiNote || '—'}</div>
            <button class="btn btn-success" onclick="completeOrder('${orderId}')" style="width:auto; margin-top:10px;">✅ Завершить заказ</button>
            <button class="btn btn-secondary" onclick="showRouteToClient(${data.fromLat || 0}, ${data.fromLng || 0})" style="width:auto;">🗺️ Маршрут к клиенту</button>
          `;
          container.appendChild(card);
        });
      }, error => console.error('❌ Ошибка прослушки заказов:', error));
  }

  // ==================== ПРОСЛУШКА ПРЕДЛОЖЕНИЙ ====================
  function listenOffers() {
    if (offerUnsubscribe) offerUnsubscribe();

    const userId = currentUser ? currentUser.uid : '';
    if (!userId) return;

    offerUnsubscribe = db.collection('orders')
      .where('status', '==', 'offering')
      .where('offeredTo', 'array-contains', userId)
      .onSnapshot(snapshot => {
        const container = document.getElementById('offers-list');
        container.innerHTML = '';

        if (snapshot.empty) {
          container.innerHTML = '<p style="color:#666;">Нет новых предложений</p>';
          return;
        }

        snapshot.forEach(doc => {
          const data = doc.data();
          const orderId = doc.id;

          const card = document.createElement('div');
          card.className = 'order-card';
          card.innerHTML = `
            <div><strong>Откуда:</strong> ${data.from || '—'}</div>
            <div><strong>Куда:</strong> ${data.to || '—'}</div>
            <div><strong>Цена:</strong> ${data.price || 0} ₪</div>
            <div><strong>Дистанция:</strong> ${(data.distance || 0).toFixed(1)} км</div>
            <div><strong>Клиент:</strong> ${data.clientName || '—'}</div>
            <div><strong>🧠 ИИ:</strong> ${data.aiNote || '—'}</div>
            <button class="btn btn-primary" onclick="acceptOrder('${orderId}')" style="width:auto; margin-top:10px;">🚖 Принять заказ</button>
          `;
          container.appendChild(card);
        });
      }, error => console.error('❌ Ошибка прослушки предложений:', error));
  }
</script>
</body>
</html>
