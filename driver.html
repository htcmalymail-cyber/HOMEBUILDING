<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>🚕 Taxi – Водитель</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin:0; padding:20px; background:#f0f2f5; }
    .container { max-width:1200px; margin:0 auto; }
    .card { background:white; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1); margin:15px 0; }
    .hidden { display:none; }
    button { padding:8px 18px; margin:5px; border:none; border-radius:6px; background:#28a745; color:#fff; font-weight:600; cursor:pointer; }
    button:hover { background:#218838; }
    button.danger { background:#dc3545; }
    button.danger:hover { background:#c82333; }
    button.warning { background:#ffc107; color:#212529; }
    button.warning:hover { background:#e0a800; }
    button.primary { background:#007bff; }
    button.primary:hover { background:#0056b3; }
    input { padding:8px; margin:5px; width:100%; max-width:300px; border:1px solid #ccc; border-radius:6px; }
    #map { height:400px; width:100%; border-radius:8px; }
    .flex-row { display:flex; gap:20px; flex-wrap:wrap; }
    .flex-col { flex:1; min-width:300px; }
    .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; }
    .badge-assigned { background:#17a2b8; color:white; }
    .badge-accepted { background:#28a745; color:white; }
    .badge-completed { background:#6c757d; color:white; }
    .nav { margin-bottom:20px; }
    .nav a { margin-right:15px; text-decoration:none; color:#007bff; font-weight:bold; }
    .alert { background:#fff3cd; border:1px solid #ffeeba; padding:12px; border-radius:8px; margin:10px 0; color:#856404; }
  </style>
</head>
<body>
<div class="container">
  <div class="nav">
    <a href="index.html">🏠 Главная</a>
    <a href="client.html">Клиент</a>
    <a href="driver.html">Водитель</a>
  </div>
  <h1>🚕 Taxi – Водитель</h1>

  <!-- Авторизация -->
  <div id="auth-section" class="card">
    <h3>Регистрация / Вход водителя</h3>
    <input type="email" id="email" placeholder="Email" value="driver@taxi.com">
    <input type="password" id="password" placeholder="Пароль" value="123456">
    <input type="text" id="phone" placeholder="Номер телефона (обязательно)" value="+7 999 888-77-66">
    <button onclick="signUp()">Зарегистрироваться как водитель</button>
    <button onclick="signIn()">Войти</button>
    <button onclick="signOut()">Выйти</button>
    <p id="user-status">Не авторизован</p>
  </div>

  <!-- Интерфейс водителя -->
  <div id="driver-section" class="hidden">
    <div class="card">
      <!-- Если пользователь авторизован, но не водитель -->
      <div id="not-driver-alert" class="alert hidden">
        <strong>Вы вошли как клиент.</strong> Хотите стать водителем? Нажмите кнопку ниже, чтобы обновить свой аккаунт.
        <br><br>
        <input type="text" id="upgrade-phone" placeholder="Ваш номер телефона" value="+7 999 888-77-66">
        <button class="primary" onclick="upgradeToDriver()">📈 Стать водителем</button>
      </div>
      <!-- Основной интерфейс водителя -->
      <div id="driver-content" class="hidden">
        <div class="flex-row">
          <div class="flex-col">
            <h4>Мои заказы</h4>
            <div id="driver-orders-list"></div>
            <br>
            <button onclick="toggleAvailability()">🔄 Доступен/Недоступен</button>
            <button class="danger" onclick="completeOrder()">✅ Завершить последний заказ</button>
            <p id="driver-status"></p>
            <p id="driver-location-info"></p>
            <button onclick="manualLocation()">📍 Ввести координаты вручную</button>
          </div>
          <div class="flex-col">
            <h4>Карта (клиент на заказе)</h4>
            <div id="map"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
    authDomain: "taxi-ai-app-69628.firebaseapp.com",
    projectId: "taxi-ai-app-69628",
    storageBucket: "taxi-ai-app-69628.firebasestorage.app",
    messagingSenderId: "952357992434",
    appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
    measurementId: "G-Z9NJFSSXH6"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  let currentUser = null;
  let currentUserData = null;
  let map = null;
  let clientMarker = null;
  let watchId = null;
  let activeOrderId = null;

  // === АУТЕНТИФИКАЦИЯ ===
  auth.onAuthStateChanged(async function(user) {
    if (user) {
      currentUser = user;
      document.getElementById('user-status').innerHTML = '✅ Вошёл: ' + user.email;
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('driver-section').classList.remove('hidden');
      
      // Загружаем данные пользователя
      try {
        await loadUserData();
        // После загрузки проверяем роль
        if (currentUserData && currentUserData.role === 'driver') {
          // Показываем интерфейс водителя
          document.getElementById('not-driver-alert').classList.add('hidden');
          document.getElementById('driver-content').classList.remove('hidden');
          initMap();
          listenDriverOrders();
          updateDriverStatus();
          startGpsTracking();
        } else {
          // Пользователь авторизован, но не водитель
          document.getElementById('not-driver-alert').classList.remove('hidden');
          document.getElementById('driver-content').classList.add('hidden');
        }
      } catch (error) {
        console.error('Ошибка загрузки:', error);
      }
    } else {
      currentUser = null;
      currentUserData = null;
      document.getElementById('user-status').innerHTML = '❌ Не авторизован';
      document.getElementById('auth-section').style.display = 'block';
      document.getElementById('driver-section').classList.add('hidden');
      document.getElementById('not-driver-alert').classList.add('hidden');
      document.getElementById('driver-content').classList.add('hidden');
      if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    }
  });

  function loadUserData() {
    return db.collection('users').doc(currentUser.uid).get().then(doc => {
      if (doc.exists) {
        currentUserData = doc.data();
        // Если роль не driver, оставляем как есть (покажем предложение стать водителем)
        // Если роль driver, но нет телефона – запросим
        if (currentUserData.role === 'driver') {
          if (!currentUserData.phone) {
            const phone = prompt('Введите ваш номер телефона (обязательно):', '+7 999 888-77-66');
            if (phone) {
              return db.collection('users').doc(currentUser.uid).update({ phone: phone })
                .then(() => { currentUserData.phone = phone; });
            }
          }
          // Если координаты не заданы
          if (!currentUserData.lat || currentUserData.lat === 0) {
            return db.collection('users').doc(currentUser.uid).update({ lat: 55.7558, lng: 37.6173 });
          }
        }
      } else {
        // Если документа нет – создадим как клиента (но это не должно случиться, т.к. регистрация создаёт)
        return db.collection('users').doc(currentUser.uid).set({
          email: currentUser.email,
          name: 'Пользователь',
          role: 'client',
          phone: '',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
          currentUserData = { role: 'client' };
        });
      }
    });
  }

  // === ПОВЫШЕНИЕ ДО ВОДИТЕЛЯ ===
  function upgradeToDriver() {
    if (!currentUser) { alert('Сначала войдите'); return; }
    const phone = document.getElementById('upgrade-phone').value.trim();
    if (!phone) { alert('Введите номер телефона'); return; }
    db.collection('users').doc(currentUser.uid).update({
      role: 'driver',
      phone: phone,
      available: true,
      lat: 55.7558,
      lng: 37.6173
    })
    .then(() => {
      alert('Поздравляем! Вы теперь водитель. Обновите страницу или перезайдите.');
      // Обновляем данные и перезагружаем интерфейс
      return loadUserData();
    })
    .then(() => {
      location.reload(); // простой способ обновить состояние
    })
    .catch(e => alert('Ошибка обновления: ' + e.message));
  }

  // === РЕГИСТРАЦИЯ НОВОГО ВОДИТЕЛЯ ===
  function signUp() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const phone = document.getElementById('phone').value.trim();
    if (!phone) { alert('Номер телефона обязателен для регистрации водителя!'); return; }
    auth.createUserWithEmailAndPassword(email, password)
      .then(cred => {
        return db.collection('users').doc(cred.user.uid).set({
          email: email,
          name: 'Водитель',
          role: 'driver',
          phone: phone,
          available: true,
          lat: 55.7558,
          lng: 37.6173,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      })
      .then(() => alert('Регистрация водителя успешна! Войдите.'))
      .catch(e => alert('Ошибка: ' + e.message));
  }

  function signIn() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    auth.signInWithEmailAndPassword(email, password)
      .catch(e => alert('Ошибка входа: ' + e.message));
  }

  function signOut() { auth.signOut(); }

  // === КАРТА ===
  function initMap() {
    if (map) return;
    map = L.map('map').setView([55.7558, 37.6173], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);
  }

  // Слушаем заказы, назначенные на этого водителя (статусы assigned, accepted, started)
  function listenDriverOrders() {
    if (!currentUser) return;
    db.collection('orders')
      .where('driverId', '==', currentUser.uid)
      .where('status', 'in', ['assigned', 'accepted', 'started'])
      .onSnapshot(snapshot => {
        let html = '';
        let hasActive = false;
        snapshot.forEach(doc => {
          const data = doc.data();
          const orderId = doc.id;
          hasActive = true;
          activeOrderId = orderId;
          html += '<div class="order-item"><b>Заказ:</b> ' + data.from + ' → ' + data.to +
            ' | Статус: <span class="badge badge-'+data.status+'">'+data.status+'</span>' +
            (data.aiNote ? ' | ' + data.aiNote : '') +
            '</div>';
          // Показываем клиента на карте
          if (data.fromLat && data.fromLng && data.status !== 'completed') {
            if (clientMarker) map.removeLayer(clientMarker);
            clientMarker = L.marker([data.fromLat, data.fromLng])
              .bindPopup('Клиент: ' + data.clientEmail + '<br>Адрес: ' + data.from)
              .addTo(map);
            map.setView([data.fromLat, data.fromLng], 14);
          }
          if (data.status === 'assigned') {
            html += '<button class="warning" onclick="acceptOrder(\''+orderId+'\')">✅ Принять заказ</button>';
          }
        });
        document.getElementById('driver-orders-list').innerHTML = html || 'Нет активных заказов';
        if (!hasActive) {
          if (clientMarker) { map.removeLayer(clientMarker); clientMarker = null; }
          activeOrderId = null;
        }
      }, error => console.error('Ошибка прослушки заказов водителя:', error));
  }

  // Принятие заказа
  function acceptOrder(orderId) {
    if (!orderId) return;
    if (!confirm('Вы уверены, что принимаете этот заказ?')) return;
    db.collection('orders').doc(orderId).update({
      status: 'accepted',
      aiNote: 'Водитель принял заказ'
    })
    .then(() => {
      alert('Заказ принят! Поездка началась.');
    })
    .catch(e => alert('Ошибка: ' + e.message));
  }

  // === GPS-ТРЕКИНГ ===
  function startGpsTracking() {
    if (!navigator.geolocation) {
      alert('Ваш браузер не поддерживает GPS. Введите координаты вручную.');
      return;
    }
    if (watchId) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(
      position => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        db.collection('users').doc(currentUser.uid).update({ lat, lng })
          .then(() => {
            currentUserData.lat = lat;
            currentUserData.lng = lng;
            document.getElementById('driver-location-info').innerHTML = 
              '📍 Мои координаты: ' + lat.toFixed(6) + ', ' + lng.toFixed(6);
          })
          .catch(e => console.error('Ошибка обновления GPS:', e));
      },
      error => {
        console.error('GPS ошибка:', error);
        alert('Ошибка GPS: ' + error.message + '. Введите координаты вручную через кнопку.');
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );
  }

  function manualLocation() {
    const lat = prompt('Введите широту (например, 55.7539):', '55.7539');
    const lng = prompt('Введите долготу (например, 37.6208):', '37.6208');
    if (lat && lng) {
      const newLat = parseFloat(lat);
      const newLng = parseFloat(lng);
      if (!isNaN(newLat) && !isNaN(newLng)) {
        db.collection('users').doc(currentUser.uid).update({ lat: newLat, lng: newLng })
          .then(() => {
            currentUserData.lat = newLat;
            currentUserData.lng = newLng;
            document.getElementById('driver-location-info').innerHTML = 
              '📍 Мои координаты: ' + newLat.toFixed(6) + ', ' + newLng.toFixed(6);
            alert('Координаты обновлены!');
          })
          .catch(e => alert('Ошибка: ' + e.message));
      } else {
        alert('Введите корректные числа');
      }
    }
  }

  // === УПРАВЛЕНИЕ СТАТУСОМ ===
  function toggleAvailability() {
    if (!currentUserData) return;
    const newVal = !currentUserData.available;
    db.collection('users').doc(currentUser.uid).update({ available: newVal })
      .then(() => {
        currentUserData.available = newVal;
        updateDriverStatus();
        alert('Статус изменён: ' + (newVal ? 'Доступен' : 'Недоступен'));
      })
      .catch(e => alert('Ошибка: ' + e.message));
  }

  function updateDriverStatus() {
    if (currentUserData && currentUserData.role === 'driver') {
      const statusText = currentUserData.available ? '🟢 Доступен' : '🔴 Недоступен';
      document.getElementById('driver-status').innerHTML = 'Текущий статус: ' + statusText;
    }
  }

  function completeOrder() {
    if (!currentUser) { alert('Войдите!'); return; }
    db.collection('orders')
      .where('driverId', '==', currentUser.uid)
      .where('status', 'in', ['assigned', 'accepted', 'started'])
      .orderBy('createdAt', 'desc')
      .limit(1)
      .get()
      .then(snapshot => {
        if (snapshot.empty) { alert('Нет активных заказов для завершения'); return; }
        const doc = snapshot.docs[0];
        const orderId = doc.id;
        return db.collection('orders').doc(orderId).update({
          status: 'completed',
          aiNote: 'Завершён водителем'
        })
        .then(() => db.collection('users').doc(currentUser.uid).update({ available: true }))
        .then(() => {
          currentUserData.available = true;
          updateDriverStatus();
          alert('Заказ завершён! Вы снова доступны.');
        });
      })
      .catch(e => alert('Ошибка: ' + e.message));
  }
</script>
</body>
</html>
