<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой кабинет</title>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0a0c10;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1a1e26;
            border-radius: 20px;
            padding: 30px 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
            color: #ffb000;
        }
        .field {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .field .label {
            color: #8899aa;
            font-size: 14px;
        }
        .field .value {
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            word-break: break-all;
            text-align: right;
            max-width: 60%;
        }
        .field .value.gold {
            color: #ffb000;
        }
        .field .value.red {
            color: #ff6b6b;
        }
        .field .value.green {
            color: #4ade80;
        }
        .field .value.blue {
            color: #60a5fa;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .btn-order {
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
        }
        .btn-order:active {
            transform: scale(0.97);
        }
        .btn-logout {
            background: rgba(255, 70, 70, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255, 70, 70, 0.2);
        }
        .btn-logout:active {
            transform: scale(0.97);
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 13px;
        }
        .history-item .desc {
            color: #e0e8f0;
        }
        .history-item .amount {
            font-weight: 600;
        }
        .history-item .amount.plus {
            color: #4ade80;
        }
        .history-item .amount.minus {
            color: #ff6b6b;
        }
        .history-date {
            font-size: 10px;
            color: #667788;
            margin-top: 2px;
        }

        .empty {
            color: #667788;
            text-align: center;
            padding: 20px 0;
            font-size: 14px;
        }
        .loading {
            color: #8899aa;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
        }

        .error-box {
            background: rgba(255, 70, 70, 0.1);
            border: 1px solid rgba(255, 70, 70, 0.2);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .uid-display {
            font-size: 11px;
            color: #556677;
            text-align: center;
            margin-top: 8px;
            word-break: break-all;
        }

        hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin: 16px 0;
        }

        .history-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #e0e8f0;
            font-size: 15px;
        }

        .flex-row {
            display: flex;
            gap: 10px;
        }
        .flex-row .btn {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="card" id="app">

        <h1>🚖 Мой кабинет</h1>

        <!-- Блок ошибок -->
        <div class="error-box" id="errorBox">
            ⚠️ <span id="errorText">Ошибка</span>
        </div>

        <!-- ===== ДАННЫЕ ПОЛЬЗОВАТЕЛЯ ===== -->
        <div class="field">
            <span class="label">👤 Имя</span>
            <span class="value" id="userName">Загрузка...</span>
        </div>
        <div class="field">
            <span class="label">📧 Email</span>
            <span class="value" id="userEmail">---</span>
        </div>
        <div class="field">
            <span class="label">🆔 UID</span>
            <span class="value" id="userUid" style="font-size:12px;">---</span>
        </div>

        <hr>

        <!-- ===== СТАТИСТИКА ===== -->
        <div class="field">
            <span class="label">💰 Баланс</span>
            <span class="value gold" id="balance">0 ₽</span>
        </div>
        <div class="field">
            <span class="label">⭐ Рейтинг</span>
            <span class="value blue" id="rating">0.0</span>
        </div>
        <div class="field">
            <span class="label">🎁 Бонусы</span>
            <span class="value gold" id="bonus">0</span>
        </div>
        <div class="field">
            <span class="label">📊 Потрачено</span>
            <span class="value red" id="totalSpent">0 ₽</span>
        </div>

        <hr>

        <!-- ===== КНОПКИ ===== -->
        <button class="btn btn-order" id="orderBtn">📍 Заказать такси</button>
        <button class="btn btn-logout" id="logoutBtn">🚪 Выйти</button>

        <hr>

        <!-- ===== ИСТОРИЯ ===== -->
        <div class="history-title">📋 История операций</div>
        <div id="historyList">
            <div class="loading">⏳ Загрузка...</div>
        </div>

        <div class="uid-display" id="uidDisplay"></div>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT (максимально простой) -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // 1. КОНФИГ
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        // ============================================================
        // 2. ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();

        console.log('🔥 Firebase готов');

        // ============================================================
        // 3. ЭЛЕМЕНТЫ
        // ============================================================
        var el = {
            userName: document.getElementById('userName'),
            userEmail: document.getElementById('userEmail'),
            userUid: document.getElementById('userUid'),
            balance: document.getElementById('balance'),
            rating: document.getElementById('rating'),
            bonus: document.getElementById('bonus'),
            totalSpent: document.getElementById('totalSpent'),
            historyList: document.getElementById('historyList'),
            errorBox: document.getElementById('errorBox'),
            errorText: document.getElementById('errorText'),
            uidDisplay: document.getElementById('uidDisplay')
        };

        // ============================================================
        // 4. ФУНКЦИИ
        // ============================================================
        function showError(text) {
            el.errorBox.style.display = 'block';
            el.errorText.textContent = text;
        }

        function hideError() {
            el.errorBox.style.display = 'none';
        }

        function updateUI(data) {
            console.log('📊 updateUI:', data);
            if (!data) return;
            el.balance.textContent = (data.balance || 0).toFixed(2) + ' ₽';
            el.rating.textContent = (data.rating || 0).toFixed(1);
            el.bonus.textContent = data.bonus || 0;
            el.totalSpent.textContent = (data.totalSpent || 0).toFixed(2) + ' ₽';
        }

        function renderTransactions(transactions) {
            console.log('📋 renderTransactions:', transactions ? transactions.length : 0);
            if (!transactions || transactions.length === 0) {
                el.historyList.innerHTML = '<div class="empty">Нет операций</div>';
                return;
            }
            var html = '';
            transactions.forEach(function(tx) {
                var amount = tx.amount || 0;
                var sign = amount >= 0 ? '+' : '';
                var cls = amount >= 0 ? 'plus' : 'minus';
                var date = '—';
                if (tx.timestamp) {
                    try {
                        if (tx.timestamp.seconds) {
                            date = new Date(tx.timestamp.seconds * 1000).toLocaleString('ru-RU');
                        } else {
                            date = new Date(tx.timestamp).toLocaleString('ru-RU');
                        }
                    } catch (e) {
                        date = '—';
                    }
                }
                html += `
                        <div class="history-item">
                            <div>
                                <div class="desc">${tx.description || 'Операция'}</div>
                                <div class="history-date">${date}</div>
                            </div>
                            <div class="amount ${cls}">${sign}${amount.toFixed(2)} ₽</div>
                        </div>
                    `;
            });
            el.historyList.innerHTML = html;
        }

        // ============================================================
        // 5. ОСНОВНАЯ ЛОГИКА
        // ============================================================
        auth.onAuthStateChanged(function(user) {
            console.log('🔐 onAuthStateChanged, user:', user ? user.uid : 'null');

            if (!user) {
                console.log('❌ Не авторизован → index.html');
                window.location.href = 'index.html';
                return;
            }

            // Показываем UID
            el.userUid.textContent = user.uid.substring(0, 16) + '...';
            el.uidDisplay.textContent = 'UID: ' + user.uid;

            var userRef = db.collection('users').doc(user.uid);

            // === ЗАГРУЗКА ДАННЫХ ===
            userRef.get()
                .then(function(doc) {
                    console.log('📥 getDoc:', doc.exists ? '✅ существует' : '❌ НЕТ');

                    if (!doc.exists) {
                        // Создаём документ
                        console.log('⚠️ Создаём документ...');
                        var newData = {
                            uid: user.uid,
                            email: user.email,
                            role: 'client',
                            displayName: user.displayName || 'Пользователь',
                            balance: 0,
                            rating: 0,
                            bonus: 0,
                            penalty: 0,
                            premium: 0,
                            totalEarned: 0,
                            totalSpent: 0,
                            driverData: null,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        };

                        userRef.set(newData)
                            .then(function() {
                                console.log('✅ Документ создан');
                                el.userName.textContent = newData.displayName;
                                el.userEmail.textContent = user.email;
                                updateUI(newData);
                                hideError();
                                // Подписки
                                subscribeUser(userRef);
                                subscribeTransactions(user.uid);
                            })
                            .catch(function(err) {
                                console.error('❌ Ошибка создания:', err);
                                showError('Ошибка создания: ' + err.message);
                            });
                        return;
                    }

                    // Документ есть
                    var data = doc.data();
                    console.log('✅ Данные:', data);
                    el.userName.textContent = data.displayName || 'Пользователь';
                    el.userEmail.textContent = user.email || '';
                    updateUI(data);
                    hideError();

                    // Подписки
                    subscribeUser(userRef);
                    subscribeTransactions(user.uid);

                })
                .catch(function(err) {
                    console.error('❌ Ошибка загрузки:', err);
                    showError('Ошибка: ' + err.message);
                    el.historyList.innerHTML = '<div class="empty">❌ Ошибка</div>';
                });
        });

        // ============================================================
        // 6. ПОДПИСКИ (REAL-TIME)
        // ============================================================
        var unsubUser = null;
        var unsubTx = null;

        function subscribeUser(userRef) {
            if (unsubUser) { unsubUser();
                unsubUser = null; }
            unsubUser = userRef.onSnapshot(function(snap) {
                if (snap.exists) {
                    var data = snap.data();
                    console.log('🔄 Обновление user:', data);
                    el.userName.textContent = data.displayName || 'Пользователь';
                    el.userEmail.textContent = data.email || '';
                    updateUI(data);
                    hideError();
                }
            }, function(err) {
                console.error('❌ Ошибка подписки user:', err);
                showError('Ошибка обновления: ' + err.message);
            });
        }

        function subscribeTransactions(uid) {
            if (unsubTx) { unsubTx();
                unsubTx = null; }

            var q = db.collection('transactions')
                .where('userId', '==', uid)
                .orderBy('timestamp', 'desc')
                .limit(10);

            unsubTx = q.onSnapshot(function(snapshot) {
                var transactions = [];
                snapshot.forEach(function(doc) {
                    transactions.push({ id: doc.id, ...doc.data() });
                });
                console.log('🔄 Транзакции обновлены:', transactions.length);
                renderTransactions(transactions);
            }, function(err) {
                console.error('❌ Ошибка подписки tx:', err);
                el.historyList.innerHTML = '<div class="empty">❌ Ошибка истории</div>';
            });
        }

        // ============================================================
        // 7. КНОПКИ
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', function() {
            console.log('🚪 Выход');
            if (unsubUser) { unsubUser();
                unsubUser = null; }
            if (unsubTx) { unsubTx();
                unsubTx = null; }
            auth.signOut()
                .then(function() { window.location.href = 'index.html'; })
                .catch(function() { window.location.href = 'index.html'; });
        });

        document.getElementById('orderBtn').addEventListener('click', function() {
            window.location.href = 'order.html';
        });
    </script>

</body>
</html>
