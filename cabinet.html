<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Личный кабинет — WHEEL</title>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            collection,
            query,
            where,
            orderBy,
            limit,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
    </script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'SF Pro Display', 'Inter', sans-serif;
            background: #0a0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255,180,0,0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0,160,255,0.06) 0%, transparent 40%);
            background-attachment: fixed;
        }
        .phone-frame {
            width:100%; max-width:400px;
            background:rgba(18,22,28,0.9);
            backdrop-filter:blur(25px);
            border-radius:44px;
            padding:20px 24px 32px;
            box-shadow:0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.08);
            display:flex;
            flex-direction:column;
            align-items:center;
            color:white;
            position:relative;
            min-height:500px;
        }
        .header {
            width:100%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
            padding-top:30px;
        }
        .user-info { display:flex; flex-direction:column; align-items:flex-start; }
        .user-name { font-size:20px; font-weight:700; color:#fff; }
        .user-email { font-size:13px; color:#8899aa; }
        .user-uid { font-size:11px; color:#556677; margin-top:2px; }

        .logout-btn {
            background:rgba(255,70,70,0.1);
            border:1px solid rgba(255,70,70,0.2);
            border-radius:12px;
            padding:8px 14px;
            color:#ff6b6b;
            font-size:13px;
            font-weight:600;
            cursor:pointer;
            transition:all 0.2s;
        }
        .logout-btn:hover {
            background:rgba(255,70,70,0.2);
            border-color:#ff6b6b;
            color:#ff6b6b;
        }

        .stats-grid {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
            width:100%;
            margin-bottom:24px;
        }
        .stat-card {
            background:rgba(255,255,255,0.04);
            border-radius:18px;
            padding:16px 14px;
            border:1px solid rgba(255,255,255,0.06);
            text-align:center;
        }
        .stat-card .label { font-size:12px; color:#8899aa; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
        .stat-card .value { font-size:26px; font-weight:700; color:#fff; }
        .stat-card .value.gold { color:#ffb000; }
        .stat-card .value.negative { color:#ff6b6b; }
        .stat-card .value.positive { color:#4ade80; }

        .order-btn {
            width:100%;
            padding:16px;
            border:none;
            border-radius:20px;
            background:linear-gradient(135deg,#ffb000,#ff6a00);
            color:#0a0c10;
            font-size:18px;
            font-weight:700;
            cursor:pointer;
            transition:transform 0.2s, box-shadow 0.2s;
            box-shadow:0 8px 20px rgba(255,140,0,0.3);
            margin-bottom:20px;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
        }
        .order-btn:active { transform:scale(0.97); }

        .history-section { width:100%; margin-top:8px; }
        .history-title {
            font-size:16px;
            font-weight:600;
            color:#e0e8f0;
            margin-bottom:12px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .history-list { max-height:300px; overflow-y:auto; padding-right:4px; }
        .history-list::-webkit-scrollbar { width:3px; }
        .history-list::-webkit-scrollbar-track { background:transparent; }
        .history-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.2); border-radius:10px; }

        .transaction-item {
            background:rgba(255,255,255,0.03);
            border-radius:14px;
            padding:12px 16px;
            margin-bottom:8px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border:1px solid rgba(255,255,255,0.04);
        }
        .transaction-info { display:flex; flex-direction:column; align-items:flex-start; }
        .transaction-desc { font-size:14px; font-weight:500; color:#e0e8f0; }
        .transaction-date { font-size:11px; color:#667788; margin-top:2px; }
        .transaction-amount { font-size:16px; font-weight:700; }
        .transaction-amount.positive { color:#4ade80; }
        .transaction-amount.negative { color:#ff6b6b; }

        .empty-history { color:#667788; font-size:14px; text-align:center; padding:20px 0; }
        .loading { display:flex; justify-content:center; align-items:center; height:200px; color:#8899aa; font-size:16px; }

        .home-indicator { margin-top:16px; width:130px; height:5px; background:rgba(255,255,255,0.3); border-radius:20px; }

        @media (max-width:420px) {
            .phone-frame { border-radius:0; padding:16px 20px 24px; background:rgba(10,12,16,0.95); backdrop-filter:blur(15px); box-shadow:none; border:none; }
            .stats-grid { gap:8px; }
            .stat-card .value { font-size:22px; }
        }
    </style>
</head>
<body>

<div class="phone-frame" id="app">
    <div class="header">
        <div class="user-info">
            <div class="user-name" id="userName">Загрузка...</div>
            <div class="user-email" id="userEmail">email@domain.com</div>
            <div class="user-uid" id="userUid">UID: загрузка...</div>
        </div>
        <button class="logout-btn" id="logoutBtn">🚪 Выйти</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="label">💰 Баланс</div><div class="value gold" id="balance">0 ₽</div></div>
        <div class="stat-card"><div class="label">⭐ Рейтинг</div><div class="value" id="rating">0.0</div></div>
        <div class="stat-card"><div class="label">🎁 Бонусы</div><div class="value gold" id="bonus">0</div></div>
        <div class="stat-card"><div class="label">📊 Потрачено</div><div class="value negative" id="totalSpent">0 ₽</div></div>
    </div>

    <button class="order-btn" id="orderBtn"><span>📍</span> Заказать такси</button>

    <div class="history-section">
        <div class="history-title"><span>📋 История операций</span><span style="font-size:12px; color:#667788;">последние 10</span></div>
        <div class="history-list" id="historyList"><div class="loading">Загрузка...</div></div>
    </div>

    <div class="home-indicator"></div>
</div>

<script>
    // ============================================================
    // ПРОСТОЙ И НАДЁЖНЫЙ КОД
    // ============================================================

    // Элементы
    const userNameEl = document.getElementById('userName');
    const userEmailEl = document.getElementById('userEmail');
    const userUidEl = document.getElementById('userUid');
    const balanceEl = document.getElementById('balance');
    const ratingEl = document.getElementById('rating');
    const bonusEl = document.getElementById('bonus');
    const totalSpentEl = document.getElementById('totalSpent');
    const historyList = document.getElementById('historyList');

    let unsubUser = null;
    let unsubTx = null;

    // ============================================================
    // ФУНКЦИИ ОБНОВЛЕНИЯ
    // ============================================================
    function updateUI(userData) {
        console.log('📊 updateUI вызван, data:', userData);
        if (!userData) {
            console.warn('⚠️ userData пустой');
            return;
        }
        balanceEl.textContent = (userData.balance || 0).toFixed(2) + ' ₽';
        ratingEl.textContent = (userData.rating || 0).toFixed(1);
        bonusEl.textContent = userData.bonus || 0;
        totalSpentEl.textContent = (userData.totalSpent || 0).toFixed(2) + ' ₽';
    }

    function renderTransactions(transactions) {
        console.log('📋 renderTransactions, count:', transactions ? transactions.length : 0);
        if (!transactions || transactions.length === 0) {
            historyList.innerHTML = '<div class="empty-history">Нет операций</div>';
            return;
        }
        let html = '';
        transactions.forEach(tx => {
            const amount = tx.amount || 0;
            const sign = amount >= 0 ? '+' : '';
            const cls = amount >= 0 ? 'positive' : 'negative';
            let date = '—';
            if (tx.timestamp) {
                try {
                    if (tx.timestamp.seconds) {
                        date = new Date(tx.timestamp.seconds * 1000).toLocaleString('ru-RU');
                    } else if (tx.timestamp.toDate) {
                        date = tx.timestamp.toDate().toLocaleString('ru-RU');
                    } else {
                        date = new Date(tx.timestamp).toLocaleString('ru-RU');
                    }
                } catch {
                    date = '—';
                }
            }
            html += `
                <div class="transaction-item">
                    <div class="transaction-info">
                        <div class="transaction-desc">${tx.description || 'Операция'}</div>
                        <div class="transaction-date">${date}</div>
                    </div>
                    <div class="transaction-amount ${cls}">${sign}${amount.toFixed(2)} ₽</div>
                </div>
            `;
        });
        historyList.innerHTML = html;
    }

    // ============================================================
    // ОСНОВНАЯ ЛОГИКА
    // ============================================================
    onAuthStateChanged(auth, (user) => {
        console.log('🔐 onAuthStateChanged, user:', user ? user.uid : 'null');

        if (!user) {
            console.log('❌ Не авторизован, редирект на index.html');
            window.location.href = 'index.html';
            return;
        }

        // Отображаем UID
        userUidEl.textContent = 'UID: ' + user.uid;

        // Ссылка на документ пользователя в коллекции "users"
        const userDocRef = doc(db, 'users', user.uid);
        console.log('📄 userDocRef:', userDocRef.path);

        // === 1. ЗАГРУЗКА ДАННЫХ ПОЛЬЗОВАТЕЛЯ ===
        getDoc(userDocRef).then((docSnap) => {
            console.log('📥 getDoc результат:', docSnap.exists() ? 'существует' : 'НЕ СУЩЕСТВУЕТ');

            if (!docSnap.exists()) {
                // Документа нет — создаём
                console.log('⚠️ Документа нет, создаём...');
                const newUserData = {
                    uid: user.uid,
                    email: user.email,
                    role: 'client',
                    displayName: user.displayName || 'Пользователь',
                    balance: 0,
                    rating: 0,
                    bonus: 0,
                    penalty: 0,
                    premium: 0,
                    totalEarned: 0,
                    totalSpent: 0,
                    driverData: null,
                    createdAt: new Date()
                };
                setDoc(userDocRef, newUserData)
                    .then(() => {
                        console.log('✅ Документ создан');
                        userNameEl.textContent = newUserData.displayName;
                        userEmailEl.textContent = user.email;
                        updateUI(newUserData);
                        // Подписываемся на изменения
                        subscribeToUser(userDocRef);
                        subscribeToTransactions(user.uid);
                    })
                    .catch((err) => {
                        console.error('❌ Ошибка создания документа:', err);
                        historyList.innerHTML = '<div class="empty-history">❌ Ошибка создания профиля</div>';
                    });
                return;
            }

            // Документ существует
            const data = docSnap.data();
            console.log('✅ Данные пользователя:', data);

            // Обновляем UI
            userNameEl.textContent = data.displayName || 'Пользователь';
            userEmailEl.textContent = user.email || '';
            updateUI(data);

            // Подписываемся на изменения
            subscribeToUser(userDocRef);
            subscribeToTransactions(user.uid);

        }).catch((error) => {
            console.error('❌ Ошибка getDoc:', error);
            historyList.innerHTML = '<div class="empty-history">❌ Ошибка загрузки профиля</div>';
        });
    });

    // ============================================================
    // ПОДПИСКИ НА ИЗМЕНЕНИЯ (REAL-TIME)
    // ============================================================
    function subscribeToUser(userDocRef) {
        if (unsubUser) unsubUser();
        unsubUser = onSnapshot(userDocRef, (snap) => {
            if (snap.exists()) {
                const data = snap.data();
                console.log('🔄 Обновление пользователя:', data);
                userNameEl.textContent = data.displayName || 'Пользователь';
                userEmailEl.textContent = data.email || '';
                updateUI(data);
            }
        }, (error) => {
            console.error('❌ Ошибка подписки на пользователя:', error);
        });
    }

    function subscribeToTransactions(uid) {
        if (unsubTx) unsubTx();
        const q = query(
            collection(db, 'transactions'),
            where('userId', '==', uid),
            orderBy('timestamp', 'desc'),
            limit(10)
        );
        unsubTx = onSnapshot(q, (snapshot) => {
            const transactions = [];
            snapshot.forEach((doc) => {
                transactions.push({ id: doc.id, ...doc.data() });
            });
            console.log('🔄 Транзакции обновлены:', transactions.length);
            renderTransactions(transactions);
        }, (error) => {
            console.error('❌ Ошибка подписки на транзакции:', error);
            historyList.innerHTML = '<div class="empty-history">❌ Ошибка загрузки истории</div>';
        });
    }

    // ============================================================
    // ОБРАБОТЧИКИ
    // ============================================================

    // Выход
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        console.log('🚪 Выход');
        try {
            if (unsubUser) { unsubUser(); unsubUser = null; }
            if (unsubTx) { unsubTx(); unsubTx = null; }
            await signOut(auth);
            window.location.replace('index.html');
        } catch (error) {
            console.error('❌ Ошибка выхода:', error);
            window.location.replace('index.html');
        }
    });

    // Заказать такси
    document.getElementById('orderBtn').addEventListener('click', () => {
        window.location.href = 'order.html';
    });
</script>
</body>
</html>
