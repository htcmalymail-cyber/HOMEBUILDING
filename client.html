<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>🚕 Taxi – Клиент</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; margin:0; padding:20px; background:#f0f2f5; }
    .container { max-width:1200px; margin:0 auto; }
    .card { background:white; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1); margin:15px 0; }
    .hidden { display:none; }
    button { padding:10px 24px; margin:5px; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:15px; }
    button.primary { background:#007bff; color:white; }
    button.primary:hover { background:#0056b3; }
    button.success { background:#28a745; color:white; }
    button.success:hover { background:#218838; }
    button.danger { background:#dc3545; color:white; }
    button.danger:hover { background:#c82333; }
    button.warning { background:#ffc107; color:#212529; }
    button.warning:hover { background:#e0a800; }
    input, textarea { padding:10px; margin:8px 0; width:100%; border:1px solid #ccc; border-radius:8px; font-size:14px; }
    input:focus, textarea:focus { outline:2px solid #007bff; border-color:transparent; }
    #map { height:450px; width:100%; border-radius:10px; }
    .flex-row { display:flex; gap:20px; flex-wrap:wrap; }
    .flex-col { flex:1; min-width:300px; }
    .nav { margin-bottom:20px; display:flex; gap:15px; flex-wrap:wrap; align-items:center; }
    .nav a { text-decoration:none; color:#007bff; font-weight:bold; }
    .nav .logout-btn { background:#dc3545; color:white; padding:6px 16px; border-radius:6px; border:none; cursor:pointer; }
    .nav .logout-btn:hover { background:#c82333; }
    .order-status-card { background:#e8f4f8; padding:15px; border-radius:10px; margin-top:15px; }
    .order-status-card .status { font-size:18px; font-weight:bold; }
    .status-created { color:#ffc107; }
    .status-assigned { color:#17a2b8; }
    .status-accepted { color:#28a745; }
    .status-completed { color:#6c757d; }
    .status-cancelled { color:#dc3545; }
    .driver-info { background:#d4edda; padding:10px; border-radius:8px; margin-top:10px; }
    .badge { display:inline-block; padding:3px 12px; border-radius:20px; font-size:13px; font-weight:600; }
    .badge-created { background:#ffc107; color:#212529; }
    .badge-assigned { background:#17a2b8; color:white; }
    .badge-accepted { background:#28a745; color:white; }
    .badge-completed { background:#6c757d; color:white; }
    .badge-cancelled { background:#dc3545; color:white; }
    .badge-waiting { background:#fd7e14; color:white; }
    .coords-hint { font-size:12px; color:#666; margin-top:5px; }
    .click-hint { background:#e8f4f8; padding:8px 12px; border-radius:6px; font-size:13px; color:#0056b3; margin-bottom:10px; }
    .gps-btn { background:#28a745; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600; }
    .gps-btn:hover { background:#218838; }
    .location-status { font-size:13px; color:#666; margin-left:10px; }
    .location-found { color:#28a745; }
    .location-error { color:#dc3545; }
  </style>
</head>
<body>
<div class="container">
  <div class="nav">
    <a href="index.html">🏠 Главная</a>
    <a href="client.html">Клиент</a>
    <button class="logout-btn" onclick="signOut()">🚪 Выйти</button>
    <span id="user-email" style="margin-left:auto;color:#666;font-size:14px;"></span>
  </div>
  <h1>🚕 Taxi – Клиент</h1>

  <!-- Форма заказа -->
  <div class="card">
    <h3>📍 Создать заказ</h3>
    <div class="click-hint">
      <button class="gps-btn" onclick="getMyLocation()">📍 Определить моё местоположение</button>
      <span id="location-status" class="location-status">Нажмите кнопку, чтобы определить ваше положение</span>
    </div>
    <div class="flex-row">
      <div class="flex-col">
        <input id="from-address" placeholder="Откуда (адрес)" value="Красная площадь, Москва">
        <input id="to-address" placeholder="Куда (адрес)" value="Вокзал">
        <div style="display:flex; gap:10px;">
          <input id="from-lat" placeholder="Широта" value="55.7539" style="width:50%;">
          <input id="from-lng" placeholder="Долгота" value="37.6208" style="width:50%;">
        </div>
        <button class="primary" onclick="createOrder()" style="width:100%;">🚖 Заказать такси</button>
        <div id="order-status-message" style="margin-top:10px;font-weight:600;"></div>
      </div>
      <div class="flex-col">
        <div id="map"></div>
        <div style="margin-top:8px;font-size:12px;color:#666;">💡 Кликните на карту, чтобы изменить точку отправления</div>
      </div>
    </div>
  </div>

  <!-- Статус заказа -->
  <div id="order-status-card" class="card hidden">
    <h3>📋 Ваш заказ</h3>
    <div id="order-details"></div>
    <div id="driver-info" class="driver-info hidden">
      <strong>🚗 Водитель:</strong> <span id="driver-name-display"></span><br>
      <strong>📞 Телефон:</strong> <span id="driver-phone-display"></span><br>
      <strong>🚘 Авто:</strong> <span id="driver-car-display"></span>
    </div>
    <button class="danger" id="cancel-btn" onclick="cancelOrder()" style="margin-top:10px;">❌ Отменить заказ</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
    authDomain: "taxi-ai-app-69628.firebaseapp.com",
    projectId: "taxi-ai-app-69628",
    storageBucket: "taxi-ai-app-69628.firebasestorage.app",
    messagingSenderId: "952357992434",
    appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
    measurementId: "G-Z9NJFSSXH6"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  let currentUser = null;
  let currentUserData = null;
  let map = null;
  let clientMarker = null;
  let driverMarker = null;
  let routeLayer = null;
  let currentOrderId = null;
  let orderUnsubscribe = null;
  let driverUnsubscribe = null;
  let userLocation = null; // храним координаты пользователя

  // ===== АУТЕНТИФИКАЦИЯ =====
  auth.onAuthStateChanged(async function(user) {
    if (user) {
      currentUser = user;
      document.getElementById('user-email').textContent = '👤 ' + user.email;
      await loadUserData();
      initMap();
      listenClientOrder();
      // Автоматически определяем местоположение при загрузке
      setTimeout(getMyLocation, 500);
    } else {
      const session = localStorage.getItem('clientSession');
      if (session) {
        try {
          const data = JSON.parse(session);
          document.getElementById('user-email').textContent = '👤 ' + (data.name || 'Клиент');
          await loadUserData();
          initMap();
          listenClientOrder();
          setTimeout(getMyLocation, 500);
        } catch(e) {
          window.location.href = 'index.html';
        }
      } else {
        window.location.href = 'index.html';
      }
    }
  });

  function loadUserData() {
    if (!currentUser) return Promise.resolve();
    return db.collection('users').doc(currentUser.uid).get()
      .then(doc => {
        if (doc.exists) {
          currentUserData = doc.data();
        } else {
          return db.collection('users').doc(currentUser.uid).set({
            email: currentUser.email,
            name: 'Клиент',
            role: 'client',
            phone: '',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          }).then(() => { currentUserData = { role: 'client' }; });
        }
      })
      .catch(e => console.error('Ошибка загрузки данных:', e));
  }

  function signOut() {
    auth.signOut().then(() => {
      localStorage.removeItem('clientSession');
      window.location.href = 'index.html';
    });
  }

  // ===== ОПРЕДЕЛЕНИЕ МЕСТОПОЛОЖЕНИЯ ЧЕРЕЗ GPS =====
  function getMyLocation() {
    const statusEl = document.getElementById('location-status');
    statusEl.textContent = '⏳ Определение местоположения...';
    statusEl.className = 'location-status';

    if (!navigator.geolocation) {
      statusEl.textContent = '❌ Ваш браузер не поддерживает GPS';
      statusEl.className = 'location-status location-error';
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        userLocation = { lat, lng };
        
        // Обновляем поля
        document.getElementById('from-lat').value = lat.toFixed(6);
        document.getElementById('from-lng').value = lng.toFixed(6);
        document.getElementById('from-address').value = '📍 Моё местоположение';
        
        // Обновляем карту
        if (clientMarker) map.removeLayer(clientMarker);
        clientMarker = L.marker([lat, lng], {
          icon: L.divIcon({ 
            className: 'client-marker', 
            html: '📍', 
            iconSize: [30, 30] 
          })
        }).addTo(map)
          .bindPopup('📍 Вы здесь');
        map.setView([lat, lng], 16);

        statusEl.textContent = '✅ Местоположение определено! (широта: ' + lat.toFixed(6) + ', долгота: ' + lng.toFixed(6) + ')';
        statusEl.className = 'location-status location-found';
      },
      function(error) {
        console.error('GPS ошибка:', error);
        let msg = '❌ Ошибка GPS: ';
        switch(error.code) {
          case error.PERMISSION_DENIED:
            msg += 'Разрешите доступ к геолокации в настройках браузера';
            break;
          case error.POSITION_UNAVAILABLE:
            msg += 'Не удалось определить местоположение';
            break;
          case error.TIMEOUT:
            msg += 'Превышено время ожидания';
            break;
          default:
            msg += error.message;
        }
        statusEl.textContent = msg;
        statusEl.className = 'location-status location-error';
        
        // Предлагаем ввести адрес вручную или кликнуть на карту
        alert('⚠️ ' + msg + '\n\nВы можете ввести адрес вручную или кликнуть на карту, чтобы указать точку отправления.');
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 }
    );
  }

  // ===== КАРТА =====
  function initMap() {
    if (map) return;
    map = L.map('map').setView([55.7558, 37.6173], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Клик по карте — установка точки отправления
    map.on('click', function(e) {
      const lat = e.latlng.lat.toFixed(6);
      const lng = e.latlng.lng.toFixed(6);
      document.getElementById('from-lat').value = lat;
      document.getElementById('from-lng').value = lng;
      document.getElementById('from-address').value = '📍 Точка на карте';

      if (clientMarker) map.removeLayer(clientMarker);
      clientMarker = L.marker([lat, lng], {
        icon: L.divIcon({ className: 'client-marker', html: '📍', iconSize: [30, 30] })
      }).addTo(map).bindPopup('📍 Вы здесь');

      document.getElementById('location-status').textContent = '📍 Точка установлена вручную: ' + lat + ', ' + lng;
      document.getElementById('location-status').className = 'location-status location-found';
    });
  }

  // ===== ОБНОВЛЕНИЕ МАРКЕРОВ =====
  function updateClientMarker(lat, lng) {
    if (clientMarker) map.removeLayer(clientMarker);
    clientMarker = L.marker([lat, lng])
      .addTo(map)
      .bindPopup('📍 Вы здесь');
    map.setView([lat, lng], 14);
  }

  function updateDriverMarker(lat, lng, driverName) {
    if (driverMarker) map.removeLayer(driverMarker);
    driverMarker = L.marker([lat, lng], {
      icon: L.divIcon({ className: 'driver-marker', html: '🚗', iconSize: [30, 30] })
    }).addTo(map)
      .bindPopup('🚗 Водитель: ' + (driverName || 'Водитель') + '<br>📍 ' + lat + ', ' + lng);
  }

  // ===== СОЗДАНИЕ ЗАКАЗА =====
  function createOrder() {
    if (!currentUser && !localStorage.getItem('clientSession')) {
      alert('⚠️ Сначала войдите или укажите имя и телефон на главной странице');
      return;
    }

    const from = document.getElementById('from-address').value.trim();
    const to = document.getElementById('to-address').value.trim();
    const lat = parseFloat(document.getElementById('from-lat').value);
    const lng = parseFloat(document.getElementById('from-lng').value);

    if (!from || !to) { alert('⚠️ Заполните адреса'); return; }
    if (isNaN(lat) || isNaN(lng)) { alert('⚠️ Установите точку на карте или введите координаты'); return; }

    let clientName = 'Клиент';
    const session = localStorage.getItem('clientSession');
    if (session) {
      try { clientName = JSON.parse(session).name || 'Клиент'; } catch(e) {}
    }
    if (currentUserData && currentUserData.name) clientName = currentUserData.name;

    const orderData = {
      clientId: currentUser ? currentUser.uid : 'guest-' + Date.now(),
      clientEmail: currentUser ? currentUser.email : 'guest@taxi.com',
      clientName: clientName,
      from: from,
      to: to,
      fromLat: lat,
      fromLng: lng,
      status: 'created',
      price: Math.round(Math.random() * 300 + 100),
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      aiNote: 'Поиск ближайшего водителя...'
    };

    db.collection('orders').add(orderData)
      .then(docRef => {
        currentOrderId = docRef.id;
        document.getElementById('order-status-message').innerHTML = '✅ Заказ создан! Ищем водителя...';
        document.getElementById('order-status-card').classList.remove('hidden');
        return assignNearestDriver(docRef.id, lat, lng);
      })
      .then(() => {
        document.getElementById('order-status-message').innerHTML = '✅ Водитель назначен! Ожидайте подтверждения.';
      })
      .catch(error => {
        alert('❌ Ошибка: ' + error.message);
      });
  }

  // ===== ИИ-НАЗНАЧЕНИЕ БЛИЖАЙШЕГО ВОДИТЕЛЯ =====
  function assignNearestDriver(orderId, fromLat, fromLng) {
    return db.collection('drivers')
      .where('role', '==', 'driver')
      .where('available', '==', true)
      .get()
      .then(snapshot => {
        if (snapshot.empty) {
          return db.collection('orders').doc(orderId).update({
            status: 'waiting',
            aiNote: 'Нет свободных водителей'
          });
        }

        let nearest = null;
        let minDist = Infinity;
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.lat && data.lng) {
            const dist = getDistance(fromLat, fromLng, data.lat, data.lng);
            if (dist < minDist) {
              minDist = dist;
              nearest = { id: doc.id, data: data, dist: dist };
            }
          }
        });

        if (!nearest) {
          return db.collection('orders').doc(orderId).update({
            status: 'error',
            aiNote: 'У водителей нет координат'
          });
        }

        const driverId = nearest.id;
        const driverData = nearest.data;

        return db.collection('orders').doc(orderId).update({
          driverId: driverId,
          driverEmail: driverData.email,
          driverName: driverData.fullName || 'Водитель',
          driverPhone: driverData.phone || '—',
          driverCar: driverData.carModel + ' ' + (driverData.carNumber || ''),
          status: 'assigned',
          aiNote: 'Назначен водитель ' + (driverData.fullName || driverData.email) + ' (расст. ' + nearest.dist.toFixed(2) + ' км)'
        })
        .then(() => {
          return db.collection('drivers').doc(driverId).update({
            available: false
          });
        });
      });
  }

  function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // ===== СЛУШАЕМ ЗАКАЗ КЛИЕНТА =====
  function listenClientOrder() {
    if (orderUnsubscribe) orderUnsubscribe();

    const clientId = currentUser ? currentUser.uid : 'guest-' + Date.now();

    orderUnsubscribe = db.collection('orders')
      .where('clientId', '==', clientId)
      .orderBy('createdAt', 'desc')
      .limit(1)
      .onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
          if (change.type === 'added' || change.type === 'modified') {
            const data = change.doc.data();
            const orderId = change.doc.id;
            currentOrderId = orderId;
            updateOrderUI(orderId, data);
          }
        });
      }, error => {
        console.error('Ошибка прослушки заказа:', error);
      });
  }

  // ===== ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ЗАКАЗА =====
  function updateOrderUI(orderId, data) {
    document.getElementById('order-status-card').classList.remove('hidden');

    const statusMap = {
      'created': '🟡 Создан',
      'assigned': '🔵 Водитель назначен',
      'accepted': '🟢 Заказ принят',
      'started': '🟢 В пути',
      'completed': '✅ Завершён',
      'cancelled': '❌ Отменён',
      'waiting': '⏳ Ожидание водителя'
    };

    const statusText = statusMap[data.status] || data.status;
    const statusClass = 'status-' + data.status;

    let html = `
      <div class="order-status-card">
        <div><strong>Откуда:</strong> ${data.from}</div>
        <div><strong>Куда:</strong> ${data.to}</div>
        <div><strong>Статус:</strong> <span class="status ${statusClass}">${statusText}</span></div>
        <div><strong>Цена:</strong> ${data.price || 0} ₽</div>
        <div><strong>🧠 ИИ:</strong> ${data.aiNote || '—'}</div>
        <div><strong>🆔 Заказ:</strong> ${orderId.slice(0, 8)}...</div>
      </div>
    `;

    document.getElementById('order-details').innerHTML = html;

    const cancelBtn = document.getElementById('cancel-btn');
    if (['created', 'assigned', 'waiting'].includes(data.status)) {
      cancelBtn.style.display = 'inline-block';
    } else {
      cancelBtn.style.display = 'none';
    }

    const driverInfo = document.getElementById('driver-info');
    if (data.driverId && data.status !== 'cancelled' && data.status !== 'completed') {
      driverInfo.classList.remove('hidden');
      document.getElementById('driver-name-display').textContent = data.driverName || data.driverEmail || '—';
      document.getElementById('driver-phone-display').textContent = data.driverPhone || '—';
      document.getElementById('driver-car-display').textContent = data.driverCar || '—';

      if (driverUnsubscribe) driverUnsubscribe();
      driverUnsubscribe = db.collection('drivers').doc(data.driverId)
        .onSnapshot(doc => {
          if (doc.exists) {
            const driverData = doc.data();
            if (driverData.lat && driverData.lng) {
              updateDriverMarker(driverData.lat, driverData.lng, driverData.fullName || driverData.email);
              showRoute(data.fromLat, data.fromLng, driverData.lat, driverData.lng);
            }
          }
        }, error => console.error('Ошибка прослушки водителя:', error));
    } else {
      driverInfo.classList.add('hidden');
      if (driverMarker) { map.removeLayer(driverMarker); driverMarker = null; }
      if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
    }

    if (data.fromLat && data.fromLng) {
      updateClientMarker(data.fromLat, data.fromLng);
    }
  }

  function showRoute(lat1, lng1, lat2, lng2) {
    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.polyline([[lat1, lng1], [lat2, lng2]], {
      color: '#007bff',
      weight: 3,
      dashArray: '8, 8',
      opacity: 0.7
    }).addTo(map);
  }

  function cancelOrder() {
    if (!currentOrderId) { alert('Нет активного заказа'); return; }
    if (!confirm('⚠️ Вы уверены, что хотите отменить заказ?')) return;
    db.collection('orders').doc(currentOrderId).update({
      status: 'cancelled',
      aiNote: 'Отменён клиентом'
    })
    .then(() => {
      alert('✅ Заказ отменён');
      document.getElementById('cancel-btn').style.display = 'none';
    })
    .catch(e => alert('❌ Ошибка: ' + e.message));
  }
</script>
</body>
</html>
