    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            serverTimestamp, 
            doc, 
            getDoc, 
            setDoc, 
            updateDoc,
            increment,
            runTransaction,
            query,
            where,
            getDocs,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);

        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseAnalytics = analytics;
        window.onAuthStateChanged = onAuthStateChanged;
        window.signOut = signOut;
        window.signInAnonymously = signInAnonymously;
        window.collection = collection;
        window.addDoc = addDoc;
        window.serverTimestamp = serverTimestamp;
        window.doc = doc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;
        window.updateDoc = updateDoc;
        window.increment = increment;
        window.runTransaction = runTransaction;
        window.query = query;
        window.where = where;
        window.getDocs = getDocs;
        window.onSnapshot = onSnapshot;

        console.log("✅ Firebase initialized");

        // ============================================================
        // ⚡ ПРЯМОЙ ЗАПРОС БАЛАНСА ПО UID (для теста)
        // ============================================================
        const TEST_UID = "E8IKFTUq1zNAo9YFpaKtf4QD"; // 👈 ТВОЙ UID КЛИЕНТА

        async function loadBalanceDirect() {
            try {
                const userDoc = await getDoc(doc(db, 'users', TEST_UID));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    console.log('✅ Прямая загрузка баланса:', data);
                    
                    document.getElementById('userNameDisplay').textContent = '👋 ' + (data.fullName || 'Koto Shanel');
                    document.getElementById('userBalanceDisplay').textContent = '💰 ' + (data.wallet || 0) + ' ₪';
                    document.getElementById('userInfoDisplay').style.display = 'flex';
                    document.getElementById('walletDisplay').textContent = (data.wallet || 0).toFixed(0);
                    document.getElementById('modalBalance').textContent = (data.wallet || 0).toFixed(0);
                    document.getElementById('userInfo').textContent = '👤 ' + (data.fullName || 'Koto Shanel');
                }
            } catch (error) {
                console.error('❌ Ошибка прямой загрузки:', error);
            }
        }

        // Запускаем через 1 секунду после загрузки
        setTimeout(loadBalanceDirect, 1500);
    </script>

    <!-- Font Awesome -->

    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .marker-client::after {
            content: '';
            position: absolute;
            top: 50%;

            height: 8px;
            background: #ffffff;
            border-radius: 50%;

        .marker-driver-assigned {
            width: 32px;
            height: 32px;
            background: #22c55e;
            border: 3px solid #ffffff;

            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(34,197,94,0.5);
            animation: pulse-driver 1.5s infinite;

        .marker-driver-free {

        }

            display: flex;

            margin: 16px 0;
        }
        .wallet-row input {
            flex: 1;

<body>

<div class="phone-frame">

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <a href="index.html" class="back-btn">←</a>
            <div class="header-title">WHEEL <span>TAXI</span></div>
        </div>
        <div class="header-right">
            <div class="user-info-display" id="userInfoDisplay" style="display:none;">
                <span class="user-name" id="userNameDisplay">👋 Гость</span>
                <span class="user-balance" id="userBalanceDisplay">💰 0 ₪</span>
                <button class="logout-btn" id="logoutBtn">Выйти</button>
            </div>
            <div class="wallet-badge" id="walletBtn">
                <i>💰</i> <span id="walletDisplay">0</span> ₪
            </div>
        </div>
    </div>

    <!-- КАРТА -->
    <div id="map"></div>

    <!-- ПАНЕЛЬ -->
    <div class="control-panel">
        <div class="panel-title">
            <i class="fas fa-route"></i> Куда едем?
        </div>

        <div class="address-group" id="fromGroup">
            <label><span class="dot-green">●</span> Откуда</label>
            <div class="address-input">
                <i class="fas fa-location-dot"></i>
                <input type="text" id="fromInput" placeholder="Ваше местоположение" autocomplete="off" />
                <button class="geo-btn" id="geoFromBtn" title="Определить геопозицию">
                    <i class="fas fa-crosshairs"></i>
                </button>
            </div>
            <div class="suggestions-list" id="fromSuggestions"></div>
        </div>

        <div class="swap-row">
            <button class="swap-btn" id="swapBtn">
                <i class="fas fa-arrow-up-arrow-down"></i> Поменять
            </button>
        </div>

        <div class="address-group" id="toGroup">
            <label><span class="dot-red">●</span> Куда</label>
            <div class="address-input">
                <i class="fas fa-location-dot"></i>
                <input type="text" id="toInput" placeholder="Введите адрес назначения" autocomplete="off" />
            </div>
            <div class="suggestions-list" id="toSuggestions"></div>
        </div>

        <div class="trip-info" id="tripInfo">
            <div class="row">
                <div class="distance">
                    <i class="fas fa-road"></i>
                    <span id="distanceDisplay">0</span> км
                    <span style="color:#667788; font-size:12px; margin-left:6px;">(~<span id="durationDisplay">0</span> мин)</span>
                </div>
                <div class="price-range">
                    <div class="main-price">
                        <span id="priceDisplay">0</span> <small>₪</small>
                    </div>
                    <span class="variance-hint" id="varianceHint">±6% от стоимости</span>
                </div>
            </div>
            <div class="row" style="border-top:1px solid rgba(255,255,255,0.06); padding-top:6px; font-size:12px; color:#667788;">
                <span>* Окончательная цена может отличаться</span>
                <span id="priceRangeDisplay" style="color:#8899aa;">0 – 0 ₪</span>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-secondary" id="clearRouteBtn">
                <i class="fas fa-eraser"></i> Очистить
            </button>
        </div>

        <button class="btn-order" id="orderBtn">
            <i class="fas fa-taxi"></i> Заказать такси
        </button>

        <div class="order-confirmation" id="orderConfirmation">
            ✅ Заказ успешно создан!
            <div class="order-id" id="orderIdDisplay">ID: ORD-XXXXXXXX</div>
            <div style="font-size:12px; font-weight:400; color:#8899aa; margin-top:4px;">
                Ожидайте назначения водителя
            </div>
        </div>

        <div id="orderManagement" style="display:none; margin-top:12px;">
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn-cancel-order" id="cancelOrderBtn">
                    <i class="fas fa-times-circle"></i> Отменить заказ
                    <span class="penalty-info">(штраф 10 ₪)</span>
                </button>
            </div>
            <div id="orderStatusInfo" style="margin-top:8px; font-size:13px; color:#8899aa; text-align:center;"></div>
        </div>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <div class="home-indicator"></div>
</div>

<!-- МОДАЛКА КОШЕЛЬКА -->
<div class="modal" id="walletModal">
    <div class="modal-content">
        <h2><i class="fas fa-wallet"></i> Мой кошелёк</h2>
        <div class="wallet-balance">
            <span id="modalBalance">0</span> <small>₪</small>
        </div>
        <div class="wallet-row">
            <input type="number" id="topupInput" placeholder="Сумма пополнения" min="1" />
            <button id="topupBtn">Пополнить</button>
        </div>
        <p style="font-size:12px; color:#667788; text-align:center; margin:8px 0;">
            💰 Бонусы: <span id="bonusDisplay">0</span> ₪ (начисляются после поездок)
        </p>
        <p style="font-size:11px; color:#445566; text-align:center; margin:4px 0;" id="userInfo">
            🔑 Анонимный пользователь
        </p>
        <button class="close-modal" id="closeWalletModal">Закрыть</button>
    </div>
</div>
