<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Firebase SDK -->

        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseApp = app;

        window.setDoc = setDoc;

        window.increment = increment;
        window.runTransaction = runTransaction;
        window.query = query;
        window.where = where;
        window.getDocs = getDocs;

        console.log("✅ Firebase initialized");
    </script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.06) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .phone-frame {
            width: 100%;
            max-width: 420px;
            height: 95vh;
            max-height: 820px;
            background: rgba(18, 22, 28, 0.92);
            backdrop-filter: blur(25px);
            border-radius: 44px;
            padding: 20px 20px 28px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px 14px 6px;
            flex-shrink: 0;
            z-index: 20;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-right { display: flex; align-items: center; gap: 10px; }

        .back-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }
        .back-btn:hover { background: rgba(255,255,255,0.15); }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .header-title span { color: #ffb000; }

        .user-info-display {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        .user-info-display .user-name {
            color: #ffb000;
            font-weight: 600;
        }
        .user-info-display .user-balance {
            color: #4ade80;
            font-weight: 600;
        }
        .user-info-display .logout-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #8899aa;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .user-info-display .logout-btn:hover {
            background: rgba(255,180,0,0.15);
            border-color: #ffb000;
            color: #ffb000;
        }

        .wallet-badge {
            background: rgba(255,180,0,0.15);
            border: 1px solid rgba(255,180,0,0.2);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: #ffb000;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .wallet-badge:hover { background: rgba(255,180,0,0.25); }

        #map {
            flex: 1;
            width: 100%;
            border-radius: 20px;
            background: #1a1e26;
            overflow: hidden;
            z-index: 1;
            min-height: 200px;
        }
        .leaflet-control-attribution {
            background: rgba(10,12,16,0.8) !important;
            color: #8899aa !important;
            font-size: 9px !important;
        }
        .leaflet-control-attribution a { color: #ffb000 !important; }

        .marker-client {
            background: #2563eb;
            border: 3px solid #ffffff;
            border-radius: 50% 50% 50% 0;
            width: 20px;
            height: 20px;
            transform: rotate(-45deg);
            box-shadow: 0 4px 12px rgba(37,99,235,0.5);
        }
        .marker-client::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
        }

        .marker-driver {
            width: 32px;
            height: 32px;
            background: #22c55e;
            border: 3px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(34,197,94,0.5);
            animation: pulse-driver 1.5s infinite;
        }
        @keyframes pulse-driver {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .marker-end {
            background: #ef4444;
            border: 3px solid #ffffff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            box-shadow: 0 4px 12px rgba(239,68,68,0.4);
        }

        .control-panel {
            background: rgba(18,22,28,0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0;
            padding: 16px 18px 22px;
            margin-top: -12px;
            z-index: 10;
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.06);
            max-height: 55vh;
            overflow-y: auto;
        }
        .control-panel::-webkit-scrollbar { width: 3px; }
        .control-panel::-webkit-scrollbar-thumb { background: #ffb000; border-radius: 10px; }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #8899aa;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }
        .panel-title i { color: #ffb000; }

        .address-group { 
            margin-bottom: 10px; 
            position: relative;
        }
        .address-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #667788;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .address-group label .dot-green { color: #22c55e; }
        .address-group label .dot-red { color: #ef4444; }
        
        .address-input {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 0 14px;
            border: 1.5px solid rgba(255,255,255,0.08);
            transition: 0.2s;
        }
        .address-input:focus-within {
            border-color: #ffb000;
            background: rgba(255,180,0,0.05);
            box-shadow: 0 0 0 4px rgba(255,180,0,0.08);
        }
        .address-input i { color: #667788; width: 18px; font-size: 14px; }
        .address-input input {
            border: none;
            background: transparent;
            padding: 12px 10px;
            width: 100%;
            font-size: 14px;
            outline: none;
            color: #e8edf5;
        }
        .address-input input::placeholder { color: #556677; }
        .address-input .geo-btn {
            background: none;
            border: none;
            color: #ffb000;
            cursor: pointer;
            font-size: 16px;
            padding: 6px;
            transition: 0.2s;
        }
        .address-input .geo-btn:hover { transform: scale(1.15); }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1e26;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-top: 4px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .suggestions-list.active { display: block; }
        .suggestions-list::-webkit-scrollbar { width: 3px; }
        .suggestions-list::-webkit-scrollbar-thumb { background: #ffb000; border-radius: 10px; }
        
        .suggestion-item {
            padding: 10px 16px;
            color: #d0d8e0;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover {
            background: rgba(255,180,0,0.1);
            color: #ffb000;
        }
        .suggestion-item i { color: #667788; font-size: 12px; }
        .suggestion-item .highlight {
            color: #ffb000;
            font-weight: 600;
        }

        .swap-row {
            display: flex;
            justify-content: center;
            margin: 2px 0 10px;
        }
        .swap-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 30px;
            padding: 5px 18px;
            font-size: 12px;
            font-weight: 600;
            color: #8899aa;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .swap-btn:hover {
            background: rgba(255,180,0,0.15);
            color: #ffb000;
            border-color: #ffb000;
        }

        .trip-info {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 12px 16px;
            margin: 12px 0 14px;
            display: none;
            flex-direction: column;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .trip-info.active { display: flex; }
        .trip-info .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .trip-info .distance {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #8899aa;
            font-size: 13px;
        }
        .trip-info .distance span {
            font-weight: 700;
            color: #e8edf5;
            font-size: 17px;
        }
        .trip-info .price-range { text-align: right; }
        .trip-info .price-range .main-price {
            font-size: 22px;
            font-weight: 800;
            color: #4ade80;
        }
        .trip-info .price-range .main-price small {
            font-size: 13px;
            font-weight: 400;
            color: #8899aa;
        }
        .trip-info .price-range .variance-hint {
            font-size: 11px;
            color: #667788;
            display: block;
            margin-top: 2px;
        }

        /* ===== УБРАЛИ КНОПКУ "ПОСТРОИТЬ МАРШРУТ" ===== */
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: #8899aa;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            color: #ffffff;
        }

        .btn-order {
            width: 100%;
            margin-top: 10px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-order:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(34,197,94,0.3);
        }
        .btn-order:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-order.active { display: flex; }

        .order-confirmation {
            display: none;
            margin-top: 10px;
            padding: 12px 16px;
            border-radius: 14px;
            background: rgba(34,197,94,0.1);
            border: 1px solid rgba(34,197,94,0.2);
            color: #4ade80;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        .order-confirmation.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .order-confirmation .order-id {
            color: #ffb000;
            font-size: 12px;
            font-weight: 400;
            margin-top: 4px;
        }

        .status-msg {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 10px;
            display: none;
        }
        .status-msg.active { display: block; }
        .status-msg.success {
            background: rgba(34,197,94,0.15);
            color: #4ade80;
            border: 1px solid rgba(34,197,94,0.2);
        }
        .status-msg.error {
            background: rgba(239,68,68,0.15);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.2);
        }
        .status-msg.info {
            background: rgba(59,130,246,0.15);
            color: #60a5fa;
            border: 1px solid rgba(59,130,246,0.2);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #12161c;
            border-radius: 24px;
            padding: 32px 24px;
            width: 90%;
            max-width: 380px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            color: white;
        }
        .modal-content h2 {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
        }
        .modal-content h2 i { color: #ffb000; }
        .wallet-balance {
            text-align: center;
            font-size: 42px;
            font-weight: 800;
            color: #ffb000;
            margin: 16px 0;
        }
        .wallet-balance small {
            font-size: 18px;
            color: #8899aa;
        }
        .wallet-row {
            display: flex;
            gap: 10px;
            margin: 16px 0;
        }
        .wallet-row input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 16px;
            outline: none;
        }
        .wallet-row input:focus { border-color: #ffb000; }
        .wallet-row button {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            font-weight: 700;
            cursor: pointer;
        }
        .close-modal {
            width: 100%;
            background: transparent;
            color: #8899aa;
            border: none;
            margin-top: 12px;
            cursor: pointer;
            font-size: 14px;
            padding: 10px;
        }
        .close-modal:hover { color: white; }
        .home-indicator {
            margin-top: 12px;
            width: 130px;
            height: 5px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            align-self: center;
            flex-shrink: 0;
        }

        @media (max-width: 420px) {
            body { padding: 0; }
            .phone-frame {
                border-radius: 0;
                height: 100vh;
                max-height: none;
                padding: 12px 14px 20px;
                background: rgba(10,12,16,0.98);
                border: none;
                box-shadow: none;
            }
            #map { border-radius: 14px; min-height: 150px; }
            .control-panel {
                border-radius: 16px 16px 0 0;
                padding: 14px 14px 18px;
                margin-top: -8px;
            }
            .header-title { font-size: 16px; }
            .wallet-badge { font-size: 12px; padding: 4px 12px; }
            .user-info-display { font-size: 10px; gap: 5px; }
            .user-info-display .logout-btn { font-size: 9px; padding: 3px 8px; }
        }
    </style>
</head>
<body>

<div class="phone-frame">

    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="header-left">
            <a href="index.html" class="back-btn">←</a>
            <div class="header-title">WHEEL <span>TAXI</span></div>
        </div>
        <div class="header-right">
            <div class="user-info-display" id="userInfoDisplay" style="display:none;">
                <span class="user-name" id="userNameDisplay">👋 Гость</span>
                <span class="user-balance" id="userBalanceDisplay">💰 0 ₪</span>
                <button class="logout-btn" id="logoutBtn">Выйти</button>
            </div>
            <div class="wallet-badge" id="walletBtn">
                <i>💰</i> <span id="walletDisplay">0</span> ₪
            </div>
        </div>
    </div>

    <!-- ===== КАРТА ===== -->
    <div id="map"></div>

    <!-- ===== ПАНЕЛЬ ===== -->
    <div class="control-panel">
        <div class="panel-title">
            <i class="fas fa-route"></i> Куда едем?
        </div>

        <!-- Откуда -->
        <div class="address-group" id="fromGroup">
            <label><span class="dot-green">●</span> Откуда</label>
            <div class="address-input">
                <i class="fas fa-location-dot"></i>
                <input type="text" id="fromInput" placeholder="Ваше местоположение" autocomplete="off" />
                <button class="geo-btn" id="geoFromBtn" title="Определить геопозицию">
                    <i class="fas fa-crosshairs"></i>
                </button>
            </div>
            <div class="suggestions-list" id="fromSuggestions"></div>
        </div>

        <!-- Swap -->
        <div class="swap-row">
            <button class="swap-btn" id="swapBtn">
                <i class="fas fa-arrow-up-arrow-down"></i> Поменять
            </button>
        </div>

        <!-- Куда -->
        <div class="address-group" id="toGroup">
            <label><span class="dot-red">●</span> Куда</label>
            <div class="address-input">
                <i class="fas fa-location-dot"></i>
                <input type="text" id="toInput" placeholder="Введите адрес назначения" autocomplete="off" />
            </div>
            <div class="suggestions-list" id="toSuggestions"></div>
        </div>

        <!-- Информация о поездке -->
        <div class="trip-info" id="tripInfo">
            <div class="row">
                <div class="distance">
                    <i class="fas fa-road"></i>
                    <span id="distanceDisplay">0</span> км
                    <span style="color:#667788; font-size:12px; margin-left:6px;">(~<span id="durationDisplay">0</span> мин)</span>
                </div>
                <div class="price-range">
                    <div class="main-price">
                        <span id="priceDisplay">0</span> <small>₪</small>
                    </div>
                    <span class="variance-hint" id="varianceHint">±6% от стоимости</span>
                </div>
            </div>
            <div class="row" style="border-top:1px solid rgba(255,255,255,0.06); padding-top:6px; font-size:12px; color:#667788;">
                <span>* Окончательная цена может отличаться</span>
                <span id="priceRangeDisplay" style="color:#8899aa;">0 – 0 ₪</span>
            </div>
        </div>

        <!-- ===== УБРАЛИ КНОПКУ "ПОСТРОИТЬ МАРШРУТ" ===== -->
        <div class="action-buttons">
            <button class="btn-secondary" id="clearRouteBtn">
                <i class="fas fa-eraser"></i> Очистить
            </button>
        </div>

        <button class="btn-order" id="orderBtn">
            <i class="fas fa-taxi"></i> Заказать такси
        </button>

        <div class="order-confirmation" id="orderConfirmation">
            ✅ Заказ успешно создан!
            <div class="order-id" id="orderIdDisplay">ID: ORD-XXXXXXXX</div>
            <div style="font-size:12px; font-weight:400; color:#8899aa; margin-top:4px;">
                Ожидайте назначения водителя
            </div>
        </div>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <div class="home-indicator"></div>
</div>

<!-- ===== МОДАЛКА КОШЕЛЬКА ===== -->
<div class="modal" id="walletModal">
    <div class="modal-content">
        <h2><i class="fas fa-wallet"></i> Мой кошелёк</h2>
        <div class="wallet-balance">
            <span id="modalBalance">0</span> <small>₪</small>
        </div>
        <div class="wallet-row">
            <input type="number" id="topupInput" placeholder="Сумма пополнения" min="1" />
            <button id="topupBtn">Пополнить</button>
        </div>
        <p style="font-size:12px; color:#667788; text-align:center; margin:8px 0;">
            💰 Бонусы: <span id="bonusDisplay">0</span> ₪ (доступны через 6 мес.)
        </p>
        <p style="font-size:11px; color:#445566; text-align:center; margin:4px 0;" id="userInfo">
            🔑 Анонимный пользователь
        </p>
        <button class="close-modal" id="closeWalletModal">Закрыть</button>
    </div>
</div>

<script>
    // ============================================================
    // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
    // ============================================================
    let currentUser = null;
    let currentUserData = null;
    let userDocRef = null;

    // ============================================================
    // 1. КАРТА
    // ============================================================
    const map = L.map('map', {
        center: [32.0853, 34.7818],
        zoom: 13,
        zoomControl: false,
    });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19,
    }).addTo(map);

    // ============================================================
    // 2. МАРКЕРЫ
    // ============================================================
    const clientIcon = L.divIcon({
        html: '<div class="marker-client"></div>',
        className: '',
        iconSize: [20, 20],
        iconAnchor: [10, 10],
    });
    const driverIcon = L.divIcon({
        html: '<div class="marker-driver">🚗</div>',
        className: '',
        iconSize: [32, 32],
        iconAnchor: [16, 16],
    });
    const endIcon = L.divIcon({
        html: '<div class="marker-end"></div>',
        className: '',
        iconSize: [16, 16],
        iconAnchor: [8, 8],
    });

    let fromMarker = null;
    let toMarker = null;
    let driverMarker = null;
    let routeControl = null;

    // ============================================================
    // 3. ГЕОЛОКАЦИЯ
    // ============================================================
    function getCurrentPosition() {
        showStatus('⏳ Определяем ваше местоположение...', 'info');

        if (!navigator.geolocation) {
            showStatus('❌ Браузер не поддерживает геолокацию', 'error');
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const { latitude, longitude } = pos.coords;
                const latlng = [latitude, longitude];

                map.setView(latlng, 15);

                if (fromMarker) map.removeLayer(fromMarker);
                fromMarker = L.marker(latlng, { icon: clientIcon })
                    .addTo(map)
                    .bindPopup('📍 Вы здесь');

                document.getElementById('fromInput').value = `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
                document.getElementById('fromInput').dataset.lat = latitude;
                document.getElementById('fromInput').dataset.lng = longitude;
                document.getElementById('fromInput').dataset.address = 'Текущее местоположение';

                showStatus('✅ Геопозиция определена!', 'success');
                setTimeout(() => clearStatus(), 2000);
            },
            (err) => {
                showStatus(`❌ Ошибка: ${err.message}`, 'error');
                console.error('Geolocation error:', err);
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    document.getElementById('geoFromBtn').addEventListener('click', getCurrentPosition);

    // ============================================================
    // 4. АВТОДОПОЛНЕНИЕ АДРЕСОВ
    // ============================================================
    async function getAddressSuggestions(query) {
        if (!query || query.length < 2) return [];
        try {
            const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=6&accept-language=ru&addressdetails=1`;
            const response = await fetch(url);
            const data = await response.json();
            return data.map(item => ({
                display_name: item.display_name,
                lat: parseFloat(item.lat),
                lng: parseFloat(item.lon),
            }));
        } catch (error) {
            console.error('Suggestions error:', error);
            return [];
        }
    }

    function showSuggestions(inputId, suggestions) {
        const listId = inputId === 'fromInput' ? 'fromSuggestions' : 'toSuggestions';
        const list = document.getElementById(listId);
        const input = document.getElementById(inputId);
        
        if (!suggestions || suggestions.length === 0) {
            list.classList.remove('active');
            list.innerHTML = '';
            return;
        }

        list.innerHTML = '';
        suggestions.forEach(item => {
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            
            const query = input.value.toLowerCase();
            const displayName = item.display_name;
            const index = displayName.toLowerCase().indexOf(query);
            let highlighted = displayName;
            if (index !== -1 && query.length > 1) {
                const before = displayName.substring(0, index);
                const match = displayName.substring(index, index + query.length);
                const after = displayName.substring(index + query.length);
                highlighted = before + '<span class="highlight">' + match + '</span>' + after;
            }
            
            div.innerHTML = `📍 ${highlighted}`;
            div.dataset.lat = item.lat;
            div.dataset.lng = item.lng;
            div.dataset.address = item.display_name;
            
            div.addEventListener('click', function() {
                input.value = item.display_name;
                input.dataset.lat = item.lat;
                input.dataset.lng = item.lng;
                input.dataset.address = item.display_name;
                
                list.classList.remove('active');
                list.innerHTML = '';
                
                if (inputId === 'toInput') {
                    buildRoute();
                } else if (inputId === 'fromInput') {
                    if (fromMarker) {
                        map.removeLayer(fromMarker);
                    }
                    fromMarker = L.marker([item.lat, item.lng], { icon: clientIcon })
                        .addTo(map)
                        .bindPopup('📍 Вы здесь');
                    map.setView([item.lat, item.lng], 15);
                    showStatus('✅ Адрес "Откуда" выбран', 'success');
                    setTimeout(() => clearStatus(), 2000);
                }
            });
            
            list.appendChild(div);
        });
        
        list.classList.add('active');
    }

    // ============================================================
    // 5. ОБРАБОТЧИКИ ВВОДА
    // ============================================================
    let fromTimeout = null;
    let toTimeout = null;

    document.getElementById('fromInput').addEventListener('input', function() {
        clearTimeout(fromTimeout);
        const query = this.value;
        if (query.length < 2) {
            document.getElementById('fromSuggestions').classList.remove('active');
            return;
        }
        fromTimeout = setTimeout(async () => {
            const suggestions = await getAddressSuggestions(query);
            showSuggestions('fromInput', suggestions);
        }, 300);
    });

    document.getElementById('toInput').addEventListener('input', function() {
        clearTimeout(toTimeout);
        const query = this.value;
        if (query.length < 2) {
            document.getElementById('toSuggestions').classList.remove('active');
            return;
        }
        toTimeout = setTimeout(async () => {
            const suggestions = await getAddressSuggestions(query);
            showSuggestions('toInput', suggestions);
        }, 300);
    });

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.address-group')) {
            document.querySelectorAll('.suggestions-list').forEach(el => {
                el.classList.remove('active');
            });
        }
    });

    // ============================================================
    // 6. ПОСТРОЕНИЕ МАРШРУТА (АВТОМАТИЧЕСКИ)
    // ============================================================
    function calculatePriceWithRange(distanceKm) {
        const baseFare = 25;
        const perKm = 1.5;
        const variancePercent = 6;
        
        const basePrice = baseFare + (distanceKm * perKm);
        const variance = basePrice * (variancePercent / 100);
        
        return {
            min: basePrice - variance,
            max: basePrice + variance,
            average: basePrice,
            display: `${(basePrice - variance).toFixed(2)} – ${(basePrice + variance).toFixed(2)}`
        };
    }

    function updatePriceDisplay(distanceKm) {
        const range = calculatePriceWithRange(distanceKm);
        
        document.getElementById('priceDisplay').textContent = range.average.toFixed(2);
        document.getElementById('priceRangeDisplay').textContent = range.display + ' ₪';
        document.getElementById('varianceHint').textContent = `±${6}% от стоимости`;
        document.getElementById('tripInfo').classList.add('active');
    }

    function parseCoordinates(str) {
        const cleaned = str.replace(/[^0-9.,-]/g, '').trim();
        const parts = cleaned.split(',').map(s => parseFloat(s.trim()));
        if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
            return { lat: parts[0], lng: parts[1] };
        }
        return null;
    }

    function showStatus(msg, type = 'info') {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.className = 'status-msg active ' + type;
        setTimeout(() => {
            if (el.classList.contains('active')) {
                el.className = 'status-msg';
            }
        }, 5000);
    }

    function clearStatus() {
        document.getElementById('statusMsg').className = 'status-msg';
    }

    function clearRoute() {
        if (routeControl) {
            map.removeControl(routeControl);
            routeControl = null;
        }
        if (toMarker) {
            map.removeLayer(toMarker);
            toMarker = null;
        }
        if (driverMarker) {
            map.removeLayer(driverMarker);
            driverMarker = null;
        }
        document.getElementById('tripInfo').classList.remove('active');
        document.getElementById('orderBtn').disabled = false;
        document.getElementById('orderBtn').innerHTML = '<i class="fas fa-taxi"></i> Заказать такси';
        document.getElementById('orderConfirmation').classList.remove('active');
        clearStatus();
    }

    function swapAddresses() {
        const fromInput = document.getElementById('fromInput');
        const toInput = document.getElementById('toInput');
        const temp = fromInput.value;
        fromInput.value = toInput.value;
        toInput.value = temp;

        const tempLat = fromInput.dataset.lat;
        const tempLng = fromInput.dataset.lng;
        fromInput.dataset.lat = toInput.dataset.lat;
        fromInput.dataset.lng = toInput.dataset.lng;
        toInput.dataset.lat = tempLat;
        toInput.dataset.lng = tempLng;

        clearRoute();
    }

    document.getElementById('clearRouteBtn').addEventListener('click', clearRoute);
    document.getElementById('swapBtn').addEventListener('click', swapAddresses);

    // ============================================================
    // 7. ПОСТРОЕНИЕ МАРШРУТА (АВТОМАТИЧЕСКИ ПРИ ВЫБОРЕ "КУДА")
    // ============================================================
    async function buildRoute() {
        const fromInput = document.getElementById('fromInput');
        const toInput = document.getElementById('toInput');

        let fromLat = parseFloat(fromInput.dataset.lat);
        let fromLng = parseFloat(fromInput.dataset.lng);

        if (!fromLat || !fromLng) {
            const coords = parseCoordinates(fromInput.value);
            if (coords) {
                fromLat = coords.lat;
                fromLng = coords.lng;
                fromInput.dataset.lat = fromLat;
                fromInput.dataset.lng = fromLng;
            } else {
                showStatus('❌ Укажите адрес "Откуда"', 'error');
                return;
            }
        }

        let toLat = parseFloat(toInput.dataset.lat);
        let toLng = parseFloat(toInput.dataset.lng);

        if (!toLat || !toLng) {
            const toCoords = parseCoordinates(toInput.value);
            if (toCoords) {
                toLat = toCoords.lat;
                toLng = toCoords.lng;
                toInput.dataset.lat = toLat;
                toInput.dataset.lng = toLng;
            } else {
                showStatus('❌ Укажите адрес "Куда"', 'error');
                return;
            }
        }

        showStatus('⏳ Строим маршрут...', 'info');

        if (routeControl) {
            map.removeControl(routeControl);
            routeControl = null;
        }

        routeControl = L.Routing.control({
            waypoints: [
                L.latLng(fromLat, fromLng),
                L.latLng(toLat, toLng)
            ],
            routeWhileDragging: false,
            showAlternatives: false,
            lineOptions: {
                styles: [{ color: '#ffb000', weight: 4, opacity: 0.9 }],
                extendToWaypoints: true,
                missingRouteTolerance: 10,
            },
            addWaypoints: false,
            draggableWaypoints: false,
            fitSelectedRoutes: true,
            show: false,
        }).addTo(map);

        routeControl.on('routesfound', function(e) {
            const routes = e.routes;
            const summary = routes[0].summary;
            const distanceKm = summary.totalDistance / 1000;
            const durationMin = Math.round(summary.totalTime / 60);

            document.getElementById('distanceDisplay').textContent = distanceKm.toFixed(1);
            document.getElementById('durationDisplay').textContent = durationMin;

            updatePriceDisplay(distanceKm);

            if (toMarker) map.removeLayer(toMarker);
            toMarker = L.marker([toLat, toLng], { icon: endIcon })
                .addTo(map)
                .bindPopup('📍 Назначение');

            showStatus(`✅ Маршрут построен! ${distanceKm.toFixed(1)} км, ~${durationMin} мин`, 'success');
        });

        routeControl.on('routingerror', function(e) {
            showStatus('❌ Не удалось построить маршрут. Проверьте адреса.', 'error');
            console.error('Routing error:', e);
        });
    }

    // ============================================================
    // 8. ЗАГРУЗКА ДАННЫХ ПОЛЬЗОВАТЕЛЯ
    // ============================================================
    async function loadUserData() {
        const auth = window.firebaseAuth;
        const user = auth.currentUser;
        
        const userNameDisplay = document.getElementById('userNameDisplay');
        const userBalanceDisplay = document.getElementById('userBalanceDisplay');
        const userInfoDisplay = document.getElementById('userInfoDisplay');

        if (!user) {
            userNameDisplay.textContent = '👋 Гость';
            userBalanceDisplay.textContent = '💰 0 ₪';
            userInfoDisplay.style.display = 'none';
            return;
        }

        try {
            const db = window.firebaseDb;
            const doc = window.doc;
            const getDoc = window.getDoc;
            const userDoc = await getDoc(doc(db, 'users', user.uid));
            
            if (userDoc.exists) {
                const data = userDoc.data();
                currentUserData = data;
                const name = data.fullName || user.displayName || 'Пользователь';
                const wallet = data.wallet || 0;
                
                userNameDisplay.textContent = '👋 ' + name;
                userBalanceDisplay.textContent = '💰 ' + wallet + ' ₪';
                userInfoDisplay.style.display = 'flex';
                userDocRef = doc(db, 'users', user.uid);
                
                document.getElementById('walletDisplay').textContent = wallet.toFixed(0);
                document.getElementById('modalBalance').textContent = wallet.toFixed(0);
                document.getElementById('bonusDisplay').textContent = (data.bonuses || 0).toFixed(2);
                document.getElementById('userInfo').textContent = '👤 ' + name;
                
                console.log('✅ Данные пользователя загружены:', data);
            } else {
                userNameDisplay.textContent = '👋 Гость';
                userBalanceDisplay.textContent = '💰 0 ₪';
                userInfoDisplay.style.display = 'none';
                console.warn('⚠️ Документ пользователя не найден');
            }
        } catch (error) {
            console.error('❌ Ошибка загрузки данных пользователя:', error);
            userNameDisplay.textContent = '👋 Гость';
            userBalanceDisplay.textContent = '💰 0 ₪';
            userInfoDisplay.style.display = 'none';
        }
    }

    // ============================================================
    // 9. КОШЕЛЁК
    // ============================================================
    async function initUserWallet(uid) {
        const db = window.firebaseDb;
        const docFn = window.doc;
        const getDocFn = window.getDoc;
        const setDocFn = window.setDoc;

        const userRef = docFn(db, 'users', uid);
        userDocRef = userRef;

        const docSnap = await getDocFn(userRef);

        if (!docSnap.exists()) {
            await setDocFn(userRef, {
                wallet: 0,
                bonuses: 0,
                bonusesAvailable: false,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
            });
            console.log('🆕 Создан кошелёк для:', uid);
        }

        return userRef;
    }

    async function getWalletData() {
        if (!userDocRef) return null;
        const getDocFn = window.getDoc;
        const docSnap = await getDocFn(userDocRef);
        if (docSnap.exists()) {
            return docSnap.data();
        }
        return null;
    }

    async function updateWalletUI() {
        const data = await getWalletData();
        if (data) {
            const wallet = data.wallet || 0;
            const bonuses = data.bonuses || 0;
            document.getElementById('walletDisplay').textContent = wallet.toFixed(0);
            document.getElementById('modalBalance').textContent = wallet.toFixed(0);
            document.getElementById('bonusDisplay').textContent = bonuses.toFixed(2);
            
            const auth = window.firebaseAuth;
            const user = auth.currentUser;
            if (user) {
                document.getElementById('userBalanceDisplay').textContent = '💰 ' + wallet.toFixed(0) + ' ₪';
            }
        }
    }

    document.getElementById('topupBtn').addEventListener('click', async () => {
        const input = document.getElementById('topupInput');
        const amount = parseFloat(input.value);
        if (!amount || amount <= 0) {
            alert('Введите сумму пополнения');
            return;
        }

        try {
            const updateDocFn = window.updateDoc;
            const incrementFn = window.increment;

            await updateDocFn(userDocRef, {
                wallet: incrementFn(amount),
                updatedAt: new Date().toISOString(),
            });

            await updateWalletUI();
            input.value = '';
            showStatus(`💰 Кошелёк пополнен на ${amount} ₪`, 'success');
        } catch (error) {
            console.error('❌ Ошибка пополнения:', error);
            showStatus('❌ Ошибка пополнения: ' + error.message, 'error');
        }
    });

    document.getElementById('walletBtn').addEventListener('click', () => {
        document.getElementById('walletModal').classList.add('active');
        updateWalletUI();
    });

    document.getElementById('closeWalletModal').addEventListener('click', () => {
        document.getElementById('walletModal').classList.remove('active');
    });

    document.getElementById('walletModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) {
            document.getElementById('walletModal').classList.remove('active');
        }
    });

    // ============================================================
    // 10. ВЫХОД
    // ============================================================
    document.getElementById('logoutBtn').addEventListener('click', async function() {
        try {
            const auth = window.firebaseAuth;
            const signOut = window.signOut;
            await signOut(auth);
            window.location.href = 'index.html';
        } catch (error) {
            console.error('❌ Ошибка выхода:', error);
        }
    });

    // ============================================================
    // 11. СОЗДАНИЕ ЗАКАЗА (АНОНИМНЫЙ + АВТОРИЗОВАННЫЙ)
    // ============================================================
    document.getElementById('orderBtn').addEventListener('click', async function() {
        const fromInput = document.getElementById('fromInput');
        const toInput = document.getElementById('toInput');
        const priceDisplay = document.getElementById('priceDisplay');
        const distanceDisplay = document.getElementById('distanceDisplay');
        const confirmationEl = document.getElementById('orderConfirmation');
        const orderIdDisplay = document.getElementById('orderIdDisplay');

        // Скрываем предыдущее подтверждение
        confirmationEl.classList.remove('active');

        // Получаем координаты
        let fromLat = parseFloat(fromInput.dataset.lat);
        let fromLng = parseFloat(fromInput.dataset.lng);
        let fromAddress = fromInput.dataset.address || fromInput.value;

        if (!fromLat || !fromLng) {
            const coords = parseCoordinates(fromInput.value);
            if (coords) {
                fromLat = coords.lat;
                fromLng = coords.lng;
                fromAddress = fromInput.value;
            } else {
                showStatus('❌ Укажите адрес "Откуда"', 'error');
                return;
            }
        }

        let toLat = parseFloat(toInput.dataset.lat);
        let toLng = parseFloat(toInput.dataset.lng);
        let toAddress = toInput.dataset.address || toInput.value;

        if (!toLat || !toLng) {
            const toCoords = parseCoordinates(toInput.value);
            if (toCoords) {
                toLat = toCoords.lat;
                toLng = toCoords.lng;
                toAddress = toInput.value;
            } else {
                showStatus('❌ Укажите адрес "Куда"', 'error');
                return;
            }
        }

        const price = parseFloat(priceDisplay.textContent) || 0;
        const distance = parseFloat(distanceDisplay.textContent) || 0;

        // Блокируем кнопку
        this.disabled = true;
        this.textContent = '⏳ Создание...';
        showStatus('⏳ Создаём заказ...', 'info');

        try {
            const auth = window.firebaseAuth;
            const db = window.firebaseDb;
            const user = auth.currentUser;

            let clientId, clientData;

            if (user) {
                // ============================================================
                // АВТОРИЗОВАННЫЙ КЛИЕНТ
                // ============================================================
                const doc = window.doc;
                const getDoc = window.getDoc;
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                
                if (!userDoc.exists()) {
                    showStatus('❌ Пользователь не найден в базе', 'error');
                    this.disabled = false;
                    this.innerHTML = '<i class="fas fa-taxi"></i> Заказать такси';
                    return;
                }

                clientData = userDoc.data();
                clientId = user.uid;

                // Проверяем баланс (только если есть цена)
                const wallet = clientData.wallet || 0;
                if (price > 0 && wallet < price) {
                    showStatus(`❌ Недостаточно средств. Нужно ${price.toFixed(2)} ₪, доступно ${wallet.toFixed(2)} ₪`, 'error');
                    this.disabled = false;
                    this.innerHTML = '<i class="fas fa-taxi"></i> Заказать такси';
                    return;
                }

                // Списание средств (если цена > 0)
                if (price > 0) {
                    const runTransactionFn = window.runTransaction;
                    const incrementFn = window.increment;
                    await runTransactionFn(db, async (transaction) => {
                        const userRef = doc(db, 'users', user.uid);
                        const userSnap = await transaction.get(userRef);
                        if (!userSnap.exists()) {
                            throw new Error('Пользователь не найден');
                        }
                        const currentWallet = userSnap.data().wallet || 0;
                        if (currentWallet < price) {
                            throw new Error('Недостаточно средств');
                        }
                        transaction.update(userRef, {
                            wallet: incrementFn(-price),
                            updatedAt: new Date().toISOString()
                        });
                    });
                }

            } else {
                // ============================================================
                // АНОНИМНЫЙ КЛИЕНТ (без авторизации)
                // ============================================================
                clientId = 'anonymous_' + Date.now();
                clientData = {
                    fullName: 'Гость',
                    phone: null,
                    email: null
                };
                
                // Анонимный вход в Firebase (чтобы был uid для заказа)
                try {
                    const signInAnon = window.signInAnonymously;
                    const userCred = await signInAnon(auth);
                    clientId = userCred.user.uid;
                    console.log('👤 Анонимный вход выполнен:', clientId);
                } catch (anonError) {
                    console.warn('⚠️ Анонимный вход не удался, используем временный ID');
                }
            }

            // ============================================================
            // СОЗДАЁМ ЗАКАЗ
            // ============================================================
            const collectionFn = window.collection;
            const addDocFn = window.addDoc;
            const updateDocFn = window.updateDoc;
            const incrementFn = window.increment;

            const orderData = {
                orderId: 'ORD-' + Date.now().toString().slice(-8),
                status: 'waiting',
                clientId: clientId,
                client: {
                    name: clientData.fullName || 'Гость',
                    phone: clientData.phone || null,
                    email: clientData.email || null,
                    from: {
                        lat: fromLat,
                        lng: fromLng,
                        address: fromAddress
                    }
                },
                destination: {
                    lat: toLat,
                    lng: toLng,
                    address: toAddress
                },
                route: {
                    distance_km: distance,
                    duration_min: parseInt(document.getElementById('durationDisplay').textContent) || 0
                },
                price: {
                    base: price,
                    min: price * 0.94,
                    max: price * 1.06,
                    currency: 'ILS',
                    perKm: 1.5,
                    baseFare: 25
                },
                createdAt: new Date().toISOString(),
                createdAtTimestamp: Date.now(),
                date: new Date().toLocaleDateString('he-IL'),
                time: new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }),
                driverId: null,
                driver: {
                    id: null,
                    name: null,
                    phone: null,
                    carModel: null,
                    carNumber: null,
                    status: 'pending'
                },
                paymentMethod: 'wallet',
                bonusUsed: 0,
                isPreorder: false,
                preorderTime: null,
                dispatcherNote: null,
                completedAt: null,
                cancelledAt: null,
                isAnonymous: !user
            };

            const ordersRef = collectionFn(db, 'orders');
            const docRef = await addDocFn(ordersRef, orderData);

            // Начисляем бонус (только для авторизованных клиентов, если цена > 0)
            if (user && price > 0) {
                const bonusAmount = price * 0.01;
                await updateDocFn(doc(db, 'users', user.uid), {
                    bonuses: incrementFn(bonusAmount),
                    updatedAt: new Date().toISOString()
                });
                console.log(`💰 Бонус ${bonusAmount.toFixed(2)} ₪ начислен`);
            }

            // Обновляем UI
            await updateWalletUI();

            // ============================================================
            // ПОКАЗЫВАЕМ ПОДТВЕРЖДЕНИЕ
            // ============================================================
            const orderShortId = docRef.id.slice(0, 8);
            orderIdDisplay.textContent = `ID: ${orderShortId}...`;
            confirmationEl.classList.add('active');

            showStatus(`✅ Заказ успешно создан! ID: ${orderShortId}...`, 'success');
            
            this.disabled = false;
            this.innerHTML = '<i class="fas fa-taxi"></i> Заказать такси';

            console.log('📦 ЗАКАЗ СОЗДАН:', orderData);
            console.log('📦 ID документа:', docRef.id);

            // ============================================================
            // ДЕМОНСТРАЦИЯ — МАШИНА НА КАРТЕ
            // ============================================================
            if (driverMarker) map.removeLayer(driverMarker);
            const fromLatLng = [fromLat, fromLng];
            driverMarker = L.marker(fromLatLng, { icon: driverIcon })
                .addTo(map)
                .bindPopup('🚗 Водитель назначен');

            let progress = 0;
            const interval = setInterval(() => {
                progress += 0.02;
                if (progress > 1) {
                    clearInterval(interval);
                    const msg = document.getElementById('statusMsg');
                    if (msg && msg.classList.contains('active')) {
                        // не перезаписываем, если уже есть сообщение
                    } else {
                        showStatus('🚗 Водитель прибыл!', 'success');
                    }
                    return;
                }
                const lat = fromLat + (toLat - fromLat) * progress;
                const lng = fromLng + (toLng - fromLng) * progress;
                driverMarker.setLatLng([lat, lng]);
            }, 200);

            // Автоматически скрываем подтверждение через 8 секунд
            setTimeout(() => {
                confirmationEl.classList.remove('active');
            }, 8000);

        } catch (error) {
            console.error('❌ Ошибка создания заказа:', error);
            showStatus('❌ Ошибка: ' + error.message, 'error');
            this.disabled = false;
            this.innerHTML = '<i class="fas fa-taxi"></i> Заказать такси';
        }
    });

    // ============================================================
    // 12. АВТОРИЗАЦИЯ
    // ============================================================
    async function initFirebaseAuth() {
        const auth = window.firebaseAuth;
        const onAuth = window.onAuthStateChanged;

        onAuth(auth, async (user) => {
            if (user) {
                currentUser = user;
                console.log('✅ Авторизован:', user.uid);
                await initUserWallet(user.uid);
                await loadUserData();
                await updateWalletUI();
            } else {
                currentUser = null;
                currentUserData = null;
                console.log('❌ Не авторизован (анонимный режим)');
                document.getElementById('userNameDisplay').textContent = '👋 Гость';
                document.getElementById('userBalanceDisplay').textContent = '💰 0 ₪';
                document.getElementById('userInfoDisplay').style.display = 'none';
                document.getElementById('userInfo').textContent = '🔑 Анонимный пользователь';
            }
        });
    }

    // ============================================================
    // 13. ЗАПУСК
    // ============================================================
    window.addEventListener('load', () => {
        initFirebaseAuth();
        setTimeout(getCurrentPosition, 800);
        console.log('🚗 WHEEL Client loaded');
    });
</script>
