<html>
<head>

  <!-- Google Maps API (вставьте ваш ключ) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY_HERE&libraries=places&callback=initMap" async defer></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <style>
    /* ... ваши существующие стили (оставьте без изменений) ... */
    /* Добавим небольшой стиль для легенды */
    .map-legend {
      background: rgba(255,255,255,0.9);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 1000;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .map-legend span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .map-legend .dot {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
    }
    .dot-green { background: #28a745; }
    .dot-blue { background: #007bff; }
    .dot-gray { background: #6c757d; }
  </style>
</head>
<body>
<div class="container">
  <!-- ... ваш HTML (без изменений) ... -->
  <!-- Внутри блока с картой добавьте контейнер для легенды -->
  <div class="flex-col" style="position:relative;">
    <div id="map"></div>
    <div class="map-legend" id="mapLegend" style="display:none;">
      <span><span class="dot dot-green"></span> Свободные водители</span>
      <span><span class="dot dot-blue"></span> Ваш водитель</span>
    </div>
    <div class="map-hint">
      💡 Кликните по карте, чтобы изменить точку отправления.<br>
      🟢 Зелёные машинки – свободные водители рядом.<br>
      🔵 Синяя машинка – ваш водитель.
    </div>
  </div>
  <!-- ... остальной HTML ... -->
</div>

<script>
  // ==================== КОНФИГ FIREBASE ====================
  const firebaseConfig = {
    apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
    authDomain: "taxi-ai-app-69628.firebaseapp.com",
    projectId: "taxi-ai-app-69628",
    storageBucket: "taxi-ai-app-69628.firebasestorage.app",
    messagingSenderId: "952357992434",
    appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
    measurementId: "G-Z9NJFSSXH6"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
  let currentUser = null;
  let currentUserData = null;
  let map = null;
  let directionsRenderer = null;
  let fromMarker = null;
  let toMarker = null;
  let driverMarker = null;          // маркер назначенного водителя (синий)
  let freeDriverMarkers = {};       // {driverId: marker} для свободных водителей (зелёные)
  let currentOrderId = null;
  let orderUnsubscribe = null;
  let driverUnsubscribe = null;
  let freeDriversUnsubscribe = null;
  let currentDriverLat = null;
  let currentDriverLng = null;
  let currentFromLat = 32.0853;
  let currentFromLng = 34.7818;
  let currentToLat = 31.7683;
  let currentToLng = 35.2137;
  let currentDistanceKm = 0;
  let currentDurationMin = 0;
  let autocompleteFrom = null;
  let autocompleteTo = null;
  let mapInitialized = false;
  let assignedDriverId = null;      // ID водителя, который принял заказ

  // ==================== ТАРИФЫ (без изменений) ====================
  // ... (оставьте как есть)

  // ==================== АУТЕНТИФИКАЦИЯ ====================
  // ... (без изменений)

  // ==================== БОНУСЫ ====================
  // ... (без изменений)

  // ==================== ИНИЦИАЛИЗАЦИЯ КАРТЫ ====================
  window.initMap = function() {
    // ... существующий код инициализации ...
    // После создания карты добавим подписку на свободных водителей
    listenFreeDrivers();
    // Также покажем легенду
    document.getElementById('mapLegend').style.display = 'flex';
  };

  // ==================== НОВАЯ ФУНКЦИЯ: ПРОСЛУШКА СВОБОДНЫХ ВОДИТЕЛЕЙ ====================
  function listenFreeDrivers() {
    if (freeDriversUnsubscribe) freeDriversUnsubscribe();

    // Подписываемся на всех водителей, которые свободны (available == true) и имеют роль driver
    freeDriversUnsubscribe = db.collection('drivers')
      .where('role', '==', 'driver')
      .where('available', '==', true)
      .onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
          const driverId = change.doc.id;
          const data = change.doc.data();

          // Если водитель назначен на текущий заказ клиента, не показываем его как свободного (он будет отображаться отдельно)
          if (assignedDriverId === driverId) return;

          // Проверяем, находится ли водитель в зоне доступности (радиус 5 км от клиента)
          if (currentFromLat && currentFromLng && data.lat && data.lng) {
            const dist = getDistance(currentFromLat, currentFromLng, data.lat, data.lng);
            const DISTANCE_LIMIT = 5; // км
            if (dist > DISTANCE_LIMIT) {
              // Если водитель далеко, удаляем маркер, если он есть
              if (freeDriverMarkers[driverId]) {
                freeDriverMarkers[driverId].setMap(null);
                delete freeDriverMarkers[driverId];
              }
              return;
            }
          }

          if (change.type === 'added' || change.type === 'modified') {
            // Проверяем, что координаты есть и не нулевые
            if (data.lat && data.lng && data.lat !== 0 && data.lng !== 0) {
              // Создаём или обновляем маркер
              if (freeDriverMarkers[driverId]) {
                // Обновляем позицию
                freeDriverMarkers[driverId].setPosition({ lat: data.lat, lng: data.lng });
              } else {
                // Создаём новый маркер (зелёная машинка)
                const icon = {
                  url: 'https://maps.google.com/mapfiles/ms/icons/green-dot.png',
                  scaledSize: new google.maps.Size(32, 32)
                };
                // Можно использовать собственную иконку машинки
                const marker = new google.maps.Marker({
                  position: { lat: data.lat, lng: data.lng },
                  map: map,
                  icon: icon,
                  title: data.fullName || 'Свободный водитель'
                });
                // Добавляем информационное окно
                const infoWindow = new google.maps.InfoWindow({
                  content: `<b>${data.fullName || 'Водитель'}</b><br>🚗 ${data.carModel || ''} ${data.carNumber || ''}<br>📞 ${data.phone || ''}`
                });
                marker.addListener('click', () => {
                  infoWindow.open(map, marker);
                });
                freeDriverMarkers[driverId] = marker;
              }
            }
          } else if (change.type === 'removed') {
            // Удаляем маркер
            if (freeDriverMarkers[driverId]) {
              freeDriverMarkers[driverId].setMap(null);
              delete freeDriverMarkers[driverId];
            }
          }
        });
      }, error => {
        console.error('Ошибка прослушки свободных водителей:', error);
      });
  }

  // ==================== ОБНОВЛЕНИЕ МАРКЕРА НАЗНАЧЕННОГО ВОДИТЕЛЯ ====================
  // Переименуем функцию updateDriverMarker в updateAssignedDriverMarker и сделаем её более явной
  function updateAssignedDriverMarker(lat, lng, name, carModel, carNumber, phone) {
    if (driverMarker) driverMarker.setMap(null);
    // Синяя машинка для назначенного водителя
    const icon = {
      url: 'https://maps.google.com/mapfiles/ms/icons/blue-dot.png',
      scaledSize: new google.maps.Size(40, 40)
    };
    driverMarker = new google.maps.Marker({
      position: { lat, lng },
      map: map,
      icon: icon,
      title: 'Ваш водитель: ' + name
    });
    const infoWindow = new google.maps.InfoWindow({
      content: `<b>${name || 'Водитель'}</b> (ваш)<br>🚗 ${carModel || ''} ${carNumber || ''}<br>📞 ${phone || ''}`
    });
    driverMarker.addListener('click', () => {
      infoWindow.open(map, driverMarker);
    });
    currentDriverLat = lat;
    currentDriverLng = lng;
    document.getElementById('waze-btn').style.display = 'inline-block';
  }

  // ==================== ОБНОВЛЕНИЕ ЗОНЫ ДОСТУПНОСТИ (ОПЦИОНАЛЬНО) ====================
  // Можно добавить круг на карте
  let availabilityCircle = null;
  function updateAvailabilityZone(lat, lng, radiusKm) {
    if (availabilityCircle) availabilityCircle.setMap(null);
    availabilityCircle = new google.maps.Circle({
      strokeColor: '#28a745',
      strokeOpacity: 0.3,
      strokeWeight: 1,
      fillColor: '#28a745',
      fillOpacity: 0.05,
      map: map,
      center: { lat, lng },
      radius: radiusKm * 1000 // метры
    });
  }

  // ==================== АДАПТАЦИЯ СУЩЕСТВУЮЩИХ ФУНКЦИЙ ====================
  // В функции updateOrderUI после получения данных заказа обновляем assignedDriverId
  function updateOrderUI(orderId, data) {
    // ... существующий код ...
    assignedDriverId = data.driverId || null;
    // Если есть назначенный водитель, обновляем его маркер
    if (data.driverId) {
      // Получаем данные водителя из коллекции drivers (можно подписаться отдельно)
      db.collection('drivers').doc(data.driverId).get()
        .then(doc => {
          if (doc.exists) {
            const d = doc.data();
            if (d.lat && d.lng) {
              updateAssignedDriverMarker(d.lat, d.lng, d.fullName || d.email, d.carModel, d.carNumber, d.phone);
            }
          }
        });
      // Подписываемся на обновления координат водителя
      if (driverUnsubscribe) driverUnsubscribe();
      driverUnsubscribe = db.collection('drivers').doc(data.driverId)
        .onSnapshot(doc => {
          if (doc.exists) {
            const d = doc.data();
            if (d.lat && d.lng) {
              updateAssignedDriverMarker(d.lat, d.lng, d.fullName || d.email, d.carModel, d.carNumber, d.phone);
            }
          }
        });
    }
    // ... остальной код ...
  }

  // ==================== ДОПОЛНИТЕЛЬНО: ОБНОВЛЕНИЕ ЗОНЫ ПРИ ИЗМЕНЕНИИ МЕСТОПОЛОЖЕНИЯ КЛИЕНТА ====================
  // В функции updateRoute, после обновления координат клиента, вызываем обновление зоны и перерисовку свободных водителей
  function updateRoute() {
    // ... существующий код ...
    // После обновления currentFromLat/currentFromLng
    if (currentFromLat && currentFromLng) {
      // Обновляем зону доступности (например, 5 км)
      updateAvailabilityZone(currentFromLat, currentFromLng, 5);
      // Перезапускаем прослушку свободных водителей, чтобы они пересчитались по новой зоне
      // Для этого можно просто отписаться и подписаться заново
      if (freeDriversUnsubscribe) {
        freeDriversUnsubscribe();
        listenFreeDrivers();
      }
    }
    // ... остальной код ...
  }

  // ==================== ИНИЦИАЛИЗАЦИЯ (в конце) ====================
  // Подписываемся на события изменения координат клиента (через поля from-lat/lng)
  document.getElementById('from-lat').addEventListener('change', function() {
    if (freeDriversUnsubscribe) {
      freeDriversUnsubscribe();
      listenFreeDrivers();
    }
  });
  document.getElementById('from-lng').addEventListener('change', function() {
    if (freeDriversUnsubscribe) {
      freeDriversUnsubscribe();
      listenFreeDrivers();
    }
  });

  // ... остальной код без изменений ...
</script>
</body>
