<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Личный кабинет — WHEEL</title>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            collection,
            query,
            where,
            orderBy,
            limit,
            onSnapshot,
            updateDoc,
            increment
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Делаем доступными для других скриптов
        window.auth = auth;
        window.db = db;
        window.signOut = signOut;
        window.doc = doc;
        window.getDoc = getDoc;
        window.collection = collection;
        window.query = query;
        window.where = where;
        window.orderBy = orderBy;
        window.limit = limit;
        window.onSnapshot = onSnapshot;
        window.updateDoc = updateDoc;
        window.increment = increment;
    </script>

    <style>
        /* ===== ОБЩИЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 180, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 160, 255, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
            background-attachment: fixed;
        }

        .phone-frame {
            width: 100%;
            max-width: 400px;
            background: rgba(18, 22, 28, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 44px;
            padding: 20px 24px 32px;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            position: relative;
            min-height: 500px;
        }

        /* Заголовок */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-top: 30px;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .user-name {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .user-email {
            font-size: 13px;
            color: #8899aa;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px 14px;
            color: #8899aa;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: rgba(255, 70, 70, 0.15);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        /* Карточки статистики */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 16px 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .stat-card .label {
            font-size: 12px;
            color: #8899aa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
        }

        .stat-card .value.positive {
            color: #4ade80;
        }
        .stat-card .value.negative {
            color: #ff6b6b;
        }
        .stat-card .value.gold {
            color: #ffb000;
        }

        /* Кнопка заказа */
        .order-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #ffb000, #ff6a00);
            color: #0a0c10;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(255, 140, 0, 0.3);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .order-btn:active {
            transform: scale(0.97);
        }

        /* История транзакций */
        .history-section {
            width: 100%;
            margin-top: 8px;
        }

        .history-title {
            font-size: 16px;
            font-weight: 600;
            color: #e0e8f0;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-list {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .history-list::-webkit-scrollbar {
            width: 3px;
        }
        .history-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .transaction-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .transaction-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .transaction-desc {
            font-size: 14px;
            font-weight: 500;
            color: #e0e8f0;
        }

        .transaction-date {
            font-size: 11px;
            color: #667788;
            margin-top: 2px;
        }

        .transaction-amount {
            font-size: 16px;
            font-weight: 700;
        }

        .transaction-amount.positive {
            color: #4ade80;
        }
        .transaction-amount.negative {
            color: #ff6b6b;
        }

        .empty-history {
            color: #667788;
            font-size: 14px;
            text-align: center;
            padding: 20px 0;
        }

        /* Индикатор */
        .home-indicator {
            margin-top: 16px;
            width: 130px;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
        }

        /* Загрузка */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: #8899aa;
            font-size: 16px;
        }

        @media (max-width: 420px) {
            .phone-frame {
                border-radius: 0;
                padding: 16px 20px 24px;
                background: rgba(10, 12, 16, 0.95);
                backdrop-filter: blur(15px);
                box-shadow: none;
                border: none;
            }
            .stats-grid {
                gap: 8px;
            }
            .stat-card .value {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="phone-frame" id="app">
        <!-- Шапка -->
        <div class="header">
            <div class="user-info">
                <div class="user-name" id="userName">Загрузка...</div>
                <div class="user-email" id="userEmail">email@domain.com</div>
            </div>
            <button class="logout-btn" id="logoutBtn">🚪 Выйти</button>
        </div>

        <!-- Статистика -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">💰 Баланс</div>
                <div class="value gold" id="balance">0 ₽</div>
            </div>
            <div class="stat-card">
                <div class="label">⭐ Рейтинг</div>
                <div class="value" id="rating">0.0</div>
            </div>
            <div class="stat-card">
                <div class="label">🎁 Бонусы</div>
                <div class="value gold" id="bonus">0</div>
            </div>
            <div class="stat-card">
                <div class="label">📊 Потрачено</div>
                <div class="value negative" id="totalSpent">0 ₽</div>
            </div>
        </div>

        <!-- Кнопка заказа -->
        <button class="order-btn" id="orderBtn">
            <span>📍</span> Заказать такси
        </button>

        <!-- История -->
        <div class="history-section">
            <div class="history-title">
                <span>📋 История операций</span>
                <span style="font-size:12px; color:#667788;">последние 10</span>
            </div>
            <div class="history-list" id="historyList">
                <div class="loading">Загрузка...</div>
            </div>
        </div>

        <div class="home-indicator"></div>
    </div>

    <script>
        // ============================================================
        // 1. ПРОВЕРКА АВТОРИЗАЦИИ И ПОЛУЧЕНИЕ ДАННЫХ
        // ============================================================
        let currentUser = null;
        let currentUserData = null;
        let transactionsUnsubscribe = null;

        const userNameEl = document.getElementById('userName');
        const userEmailEl = document.getElementById('userEmail');
        const balanceEl = document.getElementById('balance');
        const ratingEl = document.getElementById('rating');
        const bonusEl = document.getElementById('bonus');
        const totalSpentEl = document.getElementById('totalSpent');
        const historyList = document.getElementById('historyList');

        // Функция обновления UI статистики
        function updateStats(userData) {
            if (!userData) return;
            balanceEl.textContent = (userData.balance || 0).toFixed(2) + ' ₽';
            ratingEl.textContent = (userData.rating || 0).toFixed(1);
            bonusEl.textContent = userData.bonus || 0;
            totalSpentEl.textContent = (userData.totalSpent || 0).toFixed(2) + ' ₽';
        }

        // Функция отображения транзакций
        function renderTransactions(transactions) {
            if (!transactions || transactions.length === 0) {
                historyList.innerHTML = '<div class="empty-history">Нет операций</div>';
                return;
            }
            let html = '';
            transactions.forEach(tx => {
                const amount = tx.amount || 0;
                const sign = amount >= 0 ? '+' : '';
                const cls = amount >= 0 ? 'positive' : 'negative';
                const date = tx.timestamp ? new Date(tx.timestamp.toDate()).toLocaleString('ru-RU') : '';
                html += `
                    <div class="transaction-item">
                        <div class="transaction-info">
                            <div class="transaction-desc">${tx.description || 'Операция'}</div>
                            <div class="transaction-date">${date}</div>
                        </div>
                        <div class="transaction-amount ${cls}">${sign}${amount.toFixed(2)} ₽</div>
                    </div>
                `;
            });
            historyList.innerHTML = html;
        }

        // Подписка на изменения пользователя и транзакций
        function subscribeToUserData(uid) {
            if (!uid) return;

            const userDocRef = doc(db, 'users', uid);
            // Слушаем изменения документа пользователя
            const unsubUser = onSnapshot(userDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    currentUserData = docSnap.data();
                    userNameEl.textContent = currentUserData.displayName || 'Пользователь';
                    userEmailEl.textContent = currentUserData.email || '';
                    updateStats(currentUserData);
                } else {
                    // Если документа нет – создадим минимальный
                    console.warn('Документ пользователя не найден, создаём...');
                    // Можно создать, но пока просто выведем ошибку
                    historyList.innerHTML = '<div class="empty-history">Ошибка загрузки профиля</div>';
                }
            }, (error) => {
                console.error('Ошибка подписки на пользователя:', error);
            });

            // Подписка на транзакции (последние 10 по времени)
            const q = query(
                collection(db, 'transactions'),
                where('userId', '==', uid),
                orderBy('timestamp', 'desc'),
                limit(10)
            );
            const unsubTx = onSnapshot(q, (snapshot) => {
                const transactions = [];
                snapshot.forEach(doc => {
                    transactions.push({ id: doc.id, ...doc.data() });
                });
                renderTransactions(transactions);
            }, (error) => {
                console.error('Ошибка подписки на транзакции:', error);
                historyList.innerHTML = '<div class="empty-history">Ошибка загрузки истории</div>';
            });

            // Сохраняем отписки для очистки
            window._unsubUser = unsubUser;
            window._unsubTx = unsubTx;
        }

        // ============================================================
        // 2. АВТОРИЗАЦИЯ И ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                // Проверяем, что это клиент (роль client или отсутствует)
                const userDocRef = doc(db, 'users', user.uid);
                getDoc(userDocRef).then(docSnap => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.role && data.role !== 'client') {
                            // Если роль не клиент – перенаправляем на соответствующую страницу
                            alert('Вы не клиент. Перенаправление...');
                            if (data.role === 'driver') window.location.href = '/driver.html';
                            else if (data.role === 'admin') window.location.href = '/admin.html';
                            else window.location.href = '/index.html';
                            return;
                        }
                        // Подписываемся на данные
                        subscribeToUserData(user.uid);
                    } else {
                        // Если документа нет – создаём (защита от ошибок)
                        alert('Профиль не найден. Пожалуйста, зарегистрируйтесь заново.');
                        signOut(auth);
                        window.location.href = '/index.html';
                    }
                }).catch(err => {
                    console.error('Ошибка получения данных пользователя:', err);
                });
            } else {
                // Не авторизован – редирект на главную
                window.location.href = '/index.html';
            }
        });

        // ============================================================
        // 3. ОБРАБОТЧИКИ СОБЫТИЙ
        // ============================================================

        // Выход
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                // Отписываемся от слушателей
                if (window._unsubUser) window._unsubUser();
                if (window._unsubTx) window._unsubTx();
                await signOut(auth);
                window.location.href = '/index.html';
            } catch (error) {
                console.error('Ошибка выхода:', error);
            }
        });

        // Кнопка "Заказать такси"
        document.getElementById('orderBtn').addEventListener('click', () => {
            // Переход на страницу заказа (создадим отдельно)
            window.location.href = '/order.html';
        });
    </script>

</body>
</html>
