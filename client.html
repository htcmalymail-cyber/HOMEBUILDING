        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, query, where, orderBy, limit, getDocs, serverTimestamp, GeoPoint } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
            authDomain: "taxi-ai-app-69628.firebaseapp.com",
            projectId: "taxi-ai-app-69628",
            storageBucket: "taxi-ai-app-69628.firebasestorage.app",
            messagingSenderId: "952357992434",
            appId: "1:952357992434:web:ec905a7016c3d4f1049d6b",
            measurementId: "G-Z9NJFSSXH6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.authFunctions = {
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,

        window.firestoreFunctions = {
            doc, setDoc, getDoc, updateDoc, collection, addDoc,

        console.log("✅ Firebase + Google Maps initialized");

    <style>
        * {
            margin: 0;
            padding: 0;

        }

        body {
            font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

        /* Шапка */

        /* Панель заказа */
        .order-panel {

        .input-group {

        .tab-btn.active {
            background: #ffb000;

        }

        /* История поездок */
        .ride-item {
            background: rgba(255,255,255,0.04);

        .ride-route {

        .ride-details {

        /* Отслеживание водителя */
        .driver-tracker {
            display: none;

        .driver-tracker.active {

        .driver-info {
            display: flex;

        .driver-photo {

        }

        .driver-name {

        }

        .driver-car {
            font-size: 13px;
            color: #8899aa;
        }

        .eta {
            font-size: 20px;
            font-weight: 700;
            color: #4ade80;
            margin-top: 8px;
        }

        /* Языковой переключатель */
        .lang-switcher {
            display: flex;
            gap: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;

        }

        .lang-btn {

        .lang-btn.active {

    </style>

<body>
    <!-- Шапка -->
    <div class="header">
        <div class="logo-small">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>

    <!-- Модалка: Профиль / Регистрация -->

    <!-- Модалка: История поездок -->
    <div class="modal" id="historyModal">
        <div class="modal-content">
            <h3>📋 История поездок</h3>
            <div id="ridesList"><p style="color:#667788;">Нет поездок</p></div>
            <div style="margin-top:16px;padding:12px;background:rgba(74,222,128,0.1);border-radius:12px;">
                <span style="color:#4ade80;">💰 Кэшбэк: </span>
                <span style="font-weight:700;color:#4ade80;" id="totalCashback">₪0</span>
                <br><small style="color:#667788;">Доступен через 8 месяцев</small>
            </div>
            <button class="modal-close" id="closeHistory">Закрыть</button>
        </div>
    </div>

    <script>
        // ============ ПЕРЕМЕННЫЕ ============
        let map, pickupMarker, dropoffMarker, directionsService, directionsRenderer;
        let pickupLocation = null;
        let dropoffLocation = null;
        let currentUser = null;
        let currentOrderId = null;
        let driverTrackingInterval = null;

        // ============ ЯЗЫКИ ============
        const i18n = {
            he: {
                pickup: "מאיפה?", dropoff: "לאן?", order: "הזמן WHEEL",
                price: "מחיר משוער", cashback: "קאשבק", distance: "מרחק",
                login: "התחברות", register: "הרשמה", history: "היסטוריית נסיעות",
                noRides: "אין נסיעות", availableIn: "זמין בעוד 8 חודשים"
            },
            ar: {
                pickup: "من أين؟", dropoff: "إلى أين؟", order: "اطلب WHEEL",
                price: "السعر التقديري", cashback: "كاش باك", distance: "المسافة",
                login: "دخول", register: "تسجيل", history: "سجل الرحلات",
                noRides: "لا توجد رحلات", availableIn: "متاح بعد 8 أشهر"
            },
            en: {
                pickup: "Pickup?", dropoff: "Where to?", order: "Order WHEEL",
                price: "Estimated price", cashback: "Cashback", distance: "Distance",
                login: "Login", register: "Register", history: "Ride History",
                noRides: "No rides", availableIn: "Available in 8 months"
            }
        };

        let currentLang = 'en';
        function t(key) { return i18n[currentLang]?.[key] || i18n.en[key] || key; }

        // ============ КАРТА ============
        function initMap() {
            const telAviv = { lat: 32.0853, lng: 34.7818 };
            map = new google.maps.Map(document.getElementById('map'), {
                center: telAviv,
                zoom: 14,
                disableDefaultUI: true,
                zoomControl: true,
                styles: [
                    { elementType: "geometry", stylers: [{ color: "#1a1d25" }] },
                    { elementType: "labels.text.fill", stylers: [{ color: "#8a95a5" }] },
                    { elementType: "labels.text.stroke", stylers: [{ color: "#0a0c10" }] },
                    { featureType: "road", elementType: "geometry", stylers: [{ color: "#2a2d35" }] },
                    { featureType: "water", elementType: "geometry", stylers: [{ color: "#0d1628" }] }
                ]
            });

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: map,
                suppressMarkers: true,
                polylineOptions: { strokeColor: '#ffb000', strokeWeight: 5 }
            });

            // Автокомплит адресов
            const pickupAutocomplete = new google.maps.places.Autocomplete(
                document.getElementById('pickupInput'),
                { componentRestrictions: { country: 'il' } }
            );
            const dropoffAutocomplete = new google.maps.places.Autocomplete(
                document.getElementById('dropoffInput'),
                { componentRestrictions: { country: 'il' } }
            );

            pickupAutocomplete.addListener('place_changed', () => {
                const place = pickupAutocomplete.getPlace();
                if (place.geometry) {
                    pickupLocation = place.geometry.location;
                    updatePickupMarker();
                    calculateRoute();
                }
            });

            dropoffAutocomplete.addListener('place_changed', () => {
                const place = dropoffAutocomplete.getPlace();
                if (place.geometry) {
                    dropoffLocation = place.geometry.location;
                    updateDropoffMarker();
                    calculateRoute();
                }
            });

            // Кнопка геолокации
            document.getElementById('locateBtn').addEventListener('click', () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            const loc = new google.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
                            pickupLocation = loc;
                            map.setCenter(loc);
                            updatePickupMarker();
                            
                            const geocoder = new google.maps.Geocoder();
                            geocoder.geocode({ location: loc }, (results, status) => {
                                if (status === 'OK' && results[0]) {
                                    document.getElementById('pickupInput').value = results[0].formatted_address;
                                }
                            });
                        },
                        () => alert('Не удалось определить местоположение')
                    );
                }
            });
        }

        function updatePickupMarker() {
            if (pickupMarker) pickupMarker.setMap(null);
            if (pickupLocation) {
                pickupMarker = new google.maps.Marker({
                    position: pickupLocation,
                    map: map,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 10,
                        fillColor: '#4ade80',
                        fillOpacity: 1,
                        strokeColor: '#fff',
                        strokeWeight: 3
                    }
                });
            }
        }

        function updateDropoffMarker() {
            if (dropoffMarker) dropoffMarker.setMap(null);
            if (dropoffLocation) {
                dropoffMarker = new google.maps.Marker({
                    position: dropoffLocation,
                    map: map,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 10,
                        fillColor: '#ef4444',
                        fillOpacity: 1,
                        strokeColor: '#fff',
                        strokeWeight: 3
                    }
                });
            }
        }

        function calculateRoute() {
            if (!pickupLocation || !dropoffLocation) return;

            directionsService.route({
                origin: pickupLocation,
                destination: dropoffLocation,
                travelMode: google.maps.TravelMode.DRIVING
            }, (response, status) => {
                if (status === 'OK') {
                    directionsRenderer.setDirections(response);
                    const route = response.routes[0].legs[0];
                    const distanceKm = route.distance.value / 1000;
                    const price = Math.round(distanceKm * 5 + 12); // База 12 шек + 5 за км
                    const cashback = Math.round(price * 0.05);

                    document.getElementById('priceEstimate').style.display = 'flex';
                    document.getElementById('priceValue').textContent = '₪' + price;
                    document.getElementById('distanceText').textContent = distanceKm.toFixed(1) + ' км';
                    document.getElementById('cashbackBadge').textContent = '+₪' + cashback + ' ' + t('cashback');
                    document.getElementById('orderBtn').disabled = false;
                    document.getElementById('orderBtn').textContent = t('order');
                }
            });
        }

        // ============ ЗАКАЗ ============
        document.getElementById('orderBtn').addEventListener('click', async () => {
            if (!currentUser) {
                document.getElementById('profileModal').classList.add('active');
                return;
            }
            if (!pickupLocation || !dropoffLocation) return;

            const btn = document.getElementById('orderBtn');
            btn.disabled = true;
            btn.textContent = 'Поиск водителя...';

            try {
                const db = window.firebaseDb;
                const { collection, addDoc, serverTimestamp, GeoPoint } = window.firestoreFunctions;

                const orderData = {
                    clientId: currentUser.uid,
                    clientName: currentUser.displayName || currentUser.email,
                    clientPhone: currentUser.phoneNumber || '',
                    pickup: new GeoPoint(pickupLocation.lat(), pickupLocation.lng()),
                    dropoff: new GeoPoint(dropoffLocation.lat(), dropoffLocation.lng()),
                    pickupAddress: document.getElementById('pickupInput').value,
                    dropoffAddress: document.getElementById('dropoffInput').value,
                    status: 'searching',
                    price: parseInt(document.getElementById('priceValue').textContent.replace('₪','')),
                    cashback: Math.round(parseInt(document.getElementById('priceValue').textContent.replace('₪','')) * 0.05),
                    createdAt: serverTimestamp(),
                    driverId: null
                };

                const docRef = await addDoc(collection(db, 'orders'), orderData);
                currentOrderId = docRef.id;
                console.log('✅ Заказ создан:', currentOrderId);

                startDriverTracking();
            } catch (error) {
                console.error('❌ Ошибка заказа:', error);
                alert('Ошибка при создании заказа');
            }
        });

        // ============ ОТСЛЕЖИВАНИЕ ВОДИТЕЛЯ ============
        function startDriverTracking() {
            document.getElementById('driverTracker').classList.add('active');
            
            driverTrackingInterval = setInterval(async () => {
                if (!currentOrderId) return;
                
                try {
                    const db = window.firebaseDb;
                    const { doc, getDoc } = window.firestoreFunctions;
                    
                    const orderDoc = await getDoc(doc(db, 'orders', currentOrderId));
                    if (!orderDoc.exists()) return;
                    
                    const order = orderDoc.data();
                    
                    if (order.status === 'accepted' || order.status === 'arrived' || order.status === 'in_progress') {
                        if (order.driverId) {
                            const driverDoc = await getDoc(doc(db, 'drivers', order.driverId));
                            if (driverDoc.exists()) {
                                const driver = driverDoc.data();
                                document.getElementById('trackingDriverName').textContent = driver.fullName || 'Водитель';
                                document.getElementById('trackingDriverCar').textContent = driver.carModel + ' • ' + driver.carNumber;
                                
                                // Обновить маркер водителя на карте
                                if (driver.lat && driver.lng) {
                                    const driverPos = new google.maps.LatLng(driver.lat, driver.lng);
                                    if (!window.driverMarker) {
                                        window.driverMarker = new google.maps.Marker({
                                            position: driverPos,
                                            map: map,
                                            icon: '🚖',
                                            title: driver.fullName
                                        });
                                    } else {
                                        window.driverMarker.setPosition(driverPos);
                                    }
                                    map.panTo(driverPos);
                                }
                            }
                        }
                    }
                    
                    if (order.status === 'completed') {
                        clearInterval(driverTrackingInterval);
                        document.getElementById('driverTracker').classList.remove('active');
                        document.getElementById('orderBtn').disabled = false;
                        document.getElementById('orderBtn').textContent = t('order');
                        currentOrderId = null;
                    }
                } catch (e) {
                    console.error('Tracking error:', e);
                }
            }, 3000);
        }

        // ============ АВТОРИЗАЦИЯ ============
        const { onAuthStateChanged, signOut } = window.authFunctions;
        
        onAuthStateChanged(window.firebaseAuth, async (user) => {
            currentUser = user;
            const profileBtn = document.getElementById('profileBtn');
            
            if (user) {
                profileBtn.textContent = user.email?.charAt(0).toUpperCase() || 'U';
                profileBtn.style.background = 'linear-gradient(135deg, #4ade80, #22c55e)';
                
                // Загрузить профиль из Firestore
                const { doc, getDoc } = window.firestoreFunctions;
                const userDoc = await getDoc(doc(window.firebaseDb, 'users', user.uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (userData.totalCashback) {
                        document.getElementById('totalCashback').textContent = '₪' + userData.totalCashback;
                    }
                }
            } else {
                profileBtn.textContent = '👤';
                profileBtn.style.background = 'linear-gradient(135deg, #ffb000, #ff6a00)';
            }
        });

        // ============ МОДАЛКИ ============
        document.getElementById('profileBtn').addEventListener('click', () => {
            if (currentUser) {
                // Показать профиль или выйти
                if (confirm('Выйти из аккаунта?')) {
                    signOut(window.firebaseAuth);
                }
            } else {
                document.getElementById('profileModal').classList.add('active');
            }
        });

        document.getElementById('closeProfile').addEventListener('click', () => {
            document.getElementById('profileModal').classList.remove('active');
        });

        document.getElementById('historyBtn').addEventListener('click', async () => {
            document.getElementById('historyModal').classList.add('active');
            if (currentUser) {
                await loadRideHistory();
            }
        });

        document.getElementById('closeHistory').addEventListener('click', () => {
            document.getElementById('historyModal').classList.remove('active');
        });

        // Табы логин/регистрация
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                document.getElementById('loginTab').style.display = tab === 'login' ? 'block' : 'none';
                document.getElementById('registerTab').style.display = tab === 'register' ? 'block' : 'none';
            });
        });

        // Регистрация
        document.getElementById('registerSubmit').addEventListener('click', async () => {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;

            if (!name || !email || !password) return alert('Заполните все поля');

            try {
                const { createUserWithEmailAndPassword } = window.authFunctions;
                const userCredential = await createUserWithEmailAndPassword(window.firebaseAuth, email, password);
                const user = userCredential.user;

                // Сохранить профиль
                const { doc, setDoc } = window.firestoreFunctions;
                await setDoc(doc(window.firebaseDb, 'users', user.uid), {
                    name, email, phone,
                    role: 'client',
                    totalCashback: 0,
                    cashbackAvailable: 0,
                    cashbackUnlockDate: new Date(Date.now() + 8 * 30 * 24 * 60 * 60 * 1000), // +8 месяцев
                    createdAt: new Date()
                });

                document.getElementById('profileModal').classList.remove('active');
                alert('Регистрация успешна!');
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        });

        // Вход
        document.getElementById('loginSubmit').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) return;

            try {
                const { signInWithEmailAndPassword } = window.authFunctions;
                await signInWithEmailAndPassword(window.firebaseAuth, email, password);
                document.getElementById('profileModal').classList.remove('active');
            } catch (error) {
                alert('Ошибка входа: ' + error.message);
            }
        });

        // ============ ИСТОРИЯ ПОЕЗДОК ============
        async function loadRideHistory() {
            if (!currentUser) return;
            
            try {
                const db = window.firebaseDb;
                const { collection, query, where, orderBy, limit, getDocs } = window.firestoreFunctions;
                
                const q = query(
                    collection(db, 'orders'),
                    where('clientId', '==', currentUser.uid),
                    orderBy('createdAt', 'desc'),
                    limit(20)
                );
                
                const snapshot = await getDocs(q);
                const ridesList = document.getElementById('ridesList');
                
                if (snapshot.empty) {
                    ridesList.innerHTML = '<p style="color:#667788;">' + t('noRides') + '</p>';
                    return;
                }

                ridesList.innerHTML = '';
                snapshot.forEach(doc => {
                    const ride = doc.data();
                    const date = ride.createdAt?.toDate?.() || new Date();
                    ridesList.innerHTML += `
                        <div class="ride-item">
                            <div class="ride-route">📍 ${ride.pickupAddress || '—'}</div>
                            <div class="ride-route">🎯 ${ride.dropoffAddress || '—'}</div>
                            <div class="ride-details">
                                <span>${date.toLocaleDateString()}</span>
                                <span class="ride-price">₪${ride.price || 0}</span>
                                <span style="color:#4ade80;">+₪${ride.cashback || 0}</span>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error('History error:', e);
            }
        }

        // ============ ЯЗЫКИ ============
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLang = btn.dataset.lang;
                localStorage.setItem('wheel_lang', currentLang);
                document.getElementById('pickupInput').placeholder = t('pickup');
                document.getElementById('dropoffInput').placeholder = t('dropoff');
                document.getElementById('orderBtn').textContent = t('order');
            });
        });

        // Загрузка языка
        const savedLang = localStorage.getItem('wheel_lang');
        if (savedLang && i18n[savedLang]) {
            currentLang = savedLang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-btn[data-lang="${savedLang}"]`)?.classList.add('active');
        }

        // ============ ЗАПУСК ============
        window.addEventListener('load', () => {
            initMap();
            document.getElementById('pickupInput').placeholder = t('pickup');
            document.getElementById('dropoffInput').placeholder = t('dropoff');
            document.getElementById('orderBtn').textContent = t('order');
        });
    </script>
</body>
</html>
