<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚕 Клиент – Заказ такси</title>
  
  <!-- ===== LEAFLET (бесплатная карта) ===== -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- ===== FIREBASE ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
      color: #1b2a3a;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin: 15px 0;
    }
    .hidden { display: none !important; }
    
    /* ===== НАВИГАЦИЯ ===== */
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
    }
    .nav a { text-decoration: none; color: #007bff; font-weight: 600; }
    .nav .logout-btn { background: #dc3545; color: white; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .nav .logout-btn:hover { background: #c82333; }
    #user-email { margin-left: auto; color: #555; font-size: 14px; }
    
    h1 { margin: 0 0 10px 0; font-weight: 600; }
    
    /* ===== ФОРМА ===== */
    .flex-row { display: flex; gap: 25px; flex-wrap: wrap; }
    .flex-col { flex: 1; min-width: 300px; }
    label { font-weight: 600; display: block; margin-top: 12px; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 6px;
    }
    input:focus { outline: 2px solid #007bff; border-color: transparent; }
    
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      margin: 6px 0;
    }
    .btn-primary { background: #007bff; color: white; }
    .btn-primary:hover { background: #0056b3; }
    .btn-success { background: #28a745; color: white; }
    .btn-success:hover { background: #218838; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-danger:hover { background: #c82333; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-waze { background: #33b5e5; color: white; }
    .btn-waze:hover { background: #1a8fc4; }
    
    .btn-row { display: flex; gap: 10px; }
    .btn-row .btn { width: auto; flex: 1; }
    
    /* ===== КАРТА ===== */
    #map {
      height: 450px;
      width: 100%;
      border-radius: 12px;
      background: #e9ecef;
      margin-top: 8px;
    }
    .map-hint {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
    }
    .map-hint .hint-item { display: flex; align-items: center; gap: 5px; }
    
    /* ===== СТАТУС ===== */
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-searching { background: #ffc107; color: #212529; }
    .status-offering { background: #17a2b8; color: white; }
    .status-accepted { background: #28a745; color: white; }
    .status-completed { background: #6c757d; color: white; }
    .status-cancelled { background: #dc3545; color: white; }
    .status-waiting { background: #ffc107; color: #212529; }
    
    .order-status-card {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 12px;
      margin-top: 15px;
    }
    
    .driver-info {
      background: #d4edda;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
    }
    
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    
    .gps-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      margin-right: 10px;
    }
    .gps-btn:hover { background: #218838; }
    
    .location-status { font-size: 13px; color: #555; }
    .location-found { color: #28a745; font-weight: 600; }
    .location-error { color: #dc3545; font-weight: 600; }
    
    .route-error { color: #dc3545; font-size: 13px; margin-top: 5px; }
    
    /* ===== КАСТОМНЫЕ МАРКЕРЫ ДЛЯ КАРТЫ ===== */
    .custom-marker {
      font-size: 28px;
      text-align: center;
      line-height: 30px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Навигация -->
  <div class="nav">
    <a href="index.html">🏠 Главная</a>
    <a href="client.html">🚕 Клиент</a>
    <button class="logout-btn" onclick="signOut()">🚪 Выйти</button>
    <span id="user-email"></span>
  </div>

  <h1>🚕 Заказ такси</h1>

  <!-- Основная карточка -->
  <div class="card">
    <div class="flex-row">
      <!-- Левая колонка: форма -->
      <div class="flex-col">
        <!-- Поле ввода адреса -->
        <label>🏁 Куда поедем?</label>
        <input type="text" id="address" placeholder="Введите адрес назначения (например: Тель-Авив, ул. Алленби 1)" value="">
        
        <!-- Скрытые координаты -->
        <input type="hidden" id="dest-lat" value="">
        <input type="hidden" id="dest-lng" value="">

        <!-- Статус поиска -->
        <div id="search-status" style="font-size:14px; color:#555; margin:5px 0;"></div>
        <div id="route-error" class="route-error"></div>

        <!-- Кнопки -->
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="searchAddress()" style="flex:1;">🔍 Найти адрес</button>
          <button class="btn btn-primary" onclick="createOrder()" style="flex:2;">🚖 Заказать такси</button>
        </div>
        <div id="order-status-message" style="margin-top:10px; font-weight:600;"></div>
      </div>

      <!-- Правая колонка: карта -->
      <div class="flex-col">
        <div id="map"></div>
        <div class="map-hint">
          <span class="hint-item">📍 <span id="map-hint">Вы здесь (определяется автоматически)</span></span>
          <span class="hint-item">🚗 Зелёные машины – свободные такси</span>
          <span class="hint-item">🏁 Флаг – ваша точка назначения</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Статус заказа -->
  <div id="order-status-card" class="card hidden">
    <h3>📋 Ваш заказ</h3>
    <div id="order-details"></div>
    <div id="driver-info" class="driver-info hidden">
      <strong>🚗 Водитель:</strong> <span id="driver-name-display"></span><br>
      <strong>📞 Телефон:</strong> <span id="driver-phone-display"></span><br>
      <strong>🚘 Авто:</strong> <span id="driver-car-display"></span>
    </div>
    <div class="action-buttons">
      <button class="btn btn-danger" id="cancel-btn" onclick="cancelOrder()" style="width:auto;">❌ Отменить заказ</button>
      <button class="btn btn-waze" id="waze-btn" onclick="openWaze()" style="display:none; width:auto;">🗺️ Маршрут в Waze</button>
    </div>
  </div>
</div>

<script>
  // ==================== КОНФИГ FIREBASE ====================
  const firebaseConfig = {
    apiKey: "AIzaSyAvBSAWuyLPT2fsSrsDF30LHBqV7cWTvC4",
    authDomain: "taxi-ai-app-69628.firebaseapp.com",
    projectId: "taxi-ai-app-69628",
    storageBucket: "taxi-ai-app-69628.firebasestorage.app",
    messagingSenderId: "952357992434",
    appId: "1:952357992434:web:ec905a7016c3d4f1049d6b"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
  let currentUser = null;
  let map = null;
  let clientMarker = null;
  let destMarker = null;
  let taxiMarkers = [];
  let routeLine = null;
  let currentOrderId = null;
  let orderUnsubscribe = null;
  let driverUnsubscribe = null;
  let taxiUnsubscribe = null;
  
  let clientLat = null;
  let clientLng = null;
  let destLat = null;
  let destLng = null;
  let destAddress = '';
  let mapInitialized = false;

  // ==================== АУТЕНТИФИКАЦИЯ ====================
  auth.onAuthStateChanged(async function(user) {
    if (user) {
      currentUser = user;
      document.getElementById('user-email').textContent = '👤 ' + user.email;
      await loadUserData();
      listenClientOrder();
      setTimeout(initMap, 500);
      setTimeout(() => getMyLocation(), 1000);
      listenTaxiDrivers();
    } else {
      const session = localStorage.getItem('clientSession');
      if (session) {
        try {
          const data = JSON.parse(session);
          document.getElementById('user-email').textContent = '👤 ' + (data.name || 'Клиент');
          await loadUserData();
          listenClientOrder();
          setTimeout(initMap, 500);
          setTimeout(() => getMyLocation(), 1000);
          listenTaxiDrivers();
        } catch(e) {
          window.location.href = 'index.html';
        }
      } else {
        window.location.href = 'index.html';
      }
    }
  });

  function loadUserData() {
    if (!currentUser) return Promise.resolve();
    return db.collection('users').doc(currentUser.uid).get()
      .then(doc => {
        if (!doc.exists) {
          return db.collection('users').doc(currentUser.uid).set({
            email: currentUser.email,
            name: 'Клиент',
            role: 'client',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      })
      .catch(e => console.error('Ошибка загрузки данных:', e));
  }

  function signOut() {
    auth.signOut().then(() => {
      localStorage.removeItem('clientSession');
      window.location.href = 'index.html';
    });
  }

  // ==================== КАРТА (LEAFLET) ====================
  function initMap() {
    if (mapInitialized) return;
    const mapElement = document.getElementById('map');
    if (!mapElement) return;

    try {
      // Создаём карту
      map = L.map(mapElement).setView([31.5, 34.8], 8);
      
      // Добавляем тайлы OpenStreetMap
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // ===== МАРКЕР КЛИЕНТА =====
      const clientIcon = L.divIcon({
        html: '📍',
        className: 'custom-marker',
        iconSize: [30, 30],
        iconAnchor: [15, 30]
      });
      clientMarker = L.marker([31.5, 34.8], { icon: clientIcon });
      clientMarker.bindPopup('📍 Вы здесь');

      // ===== МАРКЕР НАЗНАЧЕНИЯ =====
      const destIcon = L.divIcon({
        html: '🏁',
        className: 'custom-marker',
        iconSize: [30, 30],
        iconAnchor: [15, 30]
      });
      destMarker = L.marker([31.5, 34.8], { icon: destIcon });
      destMarker.bindPopup('🏁 Пункт назначения');

      mapInitialized = true;
      console.log('🗺️ Карта инициализирована');

      // Если уже есть координаты клиента – показываем
      if (clientLat && clientLng) {
        updateClientMarker(clientLat, clientLng);
      }

    } catch (error) {
      console.error('❌ Ошибка карты:', error);
    }
  }

  // ==================== ОБНОВЛЕНИЕ МАРКЕРА КЛИЕНТА ====================
  function updateClientMarker(lat, lng) {
    if (!map || !clientMarker) return;
    clientMarker.setLatLng([lat, lng]);
    if (!map.hasLayer(clientMarker)) clientMarker.addTo(map);
    map.setView([lat, lng], 14);
    document.getElementById('map-hint').textContent = `📍 Вы здесь (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
  }

  // ==================== ОБНОВЛЕНИЕ МАРКЕРА НАЗНАЧЕНИЯ ====================
  function updateDestMarker(lat, lng) {
    if (!map || !destMarker) return;
    destMarker.setLatLng([lat, lng]);
    if (!map.hasLayer(destMarker)) destMarker.addTo(map);
  }

  // ==================== ПОКАЗАТЬ СВОБОДНЫЕ ТАКСИ ====================
  function updateTaxiMarkers(drivers) {
    // Удаляем старые маркеры
    taxiMarkers.forEach(m => {
      if (map && map.hasLayer(m)) map.removeLayer(m);
    });
    taxiMarkers = [];

    if (!map) return;

    const taxiIcon = L.divIcon({
      html: '🚗',
      className: 'custom-marker',
      iconSize: [25, 25],
      iconAnchor: [12, 25]
    });

    drivers.forEach(driver => {
      if (driver.lat && driver.lng) {
        const marker = L.marker([driver.lat, driver.lng], { icon: taxiIcon });
        marker.bindPopup(`🚗 Свободное такси<br>👤 ${driver.fullName || 'Водитель'}`);
        marker.addTo(map);
        taxiMarkers.push(marker);
      }
    });

    console.log(`🚗 Показано ${taxiMarkers.length} свободных такси`);
  }

  // ==================== СЛУШАЕМ СВОБОДНЫЕ ТАКСИ ====================
  function listenTaxiDrivers() {
    if (taxiUnsubscribe) taxiUnsubscribe();

    taxiUnsubscribe = db.collection('drivers')
      .where('role', '==', 'driver')
      .where('available', '==', true)
      .onSnapshot(snapshot => {
        const drivers = [];
        snapshot.forEach(doc => {
          drivers.push(doc.data());
        });
        updateTaxiMarkers(drivers);
      }, error => console.error('Ошибка прослушки такси:', error));
  }

  // ==================== GPS ====================
  function getMyLocation() {
    const statusEl = document.getElementById('location-status');
    if (!statusEl) return;
    
    statusEl.textContent = '⏳ Определение...';
    statusEl.className = 'location-status';
    
    if (!navigator.geolocation) {
      statusEl.textContent = '❌ GPS не поддерживается';
      statusEl.className = 'location-status location-error';
      return;
    }
    
    navigator.geolocation.getCurrentPosition(
      pos => {
        clientLat = pos.coords.latitude;
        clientLng = pos.coords.longitude;
        updateClientMarker(clientLat, clientLng);
        
        statusEl.textContent = `✅ ${clientLat.toFixed(4)}, ${clientLng.toFixed(4)}`;
        statusEl.className = 'location-status location-found';
        
        // Если есть адрес назначения – строим маршрут
        if (destLat && destLng) {
          buildRoute();
        }
      },
      err => {
        let msg = '❌ Ошибка GPS: ';
        if (err.code === 1) msg += 'Разрешите доступ';
        else if (err.code === 2) msg += 'Не удалось определить';
        else if (err.code === 3) msg += 'Превышено время';
        else msg += err.message;
        statusEl.textContent = msg;
        statusEl.className = 'location-status location-error';
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  // ==================== ПОИСК АДРЕСА (NOMINATIM) ====================
  function searchAddress() {
    const address = document.getElementById('address').value.trim();
    if (!address) {
      document.getElementById('search-status').textContent = '⚠️ Введите адрес';
      document.getElementById('search-status').style.color = '#dc3545';
      return;
    }

    document.getElementById('search-status').textContent = '⏳ Поиск...';
    document.getElementById('search-status').style.color = '#555';

    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&limit=1&addressdetails=1`;

    fetch(url)
      .then(response => response.json())
      .then(data => {
        if (data && data.length > 0) {
          destLat = parseFloat(data[0].lat);
          destLng = parseFloat(data[0].lon);
          destAddress = data[0].display_name;

          document.getElementById('dest-lat').value = destLat;
          document.getElementById('dest-lng').value = destLng;
          document.getElementById('search-status').textContent = `✅ Найдено: ${destAddress}`;
          document.getElementById('search-status').style.color = '#28a745';
          
          updateDestMarker(destLat, destLng);
          
          // Если есть координаты клиента – строим маршрут
          if (clientLat && clientLng) {
            buildRoute();
          } else {
            document.getElementById('route-error').textContent = '⏳ Ожидание определения вашего местоположения...';
          }
        } else {
          document.getElementById('search-status').textContent = '❌ Адрес не найден';
          document.getElementById('search-status').style.color = '#dc3545';
        }
      })
      .catch(error => {
        document.getElementById('search-status').textContent = '❌ Ошибка: ' + error.message;
        document.getElementById('search-status').style.color = '#dc3545';
        console.error('❌ Ошибка геокодирования:', error);
      });
  }

  // ==================== ПОСТРОЕНИЕ МАРШРУТА (OSRM) ====================
  function buildRoute() {
    if (!clientLat || !clientLng || !destLat || !destLng) {
      return;
    }

    const url = `https://router.project-osrm.org/route/v1/driving/${clientLng},${clientLat};${destLng},${destLat}?overview=full&geometries=geojson`;

    fetch(url)
      .then(response => response.json())
      .then(data => {
        if (routeLine && map) map.removeLayer(routeLine);
        routeLine = null;

        if (data && data.routes && data.routes.length > 0) {
          const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          routeLine = L.polyline(coords, { color: 'blue', weight: 4, opacity: 0.8 });
          if (map) {
            routeLine.addTo(map);
            map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
          }
          document.getElementById('route-error').textContent = '';
          console.log('✅ Маршрут построен');
        } else {
          document.getElementById('route-error').textContent = '⚠️ Не удалось построить маршрут';
        }
      })
      .catch(error => {
        document.getElementById('route-error').textContent = '❌ Ошибка маршрута: ' + error.message;
        console.error('❌ Ошибка OSRM:', error);
      });
  }

  // ==================== СОЗДАНИЕ ЗАКАЗА ====================
  function createOrder() {
    const address = document.getElementById('address').value.trim();
    const destLat = parseFloat(document.getElementById('dest-lat').value);
    const destLng = parseFloat(document.getElementById('dest-lng').value);

    if (!address) {
      alert('⚠️ Введите адрес назначения');
      return;
    }
    if (isNaN(destLat) || isNaN(destLng)) {
      alert('⚠️ Сначала найдите адрес (кнопка "Найти адрес")');
      return;
    }
    if (!clientLat || !clientLng) {
      alert('⚠️ Не удалось определить ваше местоположение');
      return;
    }

    // Расчёт расстояния
    const distance = getDistance(clientLat, clientLng, destLat, destLng);
    const price = calculatePrice(distance);

    let clientName = 'Клиент';
    const session = localStorage.getItem('clientSession');
    if (session) { try { clientName = JSON.parse(session).name || 'Клиент'; } catch(e) {} }

    const orderData = {
      clientId: currentUser ? currentUser.uid : 'guest-' + Date.now(),
      clientName: clientName,
      clientLat: clientLat,
      clientLng: clientLng,
      address: address,
      destLat: destLat,
      destLng: destLng,
      distance: distance,
      price: price,
      status: 'searching',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      aiNote: 'Поиск ближайших водителей...'
    };

    db.collection('orders').add(orderData)
      .then(docRef => {
        currentOrderId = docRef.id;
        document.getElementById('order-status-message').innerHTML = '✅ Заказ создан! Ищем водителей...';
        document.getElementById('order-status-card').classList.remove('hidden');
        return findAndOfferDrivers(docRef.id, clientLat, clientLng);
      })
      .then(() => {
        document.getElementById('order-status-message').innerHTML = '📨 Предложение отправлено водителям';
      })
      .catch(error => {
        alert('❌ Ошибка: ' + error.message);
        console.error('❌ Ошибка создания заказа:', error);
      });
  }

  // ==================== ИИ-ДИСПЕТЧЕР ====================
  async function findAndOfferDrivers(orderId, fromLat, fromLng) {
    const MAX_DRIVERS = 5;
    const OFFER_TIMEOUT = 60;

    try {
      const snapshot = await db.collection('drivers')
        .where('role', '==', 'driver')
        .where('available', '==', true)
        .get();

      if (snapshot.empty) {
        await db.collection('orders').doc(orderId).update({
          status: 'waiting',
          aiNote: 'Нет свободных водителей'
        });
        return;
      }

      const drivers = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        if (data.lat && data.lng) {
          drivers.push({
            id: doc.id,
            data: data,
            distance: getDistance(fromLat, fromLng, data.lat, data.lng)
          });
        }
      });

      drivers.sort((a, b) => a.distance - b.distance);
      const nearest = drivers.slice(0, MAX_DRIVERS);
      const offeredIds = nearest.map(d => d.id);

      await db.collection('orders').doc(orderId).update({
        status: 'offering',
        offeredTo: offeredIds,
        offerExpiresAt: new Date(Date.now() + OFFER_TIMEOUT * 1000),
        aiNote: `Предложено ${offeredIds.length} водителям`
      });

      setTimeout(() => checkOfferExpired(orderId), OFFER_TIMEOUT * 1000);
    } catch (error) {
      console.error('❌ Ошибка ИИ-диспетчера:', error);
    }
  }

  async function checkOfferExpired(orderId) {
    try {
      const doc = await db.collection('orders').doc(orderId).get();
      if (!doc.exists) return;
      const data = doc.data();
      if (data.status !== 'offering') return;
      if (new Date() > data.offerExpiresAt.toDate()) {
        await db.collection('orders').doc(orderId).update({
          status: 'waiting',
          aiNote: 'Время на принятие истекло'
        });
      }
    } catch (error) {
      console.error('❌ Ошибка проверки:', error);
    }
  }

  // ==================== СЛУШАЕМ ЗАКАЗ ====================
  function listenClientOrder() {
    if (orderUnsubscribe) orderUnsubscribe();

    const clientId = currentUser ? currentUser.uid : 'guest-' + Date.now();

    orderUnsubscribe = db.collection('orders')
      .where('clientId', '==', clientId)
      .orderBy('createdAt', 'desc')
      .limit(1)
      .onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
          if (change.type === 'added' || change.type === 'modified') {
            const data = change.doc.data();
            const orderId = change.doc.id;
            currentOrderId = orderId;
            updateOrderUI(orderId, data);
          }
        });
      }, error => console.error('❌ Ошибка прослушки заказа:', error));
  }

  // ==================== ОБНОВЛЕНИЕ UI ЗАКАЗА ====================
  function updateOrderUI(orderId, data) {
    document.getElementById('order-status-card').classList.remove('hidden');

    const statusMap = {
      'searching': '🔍 Поиск водителей...',
      'offering': '📨 Предложение водителям',
      'accepted': '🟢 Водитель едет к вам!',
      'completed': '✅ Заказ завершён',
      'cancelled': '❌ Отменён',
      'waiting': '⏳ Ожидание водителя'
    };

    let html = `
      <div class="order-status-card">
        <div><strong>🏁 Куда:</strong> ${data.address || '—'}</div>
        <div><strong>📏 Дистанция:</strong> ${(data.distance || 0).toFixed(1)} км</div>
        <div><strong>💰 Цена:</strong> ${data.price || 0} ₪</div>
        <div><strong>📌 Статус:</strong> <span class="status-badge status-${data.status}">${statusMap[data.status] || data.status}</span></div>
        <div><strong>🧠 ИИ:</strong> ${data.aiNote || '—'}</div>
      </div>
    `;

    document.getElementById('order-details').innerHTML = html;

    const cancelBtn = document.getElementById('cancel-btn');
    if (['searching', 'offering', 'created', 'waiting'].includes(data.status)) {
      cancelBtn.style.display = 'inline-block';
    } else {
      cancelBtn.style.display = 'none';
    }

    // Информация о водителе
    const driverInfo = document.getElementById('driver-info');
    if (data.driverId && data.status === 'accepted') {
      driverInfo.classList.remove('hidden');
      document.getElementById('driver-name-display').textContent = data.driverName || '—';
      document.getElementById('driver-phone-display').textContent = data.driverPhone || '—';
      document.getElementById('driver-car-display').textContent = data.driverCar || '—';
      document.getElementById('waze-btn').style.display = 'inline-block';
    } else {
      driverInfo.classList.add('hidden');
      document.getElementById('waze-btn').style.display = 'none';
    }
  }

  // ==================== ОТМЕНА ЗАКАЗА ====================
  function cancelOrder() {
    if (!currentOrderId) { alert('Нет активного заказа'); return; }
    if (!confirm('⚠️ Отменить заказ?')) return;
    db.collection('orders').doc(currentOrderId).update({
      status: 'cancelled',
      aiNote: 'Отменён клиентом'
    })
    .then(() => {
      alert('✅ Заказ отменён');
      document.getElementById('cancel-btn').style.display = 'none';
    })
    .catch(e => alert('❌ Ошибка: ' + e.message));
  }

  // ==================== ОТКРЫТИЕ WAZE ====================
  function openWaze() {
    if (!clientLat || !clientLng) {
      alert('⚠️ Нет координат');
      return;
    }
    const url = `https://waze.com/ul?ll=${clientLat},${clientLng}&navigate=yes`;
    window.open(url, '_blank');
  }

  // ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
  function getDistance(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function calculatePrice(distanceKm) {
    const BASE = 12.46;
    const RATE = 1.95;
    return Math.round((BASE + (distanceKm * RATE)) * 100) / 100;
  }

  // ==================== ОБРАБОТЧИК ENTER ====================
  document.getElementById('address').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      searchAddress();
    }
  });

  console.log('🚕 Клиент с картой загружен');
</script>
</body>
